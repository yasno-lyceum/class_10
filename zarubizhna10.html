<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зарубіжна література · 10 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}

ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}

.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}

.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}

.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}

.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>

{info:`<p><b>Художня література</b> — вид мистецтва, у якому образи створюються словом. Вона зберігає пам'ять людства, формує світогляд, цінності, уміння співчувати й розуміти інших.</p>
<h4>Значення літератури для людини XXI ст.</h4>
<ul><li><b>пізнавальне</b> — розповідає про інші епохи, народи, культури;</li><li><b>виховне</b> — формує моральні орієнтири, вчить розрізняти добро і зло;</li><li><b>естетичне</b> — розвиває смак, відчуття краси слова;</li><li><b>комунікативне</b> — об'єднує людей різних країн і часів у «діалог культур»;</li><li><b>терапевтичне</b> — допомагає зрозуміти себе, пережити труднощі.</li></ul>
<h4>Оригінальна й перекладна література</h4>
<p><b>Оригінал</b> — твір мовою, якою його написав автор. <b>Переклад</b> — відтворення твору іншою мовою. Завдяки перекладам світова література стає надбанням кожного народу.</p>
<ul><li><b>Художній переклад</b> — творче відтворення змісту, образів, стилю, ритму оригіналу.</li><li><b>Переспів</b> — вільне відтворення твору зі значними змінами.</li><li><b>Інтерпретація</b> — тлумачення твору перекладачем, режисером, художником, читачем.</li></ul>
<p>Видатні українські перекладачі: Борис Тен («Одіссея»), Євген Дроб'язко й Максим Стріха («Божественна комедія»), Григорій Кочур («Гамлет», Верлен, Рембо), Микола Лукаш («Фауст» — визнаний одним із найкращих перекладів у світі), Дмитро Павличко (Бодлер), Ростислав Доценко («Портрет Доріана Грея»).</p>
<p>Перекладна література відіграла величезну роль в українському націєтворенні XIX ст.: переклади Біблії, Шекспіра, Гомера доводили повноцінність української мови навіть тоді, коли друк українською забороняли (Валуєвський циркуляр 1863 р., Емський указ 1876 р.).</p>
<p>У 10 класі ми простежимо шлях літератури від античності (Гомер) через Відродження (Данте, Шекспір), романтизм і реалізм XIX ст. (Гофман, Вітмен, Стендаль, Гоголь, Вайльд) до модернізму (Бодлер, Верлен, Рембо, Метерлінк) і сучасної прози (Ґейман, Яґелло).</p>`,

{info:`<p><b>Гомер</b> (VIII ст. до н. е.) — легендарний давньогрецький співець-аед, якому приписують поеми «Іліада» й «Одіссея». За переказами, він був сліпим; за право вважатися його батьківщиною сперечалися сім міст. «Гомерівське питання» — суперечка вчених про те, чи існував Гомер і чи створив обидві поеми.</p>
<p><b>«Одіссея»</b> — героїчна епічна поема з 24 пісень (понад 12 тис. рядків), написана <b>гекзаметром</b> (шестистопним віршем). Сюжет пов'язаний із Троянським циклом міфів: повернення Одіссея додому триває 10 років.</p>

<h4>Побутові елементи</h4>
<p>Детальні описи бенкетів, жертвоприношень, одягу, ремесел, будівництва плоту, землеробства й скотарства; гостинність як священний звичай; життя царського дому, слуг, свинопаса Евмея. Поема — «енциклопедія» життя давніх греків.</p>

// 3 Образ Одіссея
{info:`<p><b>Одіссей</b> — цар острова Ітака, учасник Троянської війни (саме він вигадав троянського коня). На відміну від героїв «Іліади», чия головна сила — фізична доблесть, Одіссей прославлений <b>розумом, винахідливістю та витримкою</b>.</p>
<h4>Риси характеру</h4>
<ul><li><b>Розум і хитрість</b>: назвався «Ніхто» в печері Поліфема й урятувався, прив'язавши супутників під баранів.</li><li><b>Обережність</b>: заліплює воском вуха супутникам і наказує прив'язати себе до щогли, щоб почути Сирен і не загинути.</li><li><b>Витривалість і мужність</b>: долає бурі, чудовиськ, втрату всіх товаришів.</li><li><b>Любов до батьківщини й родини</b>: відмовляється від безсмертя, яке пропонує Каліпсо, заради Ітаки й Пенелопи.</li><li><b>Допитливість</b>: прагне пізнати світ і людей.</li><li><b>Вади</b>: зухвалість (хвалиться перед Поліфемом своїм справжнім ім'ям, чим накликає гнів Посейдона), жорстокість у помсті.</li></ul>
<p>Одіссей — новий тип героя: людина, що покладається передусім на <b>розум</b>. Уславлення розуму й винахідливості — головна ідея поеми. Ім'я героя стало загальною назвою: <b>одіссея</b> — тривала мандрівка, сповнена пригод.</p>
<p><b>Пенелопа</b> — символ подружньої вірності й мудрості: три роки ткала й уночі розпускала саван для свекра, обманюючи женихів.</p>`,

// 6 Божественна комедія: концепція світу й людини
{info:`<p>«Божественна комедія» — синтез середньовічного світогляду й нових, ренесансних ідей.</p>
<h4>Середньовічне</h4>
<ul><li>Християнська картина світу: Земля — центр Всесвіту, над нею — небесні сфери, всередині — Пекло.</li><li>Жанр видіння, алегоричність, числова символіка, мета — спасіння душі.</li></ul>
<h4>Ренесансне</h4>
<ul><li><b>Інтерес до людини</b>, її почуттів, долі: Данте співчуває грішникам (непритомніє після розповіді <b>Франчески да Ріміні</b>).</li><li><b>Свобода волі</b>: людина сама обирає між добром і злом і відповідає за свій вибір.</li><li><b>Прагнення пізнання</b>: Улісс (Одіссей) закликає супутників «не жити, як тварини, а шукати доброчесність і знання».</li><li>Шанування античних поетів (Гомер, Вергілій, Овідій перебувають у Лімбі, а не в муках).</li><li>Рідна, італійська мова замість латини.</li><li>Сміливі оцінки сучасників: у Пеклі є навіть римські папи.</li></ul>
<h4>Алегоричний зміст</h4>

// 7 Гамлет: проблеми
{info:`<p><b>Вільям Шекспір</b> (1564–1616) — англійський драматург і поет доби Відродження. Народився в Стратфорді-на-Ейвоні, працював у Лондоні актором і драматургом театру «Глобус». Створив 37 (за деякими даними 38) п'єс, 154 сонети, поеми. Періоди творчості: оптимістичний (комедії, хроніки), трагічний («Гамлет», «Отелло», «Король Лір», «Макбет»), романтичний.</p>
<p><b>«Гамлет»</b> (бл. 1600–1601) — вершина творчості Шекспіра. Джерело сюжету — середньовічна данська легенда про принца Амлета (Саксон Граматик). Шекспір перетворив історію помсти на <b>філософську трагедію</b>.</p>
<h4>Філософські й моральні проблеми</h4>
<ul><li><b>Сенс людського існування</b> — монолог «Бути чи не бути — ось питання»: змиритися зі злом чи боротися з ним.</li><li><b>Добро і зло</b>: «Данія — в'язниця», «Зламався час» — світ, де панують злочин і лицемірство.</li><li><b>Помста й справедливість</b>: чи має право людина вбивати, щоб відновити справедливість.</li><li><b>Думка і дія</b>: розум, що аналізує, гальмує вчинок.</li><li><b>Криза гуманізму</b>: «Що за витвір — людина!.. А для мене — квінтесенція пороху».</li><li><b>Вірність і зрада</b> (мати, друзі Розенкранц і Гільденстерн), кохання (Офелія).</li><li><b>Життя і смерть</b> (сцена на кладовищі з черепом Йорика).</li></ul>

// 8 Гамлет: художній простір і вічний образ
{info:`<p><b>Художній простір</b> трагедії — замок <b>Ельсінор</b> у Данії. Це замкнений світ, сповнений шпигунства, підслуховування, інтриг: «Данія — в'язниця». Простір розширюється згадками про Віттенберг (світ науки й гуманізму), Норвегію, Англію, Польщу.</p>
<h4>Художні особливості</h4>
<ul><li><b>Сцена в сцені</b> — вистава «Мишоловка», що викриває Клавдія.</li><li>Поєднання <b>трагічного й комічного</b> (могильники, Полоній).</li><li>Мотив <b>божевілля</b>: удаване в Гамлета, справжнє в Офелії.</li><li>Образ <b>Привида</b>; символи — отрута, череп Йорика, театр («Весь світ — театр»).</li><li>Система двійників і антиподів: <b>Лаерт і Фортінбрас</b> теж мстять за батьків, але діють рішуче, не замислюючись.</li><li>Поєднання віршів і прози.</li></ul>
<h4>Вічний образ Гамлета</h4>
<p>Гамлет — <b>вічний образ</b> світової літератури: тип мислителя, що болісно переживає недосконалість світу й сумнівається, перш ніж діяти. Інтерпретації:</p>
<ul><li>слабкий мрійник, нездатний до дії (Ґете);</li><li>гуманіст, що усвідомлює неможливість перемогти зло одним ударом;</li><li>людина сумління, що не хоче стати таким, як убивця.</li></ul>
<p><b>«Гамлетизм»</b> — вагання, роздвоєність, рефлексія. Образ живе в перекладах (Г. Кочур, Л. Гребінка, Ю. Андрухович), постановках (Лесь Курбас, 1925), фільмах (Л. Олів'є, Г. Козінцев, К. Брана).</p>`,

{info:`<p><b>Романтизм</b> — літературний напрям кінця XVIII — першої половини XIX ст. Ознаки: <b>двосвіття</b> (протиставлення буденного й ідеального світів), культ почуттів і уяви, винятковий герой у виняткових обставинах, інтерес до фольклору, фантастики, історії, романтична іронія.</p>
<h4>Німецький романтизм</h4>
<ul><li><b>Ієнські романтики</b> (брати Шлеґелі, Новаліс — образ «блакитної квітки») — теорія романтизму.</li><li><b>Гейдельберзькі романтики</b> (брати Грімм, К. Брентано) — збирання фольклору.</li><li><b>Пізній романтизм</b> — Е. Т. А. Гофман, Г. Гейне; посилення сатири та іронії.</li></ul>
<h4>Ернст Теодор Амадей Гофман (1776–1822)</h4>
<ul><li>Народився в Кенігсберзі; юрист за освітою, а також композитор, диригент, художник-карикатурист. Третє ім'я Вільгельм замінив на <b>Амадей</b> на честь Моцарта.</li><li>Мав «подвійне» життя: удень — чиновник, суддя; уночі — митець.</li><li>Твори: «Золотий горнець», «Лускунчик і Мишачий король», «Крихітка Цахес на прізвисько Цинобер» (1819), «Життєва філософія кота Мура».</li></ul>
<p><b>Особливості творчості:</b> двосвіття, поєднання реального й фантастичного, <b>гротеск</b>, <b>романтична іронія</b>, протиставлення <b>ентузіастів</b> (митців, мрійників) і <b>філістерів</b> (обмежених обивателів).</p>`,

{info:`<p><b>«Крихітка Цахес на прізвисько Цинобер»</b> (1819) — <b>казкова повість</b> (романтична казка для дорослих), у якій Гофман поєднує фантастику й гостру сатиру.</p>

{info:`<h4>Сюжет і композиція</h4>

{info:`<h4>Романтизм у США</h4>
<p>Американський романтизм (кін. XVIII — 1860-ті) утверджував національну самобутність молодої держави: тема природи, «фронтиру», індіанців, свободи, демократії. Представники: Ф. Купер, В. Ірвінг, Е. По, Г. Лонгфелло («Пісня про Гайавату»), Г. Мелвілл («Мобі Дік»), філософи-трансценденталісти Р. Емерсон і Г. Торо.</p>
<h4>Волт Вітмен (1819–1892)</h4>
<ul><li>Народився на острові Лонг-Айленд (штат Нью-Йорк) у фермерській родині; працював друкарем, учителем, журналістом.</li><li>1855 р. власним коштом видав збірку <b>«Листя трави»</b> (12 поезій без імені автора на титулі). Її схвалив Р. Емерсон, а публіка зустріла насторожено.</li><li>Під час Громадянської війни доглядав поранених у шпиталях; присвятив поезії загиблому А. Лінкольну («О Капітане! мій Капітане!»).</li><li>До кінця життя доповнював «Листя трави» (останнє, «смертне» видання 1891–1892 рр.).</li></ul>
<p>Вітмен — «батько американської поезії», творець <b>верлібру</b> в англомовній поезії; його вплив відчутний у творчості поетів XX ст.</p>`,

// 14 Листя трави: тематика, ліричний герой
{info:`<p><b>Назва збірки</b> — символ: трава росте всюди, для всіх однаково, вона невибаглива й вічна. Це образ <b>рівності, демократії та єдності</b> всього живого. «Листя» (leaves) — це ще й аркуші книжки.</p>
<h4>Тематика</h4>
<ul><li><b>Людина і Всесвіт</b> (космізм): «Я вірю, що листок трави не менший за працю зір».</li><li><b>Демократія й рівність</b>: поет оспівує робітників, фермерів, моряків, рабів і президентів.</li><li><b>Америка</b> — країна свободи й праці, «нація націй».</li><li><b>Єдність тіла й душі</b> («Я співаю тіло електричне»).</li><li><b>Життя і смерть</b> як частини вічного кругообігу природи.</li><li><b>Праця</b> («Пісня про сокиру», «Я чую, як співає Америка»).</li></ul>
<h4>Образ ліричного героя</h4>
<p>Ліричний герой «Пісні про себе» — <b>універсальна особистість</b>: він водночас конкретна людина («Волт Вітмен, американець, грубіян, космос») і все людство, вся природа: «Я великий, я вміщаю безліч». Він — демократ, оптиміст, співець свободи, що звертається до кожного читача як до рівного: «Ти, хто б ти не був…».</p>
<h4>Художні особливості</h4>
<ul><li><b>Верлібр</b>, довгі рядки, ритм біблійних псалмів і океанських хвиль.</li><li><b>Каталоги</b> — довгі переліки людей, професій, предметів.</li><li>Анафори, повтори, звертання, розмовна лексика поряд з урочистою.</li></ul>`,

{info:`<p><b>Стендаль</b> (справжнє ім'я — <b>Анрі Марі Бейль</b>, 1783–1842) — французький письменник, один із засновників <b>реалізму</b> й <b>психологічного роману</b>.</p>
<ul><li>Народився в Греноблі; рано втратив матір, ненавидів деспотичного батька й лицемірне виховання.</li><li>Захоплювався Наполеоном: учасник італійського походу, походу на Москву 1812 р.</li><li>Після падіння Наполеона жив в Італії, яку обожнював; згодом — французький консул у Чивітавеккьї.</li><li>Мав понад 100 псевдонімів; «Стендаль» — назва німецького містечка.</li><li>Автор епітафії: «Арріго Бейль, міланець. Писав. Кохав. Жив».</li></ul>
<p><b>Твори:</b> трактат «Про кохання», «Расін і Шекспір» (маніфест нового мистецтва), романи <b>«Червоне і чорне»</b> (1830), «Пармський монастир» (1839), «Люсьєн Левен».</p>
<h4>«Червоне і чорне»</h4>
<p>Підзаголовок — «<b>Хроніка XIX століття</b>». Основа сюжету — реальна кримінальна справа <b>Антуана Берте</b>, сина коваля, що стріляв у колишню коханку, матір своїх учнів, і був страчений 1828 р.</p>
<p><b>Значення назви:</b> червоне — мундир військового (шлях кар'єри за Наполеона, героїзм, пристрасть), чорне — сутана священика (кар'єра за Реставрації, лицемірство); також кольори рулетки — гра з долею; кров і смерть.</p>
<p><b>Дзеркало</b> як принцип: «Роман — це дзеркало, з яким ідеш великим шляхом».</p>`,

// 19 Конфлікт молодої людини та суспільства
{info:`<p>Дія роману відбувається у Франції доби <b>Реставрації</b> (1820-ті): після Наполеона до влади повернулися аристократія та церква; шлях до слави для людини з народу закрито.</p>
<h4>Основний конфлікт</h4>
<p>Конфлікт <b>обдарованої особистості з народу й класового суспільства</b>, яке не дає їй реалізуватися. Жульєн мріє про славу, як Наполеон, але змушений обрати «чорне» — церковну кар'єру й лицемірство.</p>

// 20 Образ Жульєна Сореля
{info:`<p><b>Жульєн Сорель</b> — син теслі (власника лісопилки) з Вер'єра, наймолодший у родині, яку зневажає за грубість. Юнак тендітний, вродливий, з надзвичайною пам'яттю (знає напам'ять латинський Новий Заповіт).</p>
<h4>Риси характеру</h4>
<ul><li><b>Обдарованість</b>, гострий розум, сила волі.</li><li><b>Честолюбство</b> — мрія про славу Наполеона, бажання піднятися над своїм становищем.</li><li><b>Гордість</b> і болісне почуття власної гідності, ненависть до приниження.</li><li><b>Лицемірство</b> як вимушена зброя: «Буду лицеміром, як усі».</li><li><b>Щирість</b>, здатність глибоко кохати, яка проривається крізь маску.</li><li>Схильність діяти за «планом», як на війні (навіть у коханні).</li></ul>
<h4>Еволюція героя</h4>
<p>Від мрійника-наполеоніста — через кар'єризм і гру — до <b>прозріння у в'язниці</b>: Жульєн розуміє марноту честолюбних мрій і цінність справжнього кохання пані де Реналь.</p>
<h4>Соціальне середовище</h4>
<ul><li><b>Пан де Реналь</b> — пихатий провінційний аристократ, що думає про гроші.</li><li><b>Вально</b> — злодійкуватий директор притулку, нувориш.</li><li><b>Маркіз де Ла-Моль</b> — розумний, але зверхній вельможа.</li><li><b>Пані де Реналь</b> — щира, побожна, вірна почуттю; <b>Матильда</b> — романтична, горда, кохає «подвиг».</li></ul>
<p>Стендаль — майстер <b>психологічного аналізу</b>: внутрішні монологи, «діалектика» почуттів героя.</p>`,

// 21 Гоголь «Ніс»
{info:`<p><b>Микола Гоголь</b> (1809–1852) — письменник українського походження, народився в Сорочинцях на Полтавщині. Твори: «Вечори на хуторі біля Диканьки», «Миргород» («Тарас Бульба», «Вій»), «Петербурзькі повісті», комедія «Ревізор», поема «Мертві душі».</p>
<p><b>«Ніс»</b> (1836) — одна з <b>«Петербурзьких повістей»</b> («Невський проспект», «Шинель», «Портрет», «Записки божевільного»). Петербург у Гоголя — місто-примара, де все ілюзорне, а людину цінують за чином.</p>
<h4>Особливості повісті</h4>
<ul><li><b>Фантастика</b> без пояснень: ніс зникає й живе власним життям — абсурд подано як буденність.</li><li><b>Гротеск</b>: Ніс у мундирі статського радника (на три чини вищий за Ковальова) зверхньо говорить із власником.</li><li><b>Сатира</b> на <b>чинопоклоніння</b>: для Ковальова втрата носа — катастрофа насамперед для кар'єри й вигідного шлюбу.</li><li><b>Іронічний оповідач</b>, що дивується абсурдності історії.</li></ul>
<p>Ідея: у суспільстві, де людину визначає чин, вона втрачає власне обличчя; навіть ніс може стати «важливішим» за господаря. Повість — попередниця літератури абсурду XX ст. (Ф. Кафка «Перевтілення»).</p>`,

// 22 Твір-роздум за романом «Червоне і чорне»
{info:`<p><b>Твір-роздум</b> — твір, у якому автор висловлює власну думку щодо проблеми й доводить її аргументами.</p>
<h4>Структура</h4>
<ol><li><b>Теза</b> — головна думка, яку ви доводите.</li><li><b>Аргументи</b> (2–3) — докази з тексту роману: події, вчинки, цитати.</li><li><b>Приклади</b> — з інших творів, історії, життя.</li><li><b>Висновок</b> — підсумок і власне ставлення.</li></ol>
<h4>Орієнтовні теми</h4>
<ul><li>«Червоне» чи «чорне»: вибір Жульєна Сореля.</li><li>Чи можна виправдати кар'єризм Жульєна?</li><li>Перемога чи поразка Жульєна Сореля?</li><li>Пані де Реналь і Матильда де Ла-Моль: два типи кохання.</li><li>Чи актуальний конфлікт роману сьогодні?</li><li>Ціна успіху: роздуми над романом Стендаля.</li></ul>
<h4>Корисні звороти</h4>
<p>«На мою думку…», «Доказом цього є…», «Яскравим прикладом слугує епізод…», «Отже…», «Таким чином, можна зробити висновок…».</p>`,

// 23 Вайльд «Портрет Доріана Грея»
{info:`<p><b>Оскар Вайльд</b> (1854–1900) — англійський (ірландського походження) письменник, драматург, теоретик <b>естетизму</b>. Народився в Дубліні, навчався в Оксфорді; блискучий дотепник, денді. Твори: казки («Щасливий принц», «Зоряний хлопчик», «Соловей і троянда»), комедії («Як важливо бути серйозним»), роман «Портрет Доріана Грея» (1890), «Балада Редінгської в'язниці». 1895 р. засуджений до двох років каторжних робіт; помер у Парижі.</p>
<h4>Естетизм</h4>
<p>Течія кінця XIX ст., що проголошувала <b>культ краси</b> й принцип «<b>мистецтво заради мистецтва</b>»: мистецтво не повинне служити моралі. У <b>передмові</b> до роману — афоризми: «Книжок моральних чи неморальних немає», «Усе мистецтво зовсім марне».</p>
<h4>Проблема краси й моралі</h4>
<ul><li>Доріан обирає красу без моралі — і краса стає маскою, за якою гниє душа.</li><li>Портрет — <b>дзеркало душі</b>, символ сумління.</li><li>Роман фактично <b>спростовує крайній естетизм</b>: краса без добра руйнує людину; гедонізм лорда Генрі веде до злочинів.</li><li>Мотив <b>двійника</b> й «угоди з дияволом» (фаустівський мотив).</li></ul>
<p><b>Жанр</b> — інтелектуальний (філософський) роман з елементами фантастики й готики; багато парадоксів, афоризмів, діалогів-дискусій.</p>`,

<h4>Правила дискусії</h4>
<ul><li>Висловлюйте власну думку й обґрунтовуйте її прикладами з тексту.</li><li>Слухайте опонента, не перебивайте, ставте уточнювальні запитання.</li><li>Критикуйте думку, а не людину.</li><li>Наприкінці підбийте підсумки: у чому дійшли згоди, що залишилося дискусійним.</li></ul>
<h4>Питання для дискусії</h4>
<ol><li>Хто винен у загибелі Доріана: лорд Генрі, Безіл чи сам Доріан?</li><li>Чи можлива краса без моралі? Чи спростовує роман тезу «Усе мистецтво зовсім марне»?</li><li>Що символізує портрет? Чому Доріан не знищив його раніше?</li><li>Чому Доріан жорстоко покинув Сибілу Вейн?</li><li>Чи актуальний роман у добу соцмереж, фільтрів і культу молодості?</li><li>Чи міг Доріан урятувати свою душу?</li></ol>
<h4>Корисні вислови</h4>
<p>«Я погоджуюся з…, але…», «Дозвольте не погодитися…», «Доказом є епізод…», «Як пише автор…».</p>`,

// 25 Модернізм. Бодлер
{info:`<p><b>Модернізм</b> — сукупність напрямів у мистецтві кінця XIX — XX ст., що відмовилися від реалістичного «копіювання» життя й шукали нових форм вираження. Напрями: <b>символізм, імпресіонізм</b>, неоромантизм, згодом експресіонізм, футуризм, сюрреалізм.</p>
<p><b>Символізм</b> — напрям, що прагне через символи осягнути таємну суть світу. <b>Імпресіонізм</b> (від фр. impression — враження) — фіксація миттєвих вражень, відтінків настрою.</p>
<h4>Шарль Бодлер (1821–1867)</h4>
<ul><li>Французький поет, «проклятий поет», предтеча символізму. Народився в Парижі; рано втратив батька, конфліктував з вітчимом.</li><li>Збірка <b>«Квіти зла»</b> (1857) — суд, штраф, заборона шести поезій «за образу суспільної моралі».</li><li>Перекладав Едгара По; автор віршів у прозі «Паризький сплін».</li></ul>
<h4>«Квіти зла»</h4>
<p>Назва — <b>оксиморон</b>: поет шукає красу навіть у потворному й злому. Розділи: «Сплін та ідеал», «Паризькі картини», «Вино», «Квіти зла», «Бунт», «Смерть». <b>Сплін</b> — туга, нудьга, розчарування.</p>
<ul><li><b>«Альбатрос»</b> — символ поета: величний у небі, незграбний і смішний серед натовпу.</li><li><b>«Відповідності»</b> — маніфест символізму: природа — храм символів; запахи, барви й звуки «перегукуються» (<b>синестезія</b>).</li></ul>`,

// 26 Верлен
{info:`<p><b>Поль Верлен</b> (1844–1896) — французький поет, «король поетів» (так його обрали молоді поети 1894 р.). Народився в Меці в родині офіцера. Збірки: «Сатурнічні поеми» (1866), «Галантні свята», «Романси без слів» (1874). Бурхливі стосунки з А. Рембо закінчилися пострілом і в'язницею. Автор книги «Прокляті поети» (1884), що дала назву цілій плеяді митців.</p>
<h4>«Поетичне мистецтво» (1874)</h4>
<p>Віршований маніфест символізму:</p>
<ul><li>«<b>Музика — найперше в слові!</b>» — поезія має бути мелодійною.</li><li>Перевага <b>відтінку</b>, а не барви; недомовленість, «напівтони».</li><li>Відмова від красномовства, «гострот» і надмірного культу рими («Хто скаже, скільки зла від рими?»).</li><li>Вірш має бути легким, як подих вітру.</li></ul>
<h4>«Осіння пісня» (1866, «Сатурнічні поеми»)</h4>
<p>Зразок <b>імпресіоністичної</b> лірики: настрій осіннього смутку переданий через <b>звукопис</b> (протяжні звуки «скрипок осені»), короткі рядки, повтори. Ліричний герой — сумний, самотній; його, «мов мертвий лист», несе злий вітер. Рядки цього вірша 1944 р. стали сигналом для французького Руху Опору.</p>`,

// 27 Рембо
{info:`<p><b>Артюр Рембо</b> (1854–1891) — французький поет-символіст, «геніальний підліток». Народився в Шарлевілі. Усі вірші написав приблизно між 15 і 20 роками, потім покинув літературу, став мандрівником і торговцем в Африці; помер у Марселі в 37 років.</p>
<p>Твори: «П'яний корабель», «Голосівки», «Моя богема», книжки «Сезон у пеклі», «Осяяння». У «<b>Листі ясновидця</b>» (1871) проголосив: поет має стати <b>ясновидцем</b> через «тривалий, безмежний і продуманий розлад усіх почуттів», щоб пізнати невідоме.</p>
<h4>«Голосівки» («Голосні»)</h4>
<p>Сонет, у якому кожному голосному звуку відповідає колір: <b>А — чорне, Е — біле, І — червоне, У — зелене, О — синє</b>. Звуки й кольори породжують образи (мухи, намети, кров, морські хвилі, Сурма Страшного суду, погляд Омеги). Це втілення <b>синестезії</b> й символістської ідеї таємних відповідностей світу.</p>
<h4>«Моя богема» («Моя богема»)</h4>
<p>Сонет про юного поета-мандрівника: діряві кишені, потерте пальто, ночівля просто неба під зорями, рими, складені в дорозі; Муза — супутниця. <b>Ідея</b>: свобода, творчість і поетичне натхнення важливіші за статки. <b>Циганерія (богема)</b> — вільне, безладне життя митців.</p>`,

{info:`<p><b>Моріс Метерлінк</b> (1862–1949) — бельгійський драматург і поет, який писав французькою; теоретик символістського театру. Народився в Генті; юрист за освітою. <b>Нобелівська премія з літератури 1911 р.</b> П'єси: «Сліпі», «Непрохана», «Там, усередині», «Блакитний Птах» (1908). Філософські есе «Скарб смиренних», «Життя бджіл».</p>
<h4>Концепція символістського театру</h4>
<ul><li><b>«Театр смерті»</b> (ранні п'єси): людина безпорадна перед долею й смертю, що невидимо наближається.</li><li><b>«Трагізм повсякденності»</b>: трагедія — не в бурхливих подіях, а в тихому буденному житті, у самому існуванні людини.</li><li><b>«Статичний театр»</b>: мінімум зовнішньої дії, головне — настрій, очікування, внутрішній стан.</li><li><b>«Театр мовчання»</b>: найважливіше — у паузах, недомовленості, «другому діалозі».</li><li>Персонажі — узагальнені, символічні; простір і час умовні.</li></ul>
<p>У «Блакитному Птахові» Метерлінк переходить від песимізму «театру смерті» до <b>оптимізму</b>: людина може знайти щастя й перемогти страх.</p>

// 33 Ґейман «Кораліна»
{info:`<p><b>Ніл Ґейман</b> (нар. 1960) — британський письменник, автор фентезі, коміксів і сценаріїв. Твори: серія коміксів «Пісочна людина» («Sandman»), романи «Американські боги», «Зоряний пил», «Книга кладовища», «Океан у кінці дороги», повість «<b>Кораліна</b>» (2002; премії «Г'юго», «Неб'юла»). За повістю знято анімаційний фільм (Г. Селік, 2009).</p>
<h4>Проблематика повісті</h4>
<ul><li><b>Справжня і фальшива любов</b>: Інша мама «любить» як власниця, що хоче володіти; справжні батьки не ідеальні, але люблять щиро.</li><li><b>Мужність і подолання страху</b>: «Хоробрість — це коли тобі страшно, а ти все одно робиш те, що треба».</li><li><b>Вибір і відповідальність</b>: Кораліна відмовляється від «ідеального» світу заради справжнього.</li><li><b>Дорослішання</b>, самостійність, цінність індивідуальності (Кораліну дратує, що її називають «Керолайн»).</li><li><b>Небезпека спокус</b> — легкого, «солодкого» життя.</li></ul>
<h4>Жанрові особливості</h4>
<p>Повість-казка, <b>фентезі</b> з елементами <b>жахів (горору)</b>; мотив <b>дзеркального, «іншого» світу</b> (як у Л. Керролла «Аліса в Задзеркаллі»); казкові елементи: випробування, чарівні помічники (кіт, камінь із діркою), перемога добра.</p>
<p><b>Символи:</b> ґудзики замість очей — втрата душі, здатності бачити світ по-своєму; двері — межа між світами; ключ — відповідальність.</p>`,

// 34 Яґелло «Кава з кардамоном»
{info:`<p><b>Йоанна Яґелло</b> — польська письменниця, авторка книжок для підлітків, вчителька польської мови. Її повісті мають «кулінарні» назви: «<b>Кава з кардамоном</b>», «Шоколад із чилі», «Тирамісу з полуницями», «Молоко з медом». Українською «Каву з кардамоном» переклала <b>Божена Антоняк</b>.</p>
<h4>Синтез жанрів</h4>
<ul><li><b>Психологічна повість про підлітків</b>: дорослішання, самотність, перше кохання, дружба, конфлікти з батьками.</li><li><b>Детектив</b>: таємниця в основі сюжету, героїня-розслідувачка, збір фактів, увага до деталей, логічні висновки, обов'язкова розв'язка.</li><li><b>Сімейна сага / роман про таємниці минулого</b>: стара фотографія відкриває драму родини.</li><li>Елементи <b>щоденникової, сповідальної прози</b>: події подано очима героїні.</li></ul>
<h4>Проблематика</h4>
<ul><li>батьки й діти, прірва відчуження й нерозуміння;</li><li>сімейні таємниці та їхні наслідки;</li><li>життя дитини з дитячого будинку;</li><li>дружба, кохання, пошук свого місця;</li><li>відповідальність за власні вчинки й уміння пробачати.</li></ul>
<p><b>Кава з кардамоном</b> — символ особливого, «гірко-солодкого» смаку дорослого життя й самої героїні: незвичної, допитливої, чутливої.</p>`,

about:"Поема про десятирічне повернення царя Ітаки Одіссея додому після Троянської війни. Гнів бога моря Посейдона змушує героя блукати світом, але розум, витримка й допомога богині Афіни ведуть його до рідної землі й вірної Пенелопи.",
plot:["Минуло 20 років, відколи Одіссей пішов на війну. На Ітаці в його домі бенкетують женихи, що сватаються до Пенелопи; Телемах вирушає шукати звісток про батька.","Німфа Каліпсо сім років тримає Одіссея на острові; з волі богів вона відпускає його, буря викидає героя до феаків.","На бенкеті в царя Алкіноя Одіссей розповідає про свої мандри: острів лотофагів, печеру циклопа Поліфема, якого він осліпив, назвавшись «Ніхто».","Пригоди тривають: чарівниця Кірка (Цірцея), спуск до Аїду, спів Сирен (Одіссей наказує прив'язати себе до щогли), Скілла й Харибда.","Супутники з'їдають корів бога Геліоса й гинуть; рятується лише Одіссей.","Феаки привозять Одіссея на Ітаку; Афіна перетворює його на старого жебрака. Його впізнають пес Аргус, свинопас Евмей, син Телемах.","Пенелопа влаштовує змагання: хто натягне лук Одіссея й прожене стрілу крізь 12 кілець, той стане її чоловіком. Це вдається лише «жебракові».","Одіссей разом із Телемахом карає женихів; Пенелопа впізнає чоловіка за таємницею їхнього подружнього ложа. На Ітаці відновлено мир."],

divina:{name:"«Божественна комедія»", author:"Данте Аліґ'єрі, 1307–1321; укр. переклади Євгена Дроб'язка, Максима Стріхи", genre:"Поема (середньовічне «видіння»), 3 частини, 100 пісень, терцини",

plotTitle:"Будова й зміст поеми",
plot:["У 35 років (1300 р., на Великдень) Данте заблукав у темному лісі; шлях до сонячного пагорба заступають рись, лев і вовчиця — символи людських вад.","На допомогу приходить тінь римського поета Вергілія — символ розуму; його послала Беатріче.","«Пекло» (34 пісні): лійка з 9 кіл, де кара відповідає гріху; зустрічі з Франческою да Ріміні, Уліссом, графом Уголіно; у центрі — Люцифер.","«Чистилище» (33 пісні): гора з уступами, де душі очищуються від 7 смертних гріхів; на вершині — Земний рай.","У Земному раю Вергілія змінює Беатріче — символ божественної любові й віри.","«Рай» (33 пісні): 9 небесних сфер та Емпірей; останнім провідником стає святий Бернард.","Фінал — споглядання Бога, «Любові, що рухає сонце й зорі».","Числова символіка: 3 частини, по 33 пісні + вступна = 100; терцина — строфа з трьох рядків."],

hamlet:{name:"«Гамлет, принц данський»", author:"Вільям Шекспір, близько 1600–1601; укр. переклад Григорія Кочура (також Л. Гребінки, Ю. Андруховича)", genre:"Трагедія",
about:"Трагедія про данського принца, який дізнається, що його батька вбив рідний брат Клавдій, щоб захопити трон і королеву. Помста перетворюється для Гамлета на філософські роздуми про сенс життя, обов'язок і зло, що панує у світі.",
plot:["В Ельсінорі вартові бачать Привид покійного короля. Принц Гамлет повертається з навчання: батько помер, мати Гертруда за місяць вийшла заміж за його брата Клавдія, нового короля.","Привид відкриває Гамлетові правду: Клавдій отруїв його, влив у вухо отруту. Гамлет присягає помститися.","Гамлет удає божевілля; Полоній вважає, що причина — кохання до його доньки Офелії. Монолог «Бути чи не бути — ось питання».","Гамлет ставить виставу «Мишоловка», що відтворює вбивство; реакція Клавдія доводить його провину.","У покоях матері Гамлет помилково вбиває Полонія, що підслуховував за килимом. Клавдій відсилає принца до Англії з наказом стратити його.","Гамлет рятується й повертається. Офелія збожеволіла й загинула; її брат Лаерт прагне помсти.","Клавдій влаштовує поєдинок Гамлета з Лаертом: рапіра отруєна, у келиху — отрута. Гинуть Гертруда, Лаерт, Клавдій і сам Гамлет.","Помираючи, Гамлет просить Гораціо розповісти правду; трон переходить до норвезького принца Фортінбраса."],

zaches:{name:"«Крихітка Цахес на прізвисько Цинобер»", author:"Ернст Теодор Амадей Гофман, 1819; укр. переклад Сидора Сакидона", genre:"Казкова повість (романтична казка для дорослих)",
about:"Сатирична казка про потворного карлика, якому фея дарувала три чарівні волосинки: відтепер усе гарне, що роблять інші, приписують йому. Гофман висміює суспільство, де цінують не справжні заслуги, а видимість, чини й ордени.",
plot:["Фея Рожа-Гожа (Розабельверде) жаліє потворного сина бідної селянки — крихітку Цахеса — й дарує йому три вогнисто-червоні волосинки.","У Керепесі, університетському містечку, всі вважають Цахеса красенем і генієм: чужі вірші, знання й успіхи приписують йому, а його гидкі вчинки — іншим.","Студент-поет Бальтазар, закоханий у Кандиду, доньку професора Моша Терпіна, бачить справжню подобу Цахеса.","Цахес стає улюбленцем князя Барсануфа, міністром Цинобером і кавалером ордена Зеленоплямистого тигра; він збирається одружитися з Кандидою.","Маг Проспер Альпанус допомагає Бальтазарові: той висмикує три чарівні волосинки.","Чари зникають, натовп бачить потворного карлика. Утікаючи, Цахес гине — тоне в нічному горщику; фея повертає йому мертвому гідний вигляд.","Бальтазар одружується з Кандидою й отримує від мага чарівний маєток."],
heroes:[["Цахес (Цинобер)","потворний карлик, втілення нікчемності, що привласнює чужі заслуги"],["Бальтазар","студент-поет, романтичний ентузіаст, бачить світ таким, яким він є"],["Кандида","донька професора, мила, але звичайна дівчина"],["Мош Терпін","професор-філістер, догідливий перед владою"],["Проспер Альпанус","добрий маг (доктор), що допомагає викрити Цахеса"],["Фабіан і Пульхер","друзі Бальтазара; Пульхер утратив посаду через чари Цинобера"],["Фея Рожа-Гожа (Розабельверде)","фея, яка з жалю наділила Цахеса чарами"],["Князь Барсануф","правитель, що вірить видимості"]]},

leaves:{name:"«Листя трави»", author:"Волт Вітмен, перше видання 1855 р.; укр. переклад Максима Стріхи", genre:"Збірка лірики; вільний вірш (верлібр)", poem:true,

plotTitle:"Провідні мотиви",
plot:["«Пісня про себе» — ліричний герой ототожнює себе з усіма людьми й усім світом: «Я славлю себе й оспівую себе».","Символ трави — рівність і єдність усього живого: трава росте скрізь, для всіх однаково.","Демократизм: поет оспівує робітників, фермерів, моряків, жінок і чоловіків, людей усіх рас.","Космізм: людина — частина безмежного Всесвіту, вічного руху життя.","Оспівування тіла й душі як рівноцінних («Я співаю тіло електричне»).","Вірші про Громадянську війну й смерть Лінкольна («О Капітане! мій Капітане!»)."],

redblack:{name:"«Червоне і чорне»", author:"Стендаль (Анрі Марі Бейль), 1830", genre:"Соціально-психологічний роман («Хроніка XIX століття»)",
about:"Роман про талановитого юнака з народу, який у Франції доби Реставрації прагне піднятися на вершину суспільства. Назва пов'язана з кольорами військового мундира й сутани (два шляхи кар'єри), а також з рулеткою — грою долі.",
plot:["Жульєн Сорель, син теслі з містечка Вер'єр, захоплюється Наполеоном і мріє про славу; за часів Реставрації кар'єра можлива лише через церкву.","Він стає гувернером у домі мера пана де Реналя; між Жульєном і пані де Реналь спалахує кохання.","Через чутки Жульєн їде до семінарії в Безансоні, де панують лицемірство й інтриги; його підтримує абат Пірар.","У Парижі Жульєн — секретар маркіза де Ла-Моля. Горда донька маркіза Матильда закохується в нього; вони мають одружитися, Жульєн отримує дворянство й чин.","Лист пані де Реналь, написаний під тиском духівника, викриває Жульєна як кар'єриста — шлюб зірвано.","Жульєн їде до Вер'єра й стріляє в пані де Реналь у церкві; вона виживає.","У в'язниці Жульєн розуміє, що справді кохав лише пані де Реналь. На суді він звинувачує суспільство й відмовляється від порятунку; його страчують."],
heroes:[["Жульєн Сорель","обдарований, честолюбний юнак із низів, що розривається між щирістю й лицемірством"],["Пані де Реналь","дружина мера, щира, ніжна; справжнє кохання Жульєна"],["Матильда де Ла-Моль","горда аристократка, романтична й примхлива"],["Пан де Реналь","мер Вер'єра, марнославний буржуа"],["Маркіз де Ла-Моль","впливовий аристократ, покровитель Жульєна"],["Абат Пірар","суворий, чесний ректор семінарії"]]},

nose:{name:"«Ніс»", author:"Микола Гоголь, 1836", genre:"Фантастична (сатирична) повість, одна з «Петербурзьких повістей»",
about:"Абсурдна історія про колезького асесора Ковальова, у якого одного ранку зник ніс, а потім з'явився в Петербурзі в мундирі статського радника. Гоголь висміює чинопоклоніння й марнославство чиновників.",
plot:["25 березня цирульник Іван Яковлевич знаходить у хлібі ніс і намагається позбутися його, кинувши в Неву.","Колезький асесор (що називає себе «майором») Ковальов прокидається без носа.","Він бачить свій Ніс у мундирі статського радника — вищого за чином; у Казанському соборі Ніс зверхньо розмовляє з власником.","Ковальов марно звертається до поліції, газети, лікаря.","Поліцейський приносить ніс, перехоплений при спробі виїхати за кордон, але той не тримається на місці.","7 квітня ніс сам повертається на обличчя Ковальова; оповідач дивується, як письменники беруть такі сюжети."],

dorian:{name:"«Портрет Доріана Грея»", author:"Оскар Вайльд, 1890 (книжкове видання 1891); укр. переклад Ростислава Доценка", genre:"Філософський (інтелектуальний) роман з елементами фантастики",
about:"Роман про юного красеня, чий портрет старіє й спотворюється замість нього, віддзеркалюючи кожен гріх. Вайльд — проповідник естетизму («мистецтво заради мистецтва») — показує, що краса без моралі веде до загибелі душі.",
plot:["Художник Безіл Голворд пише портрет юного Доріана Грея. Лорд Генрі Воттон захоплює хлопця ідеєю насолоди молодістю й красою.","Доріан бажає, щоб старів портрет, а він лишався молодим, — і бажання збувається.","Він закохується в акторку Сибілу Вейн, але, коли вона погано грає, жорстоко кидає її; Сибіла отруюється. На портреті з'являється жорстока складка біля губ.","Доріан ховає портрет і роками живе в насолодах і пороках, зберігаючи вроду; портрет стає потворним.","Доріан убиває Безіла, який хоче врятувати його душу, і змушує Алана Кемпбела знищити тіло.","Брат Сибіли Джеймс Вейн прагне помсти, але гине на полюванні.","Доріан ударяє ножем портрет, щоб знищити свідка свого сумління. Слуги знаходять мертвого старого потворного чоловіка й прекрасний портрет юнака."],
heroes:[["Доріан Грей","юний красень, що обміняв душу на вічну молодість"],["Лорд Генрі Воттон","парадоксаліст, цинічний «спокусник», проповідник гедонізму"],["Безіл Голворд","художник, щирий друг, уособлення сумління"],["Сибіла Вейн","юна акторка, перша жертва Доріана"],["Джеймс Вейн","брат Сибіли, месник"]]},

baudelaire:{name:"«Квіти зла» («Альбатрос», «Відповідності»)", author:"Шарль Бодлер, 1857; укр. переклади Дмитра Павличка та ін.", genre:"Збірка лірики; передсимволізм", poem:true,
about:"Скандальна збірка, за яку Бодлера судили за «образу моралі». Її назва — оксиморон: поет шукає красу навіть у злі, страждання й потворності великого міста. Бодлер став предтечею символізму й модернізму.",
plotTitle:"Зміст поезій",
plot:["«Альбатрос»: моряки ловлять величного птаха й знущаються з нього на палубі, де він незграбний.","Альбатрос — символ поета: у небі мистецтва він король, а серед натовпу — смішний і самотній («крила велетня заважають йому ходити»).","«Відповідності»: природа — «храм», де живі колони промовляють символами.","Пахощі, барви й звуки «перегукуються» (синестезія); поет розгадує таємні зв'язки світу — ця поезія стала маніфестом символізму."],
heroes:[["Ліричний герой","самотній поет, що відчуває розлад із натовпом і шукає ідеал серед «спліну» (туги)"]]},

verlaine:{name:"«Поетичне мистецтво», «Осіння пісня»", author:"Поль Верлен, 1874 / 1866; укр. переклади Григорія Кочура, Михайла Москаленка", genre:"Лірика; символізм та імпресіонізм", poem:true,
about:"Верлен — «король поетів», майстер музичного вірша. «Поетичне мистецтво» — віршований маніфест символізму, «Осіння пісня» — зразок імпресіоністичної лірики настрою.",
plotTitle:"Зміст поезій",
plot:["«Поетичне мистецтво»: «Музика — найперше в слові!» — поет закликає до мелодійності вірша.","Відмова від яскравих барв на користь відтінків, від красномовства й «гострот», від надмірної рими.","Поезія має бути легкою, як подих, як «пригода» вранішнього вітру.","«Осіння пісня»: протяжні звуки осінніх скрипок ранять серце.","Ліричний герой блідне, згадуючи минулі дні, і плаче; його, як мертвий лист, несе злий вітер.","Ефект досягнуто звукописом, повторами, короткими рядками — сум передано музикою слова."],
heroes:[["Ліричний герой","меланхолійна, тонко чутлива людина, що передає миттєві стани душі"]]},

rimbaud:{name:"«Голосівки», «Моя богема»", author:"Артюр Рембо, 1871 / 1870; укр. переклади Г. Кочура, В. Ткаченка та ін.", genre:"Лірика; символізм", poem:true,
about:"Рембо написав усі свої вірші до 20 років, а потім покинув поезію. Він вимагав від поета бути «ясновидцем», що через «розлад усіх почуттів» бачить невідоме.",
plotTitle:"Зміст поезій",
plot:["«Голосівки» (сонет): кожен голосний звук має колір — «А» чорне, «Е» біле, «І» червоне, «У» зелене, «О» синє.","Звуки викликають образи: мухи, намети, кров, хвилі моря, Сурма Страшного суду, погляд Омеги.","Вірш — приклад синестезії й символістського пошуку прихованих зв'язків світу.","«Моя богема» (сонет): юний поет мандрує дорогами в подертих кишенях і пальті «ідеальному».","Він спить під зорями, складає рими, а Муза — його вірна супутниця; бідність і свобода — щастя мандрівного поета."],
heroes:[["Ліричний герой","юний бунтар, мандрівник, поет-«ясновидець», закоханий у свободу"]]},

bluebird:{name:"«Блакитний Птах»", author:"Моріс Метерлінк, 1908; укр. переклад Дмитра Чистяка", genre:"Драма-феєрія (символістська п'єса), 12 картин",
about:"Казкова п'єса про пошуки щастя. Діти лісоруба шукають Блакитного Птаха для хворої дівчинки, мандруючи чарівними країнами, а знаходять його вдома: щастя — поруч, у простих речах і в добрих справах.",
plot:["Різдвяна ніч. Діти лісоруба Тільтіль і Мітіль у бідній хатині захоплено дивляться на свято багатих сусідів.","Фея Берилюна просить знайти Блакитного Птаха для своєї хворої онуки й дає Тільтілеві шапочку з діамантом, що відкриває душі речей.","Оживають Хліб, Цукор, Вогонь, Вода, Молоко, Пес, Киця; провідницею стає Світло.","У Країні Спомину діти зустрічають покійних дідуся й бабусю, які оживають, коли про них згадують.","Вони відвідують Палац Ночі, Ліс, Цвинтар, Сади Блаженств, Царство Майбуття — але спіймані блакитні птахи гинуть або змінюють колір. Киця підступно зраджує, Пес лишається вірним.","Прокинувшись удома, Тільтіль бачить, що його горлиця — блакитна. Він дарує її хворій дівчинці сусідки, і та одужує.","Птах вилітає; Тільтіль звертається до глядачів: якщо хтось знайде його, нехай поверне — він потрібен для щастя."],
heroes:[["Тільтіль","хлопчик, що вчиться доброти й мужності; шукач щастя"],["Мітіль","його сестричка"],["Світло","мудра провідниця, символ розуму й знання"],["Пес","вірний друг людини"],["Киця","підступна, зрадлива"],["Фея Берилюна","чарівниця, схожа на сусідку пані Берленґо"]]},

coraline:{name:"«Кораліна»", author:"Ніл Ґейман, 2002", genre:"Повість-казка у жанрі фентезі з елементами жахів (горор)",
about:"Повість про допитливу дівчинку, яка за таємними дверима знаходить «інший» світ з ідеальними батьками. Але Інша мама з ґудзиками замість очей хоче назавжди залишити Кораліну в себе. Героїня рятує батьків і душі дітей, долаючи страх.",
plot:["Кораліна Джонс переїжджає з батьками у старий будинок; батьки зайняті роботою, дівчинці нудно.","Вона відмикає двері, за якими — цегляна стіна; уночі за ними відкривається коридор до іншої квартири.","Там живуть Інша мама й Інший тато з чорними ґудзиками замість очей; там смачна їжа, цікаві іграшки й увага.","Інша мама пропонує залишитися назавжди, якщо Кораліна дозволить пришити ґудзики собі на очі; дівчинка відмовляється.","Інша мама викрадає справжніх батьків. Кораліна, з допомогою чорного кота, вирушає їх рятувати.","Вона пропонує Іншій мамі гру: знайти батьків і душі трьох дітей-привидів. Камінь із діркою від сусідок міс Спінк і міс Форсібл допомагає їх відшукати.","Кораліна хитрістю повертається додому й зачиняє двері, а відірвану руку Іншої мами, що полює на ключ, скидає в старий колодязь."],
heroes:[["Кораліна Джонс","допитлива, смілива, винахідлива дівчинка, що вчиться цінувати справжніх батьків"],["Інша мама (Бабуся)","зла істота з ґудзиками замість очей, що «любить» як власник"],["Кіт","чорний кіт без імені, мудрий і саркастичний помічник"],["Батьки Кораліни","зайняті, але по-справжньому люблячі"],["Міс Спінк і міс Форсібл","літні сусідки-акторки"],["Містер Бобо","дивакуватий сусід, що дресирує мишей"]]},

kardamon:{name:"«Кава з кардамоном»", author:"Йоанна Яґелло (Польща); укр. переклад Божени Антоняк", genre:"Повість про підлітків з елементами детективу",
about:"Психологічна історія про дорослішання, яка поєднується з детективним сюжетом. Гімназистка Лінка, що любить варити каву за екзотичними рецептами, розплутує родинну таємницю й водночас переживає дружбу, перше кохання та нерозуміння з дорослими.",
plot:["Лінка (Халіна) — гімназистка, яка живе з мамою, вітчимом Адамом і молодшим братиком Каєм; вона почувається самотньою й незрозумілою.","Її захоплення — кава з кардамоном та інші незвичні рецепти; поруч — друзі, однокласники, хлопець Адріан.","Стара фотографія наштовхує Лінку на думку, що в минулому мама була вагітна ще однією дитиною.","Дівчина, як справжній детектив, збирає факти, розпитує людей і поступово відкриває правду.","Розслідування приводить до дитячого будинку й дівчинки Касі; Лінка дізнається історію її долі.","Таємниця розкрита: героїня вчиться розуміти маму, пробачати й брати відповідальність за свої вчинки."],
heroes:[["Лінка (Халіна)","головна героїня, допитлива й чутлива дівчина, що дорослішає"],["Мама Лінки","жінка з болісною таємницею минулого"],["Адам","вітчим Лінки, батько Кая"],["Кася","дівчинка з дитячого будинку"],["Адріан","хлопець, близький Лінці"]]}

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">Розділ ${si+1}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${si+1}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("zl10_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Зарубіжна література 10`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("zl10_theme",d.dataset.theme); }
const th=store.get("zl10_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
