 прийому подачі", "p": ["Команда заздалегідь вирішує, хто приймає подачу. Найчастіше прийом розподіляють між двома-трьома найкращими приймальниками, а інші гравці відходять, щоб їм не заважати. Зв'язковий, навіть якщо він за розстановкою в задній лінії, у момент подачі стоїть так, щоб швидко вийти в зону 2–3.", "Правила дозволяють будь-яке розташування гравців, якщо в момент удару подавальника зберігається порядок: кожен гравець передньої лінії ближче до сітки, ніж гравець задньої лінії за ним, а ліві й праві — у правильному порядку. Після подачі всі можуть пересуватися вільно."], "ul": ["Приймальники стоять «півколом» або в лінію, перекриваючи майданчик.", "Межі зон відповідальності узгоджують до подачі.", "М'яч між двома гравцями приймає той, хто ближче до центру майданчика або з кращої позиції.", "Неправильна розстановка в момент подачі — помилка.", "Після прийому — перехід у напад або страховка."]}, {"h": "Волейбол. Взаємодія з зв'язковим у зонах 3, 2, 4 та прийом знизу", "p": ["Зв'язковий у зоні 3 — найзручніший варіант: від нього можна передати м'яч і в зону 4, і в зону 2. Зв'язковий у зоні 2 частіше передає вперед у зону 4 і коротку в зону 3. Зв'язковий у зоні 4 — рідша схема, коли праворукий пасувальник передає м'яч назад.", "Приймальник, виконуючи прийом знизу, має вирішити дві задачі: прийняти м'яч стабільно і спрямувати його у зону зв'язкового. Краще висока, але точна передача, ніж швидка і неточна."], "ul": ["Ціль прийому — 1 м від сітки, у зону зв'язкового.", "Платформа розвернута на ціль до контакту з м'ячем.", "Зв'язковий виходить у зону до удару подавальника.", "Коротка вигукова команда: «Моя!», «Твоя!», «Аут!».", "Спокій і рівномірність рухів важливіші за швидкість."]}], "f": "", "pr": ["Намалюй систему прийому подачі з трьома приймальниками і зв'язковим, що виходить із зони 1 у зону 2–3, та стрілками покажи шлях м'яча після прийому.", "Виконай вправу «стійка приймальника + імітація прийому» з легким кроком вліво і вправо: 3 × 10 повторень, стежачи за прямими ліктями та зігнутими колінами."], "q": ["Навіщо команді система прийому?", "Яких правил розстановки треба дотримуватися в момент подачі суперника?", "Як вирішити, хто приймає м'яч, що летить між двома гравцями?", "Чому зв'язковому найзручніше бути в зоні 3?"]}, {"n": "23", "t": "Зонне блокування. Контрольний норматив: прийом знизу однією рукою з падінням і перекатом", "g": "Учень знатиме, як виконується і оцінюється контрольний норматив із прийому м'яча знизу однією рукою з падінням вперед та перекатом, і повторить основи зонного блокування.", "k": "Модулі: Волейбол", "terms": [["Падіння вперед", "захисний прийом, коли гравець після випаду до м'яча опускається на підлогу, гасячи швидкість руками й ковзанням."], ["Перекат на стегна", "завершення падіння, під час якого тіло послідовно торкається підлоги стегнами та животом, без удару."], ["Амортизація", "м'яке гасіння швидкості та сили удару тіла об підлогу за рахунок згинання суглобів."], ["Технічна оцінка", "оцінювання не лише результату, а й правильності виконання всіх фаз руху."]], "th": [{"h": "Волейбол. Зонне блокування: закрити основний напрямок", "p": ["Повторимо головне: блок не намагається закрити все, а закриває основний напрямок удару нападника. Наприклад, при атаці по діагоналі блок ставлять «на діагональ», а захисник зони 1 або 5 страхує лінію.", "Блок і захист — одна система. Якщо блокуючий змістився, захисники мають знати, куди вони переходять. Така домовленість зменшує кількість «порожніх» зон на майданчику."], "ul": ["Блок ставлять навпроти ударної руки нападника.", "Захисники стають туди, де блок «не бачить».", "Блок узгоджують із захистом до подачі.", "Своєчасний вихід у зону удару важливіший за висоту стрибка.", "Після блоку — самостраховка і готовність грати далі."]}, {"h": "Волейбол. Контрольний норматив: прийом знизу однією рукою з падінням і перекатом", "p": ["Норматив виконують на матах або на рівній безпечній підлозі після ретельної розминки. Учитель подає або набрасує м'яч на певну відстань від учня; той робить випад, приймає м'яч однією рукою так, щоб він полетів угору, і завершує рух падінням вперед з перекатом на стегна (у юнаків — і на груди). Кількість спроб і вимоги повідомляє вчитель.", "Оцінюють техніку: широкий випад, контакт однією рукою, м'яке приземлення на руки з амортизацією, перекат без удару коліньми чи підборіддям, швидкий підйом. Важлива і результативність — м'яч після прийому має бути піднятий угору для партнера."], "ul": ["Перед нормативом — розминка кистей, ліктів, плечей, спини.", "Не падай на прямі руки — згинай лікті.", "Голову тримай піднятою, підборіддя не торкається підлоги.", "Якщо є біль у кисті чи плечі — повідом учителя до виконання.", "Після нормативу — оціни, яка фаза вдалася гірше, і що треба повторити."]}], "f": "", "pr": ["Опиши письмово фази прийому знизу однією рукою з падінням і перекатом та критерії, за якими вчитель оцінює виконання (падіння вдома не виконуй).", "Виконай вправи для зміцнення рук і корпусу: віджимання від підлоги з колін 3 × 8–10, «супермен» лежачи на животі 3 × 10, планка 2 × 30 секунд."], "q": ["Як пов'язані блок і розташування захисників?", "За якими критеріями оцінюють прийом однією рукою з падінням?", "Чому не можна падати на прямі руки?", "Що потрібно зробити перед виконанням нормативу?"]}, {"n": "24", "t": "Нападаючі удари з короткої передачі та з першої передачі: тактика і швидкість атаки", "g": "Учень удосконалить розуміння нападаючих ударів з короткої передачі та з першої передачі, їх тактичного значення і техніки розбігу.", "k": "Модулі: Волейбол", "terms": [["Розбіг", "серія кроків нападника перед стрибком для нападаючого удару, що забезпечує висоту і силу удару."], ["Замах", "відведення ударної руки назад-угору перед ударом."], ["Атака першим темпом", "атака центрального нападника з короткої швидкої передачі, коли він стрибає одночасно з передачею зв'язкового."], ["Скидка", "м'яке спрямування м'яча за блок або на вільне місце замість сильного удару."]], "th": [{"h": "Волейбол. Нападаючий удар з короткої передачі", "p": ["Атака з короткої передачі — найшвидший спосіб нападу. Центральний нападник починає розбіг, поки м'яч ще летить після прийому до зв'язкового. Він стрибає перед зв'язковим або трохи збоку від нього, виставляє руку, а зв'язковий спрямовує м'яч точно до неї. Удар виконують коротким швидким рухом кисті.", "Перевага цієї атаки — блок суперника не встигає вистрибнути. Недолік — потрібна дуже точна перша передача і злагодженість. Навіть якщо м'яч передано іншому нападнику, рух центрального на коротку відволікає блок."], "ul": ["Розбіг коротший: 2 кроки замість 3–4.", "Стрибок одночасно з передачею або трохи раніше.", "Замах короткий, лікоть високо.", "Типова помилка: нападник запізнюється й «доганяє» м'яч.", "Удар спрямовують у порожню зону між захисниками."]}, {"h": "Волейбол. Нападаючий удар з першої передачі", "p": ["Коли м'яч після прийому або удару суперника летить над сіткою, гравець передньої лінії може одразу атакувати — сильним ударом або скидкою. Це «покарання» суперника за неточну гру. Важливо правильно оцінити, де м'яч: атакувати можна м'яч, що перебуває на своєму боці або над сіткою, а м'яч, що повністю на боці суперника, — заборонено.", "Гравці задньої лінії атакувати з першої передачі вище верхнього краю сітки з передньої зони не можуть. Під час такої атаки особливо уважно стеж за сіткою і центральною лінією."], "ul": ["Атакуй лише м'яч на своєму боці або над сіткою.", "Якщо немає можливості для удару — скидка в порожню зону.", "Не торкайся сітки руками чи тілом.", "Приземлення — на дві ноги, з амортизацією.", "Після атаки — одразу в стійку для захисту."]}], "f": "", "pr": ["Опиши, чим удар з короткої передачі відрізняється від удару з високої передачі (розбіг, момент стрибка, замах), у формі таблиці.", "Виконай імітацію розбігу у два кроки з замахом руками без стрибка 3 × 8 і підйоми на носки 3 × 20."], "q": ["У чому перевага атаки з короткої передачі?", "Чому навіть «порожній» розбіг центрального нападника корисний для команди?", "Коли можна атакувати м'яч з першої передачі?"]}, {"n": "25", "t": "Прийом знизу. Контрольний норматив: 10 прямих подач на влучність у зазначену зону", "g": "Учень знатиме техніку верхньої прямої (юнаки) та нижньої прямої (дівчата) подачі і розумітиме, як виконувати і оцінювати контрольний норматив із 10 подач на влучність у зазначену зону.", "k": "Модулі: Волейбол", "terms": [["Верхня пряма подача", "подача, під час якої гравець стоїть обличчям до сітки і б'є по м'ячу над головою прямою рукою."], ["Нижня пряма подача", "подача, під час якої гравець стоїть обличчям до сітки і б'є по м'ячу знизу, махом прямої руки знизу-назад-уперед."], ["Влучність подачі", "здатність спрямувати подачу в задану зону майданчика."], ["Зазначена зона", "частина майданчика суперника, визначена вчителем як ціль для подачі під час нормативу."]], "th": [{"h": "Волейбол. Верхня пряма і нижня пряма подачі", "p": ["Верхня пряма подача (для юнаків): стоять обличчям до сітки, ліва нога трохи попереду (у праворуких). М'яч підкидають перед ударною рукою на висоту близько метра, рука відводиться за голову, лікоть високо. Удар — по центру м'яча тугою долонею, у найвищій точці, з перенесенням ваги на передню ногу.", "Нижня пряма подача (для дівчат): стоять обличчям до сітки, ліва нога попереду, тулуб трохи нахилений. М'яч тримають на долоні лівої руки на рівні пояса. Права рука робить мах назад, а потім уперед і б'є по м'ячу знизу-ззаду основою долоні або кулаком. Підкидання низьке або м'яч б'ють майже з руки."], "ul": ["Фази: вихідне положення — підкидання — замах — удар — перехід у гру.", "Для точності важливе однакове підкидання щоразу.", "Напрямок задає положення долоні та тулуба в момент удару.", "Типова помилка верхньої: підкидання за голову — м'яч летить в аут.", "Типова помилка нижньої: удар збоку — м'яч летить убік."]}, {"h": "Волейбол. Контрольний норматив: 10 подач у зазначену зону та прийом знизу", "p": ["Норматив: кожен учень виконує 10 подач — юнаки верхньою прямою, дівчата нижньою прямою — у зону, яку визначив учитель. Рахують кількість влучних подач. Подача з заступом, у сітку, в аут або не в зазначену зону не зараховується. Критерії оцінки за кількістю влучань повідомляє вчитель.", "Як підготуватися: розминка плечей і кисті, кілька пробних подач, спокійний ритм. Між подачами — ритуал і вдих. Перед нормативом команда повторює прийом знизу: це розминає руки і допомагає відчути, як м'яч летить після подачі."], "ul": ["Не поспішай між подачами — кожна подача окрема.", "Перед кожною подачею — подивися на зазначену зону.", "Порахуй влучання й порівняй з попереднім уроком.", "Помилка не означає провалу — наступна подача з чистого аркуша.", "Прийом знизу: стійка, платформа, робота ногами."]}], "f": "", "pr": ["Опиши письмово техніку подачі, яку ти виконуєш на нормативі (верхня пряма або нижня пряма), за фазами та з двома типовими помилками; запиши свій результат нормативу.", "Виконай вправи для плечового суглоба і кистей: колові рухи руками 2 × 15, «ножиці» руками перед грудьми 2 × 20, імітація своєї подачі без м'яча 3 × 10."], "q": ["Чим верхня пряма подача відрізняється від нижньої прямої?", "Які подачі не зараховуються під час нормативу?", "Як підготуватися до нормативу на влучність?", "Чому однакове підкидання важливе для точності?"]}, {"n": "26", "t": "Норматив: 6 передач на точність через сітку із зон 2, 3, 4. Підсумок модуля «Волейбол»", "g": "Учень знатиме, як виконувати контрольний норматив із передач на точність через сітку, та підсумує вивчене в модулі «Волейбол».", "k": "Модулі: Волейбол", "terms": [["Точність передачі", "здатність спрямувати м'яч у визначену точку з потрібною висотою і силою."], ["Передача через сітку", "верхня передача, яка відправляє м'яч на бік суперника як спосіб атаки чи завершення розіграшу."], ["Антена", "гнучкий стрижень на сітці над боковими лініями, що позначає межі простору, через який має пролетіти м'яч."], ["Підсумковий урок", "урок, на якому узагальнюють і перевіряють знання та вміння з вивченого модуля."]], "th": [{"h": "Волейбол. Контрольний норматив: 6 передач на точність через сітку", "p": ["Учень виконує 6 верхніх передач через сітку в зазначену вчителем зону майданчика суперника: по черзі із зон 2, 3 і 4 (порядок і кількість спроб із кожної зони визначає вчитель). Зазвичай партнер або вчитель набрасує м'яч, і учень має стати під м'яч, розвернутися до цілі і виконати передачу. Зараховують передачі, що пролетіли між антенами й впали в задану зону.", "Оцінюють і техніку: «ківш» з пальців, м'яч над чолом, робота ніг, розворот тулуба до цілі. Із зони 2 і 4 ціль часто по діагоналі — тому важливо повернутися до неї всім тілом, а не лише руками."], "ul": ["Перед нормативом — розминка пальців, кистей, плечей.", "Ставай під м'яч заздалегідь, а не тягнися до нього.", "Передача через сітку має бути вищою за край сітки.", "Не зараховують передачу з «захопленням» чи подвійним торканням.", "Після нормативу порівняй результат із попередніми уроками."]}, {"h": "Волейбол. Підсумок модуля: що ми вивчили", "p": ["За модуль ми вивчили історію та правила волейболу, склад і жести суддівської бригади, ведення протоколу. Відпрацювали техніку подач (верхньої бокової, верхньої прямої, нижньої прямої), прийому знизу двома руками й однією рукою з падінням, верхніх передач — у русі, у стрибку, за спину, через зону та через сітку.", "У нападі ми розібрали нападаючі удари з високих і коротких передач та з першої передачі, у захисті — індивідуальне, групове та зонне блокування, страховку партнера й побудови «кутом вперед» і «кутом назад». Окремо говорили про ефективність змагальної діяльності, профілактику травм і досягнення українського волейболу."], "ul": ["Правила: 6 гравців, 3 торкання, партія до 25 очок (п'ята — до 15), перехід за годинниковою стрілкою.", "Суддівство: перший і другий судді, секретар, лінійні судді, жести.", "Техніка: подачі, прийом, передачі, удари, блок.", "Тактика: вибіркова подача, вибір нападника, зонний блок, страховка, система прийому.", "Безпека: розминка, правильне приземлення, падіння лише на матах.", "Самоконтроль: облік результатів нормативів і самопочуття."]}], "f": "У пляжному волейболі на майданчику лише по двоє гравців з кожного боку, тому кожен гравець має вміти все: і приймати, і передавати, і атакувати.", "pr": ["Склади таблицю «Мої результати з волейболу»: усі контрольні нормативи модуля, твій результат і що вдалося найкраще та найгірше.", "Підготуй 5 власних питань для повторення модуля «Волейбол» з відповідями (правила, суддівство, техніка, тактика, безпека)."], "q": ["Як правильно виконувати передачу через сітку на точність?", "Які основні правила гри у волейбол ти можеш назвати?", "Які види блокування та побудови в захисті ти знаєш?", "Які правила безпеки найважливіші на уроках волейболу?"]}]}, {"name": "Розділ 2. Настільний теніс (уроки 27–52)", "lessons": [{"n": "27", "t": "Безпека на уроках настільного тенісу. Стійка тенісиста. Прийом подачі з нижнім обертанням", "g": "Учень знатиме правила безпеки в настільному тенісі, вмітиме описати базову стійку тенісиста й пояснити, як приймати подачу з нижнім обертанням.", "k": "Модулі: Настільний теніс", "terms": [["Стійка тенісиста", "вихідне положення гравця біля столу: ноги ширше за плечі, коліна зігнуті, вага на передній частині стоп, ракетка перед тулубом."], ["Нижнє обертання", "обертання м'яча «назад», від суперника, через яке м'яч після відскоку гальмує і має тенденцію падати в сітку."], ["Накладка", "гумове покриття ракетки, від якого залежать швидкість і обертання м'яча."], ["Самостійне заняття", "тренування без учителя, яке учень планує і проводить сам за чіткою структурою: розминка, основна частина, заминка."]], "th": [{"h": "Настільний теніс. Правила безпеки та підготовка до занять", "p": ["Настільний теніс здається безпечною грою, але травми трапляються: розтягнення гомілкостопа під час різких кроків, удари об край столу, падіння на слизькій підлозі через розкотені м'ячі. Тому кожне заняття починається з інструктажу й ретельної розминки.", "Спеціальні бігові та стрибкові вправи (дрібний біг, приставні кроки, стрибки на носках) готують м'язи ніг і суглоби до швидких коротких переміщень, які в теніс-грі відбуваються щосекунди."], "ul": ["Займайся у спортивному взутті з неслизькою підошвою.", "Збирай м'ячі з підлоги одразу, не наступай на них.", "Не сідай і не спирайся на стіл, не перелазь через сітку.", "Не замахуйся ракеткою, якщо поруч стоїть інший учень.", "Розминка — щонайменше 8–10 хвилин перед грою.", "При болю чи запамороченні одразу припини вправу і повідом учителя."]}, {"h": "Настільний теніс. Стійка тенісиста", "p": ["Правильна стійка — основа всіх ударів. Ноги трохи ширше за плечі, у правші права нога злегка позаду (для ударів справа) або стопи паралельно (універсальна стійка). Коліна зігнуті, тулуб нахилений уперед, вага тіла на передній частині стоп — так гравець готовий рушити в будь-який бік.", "Ракетку тримають перед собою на рівні трохи вище столу, лікоть вільно зігнутий. Відстань від столу — приблизно на довжину витягнутої руки."], "ul": ["Типова помилка — прямі ноги: реакція сповільнюється.", "Не опускай ракетку нижче столу між ударами.", "Після кожного удару повертайся в стійку.", "Погляд — на м'яч і ракетку суперника.", "Плечі розслаблені, хват не надто тугий."]}, {"h": "Настільний теніс. Прийом подачі з нижнім обертанням і самостійні заняття", "p": ["Подача з нижнім обертанням «тягне» м'яч назад. Якщо підставити ракетку вертикально, м'яч піде в сітку. Тому ракетку при прийомі трохи відкривають (повертають робочим боком угору) і виконують рух уперед-униз під м'яч — так званий прийом підрізкою.", "Методика самостійних занять: визнач мету (наприклад, покращити реакцію), склади план на 20–30 хвилин, починай з розминки, закінчуй вправами на розтягування й записуй результати."], "ul": ["Ракетка відкрита, кут залежить від сили обертання.", "Удар м'ячем у верхній точці відскоку або трохи раніше.", "Рух короткий і м'який, без замаху.", "Сильніше обертання — більше відкривай ракетку.", "Удома тренуй імітацію руху без м'яча перед дзеркалом."]}], "f": "Офіційні розміри столу для настільного тенісу: 274 см завдовжки, 152,5 см завширшки, висота ігрової поверхні — 76 см.", "pr": ["Запиши в зошит 6 правил безпеки на уроці настільного тенісу і поясни, від якої травми захищає кожне.", "Перед дзеркалом прийми стійку тенісиста й утримуй її 3 рази по 30 секунд, перевіряючи положення колін, тулуба і ракетки (можна з книжкою замість ракетки)."], "q": ["Чому ноги в стійці тенісиста мають бути зігнуті?", "Що відбувається з м'ячем, який має нижнє обертання, після відскоку?", "Як треба поставити ракетку, щоб прийняти подачу з нижнім обертанням?", "З яких частин складається самостійне тренування?"]}, {"n": "28", "t": "Подачі з нижнім та верхнім обертом. Накат справа та зліва по діагоналі", "g": "Учень знатиме правила виконання подачі, відмінності між верхнім і нижнім обертанням і вмітиме описати техніку накату справа та зліва.", "k": "Модулі: Настільний теніс", "terms": [["Подача", "удар, яким гравець вводить м'яч у гру: м'яч має відскочити спочатку на своїй половині, потім — на половині суперника."], ["Верхнє обертання", "обертання м'яча «вперед», до суперника, через яке м'яч після відскоку прискорюється і летить далі й нижче."], ["Накат", "основний атакувальний удар з легким верхнім обертанням, який виконують рухом ракетки вперед-угору."], ["Діагональ", "напрямок удару з кута в протилежний кут столу — найдовша і найбезпечніша траєкторія."]], "th": [{"h": "Настільний теніс. Правила подачі, нижній і верхній оберт", "p": ["За правилами м'яч під час подачі лежить на відкритій нерухомій долоні, позаду задньої лінії і вище рівня столу. Гравець підкидає його майже вертикально щонайменше на 16 см і б'є, коли м'яч падає. М'яч не можна приховувати від суперника тілом чи вільною рукою.", "Обертання задає рух ракетки під час контакту: ковзання під м'ячем уперед-униз дає нижній оберт, ковзання по верху м'яча вперед-угору — верхній. Чим швидший рух кисті і чим тонший (дотичний) контакт, тим сильніше обертання."], "ul": ["Подача з нижнім обертом — ракетка відкрита, рух під м'яч.", "Подача з верхнім обертом — ракетка закрита, рух по м'ячу вгору-вперед.", "М'яч першим торкається своєї половини столу.", "Підкидання — не менше 16 см, без закручування рукою.", "Типова помилка — удар по центру м'яча: обертання майже немає."]}, {"h": "Настільний теніс. Накат справа та зліва по діагоналі", "p": ["Накат справа: корпус повертається праворуч, ракетка опускається трохи нижче рівня м'яча, далі рух уперед-угору з поворотом тулуба і перенесенням ваги з правої ноги на ліву. Удар — у верхній точці відскоку, ракетка злегка закрита.", "Накат зліва виконується перед тулубом: лікоть трохи виведений уперед, рух іде від живота вперед-угору за рахунок передпліччя і кисті. По діагоналі грають тому, що вона довша за лінію — більше запасу, менше помилок."], "ul": ["Фази: замах — удар — завершення — повернення в стійку.", "Завершення руху справа — ракетка біля чола.", "Не роби удар тільки рукою — працюють ноги й тулуб.", "Зліва не відводь лікоть далеко від тіла.", "Тренуй ритм: удар — повернення — удар."]}], "f": "Відкрита долоня під час подачі потрібна для того, щоб гравець не міг непомітно закрутити м'яч пальцями ще до удару.", "pr": ["Намалюй схему столу і стрілками покажи напрямки ударів по діагоналі справа та зліва для двох гравців-правшів.", "Виконай імітацію накату справа і зліва без ракетки: по 3 серії по 15 повільних рухів, стежачи за поворотом тулуба і перенесенням ваги."], "q": ["Які вимоги правил до підкидання м'яча під час подачі?", "Чим відрізняється рух ракетки при подачі з верхнім і нижнім обертом?", "Чому накат по діагоналі надійніший, ніж по лінії?", "З яких фаз складається накат справа?"]}, {"n": "29", "t": "Подача «маятник». Прийом подачі з нижнім обертанням. Планування самостійних занять", "g": "Учень вмітиме описати техніку подачі «маятник», пояснити варіанти прийому нижнього обертання та скласти план самостійного заняття.", "k": "Модулі: Настільний теніс", "terms": [["Маятник", "подача справа, під час якої ракетка рухається, як маятник годинника, і може надати м'ячу бокове, нижньо-бокове або верхньо-бокове обертання."], ["Точка контакту", "місце на м'ячі і на ракетці, де вони стикаються; від неї залежить напрямок і обертання."], ["Пульс", "частота серцевих скорочень за хвилину — простий показник інтенсивності навантаження."], ["Заминка", "спокійні вправи і розтягування наприкінці тренування для поступового відновлення організму."]], "th": [{"h": "Настільний теніс. Подача «маятник»", "p": ["Гравець стоїть боком до столу, у лівому куті (для правші), вільна рука з м'ячем перед ним. Після підкидання ракетка рухається зліва направо перед тулубом — справа наліво. Залежно від того, по якій частині м'яча ковзає ракетка (низ, бік, верх), виходить нижньо-бокове, чисто бокове чи верхньо-бокове обертання.", "Сила подачі — у швидкому русі кисті в останній момент. Однаковий замах для різних обертань робить подачу обманною: суперник не встигає зрозуміти, яке обертання отримав м'яч."], "ul": ["Хват під час маятника часто трохи змінюють — кисть стає вільнішою.", "Лікоть піднятий, рух іде від плеча до кисті.", "Контакт тонкий, ковзний, а не прямий удар.", "Перший відскок — ближче до своєї задньої лінії для довгої подачі.", "Типова помилка — подача надто високо над сіткою."]}, {"h": "Настільний теніс. Прийом нижнього обертання", "p": ["Прийом підрізкою — найнадійніший спосіб: відкрита ракетка, короткий рух уперед-униз, удар на висхідній частині відскоку. Довга підрізка відкидає м'яч глибоко до задньої лінії суперника, коротка (скидка) — залишає м'яч біля сітки.", "Сильніші гравці можуть відповідати на довгий нижній оберт атакою — топ-спіном, але для цього потрібна добра техніка руху знизу вгору."], "ul": ["Короткий м'яч — крок уперед правою ногою під стіл.", "Читай обертання за рухом ракетки суперника.", "Не відповідай вертикальною ракеткою.", "Стеж за глибиною: найнебезпечніший прийом — середньої довжини і високий."]}, {"h": "Настільний теніс. Як спланувати самостійне заняття", "p": ["Самостійне тренування має мету, план і контроль. Структура: розминка 8–10 хв (суглобова гімнастика, легкі переміщення), основна частина 15–25 хв (імітація ударів, вправи на ноги, кисть, рівновагу), заминка 5 хв.", "Контролюй навантаження за пульсом: виміряй його до заняття, одразу після основної частини і через 3 хвилини відпочинку. Якщо пульс швидко повертається ближче до вихідного — навантаження було посильним."], "ul": ["Одна головна мета на одне заняття.", "Записуй вправи і самопочуття в щоденник.", "Збільшуй навантаження поступово.", "Відпочинок між серіями — до відновлення дихання.", "Не тренуйся при поганому самопочутті."]}], "f": "Назва подачі «маятник» пов'язана з дугоподібним рухом ракетки, схожим на розгойдування маятника годинника.", "pr": ["Склади письмовий план самостійного заняття на 25 хвилин: розминка, основна частина (імітація подачі «маятник», вправи для ніг), заминка; вкажи час на кожну частину.", "Виміряй пульс у спокої, після 20 повільних присідань і через 3 хвилини відпочинку; запиши результати і зроби висновок про відновлення."], "q": ["Як подача «маятник» може мати різне обертання при схожому замаху?", "Чим відрізняються довга і коротка підрізка?", "Навіщо вимірювати пульс під час самостійних занять?", "Що входить до заминки?"]}, {"n": "30", "t": "Контрудари. Накат справа та зліва по діагоналі. Хват і переміщення", "g": "Учень зрозуміє, що таке контрудар, знатиме види хватки ракетки і правила переміщення біля столу під час обміну накатами.", "k": "Модулі: Настільний теніс", "terms": [["Контрудар", "атакувальна відповідь на атакувальний удар суперника, коли гравець не захищається, а сам б'є з верхнім обертом."], ["Європейський хват", "хват ракетки «рукостисканням»: ручка в долоні, вказівний палець на одній стороні, великий — на іншій."], ["Хват «пером»", "азійський спосіб тримати ракетку, схожий на тримання ручки під час письма."], ["Приставний крок", "переміщення, коли одна нога приставляється до іншої без схрещування; основний крок тенісиста."]], "th": [{"h": "Настільний теніс. Хват ракетки та переміщення", "p": ["Більшість гравців у Європі використовують європейський хват: він зручний для ударів і справа, і зліва. Хват «пером» популярний в Азії й дає особливо вільну кисть для ударів справа. Головне — не стискати ракетку надто сильно: рука повинна бути розслабленою до моменту удару.", "Переміщуються біля столу приставними кроками в напрямку м'яча. Для довших відстаней використовують схресний крок. Ноги весь час «живі», вага на носках."], "ul": ["Вказівний палець лежить уздовж краю гуми з тильного боку.", "Пальці не залазять на робочу поверхню накладки.", "Перед ударом справа — крок правою назад-праворуч.", "Не стій на прямих ногах між ударами.", "Спеціальні стрибкові вправи розвивають саме ці переміщення."]}, {"h": "Настільний теніс. Контрудари в обміні накатами", "p": ["Під час обміну накатами по діагоналі обидва гравці атакують. Контрудар — це накат у відповідь на накат: м'яч приходить швидко і з верхнім обертом, тому ракетку треба закрити сильніше і скоротити замах. Удар робиться на висхідній або у верхній точці відскоку, близько до столу.", "Важливо тримати ритм і не відступати від столу без потреби: чим далі від столу, тим довший шлях м'яча і більше часу для суперника."], "ul": ["Сильніший верхній оберт у суперника — сильніше закривай ракетку.", "Замах коротший, ніж у звичайному накаті.", "Тримай дистанцію — приблизно витягнута рука від столу.", "Вчасно повертайся в стійку після кожного удару.", "Помилка — бити «з руки» без участі ніг."]}], "f": "Відомі гравці з хватом «пером» здебільшого родом з Китаю, Японії та Кореї, хоча в сучасному тенісі він трапляється рідше, ніж раніше.", "pr": ["Опиши в зошиті різницю між європейським хватом і хватом «пером» та намалюй схематично положення пальців для свого хвату.", "Виконай вправу на переміщення: приставні кроки вліво-вправо на 2–3 кроки в стійці тенісиста, 4 серії по 20 секунд, з відпочинком 40 секунд (на безпечній, неслизькій поверхні)."], "q": ["Що таке контрудар і чим він відрізняється від захисного удару?", "Як змінюється положення ракетки при контрударі?", "Які види хватки ракетки ти знаєш?", "Чому під час гри використовують приставні кроки?"]}, {"n": "31", "t": "Подача «маятник» з різним обертанням. Як «читати» подачу суперника", "g": "Учень знатиме, як варіювати довжину і обертання подачі «маятник» та як розпізнавати обертання м'яча за рухом ракетки суперника.", "k": "Модулі: Настільний теніс", "terms": [["Коротка подача", "подача, після якої м'яч міг би двічі відскочити на половині суперника, якщо його не відбити."], ["Довга подача", "подача, яка відскакує біля задньої лінії суперника і виходить за край столу."], ["Читання обертання", "уміння визначити тип і силу обертання м'яча за рухом ракетки суперника та польотом м'яча."], ["Час реакції", "проміжок часу між появою сигналу (наприклад, удару суперника) і початком відповідного руху."]], "th": [{"h": "Настільний теніс. Варіанти подачі «маятник»", "p": ["Довжину подачі задає місце першого відскоку: щоб подача була короткою, м'яч має вперше відскочити ближче до сітки на своїй половині, а удар — бути м'яким. Для довгої подачі перший відскок — біля своєї задньої лінії, удар швидший.", "Поєднання коротких і довгих подач з різним обертанням не дає суперникові звикнути до одного варіанта. Найкраще працює однаковий замах і різниця лише в останньому русі кисті."], "ul": ["Коротка подача з нижнім обертом ускладнює атаку суперника.", "Довга швидка подача — для неочікуваної атаки.", "Тримай подачу низько над сіткою.", "Імітуй рух після контакту, щоб приховати справжнє обертання (у межах правил).", "Тренуй кожен варіант серіями по 10–15 подач."]}, {"h": "Настільний теніс. Розпізнавання обертання та швидкість реакції", "p": ["Обертання видно з руху ракетки в момент контакту: рух униз — нижній оберт, угору — верхній, убік — боковий. Також підказує політ м'яча: нижній оберт часто дає повільніший, «пливучий» м'яч, верхній — дугу, що різко пірнає вниз після сітки.", "У настільному тенісі м'яч долає стіл дуже швидко, тому час реакції має велике значення. Його можна тренувати вправами з сигналами, але не менш важливо передбачати: уважно стежити за суперником ще до удару."], "ul": ["Дивись на ракетку суперника, а не лише на м'яч.", "Не поспішай: краще надійний прийом, ніж ризикований удар.", "Якщо не зрозумів обертання — відповідай підрізкою з невеликим запасом висоти.", "Реакцію покращують ігри на сигнал і вправи з ловінням предметів.", "Втома погіршує реакцію — тому важлива загальна витривалість."]}], "f": "Через велику швидкість м'яча досвідчені тенісисти покладаються не лише на реакцію, а й на передбачення: вони «читають» позу і замах суперника ще до удару.", "pr": ["Склади таблицю: рух ракетки суперника (униз, угору, вбік) — тип обертання — як правильно прийняти м'яч.", "Виконай вправу на реакцію з членом родини: партнер тримає лінійку вертикально і без попередження відпускає її, а ти ловиш двома пальцями; 10 спроб, запиши, на якій позначці спіймав щоразу."], "q": ["Як зробити подачу короткою, а як довгою?", "За якими ознаками можна визначити тип обертання м'яча?", "Що таке час реакції і як його розвивати?", "Чому важливо використовувати різні подачі під час гри?"]}, {"n": "32", "t": "Накат справа та зліва по діагоналі: техніка, помилки, правила рахунку", "g": "Учень вмітиме аналізувати помилки в накатах і знатиме, як ведеться рахунок у настільному тенісі.", "k": "Модулі: Настільний теніс", "terms": [["Гейм", "частина зустрічі, яка триває до 11 очок за умови переваги щонайменше у два очки."], ["Матч", "зустріч гравців, яка складається з непарної кількості геймів, наприклад до трьох або чотирьох перемог."], ["Переграш", "розіграш, який не зараховується жодному гравцеві і повторюється, наприклад коли м'яч на подачі зачепив сітку і потрапив на поле суперника."], ["Перехід подачі", "порядок, за яким кожен гравець подає двічі поспіль, а за рахунку 10:10 — по одній подачі."]], "th": [{"h": "Настільний теніс. Типові помилки в накаті та їх виправлення", "p": ["Найчастіше м'яч після накату летить у сітку або за стіл. У сітку — коли ракетка надто закрита або рух іде вперед, а не вгору-вперед. За стіл — коли ракетка відкрита, удар надто сильний або виконаний пізно, на спаді м'яча.", "Друге джерело помилок — ноги. Якщо гравець не зробив кроку до м'яча, він тягнеться рукою, ламається лікоть, удар стає неточним."], "ul": ["М'яч у сітці — більше руху вгору, трохи відкрий ракетку.", "М'яч за столом — закрий ракетку, зменш силу.", "Удар — у верхній точці відскоку, не на спаді.", "Спочатку ноги, потім рука.", "Завершення руху — однакове в кожному ударі."]}, {"h": "Настільний теніс. Правила рахунку", "p": ["Гейм грається до 11 очок. Якщо рахунок 10:10, гра триває, доки хтось не здобуде перевагу у два очки. Кожен гравець подає по дві подачі, а після 10:10 — по одній. Після кожного гейму гравці міняються сторонами, а в останньому, вирішальному — також коли хтось набере 5 очок.", "Очко отримує суперник, якщо гравець не відбив м'яч, відбив його за стіл або в сітку, вдарив двічі, торкнувся столу вільною рукою, зрушив стіл або торкнувся сітки під час розіграшу."], "ul": ["Гейм — до 11 очок з різницею у 2.", "Подачі — по 2, при 10:10 — по 1.", "Сітка на подачі з влучанням у поле — переграш.", "Сітка під час розіграшу з влучанням — гра триває.", "М'яч, що зачепив край столу (ребро зверху), зараховується."]}], "f": "До 2001 року гейм у настільному тенісі тривав до 21 очка; перехід до 11 очок зробив розіграші напруженішими, а матчі — динамічнішими.", "pr": ["Розв'яжи письмово 3 ситуації: 1) рахунок 10:9, гравець виграв очко — що далі? 2) м'яч на подачі зачепив сітку й упав на поле суперника; 3) гравець торкнувся вільною рукою столу під час розіграшу.", "Виконай імітацію накату зліва перед дзеркалом: 3 серії по 15 повторень, перевіряючи положення ліктя і завершення руху."], "q": ["До скількох очок грається гейм?", "Як змінюється порядок подач при рахунку 10:10?", "Чому накат може потрапляти в сітку?", "У яких випадках гравець програє очко?"]}, {"n": "33", "t": "Комплекс спеціальних вправ тенісиста. Подачі «маятник», з нижнім і верхнім обертом", "g": "Учень знатиме, з яких вправ складається спеціальна підготовка тенісиста, і вмітиме пояснити, як поєднувати подачу з подальшою атакою.", "k": "Модулі: Настільний теніс", "terms": [["Спеціальна вправа", "вправа, яка за структурою руху схожа на ігрову дію і розвиває потрібні саме тенісистові якості."], ["Імітаційна вправа", "виконання руху удару без м'яча (з ракеткою або без), щоб закріпити правильну техніку."], ["Кистьовий рух", "швидкий рух кисті в кінці удару, що надає м'ячу обертання."], ["Третій удар", "перший атакувальний удар подавальника після прийому суперника: подача — прийом — третій удар."]], "th": [{"h": "Настільний теніс. Комплекс спеціальних вправ", "p": ["Спеціальні вправи тенісиста розвивають швидкість ніг, гнучкість кисті, координацію та рівновагу. Їх виконують у розминці або як окрему частину заняття. До комплексу належать: обертання кистей і передпліч, імітація ударів, переміщення в стійці, вправи на рівновагу на одній нозі, ловіння м'ячика однією рукою.", "Імітація корисна тим, що дозволяє виконати сотні правильних рухів без втоми від пошуку м'ячів. Виконуй її спочатку повільно, потім — у ігровому темпі."], "ul": ["Кругові рухи кистями — по 10 у кожен бік.", "Імітація накату справа і зліва — 2×15.", "Приставні кроки в стійці — 3×20 с.", "Стійка на одній нозі — по 30 с.", "Підкидання і ловіння тенісного м'ячика — 20 разів."]}, {"h": "Настільний теніс. Подача як початок атаки", "p": ["Подача — єдиний удар, який гравець виконує повністю за власним бажанням. Сильні гравці планують розіграш наперед: наприклад, коротка подача з нижнім обертом змушує суперника відповідати підрізкою, і подавальник отримує зручний м'яч для атаки третім ударом.", "Подача з верхнім обертом часто повертається вищою, але й суперник може відповісти атакою. Тому треба бути готовим до швидкого повернення в стійку."], "ul": ["Після подачі одразу повертайся в стійку.", "Плануй: яка подача — яка очікувана відповідь — твій удар.", "Нижній оберт — частіше повертається підрізкою.", "Верхній оберт — частіше повертається накатом.", "Маятник з різним обертанням заважає планувати суперникові."]}], "f": "Багато тренерів радять тенісистам виконувати десятки подач щодня, адже подачу можна тренувати навіть наодинці, без партнера.", "pr": ["Склади і запиши власний комплекс із 6 спеціальних вправ тенісиста (з дозуванням), які можна безпечно виконувати вдома.", "Виконай свій комплекс один раз і письмово оціни, які вправи давалися найважче."], "q": ["Які якості розвивають спеціальні вправи тенісиста?", "Для чого потрібні імітаційні вправи?", "Що таке третій удар?", "Як подача з нижнім обертом допомагає підготувати атаку?"]}, {"n": "34", "t": "Контрудари. Накат по діагоналі. Розіграш і енергозабезпечення в грі", "g": "Учень зрозуміє, як розподіляти удари між діагоналлю й лінією та як організм забезпечує енергією короткі інтенсивні розіграші.", "k": "Модулі: Настільний теніс", "terms": [["Розіграш", "серія ударів від подачі до моменту, коли один із гравців здобуває очко."], ["Лінія", "напрямок удару вздовж бокової лінії столу, паралельно до неї; коротший і ризикованіший за діагональ."], ["Анаеробне навантаження", "інтенсивна робота, під час якої м'язи отримують енергію без участі кисню; триває недовго і швидко втомлює."], ["Відновлення", "процес повернення організму до робочого стану після навантаження."]], "th": [{"h": "Настільний теніс. Контрудари: діагональ і лінія", "p": ["Стабільна гра по діагоналі дозволяє «втримати» розіграш, а несподіваний удар по лінії часто приносить очко, бо суперникові треба пробігти більшу відстань. Проте лінія коротша, тому для удару по ній потрібна точніша сила й кут ракетки.", "У контрударах важлива зміна ритму: кілька стабільних накатів по діагоналі — потім удар по лінії або в середину, під праве стегно суперника, де йому незручно вибрати між ударом справа і зліва."], "ul": ["Основа — діагональ, лінія — для завершення.", "Удар по лінії — з меншою силою, але точний.", "Середня зона суперника — ефективна ціль.", "Не змінюй напрямок на незручному м'ячі.", "Після удару по лінії чекай відповіді в інший кут."]}, {"h": "Настільний теніс. Фізіологія навантаження в грі", "p": ["Розіграш у настільному тенісі зазвичай триває кілька секунд, але дуже інтенсивний. У цей час працює переважно анаеробне енергозабезпечення: швидкі запаси енергії в м'язах. Пауза між розіграшами дає змогу частково відновитися, а аеробна витривалість (біг, плавання, велосипед) прискорює це відновлення.", "Саме тому тенісистам корисна загальна фізична підготовка: добре треноване серце і легені допомагають зберігати точність ударів до кінця матчу."], "ul": ["Короткі розіграші — анаеробна робота.", "Паузи і загальна витривалість — швидше відновлення.", "Під час паузи дихай глибоко і повільно.", "Пий воду невеликими ковтками між геймами.", "Втома проявляється спочатку в ногах і точності."]}], "f": "Навіть короткий розіграш у настільному тенісі може містити багато різких змін напрямку руху, тому ноги тенісиста працюють не менше, ніж рука.", "pr": ["Намалюй стіл і позначь три цілі для удару: діагональ, лінія, середина суперника; підпиши, коли доречна кожна ціль.", "Виконай інтервальну вправу: 20 секунд швидких рухів у стійці на місці (зміна ваги з ноги на ногу) — 40 секунд відпочинку, 5 повторень; запиши пульс після останнього підходу і через 2 хвилини."], "q": ["Чим удар по лінії відрізняється від удару по діагоналі?", "Чому удар у середню зону суперника ефективний?", "Що таке анаеробне навантаження?", "Як загальна витривалість допомагає тенісистові?"]}, {"n": "35", "t": "Спеціальні вправи тенісиста: гра «в тінь». Подачі з нижнім та верхнім обертом: тактика", "g": "Учень знатиме, як тренуватися методом гри «в тінь», і вмітиме обирати місце подачі на столі відповідно до тактичного задуму.", "k": "Модулі: Настільний теніс", "terms": [["Гра «в тінь»", "виконання ударів і переміщень без м'яча, ніби під час справжнього розіграшу."], ["Багатом'ячове тренування", "вправа, у якій тренер або партнер швидко подає м'ячі один за одним із кошика, а гравець відпрацьовує удар."], ["Зона подачі", "частина столу суперника, куди спрямовують подачу: короткий кут, середина, довгий кут."], ["Стабільність", "здатність багато разів поспіль виконати дію без помилки."]], "th": [{"h": "Настільний теніс. Гра «в тінь» і багатом'ячове тренування", "p": ["Гра «в тінь» — улюблена вправа тенісистів для самостійних занять. Гравець уявляє розіграш: подача, крок, накат справа, крок ліворуч, накат зліва — і виконує все в повну силу, але без м'яча. Так закріплюються зв'язки між ногами і руками.", "У залі використовують багатом'ячове тренування: партнер швидко подає м'ячі з кошика, і за кілька хвилин гравець виконує десятки ударів. Для дому найкраще підходить саме гра «в тінь»."], "ul": ["Тривалість серії — 20–30 с, відпочинок — 30–60 с.", "Кожен удар — з поверненням у стійку.", "Уявляй конкретного суперника і напрямки.", "Спочатку повільно, потім у ігровому темпі.", "Стеж, щоб навколо було вільне місце."]}, {"h": "Настільний теніс. Тактика подач з нижнім і верхнім обертом", "p": ["Подачі розміщують у різні зони: короткий м'яч під праву руку суперника ускладнює атаку, довгий у лівий кут змушує бити зліва, швидкий м'яч у середину — обирати удар в останній момент.", "Подачу з нижнім обертом найчастіше роблять короткою, щоб суперник не міг атакувати. Подачу з верхнім обертом — частіше довгою і швидкою, щоб застати суперника зненацька."], "ul": ["Чергуй довжину і напрямок подач.", "Запам'ятовуй, на які подачі суперник помиляється.", "Не подавай двічі однаково, якщо це не тактичний задум.", "Коротка подача — низько, з другим відскоком на столі суперника.", "Довга подача — швидко, глибоко, біля задньої лінії."]}], "f": "Гру «в тінь» використовують не лише тенісисти, а й боксери та бадмінтоністи: це спосіб тренувати техніку там, де немає партнера чи інвентарю.", "pr": ["Виконай 4 серії гри «в тінь» по 20 секунд з відпочинком 40 секунд: подача — накат справа — крок — накат зліва; потім опиши, на чому зосереджувався.", "Намалюй стіл, поділи половину суперника на 6 зон і для кожної подачі (коротка з нижнім, довга з верхнім, маятник) познач, куди її варто спрямувати."], "q": ["Що таке гра «в тінь» і чим вона корисна?", "Як проводять багатом'ячове тренування?", "Куди найчастіше спрямовують коротку подачу з нижнім обертом і чому?", "Чому важливо чергувати подачі?"]}, {"n": "36", "t": "Прийом подачі з нижнім обертанням: скидка, довга підрізка, флік", "g": "Учень знатиме основні способи прийому подачі з нижнім обертанням і вмітиме обрати доречний варіант залежно від довжини подачі.", "k": "Модулі: Настільний теніс", "terms": [["Скидка", "м'який короткий прийом, після якого м'яч падає біля сітки і двічі відскочив би на половині суперника."], ["Довга підрізка", "прийом з нижнім обертом, який відправляє м'яч глибоко, до задньої лінії суперника."], ["Флік", "швидкий атакувальний удар кистю над столом по короткому м'ячу."], ["Вибір прийому", "рішення гравця, як відповісти на подачу, залежно від її довжини, обертання і стилю суперника."]], "th": [{"h": "Настільний теніс. Три способи прийняти нижнє обертання", "p": ["Скидка — найобережніший прийом: ракетка відкрита, рух дуже короткий, м'яч ледь «підкидається» через сітку. Вона не дає суперникові атакувати. Довга підрізка — швидший рух уперед-униз, м'яч летить низько і глибоко, змушуючи суперника відійти від столу.", "Флік — активний варіант для впевнених гравців: крок під стіл, ракетка трохи відкрита, різкий рух кисті вперед-угору. Він ризикованіший, але забирає в подавальника ініціативу."], "ul": ["Коротка подача — скидка або флік.", "Довга подача — довга підрізка або атака накатом/топ-спіном.", "Перед прийомом — крок ногою під стіл.", "Ракетка готова над столом, а не внизу.", "Помилка — високий прийом, який легко атакувати."]}, {"h": "Настільний теніс. Безпека і підготовка ніг до прийому", "p": ["Під час прийому коротких подач гравець робить глибокий випад під стіл. Щоб уникнути травм коліна і гомілкостопа, коліно має бути над стопою, а не заходити всередину. Спеціальні стрибкові вправи і випади в розминці готують суглоби до такого руху.", "Не нахиляйся надто низько над столом — легко вдаритися головою об край або ракетку суперника в парній грі."], "ul": ["Випад — коліно над стопою.", "Після прийому швидко поверніться назад у стійку.", "Розминай гомілкостоп і колінні суглоби.", "Взуття має добре фіксувати стопу."]}], "f": "Слово «флік» походить від англійського flick — швидкий рух кистю, клацання.", "pr": ["Склади схему-підказку: подача (коротка/довга з нижнім обертом) — який прийом обрати — куди спрямувати м'яч.", "Виконай 3 серії по 8 повільних випадів уперед на кожну ногу, стежачи, щоб коліно не виходило за носок і не заходило всередину."], "q": ["Чим скидка відрізняється від довгої підрізки?", "Що таке флік і коли його використовують?", "Як правильно виконувати випад під стіл, щоб не травмуватися?", "Яка відповідь на нижнє обертання найнебезпечніша для себе?"]}, {"n": "37", "t": "Контрудари і накат по діагоналі. Основи суддівства в настільному тенісі", "g": "Учень удосконалить уявлення про контрудари в ігровому темпі й знатиме обов'язки судді та порядок оголошення рахунку.", "k": "Модулі: Настільний теніс", "terms": [["Суддя за столом", "особа, яка стежить за дотриманням правил під час зустрічі, оголошує рахунок і приймає рішення щодо кожного розіграшу."], ["Оголошення рахунку", "повідомлення рахунку вголос перед кожною подачею: першим називають рахунок гравця, який подає."], ["Порушення подачі", "подача з помилкою (м'яч прихований, підкинутий менше ніж на 16 см, не з відкритої долоні), за яку суперник отримує очко."], ["Ігровий темп", "швидкість обміну ударами, наближена до справжньої гри."]], "th": [{"h": "Настільний теніс. Контрудари в ігровому темпі", "p": ["На тренуванні контрудари спочатку виконують у помірному темпі, а потім — у ігровому. Чим швидший обмін, тим коротший замах і тим важливіше вчасно повертатися в стійку. Сила удару з'являється не від руки, а від повороту тулуба і роботи ніг.", "Корисна вправа: обидва гравці накатують по діагоналі, рахуючи вголос кількість ударів без помилки. Ціль — поступово збільшувати серію."], "ul": ["Тримай ракетку перед тулубом між ударами.", "Не відходь від столу далі, ніж потрібно.", "Стеж за м'ячем до моменту контакту.", "Рахуй серію — це мотивує до стабільності.", "Втома — сигнал зменшити темп, а не ламати техніку."]}, {"h": "Настільний теніс. Суддівство", "p": ["У навчальних і шкільних змаганнях суддя стоїть або сидить біля сітки збоку від столу. Він оголошує рахунок, стежить за правильністю подач, за порядком подач і сторонами, вирішує спірні розіграші. Рахунок оголошують перед кожною подачею, першим — рахунок подавальника.", "Суддя показує жестами, хто виграв очко, і зупиняє гру, якщо щось заважає (наприклад, на поле закотився чужий м'яч). У такій ситуації розіграш повторюється."], "ul": ["Рахунок — першим називають рахунок подавальника.", "Стежить за правильністю подач.", "Фіксує зміну сторін і порядок подач.", "Зупиняє гру, якщо заважає зовнішня перешкода.", "Гравці поважають рішення судді."]}], "f": "На великих змаганнях за столом працюють двоє суддів: суддя і його помічник, який, зокрема, допомагає оцінювати правильність подач.", "pr": ["Уяви, що ти суддя: запиши, що ти скажеш і зробиш у трьох ситуаціях — неправильне підкидання м'яча на подачі, сторонній м'яч на полі, рахунок 10:10.", "Виконай імітацію контрударів справа: 3 серії по 20 швидких коротких рухів, з поверненням ракетки в положення перед тулубом після кожного."], "q": ["Які обов'язки має суддя за столом?", "Чий рахунок оголошують першим?", "Як змінюється техніка накату при переході до ігрового темпу?", "Що відбувається, якщо під час розіграшу на поле закотився чужий м'яч?"]}, {"n": "38", "t": "Подача «маятник». Подачі з нижнім, верхнім і боковим обертом. Правила чесної подачі", "g": "Учень знатиме, як отримати бокове обертання, і розумітиме, які дії під час подачі заборонені правилами.", "k": "Модулі: Настільний теніс", "terms": [["Бокове обертання", "обертання м'яча навколо вертикальної осі, через яке він відхиляється вліво або вправо після відскоку від ракетки."], ["Приховування подачі", "заборонена дія, коли гравець закриває м'яч від суперника тілом, одягом або вільною рукою під час подачі."], ["Обманний рух", "рух ракеткою до або після контакту з м'ячем, який заважає суперникові визначити справжнє обертання."], ["Підкидання", "підйом м'яча з відкритої долоні майже вертикально вгору перед ударом під час подачі."]], "th": [{"h": "Настільний теніс. Бокове обертання в подачі «маятник»", "p": ["Якщо ракетка під час маятника ковзає по боковій частині м'яча, він отримує бокове обертання. Після відскоку від ракетки суперника такий м'яч відлітає вбік. Щоб прийняти його, ракетку повертають, компенсуючи обертання: якщо м'яч крутиться в один бік, ракетку спрямовують трохи в протилежний.", "На практиці чисте бокове обертання трапляється рідко — частіше поєднане з нижнім або верхнім."], "ul": ["Нижньо-бокове — ракетка ковзає знизу і збоку.", "Верхньо-бокове — збоку і зверху.", "Однаковий замах — різний контакт.", "Прийом бокового обертання — корекція кута ракетки.", "Тренуй по 10 подач кожного виду."]}, {"h": "Настільний теніс. Правила чесної подачі", "p": ["Сучасні правила вимагають, щоб суперник бачив м'яч протягом усієї подачі: від підкидання до удару. Вільну руку після підкидання треба прибрати з простору між м'ячем і сіткою. Обманні рухи ракеткою дозволені, якщо м'яч залишається видимим.", "Якщо суддя вважає подачу сумнівною, він може попередити гравця, а за явне порушення — присудити очко супернику."], "ul": ["М'яч — на відкритій нерухомій долоні.", "Підкидання — майже вертикально, щонайменше 16 см.", "Удар — по м'ячу, що падає.", "М'яч увесь час видимий для суперника.", "Вільна рука одразу відводиться вбік."]}], "f": "Правило про заборону приховувати м'яч під час подачі запровадили на початку 2000-х років, щоб розіграші стали чеснішими й цікавішими для глядачів.", "pr": ["Намалюй м'яч і стрілками покажи напрямок обертання для нижнього, верхнього та бокового обертання; підпиши, як кожне впливає на політ.", "Потренуй підкидання: тримай тенісний (або інший легкий) м'ячик на відкритій долоні й підкидай вертикально вгору на висоту приблизно 20–30 см, ловлячи його, — 3 серії по 10 разів."], "q": ["Як отримати бокове обертання під час подачі «маятник»?", "Як треба поставити ракетку, приймаючи м'яч з боковим обертанням?", "Чому заборонено приховувати м'яч під час подачі?", "Які обманні рухи дозволені правилами?"]}, {"n": "39", "t": "Топ-спін. Підрізка справа: техніка атаки й захисту", "g": "Учень знатиме техніку топ-спіну і підрізки справа та розумітиме їх роль в атакувальній і захисній грі.", "k": "Модулі: Настільний теніс", "terms": [["Топ-спін", "атакувальний удар із сильним верхнім обертом, який виконують швидким рухом ракетки знизу вгору-вперед по м'ячу."], ["Підрізка справа", "захисний удар з правого боку, яким ракетка рухається зверху вниз-уперед під м'яч, надаючи йому нижнього обертання."], ["Дуга польоту", "траєкторія м'яча над сіткою; топ-спін має високу дугу, яка різко знижується після сітки."], ["Захисний стиль", "манера гри, за якої гравець відходить від столу і повертає атаки суперника переважно підрізками."]], "th": [{"h": "Настільний теніс. Топ-спін", "p": ["Топ-спін — найпоширеніший атакувальний удар у сучасному тенісі. Замах — ракетка опущена нижче рівня м'яча, корпус повернутий, вага на правій нозі (для правші). Удар — швидкий рух уперед-угору з поворотом тулуба і перенесенням ваги на ліву ногу; ракетка закрита, контакт ковзний, тонкий.", "Завдяки сильному обертанню м'яч летить по дузі, «пірнає» після сітки і далі різко прискорюється після відскоку. Суперникові складно контролювати такий м'яч."], "ul": ["Більше рух угору — більше обертання.", "Більше рух уперед — більше швидкості.", "Удар у верхній точці або на початку спаду м'яча.", "Працюють ноги, тулуб і кисть разом.", "Помилка — пряма рука і удар без повороту корпусу."]}, {"h": "Настільний теніс. Підрізка справа", "p": ["Підрізка справа — захисний удар, який виконують далі від столу. Ракетка піднімається приблизно до рівня плеча, далі рух униз-уперед під м'яч, ракетка відкрита. М'яч отримує нижнє обертання і повертається низько та повільно.", "Підрізкою відповідають на топ-спіни суперника: верхнє обертання м'яча «перетворюється» на нижнє, і атакувальникові доводиться знову піднімати м'яч."], "ul": ["Удар на спаді м'яча, збоку від тіла.", "Ракетка відкрита, рух зверху вниз-уперед.", "Після удару — повернення в захисну позицію.", "Не бий по м'ячу різко — головне контроль.", "Вага переноситься з правої ноги на ліву."]}, {"h": "Настільний теніс. Безпека під час ударів з великою амплітудою", "p": ["Топ-спін і підрізка мають широкий замах, тому між столами має бути достатньо місця. Перед ударом переконайся, що поряд нікого немає.", "Великі обертальні рухи навантажують плечовий суглоб і поперек, тому перед такими вправами обов'язкова розминка плечей і тулуба."], "ul": ["Дистанція між гравцями сусідніх столів — безпечна.", "Розминка плечей: кругові рухи, махи руками.", "Обертання тулуба — плавно.", "Не роби топ-спін «на холодну»."]}], "f": "Сучасні м'ячі діаметром 40 мм виготовляють із пластику; вони трохи повільніші й менше обертаються, ніж давніші целулоїдні.", "pr": ["Опиши письмово, чим відрізняються топ-спін і підрізка справа: напрямок руху ракетки, положення ракетки, тип обертання, відстань від столу.", "Виконай розминку плечового пояса (кругові рухи руками вперед і назад, обертання тулуба) і 3 серії по 10 повільних імітацій топ-спіну справа."], "q": ["Як виконується топ-спін справа?", "Чому м'яч після топ-спіну важко прийняти?", "Як підрізка справа змінює обертання м'яча?", "Що таке захисний стиль гри?"]}, {"n": "40", "t": "Накат справа та зліва по діагоналі. Стабільність і самоконтроль на тренуванні", "g": "Учень знатиме, як розвивати стабільність накатів, і вмітиме вести щоденник самоконтролю.", "k": "Модулі: Настільний теніс", "terms": [["Серія ударів", "кількість ударів, виконаних поспіль без помилки під час вправи."], ["Самоконтроль", "регулярне спостереження за станом свого здоров'я, самопочуттям і результатами тренувань."], ["Щоденник тренувань", "записи про виконані вправи, навантаження, пульс і самопочуття."], ["Об'єктивні показники", "дані, які можна виміряти: пульс, маса тіла, кількість повторень, час."]], "th": [{"h": "Настільний теніс. Стабільність накатів", "p": ["Стабільність — головна якість у накатах: перемагає той, хто помиляється рідше. Щоб її розвивати, ставлять конкретну ціль: наприклад, 20 накатів справа по діагоналі без помилки, потім 20 — зліва, потім чергування.", "Стабільність тримається на трьох речах: постійне положення тіла, однакова точка удару і завершення руху. Якщо щось одне змінюється — з'являються помилки."], "ul": ["Ціль серії — реальна, але трохи вища за поточний рівень.", "Помилка — спокійно почни заново.", "Однакова точка удару — у верхній точці відскоку.", "Темп помірний, швидкість — після стабільності.", "Порівнюй результати з попередніми заняттями."]}, {"h": "Настільний теніс. Самоконтроль і щоденник", "p": ["Самоконтроль допомагає зрозуміти, чи навантаження корисне, чи вже надмірне. Суб'єктивні показники — самопочуття, сон, апетит, бажання тренуватися. Об'єктивні — пульс у спокої вранці, пульс після навантаження, результати вправ.", "Якщо пульс у спокої кілька днів поспіль помітно вищий за звичний, сон погіршився, а бажання тренуватися зникло — це ознаки перевтоми. Варто зменшити навантаження і порадитися з учителем або лікарем."], "ul": ["Щоранку вимірюй пульс у спокої.", "Записуй вправи, тривалість і самопочуття.", "Оцінюй сон і настрій за простою шкалою.", "Помічай біль у суглобах і не ігноруй його.", "Перевтома — привід для відпочинку."]}], "f": "Пульс у спокої зазвичай вимірюють уранці, одразу після пробудження, ще лежачи в ліжку — тоді він найбільш показовий.", "pr": ["Розлінуй сторінку щоденника тренувань на 7 днів із колонками: дата, пульс уранці, вправи, тривалість, самопочуття, сон; заповни перший день.", "Виконай імітацію накату справа і зліва по черзі: 4 серії по 20 рухів, намагаючись робити кожен рух однаково; зазнач у щоденнику, що вдавалося найкраще."], "q": ["Від чого залежить стабільність накатів?", "Які показники самоконтролю є суб'єктивними, а які об'єктивними?", "Які ознаки свідчать про перевтому?", "Навіщо вести щоденник тренувань?"]}, {"n": "41", "t": "Прийом подачі з нижнім обертанням. Правила парної гри", "g": "Учень удосконалить знання про прийом нижнього обертання і знатиме особливості правил парної гри в настільному тенісі.", "k": "Модулі: Настільний теніс", "terms": [["Парна гра", "зустріч, у якій з кожного боку столу грають по двоє гравців."], ["Черговість ударів", "правило парної гри, за яким партнери відбивають м'яч строго по черзі."], ["Центральна лінія", "біла лінія, що ділить стіл уздовж на дві половини; у парній грі визначає зону подачі."], ["Порядок прийому", "встановлена послідовність, за якою кожен гравець пари приймає подачу певного суперника."]], "th": [{"h": "Настільний теніс. Правила парної гри", "p": ["У парній грі подача виконується по діагоналі: з правої половини свого столу в праву половину столу суперників. Далі партнери б'ють по м'ячу строго по черзі: подавальник, приймальник, партнер подавальника, партнер приймальника і так далі. Якщо гравець ударив не у свою чергу — очко втрачено.", "Після кожних двох подач подає інший гравець за встановленим порядком, і змінюється приймальник."], "ul": ["Подача — тільки з правої половини в праву половину.", "Удари — по черзі, незалежно від того, куди летить м'яч.", "Після удару звільни місце партнерові.", "Домовляйтеся про подачі знаками під столом.", "Пари часто складають з гравців з різною сильною рукою."]}, {"h": "Настільний теніс. Прийом нижнього обертання в парі", "p": ["Оскільки в парі подача завжди йде в праву половину, приймальник знає, куди полетить м'яч, і може зайняти зручну позицію. Головне завдання прийому — дати партнерові зручний м'яч або ускладнити атаку суперникам.", "Скидка або коротка підрізка заважають суперникові атакувати, а довга низька підрізка дає партнерові час підготуватися."], "ul": ["Приймальник стоїть ближче до правої половини.", "Після прийому одразу відходь убік.", "Враховуй, хто з суперників б'є наступним.", "Обговорюйте тактику перед геймом.", "Безпека — стежте, щоб не зіткнутися ракетками."]}], "f": "Парна гра в настільному тенісі входить до програми великих змагань, зокрема Олімпійських ігор, де розігрують медалі і в змішаних парах.", "pr": ["Намалюй схему столу для парної гри, підпиши зону подачі й стрілками покажи порядок ударів чотирьох гравців.", "Склади 3 умовні знаки, якими партнери могли б домовлятися про подачу, і поясни їх письмово."], "q": ["Як виконується подача в парній грі?", "Що відбувається, якщо гравець ударив не у свою чергу?", "Яке завдання має прийом подачі в парній грі?", "Чому партнерам важливо звільняти місце біля столу?"]}, {"n": "42", "t": "Контрудари і накат по діагоналі. Стилі гри та фізичні якості тенісиста", "g": "Учень знатиме основні стилі гри в настільному тенісі та фізичні якості, які потрібно розвивати для успішних контрударів.", "k": "Модулі: Настільний теніс", "terms": [["Стиль гри", "характерна для гравця манера ведення розіграшу: атакувальна, захисна або комбінована."], ["Атакувальник", "гравець, який прагне першим перейти в атаку і виграти очко сильними ударами з верхнім обертом."], ["Координація", "здатність узгоджено керувати рухами різних частин тіла."], ["Спритність", "уміння швидко і точно змінювати рухи відповідно до ситуації."]], "th": [{"h": "Настільний теніс. Стилі гри", "p": ["Атакувальники грають близько до столу, багато використовують накати, контрудари й топ-спіни. Захисники відходять від столу і повертають м'ячі підрізками, чекаючи помилки суперника або зручної нагоди для контратаки. Комбінований стиль поєднує обидва підходи.", "Знаючи стиль суперника, легше обрати тактику: проти атакувальника корисно грати коротко і з нижнім обертом, проти захисника — терпляче готувати атаку і змінювати обертання."], "ul": ["Атакувальник — близько до столу, швидкі удари.", "Захисник — далеко від столу, підрізки.", "Комбінований стиль — гнучкість.", "Проти атакувальника — короткі м'ячі.", "Проти захисника — терпіння і зміна обертання."]}, {"h": "Настільний теніс. Фізичні якості для контрударів", "p": ["Контрудари вимагають швидкості реакції, координації та спритності. Гравець має за частку секунди оцінити м'яч, зробити крок і виконати удар. Координацію розвивають вправами з м'ячиками, жонглюванням, вправами на рівновагу.", "Сила ніг і корпусу допомагає бити потужно без зайвого навантаження на руку. Для цього підходять присідання, випади, планка."], "ul": ["Реакція — ігри на сигнал, ловіння предметів.", "Координація — жонглювання, вправи двома руками.", "Сила ніг — присідання, випади.", "Корпус — планка, бокова планка.", "Гнучкість — розтягування плечей і стегон."]}], "f": "У настільному тенісі немає єдиного «правильного» стилю: на найвищому рівні успішно грають і атакувальники, і захисники.", "pr": ["Визнач, який стиль гри тобі ближчий, і письмово поясни чому, назвавши 3 свої сильні сторони і 2 якості, які варто розвинути.", "Виконай комплекс: 3×12 присідань, 3×20 с планки, 3×10 підкидань і ловінь м'ячика почергово правою і лівою рукою."], "q": ["Які стилі гри в настільному тенісі ти знаєш?", "Як грати проти захисника?", "Які фізичні якості потрібні для контрударів?", "Якими вправами можна розвивати координацію?"]}, {"n": "43", "t": "Подачі «маятник», з нижнім і верхнім обертом. Планування тренування подач", "g": "Учень вмітиме скласти план тренування подач і знатиме, як поєднувати різні подачі в тактичну систему.", "k": "Модулі: Настільний теніс", "terms": [["Серія подач", "кількість подач одного виду, виконаних поспіль із визначеною ціллю."], ["Тактичний план", "заздалегідь продумана послідовність дій у розіграші або грі проти конкретного суперника."], ["Варіативність", "здатність виконувати одну дію в різних варіантах: за силою, напрямком і обертанням."], ["Цільова зона", "обмежена ділянка столу, у яку треба влучити під час вправи."]], "th": [{"h": "Настільний теніс. Як тренувати подачі", "p": ["Подачі можна тренувати самостійно: потрібні стіл, кошик м'ячів і мішені. На столі позначають цільові зони (аркуш паперу або коло), і гравець виконує серії подач, рахуючи влучання. Так тренування стає вимірюваним.", "Добрий план тренування подач: 5 хв розминки кисті і плечей, по 2–3 серії кожної подачі по 10 повторень, наприкінці — випадкове чергування подач, як у грі."], "ul": ["Кожну подачу — окремими серіями.", "Рахуй влучання в цільову зону.", "Записуй відсоток успішних подач.", "Наприкінці — подачі в довільному порядку.", "Не тренуй подачі, коли рука вже втомлена."]}, {"h": "Настільний теніс. Система подач", "p": ["Сильний гравець має не одну, а кілька подач, які схожі на початку, але різні за результатом. Наприклад, маятник з нижньо-боковим і верхньо-боковим обертом виглядає майже однаково, але вимагає зовсім різного прийому.", "До кожної подачі варто мати план на третій удар: куди найчастіше повертається м'яч і як його атакувати."], "ul": ["2–3 основні подачі, виконані надійно.", "Схожий замах, різне обертання.", "Короткі і довгі подачі в різні кути.", "Під кожну подачу — готовий наступний удар.", "Аналізуй, які подачі приносять очки."]}], "f": "Деякі провідні тенісисти мають по кілька десятків варіантів подач, які відрізняються лише деталями руху кисті.", "pr": ["Склади письмовий план тренування подач на 30 хвилин із серіями, кількістю повторень і цільовими зонами.", "Придумай власну систему з трьох подач: опиши кожну (вид, обертання, напрямок) і що ти робитимеш третім ударом."], "q": ["Як зробити тренування подач вимірюваним?", "Що таке варіативність подачі?", "Чому корисно мати кілька подач зі схожим замахом?", "Як пов'язані подача і третій удар?"]}, {"n": "44", "t": "Топ-спін проти нижнього і верхнього обертання. Підрізка справа: дистанція і контроль", "g": "Учень розумітиме, як змінюється техніка топ-спіну залежно від обертання м'яча, і знатиме, як контролювати підрізку справа.", "k": "Модулі: Настільний теніс", "terms": [["Топ-спін по нижньому обертанню", "атакувальний удар по м'ячу з нижнім обертом, що потребує більшого руху вгору і відкритішої ракетки."], ["Топ-спін по верхньому обертанню", "удар по м'ячу з верхнім обертом, за якого ракетка закрита сильніше, а рух спрямований більше вперед."], ["Ближня зона", "позиція гравця на відстані до одного метра від столу."], ["Дальня зона", "позиція гравця на відстані кількох метрів від столу, звичайна для захисника."]], "th": [{"h": "Настільний теніс. Топ-спін залежно від обертання м'яча", "p": ["Якщо м'яч прийшов з нижнім обертанням, він «тягне» ракетку вниз, тому треба більше піднімати м'яч: ракетка майже вертикальна, рух переважно знизу вгору, удар трохи повільніший. Якщо м'яч прийшов з верхнім обертом, він сам відскакує вгору, тому ракетку закривають і спрямовують рух більше вперед.", "Типова помилка новачків — однаковий рух для будь-якого м'яча. Через це по нижньому обертанню м'яч летить у сітку, а по верхньому — за стіл."], "ul": ["Нижній оберт — більше вгору, ракетка відкритіша.", "Верхній оберт — більше вперед, ракетка закрита.", "Згинай ноги нижче для топ-спіну по підрізці.", "Не поспішай із замахом.", "Тренуйте з партнером: підрізка — топ-спін."]}, {"h": "Настільний теніс. Підрізка справа: дистанція і контроль", "p": ["Захисник з підрізкою грає з середньої або дальньої зони: так у нього більше часу. Але далеко від столу треба робити більші кроки й уміти швидко повертатися до столу на короткі м'ячі.", "Контроль досягається плавним рухом і правильним кутом ракетки. Сильніший топ-спін суперника — пряміший і коротший рух, щоб м'яч не злетів угору."], "ul": ["Дальня зона — більше часу, але більші переміщення.", "Удар на спаді, збоку від тулуба.", "Плавний рух — головне.", "Після удару — готовність до короткого м'яча.", "Зміна ритму підрізок заважає атакувальникові."]}], "f": "Обмін «топ-спін — підрізка» між атакувальником і захисником може тривати досить довго і вважається одним із найвидовищніших у настільному тенісі.", "pr": ["Склади таблицю: обертання м'яча, що прийшов (нижній/верхній) — положення ракетки при топ-спіні — напрямок руху — типова помилка.", "Виконай 3 серії по 10 імітацій топ-спіну «по нижньому обертанню» з низьким згинанням ніг і 3 серії по 10 — «по верхньому», порівняй відчуття і запиши."], "q": ["Як змінюється топ-спін, якщо м'яч прийшов з нижнім обертанням?", "Чому новачки при топ-спіні по підрізці часто б'ють у сітку?", "Які переваги і недоліки гри в дальній зоні?", "Як контролювати підрізку проти сильного топ-спіну?"]}, {"n": "45", "t": "Накат справа та зліва по діагоналі. Профілактика травм і відновлення тенісиста", "g": "Учень знатиме найпоширеніші перевантаження в настільному тенісі та способи їх профілактики й відновлення.", "k": "Модулі: Настільний теніс", "terms": [["Перевантаження", "стан, коли навантаження на м'язи, суглоби або зв'язки перевищує їхню здатність відновлюватися."], ["Профілактика травм", "заходи, що зменшують ризик травм: розминка, правильна техніка, дозування навантаження, відпочинок."], ["Гідратація", "підтримання достатньої кількості рідини в організмі під час фізичної активності."], ["Розтягування", "вправи для збільшення рухливості в суглобах і еластичності м'язів."]], "th": [{"h": "Настільний теніс. Накат по діагоналі без перевантажень", "p": ["Під час тривалих серій накатів найбільше навантаження отримують плечовий суглоб, лікоть, зап'ястя і поперек. Якщо удар виконується лише рукою, без ніг і тулуба, ризик перевантаження зростає. Правильна техніка — це не лише точність, а й захист здоров'я.", "Накат зліва особливо навантажує передпліччя і зап'ястя, тому хват не повинен бути надто тугим."], "ul": ["Удар починається з ніг і тулуба.", "Хват вільний, стискання — лише в момент удару.", "Чергуй вправи справа і зліва.", "Біль у лікті чи зап'ясті — привід зупинитися.", "Збільшуй тривалість серій поступово."]}, {"h": "Настільний теніс. Відновлення і профілактика", "p": ["Відновлення починається одразу після тренування: заминка, розтягування плечей, передпліч, стегон і литок. Важливі сон, повноцінне харчування і достатня кількість води. Під час гри варто пити невеликими ковтками в перервах між геймами.", "Для профілактики корисні вправи, що зміцнюють м'язи-стабілізатори плеча і корпусу, а також вправи на гнучкість."], "ul": ["Заминка 5–10 хв після кожного заняття.", "Розтягування — плавно, без ривків, по 20–30 с.", "Пий воду до, під час і після тренування.", "Сон — головний засіб відновлення.", "Зміцнюй корпус: планка, бокова планка."]}], "f": "Багато травм у ракеткових видах спорту виникає не від падінь, а від тривалого повторення одного й того самого руху з неправильною технікою.", "pr": ["Склади комплекс заминки з 6 вправ на розтягування для тенісиста (плечі, передпліччя, спина, стегна, литки) з часом утримання; виконай його.", "Опиши письмово 4 способи запобігти перевантаженню плеча і зап'ястя під час накатів."], "q": ["Які частини тіла найбільше навантажуються під час накатів?", "Чому удар лише рукою небезпечний для здоров'я?", "Які засоби відновлення ти знаєш?", "Як правильно пити воду під час гри?"]}, {"n": "46", "t": "Подачі з нижнім та верхнім обертом. Підготовка до нормативу з подачі", "g": "Учень повторить техніку подач з нижнім і верхнім обертом та знатиме, як готуватися до контрольного нормативу з подачі.", "k": "Модулі: Настільний теніс", "terms": [["Нижньо-бокове обертання", "поєднання нижнього і бокового обертання, за якого м'яч одночасно гальмує і відхиляється вбік."], ["Контрольний норматив", "завдання, за яким оцінюють рівень володіння технікою або фізичною якістю."], ["Точність подачі", "здатність спрямувати м'яч у задану зону столу суперника."], ["Передстартова підготовка", "дії перед виконанням тесту чи гри: розминка, налаштування, кілька пробних спроб."]], "th": [{"h": "Настільний теніс. Повторення подач з нижнім і верхнім обертом", "p": ["Подача з нижнім обертом: ракетка відкрита, рух уперед-униз, контакт з нижньою частиною м'яча. Подача з верхнім обертом: ракетка закрита, рух уперед-угору, контакт з верхньою або задньою частиною. Перехід до нижньо-бокового обертання — додай до руху під м'яч рух убік, як у маятнику.", "Перевір себе: м'яч з нижнім обертом після відскоку на столі суперника має «зупинятися», з верхнім — прискорюватися."], "ul": ["Кожна подача — з правильним підкиданням.", "Перший відскок на своїй половині.", "Низько над сіткою.", "Нижньо-бокове — рух під м'яч і вбік.", "Повертайся в стійку після подачі."]}, {"h": "Настільний теніс. Як готуватися до нормативу", "p": ["Норматив перевіряє не одну вдалу спробу, а стабільність. Тому готуються серіями: на кожному занятті — кілька серій тієї подачі, яку здаватимеш, з підрахунком вдалих спроб. Так ти побачиш свій реальний рівень.", "Перед здаванням зроби повну розминку, кілька пробних подач і зосередься. Помилку не варто переживати — краще спокійно виконати наступну спробу."], "ul": ["Тренуйся серіями з підрахунком вдалих спроб.", "Порівнюй результат з попередніми заняттями.", "Перед тестом — розминка кисті і плечей.", "Одна спроба — один чіткий план.", "Після помилки — вдих, пауза, нова спроба."]}], "f": "Спортсмени часто мають власний ритуал перед подачею — певну кількість відскоків м'яча чи вдих, — щоб кожна подача починалася однаково спокійно.", "pr": ["Склади план підготовки до нормативу з подачі з нижньо-боковим обертанням на 3 заняття: що, скільки разів і як рахувати результат.", "Виконай імітацію подачі «маятник» з нижньо-боковим обертом перед дзеркалом: 3 серії по 10, перевіряючи підкидання (уявне) і напрямок руху ракетки."], "q": ["Чим відрізняється рух ракетки під час подач з нижнім і верхнім обертом?", "Як отримати нижньо-бокове обертання?", "Чому норматив перевіряє стабільність, а не одну спробу?", "Що робити після невдалої спроби під час тесту?"]}, {"n": "47", "t": "Контрольний норматив: подача з нижнім боковим обертанням. Контрудари і накат по діагоналі", "g": "Учень знатиме, як правильно виконати контрольну подачу з нижнім боковим обертанням і як оцінити свій результат, а також повторить контрудари.", "k": "Модулі: Настільний теніс", "terms": [["Залікова спроба", "спроба під час контрольного нормативу, результат якої враховується в оцінці."], ["Помилка подачі", "подача, після якої м'яч не потрапив на стіл суперника, зачепив сітку без влучання або виконана з порушенням правил."], ["Самооцінка", "аналіз власного результату: що вдалося, що ні і над чим працювати далі."], ["Критерії оцінювання", "ознаки, за якими вчитель оцінює виконання вправи: правильність техніки, обертання, точність, стабільність."]], "th": [{"h": "Настільний теніс. Як виконувати норматив з подачі", "p": ["Під час нормативу важлива не лише кількість влучень, а й правильність виконання: м'яч на відкритій долоні, підкидання вгору щонайменше на 16 см, удар по м'ячу, що падає, перший відскок на своїй половині. Обертання має бути помітним: після відскоку на столі суперника м'яч гальмує і відхиляється вбік.", "Точну кількість спроб і вимоги до оцінки оголошує вчитель. Не поспішай між спробами: зосередься, повтори в уяві рух і тільки тоді подавай."], "ul": ["Розминка кисті, плечей і ніг перед тестом.", "Однаковий ритуал перед кожною подачею.", "Ракетка рухається під м'яч і вбік.", "Подача низька, без зайвої висоти.", "Слідкуй за правилами — неправильна подача не зараховується."]}, {"h": "Настільний теніс. Самооцінка результату", "p": ["Після нормативу оціни себе: скільки подач було вдалих, які помилки повторювалися (сітка, аут, слабке обертання, неправильне підкидання). Це підкаже, що тренувати далі.", "Порівнюй себе не з іншими, а зі своїм попереднім результатом — так видно реальний прогрес."], "ul": ["Запиши кількість вдалих подач.", "Визнач найчастішу помилку.", "Порівняй з попередніми тренуваннями.", "Постав ціль на наступний місяць."]}, {"h": "Настільний теніс. Контрудари і накат по діагоналі", "p": ["Після нормативу на уроці повторюють обмін накатами по діагоналі з переходом до контрударів. Головне — тримати ритм і повертатися в стійку."], "ul": ["Короткий замах у контрударі.", "Ракетка закрита.", "Робота ніг перед кожним ударом.", "Стабільність важливіша за силу."]}], "f": "", "pr": ["Напиши самооцінку за схемою: що виходило в подачі з нижнім боковим обертанням, яка помилка найчастіша, що робитимеш для виправлення.", "Виконай 20 повільних імітацій подачі з нижнім боковим обертанням перед дзеркалом, стежачи за положенням долоні під час уявного підкидання."], "q": ["Які вимоги правил треба дотримати під час залікової подачі?", "За якими ознаками видно, що подача має нижнє бокове обертання?", "Як правильно оцінити свій результат після нормативу?", "Що найважливіше в контрударах?"]}, {"n": "48", "t": "Подача «маятник» і зворотний маятник. Комбінації подач з нижнім і верхнім обертом", "g": "Учень знатиме, чим відрізняється зворотний маятник від звичайного, і вмітиме складати комбінації подач протягом гейму.", "k": "Модулі: Настільний теніс", "terms": [["Зворотний маятник", "подача справа, під час якої ракетка рухається у протилежному до звичайного маятника напрямку й надає м'ячу бокового обертання в інший бік."], ["Комбінація подач", "продумана послідовність різних подач протягом гейму, щоб суперник не міг пристосуватися."], ["Швидкість кисті", "швидкість руху кисті в момент контакту, від якої найбільше залежить сила обертання."], ["Сюрприз-подача", "рідко застосовувана подача, яка застає суперника зненацька."]], "th": [{"h": "Настільний теніс. Звичайний і зворотний маятник", "p": ["У звичайному маятнику ракетка правші рухається справа наліво перед тулубом, у зворотному — зліва направо. Через це бокове обертання м'яча протилежне, і суперникові доводиться приймати його по-іншому.", "Зворотний маятник складніший технічно: кисть і передпліччя повертаються в незвичному напрямку. Його вивчають після того, як звичайний маятник уже виходить стабільно."], "ul": ["Звичайний маятник — рух ракетки справа наліво (для правші).", "Зворотний — зліва направо.", "Бокове обертання — у протилежні боки.", "Освоюй спочатку повільно, без м'яча.", "Не перенапружуй зап'ястя."]}, {"h": "Настільний теніс. Комбінації подач у гейму", "p": ["Гравець подає по дві подачі поспіль, тому можна будувати пари: наприклад, коротка з нижнім обертом, потім довга з верхнім. Суперник, налаштований на короткий м'яч, часто запізнюється з довгим.", "Сюрприз-подачу використовують рідко, у важливий момент — тоді вона найефективніша."], "ul": ["Пари подач: коротка — довга.", "Чергуй нижнє і верхнє обертання.", "Стеж, на які подачі суперник помиляється.", "Сюрприз-подачу бережи для важливого очка.", "Після подачі — готовність до будь-якої відповіді."]}], "f": "Деякі гравці-шульги особливо незручні для суперників, бо їхні подачі мають обертання в незвичний для більшості бік.", "pr": ["Склади план подач на один гейм (10 подач): вкажи порядок, вид обертання, довжину і напрямок кожної.", "Виконай вправи для кисті: кругові рухи, згинання-розгинання, повороти передпліччя — по 15 разів кожну, повільно і без болю."], "q": ["Чим зворотний маятник відрізняється від звичайного?", "Чому зворотний маятник вивчають пізніше?", "Як скласти вдалу пару подач?", "Коли варто використовувати сюрприз-подачу?"]}, {"n": "49", "t": "Контрольний норматив: серійні удари з партнером по діагоналі. Топ-спін і підрізка справа", "g": "Учень знатиме, як підготуватися і виконати норматив із серійних ударів по діагоналі, та повторить топ-спін і підрізку справа.", "k": "Модулі: Настільний теніс", "terms": [["Серійні удари", "послідовність ударів, виконаних поспіль без помилки під час обміну з партнером."], ["Ритм обміну", "рівномірний темп ударів, за якого кожен м'яч приходить приблизно однаково."], ["Взаємодія з партнером", "спільна робота в парі, коли кожен намагається відбити м'яч зручно для іншого."], ["Концентрація", "здатність тривалий час зосереджено виконувати дію, не відволікаючись."]], "th": [{"h": "Настільний теніс. Як виконати норматив із серійних ударів", "p": ["У цьому нормативі важлива спільна робота: обидва гравці накатують по діагоналі справа або зліва, і рахується кількість ударів без помилки. Тому мета — не виграти очко, а дати партнерові зручний м'яч.", "Кількість ударів для оцінки оголошує вчитель. Готуйся так: на кожному тренуванні вимірюй найдовшу серію, і поступово збільшуй її."], "ul": ["Помірна сила, рівний ритм.", "Удар у верхній точці відскоку.", "Повернення в стійку після кожного удару.", "Рахуйте вголос — це допомагає зосередитися.", "Обирай партнера близького рівня для тренування."]}, {"h": "Настільний теніс. Повторення топ-спіну і підрізки справа", "p": ["Вправа у парі «підрізка — топ-спін» розвиває обидва удари: один гравець підрізає, інший відповідає топ-спіном, далі ролі змінюються. Стеж за правильним рухом ракетки і роботою ніг."], "ul": ["Топ-спін — рух знизу вгору-вперед, ракетка закрита.", "Підрізка — рух зверху вниз-уперед, ракетка відкрита.", "Широкий замах — лише за вільного простору.", "Розминка плечей обов'язкова."]}], "f": "", "pr": ["Опиши письмово, як підготуватися до нормативу із серійних ударів: план на тиждень, як вимірювати прогрес і що робити, якщо серія часто обривається.", "Виконай 4 серії по 20 імітацій накату справа або зліва у рівному ритмі (вголос рахуючи), з поверненням у стійку; оціни, чи вдалося втримати однаковий темп."], "q": ["Що оцінюється в нормативі із серійних ударів?", "Чому в цьому нормативі важливо грати зручно для партнера?", "Як готуватися до нормативу, щоб бачити прогрес?", "Чим відрізняються рухи ракетки в топ-спіні та підрізці?"]}, {"n": "50", "t": "Подачі з нижнім та верхнім обертом. Психологічна підготовка тенісиста", "g": "Учень знатиме прийоми психологічної підготовки до гри і правило тайм-ауту та вмітиме застосувати їх під час пода
