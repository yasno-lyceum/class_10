<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фізична культура · 10 клас</title>
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@500;600;700&display=swap">
<style>
/* Layout: класний «підручник» — бічний зміст розділів зліва, колонка читання ~68 знаків справа, тест вбудований наприкінці кожного уроку */
:root{
  --bg:#F4F6F9; --surface:#FFFFFF; --sunk:#EAEEF4; --ink:#152030; --muted:#566275; --line:#D9DFE8;
  --accent:#1F4E79; --accent-soft:#E3ECF6; --copper:#B4521A; --copper-soft:#FBEDE3;
  --ok:#23703A; --ok-soft:#E3F2E7; --bad:#B42323; --bad-soft:#FBE6E6;
  --s-art:#8A3866; --s-zu:#56652A; --s-pe:#0F766E; --s-tech:#B4441C;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151D28; --sunk:#1B2532; --ink:#E5EAF1; --muted:#9AA6B7; --line:#2A3546;
  --accent:#86B5E3; --accent-soft:#1C2D42; --copper:#E8925A; --copper-soft:#332317;
  --ok:#72C58A; --ok-soft:#173022; --bad:#F08383; --bad-soft:#3A1C1C;
  --s-art:#D88BB6; --s-zu:#B4C27A; --s-pe:#5CC9BE; --s-tech:#F0956B; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:34px;height:34px;border-radius:8px;display:block}
.brand b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand span{display:block;font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;margin-left:auto;flex-wrap:wrap}
.tab{text-decoration:none;border:0;background:transparent;padding:7px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tab i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:12px}
.prog .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--subj);border-radius:6px;transition:width .3s}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;margin-bottom:12px}
.theme{margin-bottom:14px}
.theme h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:700;line-height:1.35}
.les{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13.5px;line-height:1.35}
.les:hover{background:var(--sunk)}
.les[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.les .no{flex:0 0 auto;min-width:30px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;padding-top:1px}
.les .tt{flex:1;min-width:0}
.les .st{flex:0 0 auto;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:999px}
.st.done{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--copper-soft);color:var(--copper)}
.empty{color:var(--muted);font-size:13px;padding:8px}

main{min-width:0}
article{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subj)}
h1{font-family:var(--f-display);font-weight:600;font-size:clamp(22px,3.2vw,30px);line-height:1.2;margin:8px 0 14px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
a.chip{color:var(--accent);text-decoration:none}
a.chip:hover{text-decoration:underline}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.goal{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-family:var(--f-body);font-size:16px;line-height:1.55;max-width:68ch}
.goal b{font-family:var(--f-ui);color:var(--accent);margin-right:6px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:30px 0 12px;color:var(--accent);display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
.prose{font-family:var(--f-body);font-size:16.5px;line-height:1.65;max-width:68ch}
.prose h4{font-family:var(--f-ui);font-size:15px;font-weight:700;margin:20px 0 6px}
.prose p{margin:0 0 10px;text-indent:1.4em}
.prose ul,.prose ol{margin:0 0 12px;padding-left:1.3em}
.prose li{margin-bottom:5px}
.terms{display:grid;grid-template-columns:minmax(120px,30%) 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-width:76ch}
.terms dt,.terms dd{margin:0;padding:9px 12px;border-top:1px solid var(--line)}
.terms dt:first-of-type,.terms dt:first-of-type+dd{border-top:0}
.terms dt{font-weight:700;background:var(--sunk);font-size:14px}
.terms dd{font-family:var(--f-body);font-size:15px}
.fact{margin-top:20px;background:var(--copper-soft);border-radius:var(--r);padding:14px 16px;max-width:68ch;font-family:var(--f-body);font-size:15.5px}
.fact b{display:block;font-family:var(--f-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--copper);margin-bottom:4px}
.prose .lead{text-indent:0;font-size:17.5px}
.prose h3{font-family:var(--f-ui);font-size:16px;font-weight:700;margin:22px 0 8px}
.prose h2x{display:block}
.prose li b{font-family:var(--f-ui);font-size:.95em}
.call{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;margin:14px 0;max-width:68ch}
.fig{margin:14px 0 18px;max-width:68ch}
.fig img,.cardx img{display:block;width:100%;height:auto;border-radius:10px;background:var(--sunk);cursor:zoom-in}
.cardsx{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:12px 0 20px}
.cardx{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.cardx img{aspect-ratio:16/10;object-fit:cover;border-radius:0}
.cardx div{padding:10px 12px 12px;font-family:var(--f-body);font-size:14.5px}
.cardx h4{margin:0 0 4px;font-family:var(--f-ui);font-size:15px}
.cardx p{margin:0 0 6px;text-indent:0}
.cardx p b{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--subj)}
.prose .tgrid{padding-left:0}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin:8px 0 16px;padding:0;list-style:none}
.tgrid li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px;background:var(--surface);margin:0}
.tgrid li b{display:block;color:var(--subj);font-family:var(--f-ui)}
.steps{counter-reset:st;list-style:none;padding:0!important;display:grid;gap:8px}
.steps li{counter-increment:st;position:relative;padding:10px 12px 10px 46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin:0}
.steps li::before{content:counter(st);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font:700 13px/24px var(--f-ui);text-align:center}
.steps li b{display:block;font-family:var(--f-ui)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(8,10,14,.86);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.tasks li::marker{content:"✎  ";color:var(--copper)}

.quiz{margin-top:34px;border:1.5px solid var(--subj);border-radius:14px;padding:clamp(16px,3vw,26px);background:var(--bg)}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;justify-content:space-between}
.qhead h2{margin:0;color:var(--ink)}
.qhead h2::after{display:none}
.qhead p{margin:0;color:var(--muted);font-size:13px}
.q{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q .qt{font-weight:700;margin-bottom:10px;display:flex;gap:8px}
.q .qt span{color:var(--subj);font-variant-numeric:tabular-nums;flex:0 0 auto}
.q .qt div{min-width:0}
.q .qt em{font-family:var(--f-body);font-weight:400}
.opts{display:grid;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:var(--f-body);font-size:15px;line-height:1.45}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.opt span{min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.checked .opt{cursor:default}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{margin:8px 0 0;font-size:14px;color:var(--muted);font-family:var(--f-body)}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.good{color:var(--ok)} .score.mid{color:var(--copper)} .score.low{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.pager button{max-width:48%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:13px;color:var(--muted)}
.pager button b{display:block;color:var(--ink);font-size:14px}
.pager button:last-child{text-align:right;margin-left:auto}

@media (max-width:880px){
  .back{padding:6px 10px;font-size:13px}
  .wrap{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;display:none}
  aside.open{display:block}
  .back{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:600;text-decoration:none;font-size:14px}
.back:hover{border-color:var(--accent)}
.toc-btn{display:inline-block}
  .tabs{margin-left:0;order:3;width:100%;justify-content:space-between}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:14px}
  .tab:last-child:nth-child(odd){grid-column:1/-1}
  .tab{flex:1 1 auto;justify-content:center;padding:7px 6px;font-size:12.5px;gap:5px;white-space:nowrap}
  .terms{grid-template-columns:1fr}
  .terms dt{border-top:1px solid var(--line)}
  .terms dd{border-top:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
const DATA = [{"id": "fk10", "name": "Фізична культура · 10 клас", "short": "Фізкультура 10", "themes": [{"name": "Розділ 1. Волейбол (уроки 1–26)", "lessons": [{"n": "1", "t": "Інструктаж з БЖД. Історія та правила волейболу. Верхня бокова подача в ліву і праву половину", "g": "Учень знатиме правила безпеки на уроках волейболу, основні етапи історії гри та її базові правила, а також розумітиме техніку верхньої бокової подачі й уміння спрямовувати її в різні половини майданчика.", "k": "Модулі: Волейбол", "terms": [["Первинний інструктаж з БЖД", "перше ознайомлення з правилами безпечної поведінки на заняттях конкретним видом спорту, яке проводить учитель."], ["Подача", "введення м'яча в гру гравцем із зони 1, що стоїть за лицьовою лінією майданчика."], ["Верхня бокова подача", "подача, під час якої гравець стоїть боком до сітки, а м'яч б'є прямою рукою зверху махом збоку."], ["Партія", "частина волейбольного матчу, що триває до 25 очок із перевагою щонайменше у 2 очки (п'ята партія — до 15)."], ["Система «ралі-пойнт»", "система рахунку, за якої очко отримує команда, що виграла розіграш, незалежно від того, чия була подача."]], "th": [{"h": "Волейбол. Правила безпеки (БЖД) на заняттях", "p": ["Волейбол — гра з частими стрибками, падіннями й швидкими м'ячами, тому травми найчастіше трапляються через поспіх, слабку розминку або неуважність. Головне правило — займатися лише в спортивному взутті з неслизькою підошвою, у зручному одязі, без прикрас, годинників і жуйки.", "Перед роботою з м'ячем обов'язкова розминка: суглоби пальців, кисті, плечі, коліна й гомілкостопи мають бути розігріті. Спеціальні бігові вправи (біг приставними кроками, схресним кроком, спиною вперед) та стрибкові вправи (вистрибування вгору, стрибки з ноги на ногу) готують м'язи до ігрових рухів."], "ul": ["Не починай вправу без сигналу вчителя і не бий по м'ячу, якщо перед тобою стоять інші учні.", "Не перелазь під сіткою і не хапайся за неї та за стійки.", "Приземлюйся після стрибка м'яко на обидві ноги, згинаючи коліна.", "Якщо м'яч відкотився на сусідній майданчик — дочекайся паузи, а потім забирай.", "Зняті окуляри, прикраси та телефони тримай у роздягальні або в учителя.", "Про будь-який біль чи погане самопочуття одразу повідом учителя."]}, {"h": "Волейбол. Історія розвитку та основні правила гри", "p": ["Волейбол придумав у 1895 році в США викладач фізичного виховання Вільям Морган як гру, у якій менше силового контакту, ніж у баскетболі. Назва походить від англійських слів volley (удар з льоту) і ball (м'яч). Згодом гра поширилася світом, з'явилася Міжнародна федерація волейболу (FIVB), а з 1964 року волейбол входить до програми Олімпійських ігор.", "Сучасний класичний волейбол — це гра двох команд по 6 гравців на майданчику 18 × 9 м, розділеному сіткою. Мета — приземлити м'яч на половині суперника і не дати йому приземлитися на своїй. Команда має право на три торкання, щоб повернути м'яч через сітку."], "ul": ["Висота сітки у дорослих: для чоловіків — 2,43 м, для жінок — 2,24 м.", "Матч триває до перемоги в трьох партіях; партія — до 25 очок із різницею у 2 очки.", "Один гравець не може торкатися м'яча двічі поспіль (дотик блоку не враховують).", "Після переходу подачі до команди гравці переходять на одну позицію за годинниковою стрілкою.", "Лінія атаки розташована за 3 м від сітки: гравці задньої лінії не можуть атакувати з-перед неї вище верхнього краю сітки."]}, {"h": "Волейбол. Верхня бокова подача в ліву та праву половину майданчика", "p": ["Гравець стоїть лівим боком до сітки (для праворуких), ноги на ширині плечей. М'яч лежить на долоні лівої руки. Підкидання — вгору, трохи вперед над лівим плечем на висоту 1–1,5 м. Одночасно права рука відводиться вниз-назад, вага тіла переноситься на праву ногу. Удар виконують прямою рукою: вона рухається дугою знизу-збоку вгору й зустрічає м'яч над головою, трохи нижче його центру; одночасно тулуб повертається до сітки.", "Щоб спрямувати подачу в ліву або праву половину майданчика суперника, змінюють поворот тулуба в момент удару та положення кисті: напрямок задає площина долоні. Спочатку важлива стабільність, потім — точність."], "ul": ["Послідовність фаз: вихідне положення — підкидання — замах — удар — перехід у гру.", "Типова помилка: підкидання занадто низько або за спину — удар виходить без сили.", "Типова помилка: зігнута в лікті рука — м'яч летить у сітку.", "Удар тугою, напруженою долонею, пальці зімкнуті.", "Не заступай лицьову лінію до удару — це помилка подачі.", "Після удару одразу займай своє місце в захисті."]}], "f": "Волейбол спочатку мав назву «мінтонет» (mintonette), і лише згодом гру перейменували на «волейбол».", "pr": ["Запиши в зошит 6 основних правил безпеки на уроці волейболу та 5 базових правил гри своїми словами.", "Виконай імітацію верхньої бокової подачі без м'яча перед дзеркалом: 3 підходи по 10 повторень повільно, стежачи за прямою рукою й поворотом тулуба (у вільному місці, де нічого не зачепиш)."], "q": ["Чому перед заняттям волейболом обов'язково розминають пальці й гомілкостопи?", "Хто й коли придумав волейбол?", "До скількох очок триває звичайна партія і п'ята партія?", "Як змінити напрямок верхньої бокової подачі в ліву чи праву половину майданчика?"]}, {"n": "2", "t": "Основні поняття та правила гри. Прийом знизу однією рукою з падінням і перекатом", "g": "Учень пояснить основні поняття волейболу (перехід, торкання, ліберо, помилки) і розумітиме техніку прийому м'яча знизу однією рукою з падінням вперед та безпечним перекатом.", "k": "Модулі: Волейбол", "terms": [["Перехід (ротація)", "переміщення гравців команди на одну позицію за годинниковою стрілкою після того, як команда отримала право подачі."], ["Ліберо", "спеціалізований захисний гравець у формі іншого кольору, який грає лише на задній лінії і не може атакувати вище сітки та подавати."], ["Торкання", "будь-який контакт гравця з м'ячем, який враховується в межах трьох дозволених торкань команди."], ["Прийом знизу однією рукою", "прийом низького чи віддаленого м'яча передпліччям або кистю однієї руки, коли двома руками дотягнутися не вдається."], ["Падіння з перекатом", "спосіб безпечно завершити прийом у випаді: тіло опускається на підлогу й гасить швидкість ковзанням або перекатом."]], "th": [{"h": "Волейбол. Основні поняття та правила гри", "p": ["Кожен гравець займає одну з шести зон. Передня лінія — зони 4 (ліворуч), 3 (центр), 2 (праворуч); задня — зони 5, 6, 1. Подає гравець зони 1. У момент удару подавальника всі гравці повинні стояти у правильній розстановці, інакше команді зараховують помилку.", "Розіграш закінчується, коли м'яч торкнувся підлоги, вилетів за межі, або коли одна з команд порушила правила. Ліберо допомагає команді в прийомі та захисті і може замінювати гравців задньої лінії без офіційної заміни."], "ul": ["«Чотири удари» — команда торкнулася м'яча більше трьох разів.", "«Подвійне торкання» — гравець торкнувся м'яча двічі поспіль.", "«Захоплення» — м'яч затримано, кинуто, а не відбито.", "Торкання сітки під час гри м'ячем — помилка.", "Заступ за центральну лінію всією стопою — помилка.", "М'яч, що влучив у лінію майданчика, вважається «у полі»."]}, {"h": "Волейбол. Прийом знизу однією рукою з падінням вперед і перекатом", "p": ["Коли м'яч летить низько й далеко, гравець робить швидкий широкий випад до м'яча, опускає центр ваги і підставляє передпліччя або кисть однієї руки під м'яч. Удар не сильний — рука лише «підбиває» м'яч угору, щоб партнер міг його догравати.", "Після прийому тіло продовжує рух уперед. Дівчата виконують падіння з перекатом на стегна й живіт: опора на руки, тіло м'яко ковзає вперед. Юнаки виконують падіння з перекатом на груди: руки впираються в підлогу, згинаються, тіло, прогнувшись, «прокочується» стегнами, животом і грудьми. Голова піднята, підборіддя не торкається підлоги."], "ul": ["Фази: випад — опускання — контакт з м'ячем — падіння — перекат — швидкий підйом.", "Вчити падіння можна лише на матах і під наглядом учителя.", "Типова помилка: падіння на випрямлені руки — ризик травми ліктя чи кисті.", "Типова помилка: опущена голова — можна вдаритися підборіддям.", "Спочатку відпрацьовують падіння без м'яча, потім — з м'ячем.", "Перед вправою — розминка кистей, плечей, спини."]}], "f": "Ліберо вперше з'явився в правилах волейболу наприкінці 1990-х років, щоб зробити розіграші довшими й цікавішими для глядачів.", "pr": ["Намалюй схему волейбольного майданчика з шістьма зонами, познач стрілками напрямок переходу гравців.", "Виконай вправи для сили рук і корпусу, які потрібні для безпечного падіння: планка на передпліччях 3 × 30 секунд і віджимання від стіни 2 × 12 (падіння вдома не виконуй)."], "q": ["Що таке перехід і в якому напрямку він виконується?", "Які обмеження має ліберо?", "Чим відрізняється падіння з перекатом для дівчат і для юнаків?", "Які дві типові помилки можуть призвести до травми під час падіння?"]}, {"n": "3", "t": "Багаторазова передача в стіну. Завислі передачі в ближню зону та передача через зону", "g": "Учень зрозуміє техніку верхньої передачі, вимоги до завислих передач між зонами 2 і 3 та передач через зону 2–4, а також знатиме, як вдосконалювати передачу в стіну.", "k": "Модулі: Волейбол", "terms": [["Верхня передача", "передача м'яча двома руками над головою кінчиками пальців, основний спосіб другої передачі на удар."], ["Зависла передача", "висока м'яка передача, після якої м'яч ніби «зависає» над сіткою, даючи нападнику час на розбіг."], ["Ближня зона", "сусідня зона по передній лінії, наприклад передача із зони 2 у зону 3 і навпаки."], ["Передача через зону", "довга передача вздовж сітки з однієї крайньої зони в іншу, оминаючи центральну (2–4 або 4–2)."]], "th": [{"h": "Волейбол. Техніка верхньої передачі та вправи біля стіни", "p": ["Пальці обох рук утворюють «ківш»: великі та вказівні пальці формують трикутник, кисті трохи відведені назад. Гравець стоїть під м'ячем, ноги злегка зігнуті, руки над чолом. М'яч приймають на подушечки пальців і, одночасно випрямляючи ноги й руки, спрямовують угору-вперед.", "Багаторазова передача в стіну — найкраща вправа для «відчуття» м'яча. Змінюючи висоту передачі (низько — високо) та відстань до стіни (1–3 м), гравець вчиться дозувати силу й швидко пересуватися під м'яч."], "ul": ["Працюють не лише руки, а й ноги — сила передачі йде знизу.", "Типова помилка: прийом м'яча на долоні — «захоплення».", "Типова помилка: м'яч перед обличчям на рівні грудей замість над чолом.", "Пальці напружені, але не «дерев'яні».", "Спеціальні бігові вправи (приставний крок, зупинки) вчать швидко ставати під м'яч."]}, {"h": "Волейбол. Завислі передачі 2–3, 3–2 та передача через зону 2–4, 4–2", "p": ["Зависла передача в ближню зону має бути високою, м'якою й падати над сіткою на відстані близько півметра від неї. Так нападник встигає розбігтися й ударити. Передача із зони 3 у зону 2 і назад вимагає, щоб тулуб пасувальника був розвернутий у бік передачі.", "Передача через зону — довга, тому важлива робота ніг і точний напрямок. Пасувальник стоїть боком до сітки, а траєкторія м'яча проходить вздовж неї, не перелітаючи на бік суперника."], "ul": ["Перед передачею зупинись і повернися до цілі.", "Довша передача — більше розгинання ніг.", "М'яч не має «прилипати» до сітки, але й не відлітати далеко від неї.", "Під час вправ у трійках гравці постійно змінюють зони.", "Тримай дистанцію між групами учнів, щоб не зіткнутися."]}], "f": "", "pr": ["Виконай вправу «передача над собою» з легким м'ячем або повітряною кулькою 3 × 20 разів у кімнаті без крихких предметів, стежачи за положенням пальців «ковшем».", "Намалюй траєкторії передач 2–3, 3–2 та 4–2 на схемі майданчика і підпиши, чим вони відрізняються."], "q": ["Як правильно розташувати пальці під час верхньої передачі?", "Що таке зависла передача і навіщо вона потрібна нападнику?", "Чим передача через зону складніша за передачу в ближню зону?"]}, {"n": "4", "t": "Тактика подачі: вибіркова подача на слабшого приймальника. Верхня бокова подача", "g": "Учень розумітиме, як вибирати ціль для подачі (слабший у прийомі гравець, гравець після заміни) і як точністю верхньої бокової подачі ускладнити атаку суперника.", "k": "Модулі: Волейбол", "terms": [["Тактична подача", "подача, спрямована в певного гравця чи зону відповідно до заздалегідь продуманого плану."], ["Заміна гравця", "офіційний обмін гравця на майданчику на запасного з дозволу судді."], ["Підкидання м'яча", "підготовча частина подачі, від стабільності якої залежить якість удару."], ["Зона подачі", "смуга шириною 9 м за лицьовою лінією, з якої дозволено виконувати подачу."]], "th": [{"h": "Волейбол. Вибіркове виконання подачі", "p": ["Подача — єдина дія, яку гравець виконує сам, без впливу суперника. Тому розумна подача — це вже перший крок до очка. Якщо видно, що один із суперників невпевнено приймає м'яч, подачу спрямовують саме на нього. Так команда суперника часто не зможе виконати гарну першу передачу і атакувати.", "Ще одна ціль — гравець, який щойно вийшов на заміну. Він ще не «відчув» гру, у нього може бути напруження. Подача на нього — розумний тактичний хід."], "ul": ["Спочатку подай надійно, а вже потім — точно і сильно.", "Спостерігай, хто з суперників помиляється на прийомі.", "Подача між двома приймальниками створює непорозуміння.", "Подача в зону, звідки нападник починає розбіг, заважає йому атакувати.", "Не ризикуй сильною подачею при рахунку, коли помилка дорого коштує."]}, {"h": "Волейбол. Верхня бокова подача в ліву і праву половину", "p": ["Щоб влучати в обраного гравця, потрібне однакове підкидання щоразу. Гравець спершу визначає ціль, займає місце в зоні подачі, робить глибокий вдих і повторює звичну послідовність рухів.", "Напрямок подачі в ліву половину майданчика суперника задає більший поворот тулуба та кисті вліво в момент удару, у праву — менший поворот або удар «прямо». Довжину регулюють силою та висотою траєкторії."], "ul": ["Підкидання — завжди в одну точку над плечем.", "Погляд — на м'яч у момент удару, а не на ціль.", "Типова помилка: різке «доворотання» кисті після удару — м'яч летить в аут.", "Розминка плечового суглоба перед серією подач обов'язкова.", "Під час серій подач не стій навпроти того, хто подає."]}], "f": "", "pr": ["Опиши письмово 3 ситуації в грі, коли варто подавати на конкретного гравця суперника, і поясни чому.", "Виконай вправи для плечового суглоба: колові рухи руками вперед і назад 2 × 15, зведення лопаток 2 × 15, імітація замаху подачі 2 × 10."], "q": ["Чому подачу називають «першою атакою»?", "На яких гравців суперника доцільно подавати?", "Що визначає напрямок верхньої бокової подачі?"]}, {"n": "5", "t": "Суддівство. Передачі в русі в парах і трійках, у падінні та в стрибку за спину", "g": "Учень ознайомиться з основами суддівства у волейболі та розумітиме техніку складних передач: у русі, у падінні, у стрибку та за спину.", "k": "Модулі: Волейбол", "terms": [["Суддівство", "контроль за дотриманням правил гри та фіксування рахунку під час матчу."], ["Перший суддя", "головний суддя матчу, який стоїть на суддівській вишці біля сітки і має останнє слово в спірних ситуаціях."], ["Передача за спину", "верхня передача, під час якої м'яч спрямовують назад над головою, прогнувшись у спині."], ["Передача в стрибку", "верхня передача у фазі польоту після відштовхування, яка прискорює атаку й маскує намір пасувальника."], ["Передача у падінні", "передача низько опущеного м'яча, після якої гравець втрачає рівновагу і безпечно приземляється."]], "th": [{"h": "Волейбол. Основи суддівства", "p": ["Суддя стежить за тим, щоб гра відбувалась чесно і безпечно. Він фіксує помилки, дозволяє подачу, оголошує тайм-аути та заміни. Справедливе суддівство неможливе без досконалого знання правил, тому кожен волейболіст, навіть не суддя, має їх знати.", "На шкільних змаганнях часто суддями бувають самі учні. Головне для судді — бути уважним, рішучим, чітко свистіти й показувати жест, а не сперечатися з гравцями."], "ul": ["Свисток — сигнал початку розіграшу (дозвіл подачі) і його завершення.", "Рішення судді не обговорюють — питання ставить лише капітан.", "Суддя спершу свистить, потім показує жест помилки, потім — яка команда подає.", "Суддя оцінює дії гравців, а не їхні імена чи емоції.", "Неспортивну поведінку суддя може покарати попередженням чи штрафним очком."]}, {"h": "Волейбол. Передачі в русі, у падінні та в стрибку за спину", "p": ["У парах і трійках передачі виконують із пересуванням: після передачі гравець переміщується на нове місце (наприклад, у трійках — біжить за своєю передачею). Це вчить швидко вибирати позицію під м'ячем.", "Передача за спину виконується так само, як звичайна, але в останній момент кисті розвертають назад, а тулуб прогинається. Передачу в стрибку виконують у найвищій точці польоту, руки працюють коротко й швидко. Передачу у падінні використовують для низьких м'ячів: після контакту гравець сідає та перекочується на спину, групуючись."], "ul": ["Фаза передачі в стрибку: розбіг — відштовхування — передача у найвищій точці — приземлення на дві ноги.", "Типова помилка передачі за спину: м'яч летить угору і падає на самого пасувальника — кисті розвернуті запізно.", "Під час падіння підборіддя притиснуте до грудей.", "Не стрибай під сіткою — є ризик наступити на ногу суперника.", "Передачі в падінні вчать лише на матах."]}], "f": "", "pr": ["Склади пам'ятку для учня-судді шкільної гри: 5 правил поведінки та 5 найчастіших помилок гравців, які він має помічати.", "Виконай вправи на гнучкість спини: «кішка» 2 × 10 і місток з положення лежачи (або «човник» лежачи на животі) 2 × 8 — повільно, без болю."], "q": ["Які обов'язки має суддя у волейболі?", "Чому рішення судді не можна обговорювати всім гравцям?", "Чим передача за спину відрізняється від звичайної верхньої передачі?", "Коли доцільно використовувати передачу в стрибку?"]}, {"n": "6", "t": "Склад суддівської бригади. Прямий нападаючий удар за ходом із зон 2 і 4", "g": "Учень знатиме склад і обов'язки суддівської бригади та розумітиме техніку прямого нападаючого удару за ходом із високих і середніх передач.", "k": "Модулі: Волейбол", "terms": [["Суддівська бригада", "група суддів, які разом обслуговують матч: перший і другий судді, секретар, помічник секретаря та лінійні судді."], ["Другий суддя", "суддя, що стоїть на підлозі біля стовпа сітки з протилежного від першого судді боку, стежить за сіткою, центральною лінією, тайм-аутами й замінами."], ["Секретар", "член суддівської бригади, який веде протокол гри."], ["Лінійний суддя", "суддя, який прапорцем показує, чи впав м'яч у межах майданчика."], ["Нападаючий удар", "будь-яке спрямування м'яча на бік суперника, крім подачі та блоку, найчастіше — сильний удар однією рукою в стрибку."]], "th": [{"h": "Волейбол. Склад суддівської бригади", "p": ["На офіційних змаганнях матч обслуговують перший суддя, другий суддя, секретар і лінійні судді (двоє або четверо). Перший суддя керує грою з вишки, бачить усе над сіткою. Другий суддя допомагає йому знизу, контролює помилки біля сітки, заміни й тайм-аути, перевіряє розстановку команди, що приймає подачу.", "Секретар записує рахунок, заміни, тайм-аути й порядок подач у протокол. Лінійні судді стоять у кутах майданчика й прапорцем показують «м'яч у полі», «аут», «торкання» або заступ подавальника."], "ul": ["Перший суддя — головний, його рішення остаточне.", "Другий суддя дає свисток за помилки на своїй стороні сітки і торкання антени.", "Секретар стежить за правильним порядком подач.", "Лінійні судді — «очі» першого судді на лініях.", "Уся бригада працює як команда і узгоджує рішення жестами."]}, {"h": "Волейбол. Прямий нападаючий удар за ходом із зон 2 і 4", "p": ["Удар «за ходом» означає, що м'яч б'ють у тому ж напрямку, в якому виконувався розбіг. Гравець зони 4 починає розбіг з-за лінії атаки, робить 2–3 кроки, останній — широкий стрибковий, ставить ноги і, відмахнувши обидві руки назад, вистрибує вгору. Сильніша рука відводиться за голову, лікоть високо. Удар виконують у найвищій точці по верхній частині м'яча, кисть «накладається» на м'яч.", "Високі передачі дають більше часу на розбіг, середні вимагають швидшого розбігу й точнішого розрахунку. Із зони 2 праворуким гравцям незручніше, бо м'яч летить з-за «неробочого» плеча, тому важливо правильно розвернути тулуб."], "ul": ["Фази: розбіг — відштовхування — замах — удар — приземлення.", "Приземлення — на дві ноги, на своїй половині, з амортизацією в колінах.", "Типова помилка: ранній стрибок — гравець «чекає» м'яч у повітрі.", "Типова помилка: удар зігнутою рукою, низька точка удару.", "Не торкайся сітки під час удару й приземлення."]}], "f": "Лінійні судді у волейболі користуються прапорцями, а на великих турнірах їм допомагає система відеоперегляду.", "pr": ["Намалюй схему розташування суддівської бригади біля майданчика та підпиши обов'язки кожного судді.", "Виконай імітацію розбігу й замаху нападаючого удару без стрибка на місці: 3 × 8 повторень, плюс присідання 3 × 12 для сили ніг."], "q": ["Хто входить до суддівської бригади?", "Які обов'язки має другий суддя?", "Що означає «удар за ходом»?", "Як правильно приземлятися після нападаючого удару?"]}, {"n": "7", "t": "Верхня бокова подача: точність, обертання м'яча та типові помилки", "g": "Учень удосконалить розуміння верхньої бокової подачі: як обертання і траєкторія впливають на політ м'яча та як позбутися типових помилок.", "k": "Модулі: Волейбол", "terms": [["Ейс", "подача, після якої команда отримує очко одразу, бо суперник не зміг прийняти м'яч."], ["Планерна подача", "подача майже без обертання, під час якої м'яч у польоті «гуляє» і непередбачувано змінює траєкторію."], ["Кручена подача", "подача, після якої м'яч обертається вперед і швидко падає вниз."], ["Помилка подачі", "порушення під час подачі: м'яч у сітці, в аут, заступ лінії або подача після 8 секунд від свистка."]], "th": [{"h": "Волейбол. Обертання та траєкторія подачі", "p": ["Залежно від того, у яку частину м'яча та як б'є кисть, подача може бути крученою або планерною. Якщо удар припадає в центр м'яча і рука після удару різко зупиняється, м'яч майже не обертається і «планерує» — приймати таку подачу важко. Якщо кисть «накриває» м'яч зверху, виникає обертання вперед, і м'яч швидко йде вниз.", "Для школяра найважливіше — стабільність: краще 9 подач із 10 у полі, ніж 5 сильних і 5 у сітці."], "ul": ["Удар у центр м'яча тугою долонею — подача без обертання.", "Удар знизу-позаду з накриванням — кручена подача.", "Висока траєкторія — більше шансів перелетіти сітку, але легше прийняти.", "Низька траєкторія — складніше для прийому, але є ризик потрапити в сітку.", "Після свистка першого судді на подачу є 8 секунд."]}, {"h": "Волейбол. Подача в ліву та праву половину: робота над помилками", "p": ["Найпоширеніші причини невдалої подачі: нестабільне підкидання, зігнута рука і передчасний поворот тулуба. Корисно працювати над кожною фазою окремо: кілька разів лише підкидати м'яч і стежити, чи падає він в одну точку, потім додавати замах і лише потім — удар.", "Спеціальні бігові та стрибкові вправи на уроці розвивають не лише ноги: швидкий перехід після подачі в зону захисту вимагає готовності тіла."], "ul": ["М'яч у сітці — підкидання занадто низьке або удар зверху.", "М'яч в аут — удар під низ м'яча або надто сильний.", "М'яч убік — тулуб повернувся раніше за удар.", "Перед кожною подачею — однаковий ритуал і глибокий вдих.", "Аналізуй кожну помилку, а не просто подавай більше."]}], "f": "", "pr": ["Склади для себе «ритуал подачі» з 4–5 кроків (наприклад, стати, видихнути, подивитися на ціль, підкинути) і запиши його.", "Виконай вправи для кисті та передпліччя: стискання тенісного м'ячика або еспандера 3 × 20 на кожну руку, обертання кистями 2 × 15."], "q": ["Чим планерна подача відрізняється від крученої?", "Які помилки найчастіше призводять до подачі в сітку?", "Що таке ейс?"]}, {"n": "8", "t": "Волейбол як засіб фізичного виховання. Нападаючі удари з короткої та з першої передачі", "g": "Учень пояснить, які фізичні та психологічні якості розвиває волейбол, і розумітиме техніку нападаючих ударів з короткої передачі та удару з першої передачі.", "k": "Модулі: Волейбол", "terms": [["Стрибучість", "здатність людини високо відштовхуватися від опори, що залежить від сили і швидкості м'язів ніг."], ["Швидкісно-силові якості", "здатність проявляти велику силу за короткий час, наприклад під час стрибка чи удару."], ["Коротка передача", "невисока швидка передача нападнику, який виходить під м'яч заздалегідь, щоб атакувати раніше за блок."], ["Удар з першої передачі", "атака, коли м'яч спрямовують на бік суперника вже після першого торкання, найчастіше з неточного прийому, що летить над сіткою."]], "th": [{"h": "Волейбол. Засіб фізичного виховання та розвитку якостей", "p": ["Волейбол розвиває стрибучість, швидкість реакції, спритність, координацію, силу рук і корпусу. Часті вистрибування, ривки й падіння тренують серцево-судинну систему й м'язи ніг, а робота з м'ячем — точність рухів.", "Не менш важливі психологічні якості: уміння зосередитися, витримка після помилки, рішучість, комунікація й довіра до партнера. У волейболі не можна грати самому — без командної взаємодії очко не здобути."], "ul": ["Фізичні якості: стрибучість, спритність, швидкість, витривалість, гнучкість.", "Психологічні: увага, воля, емоційна стійкість, лідерство.", "Соціальні: командна взаємодія, повага до суперника і судді.", "Волейбол безконтактний, тому доступний для людей різного віку.", "Пляжний волейбол додає навантаження завдяки піску."]}, {"h": "Волейбол. Нападаючі удари з короткої передачі та з першої передачі", "p": ["Удар з короткої передачі виконує, як правило, центральний нападник: він починає розбіг ще до передачі й вистрибує одночасно з пасувальником або трохи раніше. Пасувальник передає м'яч невисоко прямо в руку. Головне — синхронність: нападник не чекає м'яч, а «зустрічає» його.", "Удар з першої передачі використовують, коли м'яч після прийому чи атаки суперника летить над сіткою. Нападник, що стоїть біля сітки, одразу вистрибує й б'є або «скидає» м'яч на порожнє місце. Це неочікувано для суперника, але вимагає швидкої реакції."], "ul": ["Коротка передача: розбіг починається до передачі, стрибок — у момент передачі.", "Замах коротший, ніж при ударі з високої передачі.", "Удар з першої передачі виконують лише гравці передньої лінії.", "Типова помилка: торкання сітки при атаці м'яча, що летить близько до неї.", "Приземлення — на дві ноги, коліна м'які."]}], "f": "", "pr": ["Напиши коротке есе (6–8 речень): які фізичні та психологічні якості волейбол розвиває особисто в тебе або міг би розвинути.", "Виконай вправи для м'язів ніг і корпусу: присідання 3 × 15, підйоми на носки 3 × 20, планка 3 × 30 секунд."], "q": ["Які фізичні якості розвиває волейбол?", "Чому у волейболі важливі психологічні якості?", "У чому головна складність удару з короткої передачі?", "Коли використовують удар з першої передачі?"]}, {"n": "9", "t": "Жести та суддівська термінологія. Індивідуальне і групове блокування, самостраховка", "g": "Учень знатиме основні жести та терміни судді і розумітиме техніку індивідуального та групового блокування з подальшою самостраховкою.", "k": "Модулі: Волейбол", "terms": [["Жест судді", "встановлений правилами рух рукою, яким суддя показує рішення або порушення."], ["Блокування", "дія гравців передньої лінії біля сітки, спрямована на перехоплення удару суперника вище верхнього краю сітки."], ["Груповий блок", "блок, у якому одночасно беруть участь двоє або троє гравців."], ["Самостраховка", "дії гравця для безпечного приземлення та швидкої готовності до продовження гри після стрибка."]], "th": [{"h": "Волейбол. Жести та суддівська термінологія", "p": ["Суддя спілкується з гравцями й глядачами переважно жестами: так рішення зрозуміле всім у залі, навіть у галасі. Спершу свисток, потім жест, яка команда подаватиме, потім жест помилки та, за потреби, гравця, що її скоїв.", "Знання жестів допомагає гравцю швидко зрозуміти, за що зараховано очко, а учневі — суддювати шкільні ігри."], "ul": ["Дозвіл на подачу — рух рукою в напрямку подачі.", "М'яч у полі — рука, витягнута вниз до майданчика.", "М'яч за межами — обидві руки, зігнуті в ліктях, піднято вгору долонями до себе.", "Чотири удари — чотири розставлені пальці.", "Подвійне торкання — два пальці вгору.", "Торкання сітки — рука показує на відповідний бік сітки."]}, {"h": "Волейбол. Індивідуальне та групове блокування, самостраховка", "p": ["Блокуючий стоїть біля сітки на відстані витягнутої руки, ноги на ширині плечей, руки на рівні плечей. Він стежить за м'ячем і нападником, у потрібний момент вистрибує вгору, виносить прямі руки над сіткою, пальці розставлені й напружені. Кисті трохи нахилені вперед-вниз, щоб м'яч відбивався на бік суперника.", "У груповому блоці гравці стрибають разом і ставлять руки поруч, без проміжку. Після блоку важлива самостраховка: приземлитися на обидві ноги, зігнути коліна, не заступити центральну лінію і одразу розвернутися обличчям до м'яча."], "ul": ["Фази: стійка — переміщення — стрибок — винесення рук — приземлення.", "Блокуючий стрибає трохи пізніше за нападника.", "Типова помилка: руки розставлені широко — м'яч проходить між ними.", "Типова помилка: торкання сітки — помилка блоку.", "Не приземлюйся на ногу партнера — тримай свою позицію.", "Дотик блоку не враховується в три торкання команди."]}], "f": "Дотик м'яча на блоці не враховується в три торкання, тому після блоку команда може ще тричі зіграти м'ячем.", "pr": ["Намалюй (або опиши) 6 суддівських жестів і підпиши, що кожен означає; покажи їх рідним і попроси вгадати значення.", "Виконай вправу для правильного приземлення без стрибків: повільні присідання до прямого кута в колінах 3 × 12 і утримання положення «напівприсід» 3 × 20 секунд."], "q": ["Яка послідовність дій судді після закінчення розіграшу?", "Як показати жест «м'яч за межами»?", "Чим груповий блок відрізняється від індивідуального?", "Що таке самостраховка після блоку?"]}, {"n": "10", "t": "Ведення протоколу гри. Верхня бокова подача в ліву і праву половину майданчика", "g": "Учень зрозуміє, як ведеться протокол волейбольного матчу, і закріпить знання про техніку та точність верхньої бокової подачі.", "k": "Модулі: Волейбол", "terms": [["Протокол гри", "офіційний документ матчу, у якому фіксують склади команд, розстановки, рахунок, заміни, тайм-аути та санкції."], ["Стартова розстановка", "порядок, у якому шість гравців команди займають зони на початку партії; його подають секретарю перед кожною партією."], ["Тайм-аут", "перерва тривалістю 30 секунд, яку може попросити команда (не більше двох у партії)."], ["Капітан команди", "гравець, який представляє команду перед суддями і підписує протокол."]], "th": [{"h": "Волейбол. Ведення протоколу гри", "p": ["Протокол веде секретар. Перед матчем у нього записують назву змагань, команди, номери та прізвища гравців, капітанів і тренерів. Перед кожною партією тренер подає листок із розстановкою — номери гравців у зонах I–VI, і секретар переносить їх у протокол. Це дозволяє контролювати порядок подач.", "Під час гри секретар позначає кожне очко, хто подавав, фіксує тайм-аути й заміни. Після закінчення партії записують рахунок і час, а наприкінці матчу протокол підписують капітани та судді. На шкільних змаганнях можна вести спрощений протокол."], "ul": ["Порядок подач має відповідати стартовій розстановці.", "Заміни записують: хто вийшов і хто вийшов на його місце, при якому рахунку.", "У партії команда має до 6 замін і до 2 тайм-аутів.", "Неправильний порядок подачі — помилка, очко отримує суперник.", "Протокол заповнюють акуратно, без виправлень, ручкою."]}, {"h": "Волейбол. Верхня бокова подача: закріплення точності", "p": ["На цьому етапі завдання — подавати у визначену половину майданчика за командою: учитель або партнер називає «ліва» чи «права», і гравець має змінити напрямок, не змінюючи техніку підкидання. Це наближає вправу до гри, адже тактика вимагає подавати туди, де суперник слабший.", "Корисно рахувати власні результати: скільки подач потрапило в поле і скільки — в задану половину. Такий самоконтроль показує прогрес краще за відчуття."], "ul": ["Ціль обирай до підкидання, а не під час нього.", "Ноги стоять стійко, вага на задній нозі до удару.", "Удар — у найвищій точці досяжності прямої руки.", "Після подачі — швидко в зону захисту.", "Перед серією подач — розминка плечей, ліктів і кистей."]}], "f": "", "pr": ["Склади спрощений протокол для шкільної гри: колонки для складу команд, рахунку партій, тайм-аутів і замін (на аркуші або в зошиті).", "Виконай вправу на рівновагу та стабільність корпусу: стояння на одній нозі 3 × 30 секунд на кожну ногу та бічна планка 2 × 20 секунд на кожен бік."], "q": ["Хто веде протокол гри і що в ньому фіксують?", "Навіщо перед партією подають стартову розстановку?", "Скільки замін і тайм-аутів має команда в партії?"]}, {"n": "11", "t": "Зонне блокування: закрити основний напрямок, блок найсильнішого нападника, вихід у зону удару", "g": "Учень зрозуміє тактику зонного блокування, вибору нападника для блоку та своєчасного виходу в зону удару.", "k": "Модулі: Волейбол", "terms": [["Зонне блокування", "тактика, коли блокуючий закриває певний напрямок удару, а інші напрямки страхують гравці захисту."], ["Основний напрямок удару", "напрямок, у який конкретний нападник б'є найчастіше, — переважно по ходу розбігу або по діагоналі."], ["Центральний блокуючий", "гравець зони 3, який бере участь у блоці по всій довжині сітки і допомагає крайнім блокуючим."], ["Вихід на блок", "переміщення блокуючого вздовж сітки до місця атаки з подальшим стрибком."]], "th": [{"h": "Волейбол. Зонне блокування та вибір нападника", "p": ["Закрити блоком увесь простір неможливо, тому блок домовляється із захистом: блокуючий закриває основний напрямок удару, а захисники стають туди, куди блок не дістає. Наприклад, при атаці із зони 4 крайній блокуючий закриває діагональ, а захисник зони 1 страхує удар по лінії.", "Якщо в суперника є один найсильніший нападник, команда намагається поставити проти нього подвійний блок. Для цього блокуючі уважно стежать за тим, куди летить друга передача, і першими переміщуються до цього гравця."], "ul": ["Перед розіграшем гравці домовляються, хто закриває який напрямок.", "Спостерігай за плечем і рукою нападника — вони підказують напрямок удару.", "Найсильнішого нападника блокують подвійним блоком.", "Своєчасний вихід: переміщення приставними або схресними кроками, стрибок — після стрибка нападника.", "Пізній вихід — нападник б'є «повз» блок."]}, {"h": "Волейбол. Своєчасний вихід у зону удару: техніка переміщень", "p": ["Блокуючий переміщується вздовж сітки приставними кроками (на короткі відстані) або схресними кроками (на дальні). Останній крок гальмівний: ноги ставлять паралельно сітці, коліна згинаються, і гравець одразу вистрибує вгору, не наближаючись до сітки.", "Спеціальні бігові вправи — біг приставними і схресними кроками, рвучкі старти — розвивають саме ту швидкість, яка потрібна для своєчасного виходу на блок."], "ul": ["Під час переміщення руки тримай перед собою на рівні плечей.", "Стрибок — строго вгору, а не вперед на сітку.", "Не перелітай центральну лінію — ризик травми гомілкостопа.", "Після приземлення — швидкий розворот до м'яча.", "Перед вправами біля сітки — розминка гомілкостопів і колін."]}], "f": "", "pr": ["Намалюй схему: атака суперника із зони 4, твій блок закриває діагональ. Познач, де мають стояти захисники, щоб страхувати удар по лінії.", "Виконай повільні приставні кроки вздовж стіни з підняттям рук угору (без стрибка): 4 × 6 кроків у кожен бік, і вправу «стільчик» біля стіни 3 × 30 секунд."], "q": ["Що таке зонне блокування?", "Як визначити основний напрямок удару нападника?", "Чому найсильнішого нападника блокують подвійним блоком?", "Чим небезпечний стрибок на блок уперед, на сітку?"]}, {"n": "12", "t": "Ефективність змагальної діяльності. Страховка партнера і розстановка «кутом вперед»", "g": "Учень пояснить, які фактори визначають ефективність гри волейболіста, і зрозуміє, як вибирати місце для страховки партнера та розташовуватися в побудові «кутом вперед».", "k": "Модулі: Волейбол", "terms": [["Змагальна діяльність", "дії спортсмена безпосередньо під час змагань, спрямовані на досягнення результату."], ["Ефективність гри", "співвідношення вдалих дій гравця чи команди до загальної кількості виконаних дій."], ["Страховка", "підстраховування партнера, що грає м'ячем, на випадок, якщо м'яч відскочить чи прийом буде неточним."], ["Побудова «кутом вперед»", "розташування гравців, за якого гравець зони 6 виходить уперед ближче до лінії атаки, утворюючи разом із гравцями зон 5 і 1 «кут», вершиною спрямований до сітки."]], "th": [{"h": "Волейбол. Фактори ефективності змагальної діяльності", "p": ["Результат гравця залежить від багатьох факторів: технічної майстерності (стабільність подачі, прийому, передачі, удару), тактичного мислення (уміння вибрати рішення), фізичної підготовленості (стрибучість, швидкість, витривалість) та психологічного стану (зосередженість, впевненість, уміння справитися з хвилюванням).", "Командна ефективність залежить ще й від взаємодії: навіть сильні гравці програють, якщо не розмовляють між собою і не страхують одне одного. Тренери аналізують статистику — відсоток вдалих прийомів, атак, подач — щоб зрозуміти, над чим працювати."], "ul": ["Технічна підготовленість — точність і стабільність прийомів гри.", "Тактична — правильний вибір дії в кожній ситуації.", "Фізична — сила, швидкість, стрибучість, витривалість.", "Психологічна — увага, емоційна стійкість, мотивація.", "Командна — розуміння ролей і спілкування на майданчику."]}, {"h": "Волейбол. Страховка партнера та розташування «кутом вперед»", "p": ["Коли партнер приймає м'яч, найближчі гравці не стоять на місці: вони зміщуються в бік, куди м'яч може відскочити після неточного прийому, і готові його дограти. Страхувальник стоїть трохи позаду і збоку від партнера, у низькій стійці.", "У побудові «кутом вперед» гравець зони 6 виходить ближче до лінії атаки. Він підстраховує короткі м'ячі та скидки біля сітки, а гравці зон 5 і 1 відповідають за задню частину майданчика. Ця побудова зручна, коли суперник часто грає м'якими ударами або обманом."], "ul": ["Страхувальник завжди обличчям до м'яча.", "Не заважай партнерові — тримай відстань 1–2 м.", "Голосом попереджай: «моя!», «твоя!».", "У побудові «кутом вперед» гравець зони 6 стоїть приблизно біля лінії атаки.", "Слабке місце побудови — глибокі м'ячі в центр задньої лінії."]}], "f": "", "pr": ["Оціни власні сильні та слабкі сторони як волейболіста за п'ятьма факторами (технічний, тактичний, фізичний, психологічний, командний) і запиши, над чим працюватимеш.", "Намалюй схему побудови «кутом вперед» і стрілками покажи, куди зміщуються гравці для страховки партнера, що приймає м'яч у зоні 5."], "q": ["Які фактори визначають ефективність гравця у змаганнях?", "Навіщо команді статистика гри?", "Де має стояти гравець, що страхує партнера?", "У яких ситуаціях доцільна побудова «кутом вперед»?"]}, {"n": "13", "t": "Верхня бокова подача: стабільність, самоконтроль і психологія подачі", "g": "Учень зрозуміє, як психологічний стан і самоконтроль впливають на якість подачі, та знатиме способи зберігати стабільність верхньої бокової подачі в ліву та праву половину майданчика.", "k": "Модулі: Волейбол", "terms": [["Передподачний ритуал", "однакова послідовність дій перед кожною подачею, що допомагає зосередитися та заспокоїтися."], ["Стабільність подачі", "здатність виконувати подачу з однаковою якістю багато разів поспіль, у тому числі під тиском рахунку."], ["Самоконтроль", "уміння спортсмена стежити за своїм станом, діями і результатами та коригувати їх."], ["Перехід подачі", "ситуація, коли команда, що приймала, виграє розіграш і отримує право подачі."]], "th": [{"h": "Волейбол. Психологія та стабільність подачі", "p": ["Подача відбувається в тиші і паузі, тому гравець залишається наодинці зі своїми думками. Хвилювання при важливому рахунку може «зламати» навіть добру техніку. Допомагає передподачний ритуал: однакова кількість ударів м'ячем об підлогу, глибокий вдих-видих, погляд на ціль. Мозок звикає до послідовності, і тіло виконує рух автоматично.", "Думки під час подачі мають бути короткими й позитивними: не «тільки б не в сітку», а «високо підкинути — прямою рукою»."], "ul": ["Використовуй 8 секунд після свистка, але не поспішай.", "Після невдалої подачі — видих, і думай про наступну дію.", "Ставлення до помилки: аналізувати, а не картати себе.", "Тренуй подачу в умовах тиску: «подай 5 поспіль у поле».", "Розминка перед подачами знижує і ризик травми, і напругу."]}, {"h": "Волейбол. Верхня бокова подача в ліву і праву половину: самоконтроль", "p": ["Щоб оцінити свою подачу, ведіть простий облік: із 10 спроб — скільки в поле, скільки в задану половину. Записуйте результати кожного уроку, і ви побачите динаміку. Якщо відсоток падає, повертайтеся до розбору фаз: підкидання, замах, удар.", "Самоконтроль стосується і самопочуття: якщо після серії подач болить плече, потрібно зменшити навантаження й повідомити вчителя. Біль — сигнал, а не норма."], "ul": ["Записуй результати: дата, кількість спроб, вдалих подач.", "Порівнюй себе з собою, а не лише з однокласниками.", "Звертай увагу на відчуття в плечі та лікті.", "Збільшуй кількість подач поступово.", "Чергуй подачі в ліву і праву половину, щоб тренувати контроль напрямку."]}], "f": "Багато професійних волейболістів мають власний, завжди однаковий ритуал перед подачею — це допомагає їм не хвилюватися у вирішальні моменти.", "pr": ["Склади таблицю самоконтролю подачі на 4 тижні (дата, спроби, вдалі подачі, відсоток, самопочуття) і заповни перший рядок за результатами уроку або за своєю оцінкою.", "Виконай дихальну вправу для заспокоєння: вдих на 4 рахунки, затримка на 4, видих на 6 — 6 повторень; далі імітація подачі без м'яча 2 × 10."], "q": ["Навіщо волейболісту передподачний ритуал?", "Як впоратися з хвилюванням перед подачею при важливому рахунку?", "Як вести самоконтроль якості подачі?"]}, {"n": "14", "t": "Попередження спортивного травматизму. Взаємодія приймальників зі зв'язковим у зонах 3, 2, 4", "g": "Учень знатиме основні причини травм у волейболі та способи їх попередження, а також розумітиме, як гравці на прийомі взаємодіють зі зв'язковим гравцем у зонах 3, 2, 4.", "k": "Модулі: Волейбол", "terms": [["Спортивна травма", "пошкодження тканин або органів, отримане під час занять спортом."], ["Профілактика травм", "комплекс заходів, що зменшують ризик травмування: розминка, правильна техніка, дозування навантаження, справний інвентар."], ["Зв'язковий гравець", "гравець, який виконує другу передачу на удар нападникам, з'єднуючи прийом і атаку (пасувальник)."], ["Перша передача", "перше торкання м'яча командою після подачі чи атаки суперника, найчастіше прийом знизу на зв'язкового."]], "th": [{"h": "Волейбол. Попередження спортивного травматизму", "p": ["У волейболі найчастіше трапляються травми пальців (вивихи, забиття під час передачі чи блоку), гомілкостопа (приземлення на ногу іншого гравця під сіткою), колін (часті стрибки) і плеча (перевантаження під час подач і ударів). Більшості з них можна уникнути.", "Ключ до безпеки — розминка, поступове збільшення навантаження, правильна техніка приземлення і уважність. Якщо травма сталася: зупинити заняття, прикласти холод, забезпечити спокій кінцівці й обов'язково повідомити вчителя."], "ul": ["Розминка мінімум 10 хвилин: суглоби, бігові та стрибкові вправи.", "Приземлення на дві ноги, коліна над стопами, а не «всередину».", "Пальці при блоці напружені, а не розслаблені.", "Не грай через біль і не приховуй травму.", "Зав'язані шнурки, сухий підлоговий покрив, без сторонніх предметів на майданчику.", "Пий воду й відпочивай між серіями вправ."]}, {"h": "Волейбол. Взаємодія приймальників зі зв'язковим у зонах 3, 2, 4", "p": ["Зв'язковий гравець найчастіше стоїть у зоні 3 або між зонами 2 і 3. Приймальники спрямовують першу передачу саме туди — високо й трохи від сітки, щоб зв'язковий міг зробити передачу будь-якому нападнику. Якщо зв'язковий у зоні 2, прийом спрямовують ближче до правого краю; якщо в зоні 4 — до лівого.", "До подачі приймальники повертаються обличчям до зв'язкового, щоб знати, куди спрямувати м'яч. Важливо, щоб перша передача була не надто швидкою і не «прилипала» до сітки."], "ul": ["Ціль прийому — зона зв'язкового, приблизно 1 м від сітки.", "Перша передача висока — дає зв'язковому час вийти під м'яч.", "Зв'язковий голосом показує, де він: «Я тут!».", "Кут платформи рук спрямовує м'яч у потрібну зону.", "Після прийому приймальник одразу готується до атаки або страховки."]}], "f": "", "pr": ["Склади пам'ятку «Як уникнути травм на уроці волейболу» з 7–8 пунктів і правила першої допомоги при забитті пальця чи розтягненні гомілкостопа.", "Виконай вправи для зміцнення гомілкостопів: підйоми на носки 3 × 20, перекати з п'яти на носок 2 × 15, обертання стопою 2 × 10 у кожен бік."], "q": ["Які травми найчастіше трапляються у волейболі?", "Що робити, якщо однокласник травмувався під час гри?", "Хто такий зв'язковий гравець і де він найчастіше розташований?", "Куди і з якою траєкторією має бути спрямована перша передача?"]}, {"n": "15", "t": "Український волейбол. Вибір атакуючого партнера для передачі, взаємодія гравців", "g": "Учень дізнається про розвиток волейболу в Україні та зрозуміє, як зв'язковий гравець вибирає партнера для атаки і як гравці взаємодіють у нападі.", "k": "Модулі: Волейбол", "terms": [["Федерація волейболу України", "громадська спортивна організація, що керує розвитком волейболу в Україні, організовує чемпіонати й формує національні збірні."], ["Догравальник", "нападник, що атакує переважно з краю сітки (зона 4) і також бере участь у прийомі подачі."], ["Діагональний нападник", "гравець, який атакує переважно з зони 2 та з задньої лінії і не приймає подачу."], ["Атакувальна комбінація", "заздалегідь узгоджена взаємодія нападників і зв'язкового, мета якої — ввести в оману блок суперника."]], "th": [{"h": "Волейбол. Розвиток і досягнення українського волейболу", "p": ["В Україні волейбол популярний давно: його грають у школах, університетах і спортивних клубах. До 1991 року українські спортсмени виступали у складі команд СРСР, а після здобуття незалежності Україна має власні чоловічу й жіночу національні збірні, які беруть участь у чемпіонатах Європи та міжнародних турнірах.", "Багато українських волейболістів і волейболісток грають у сильних клубах закордонних ліг, зокрема Італії, Польщі, Туреччини. В Україні проводять національні чемпіонати серед клубів, а також розвиваються пляжний волейбол і волейбол сидячи для людей з інвалідністю."], "ul": ["Розвитком гри в країні опікується Федерація волейболу України.", "Щороку проводяться чемпіонати України серед чоловічих і жіночих команд.", "Українські збірні змагаються на чемпіонатах Європи та в міжнародних турнірах.", "Розвиваються пляжний волейбол і волейбол сидячи.", "Шкільний і студентський волейбол — основа для майбутніх спортсменів."]}, {"h": "Волейбол. Вибір атакуючого партнера та взаємодія гравців", "p": ["Зв'язковий гравець — «мозок» команди. Перед передачею він оцінює: хто з нападників у кращій позиції, де менше блокуючих, який нападник зараз впевнено грає. Наприклад, якщо центральний блокуючий суперника пішов за нападником у зону 4, вигідно передати м'яч у зону 2.", "Нападники допомагають зв'язковому: голосом або домовленим знаком показують, яку передачу хочуть отримати, і завжди виходять на розбіг, навіть якщо м'яч, можливо, піде іншому. Так блок не знає, звідки буде атака."], "ul": ["Передавай м'яч туди, де блок найслабший.", "Віддавай важливі м'ячі нападнику, який зараз «у грі».", "Нападники виходять на атаку всі одночасно — це відволікає блок.", "Домовленість про комбінацію — до подачі.", "Неточний прийом — передавай високо на край, а не ризикуй."]}], "f": "", "pr": ["Підготуй коротке повідомлення (8–10 речень) про розвиток волейболу у твоєму місті чи області або про одну українську волейбольну команду (за матеріалами офіційних джерел).", "Намалюй схему: зв'язковий у зоні 3, нападники в зонах 2 і 4, блок суперника зміщений до зони 4. Стрілкою покажи найкращу передачу й поясни вибір."], "q": ["Які напрями волейболу розвиваються в Україні?", "Чим відрізняються ролі догравальника і діагонального нападника?", "За якими ознаками зв'язковий вибирає партнера для атаки?", "Навіщо всім нападникам виходити на розбіг одночасно?"]}, {"n": "16", "t": "Прийом м'яча знизу. Взаємодія приймальників зі зв'язковим гравцем у зонах 3, 2, 4", "g": "Учень удосконалить розуміння техніки прийому м'яча знизу двома руками та його точного спрямування на зв'язкового гравця в зонах 3, 2, 4.", "k": "Модулі: Волейбол", "terms": [["Платформа рук", "рівна поверхня з передпліч обох рук, складених разом, якою виконують прийом знизу."], ["Точка контакту", "місце на передпліччях трохи вище зап'ястків, куди має потрапляти м'яч під час прийому знизу."], ["Кут відбиття", "нахил платформи рук, що визначає напрямок польоту м'яча після прийому."], ["Прийом подачі", "перше торкання м'яча командою після подачі суперника."]], "th": [{"h": "Волейбол. Техніка прийому м'яча знизу", "p": ["Гравець стоїть у низькій стійці: ноги ширше плечей, коліна зігнуті, вага на передній частині стоп. Руки випрямлені й з'єднані: кисть однієї лежить на кисті іншої, великі пальці паралельні. Передпліччя утворюють рівну платформу.", "М'яч приймають перед собою, на рівні пояса, передпліччями трохи вище зап'ястків. Руки не «б'ють» по м'ячу — сильну подачу гасять, трохи подаючи руки назад, а слабку м'яч спрямовують розгинанням ніг. Напрямок задає кут платформи."], "ul": ["Ставай під м'яч ногами, а не тягнися руками.", "Лікті прямі, плечі трохи вперед.", "Типова помилка: м'яч потрапляє на кисті — летить непередбачувано.", "Типова помилка: замах руками — м'яч відлітає дуже далеко.", "Після прийому — руки роз'єднай і готуйся до наступної дії."]}, {"h": "Волейбол. Точний прийом на зв'язкового в зонах 3, 2, 4", "p": ["Якщо зв'язковий у зоні 3 — платформа спрямована до центру сітки. Коли зв'язковий стоїть у зоні 2, приймальник із зон 5 чи 6 повертає платформу праворуч, а тулуб — у бік цілі. Для зони 4 — навпаки. Важливо повернути до цілі все тіло ще до контакту з м'ячем.", "Спеціальні бігові вправи — швидкі зупинки, переміщення приставними кроками, біг спиною вперед — вчать вчасно опинятися під м'ячем."], "ul": ["Стопи й платформа «дивляться» в бік цілі.", "Висота першої передачі — вища за сітку.", "Відстань до сітки — близько 1 м.", "Спілкування: «Моя!» — хто приймає, решта страхує.", "Розминка кистей і передпліч перед вправою зменшує неприємні відчуття від м'яча."]}], "f": "", "pr": ["Опиши письмово послідовність фаз прийому м'яча знизу і дві типові помилки з порадами, як їх виправити.", "Виконай вправу «утримання стійки приймальника»: низька стійка з руками, складеними в платформу, 4 × 30 секунд, плюс приставні кроки в цій стійці по 6 у кожен бік (у вільному просторі)."], "q": ["Як правильно скласти руки для прийому знизу?", "На яку частину рук має потрапляти м'яч?", "Як гасити силу сильної подачі?", "Як змінити напрямок прийому, якщо зв'язковий у зоні 2?"]}, {"n": "17", "t": "Взаємодія з гравцем, що виконує другу передачу. Верхня бокова подача", "g": "Учень розумітиме, як нападники взаємодіють із зв'язковим, що виконує другу передачу, та закріпить знання про техніку верхньої бокової подачі.", "k": "Модулі: Волейбол", "terms": [["Друга передача", "друге торкання команди, найчастіше верхня передача зв'язкового нападнику для атаки."], ["Відкривання", "переміщення нападника на позицію для розбігу, звідки він може отримати передачу й атакувати."], ["Темп атаки", "швидкість розвитку нападу: від високої передачі (повільний темп) до короткої (швидкий темп)."], ["Сигнал нападника", "домовлений знак або вигук, яким нападник повідомляє зв'язковому, яку передачу хоче отримати."]], "th": [{"h": "Волейбол. Взаємодія з гравцем, що виконує другу передачу", "p": ["Після прийому всі нападники одразу «відкриваються»: відходять від сітки до лінії атаки, щоб мати місце для розбігу. Зв'язковий бачить, хто готовий, і вибирає передачу. Нападник має стежити за руками зв'язкового і починати розбіг у потрібний момент: для високої передачі — після передачі, для короткої — раніше.", "Якщо перша передача неточна і зв'язковий не встигає, другу передачу може виконати інший гравець. Тоді нападники мають бути готові до високої передачі на край — найбезпечнішого варіанта."], "ul": ["Після прийому — швидко відійди від сітки для розбігу.", "Повідом зв'язковому голосом про свою готовність.", "Висока передача — розбіг пізніше, коротка — раніше.", "Зв'язковий виконує передачу лицем до зони 4, щоб маскувати передачу назад.", "Якщо зв'язковий не встигає, другу передачу виконує найближчий гравець."]}, {"h": "Волейбол. Верхня бокова подача: зв'язок подачі з грою", "p": ["Подача — не окремий елемент, а частина розіграшу. Після удару подавальник одразу заходить у майданчик і займає свою позицію в захисті, найчастіше в зоні 1 або 6. Команда заздалегідь знає, куди подаватиме гравець, і може краще підготувати блок.", "Повторюючи техніку верхньої бокової подачі, стеж за ключовими моментами: стабільне підкидання, пряма рука, удар у найвищій точці, поворот тулуба до сітки."], "ul": ["Після подачі — 2–3 кроки в майданчик і низька стійка.", "Подача в зону 1 або 5 суперника ускладнює розбіг його нападникам.", "Подавальник повідомляє команду жестом, куди подаватиме.", "Подачу не виконують, доки суддя не дав свисток.", "Помилка подачі — очко суперникові, тому стабільність важливіша за силу."]}], "f": "", "pr": ["Намалюй схему: зв'язковий у зоні 3, нападники «відкриваються» в зонах 2, 3, 4. Стрілками покажи шлях кожного нападника до місця розбігу.", "Виконай вправи для плечей і кистей з легкою пляшкою води (0,5 л): підйоми рук перед собою 2 × 12, вбік 2 × 12, обертання кистями 2 × 15."], "q": ["Що означає «відкриватися» для нападника?", "Коли починати розбіг на високу і на коротку передачу?", "Що робить подавальник одразу після подачі?"]}, {"n": "18", "t": "Страховка партнера, що виконує прийом. Розстановка «кутом вперед» і «кутом назад»", "g": "Учень удосконалить уміння вибирати місце для страховки партнера та порівнювати побудови «кутом вперед» і «кутом назад» у захисті.", "k": "Модулі: Волейбол", "terms": [["Страхувальник", "гравець, який підстраховує партнера, що грає м'ячем, і готовий дограти відскок."], ["Обманний удар (скидка)", "м'який удар пальцями чи кистю за блок або на порожнє місце біля сітки замість сильного удару."], ["Зона відповідальності", "частина майданчика, за прийом м'ячів у якій відповідає конкретний гравець."], ["Побудова «кутом назад»", "розташування гравців, за якого гравець зони 6 стоїть біля лицьової лінії, страхуючи глибокі удари."]], "th": [{"h": "Волейбол. Вибір місця при страховці партнера", "p": ["Кожен гравець на майданчику має свою зону відповідальності, але м'яч часто відлітає непередбачувано. Тому, коли партнер приймає м'яч, гравці поруч зміщуються до нього на 1–2 кроки і займають місце туди, куди м'яч найімовірніше відскочить: позаду-збоку від приймаючого і ближче до центру майданчика.", "Страховка потрібна і в нападі: коли свій нападник б'є, інші гравці стають півколом навколо нього, бо м'яч може відскочити від блоку суперника назад на наш бік."], "ul": ["Страхуй у низькій стійці, руки готові до прийому.", "Займай місце, з якого видно і м'яч, і партнера.", "Не стій на лінії руху партнера — заважатимеш йому.", "Страховка нападника: 2–3 гравці півколом на відстані 1–2 м.", "Голосна підказка — частина страховки."]}, {"h": "Волейбол. Побудови «кутом вперед» і «кутом назад»", "p": ["У побудові «кутом вперед» гравець зони 6 стоїть ближче до сітки, біля лінії атаки, і відповідає за скидки й м'ячі від блоку, а гравці зон 1 і 5 — за глибокі удари. Ця схема ефективна, коли суперник часто обманює або коли наш блок сильний.", "У побудові «кутом назад» гравець зони 6 стоїть далеко, біля лицьової лінії, і страхує сильні удари в глибину. Тоді короткі м'ячі страхують гравці передньої лінії, що не беруть участі в блоці. Команда обирає побудову залежно від манери гри суперника."], "ul": ["«Кутом вперед» — проти скидок і м'яких ударів.", "«Кутом назад» — проти сильних глибоких ударів.", "Слабке місце «кутом вперед» — центр задньої лінії.", "Слабке місце «кутом назад» — зона біля сітки за блоком.", "Перехід з однієї побудови на іншу команда узгоджує під час тайм-ауту або до подачі."]}], "f": "", "pr": ["Намалюй дві схеми — «кутом вперед» і «кутом назад» — під час атаки суперника із зони 4 і познач, які частини майданчика в кожній залишаються вразливими.", "Виконай вправу на реакцію і стійку: з низької стійки швидкий крок вліво — повернення — крок вправо за сигналом рідних (оплеск), 3 × 10 разів у вільному просторі."], "q": ["Де має стояти гравець, що страхує партнера на прийомі?", "Як страхувати свого нападника?", "Чим відрізняються побудови «кутом вперед» і «кутом назад»?", "Коли команді вигідніше обрати «кутом назад»?"]}, {"n": "19", "t": "Зонне блокування: читання нападника, час стрибка і своєчасний вихід у зону удару", "g": "Учень удосконалить розуміння зонного блокування: як «читати» нападника, вибирати момент стрибка і закривати основний напрямок удару найсильнішого гравця.", "k": "Модулі: Волейбол", "terms": [["Читання нападника", "спостереження за розбігом, положенням плеча й руки нападника, щоб передбачити напрямок його удару."], ["Час стрибка на блок", "момент відштовхування блокуючого, що має бути трохи пізнішим за стрибок нападника."], ["Перенесення рук", "активне винесення рук блокуючого над сіткою на бік суперника, щоб перекрити напрямок удару."], ["Блок-аут", "удар нападника в руки блоку, після якого м'яч вилітає за межі майданчика; очко отримує атакуюча команда."]], "th": [{"h": "Волейбол. Читання нападника та вибір напрямку блоку", "p": ["Досвідчений блокуючий не дивиться весь час на м'яч. Після передачі він переводить погляд на нападника: звідки той починає розбіг, під яким кутом підходить до сітки, куди розвернуте плече. Розбіг під кутом до сітки найчастіше закінчується ударом по діагоналі, а розбіг паралельно сітці — ударом по лінії.", "Найсильнішого нападника суперника блокують заздалегідь: ще до подачі вирішують, хто його «веде» і хто допомагає в подвійному блоці. Це і є тактика блокування найсильнішого нападника."], "ul": ["Послідовність погляду: м'яч — зв'язковий — м'яч — нападник.", "Розбіг під кутом — частіше діагональ.", "Розбіг вздовж сітки — частіше лінія.", "Кисті блокуючого розвернуті до центру майданчика суперника.", "Найкраще блокують ті, хто розуміє, а не лише високо стрибає."]}, {"h": "Волейбол. Своєчасний вихід у зону удару та безпека біля сітки", "p": ["Стрибок на блок робиться трохи пізніше за нападника: проти високої передачі — коли нападник уже відштовхнувся, проти короткої — практично одночасно з ним. Занадто ранній стрибок означає, що блокуючий почне опускатися саме в момент удару.", "Після приземлення блокуючий одразу розвертається і готується до страховки або атаки. Найризикованіша ситуація — приземлення на ногу суперника під сіткою. Щоб її уникнути, стрибай вертикально і не заходь за центральну лінію."], "ul": ["Ранній стрибок — нападник б'є над руками, що опускаються.", "Пізній стрибок — м'яч пролітає раніше, ніж руки над сіткою.", "Блок-аут виникає, коли руки блоку розставлені занадто широко.", "Перед блоком — коліна зігнуті, руки на рівні плечей.", "Розминка гомілкостопів і колін обов'язкова."]}], "f": "", "pr": ["Опиши 2–3 ознаки, за якими блокуючий може передбачити напрямок нападаючого удару, і як він має розташувати руки в кожному випадку.", "Виконай вправу «присід — підйом на носки з витягнутими вгору руками» повільно, без стрибка, 3 × 10 і бічні випади 2 × 8 на кожну ногу."], "q": ["Що означає «читати» нападника?", "Коли правильно стрибати на блок проти високої передачі?", "Що таке блок-аут і як його уникнути?"]}, {"n": "20", "t": "Прийом м'яча знизу. Контрольний норматив: верхня бокова подача в ліву і праву половину", "g": "Учень знатиме, як правильно виконувати і готуватися до контрольного нормативу з верхньої бокової подачі та як оцінити свій результат, а також закріпить техніку прийому знизу.", "k": "Модулі: Волейбол", "terms": [["Контрольний норматив", "встановлене вчителем завдання для перевірки рівня володіння певним технічним прийомом."], ["Зарахована спроба", "спроба, виконана з дотриманням правил і умов нормативу."], ["Залік", "перевірка, результат якої визначає, чи засвоєний учнем технічний прийом."], ["Самооцінка", "порівняння учнем власного результату з вимогами та своїми попередніми досягненнями."]], "th": [{"h": "Волейбол. Прийом м'яча знизу: ключові моменти перед нормативом", "p": ["Прийом знизу — основа захисту, тому його повторюють на кожному занятті. Ключові моменти: низька стійка, руки складені в платформу ще до підльоту м'яча, контакт на передпліччях, робота ніг, а не рук.", "Перед контрольним нормативом з подачі добре прийом розминає та налаштовує: гравці в парах виконують подачі через сітку й приймають їх знизу, відчуваючи силу і траєкторію м'яча."], "ul": ["Стійка: ноги ширше плечей, коліна зігнуті, вага на передній частині стопи.", "Платформа рівна, лікті прямі.", "Спрямування м'яча — ногами та кутом платформи.", "Не відходь назад під м'яч, якщо можна зробити крок вбік.", "Голосно повідомляй: «Моя!»."]}, {"h": "Волейбол. Контрольний норматив: верхня бокова подача в ліву і праву половину", "p": ["Умови нормативу (кількість спроб і скільки з них потрібно влучити) повідомляє вчитель. Зазвичай учень виконує серію подач із зони подачі: спочатку в ліву половину майданчика суперника, потім у праву, або за командою вчителя. Зараховують подачі, що перелетіли сітку без торкання антен і впали в задану половину.", "Як підготуватися: розімнути плечовий суглоб, виконати кілька пробних подач, налаштуватися ритуалом. Під час нормативу не поспішай — кожну подачу виконуй як окрему. Після — порівняй результат з минулими уроками: це важливіше, ніж оцінка в моменті."], "ul": ["Не зараховують подачу із заступом за лицьову лінію.", "Не зараховують подачу в сітку, в аут або не в задану половину.", "М'яч на лінії вважається влучним.", "Між спробами — спокійний вдих-видих.", "Після нормативу — розтягування м'язів плеча."]}], "f": "", "pr": ["Запиши умови нормативу, які оголосив учитель, свій результат (або очікуваний) і план із 3 кроків, як покращити подачу.", "Виконай вправи на розтягування плечового пояса: підтягування ліктя до протилежного плеча 3 × 20 секунд кожною рукою і «замок» за спиною 3 × 20 секунд."], "q": ["Які подачі не зараховуються під час нормативу?", "Як правильно підготуватися до контрольного нормативу з подачі?", "Як оцінювати свій результат, крім оцінки вчителя?"]}, {"n": "21", "t": "Одиночне, подвійне й потрійне блокування. Блокування з подальшою самостраховкою", "g": "Учень удосконалить розуміння індивідуального та групового блокування, взаємодії блокуючих і безпечної самостраховки після блоку.", "k": "Модулі: Волейбол", "terms": [["Одиночний блок", "блок, який ставить один гравець; застосовують проти швидких атак або коли інші не встигають."], ["Подвійний блок", "блок двох гравців, які стрибають разом, щільно змикаючи руки."], ["Потрійний блок", "блок, у якому беруть участь усі троє гравців передньої лінії, найчастіше проти атаки із центру або проти найсильнішого нападника."], ["Ведучий блокуючий", "гравець, який задає місце блоку, а партнер «прилаштовується» до нього."]], "th": [{"h": "Волейбол. Взаємодія гравців у груповому блоці", "p": ["У подвійному блоці один гравець — ведучий: найчастіше крайній блокуючий визначає місце, навпроти руки нападника, а центральний підходить до нього й стрибає поруч. Руки обох гравців мають бути близько, без проміжку, інакше нападник проб'є між ними.", "Потрійний блок закриває більшу частину сітки, але залишає незахищеною зону біля сітки за блоком. Тому його використовують проти потужних нападників, а захист при цьому страхує скидки."], "ul": ["Центральний блокуючий переміщується до крайнього, а не навпаки.", "Стрибати потрібно одночасно — домовляйтеся голосом.", "Руки над сіткою: щільно, пальці розставлені, кисті напружені.", "Одиночний блок частіше проти короткої передачі.", "Потрійний блок вимагає страховки за блоком."]}, {"h": "Волейбол. Блокування з наступною самостраховкою", "p": ["Самостраховка після блоку складається з кількох дій: м'яке приземлення на обидві ноги з амортизацією колінами, контроль положення ніг біля центральної лінії і швидкий розворот обличчям до м'яча. Якщо м'яч від блоку відскочив на свій бік, блокуючий одразу готується його дограти.", "У груповому блоці гравці приземлюються там, звідки стрибали, щоб не зіткнутися. Руки після контакту з м'ячем повертаються від сітки вгору і назад, не торкаючись її."], "ul": ["Приземлення — на передню частину стопи з перекатом на всю стопу.", "Коліна не «завалюються» всередину.", "Не заходь за центральну лінію.", "Не торкайся сітки руками під час опускання.", "Після приземлення — погляд на м'яч."]}], "f": "", "pr": ["Намалюй схеми одиночного, подвійного і потрійного блоку проти атаки із зони 4 суперника і познач, де лишається незахищена зона.", "Виконай вправи для сили ніг і стабільності колін: присідання з паузою внизу 3 × 10, «місток» на лопатках 3 × 12 (повільно, з контролем положення колін)."], "q": ["Хто в подвійному блоці визначає місце блоку?", "Коли доцільний потрійний блок і в чому його слабкість?", "З яких дій складається самостраховка після блоку?"]}, {"n": "22", "t": "Прийом м'яча знизу. Система прийому та взаємодія зі зв'язковим у зонах 3, 2, 4", "g": "Учень зрозуміє, як команда будує систему прийому подачі та як приймальники налагоджують взаємодію зі зв'язковим гравцем у зонах 3, 2, 4.", "k": "Модулі: Волейбол", "terms": [["Система прийому", "розташування гравців команди на прийомі подачі, що визначає, хто приймає м'яч і де стоїть зв'язковий."], ["Розстановка на прийомі", "конкретне положення гравців на майданчику в момент подачі суперника, дозволене правилами."], ["Перехід у напад", "дії команди одразу після прийому: друга передача і атака."], ["Комунікація на майданчику", "обмін короткими вигуками та знаками між гравцями для узгодження дій."]], "th": [{"h": "Волейбол. Система
