а землю, що розвивають відчуття м'яча й координацію."], ["Удар головою на точність", "удар, мета якого — влучити м'ячем у задану ціль: зону воріт, партнера або позначку."], ["Самооцінка техніки", "порівняння власного виконання з еталонною технікою за конкретними ознаками."], ["Підвідна вправа", "спрощена вправа, яка поступово готує до виконання складного технічного прийому."]], "th": [{"h": "Футбол. Повторення: види ударів головою", "p": ["Протягом розділу ви вивчили удари головою з місця, у стрибку, з поворотом, в обороні та нападі. Усі вони мають спільну основу: м'яч приймають серединою лоба, сила йде від тулуба, шия зафіксована, очі відкриті."], "ul": ["З місця — крокова стійка, прогин і рух тулуба вперед.", "У стрибку — удар у найвищій точці, поштовх однією або двома ногами.", "З поворотом — тулуб повертається в бік передачі.", "В обороні — високо й далеко; в нападі — вниз у ворота.", "Скидка — м'який дотик для партнера."]}, {"h": "Футбол. Жонглювання головою та підвідні вправи", "p": ["Жонглювання головою вчить відчувати м'яч і точно ставити лоб під нього. Робиться воно легкими поштовхами ногами та тулубом, а не кивками головою. Починати варто з легкого м'яча та підвідних вправ."], "ul": ["Підкиньте м'яч руками і зловіть після одного удару лобом.", "Далі — два-три удари поспіль, потім більше.", "Коліна злегка зігнуті, м'яч піднімається невисоко.", "Очі стежать за м'ячем постійно.", "Не робіть надто багато повторень за одне заняття."]}, {"h": "Футбол. Удар головою на точність і самооцінка", "p": ["Перевірити якість удару можна, б'ючи в задану ціль. Оцінюйте себе не лише за влучанням, а й за технікою: як ви стояли, чи був прогин, чи бачили м'яч."], "ul": ["Ціль — частина воріт, обруч або партнер на певній відстані.", "Після кожної спроби коротко аналізуйте: що вдалося, що ні.", "Попросіть партнера чи вчителя оцінити вашу техніку за переліком ознак.", "Порівнюйте результати з попередніми спробами, а не лише з іншими.", "Записуйте прогрес у щоденник самоконтролю."]}], "f": "", "pr": ["Складіть перелік із 5–6 ознак правильного удару головою, за якими можна оцінити свою техніку (чек-лист самооцінки).", "Виконайте імітацію удару головою з поворотом без м'яча перед дзеркалом: по 10 повторень у кожен бік, 2 підходи."], "q": ["Що спільного в техніці всіх видів ударів головою?", "Як правильно жонглювати м'ячем головою?", "Які підвідні вправи допомагають опанувати удар головою?", "За якими ознаками можна оцінити власну техніку удару?"]}, {"n": "77", "t": "Удари по м'ячу ногою. Контрольний норматив: зупинка м'яча різними способами", "g": "Учень знатиме, як правильно підготуватися та виконати контрольний норматив зі зупинки м'яча різними способами і як оцінити свій результат.", "k": "Модулі: Футбол", "terms": [["Контрольний норматив", "завдання для перевірки рівня технічної чи фізичної підготовленості, що виконується за однаковими для всіх умовами."], ["Якість виконання", "відповідність техніки прийому правильному зразку: положення тіла, частина стопи, контроль м'яча."], ["Зупинка в задану зону", "прийом м'яча, після якого він залишається в межах позначеного простору біля гравця."], ["Розминка перед тестом", "комплекс вправ, що готує м'язи, суглоби й нервову систему до максимально якісного виконання тесту."]], "th": [{"h": "Футбол. Повторення ударів по м'ячу ногою", "p": ["Норматив зі зупинки часто виконують у парах: один гравець передає, другий зупиняє. Тому якісні, точні передачі партнерові теж важливі — від них залежить і його результат."], "ul": ["Передача внутрішньою стороною стопи — найточніша для вправ у парах.", "Опорна нога поруч із м'ячем, носок у бік партнера.", "Для високих м'ячів — підкидання рукою або удар підйомом за вказівкою вчителя.", "Сила передачі — помірна, щоб партнер міг прийняти.", "Будьте чесним партнером: давайте однаково зручні передачі всім."]}, {"h": "Футбол. Як виконується норматив зі зупинки м'яча", "p": ["Під час нормативу вчитель перевіряє, чи вмієте ви зупинити м'яч різними способами: внутрішньою стороною стопи, підошвою, стегном, грудьми. Кількість спроб, відстань і вимоги визначає вчитель. Зазвичай оцінюють, чи залишився м'яч під контролем і чи правильна техніка."], "ul": ["Уважно вислухайте умови: способи зупинки, кількість спроб, межі зони.", "Займіть стійку заздалегідь: коліна зігнуті, вага на передній частині стоп.", "Рухайтеся назустріч м'ячу, не чекайте на місці.", "У момент дотику — амортизація, м'яч має залишитися поруч.", "Після кожної спроби — коротка пауза, вдих-видих і повна зосередженість."]}, {"h": "Футбол. Підготовка до тесту та самооцінка результату", "p": ["Хороший результат залежить від розминки, концентрації та знання техніки. Після тесту корисно проаналізувати, які способи зупинки вам вдаються, а над якими варто ще попрацювати."], "ul": ["Розминка 10–15 хв: спеціальні бігові вправи, суглобова гімнастика, кілька пробних зупинок.", "Тест виконуйте у спортивному взутті, яке не ковзає.", "Порахуйте свої вдалі спроби для кожного способу окремо.", "Порівняйте результат зі своїми попередніми спробами.", "Визначте найслабший спосіб зупинки і сплануйте, як його тренувати."]}], "f": "", "pr": ["Опишіть письмово техніку чотирьох способів зупинки м'яча (внутрішньою стороною стопи, підошвою, стегном, грудьми) та типову помилку для кожного.", "Складіть і виконайте розминку перед тестом (6–8 вправ на місці: суглобова гімнастика, присідання, випади, махи ногами) і запишіть її з дозуванням."], "q": ["Які способи зупинки м'яча можуть перевірятися в нормативі?", "Що оцінює вчитель під час виконання тесту?", "Як правильно розім'ятися перед контрольним нормативом?", "Як проаналізувати свій результат після тесту?"]}, {"n": "78", "t": "Зупинки та ведення м'яча. Контрольний норматив: ведення м'яча різними способами. Підсумок розділу", "g": "Учень знатиме, як підготуватися й виконати норматив із ведення м'яча різними способами, та підсумує вивчене в розділі «Футбол».", "k": "Модулі: Футбол", "terms": [["Ведення «слаломом»", "ведення м'яча між стійками чи фішками, розташованими в лінію, зі зміною напрямку біля кожної."], ["Критерії оцінювання", "показники, за якими оцінюють виконання нормативу: час, точність, правильність техніки, контроль м'яча."], ["Збиття стійки", "помилка під час тесту на ведення, коли гравець або м'яч зачепив стійку чи пропустив її."], ["Рефлексія", "осмислення власних досягнень і труднощів після навчання, щоб визначити подальші цілі."]], "th": [{"h": "Футбол. Контрольний норматив: ведення м'яча", "p": ["Норматив із ведення зазвичай полягає в проходженні дистанції з м'ячем різними способами: прямо, між стійками («слаломом»), зі зміною напрямку. Умови визначає вчитель. Оцінюють час, правильність техніки і те, чи зберіг гравець контроль над м'ячем."], "ul": ["Перед стартом уважно розгляньте трасу й умови тесту.", "Біля стійок м'яч тримайте ближче до ноги, на прямих ділянках — можна відпускати далі.", "Використовуйте внутрішню й зовнішню сторону стопи, щоб змінювати напрямок.", "Краще трохи повільніше, але без збиття стійок і втрати м'яча.", "Розминка 10–15 хв і кілька пробних проходжень із м'ячем перед тестом."]}, {"h": "Футбол. Самооцінка результату тесту", "p": ["Після тесту оцініть себе чесно: не лише час чи оцінку, а й якість ведення. Порівняйте свій результат із попереднім — це найкращий показник прогресу."], "ul": ["Чи зберігали ви контроль над м'ячем на всій дистанції?", "Чи вдавалося вести м'яч обома ногами?", "Чи піднімали ви голову під час ведення?", "Де втрачали найбільше часу — на розворотах чи на прямій?", "Визначте один елемент, який будете вдосконалювати."]}, {"h": "Футбол. Підсумок розділу", "p": ["У розділі «Футбол» ви повторили правила безпеки та гри, вивчили техніку ударів ногою і головою, зупинок, ведення, фінтів, відбору, техніку воротаря та основи тактики. Ці знання допоможуть грати в шкільних і дворових матчах свідомо, безпечно й командно."], "ul": ["Техніка: удари ногою різними способами, удари головою, зупинки, ведення, фінти, підкат.", "Воротар: позиція, ловля, кидки, вибивання, гра на виходах.", "Тактика: швидкий і поступовий напад, оборона, ролі гравців, стандарти.", "Правила: офсайд, картки, обмеження для воротаря, небезпечна гра.", "Безпека й самоконтроль: розминка, пульс, обережність з ударами головою."]}], "f": "Міжнародна федерація футболу (ФІФА) була заснована в Парижі в 1904 році.", "pr": ["Напишіть рефлексію (6–8 речень): що в розділі «Футбол» вдалося найкраще, що було найскладнішим і над чим ви плануєте працювати далі.", "Складіть план самостійного тренування на тиждень (3 заняття), у якому поєднуються розминка, вправи на рівновагу, координацію та зміцнення м'язів, безпечні для виконання вдома."], "q": ["Як правильно виконувати норматив із ведення м'яча між стійками?", "За якими критеріями оцінюють ведення м'яча?", "Які тактичні види нападу ви вивчили в розділі?", "Які правила безпеки найважливіші під час гри у футбол?"]}]}, {"name": "Розділ 4. Легка атлетика (уроки 79–105)", "lessons": [{"n": "79", "t": "Безпека на заняттях легкою атлетикою. Біг 30 м. Стрибок у довжину способом «зігнувши ноги»", "g": "Учень знатиме правила безпеки на заняттях легкою атлетикою, техніку бігу на 30 м із низького старту та фази стрибка в довжину способом «зігнувши ноги».", "k": "Модулі: Легка атлетика", "terms": [["Первинний інструктаж", "перше ознайомлення учнів із правилами безпеки перед початком вивчення розділу програми."], ["Низький старт", "спосіб старту з опорою на руки й ноги, який дає змогу найшвидше розпочати біг на коротких дистанціях."], ["Стартовий розгін", "перші 10–15 кроків після старту, під час яких бігун поступово випрямляє тулуб і набирає максимальну швидкість."], ["Спосіб «зігнувши ноги»", "найпростіший спосіб стрибка в довжину, коли в польоті махова нога приєднується до поштовхової, і стрибун летить у положенні присіду."]], "th": [{"h": "Легка атлетика. Правила безпеки (первинний інструктаж з БЖД)", "p": ["Легка атлетика — це біг, ходьба, стрибки й метання. Заняття проходять на стадіоні, де одночасно можуть бігати, стрибати й метати різні групи. Тому головне правило — бути уважним і виконувати вправи лише за сигналом учителя."], "ul": ["Займайтеся в спортивному взутті з неслизькою підошвою та у зручному одязі; прикраси й годинник знімайте.", "Перед основною частиною обов'язково виконуйте розминку (ЗРВ і спеціальні бігові вправи).", "Біжіть лише по своїй доріжці, не перетинайте бігову доріжку перед іншими бігунами.", "Не стійте в секторі для метання і не підбирайте снаряди без команди.", "Стрибайте в яму з розпушеним піском без сторонніх предметів.", "Про погане самопочуття чи травму одразу повідомляйте вчителя."]}, {"h": "Легка атлетика. Спеціальні бігові вправи та біг 30 м", "p": ["Спеціальні бігові вправи (біг з високим підніманням стегна, із закиданням гомілки, семенячий біг, стрибкоподібний біг) розігрівають м'язи й навчають правильних рухів. Біг на 30 м перевіряє, як швидко ви реагуєте на сигнал і розганяєтеся, адже вся дистанція — це практично старт і розгін."], "ul": ["Команди: «На старт!» — стати в стартове положення; «Увага!» — підняти таз трохи вище плечей; сигнал — енергійний виштовх.", "Перші кроки короткі й часті, тулуб нахилений уперед.", "Руки зігнуті в ліктях, рухаються вперед-назад, а не поперек тіла.", "Пробігайте фінішну лінію, не сповільнюючись перед нею.", "Типова помилка: різке випрямлення тулуба одразу після старту."]}, {"h": "Легка атлетика. Стрибок у довжину способом «зігнувши ноги»", "p": ["Стрибок у довжину з розбігу складається з чотирьох фаз: розбіг, відштовхування, політ і приземлення. У способі «зігнувши ноги» після відштовхування махова нога зігнута попереду, потім до неї підтягується поштовхова, і стрибун летить «у присіді»."], "ul": ["Розбіг — рівномірно прискорений, останні кроки найшвидші.", "Відштовхування однією ногою від бруска, махова нога енергійно виноситься вперед-угору.", "У польоті тулуб прямий, ноги підтягуються до грудей.", "Перед приземленням ноги викидаються вперед, руки — вперед-донизу.", "Приземлення на обидві ноги з м'яким згинанням колін і перенесенням ваги вперед."]}], "f": "У стрибках у довжину результат вимірюють від лінії відштовхування до найближчого сліду, який залишив стрибун у піску, — тому падіння назад «з'їдає» частину стрибка.", "pr": ["Запишіть 6 правил безпеки на заняттях легкою атлетикою, які вважаєте найважливішими, і поясніть, чому.", "Виконайте розминку на місці: біг з високим підніманням стегна та із закиданням гомілки на місці по 20 секунд, 3 серії з паузою 30 секунд."], "q": ["Чому на стадіоні не можна перетинати бігову доріжку під час забігу?", "Що робить бігун за командою «Увага!»?", "З яких фаз складається стрибок у довжину з розбігу?", "Як правильно приземлятися в яму з піском?"]}, {"n": "80", "t": "Ознаки втоми. Стрибок у довжину з місця та з розбігу «зігнувши ноги»", "g": "Учень навчиться розпізнавати ознаки втоми під час занять, знатиме техніку стрибка в довжину з місця та вдосконалить стрибок з розбігу.", "k": "Модулі: Легка атлетика", "terms": [["Втома", "тимчасове зниження працездатності організму внаслідок фізичного чи розумового навантаження."], ["Перевтома", "стан, коли організм не встигає відновлюватися між заняттями, і втома накопичується."], ["Задишка", "утруднене, прискорене дихання, яке виникає під час інтенсивної роботи."], ["Мах руками", "швидкий рух прямих рук назад, а потім уперед-угору, який допомагає збільшити дальність стрибка."]], "th": [{"h": "Легка атлетика. Ознаки втоми під час занять", "p": ["Втома — природна реакція організму на навантаження, саме завдяки їй з часом зростає тренованість. Але важливо помічати, коли втома стає надмірною, щоб не травмуватися й не нашкодити здоров'ю. Повторення інструктажу з БЖД нагадує: про погане самопочуття потрібно одразу говорити вчителю."], "ul": ["Легка втома: невелике почервоніння обличчя, помірне потовиділення, рівне дихання.", "Значна втома: сильне почервоніння, прискорене дихання, порушення координації рухів.", "Надмірна втома: блідість або синюшність губ, запаморочення, нудота, біль у грудях — негайно припинити вправу.", "Після навантаження переходьте на ходьбу, а не сідайте чи лягайте одразу.", "Хронічна перевтома проявляється поганим сном, дратівливістю й небажанням тренуватися."]}, {"h": "Легка атлетика. Стрибок у довжину з місця", "p": ["Стрибок з місця виконують відштовхуванням обома ногами. Він показує швидкісно-силові можливості ніг. Дальність залежить не лише від сили, а й від узгодженості маху руками з випрямленням ніг."], "ul": ["Стопи на ширині плечей, носки біля лінії.", "Напівприсід з нахилом уперед і махом рук назад.", "Потужний мах руками вперед-угору одночасно з випрямленням ніг.", "У польоті коліна підтягуються вперед.", "Приземлення на обидві ноги, руки вперед, щоб не впасти назад."]}, {"h": "Легка атлетика. Стрибок у довжину з розбігу «зігнувши ноги»", "p": ["На цьому уроці закріплюємо узгодження розбігу з відштовхуванням. Головне — не сповільнюватися перед бруском і відштовхуватися швидко, «вперед-угору», а не лише вгору."], "ul": ["Ставте поштовхову ногу на брусок усією стопою з перекатом з п'ятки на носок.", "Під час відштовхування нога майже повністю випрямляється.", "Махову ногу виносьте зігнутою в коліні.", "Типова помилка: «підрізання» — дрібні кроки перед бруском, що гасять швидкість."]}], "f": "", "pr": ["Складіть таблицю «Ознаки втоми»: три стовпчики (легка, значна, надмірна) і по 3 ознаки в кожному.", "Виконайте 3 підходи по 10 присідань з махом рук назад і вперед-угору без стрибка, відпрацьовуючи узгодженість рук і ніг."], "q": ["Як відрізнити легку втому від надмірної?", "Що потрібно зробити, якщо під час бігу запаморочилася голова?", "Яка роль маху руками в стрибку з місця?", "Яка помилка розбігу гасить швидкість перед відштовхуванням?"]}, {"n": "81", "t": "Метання малого м'яча з розбігу. Стрибок у довжину способом «прогинаючись»", "g": "Учень знатиме фази метання малого м'яча з розбігу та особливості стрибка в довжину способом «прогинаючись».", "k": "Модулі: Легка атлетика", "terms": [["Схресний крок", "крок у метанні, під час якого права нога (у правші) обганяє ліву, а тулуб залишається розвернутим боком до напрямку метання."], ["Фінальне зусилля", "завершальна фаза метання, коли сила ніг, тулуба й руки послідовно передається на снаряд."], ["Кут вильоту", "кут, під яким снаряд залишає руку відносно горизонту; від нього значною мірою залежить дальність."], ["Спосіб «прогинаючись»", "спосіб стрибка в довжину, коли в польоті стрибун прогинається в спині, відводячи ноги й руки назад, а потім групується перед приземленням."]], "th": [{"h": "Легка атлетика. Метання малого м'яча на дальність з розбігу", "p": ["Метання з розбігу складається з попереднього розбігу, кидкових (схресних) кроків, фінального зусилля та гальмування після кидка. Сильний кидок виходить не лише рукою: рух починається від ніг, передається через таз і тулуб і завершується хльостким рухом руки."], "ul": ["Попередній розбіг — рівний, без надмірної швидкості.", "Під час відведення рука з м'ячем іде назад, тулуб розвертається боком.", "Схресний крок дає змогу «обігнати» снаряд — ноги попереду тулуба.", "Кидок — через плече, лікоть вище плеча; м'яч летить під кутом, близьким до 40°.", "Безпека: метати лише за командою, усі учні — позаду лінії метання."]}, {"h": "Легка атлетика. Стрибок у довжину способом «прогинаючись»", "p": ["Цей спосіб складніший за «зігнувши ноги». Після відштовхування махова нога опускається, тулуб прогинається, і стрибун ніби «зависає» в повітрі. Прогин допомагає зберегти рівновагу та підготуватися до винесення ніг уперед."], "ul": ["Розбіг і відштовхування такі самі, як і в способі «зігнувши ноги».", "Після вильоту махова нога опускається вниз-назад до поштовхової.", "Руки відводяться вгору-назад, спина прогинається.", "Перед приземленням — швидке групування: ноги вперед, руки вперед-донизу.", "Типова помилка: надто ранній прогин, через який стрибун не встигає винести ноги."]}], "f": "Метання малого м'яча — шкільна вправа, яка готує до метання списа: техніка кидка через плече в них дуже схожа.", "pr": ["Намалюйте схему метання малого м'яча з розбігу й підпишіть фази: розбіг, відведення, схресний крок, фінальне зусилля, гальмування.", "Виконайте імітацію кидка без м'яча (рух рукою через плече) по 10 разів кожною рукою, стежачи, щоб лікоть був вище плеча."], "q": ["Чому сильний кидок починається від ніг, а не від руки?", "Для чого виконують схресний крок?", "Чим спосіб «прогинаючись» відрізняється від способу «зігнувши ноги»?", "Як забезпечити безпеку під час метання?"]}, {"n": "82", "t": "Біг 30 м: реакція і частота кроків. Розбіг у стрибку «зігнувши ноги»", "g": "Учень розумітиме, від чого залежить результат у бігу на 30 м, і навчиться підбирати та вимірювати розбіг для стрибка в довжину.", "k": "Модулі: Легка атлетика", "terms": [["Час реакції", "проміжок часу від стартового сигналу до початку руху спортсмена."], ["Частота кроків", "кількість кроків за одиницю часу; разом із довжиною кроку визначає швидкість бігу."], ["Довжина кроку", "відстань між місцями постановки двох ніг під час бігу."], ["Контрольна позначка", "мітка на доріжці розбігу, яка допомагає стрибуну щоразу точно потрапляти на брусок."]], "th": [{"h": "Легка атлетика. Біг 30 м: від чого залежить швидкість", "p": ["Швидкість бігу — це добуток частоти кроків на їхню довжину. На короткому відрізку 30 м особливо важливі реакція на сигнал і вміння швидко наростити частоту кроків. Спеціальні бігові вправи розвивають саме ці якості. Нагадуємо правила безпеки: біжимо лише по своїй доріжці й після фінішу не зупиняємося різко."], "ul": ["Слухайте сигнал, а не дивіться на сусіда — так реакція швидша.", "Не намагайтеся одразу робити довгі кроки: довжина зростає поступово.", "Ставте ногу на передню частину стопи, «під себе».", "Розслабляйте плечі та обличчя — напруження сповільнює рухи.", "Вправи для частоти: семенячий біг, біг на місці в максимальному темпі."]}, {"h": "Легка атлетика. Розбіг у стрибку в довжину «зігнувши ноги»", "p": ["Точний розбіг — половина вдалого стрибка. Якщо стрибун не потрапляє на брусок, він або заступає (спроба не зараховується), або втрачає сантиметри, відштовхуючись далеко від бруска. Тому довжину розбігу підбирають і позначають."], "ul": ["Довжину розбігу вимірюють кроками або ступнями від бруска.", "Розбіг починають щоразу з однієї ноги й однакового положення.", "Контрольну позначку ставлять за кілька кроків до бруска.", "Розбіг має бути однаковим за ритмом: поступове прискорення.", "Заступ — відштовхування за лінією бруска; така спроба не зараховується."]}], "f": "", "pr": ["Порахуйте, скільки кроків ви робите вдома за 10 секунд, ідучи в швидкому темпі на місці, і запишіть, як змінюється частота, якщо скоротити крок.", "Опишіть письмово, як ви підбиратимете довжину розбігу для стрибка в довжину і де поставите контрольну позначку."], "q": ["Від яких двох складових залежить швидкість бігу?", "Як покращити реакцію на стартовий сигнал?", "Для чого потрібна контрольна позначка на розбігу?", "Що таке заступ і чим він загрожує спробі?"]}, {"n": "83", "t": "Самоконтроль і відновлення. Біг 100 м. Стрибок у довжину з місця", "g": "Учень навчиться оцінювати свій стан під час навантаження, знатиме фази бігу на 100 м і вдосконалить стрибок у довжину з місця.", "k": "Модулі: Легка атлетика", "terms": [["Самоконтроль", "регулярне спостереження людини за станом свого здоров'я та реакцією організму на фізичні навантаження."], ["Відновлення", "процес повернення організму до робочого стану після навантаження."], ["Біг по дистанції", "фаза спринту після розгону, коли бігун намагається утримати досягнуту максимальну швидкість."], ["Фінішний кидок", "нахил грудей або плеча вперед на останньому кроці, щоб швидше перетнути фінішну лінію."]], "th": [{"h": "Легка атлетика. Ознаки втоми і самоконтроль", "p": ["На попередніх уроках ми вивчили ознаки втоми. Старшокласники мають уміти не лише їх помічати, а й вести самоконтроль: стежити за пульсом, сном, апетитом, самопочуттям і результатами. Це допомагає вчасно зменшити навантаження."], "ul": ["Об'єктивні показники: пульс, частота дихання, результати тестів.", "Суб'єктивні показники: самопочуття, сон, бажання тренуватися.", "Пульс рахують на зап'ясті або шиї за 10 секунд і множать на 6.", "Після навантаження пульс має поступово знижуватися — це ознака доброго відновлення.", "Зручно записувати показники в щоденник самоконтролю."]}, {"h": "Легка атлетика. Біг 100 м", "p": ["Біг на 100 м — класичний спринт. Він складається з чотирьох фаз: старт, стартовий розгін, біг по дистанції, фінішування. На другій половині дистанції швидкість трохи знижується через втому, тому важливо бігти розслаблено й не «закріпачуватися»."], "ul": ["Старт низький, розгін із поступовим випрямленням тулуба.", "По дистанції — високо піднятий таз, енергійна робота рук.", "Дивіться вперед, а не під ноги чи на суперників.", "Фінішуйте «через лінію», уявляючи, що фініш на кілька метрів далі.", "Після фінішу поступово сповільнюйтеся й переходьте на ходьбу."]}, {"h": "Легка атлетика. Стрибок у довжину з місця", "p": ["Під час стрибка з місця дуже важливе приземлення: результат вимірюють до найближчого сліду, тому падіння назад або дотик рукою позаду зменшують результат."], "ul": ["Перед стрибком — 2–3 підготовчі махи руками.", "Відштовхування — одночасно обома ногами.", "Кут вильоту — вперед-угору, а не високо вгору.", "При приземленні нахиляйтеся вперед і виносьте руки вперед."]}], "f": "", "pr": ["Заведіть щоденник самоконтролю: протягом тижня щоранку записуйте пульс у стані спокою, якість сну та самопочуття.", "Виміряйте пульс до і після 30 присідань, а також через 1 і 2 хвилини відпочинку; запишіть, як швидко він повертається до норми."], "q": ["Які показники самоконтролю є об'єктивними, а які суб'єктивними?", "Як правильно виміряти пульс?", "Які фази має біг на 100 м?", "Що таке фінішний кидок і для чого він?"]}, {"n": "84", "t": "Стрибок у висоту способом «переступання». Серійний біг 3×30 м", "g": "Учень знатиме техніку стрибка у висоту способом «переступання», правила безпеки в секторі для стрибків у висоту та особливості серійного бігу.", "k": "Модулі: Легка атлетика", "terms": [["Спосіб «переступання»", "спосіб стрибка у висоту, коли стрибун по черзі переносить через планку махову, а потім поштовхову ногу, ніби переступаючи її."], ["Планка", "горизонтальна поперечина на стійках, яку стрибун повинен подолати, не збивши."], ["Серійний біг", "повторне пробігання коротких відрізків з визначеним відпочинком між ними."], ["Інтервал відпочинку", "час між повтореннями вправи, за який організм частково відновлюється."]], "th": [{"h": "Легка атлетика. Стрибок у висоту способом «переступання»", "p": ["Стрибок у висоту з розбігу виконують збоку від планки. Розбіг — під кутом 30–45° до планки, відштовхування — дальньою від планки ногою. Над планкою стрибун спочатку переносить махову ногу, потім поштовхову, тулуб залишається майже вертикальним."], "ul": ["Безпека: приземлятися лише на мати; стійки й планка мають бути закріплені правильно.", "Стрибайте по черзі, лише після того, як попередній учень залишив місце приземлення.", "Розбіг 5–7 кроків, останні кроки швидші.", "Махову ногу виносити прямою вгору, руки допомагають махом.", "Приземлення — на махову ногу, потім на поштовхову.", "Типова помилка: відштовхування надто близько до планки."]}, {"h": "Легка атлетика. Серії бігу 3×30 м", "p": ["Серійний біг розвиває швидкість і здатність повторювати швидкі зусилля. Між відрізками є відпочинок, щоб кожен відрізок пробігати якісно. Після всіх серій — заминка: повільна ходьба й вправи на розтягування."], "ul": ["Кожен відрізок біжіть з високою, але контрольованою швидкістю.", "Відпочинок між відрізками — ходьба назад до старту.", "Якщо техніка «розвалюється» — збільште інтервал відпочинку.", "Стежте за ознаками втоми й повідомляйте про погане самопочуття."]}], "f": "Сучасний спосіб стрибка у висоту спиною до планки — «фосбері-флоп» — названо на честь американського спортсмена Діка Фосбері, який виграв ним Олімпійські ігри 1968 року.", "pr": ["Намалюйте схему стрибка у висоту способом «переступання»: розташування планки, напрямок розбігу та місце відштовхування.", "Виконайте махи ногою вперед-угору біля опори (стіна, спинка стільця) по 10 разів кожною ногою, 2 підходи."], "q": ["Під яким кутом виконують розбіг у стрибку «переступанням»?", "Якою ногою відштовхуються — ближньою чи дальньою від планки?", "Які правила безпеки потрібно дотримуватися в секторі для стрибків у висоту?", "Для чого потрібен інтервал відпочинку в серійному бігу?"]}, {"n": "85", "t": "Повторний біг 2×100 м. Типові помилки стрибка «зігнувши ноги»", "g": "Учень розумітиме, як повторний біг розвиває швидкісну витривалість, і вмітиме знаходити та виправляти помилки в стрибку в довжину.", "k": "Модулі: Легка атлетика", "terms": [["Повторний метод", "метод тренування, коли вправу виконують кілька разів з високою інтенсивністю та відпочинком, достатнім для відновлення."], ["Анаеробне навантаження", "робота високої інтенсивності, під час якої енергія утворюється переважно без участі кисню."], ["Політна фаза", "частина стрибка від моменту відриву від бруска до торкання піску."], ["Групування", "положення тіла з притиснутими до грудей колінами, яке допомагає зберегти рівновагу в польоті."]], "th": [{"h": "Легка атлетика. Біг 2×100 м", "p": ["Біг на 100 м з максимальною швидкістю — анаеробне навантаження: м'язи працюють так інтенсивно, що кисню не вистачає, і з'являється відчуття «важких ніг». Повторюючи відрізки з відпочинком, ми вчимо організм довше утримувати високу швидкість."], "ul": ["Відпочинок між відрізками — до відновлення дихання (зазвичай кілька хвилин ходьби).", "Другий відрізок біжіть з тією ж якістю техніки, що й перший.", "Не сідайте й не лягайте після фінішу — ходіть.", "При болю в грудях чи запамороченні — негайно зупиніться й скажіть учителю."]}, {"h": "Легка атлетика. Стрибок у довжину «зігнувши ноги»: типові помилки", "p": ["Щоб покращити результат, потрібно знати типові помилки й розуміти їхні причини. Більшість помилок виникає ще в розбігу, а в польоті вони лише проявляються."], "ul": ["Сповільнення перед бруском — причина: невпевненість, неточно підібраний розбіг.", "Відштовхування «вгору» без руху вперед — стрибок високий, але короткий.", "Відсутність маху ногою — тулуб «провалюється» вперед.", "Раннє опускання ніг у політній фазі.", "Падіння назад при приземленні — втрата сантиметрів."]}], "f": "", "pr": ["Складіть таблицю «Помилка — причина — як виправити» для стрибка в довжину способом «зігнувши ноги» (не менше 4 рядків).", "Виконайте вправу «групування» лежачи на спині: підтягніть коліна до грудей і утримуйте 5 секунд, 10 повторень."], "q": ["Чому біг на 100 м з максимальною швидкістю називають анаеробним навантаженням?", "Як правильно відпочивати між відрізками повторного бігу?", "Які помилки розбігу впливають на дальність стрибка?", "Що відбувається в політній фазі стрибка?"]}, {"n": "86", "t": "Розвиток швидкості в серіях 3×30 м. Метання малого м'яча: хват і безпека", "g": "Учень знатиме способи розвитку швидкісних здібностей, правильний хват малого м'яча та правила поведінки в секторі для метання.", "k": "Модулі: Легка атлетика", "terms": [["Швидкісні здібності", "здатність людини виконувати рухи за мінімальний час."], ["Сектор для метання", "розмічена ділянка поля, у межах якої має приземлитися снаряд, щоб спроба була зарахована."], ["Лінія метання", "межа, яку метальник не має права переступати під час кидка і до приземлення снаряда."], ["Хват", "спосіб утримання снаряда пальцями руки перед кидком."]], "th": [{"h": "Легка атлетика. Серії бігу 3×30 м для розвитку швидкості", "p": ["Швидкісні здібності найкраще розвиваються, коли вправи виконують у свіжому стані, з максимальною швидкістю та на короткому відрізку. Тому швидкісну роботу ставлять на початку основної частини уроку, одразу після якісної розминки."], "ul": ["Відрізки короткі — до 30–60 м.", "Кожне повторення — з максимальною зосередженістю.", "Відпочинок достатній, щоб наступний відрізок не був повільнішим.", "Корисні вправи: старти з різних положень, біг з ходу, біг під гірку.", "Без розминки швидкісні вправи небезпечні: можна травмувати м'язи задньої поверхні стегна."]}, {"h": "Легка атлетика. Метання малого м'яча: хват і правила безпеки", "p": ["Малий м'яч тримають пальцями, а не долонею: так кидок виходить хльосткішим. Безпека в секторі для метання — обов'язкова, адже м'яч, кинутий з розбігу, летить швидко й далеко."], "ul": ["М'яч лежить на основі пальців, великий палець і мізинець підтримують його збоку.", "Перед кидком перевірте, що в секторі нікого немає.", "Метайте лише за командою вчителя, по одному або шеренгою в одному напрямку.", "По м'ячі йдіть тільки за командою, після кидка всіх учасників.", "Не кидайте м'яч один одному назустріч на швидкості."]}], "f": "", "pr": ["Запишіть 5 правил безпеки під час метання і поясніть, яку небезпеку попереджає кожне з них.", "Відпрацюйте хват: візьміть у руку невеликий предмет (тенісний м'яч, клубок, згорнуту шкарпетку) і 10 разів виконайте імітацію кидка через плече в повільному темпі без випускання предмета."], "q": ["Чому швидкісні вправи виконують на початку основної частини уроку?", "Як правильно тримати малий м'яч?", "Що таке лінія метання і коли її можна переступати?", "Коли можна йти по м'ячі в секторі?"]}, {"n": "87", "t": "Перша допомога при травмах. Біг 100 м. Стрибок у довжину «зігнувши ноги»", "g": "Учень знатиме, як надати першу допомогу при типових травмах на заняттях легкою атлетикою, та закріпить техніку бігу на 100 м і стрибка в довжину.", "k": "Модулі: Легка атлетика", "terms": [["Забій", "закрите пошкодження м'яких тканин унаслідок удару без порушення цілісності шкіри."], ["Розтягнення зв'язок", "пошкодження зв'язок суглоба внаслідок різкого руху, що перевищує їхню нормальну рухливість."], ["Садно", "поверхневе пошкодження шкіри після тертя об тверду поверхню."], ["Іммобілізація", "знерухомлення пошкодженої частини тіла, щоб зменшити біль і не погіршити травму."]], "th": [{"h": "Легка атлетика. Надання першої допомоги при травмах", "p": ["Найчастіші травми в легкій атлетиці — садна, забої, розтягнення зв'язок гомілковостопного суглоба, пошкодження м'язів. Головне правило — спершу повідомити вчителя, не рухати сильно пошкоджену кінцівку й не продовжувати заняття через біль."], "ul": ["Садно: промити чистою водою, обробити антисептиком навколо рани, накласти чисту пов'язку.", "Забій або розтягнення: спокій, холод через тканину на 10–15 хвилин, підняте положення кінцівки.", "Підозра на перелом чи вивих: не вправляти, знерухомити, викликати медиків.", "Кровотеча з носа: сісти, голову трохи нахилити вперед, притиснути крила носа, холод на перенісся.", "Не розтирайте місце травми і не прикладайте тепло в перші години."]}, {"h": "Легка атлетика. Біг 100 м і стрибок у довжину «зігнувши ноги»", "p": ["Багатьох травм можна уникнути завдяки якісній розминці та правильній техніці. Під час бігу 100 м найбільше навантаження отримують м'язи задньої поверхні стегна, а під час стрибка — гомілковостопний суглоб поштовхової ноги."], "ul": ["Розминка: ходьба, легкий біг, ЗРВ, спеціальні бігові та стрибкові вправи, прискорення.", "У бігу — розслаблені плечі та активна робота рук.", "У стрибку — постановка ноги на брусок усією стопою, а не на п'ятку.", "Яма з піском має бути розпушена й без сторонніх предметів.", "При болю під час бігу — плавно сповільнюйтеся, а не зупиняйтеся різко."]}], "f": "", "pr": ["Складіть пам'ятку «Перша допомога при травмах на уроці фізкультури» для 4 випадків: садно, забій, розтягнення зв'язок, кровотеча з носа.", "Виконайте вправи для зміцнення гомілковостопного суглоба: підйоми на носки 3 × 15 разів та кругові рухи стопою по 10 у кожен бік."], "q": ["Як надати першу допомогу при розтягненні зв'язок?", "Чому не можна прикладати тепло до свіжої травми?", "Що таке іммобілізація і коли її застосовують?", "Як розминка допомагає уникнути травм?"]}, {"n": "88", "t": "Біг 2×200 м і біг на віражі. Метання малого м'яча: правила змагань", "g": "Учень знатиме особливості бігу на 200 м по віражу, розумітиме роль швидкісної витривалості та правила зарахування спроб у метанні.", "k": "Модулі: Легка атлетика", "terms": [["Швидкісна витривалість", "здатність тривалий час утримувати високу швидкість, не знижуючи її через утому."], ["Віраж", "закруглена ділянка бігової доріжки стадіону."], ["Спроба", "одне виконання змагальної вправи (стрибка чи кидка), яке оцінюють судді."], ["Вимірювання результату в метанні", "визначення відстані від лінії метання до місця першого торкання снаряда землі."]], "th": [{"h": "Легка атлетика. Біг 2×200 м", "p": ["Дистанція 200 м складається з бігу по віражу та по прямій. На віражі на бігуна діє відцентрова сила, яка «виносить» його назовні, тому техніка змінюється. Повторний біг на 200 м розвиває швидкісну витривалість."], "ul": ["На віражі тулуб трохи нахилений усередину повороту.", "Права рука рухається ширше, ніж ліва, — трохи навскіс до середини.", "Біжіть ближче до лівої межі своєї доріжки, але не наступайте на лінію.", "Розподіляйте сили: не витрачайте все на перших 50 м.", "Між відрізками — ходьба до відновлення дихання."]}, {"h": "Легка атлетика. Метання малого м'яча: правила і суддівство", "p": ["На змаганнях кожен учасник має кілька спроб, зараховують найкращу. Щоб спроба була зарахована, м'яч має приземлитися в межах сектора, а метальник — не заступити лінію метання."], "ul": ["Спробу не зараховують, якщо учасник торкнувся лінії метання або поля за нею.", "Покидати місце метання можна лише після приземлення снаряда.", "Результат вимірюють від лінії метання до місця першого торкання м'яча землі.", "Суддя фіксує результат і оголошує його вголос.", "Учасники, які чекають своєї черги, перебувають позаду лінії метання."]}], "f": "На стадіоні старти на дистанції 200 м розташовані «драбинкою», бо зовнішні доріжки на віражі довші, і так кожен бігун долає однакову відстань.", "pr": ["Намалюйте схему стадіону з біговою доріжкою, позначте віражі та поясніть, чому старти на 200 м розташовані «драбинкою».", "Виконайте імітацію роботи рук під час бігу (сидячи або стоячи) 3 × 30 секунд у високому темпі, стежачи, щоб кисті не перетинали середню лінію тіла."], "q": ["Чому на віражі бігун нахиляє тулуб усередину?", "Що таке швидкісна витривалість?", "Коли спробу в метанні не зараховують?", "Як вимірюють результат у метанні малого м'яча?"]}, {"n": "89", "t": "Швидкісно-силові якості: серії 3×30 м і стрибок у довжину з місця", "g": "Учень розумітиме, що таке швидкісно-силові якості, як їх розвивати та як серійний біг і стрибки з місця доповнюють одне одного.", "k": "Модулі: Легка атлетика", "terms": [["Швидкісно-силові якості", "здатність проявляти велику силу за дуже короткий час, як під час старту чи відштовхування."], ["Багатоскоки", "серія послідовних стрибків з ноги на ногу або на двох ногах для розвитку сили відштовхування."], ["Амортизація", "м'яке згинання ніг у момент приземлення, яке гасить удар і захищає суглоби."], ["Спеціальні стрибкові вправи", "вправи, що імітують окремі фази стрибка і розвивають силу та техніку відштовхування."]], "th": [{"h": "Легка атлетика. Серії бігу 3×30 м", "p": ["Стартовий розгін — це прояв швидкісно-силових якостей: щоб швидко зрушити з місця, м'язи ніг мають розвинути велике зусилля за мить. Тому серійний біг на 30 м часто поєднують зі стрибковими вправами."], "ul": ["Старт з різних положень: високий, низький, з упору присівши.", "Пробігання відрізка з максимальною швидкістю.", "Відпочинок — повільна ходьба до старту.", "Розминка перед серіями — обов'язкова: м'язи мають бути розігріті."]}, {"h": "Легка атлетика. Стрибок у довжину з місця і стрибкові вправи", "p": ["Результат стрибка з місця добре показує швидкісно-силову підготовленість ніг. Його покращують стрибкові вправи, але робити їх треба правильно, з амортизацією при приземленні, щоб не перевантажити колінні суглоби."], "ul": ["Стрибки на двох ногах уперед з підтягуванням колін.", "Багатоскоки з ноги на ногу на м'якому покритті.", "Стрибки «жабкою» на невелику відстань.", "Приземлення завжди м'яке, коліна дивляться вперед, а не всередину.", "Кількість стрибків невелика — головне якість, а не кількість."]}], "f": "", "pr": ["Напишіть, чим швидкісно-силові якості відрізняються від сили та від швидкості, наведіть по 2 приклади вправ з легкої атлетики.", "Виконайте 3 підходи по 12 присідань у повільному темпі з контролем колін (коліна над носками) та паузою 2 секунди внизу."], "q": ["Що таке швидкісно-силові якості?", "Які вправи розвивають силу відштовхування?", "Що таке амортизація і для чого вона потрібна?", "Чому серійний біг і стрибки часто поєднують на одному уроці?"]}, {"n": "90", "t": "Спортивна ходьба до 1000 м: техніка і правила. Метання малого м'яча з розбігу", "g": "Учень знатиме техніку і правила спортивної ходьби та закріпить узгодження розбігу з кидком у метанні малого м'яча.", "k": "Модулі: Легка атлетика", "terms": [["Спортивна ходьба", "легкоатлетична дисципліна, у якій спортсмен рухається кроком, постійно зберігаючи контакт із землею."], ["Втрата контакту", "порушення в спортивній ходьбі, коли обидві ноги одночасно відриваються від землі."], ["Випрямлена опорна нога", "вимога правил: нога від моменту торкання землі до вертикального положення має бути випрямленою в коліні."], ["Відведення м'яча", "рух руки зі снарядом назад перед кидком, який створює шлях для розгону снаряда."]], "th": [{"h": "Легка атлетика. Спортивна ходьба на відстань до 1000 м", "p": ["Спортивна ходьба відрізняється від звичайної та від бігу двома правилами: завжди має бути контакт із землею, а опорна нога випрямлена в коліні. Ходьба розвиває витривалість і менше навантажує суглоби, ніж біг."], "ul": ["Ставте ногу на п'ятку прямою ногою, потім перекат на носок.", "Руки зігнуті приблизно під прямим кутом, активно рухаються вперед-назад.", "Таз розвертається за рухом ноги, що подовжує крок.", "Дихайте рівномірно, не затримуйте подих.", "Типова помилка: перехід на біг при збільшенні швидкості."]}, {"h": "Легка атлетика. Метання малого м'яча на дальність з розбігу", "p": ["Повторюємо інструктаж: метаємо лише за командою, у секторі нікого немає. Головне завдання — не зупинятися перед кидком, а перенести швидкість розбігу в снаряд."], "ul": ["Відведення м'яча починайте за два кроки до кидка.", "Під час відведення погляд спрямований уперед-угору.", "Ліва нога (у правші) ставиться жорстко й зупиняє рух тіла — як «стопор».", "Після кидка зробіть крок уперед, щоб не заступити лінію."]}], "f": "У спортивній ходьбі судді оцінюють техніку неозброєним оком і за порушення показують учасникам попередження; після кількох порушень спортсмена можуть дискваліфікувати.", "pr": ["Порівняйте в таблиці спортивну ходьбу, звичайну ходьбу і біг за ознаками: контакт із землею, положення опорної ноги, робота рук.", "Виконайте ходьбу на місці з перекатом з п'ятки на носок і активною роботою рук 3 × 1 хвилина."], "q": ["Які два головні правила спортивної ходьби?", "Як працюють руки під час спортивної ходьби?", "Що таке втрата контакту?", "Навіщо ставити ногу «стопором» перед кидком?"]}, {"n": "91", "t": "Повільний біг 6 хв і аеробна витривалість. Стрибок у довжину з місця", "g": "Учень розумітиме, як повільний біг розвиває аеробну витривалість, вмітиме контролювати інтенсивність та виконувати стрибок у довжину з місця.", "k": "Модулі: Легка атлетика", "terms": [["Аеробна витривалість", "здатність тривало виконувати роботу помірної інтенсивності, коли енергія утворюється за участі кисню."], ["Розмовний тест", "простий спосіб контролю інтенсивності: якщо під час бігу можна говорити короткими реченнями, темп помірний."], ["Темп бігу", "швидкість, з якою бігун долає дистанцію, наприклад час на кожні 100 м чи кілометр."], ["Ритм дихання", "співвідношення кількості кроків на вдих і видих під час бігу."]], "th": [{"h": "Легка атлетика. Повільний біг 6 хвилин", "p": ["Повільний рівномірний біг — основа розвитку витривалості. Під час нього серце й легені вчаться ефективніше постачати кисень до м'язів. Важливо обрати темп, який можна утримувати всі 6 хвилин без переходу на ходьбу."], "ul": ["Починайте повільніше, ніж хочеться.", "Перевіряйте темп «розмовним тестом».", "Дихайте носом і ротом, рівномірно, наприклад вдих на 2–3 кроки і видих на 2–3 кроки.", "Крок короткий, ногу ставте м'яко під себе.", "Після бігу — 2–3 хвилини ходьби та вправи на розтягування."]}, {"h": "Легка атлетика. Стрибок у довжину з місця", "p": ["Після тривалого бігу ноги втомлені, тому стрибки з місця виконуємо з особливою увагою до техніки та приземлення. Обов'язково робимо кілька підготовчих стрибків."], "ul": ["Перевірте, чи сухе й неслизьке місце відштовхування та приземлення.", "Відштовхування обома ногами одночасно, без попереднього підстрибування.", "Повне випрямлення тіла у фазі відштовхування.", "Приземлення з виносом рук уперед."]}], "f": "", "pr": ["Опишіть письмово, як за допомогою «розмовного тесту» і пульсу визначити, чи правильний темп повільного бігу.", "Виконайте вправу «планка» на передпліччях 3 × 30 секунд з відпочинком 30 секунд, стежачи за рівною лінією спини."], "q": ["Що таке аеробна витривалість?", "Як визначити, що темп повільного бігу правильний?", "Як має працювати дихання під час повільного бігу?", "Що робити одразу після закінчення тривалого бігу?"]}, {"n": "92", "t": "Рівномірний біг до 1500 м: розкладка сил. Приземлення в стрибку «зігнувши ноги»", "g": "Учень знатиме, як правильно розподіляти сили в рівномірному бігу до 1500 м, і вдосконалить приземлення в стрибку в довжину.", "k": "Модулі: Легка атлетика", "terms": [["Рівномірний біг", "біг з приблизно однаковою швидкістю на всіх ділянках дистанції."], ["Розкладка сил", "план розподілу швидкості та зусиль на дистанції."], ["«Мертва точка»", "тимчасовий стан під час тривалого бігу, коли з'являються задишка, важкість і бажання зупинитися."], ["«Друге дихання»", "поліпшення самопочуття після подолання «мертвої точки», коли організм пристосовується до роботи."]], "th": [{"h": "Легка атлетика. Рівномірний біг до 1500 м", "p": ["Найекономніший спосіб пробігти середню дистанцію — рівномірно. Якщо почати надто швидко, у м'язах швидко накопичується втома, і на другій половині дистанції швидкість різко падає. Бігають з високого старту."], "ul": ["Високий старт: поштовхова нога попереду, тулуб нахилений, руки зігнуті.", "Перші 100–200 м — спокійно, без ривка.", "Стежте за однаковим часом кожного кола.", "«Мертву точку» долайте, не зупиняючись: трохи знизьте темп і поглибте дихання.", "Фінішне прискорення — лише на останніх 100–200 м, якщо є сили.", "При болю в грудях, запамороченні — зупиніться й повідомте вчителя."]}, {"h": "Легка атлетика. Приземлення в стрибку «зігнувши ноги»", "p": ["Приземлення визначає, скільки сантиметрів «збереже» стрибун. Завдання — винести ноги якомога далі вперед і не впасти назад."], "ul": ["Перед приземленням підтягніть коліна до грудей і випряміть ноги вперед.", "Руки рухаються вперед-донизу, допомагаючи винести ноги.", "У момент торкання піску згинайте коліна й переносьте вагу вперед.", "Виходьте з ями вперед або вбік, а не назад."]}], "f": "", "pr": ["Складіть план розкладки сил для бігу на 1500 м: на скільки частин поділите дистанцію і що робитимете на кожній.", "Виконайте вправу лежачи на спині: підтягування колін до грудей і випрямлення ніг уперед 3 × 10 разів, імітуючи винесення ніг перед приземленням."], "q": ["Чому рівномірний біг економніший, ніж біг зі зміною швидкості?", "Що таке «мертва точка» і як її подолати?", "Як виконують високий старт?", "Як правильно приземлитися, щоб не втратити сантиметри?"]}, {"n": "93", "t": "Біомеханіка кидка: метання малого м'яча з розбігу. Серії бігу 3×30 м", "g": "Учень розумітиме, як працює ланцюг м'язів у кидку і що впливає на дальність метання, та закріпить серійний біг.", "k": "Модулі: Легка атлетика", "terms": [["Біомеханічний ланцюг", "послідовне включення в рух ніг, таза, тулуба, плеча й кисті, коли швидкість передається від однієї ланки до іншої."], ["Положення «натягнутого лука»", "момент перед кидком, коли груди подані вперед, а рука зі снарядом відведена назад, і м'язи розтягнуті, як тятива."], ["Траєкторія польоту", "лінія, по якій рухається снаряд у повітрі."], ["Хльосткий рух", "швидке завершення кидка кистю, яке додає снаряду швидкості."]], "th": [{"h": "Легка атлетика. Метання малого м'яча: від чого залежить дальність", "p": ["Дальність метання визначають швидкість вильоту снаряда, кут вильоту та висота, з якої він вилітає. Найбільший вплив має швидкість, а вона залежить від того, наскільки злагоджено працює весь біомеханічний ланцюг."], "ul": ["Ноги — «фундамент» кидка: з них починається рух.", "Таз розвертається раніше за плечі.", "Положення «натягнутого лука» дає змогу використати пружність м'язів.", "Рука випрямляється останньою, кидок закінчується хльостким рухом кисті.", "Занадто високий чи низький кут вильоту зменшує дальність."]}, {"h": "Легка атлетика. Серії бігу 3×30 м", "p": ["На цьому уроці серійний біг виконуємо зі старту з ходу: бігун розганяється на кількох метрах, а відрізок 30 м пробігає з максимальною швидкістю. Так розвивається здатність утримувати швидкість."], "ul": ["Розгін 10–15 м до лінії відліку.", "На відрізку — максимальна швидкість без напруження плечей.", "Відпочинок — ходьба до відновлення дихання.", "Стежте за технікою: високе стегно, активна постановка стопи."]}], "f": "", "pr": ["Намалюйте три траєкторії польоту м'яча — під малим, середнім і великим кутом — і поясніть, яка з них дасть найбільшу дальність.", "Виконайте імітацію положення «натягнутого лука» без предмета: стоячи боком, відведіть руку назад, подайте груди вперед і плавно виконайте рух кидка — 10 разів."], "q": ["Від чого залежить дальність польоту снаряда?", "Що таке біомеханічний ланцюг у кидку?", "Яке положення називають «натягнутим луком»?", "Що таке біг з ходу?"]}, {"n": "94", "t": "Повільний біг 6 хв і біг 2×200 м. Як побудувати тренування", "g": "Учень знатиме структуру тренувального заняття, принципи поступовості й чергування навантаження та розумітиме, як поєднувати біг на витривалість і швидкісну роботу.", "k": "Модулі: Легка атлетика", "terms": [["Заминка", "заключна частина тренування з повільним бігом, ходьбою і вправами на розтягування для поступового відновлення."], ["Обсяг навантаження", "загальна кількість виконаної роботи: відстань, кількість повторень, тривалість."], ["Інтенсивність навантаження", "ступінь напруження організму під час вправи, наприклад швидкість бігу чи пульс."], ["Принцип поступовості", "правило, за яким навантаження збільшують поступово, даючи організму час пристосуватися."]], "th": [{"h": "Легка атлетика. Повільний біг 6 хв і біг 2×200 м", "p": ["На уроці поєднуються два різні навантаження: повільний біг (помірна інтенсивність, великий обсяг) і біг 2×200 м (висока інтенсивність, малий обсяг). Повільний біг може бути частиною розминки або відновлювальною роботою, а швидкий — основним завданням."], "ul": ["Повільний біг — у темпі, за якого можна розмовляти.", "Перед 200 м — спеціальні бігові вправи та 2–3 прискорення.", "Біг 200 м — швидко, але рівномірно, з правильною технікою на віражі.", "Між відрізками — ходьба, пульс має знизитися.", "Наприкінці — заминка."]}, {"h": "Легка атлетика. Планування тренування", "p": ["Будь-яке тренування складається з трьох частин: підготовчої (розминка), основної та заключної (заминка). Старшокласники можуть самостійно планувати додаткові заняття, дотримуючись принципів поступовості, регулярності та чергування навантаження з відпочинком."], "ul": ["Розминка — 10–15 хвилин: від легких вправ до спеціальних.", "Швидкісні вправи — на початку основної частини, вправи на витривалість — наприкінці.", "Не збільшуйте навантаження різко: краще трохи щотижня.", "Чергуйте інтенсивні дні з легкими.", "Сон і харчування — частина відновлення."]}], "f": "", "pr": ["Складіть план одного самостійного тренування на 30–40 хвилин (розминка, основна частина, заминка) з безпечними вправами, які можна виконувати вдома.", "Виконайте комплекс вправ на розтягування для заминки (м'язи стегна, гомілки, спини) — кожну вправу утримуйте по 20–30 секунд."], "q": ["З яких частин складається тренування?", "Чим обсяг навантаження відрізняється від інтенсивності?", "Що означає принцип поступовості?", "Для чого потрібна заминка?"]}, {"n": "95", "t": "Спортивна ходьба як оздоровча активність. Підготовчі вправи для метання", "g": "Учень розумітиме користь спортивної ходьби для здоров'я та знатиме підготовчі й імітаційні вправи, що вдосконалюють техніку метання.", "k": "Модулі: Легка атлетика", "terms": [["Оздоровча ходьба", "ходьба у швидкому темпі з метою зміцнення серцево-судинної системи та загальної витривалості."], ["Перекат стопи", "послідовне перенесення ваги з п'ятки через зовнішній край стопи на носок під час кроку."], ["Імітаційні вправи", "вправи, що повторюють рух змагальної дії без снаряда або з легким предметом для засвоєння техніки."], ["Підготовчі вправи", "вправи, які розвивають фізичні якості, потрібні для виконання основної вправи."]], "th": [{"h": "Легка атлетика. Спортивна ходьба на відстань до 1000 м", "p": ["Ходьба — одна з найдоступніших оздоровчих активностей: вона підходить людям різного віку й рівня підготовки. Техніка спортивної ходьби робить ходьбу швидшою та ефективнішою, а правила вимагають постійного контакту із землею й випрямленої опорної ноги."], "ul": ["Перекат стопи м'який, без «шльопання».", "Тулуб прямий, плечі розслаблені.", "Темп поступово збільшуйте протягом перших хвилин.", "Ходьба корисна для відновлення після інтенсивних занять.", "Зручне взуття з гнучкою підошвою зменшує навантаження на стопи."]}, {"h": "Легка атлетика. Метання малого м'яча: підготовчі та імітаційні вправи", "p": ["Техніку метання вдосконалюють не лише кидками, а й імітацією рухів і зміцненням м'язів плечового пояса та тулуба. Перед будь-якими кидками обов'язково розминають плечовий і ліктьовий суглоби."], "ul": ["Кругові рухи руками вперед і назад.", "Імітація кидка без снаряда перед дзеркалом.", "Імітація з гумовою стрічкою, закріпленою позаду (на уроці — під контролем учителя).", "Вправи для м'язів кору: планка, бічна планка.", "Метання на дальність з розбігу — за командою, у визначеному секторі."]}], "f": "", "pr": ["Напишіть коротке есе (5–7 речень) про те, чому ходьба корисна для здоров'я людини будь-якого віку.", "Виконайте розминку плечового пояса: кругові рухи руками вперед і назад по 15 разів, бічна планка по 20 секунд на кожен бік, 2 підходи."], "q": ["Чим оздоровча ходьба корисна для організму?", "Як виконується перекат стопи?", "Що таке імітаційні вправи і навіщо вони потрібні?", "Які суглоби потрібно розім'яти перед метанням?"]}, {"n": "96", "t": "Пульс і відновлення: повільний біг 6 хв. Стрибок у довжину з місця: помилки", "g": "Учень вмітиме оцінювати відновлення за пульсом після бігу та знатиме типові помилки стрибка в довжину з місця.", "k": "Модулі: Легка атлетика", "terms": [["ЧСС спокою", "кількість ударів серця за хвилину в стані повного спокою, найкраще вранці після пробудження."], ["Тест відновлення пульсу", "вимірювання пульсу через певний час після навантаження, щоб оцінити, як швидко організм відновлюється."], ["Напівприсід", "положення з неглибоко зігнутими ногами, з якого виконують відштовхування в стрибку з місця."], ["Синхронність рухів", "узгодженість у часі рухів рук і ніг під час виконання вправи."]], "th": [{"h": "Легка атлетика. Повільний біг 6 хв і контроль пульсу", "p": ["Пульс — найпростіший показник, за яким можна оцінити навантаження. Чим краще треноване серце, тим нижча ЧСС спокою і тим швидше пульс знижується після роботи. Порівнюючи свої результати протягом місяців, можна помітити зростання тренованості."], "ul": ["Виміряйте пульс до бігу, одразу після нього та через 1–3 хвилини.", "Швидке зниження пульсу — ознака доброго відновлення.", "Якщо пульс довго не знижується, наступного разу зменште навантаження.", "Не порівнюйте свій пульс з однокласниками — порівнюйте зі своїми попередніми даними.", "Під час бігу дотримуйтеся правил безпеки: біжіть у своєму ряду, не штовхайтеся."]}, {"h": "Легка атлетика. Стрибок у довжину з місця: типові помилки", "p": ["Стрибок з місця здається простим, але в ньому багато дрібних помилок, які «крадуть» сантиметри. Найчастіше вони пов'язані з неузгодженістю рук і ніг."], "ul": ["Надто глибокий присід — втрачається швидкість відштовхування.", "Мах руками не синхронний з випрямленням ніг.", "Відштовхування з неповним випрямленням ніг.", "Стрибок занадто вгору або занадто низько.", "Приземлення на прямі ноги або падіння назад."]}], "f": "", "pr": ["Протягом 3 днів вимірюйте пульс до і після комплексу з 20 присідань та через 2 хвилини відпочинку; запишіть результати в таблицю і зробіть висновок.", "Перед дзеркалом відпрацюйте синхронність: напівприсід з махом рук назад і швидке випрямлення з махом уперед-угору без стрибка — 3 × 10 разів."], "q": ["Що таке ЧСС спокою і коли її краще вимірювати?", "Як за пульсом оцінити відновлення після навантаження?", "Які помилки найчастіше трапляються в стрибку з місця?", "Чому варто порівнювати свій пульс лише зі своїми попередніми даними?"]}, {"n": "97", "t": "Правила змагань у спринті та стрибках у довжину. Біг 100 м, стрибок «зігнувши ноги»", "g": "Учень знатиме основні правила змагань з бігу на 100 м і стрибків у довжину та зможе виконувати обов'язки помічника судді.", "k": "Модулі: Легка атлетика", "terms": [["Фальстарт", "початок руху спортсмена до стартового сигналу."], ["Стартові колодки", "пристосування з упорами для ніг, яке допомагає бігунові сильніше відштовхнутися під час низького старту."], ["Індивідуальна доріжка", "розмічена смуга бігової доріжки, якою бігун має пробігти всю дистанцію в спринті."], ["Брусок для відштовхування", "біла дошка, врівень з доріжкою розбігу, ближній до ями край якої є лінією відштовхування."]], "th": [{"h": "Легка атлетика. Біг 100 м: правила і суддівство", "p": ["Спринтери біжать кожен по своїй доріжці. Стартер подає команди, а судді на фініші фіксують порядок і час. Час зупиняють, коли бігун перетинає фінішну площину тулубом, а не головою, руками чи ногами."], "ul": ["Команди: «На старт!», «Увага!», постріл або сигнал.", "Рух до сигналу — фальстарт.", "Перебігання на чужу доріжку, що заважає суперникові, призводить до дискваліфікації.", "Секундоміри вмикають за спалахом або сигналом, а не за звуком на відстані.", "На уроці можна по черзі виконувати роль стартера та суддів на фініші."]}, {"h": "Легка атлетика. Стрибок у довжину: правила і суддівство", "p": ["У змаганнях зі стрибків у довжину кожен учасник має кілька спроб, зараховують найкращий результат. Судді стежать за заступом і вимірюють результат рулеткою."], "ul": ["Заступ за лінію відштовхування — спроба не зараховується.", "Результат вимірюють від лінії відштовхування до найближчого сліду в піску перпендикулярно до бруска.", "Після приземлення виходити з ями слід уперед, а не через слід позаду.", "Після кожної спроби пісок розрівнюють.", "Учасник має виконати спробу за обмежений час після виклику."]}], "f": "", "pr": ["Складіть пам'ятку для помічника судді на фініші бігу на 100 м і в секторі стрибків у довжину (по 4 пункти).", "Виконайте спеціальні бігові вправи на місці: біг з високим підніманням стегна 3 × 20 секунд та підйоми на носки 2 × 15 разів."], "q": ["Що таке фальстарт?", "Яка частина тіла бігуна має перетнути фінішну лінію для фіксації часу?", "Як вимірюють результат у стрибку в довжину?", "Чому з ями з піском потрібно виходити вперед?"]}, {"n": "98", "t": "Спортивна ходьба: фази кроку. Стрибок у довжину з місця: розвиток сили ніг", "g": "Учень знатиме фази кроку в спортивній ходьбі та безпечні вправи для розвитку сили ніг, потрібні для стрибка в довжину з місця.", "k": "Модулі: Легка атлетика", "terms": [["Період одиночної опори", "частина кроку, коли тіло спирається лише на одну ногу, а друга виноситься вперед."], ["Період подвійної опори", "короткий момент у ходьбі, коли обидві ноги одночасно торкаються землі."], ["Виштовхувальна нога", "нога, яка відштовхується від землі позаду і просуває тіло вперед."], ["Сила ніг", "здатність м'язів ніг долати опір за рахунок м'язових зусиль."]], "th": [{"h": "Легка атлетика. Спортивна ходьба на відстань до 1000 м", "p": ["У ходьбі, на відміну від бігу, немає фази польоту: період одиночної опори змінюється коротким періодом подвійної опори. Саме подвійна опора гарантує контакт із землею. Що вища швидкість, то коротший період подвійної опори, тому техніку треба контролювати."], "ul": ["Виштовхувальна нога відштовхується від землі активно, носком.", "Махова нога виноситься вперед низько над землею.", "Опорна нога випрямлена від торкання до вертикалі.", "Руки працюють у темпі кроків.", "Дотримуйтеся своєї швидкості й не переходьте на біг."]}, {"h": "Легка атлетика. Стрибок у довжину з місця і сила ніг", "p": ["Для стрибка з місця важлива не тільки техніка, а й сила м'язів стегна, сідниць і гомілки. Розвивати її можна вправами з вагою власного тіла."], "ul": ["Присідання з паузою внизу.", "Випади вперед і назад з контролем коліна.", "Підйоми на носки на двох і на одній нозі.", "Сідничний місток лежачи на спині.", "Після силових вправ виконайте кілька стрибків з місця у повільному ритмі для закріплення техніки."]}], "f": "", "pr": ["Намалюйте схему кроку спортивної ходьби з позначенням періодів одиночної та подвійної опори.", "Виконайте комплекс для сили ніг: 3 × 12 присідань, 3 × 10 випадів на кожну ногу, 3 × 15 сідничних містків."], "q": ["Чим ходьба відрізняється від бігу за фазами кроку?", "Що таке період подвійної опори?", "Які м'язи найбільше працюють у стрибку з місця?", "Які вправи з вагою власного тіла розвивають силу ніг?"]}, {"n": "99", "t": "Розбіг у метанні малого м'яча. Серії бігу 3×30 м: підготовка до тестування", "g": "Учень вдосконалить розбіг і кидок у метанні малого м'яча та знатиме, як готуватися до швидкісних тестів.", "k": "Модулі: Легка атлетика", "terms": [["Попередній розбіг", "перша частина розбігу в метанні, де метальник набирає оптимальну швидкість, тримаючи снаряд біля плеча."], ["Кидкові кроки", "заключна частина розбігу, під час якої виконують відведення снаряда та схресний крок."], ["Гальмування після кидка", "зупинка тіла після випуску снаряда, щоб не переступити лінію метання."], ["Тестування", "перевірка рівня розвитку рухових якостей за допомогою стандартних вправ."]], "th": [{"h": "Легка атлетика. Метання малого м'яча на дальність з розбігу", "p": ["Розбіг у метанні має бути не надто швидким, а таким, щоб метальник встиг виконати кидкові кроки та фінальне зусилля. Надто швидкий розбіг часто призводить до того, що кидок виходить «на бігу» рукою, без участі ніг і тулуба."], "ul": ["Попередній розбіг — 6–8 кроків, рівномірне прискорення.", "Кидкові кроки — 4–5, з відведенням м'яча.", "Залиште 1–2 кроки між місцем кидка і лінією для гальмування.", "Метайте лише за командою, по черзі; у секторі не має бути людей."]}, {"h": "Легка атлетика. Серії бігу 3×30 м і підготовка до тестів", "p": ["Наближаються контрольні уроки. Щоб тест показав ваш справжній рівень, до нього треба підготуватися: виспатися, правильно поїсти й якісно розім'ятися."], "ul": ["Добре виспіться напередодні.", "Їжте не пізніше ніж за 1,5–2 години до заняття.", "Розминка — ЗРВ, бігові вправи, 2–3 прискорення.", "Під час тесту зосередьтеся на сигналі та техніці.", "Записуйте результати, щоб бачити прогрес."]}], "f": "", "pr": ["Складіть чек-лист «Як підготуватися до контрольного тестування» (не менше 6 пунктів).", "Відпрацюйте ритм кидкових кроків ходьбою на місці або в кімнаті без м'яча, повільно, рахуючи кроки вголос — 5 повторень."], "q": ["Чому розбіг у метанні не повинен бути максимально швидким?", "Що таке кидкові кроки?", "Для чого потрібне гальмування після кидка?", "Як підготуватися до контрольного тестування?"]}, {"n": "100", "t": "Рівномірний біг до 1500 м: спорядження, вода і погода. Стрибок у довжину з місця", "g": "Учень знатиме, як правильно підібрати взуття та одяг для бігу, дотримуватися питного режиму й безпеки в спеку, та закріпить стрибок у довжину з місця.", "k": "Модулі: Легка атлетика", "terms": [["Питний режим", "порядок і кількість вживання води до, під час і після фізичного навантаження."], ["Тепловий удар", "небезпечний стан перегрівання організму, що виникає за високої температури повітря й інтенсивних навантажень."], ["Бігове взуття", "спортивне взуття з амортизаційною та неслизькою підошвою, яке зменшує навантаження на суглоби під час бігу."], ["Зневоднення", "стан, коли організм втрачає більше рідини, ніж отримує, що знижує працездатність."]], "th": [{"h": "Легка атлетика. Рівномірний біг до 1500 м і безпека", "p": ["Наприкінці навчального року заняття часто проходять у теплу погоду. Тривалий біг у спеку збільшує втрату рідини з потом, тому важливо дотримуватися питного режиму та захищатися від сонця."], "ul": ["Пийте воду невеликими ковтками до і після бігу.", "У спеку — головний убір, світлий одяг, біг у тіні або вранці.", "Ознаки перегрівання: головний біль, слабкість, нудота, почервоніння — негайно припинити біг і перейти в тінь.", "Взуття має бути за розміром, з амортизацією; шкарпетки — без швів, що натирають.", "Тримайте рівномірний темп і стежте за диханням."]}, {"h": "Легка атлетика. Стрибок у довжину з місця", "p": ["Після тривалого бігу стрибки виконуємо після короткого відпочинку та кількох підготовчих вправ. Головне — правильна техніка та безпечне приземлення."], "ul": ["Перед стрибками 2–3 хвилини ходьби та махові вправи.", "Відштовхування обома ногами одночасно.", "Мах руками синхронно з випрямленням ніг.", "Приземлення м'яке, на обидві ноги, з нахилом уперед."]}], "f": "", "pr": ["Складіть пам'ятку «Біг у спеку: як не перегрітися» (не менше 5 порад).", "Перевірте своє спортивне взуття за пунктами: розмір, підошва, амортизація, шнурівка — і запишіть висновок, чи підходить воно для бігу."], "q": ["Чому під час бігу в спеку важливий питний режим?", "Які ознаки теплового удару?", "Яким має бути бігове взуття?", "Як підготуватися до стрибків після тривалого бігу?"]}, {"n": "101", "t": "Багатоборство на уроці: метання м'яча, біг 2×200 м, стрибок «зігнувши ноги»", "g": "Учень розумітиме, як поєднувати різні легкоатлетичні вправи в одному занятті, і закріпить техніку метання, бігу на 200 м та стрибка в довжину.", "k": "Модулі: Легка атлетика", "terms": [["Легкоатлетичне багатоборство", "вид змагань, у якому спортсмен виконує кілька різних дисциплін, а результати підсумовують."], ["Комплексне заняття", "урок або тренування, на якому поєднують вправи різної спрямованості."], ["Послідовність вправ", "порядок виконання вправ на занятті з урахуванням їхньої складності та впливу на організм."], ["Технічна вправа", "вправа, у якій головне — точність і правильність руху, а не максимальне зусилля."]], "th": [{"h": "Легка атлетика. Метання малого м'яча і стрибок у довжину з розбігу", "p": ["На комплексному уроці технічно складні вправи (метання, стрибки) виконують раніше, поки організм не втомився. Втома погіршує координацію, і техніка «розвалюється»."], "ul": ["Метання: розбіг, кидкові кроки, фінальне зусилля, гальмування.", "Стрибок: розбіг з контрольною позначкою, відштовхування, політ у положенні присіду, приземлення.", "Між спробами — повний відпочинок.", "Безпека: метання й стрибки проводять у різних секторах, не перетинаючи сусідній."]}, {"h": "Легка атлетика. Біг 2×200 м і легкоатлетичне багатоборство", "p": ["Біг 2×200 м виконують після технічних вправ, бо він сильно втомлює. У багатоборстві спортсмен має бути різнобічно розвиненим: швидким, сильним, витривалим і технічним."], "ul": ["Перед бігом — додаткові прискорення.", "Біг на віражі — нахил усередину, робота рук ширша зовнішньою рукою.", "Між відрізками — ходьба до відновлення.", "Багатоборство показує загальну фізичну підготовленість спортсмена.", "Після уроку — заминка та розтягування."]}], "f": "У програмі Олімпійських ігор є легкоатлетичні багатоборства: десятиборство в чоловіків і семиборство в жінок.", "pr": ["Складіть порядок вправ для комплексного уроку з легкої атлетики (5–6 вправ) і поясніть, чому обрали саме таку послідовність.", "Виконайте розтягування для заминки: м'язи задньої поверхні стегна, передньої поверхні стегна, гомілки — по 2 × 30 секунд на кожну ногу."], "q": ["Чому технічні вправи виконують на початку основної частини?", "Що таке легкоатлетичне багатоборство?", "Які якості потрібні багатоборцю?", "Як забезпечити безпеку, коли на уроці працюють кілька секторів?"]}, {"n": "102", "t": "Контрольний норматив: стрибок у довжину з місця. Біг 100 м", "g": "Учень знатиме правила виконання контрольного нормативу зі стрибка в довжину з місця, вмітиме підготуватися до нього й оцінити свій результат.", "k": "Модулі: Легка атлетика", "terms": [["Контрольний норматив", "встановлене завдання для перевірки рівня фізичної підготовленості учня."], ["Залікова спроба", "спроба, результат якої враховують для оцінювання."], ["Вимірювання від п'ят", "правило, за яким дальність стрибка з місця вимірюють від лінії до найближчої до неї точки приземлення, найчастіше п'ят."], ["Особистий прогрес", "зміна власного результату порівняно з попередніми вимірюваннями."]], "th": [{"h": "Легка атлетика. Контрольний норматив: стрибок у довжину з місця", "p": ["Стрибок у довжину з місця — один із тестів фізичної підготовленості. Учень зазвичай має кілька спроб, зараховують найкращу. Щоб тест був чесним і безпечним, усі виконують його за однаковими правилами."], "ul": ["Перед тестом — розминка з присіданнями, махами й кількома пробними стрибками.", "Носки ставлять біля лінії, не наступаючи на неї.", "Відштовхування обома ногами одночасно, без підстрибування на місці.", "Результат вимірюють до найближчого сліду; дотик руками позаду зменшує результат.", "Порівнюйте результат зі своїм попереднім, щоб оцінити особистий прогрес.", "Якщо щось болить — не виконуйте тест, повідомте вчителя."]}, {"h": "Легка атлетика. Біг 100 м", "p": ["На контрольному уроці біг 100 м виконують як закріплення. Пам'ятаємо про інструктаж з БЖД: біг лише по своїй доріжці, фінішування через лінію, поступове сповільнення."], "ul": ["Низький старт за командами.", "Розгін з поступовим випрямленням.", "Розслаблений біг по дистанції.", " а атлетика. Серії бігу 3×30 м", "p": ["Серії бігу після метання виконують у помірному обсязі. Головне — техніка й швидкість без перевантаження."], "ul": ["Перед бігом — прискорення на 20 м.", "Кожен відрізок з максимальною швидкістю.", "Відпочинок — ходьба до старту.", "Наприкінці уроку — заминка."]}], "f": "", "pr": ["Проаналізуйте письмово свій результат у метанні: що вдалося, які помилки були (розбіг, відведення, фінальне зусилля, кут вильоту) і що будете вдосконалювати.", "Виконайте розминку плечового пояса: кругові рухи руками, махи, зведення лопаток — по 15 повторень кожної вправи."], "q": ["Коли спроба в метанні не зараховується?", "Як вимірюють результат у метанні малого м'яча?", "Чому перед контрольним метанням потрібна розминка плечового пояса?", "Як проаналізувати свій результат після тесту?"]}, {"n": "104", "t": "Самоаналіз техніки: стрибок у довжину «зігнувши ноги» та біг 2×200 м", "g": "Учень навчиться аналізувати власну техніку в стрибку в довжину та бігу на 200 м і ставити собі завдання для вдосконалення.", "k": "Модулі: Легка атлетика", "terms": [["Самоаналіз", "оцінювання власних дій і результатів, щоб знайти сильні сторони та помилки."], ["Відеоаналіз", "перегляд відеозапису виконання вправи для виявлення помилок у техніці."], ["Ключовий елемент техніки", "частина руху, яка найбільше впливає на результат вправи."], ["Індивідуальна мета", "конкретне, досяжне завдання, яке учень ставить собі для вдосконалення."]], "th": [{"h": "Легка атлетика. Стрибок у довжину способом «зігнувши ноги»: самоаналіз", "p": ["Найкраще помилки видно збоку. На уроці можна попросити однокласника або вчителя записати ваш стрибок на телефон, а потім переглянути запис у сповільненому режимі. Для аналізу зручно розбити стрибок на фази й оцінити кожну окремо."], "ul": ["Розбіг: чи не сповільнюєтеся перед бруском?", "Відштовхування: чи потрапляєте на брусок, чи випрямлена нога?", "Політ: чи винесена махова нога, чи прямий тулуб?", "Приземлення: чи винесені ноги вперед, чи не па function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const norm = t => t.toLowerCase().replace(/[«»"()]/g, "").trim();

function makeQuiz(l){
  if (l.qz) return shuffle(l.qz).slice(0, 5).map(x => ({ q: x.q, sub: "", why: x.why || "", opts: shuffle(x.o.map((o, j) => [o, j === x.a])) }));
  const s = l.subj;
  const uniq = arr => { const seen = new Set(); return arr.filter(([t]) => { const k = norm(t); if (seen.has(k)) return false; seen.add(k); return true; }); };
  const themeTerms = uniq(l.theme.lessons.flatMap(x => x.terms));
  const subjTerms = uniq(s.flat.flatMap(x => x.terms));
  let pool = shuffle(uniq(l.terms));
  if (pool.length < 5) pool = pool.concat(shuffle(themeTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  if (pool.length < 5) pool = pool.concat(shuffle(subjTerms.filter(t => !pool.some(p => norm(p[0]) === norm(t[0])))));
  pool = pool.slice(0, 5);
  return pool.map(([term, def], i) => {
    const others = shuffle(themeTerms.filter(t => norm(t[0]) !== norm(term) && t[1] !== def));
    let dis = others.slice(0, 3);
    if (dis.length < 3) dis = dis.concat(shuffle(subjTerms.filter(t => norm(t[0]) !== norm(term) && !dis.includes(t))).slice(0, 3 - dis.length));
    const byDef = i % 2 === 1;
    const opts = shuffle([[byDef ? term : def, true], ...dis.map(d => [byDef ? d[0] : d[1], false])]);
    return byDef
      ? { q: "Який термін відповідає визначенню?", sub: def, opts }
      : { q: "Що означає термін «" + term + "»?", sub: "", opts };
  });
}

function renderToc(){
  const s = DATA.find(x => x.id === cur.s);
  document.documentElement.style.setProperty("--subj", COLORS[s.id] || COLORS[s.id.replace(/\d+$/, "")]);
  [...tabs.children].forEach(b => b.setAttribute("aria-selected", b.dataset.s === s.id));
  const qv = norm(document.getElementById("search").value || "");
  const toc = document.getElementById("toc"); toc.innerHTML = "";
  let shown = 0;
  s.themes.forEach(t => {
    const ls = t.lessons.filter(l => !qv || norm(l.t).includes(qv) || l.terms.some(x => norm(x[0]).includes(qv)));
    if (!ls.length) return;
    const d = document.createElement("div"); d.className = "theme";
    d.innerHTML = "<h3>" + esc(t.name) + "</h3>";
    ls.forEach(l => {
      shown++;
      const r = results[l.id];
      const b = document.createElement("button"); b.className = "les";
      b.setAttribute("aria-current", l.id === cur.id);
      const no = s.id === "zu" ? "№ " + l.n : l.n;
      b.innerHTML = '<span class="no">' + esc(no) + '</span><span class="tt">' + esc(l.t) + '</span>' +
        (r ? '<span class="st ' + (r >= 4 ? "done" : "part") + '">' + r + "/5</span>" : "");
      b.onclick = () => open(l.id);
      d.appendChild(b);
    });
    toc.appendChild(d);
  });
  if (!shown) toc.innerHTML = '<p class="empty">Нічого не знайдено. Спробуйте інше слово.</p>';
  const ql = s.flat.filter(l => !l.noquiz), done = ql.filter(l => (results[l.id] || 0) >= 4).length;
  document.getElementById("progTxt").textContent = done + " / " + ql.length;
  document.getElementById("progBar").style.width = (100 * done / ql.length) + "%";
}

  if (l.f) h += '<div class="fact"><b>Цікаво знати</b>' + esc(l.f) + "</div>";
  if (l.pr.length) h += '<h2>Практичне завдання</h2><div class="prose"><ul class="tasks">' + l.pr.map(x => "<li>" + esc(x) + "</li>").join("") + "</ul></div>";
  if (l.q.length) h += '<h2>Питання для самоперевірки</h2><div class="prose"><ol>' + l.q.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol></div>";
  if (!l.noquiz) h += '<section class="quiz" id="quiz"></section>';
  A.innerHTML = h;
  A.querySelectorAll(".fig img,.cardx img").forEach(im => im.onclick = () => {
    const d = document.createElement("div"); d.className = "lb"; d.innerHTML = '<img alt="">'; d.firstChild.src = im.src; d.firstChild.alt = im.alt;
    d.onclick = () => d.remove(); document.body.appendChild(d); });
  if (!l.noquiz) renderQuiz(l);
  const i = s.flat.indexOf(l), pv = s.flat[i - 1], nx = s.flat[i + 1];
  const P = document.getElementById("pager"); P.innerHTML = "";
  [[pv, "← Попередній"], [nx, "Наступний →"]].forEach(([x, lab]) => { if (!x) return;
    const b = document.createElement("button"); b.innerHTML = esc(lab) + "<b>" + esc(x.t) + "</b>"; b.onclick = () => open(x.id); P.appendChild(b); });
}

function renderQuiz(l){
  const Q = makeQuiz(l), box = document.getElementById("quiz");
  const prev = results[l.id];
  let h = '<div class="qhead"><h2>Тест · 5 завдань</h2><p>' + (prev ? "Найкращий результат: " + prev + " з 5" : "Оберіть одну відповідь у кожному завданні") + "</p></div><form id=\"qf\">";
  Q.forEach((q, i) => {
    h += '<div class="q"><div class="qt"><span>' + (i + 1) + ".</span><div>" + esc(q.q) + (q.sub ? "<br><em>" + esc(q.sub) + "</em>" : "") + '</div></div><div class="opts">';
    q.opts.forEach(([t], j) => h += '<label class="opt"><input type="radio" name="q' + i + '" id="q' + i + "o" + j + '" value="' + j + '"><span>' + esc(t) + "</span></label>");
    h += "</div></div>";
  });
  h += '<div class="qfoot"><button class="btn" type="submit" id="chk" disabled>Перевірити</button><button class="btn ghost" type="button" id="again">Інші питання</button><span class="score" id="sc" aria-live="polite"></span></div></form>';
  box.innerHTML = h;
  const f = document.getElementById("qf"), chk = document.getElementById("chk");
  f.addEventListener("change", () => { chk.disabled = Q.some((_, i) => !f["q" + i] || ![...f.querySelectorAll('[name="q' + i + '"]')].some(x => x.checked)); });
  document.getElementById("again").onclick = () => renderQuiz(l);
  f.addEventListener("submit", e => {
    e.preventDefault(); if (f.classList.contains("checked")) return;
    let ok = 0;
    Q.forEach((q, i) => {
      const inputs = [...f.querySelectorAll('[name="q' + i + '"]')];
      inputs.forEach((inp, j) => { inp.disabled = true; const lab = inp.parentElement;
        if (q.opts[j][1]) lab.classList.add("right"); else if (inp.checked) lab.classList.add("wrong"); });
      if (q.why) { const w = document.createElement("p"); w.className = "why"; w.textContent = q.why; inputs[0].closest(".opts").after(w); }
      const sel = inputs.findIndex(x => x.checked); if (sel >= 0 && q.opts[sel][1]) ok++;
    });
    f.classList.add("checked"); chk.disabled = true;
    const sc = document.getElementById("sc");
    sc.className = "score " + (ok >= 4 ? "good" : ok >= 3 ? "mid" : "low");
    sc.textContent = "Результат: " + ok + " з 5. " + (ok === 5 ? "Чудово!" : ok >= 4 ? "Добре засвоєно." : ok >= 3 ? "Повторіть ключові поняття." : "Перечитайте конспект і спробуйте ще раз.");
    if (ok > (results[l.id] || 0)) { results[l.id] = ok; store.set(results); }
    renderToc();
  });
}

function open(id){
  cur = { s: LES[id].subj.id, id };
  try { localStorage.setItem("yasno-last", id); } catch(e){}
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  renderToc(); renderLesson();
  document.getElementById("side").classList.remove("open");
  document.getElementById("tocBtn").setAttribute("aria-expanded", "false");
  window.scrollTo({ top: 0 });
}
document.getElementById("search").addEventListener("input", renderToc);
document.getElementById("tocBtn").onclick = e => { const sd = document.getElementById("side"); const o = sd.classList.toggle("open"); e.currentTarget.setAttribute("aria-expanded", o); };
open(cur.id);
</script>
