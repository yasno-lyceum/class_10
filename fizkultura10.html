ч.", "k": "Модулі: Настільний теніс", "terms": [["Тайм-аут", "перерва до однієї хвилини, яку кожен гравець або пара може взяти один раз за матч."], ["Ритуал перед подачею", "однакова послідовність дій перед кожною подачею, що допомагає зосередитися."], ["Емоційний контроль", "уміння керувати своїми емоціями, не дозволяючи гніву чи хвилюванню заважати грі."], ["Самоналаштування", "позитивні короткі фрази або образи, які гравець використовує для впевненості."]], "th": [{"h": "Настільний теніс. Подачі під тиском", "p": ["Подача — момент, коли гравець повністю контролює гру, але й найбільше хвилюється, особливо при рахунку 9:9 чи 10:10. Щоб подача була надійною, у напружені моменти обирають ту, яку виконують найстабільніше, а не найризикованішу.", "Допомагає ритуал: кілька відскоків м'яча, вдих, погляд на суперника, план подачі — і лише потім удар."], "ul": ["У важливий момент — надійна подача.", "Ритуал щоразу однаковий.", "Повільний видих перед підкиданням.", "Чіткий план: подача і третій удар.", "Не міняй техніку через хвилювання."]}, {"h": "Настільний теніс. Психологічна підготовка", "p": ["Хвилювання перед грою — нормальне. Важливо, щоб воно не заважало. Корисні прийоми: глибоке повільне дихання, коротка розминка, позитивні фрази («Я готовий», «Крок за кроком»), зосередження на наступному очку, а не на рахунку чи помилках.", "За правилами кожен гравець може раз за матч узяти тайм-аут до однієї хвилини: щоб відпочити, заспокоїтися або змінити тактику. Його варто використовувати, коли суперник виграє кілька очок поспіль."], "ul": ["Одне очко — одна думка.", "Помилку відпусти одразу.", "Дихання: вдих 4 рахунки, видих 6.", "Тайм-аут — для зміни плану, не лише для відпочинку.", "Поважай суперника незалежно від результату."]}], "f": "Між розіграшами гравці часто відвертаються від столу на кілька секунд — це спосіб «перезапустити» увагу перед наступним очком.", "pr": ["Склади і запиши свій ритуал перед подачею (3–5 дій) та 3 позитивні фрази для самоналаштування.", "Виконай дихальну вправу: 10 циклів вдих на 4 рахунки — видих на 6 рахунків; виміряй пульс до і після та запиши результат."], "q": ["Що таке тайм-аут і скільки разів його можна взяти?", "Яку подачу краще обирати в напружений момент гри?", "Які прийоми допомагають контролювати хвилювання?", "Навіщо потрібен ритуал перед подачею?"]}, {"n": "51", "t": "Контрудари. Накат справа та зліва по діагоналі: перехід від стабільності до атаки", "g": "Учень знатиме, як у розіграші переходити від стабільних накатів до активних атакувальних дій, та узагальнить техніку атакувальних ударів.", "k": "Модулі: Настільний теніс", "terms": [["Ініціатива", "перевага в розіграші, коли гравець диктує напрямок і темп ударів."], ["Зручний м'яч", "високий або повільний м'яч, який можна атакувати з мінімальним ризиком."], ["Завершальний удар", "сильний удар, яким гравець прагне виграти очко."], ["Зміна темпу", "чергування повільніших і швидших ударів, щоб збити ритм суперника."]], "th": [{"h": "Настільний теніс. Від стабільності до атаки", "p": ["Розіграш складається з етапів: підготовка (стабільні накати по діагоналі), створення переваги (зміна напрямку чи темпу) і завершення (сильний удар). Найчастіша помилка — бити щосили по незручному м'ячу і програвати очко власною помилкою.", "Зручний м'яч — високий, повільний або короткий без сильного обертання. Саме його варто атакувати контрударом чи сильним накатом."], "ul": ["Спочатку стабільність, потім сила.", "Атакуй зручні м'ячі.", "Змінюй темп і напрямок.", "Після сильного удару будь готовий до відповіді.", "Ризикований удар — лише за вигідної ситуації."]}, {"h": "Настільний теніс. Узагальнення атакувальних ударів", "p": ["Атакувальні удари мають спільну основу: рух уперед-угору, закрита ракетка, участь ніг і тулуба, повернення в стійку. Відрізняються вони співвідношенням швидкості й обертання: накат — середня швидкість і невеликий верхній оберт, контрудар — швидка відповідь на атаку з коротким замахом, топ-спін — максимальне обертання."], "ul": ["Накат — основний, стабільний удар.", "Контрудар — відповідь на атаку, близько до столу.", "Топ-спін — сильне обертання, дугова траєкторія.", "Усі — з поворотом тулуба.", "Безпека — вільний простір для замаху."]}], "f": "Сильні гравці часто виграють очко не найпотужнішим ударом, а несподіваною зміною напрямку або темпу.", "pr": ["Опиши письмово приклад розіграшу з трьох етапів (підготовка, створення переваги, завершення), вказавши удари і напрямки.", "Виконай гру «в тінь» за цим розіграшем: 5 повторень по 15–20 секунд з відпочинком 40 секунд."], "q": ["З яких етапів складається атакувальний розіграш?", "Який м'яч вважають зручним для атаки?", "Чим відрізняються накат, контрудар і топ-спін?", "Чому не варто атакувати кожен м'яч?"]}, {"n": "52", "t": "Подачі «маятник», з нижнім і верхнім обертом. Підсумок розділу «Настільний теніс»", "g": "Учень узагальнить знання з розділу «Настільний теніс»: правила, техніку подач і ударів, тактику, самоконтроль.", "k": "Модулі: Настільний теніс", "terms": [["Техніко-тактична підготовка", "поєднання вивчення техніки ударів і вміння доцільно застосовувати їх у грі."], ["Арсенал гравця", "сукупність ударів і подач, якими гравець надійно володіє."], ["Індивідуальний план", "план розвитку, складений з урахуванням власних сильних і слабких сторін."], ["Рефлексія", "осмислення своїх досягнень і труднощів після певного етапу навчання."]], "th": [{"h": "Настільний теніс. Повторення подач", "p": ["Ми вивчили подачі з нижнім і верхнім обертом, маятник, його зворотний варіант, бокове та нижньо-бокове обертання. Усі вони мають виконуватися за правилами: відкрита долоня, підкидання щонайменше 16 см, м'яч видимий для суперника.", "Ефективність подачі залежить від обертання, довжини, напрямку і плану на третій удар."], "ul": ["Нижній оберт — ракетка відкрита, рух під м'яч.", "Верхній оберт — ракетка закрита, рух угору-вперед.", "Маятник — бокове обертання з різними варіантами.", "Чергування коротких і довгих подач.", "Подача — початок тактичного плану."]}, {"h": "Настільний теніс. Підсумок розділу", "p": ["Техніка: стійка, хват, переміщення, накати справа і зліва, контрудари, топ-спін, підрізка, прийом нижнього обертання (скидка, довга підрізка, флік). Тактика: гра по діагоналі й лінії, стилі гри, атака після подачі. Правила і суддівство: рахунок до 11, подачі по дві, парна гра, тайм-аут.", "Здоров'я і самоконтроль: розминка і заминка, пульс, щоденник тренувань, профілактика перевантажень, психологічна підготовка."], "ul": ["Техніка — основа стабільної гри.", "Тактика — розумне використання ударів.", "Правила — чесна і безпечна гра.", "Самоконтроль — тренування без шкоди здоров'ю.", "Самостійні заняття — шлях до прогресу."]}], "f": "Настільний теніс входить до програми Олімпійських ігор з 1988 року.", "pr": ["Напиши рефлексію: 3 речі, які ти навчився в розділі «Настільний теніс», 2 удари, які хочеш покращити, і план, як це зробити самостійно.", "Склади 5 запитань-вікторин про правила настільного тенісу з відповідями і перевір знання когось із рідних."], "q": ["Назви основні правила подачі.", "Як ведеться рахунок у настільному тенісі?", "Чим відрізняються накат, топ-спін і підрізка?", "Які засоби самоконтролю використовує тенісист?"]}]}, {"name": "Розділ 3. Футбол (уроки 53–78)", "lessons": [{"n": "53", "t": "Безпека на заняттях футболом. Історія та правила гри. Удари ногою, зупинки й ведення м'яча", "g": "Учень знатиме правила безпеки на уроках футболу, основні віхи історії та правила гри, а також техніку базових ударів, зупинок і ведення м'яча.", "k": "Модулі: Футбол", "terms": [["Положення поза грою (офсайд)", "ситуація, коли в момент передачі партнера гравець на половині суперника ближче до лінії воріт, ніж м'яч і передостанній гравець суперника, та бере активну участь у грі."], ["Удар внутрішньою стороною стопи", "найточніший удар у футболі, коли м'яч б'ють частиною стопи від великого пальця до п'яти; використовують для коротких і середніх передач."], ["Зупинка м'яча", "технічний прийом, яким гравець гасить швидкість м'яча й залишає його біля себе для подальших дій."], ["Ведення м'яча", "переміщення гравця з м'ячем, коли він послідовно підштовхує м'яч ногою, не втрачаючи контролю над ним."]], "th": [{"h": "Футбол. Правила безпеки, історія та основні правила гри", "p": ["Футбол — контактна командна гра, тож травми найчастіше виникають через зіткнення, падіння, удари м'ячем і недостатню розминку. Безпечна гра починається з правильного взуття, щитків і розігрітих м'язів, а також із поваги до суперника.", "Сучасний футбол сформувався в Англії: у 1863 році там створили Футбольну асоціацію та записали єдині правила. Гра триває два тайми по 45 хвилин, у кожній команді на полі 11 гравців, серед них воротар. Перемагає команда, яка заб'є більше голів."], "ul": ["Займайтеся в бутсах або кросівках відповідно до покриття поля, у щитках, без прикрас, годинників і жуйки.", "Перед грою — розминка: спеціальні бігові та стрибкові вправи (біг із високим підніманням стегна, із захлестом гомілки, приставними кроками, стрибки з ноги на ногу).", "Не грайте ногою високо біля голови суперника, не штовхайте ззаду, не підкатуйтесь без дозволу вчителя.", "Головні правила: м'яч у грі, доки повністю не перетне лінію; торкатися м'яча руками може лише воротар у своєму штрафному майданчику.", "Порушення караються вільним або штрафним ударом, серйозні — жовтою чи червоною карткою, у своєму штрафному майданчику — пенальті.", "Відчули біль чи запаморочення — негайно припиніть гру й повідомте вчителя."]}, {"h": "Футбол. Удари по м'ячу ногою", "p": ["Удар — головний засіб передати м'яч партнерові чи забити гол. Будь-який удар складається з фаз: розбіг, постановка опорної ноги, замах ударною ногою, удар і супровід м'яча. Від точності кожної фази залежить, куди й з якою силою полетить м'яч."], "ul": ["Опорну ногу ставте збоку від м'яча на відстані приблизно стопи, носок спрямований у бік удару.", "Удар внутрішньою стороною стопи: ударна нога розвернута назовні, стопа напружена, б'ємо в центр м'яча.", "Удар серединою підйому (шнурками) — для сильних і далеких ударів; носок відтягнутий донизу.", "Під час удару дивіться на м'яч, корпус злегка нахилений уперед — так м'яч не злітає високо.", "Типові помилки: опорна нога далеко від м'яча, розслаблена стопа, відкидання корпусу назад."]}, {"h": "Футбол. Зупинки та ведення м'яча різними способами", "p": ["Якісна зупинка дає змогу виграти час і одразу виконати наступну дію. Ведення поєднує біг і роботу з м'ячем: що вища швидкість, то далі можна відпускати м'яч, а в тісноті м'яч тримають біля ноги."], "ul": ["Зупинка внутрішньою стороною стопи: нога назустріч м'ячу, у момент дотику злегка відводимо її назад (амортизуємо).", "Зупинка підошвою: носок піднятий, м'яч притискається до землі.", "Ведення внутрішньою стороною стопи — повільніше, зате зручно змінювати напрямок.", "Ведення зовнішньою частиною підйому — найшвидше, м'яч котиться прямо перед гравцем.", "Під час ведення періодично піднімайте голову й оглядайте поле.", "Типова помилка: занадто сильні поштовхи, через які м'яч відривається від гравця."]}], "f": "Єдині правила футболу вперше записала Футбольна асоціація Англії, створена в Лондоні в 1863 році.", "pr": ["Складіть пам'ятку «10 правил безпеки на уроці футболу» з урахуванням екіпірування, розминки та поведінки на полі.", "Намалюйте схему футбольного поля з позначенням штрафного майданчика, воротарського майданчика, точки пенальті та центрального кола й підпишіть, для чого кожна зона."], "q": ["Які основні причини травм у футболі і як їх уникнути?", "Коли гравець перебуває в положенні поза грою?", "Які фази має удар по м'ячу ногою?", "Чим ведення внутрішньою стороною стопи відрізняється від ведення зовнішньою частиною підйому?"]}, {"n": "54", "t": "Спеціальні бігові та стрибкові вправи. Фінти. Відбирання м'яча в підкаті", "g": "Учень зрозуміє призначення спеціальних бігових і стрибкових вправ, техніку простих фінтів і безпечного відбирання м'яча в підкаті.", "k": "Модулі: Футбол", "terms": [["Фінт", "обманний рух, яким гравець вводить суперника в оману щодо своїх справжніх намірів, щоб обіграти його."], ["Фінт «відходом»", "обманний рух, коли гравець показує рух в один бік, а сам різко веде м'яч у протилежний."], ["Підкат", "спосіб відбирання м'яча в ковзанні по газону, коли захисник вибиває або зупиняє м'яч витягнутою ногою."], ["Небезпечна гра", "дії гравця, які загрожують здоров'ю суперника або його самого, наприклад висока нога чи підкат із виставленими шипами."]], "th": [{"h": "Футбол. Спеціальні бігові та стрибкові вправи, безпека", "p": ["Спеціальні бігові та стрибкові вправи готують м'язи й зв'язки до ривків, зупинок і стрибків, які постійно трапляються у футболі. Вони покращують частоту кроків, координацію та силу поштовху, а також знижують ризик розтягнень."], "ul": ["Біг із високим підніманням стегна, із захлестом гомілки, на прямих ногах.", "Біг приставними та схресними кроками, біг спиною вперед.", "Стрибки з ноги на ногу, на одній нозі, підскоки.", "Прискорення 10–20 м зі зміною напрямку за сигналом.", "Перед підкатами — додаткова розминка стегон і гомілкостопів, підкати лише на рівному м'якому покритті та з дозволу вчителя."]}, {"h": "Футбол. Фінти", "p": ["Фінт складається з двох частин: удаваного руху, на який має відреагувати суперник, і справжньої дії, яку виконують одразу після його реакції. Фінт спрацьовує лише тоді, коли його показують переконливо й на правильній відстані — приблизно 1,5–2 м до суперника."], "ul": ["Фінт «відходом»: нахил корпусу й крок в один бік, різкий відхід із м'ячем в інший.", "Фінт «ударом»: замах для удару чи передачі, а замість удару — переведення м'яча під себе.", "Після фінта обов'язково прискорюйтеся — інакше суперник встигне відновитися.", "Відпрацьовуйте фінти обома ногами.", "Типові помилки: фінт надто рано або надто близько до суперника, повільне виконання."]}, {"h": "Футбол. Відбирання м'яча в підкаті", "p": ["Підкат — крайній засіб відбору, коли інакше дістати м'яч неможливо. За правилами грати треба саме в м'яч: підкат, що зачіпає ноги суперника раніше від м'яча, — порушення, а підкат із силою чи шипами вперед карається карткою."], "ul": ["Підкат виконують збоку або спереду, ковзаючи на стегні опорної ноги.", "Ударна (відбирна) нога витягнута, стопа розвернута, шипи не виставлені на суперника.", "Дивіться на м'яч, а не на гравця; починайте підкат, коли суперник відпустив м'яч від себе.", "Ніколи не підкатуйтеся ззаду та двома ногами.", "Після підкату швидко вставайте — гра триває."]}], "f": "", "pr": ["Виконайте вдома розминку з 6–8 вправ на місці (ходьба з високим підніманням стегна, обертання в суглобах, випади, присідання) і запишіть її у вигляді комплексу з дозуванням.", "Опишіть письмово, які дії під час підкату суддя вважає порушенням, і поясніть, чому вони небезпечні."], "q": ["Для чого футболістам спеціальні бігові та стрибкові вправи?", "З яких двох частин складається будь-який фінт?", "Коли доцільно виконувати підкат, а коли — ні?", "Які види підкату є порушенням правил?"]}, {"n": "55", "t": "Удари по м'ячу головою. Техніка удару серединою лоба", "g": "Учень опанує теоретичні основи безпечного удару по м'ячу серединою лоба: фази руху, положення тіла й типові помилки.", "k": "Модулі: Футбол", "terms": [["Удар серединою лоба", "основний спосіб удару головою, коли м'яч приймають плоскою й найміцнішою частиною лоба над переніссям."], ["Прогин тулуба", "фаза замаху під час удару головою, коли тулуб відводиться назад, щоб накопичити силу для руху вперед."], ["Фіксація шиї", "напруження м'язів шиї в момент удару, завдяки якому голова й тулуб рухаються як одне ціле."], ["Удар головою з місця", "удар без стрибка, коли гравець стоїть у кроковій стійці й б'є м'яч рухом тулуба вперед."]], "th": [{"h": "Футбол. Безпека під час ударів головою", "p": ["Удари головою потрібні і в нападі, і в обороні, але вони вимагають особливої обережності. Неправильна техніка — удар маківкою, скронею чи з розслабленою шиєю — може спричинити біль, запаморочення або травму. Тому спершу вчаться на легких і м'яких м'ячах та з невеликої відстані."], "ul": ["Приймайте м'яч лише лобом, ніколи маківкою чи скронею.", "Не заплющуйте очей — стежте за м'ячем до моменту удару.", "На початку навчання — легкий м'яч, невелика кількість повторень.", "Не виконуйте удари головою в боротьбі, поки не освоїли техніку з місця.", "Відчули головний біль, нудоту чи запаморочення — негайно припиніть заняття й повідомте вчителя."]}, {"h": "Футбол. Техніка удару лобом з місця", "p": ["Сила удару головою береться не з шиї, а з усього тіла: ноги та тулуб працюють як пружина. Голова лише точно спрямовує м'яч, а шия тримає її нерухомо відносно тулуба."], "ul": ["Вихідне положення: крокова стійка, ноги злегка зігнуті, руки трохи розведені для рівноваги.", "Замах: прогин тулуба назад, підборіддя притиснуте, погляд на м'яч.", "Удар: різкий рух тулуба вперед, м'яч зустрічаємо серединою лоба.", "Супровід: після удару тулуб продовжує рух у напрямку польоту м'яча.", "Типові помилки: кивок лише головою, заплющені очі, удар занадто високою частиною голови."]}, {"h": "Футбол. Спеціальні вправи для підготовки до ударів головою", "p": ["Підготовчі вправи формують правильний рух ще до роботи з м'ячем. Корисно зміцнювати м'язи шиї та спини, тренувати прогин і різкий рух тулуба вперед, а також вчитися не кліпати, коли до обличчя наближається предмет."], "ul": ["Імітація удару без м'яча: прогин — рух уперед із фіксацією шиї.", "Удари по м'ячу, підвішеному на рівні лоба.", "Удар головою з рук партнера, який легко підкидає м'яч.", "Вправи для м'язів спини та шиї без обтяжень.", "Стрибкові вправи (стрибки вгору з місця) як підготовка до ударів у стрибку."]}], "f": "У низці країн для дітей молодшого віку обмежили або заборонили відпрацювання ударів головою на тренуваннях, щоб берегти їхнє здоров'я.", "pr": ["Виконайте перед дзеркалом 3 підходи по 10 імітацій удару головою без м'яча (прогин — рух уперед), стежачи, щоб підборіддя було притиснуте, а очі — відкриті.", "Намалюйте схему фаз удару серединою лоба (вихідне положення, замах, удар, супровід) і коротко підпишіть кожну."], "q": ["Якою частиною голови правильно бити по м'ячу і чому?", "З яких фаз складається удар головою з місця?", "Звідки береться сила удару головою?", "Які ознаки мають змусити вас припинити вправи з ударами головою?"]}, {"n": "56", "t": "Техніка воротаря: кидки м'яча руками, вибивання ногами, гра на виходах", "g": "Учень дізнається, як воротар вводить м'яч у гру руками й ногами, коли і як виходить із воріт, і які правила обмежують його дії.", "k": "Модулі: Футбол", "terms": [["Вибивання м'яча з рук", "удар воротаря по м'ячу, який він випускає з рук, щоб далеко ввести його в гру."], ["Кидок м'яча зверху", "введення м'яча воротарем однією рукою з-за голови, подібно до кидка м'ячика, для передачі на середню й далеку відстань."], ["Вихід воротаря", "переміщення воротаря від лінії воріт назустріч м'ячу чи суперникові, щоб перехопити передачу або скоротити кут удару."], ["Штрафний майданчик", "прямокутна зона перед воротами, у межах якої воротар може грати руками, а порушення команди, що захищається, карається пенальті."]], "th": [{"h": "Футбол. Воротар: правила та безпека", "p": ["Воротар — єдиний гравець, якому дозволено грати руками, але лише у своєму штрафному майданчику. Він останній рубіж оборони й перший гравець атаки, тому має вміти не лише ловити, а й точно вводити м'яч у гру. Воротар часто падає та стикається з суперниками, тому для нього безпека особливо важлива."], "ul": ["Воротар може тримати м'яч у руках не довше 6 секунд.", "Не можна брати в руки м'яч після навмисної передачі партнера ногою.", "Обов'язкова екіпіровка — рукавиці; бажано одяг із захистом ліктів і стегон.", "Падіння — на бік, із перекатом, не на прямі руки.", "Під час виходу кричіть «Моя!» або «Воротар!», щоб партнери не заважали."]}, {"h": "Футбол. Кидки м'яча руками", "p": ["Кидок руками точніший за вибивання, тому ним часто починають швидку атаку. Залежно від відстані використовують кидок знизу (котом), збоку або зверху."], "ul": ["Кидок знизу: м'яч котиться по землі до партнера на 10–20 м — так його легко прийняти.", "Кидок зверху: рука з м'ячем відводиться назад, кидок прямою рукою над головою на 25–40 м.", "Опорна нога — протилежна кидковій руці, рух іде від ніг через корпус до кисті.", "Віддавайте м'яч вільному партнерові, якого не опікує суперник.", "Типові помилки: кидок, що відскакує від землі, передача партнерові під тиском."]}, {"h": "Футбол. Вибивання м'яча ногами та гра на виходах", "p": ["Вибивання ногою дозволяє швидко відправити м'яч далеко на половину суперника. Гра на виходах вимагає рішучості: воротар має точно вирішити, чи встигне він до м'яча раніше за суперника. Невдалий вихід часто закінчується голом у порожні ворота."], "ul": ["Вибивання з рук: м'яч випускають перед ударною ногою, удар серединою підйому.", "Виходьте, коли впевнені, що дістанете м'яч першим; сумніваєтесь — залишайтеся у воротах.", "Під час виходу один на один скорочуйте кут, рухаючись до суперника по лінії «м'яч — центр воріт».", "На навісах ловіть м'яч у найвищій точці, піднімаючи коліно для захисту.", "Після виходу швидко повертайтеся в ворота, якщо м'яч не захоплено."]}], "f": "Правило, яке забороняє воротареві брати в руки навмисну передачу партнера ногою, запровадили в 1992 році, щоб зробити гру динамічнішою.", "pr": ["Опишіть письмово 3 ситуації, коли воротареві варто виходити з воріт, і 2 ситуації, коли краще залишатися на лінії.", "Виконайте імітацію кидка м'яча зверху без м'яча: 2 підходи по 10 повторень кожною рукою, стежачи за роботою ніг і корпусу."], "q": ["Які обмеження правила накладають на воротаря?", "Чим кидок знизу відрізняється від кидка зверху і коли кожен доцільний?", "Як правильно вибивати м'яч із рук?", "Як воротар скорочує кут під час виходу один на один?"]}, {"n": "57", "t": "Удари ногою серединою та зовнішньою частиною підйому. Зупинки грудьми й стегном, ведення", "g": "Учень удосконалить знання про сильні удари підйомом, зупинки м'яча, що летить, і ведення м'яча на швидкості.", "k": "Модулі: Футбол", "terms": [["Удар серединою підйому", "найсильніший удар ногою, коли м'яч б'ють верхньою частиною стопи (там, де шнурки) з відтягнутим носком."], ["Удар зовнішньою частиною підйому", "удар, при якому м'ячу надається обертання, тому він летить дугою; зручний для передач у рух і закручених ударів."], ["Зупинка грудьми", "прийом м'яча, що летить високо, на груди з одночасним відхиленням тулуба для гасіння швидкості."], ["Опорна нога", "нога, на яку гравець спирається під час удару; її положення визначає напрямок і висоту польоту м'яча."]], "th": [{"h": "Футбол. Спеціальні бігові та стрибкові вправи, розминка", "p": ["Удари сильними способами навантажують м'язи передньої та задньої поверхні стегна і пахову ділянку. Без розминки саме тут найчастіше виникають розтягнення. Спеціальні бігові вправи разом із махами ногами готують тіло до вибухових рухів."], "ul": ["Біг із високим підніманням стегна та захлестом гомілки — по 15–20 м.", "Махи прямою ногою вперед і в сторони (спершу з малою амплітудою).", "Випади з поворотом корпусу.", "Стрибки з ноги на ногу і на двох ногах уперед.", "Перші сильні удари — лише після 10–15 хвилин розминки."]}, {"h": "Футбол. Удари серединою та зовнішньою частиною підйому", "p": ["Удар серединою підйому дає найбільшу силу і використовується для ударів по воротах і довгих передач. Удар зовнішньою частиною підйому дозволяє закрутити м'яч і віддати передачу, не розвертаючи корпус."], "ul": ["Розбіг — прямолінійний для удару серединою підйому, під невеликим кутом — для удару зовнішньою частиною.", "Опорна нога поруч із м'ячем, коліно ударної ноги над м'ячем — тоді м'яч летить низько.", "Носок ударної ноги відтягнутий і напружений.", "Удар зовнішньою частиною: стопа розвернута всередину, удар у бік м'яча.", "Типові помилки: опорна нога позаду м'яча (м'яч летить вгору), удар носком замість підйому."]}, {"h": "Футбол. Зупинки м'яча, що летить, і ведення на швидкості", "p": ["Високий м'яч найзручніше приймати грудьми чи стегном: ці поверхні великі й м'які. Головне — вчасно «піддатися» назустріч м'ячу, щоб він не відскочив. Після зупинки м'яч одразу переводять у ведення."], "ul": ["Зупинка грудьми: руки розведені, у момент дотику груди відводяться назад, м'яч падає до ніг.", "Зупинка стегном: стегно піднімається назустріч м'ячу і в момент дотику опускається.", "Ведення на швидкості — зовнішньою частиною підйому, м'яч на відстані 1–2 кроків.", "Голова піднята, м'яч контролюємо периферійним зором.", "Типова помилка: напружене тіло під час зупинки — м'яч відскакує далеко."]}], "f": "Стандартний футбольний м'яч п'ятого розміру має окружність 68–70 см і масу 410–450 г.", "pr": ["Виконайте вдома 3 підходи по 10 махів кожною ногою вперед і в сторони, тримаючись за стілець, та по 10 випадів на кожну ногу.", "Порівняйте письмово удари внутрішньою стороною стопи, серединою та зовнішньою частиною підйому за силою, точністю та ситуаціями застосування (можна у вигляді таблиці)."], "q": ["Від чого залежить висота польоту м'яча після удару підйомом?", "Коли доцільно бити зовнішньою частиною підйому?", "Як правильно зупиняти м'яч грудьми?", "Чому перед сильними ударами обов'язкова розминка?"]}, {"n": "58", "t": "Організація швидкого та поступового нападу. Оборона проти різних видів нападу", "g": "Учень зрозуміє, чим відрізняються швидкий і поступовий напад, як їх організувати і як команда має захищатися проти кожного з них.", "k": "Модулі: Футбол", "terms": [["Швидкий напад (контратака)", "атака, яку команда проводить одразу після відбору м'яча, малою кількістю передач, поки суперник не встиг організувати оборону."], ["Поступовий (позиційний) напад", "атака з тривалим контролем м'яча, у якій команда передачами розхитує організовану оборону суперника й шукає вільний простір."], ["Зонний захист", "спосіб оборони, коли кожен гравець відповідає за свою ділянку поля, а не за конкретного суперника."], ["Пресинг", "активний тиск на суперника з м'ячем, щоб змусити його помилитися й швидко повернути м'яч."]], "th": [{"h": "Футбол. Швидкий напад", "p": ["Найкращий момент для атаки — перші секунди після відбору м'яча, коли суперник ще перебуває в атакувальних позиціях. Швидкий напад будується на точних передачах уперед, ривках у вільні зони та швидкому ухваленні рішень."], "ul": ["Перша передача після відбору — вперед, у вільного партнера.", "Нападники одразу роблять ривки за спини захисників, не потрапляючи в офсайд.", "Мінімум торкань — максимум швидкості.", "Атаку завершують ударом, поки оборона не повернулася.", "Помилка: зайве ведення, через яке суперник встигає відійти назад."]}, {"h": "Футбол. Поступовий напад", "p": ["Якщо суперник встиг вибудувати оборону, команда переходить до позиційного нападу. Мета — передачами переміщати м'яч з одного флангу на інший, створювати чисельну перевагу на окремих ділянках і знаходити проміжки між захисниками."], "ul": ["Займайте позиції по всій ширині поля, щоб розтягнути оборону.", "Постійно відкривайтеся — у власника м'яча має бути 2–3 варіанти передачі.", "Терпляче утримуйте м'яч, не ризикуйте втратою в центрі поля.", "Коли з'являється простір — різке прискорення атаки.", "Помилка: передачі «поперек» без руху гравців, що робить атаку передбачуваною."]}, {"h": "Футбол. Оборона проти швидкого та поступового нападу", "p": ["Проти швидкого нападу головне — швидко повернутися за лінію м'яча і затримати атаку. Проти поступового — зберігати компактність, закривати центр і не дозволяти суперникові передач між лініями."], "ul": ["Після втрати найближчий гравець одразу тисне на суперника з м'ячем, решта — відходять назад.", "Тактичний відхід: краще затримати атаку, ніж ризиковано відбирати м'яч.", "Проти позиційного нападу лінії оборони і півзахисту тримаються близько одна до одної.", "Захисники підстраховують одне одного й постійно спілкуються.", "Не порушуйте правил, щоб зупинити атаку, — це картки та штрафні удари біля воріт."]}], "f": "", "pr": ["Намалюйте схему швидкого нападу після відбору м'яча у своєму штрафному майданчику: позначте гравців, напрямки передач і ривків (3–4 передачі до удару).", "Напишіть 5–6 речень про те, чим оборона проти швидкого нападу відрізняється від оборони проти поступового."], "q": ["Коли команді вигідно проводити швидкий напад?", "Як створити простір у позиційному нападі?", "Що таке зонний захист?", "Як мають діяти гравці одразу після втрати м'яча?"]}, {"n": "59", "t": "Фінти «ударом», «зупинкою» та корпусом. Відбирання м'яча в підкаті збоку", "g": "Учень розширить арсенал фінтів, зрозуміє техніку підкату збоку та систему дисциплінарних покарань за небезпечний відбір.", "k": "Модулі: Футбол", "terms": [["Фінт корпусом", "обманний рух тулубом і плечима в один бік без торкання м'яча з наступним виходом у протилежний бік."], ["Фінт «зупинкою»", "обманний рух, коли гравець під час ведення різко сповільнюється чи зупиняє м'яч, а потім знову прискорюється."], ["Підкат збоку", "відбирання м'яча, коли захисник підкочується до суперника збоку й вибиває м'яч дальньою від суперника ногою."], ["Жовта картка", "попередження гравцеві за неспортивну поведінку чи грубе порушення; друга жовта в матчі означає вилучення."]], "th": [{"h": "Футбол. Розминка і спеціальні вправи перед роботою над фінтами", "p": ["Фінти вимагають різких змін напрямку, тому значне навантаження отримують гомілкостопи і коліна. Спеціальні бігові вправи зі зміною напрямку та стрибки вбік готують суглоби й покращують швидкість реакції."], "ul": ["Човниковий біг із торканням лінії рукою.", "Біг «змійкою» між фішками без м'яча, потім із м'ячем.", "Стрибки вбік через лінію на двох і на одній нозі.", "Різка зупинка й старт за сигналом.", "Під час змін напрямку тримайте коліна злегка зігнутими, не «завалюйте» їх усередину."]}, {"h": "Футбол. Фінти «ударом», «зупинкою» та корпусом", "p": ["Фінти діють на звичні реакції захисника: він намагається заблокувати удар, зупиняється разом із суперником або зміщується за рухом його корпусу. Гравцеві треба лише вчасно скористатися цією реакцією."], "ul": ["Фінт «ударом»: замах для удару, захисник ставить ногу на блок — м'яч переводять повз нього.", "Фінт «зупинкою»: різке сповільнення, захисник теж зупиняється — ривок уперед.", "Фінт корпусом: нахил плечей і крок в один бік, вихід із м'ячем в інший.", "Різноманітність — головне: не повторюйте той самий фінт проти одного суперника.", "Типові помилки: дивитися лише на м'яч, повільний вихід після фінта."]}, {"h": "Футбол. Підкат збоку та суддівство відбору", "p": ["Підкат збоку дозволяє дістати м'яч, коли суперник уже обігрує захисника. Дуже важливо грати в м'яч дальньою ногою, щоб не зачепити ноги суперника. Суддя оцінює не результат, а характер відбору: обережність, швидкість, силу."], "ul": ["Підкочуйтеся з боку, ковзаючи на стегні ближньої до суперника ноги.", "Вибивайте м'яч дальньою ногою носком або підйомом.", "Необережний підкат — штрафний удар; безрозсудний — жовта картка.", "Підкат із надмірною силою, що загрожує здоров'ю, — червона картка.", "Відпрацьовуйте підкат лише на м'якому покритті, у щитках і довгому одязі."]}], "f": "Жовті й червоні картки вперше використали на чемпіонаті світу 1970 року, щоб гравці й глядачі однаково розуміли рішення судді.", "pr": ["Виконайте вдома вправи на рівновагу: стійка на одній нозі по 30 секунд на кожну ногу із заплющеними очима (3 підходи), тримаючись поруч зі стіною для страховки.", "Опишіть письмово три фінти, які ви вивчили, і для кожного вкажіть, на яку реакцію захисника він розрахований."], "q": ["Чим фінт корпусом відрізняється від фінта «ударом»?", "Чому після фінта потрібне різке прискорення?", "Якою ногою виконують підкат збоку і чому?", "За які підкати суддя показує жовту, а за які — червону картку?"]}, {"n": "60", "t": "Удари головою в стрибку та з поворотом. Боротьба за верхові м'ячі", "g": "Учень дізнається техніку ударів головою в стрибку з поштовхом однією та двома ногами, удари з поворотом і правила боротьби за верхові м'ячі.", "k": "Модулі: Футбол", "terms": [["Верхова боротьба", "суперництво гравців за високий м'яч, у якому перемагає той, хто краще розрахував стрибок і зайняв позицію."], ["Удар головою з поворотом", "удар, коли гравець змінює напрямок польоту м'яча, повертаючи тулуб і голову в бік передачі."], ["Поштовх однією ногою", "стрибок із розбігу, який дає змогу вистрибнути вище та використати швидкість."], ["Розрахунок стрибка", "уміння визначити момент відштовхування так, щоб опинитися в найвищій точці саме тоді, коли прилітає м'яч."]], "th": [{"h": "Футбол. Стрибкові вправи й безпека у верховій боротьбі", "p": ["Удари в стрибку потребують сильних ніг і правильного приземлення. Стрибкові вправи розвивають вибухову силу, а також учать м'якого приземлення, що береже коліна і гомілкостопи. У верховій боротьбі можливі зіткнення головами, тому важливо стежити за суперником і не виставляти лікті."], "ul": ["Стрибки вгору з місця з махом руками, стрибки з розбігу з поштовхом однією ногою.", "Приземлення на обидві ноги з напівприсіданням.", "Руки в стрибку — для рівноваги, а не для удару суперника ліктем.", "Удар ліктем у боротьбі — грубе порушення.", "Не стрибайте на суперника ззаду і не спирайтеся на нього руками."]}, {"h": "Футбол. Удари головою в стрибку", "p": ["У стрибку прогин тулуба виконують у повітрі, а удар — у найвищій точці. Поштовх двома ногами використовують, коли м'яч падає майже на гравця; поштовх однією ногою — з розбігу, коли треба вистрибнути вище за суперника."], "ul": ["Розрахуйте траєкторію м'яча й почніть стрибок трохи раніше за суперника.", "У стрибку прогніться, підборіддя притиснуте.", "Удар у найвищій точці різким рухом тулуба вперед.", "Приземлюйтеся м'яко і будьте готові до продовження гри.", "Типова помилка: стрибок запізно — м'яч падає на маківку."]}, {"h": "Футбол. Удар головою з поворотом", "p": ["Удар із поворотом дозволяє змінити напрямок м'яча: віддати передачу вбік або спрямувати м'яч у кут воріт. Сила тут менша, ніж при прямому ударі, але точність важливіша."], "ul": ["Корпус повертається в бік, куди треба направити м'яч, ще до дотику.", "М'яч приймаємо серединою лоба, а не скронею.", "Що гостріший кут повороту, то менша сила удару.", "Для передачі головою достатньо м'якого дотику.", "Помилка: поворот лише головою без участі тулуба."]}], "f": "", "pr": ["Виконайте 3 підходи по 12 присідань і 3 підходи по 10 підйомів на носки — для зміцнення м'язів, які працюють під час стрибка (без стрибків удома).", "Опишіть, як ви визначатимете момент відштовхування для удару головою, якщо м'яч летить навісом із флангу."], "q": ["Коли краще відштовхуватися двома ногами, а коли — однією?", "У який момент стрибка треба бити по м'ячу?", "Як виконують удар головою з поворотом?", "Які дії у верховій боротьбі є порушенням правил?"]}, {"n": "61", "t": "Перший дотик: зупинки м'яча з амортизацією. Ведення та обведення суперника", "g": "Учень зрозуміє значення якісного першого дотику, принцип амортизації під час зупинок і способи ведення з обведенням суперника.", "k": "Модулі: Футбол", "terms": [["Амортизація", "відведення частини тіла назад у момент контакту з м'ячем, яке гасить його швидкість."], ["Перший дотик", "перше торкання м'яча після передачі, від якого залежить, чи встигне гравець виконати наступну дію."], ["Обведення", "ведення м'яча з обігруванням суперника за допомогою фінтів, зміни напрямку та швидкості."], ["Сканування поля", "короткі погляди навколо перед отриманням м'яча, щоб заздалегідь знати розташування партнерів і суперників."]], "th": [{"h": "Футбол. Спеціальні вправи та контроль навантаження", "p": ["Для старшокласника важливо не лише виконувати вправи, а й контролювати навантаження. Найпростіший спосіб — частота серцевих скорочень (ЧСС): у розминці вона помірна, під час ривків і гри зростає, після вправи має відновлюватися за кілька хвилин."], "ul": ["Пульс рахують на зап'ясті або шиї за 10 секунд і множать на 6.", "Розминка — поступове підвищення інтенсивності, без різких ривків на початку.", "Між інтенсивними вправами — паузи для відновлення дихання.", "Якщо пульс довго не відновлюється — зменшіть навантаження.", "Спеціальні бігові вправи виконуйте технічно, а не на максимальній швидкості."]}, {"h": "Футбол. Зупинки м'яча з амортизацією", "p": ["Хороший перший дотик не просто зупиняє м'яч, а одразу переводить його в зручне положення для передачі, удару чи ведення. Секрет — у м'якості: частина тіла, що приймає м'яч, рухається йому назустріч і в момент дотику відходить назад."], "ul": ["Зупинка внутрішньою стороною стопи з переведенням м'яча вбік від суперника.", "Зупинка підошвою — для м'яча, що котиться прямо на гравця.", "Зупинка стегном і грудьми — для високих м'ячів.", "Перед прийомом озирніться, щоб знати, куди «відпустити» м'яч першим дотиком.", "Типова помилка: зупинка на «жорсткій» нозі — м'яч відскакує."]}, {"h": "Футбол. Ведення м'яча й обведення суперника", "p": ["Ведення стає ефективним, коли гравець уміє змінювати швидкість і напрямок. Обведення — це поєднання ведення з фінтами: мета не просто пройти суперника, а створити перевагу для атаки."], "ul": ["Ведіть м'яч ногою, дальньою від суперника, закриваючи його корпусом.", "Змінюйте темп: повільно — і різке прискорення.", "Обводьте у вільний бік, туди, де є простір.", "Не обводьте в зоні перед власними воротами — там ризик втрати надто великий.", "Обведення має сенс, якщо немає кращого варіанту передачі."]}], "f": "", "pr": ["Порахуйте свій пульс у спокої (за 10 с × 6), потім після 20 присідань і через 2 хвилини відпочинку. Запишіть результати й зробіть висновок про відновлення.", "Опишіть письмово, що таке сканування поля і як воно допомагає зробити якісний перший дотик."], "q": ["Що таке амортизація під час зупинки м'яча?", "Чому перший дотик такий важливий?", "Як правильно рахувати пульс і для чого це потрібно?", "У яких зонах поля обведення доцільне, а в яких — ризиковане?"]}, {"n": "62", "t": "Воротар: кидок знизу, вибивання з півльоту, відбивання кулаком на виходах", "g": "Учень дізнається додаткові способи введення м'яча воротарем і техніку гри на виходах під час навісів.", "k": "Модулі: Футбол", "terms": [["Кидок м'яча знизу", "введення м'яча воротарем, коли м'яч котиться по землі до партнера; найлегший для прийому спосіб."], ["Вибивання з півльоту", "удар воротаря по м'ячу, випущеному з рук, одразу після його відскоку від землі; м'яч летить нижче й швидше, ніж при вибиванні з льоту."], ["Відбивання кулаком", "прийом воротаря на виходах, коли впіймати м'яч надійно неможливо, і він вибиває його одним або двома кулаками якомога далі."], ["Удар від воріт", "поновлення гри, коли м'яч після дотику гравця атаки перетнув лінію воріт поза ворітьми; б'ють із воротарського майданчика."]], "th": [{"h": "Футбол. Спеціальні вправи воротаря та безпека", "p": ["Воротарю потрібні швидка реакція, стрибучість і вміння безпечно падати. Тому до загальних спеціальних бігових і стрибкових вправ додають кидки-ловлі, стрибки вбік і вправи на реакцію."], "ul": ["Стрибки вбік приставними кроками, стрибки вгору з місця з витягнутими руками.", "Ловля м'яча, який партнер кидає з різних сторін.", "Падіння на бік із перекату, без опори на випрямлену руку.", "Розминка пальців і кистей перед ловлею.", "На виходах — підняте коліно захищає від зіткнення."]}, {"h": "Футбол. Кидок знизу та вибивання з півльоту", "p": ["Кидок знизу — найточніший спосіб віддати м'яч найближчому захисникові, щоб почати атаку з короткої передачі. Вибивання з півльоту дає низьку швидку траєкторію, яку легше прийняти партнерові, ніж високий м'яч."], "ul": ["Кидок знизу: крок уперед, нахил, м'яч відпускають біля землі, щоб він не підскакував.", "Вибивання з півльоту: м'яч падає перед ударною ногою, удар одразу після відскоку.", "Корпус над м'ячем — так траєкторія не буде надто високою.", "Обирайте спосіб залежно від того, де вільний партнер.", "Помилка: передача по центру перед своїми воротами під тиском суперника."]}, {"h": "Футбол. Гра на виходах: ловля та відбивання кулаком", "p": ["Під час подачі з флангу чи кутового воротар оцінює траєкторію і вирішує: ловити чи відбивати. Ловити краще, якщо поруч немає суперників і м'яч досяжний. Якщо навколо щільно — надійніше відбити кулаком."], "ul": ["Займіть позицію в центрі воріт, трохи ближче до дальньої штанги.", "Голосно кричіть «Воротар!» перед виходом.", "Відбиваючи двома кулаками, спрямовуйте м'яч назад, звідки він прилетів; одним — у бік від воріт.", "Відбивайте м'яч високо й далеко, а не в центр штрафного.", "Після відбивання одразу повертайтеся у ворота."]}], "f": "", "pr": ["Опишіть письмово алгоритм дій воротаря під час кутового: позиція, оцінка траєкторії, рішення «ловити чи відбивати», команда партнерам.", "Виконайте вправу для пальців і кистей: 3 підходи по 15 стискань м'ячика або згорнутого рушника кожною рукою."], "q": ["Коли доцільно вводити м'яч кидком знизу?", "Чим вибивання з півльоту відрізняється від вибивання з льоту?", "У яких ситуаціях воротар відбиває м'яч кулаком?", "Як воротар має попереджати партнерів про вихід?"]}, {"n": "63", "t": "Організація нападу: ширина атаки, передача «в стінку». Страхування в обороні", "g": "Учень зрозуміє, як групові взаємодії допомагають швидкому й поступовому нападу та як оборона страхує й використовує офсайдну пастку.", "k": "Модулі: Футбол", "terms": [["Передача «в стінку»", "комбінація двох гравців: один віддає м'яч партнерові й одразу біжить уперед, а партнер першим дотиком повертає м'яч йому на хід."], ["Ширина атаки", "розташування нападників і крайніх гравців біля бічних ліній, що змушує оборону розтягуватися і створює проміжки в центрі."], ["Страхування", "позиція захисника позаду й трохи збоку від партнера, який атакує суперника з м'ячем, на випадок, якщо того обіграють."], ["Офсайдна пастка", "синхронний вихід лінії захисників уперед, щоб залишити нападника суперника в положенні поза грою."]], "th": [{"h": "Футбол. Групові взаємодії у швидкому нападі", "p": ["Швидкий напад найкраще проходить через прості комбінації двох-трьох гравців. Передача «в стінку» дозволяє обійти захисника без обведення, а схрещування гравців збиває оборону з її позицій."], "ul": ["«Стінка»: пас партнерові — ривок за спину захисника — повернення м'яча в одне торкання.", "Схрещування: два нападники міняються місцями, захисники мусять вирішувати, кого опікати.", "Пас на вільне місце, куди партнер вибігає, а не в ноги.", "Чисельна перевага (2 проти 1) — найкращий момент для атаки.", "Помилка: зупинка після передачі замість руху вперед."]}, {"h": "Футбол. Ширина і глибина у поступовому нападі", "p": ["У позиційній атаці команда займає всю ширину поля та має гравців на різній глибині. Тоді в оборони не вистачає людей, щоб закрити все, і з'являються проміжки для передач."], "ul": ["Крайні гравці тримаються біля бічних ліній.", "Хтось із нападників іде в глибину, погрожуючи забігом за спини.", "Перевід м'яча з флангу на фланг змушує оборону зміщуватися.", "Атака флангом закінчується навісом або передачею назад у центр.", "Пам'ятайте про страхування позаду на випадок втрати м'яча."]}, {"h": "Футбол. Оборона: страхування та офсайдна пастка", "p": ["Добра оборона — це не окремі захисники, а злагоджена лінія. Один гравець атакує власника м'яча, інші страхують і закривають партнерів суперника. Офсайдна пастка ефективна, але ризикована: якщо хтось із захисників запізниться, нападник вийде сам на сам."], "ul": ["Перший захисник тисне, другий страхує на відстані кількох метрів позаду.", "Лінія оборони рухається синхронно за командою одного гравця.", "Офсайдну пастку застосовують лише тоді, коли лінія добре зіграна.", "Захисники стежать і за м'ячем, і за суперником.", "Постійне спілкування: «Тримаю!», «Страхую!», «Вийшли!»."]}], "f": "", "pr": ["Намалюйте схему передачі «в стінку» та схрещування нападників зі стрілками руху гравців і м'яча.", "Напишіть, які переваги й ризики має офсайдна пастка (по 3 пункти)."], "q": ["Як виконується передача «в стінку»?", "Навіщо в атаці використовувати всю ширину поля?", "Що означає страхування в обороні?", "Чому офсайдна пастка ризикована?"]}, {"n": "64", "t": "Фінт «переступ». Силова боротьба та перехоплення. Підкат як крайній засіб відбору", "g": "Учень опанує теорію фінта «переступ», дозволеної силової боротьби, перехоплення м'яча та правильного вибору моменту для підкату.", "k": "Модулі: Футбол", "terms": [["Переступ", "фінт, під час якого гравець переносить ногу над м'ячем, імітуючи рух в один бік, і виводить м'яч в інший."], ["Перехоплення", "відбирання м'яча під час передачі суперника завдяки правильному вибору позиції та передбаченню."], ["Силова боротьба", "дозволений правилами контакт плечем у плече з суперником у боротьбі за м'яч, коли м'яч у межах досяжності."], ["Дистанція відбору", "відстань до суперника з м'ячем, з якої захисник може атакувати м'яч і водночас не дати себе легко обіграти."]], "th": [{"h": "Футбол. Фінт «переступ»", "p": ["Переступ — один із найпопулярніших фінтів: нога проходить над м'ячем, і захисник реагує на цей рух. Після цього гравець іншою ногою виводить м'яч у протилежний бік і прискорюється."], "ul": ["Виконуйте переступ на ходу, а не з місця.", "Нога рухається над м'ячем зсередини назовні, корпус нахиляється в той самий бік.", "Виведення м'яча — зовнішньою частиною стопи іншої ноги.", "Можна виконати подвійний переступ, але не перестарайтеся.", "Помилка: переступ занадто далеко від суперника — він не реагує."]}, {"h": "Футбол. Силова боротьба та перехоплення", "p": ["Не кожен відбір закінчується підкатом. Найкращі захисники відбирають м'яч перехопленням: вони передбачають передачу й першими опиняються на траєкторії м'яча. Дозволена силова боротьба — це контакт плечем, коли обидва гравці борються за м'яч."], "ul": ["Займайте позицію між суперником і своїми воротами.", "Стежте за поглядом і корпусом суперника — вони підказують напрямок передачі.", "Силова боротьба: плече в плече, руки притиснуті, м'яч поруч.", "Поштовх руками, у спину чи стрибок на суперника — порушення.", "Тримайте дистанцію відбору: не підходьте впритул, щоб вас не обвели одним рухом."]}, {"h": "Футбол. Підкат: коли він виправданий", "p": ["Підкат — ризикований прийом: після нього захисник лежить на землі й на кілька секунд вибуває з гри. Тому підкатуються лише тоді, коли інших способів відібрати м'яч немає, а суперник відпустив м'яч від себе."], "ul": ["Не підкатуйтеся у своєму штрафному майданчику без крайньої потреби — ризик пенальті.", "Підкат доречний, коли суперник веде м'яч до порожніх воріт або виходить сам на сам.", "Атакуйте м'яч, а не ноги суперника.", "Виконуйте підкат на рівному покритті, у щитках.", "Швидко вставайте після підкату й повертайтеся в гру."]}], "f": "", "pr": ["Виконайте імітацію переступу без м'яча на місці: 3 підходи по 10 повторень кожною ногою, рухи повільні й технічні.", "Поясніть письмово різницю між дозволеною силовою боротьбою та порушенням правил, навівши по 2 приклади."], "q": ["Як виконується фінт «переступ»?", "Що таке перехоплення і чому воно безпечніше за підкат?", "Яка силова боротьба дозволена правилами?", "Коли підкат виправданий?"]}, {"n": "65", "t": "Удари по м'ячу, що летить: з льоту й напівльоту. Удар п'ятою, різаний удар. Зупинки та ведення", "g": "Учень дізнається техніку ударів по м'ячу, що летить, різаних ударів і удару п'ятою, а також повторить зупинки й ведення.", "k": "Модулі: Футбол", "terms": [["Удар з льоту", "удар по м'ячу, що летить, до того як він торкнувся землі."], ["Удар з напівльоту", "удар по м'ячу в момент, коли він щойно відскочив від землі."], ["Удар п'ятою", "удар назад п'ятою, яким передають м'яч партнерові позаду, не розвертаючись."], ["Різаний удар", "удар збоку від центру м'яча, після якого м'яч обертається й летить дугою."]], "th": [{"h": "Футбол. Удари з льоту й напівльоту", "p": ["Удари по м'ячу, що летить, найскладніші: потрібно точно розрахувати момент контакту. Перевага — швидкість, адже гравець не витрачає час на зупинку. Удар із напівльоту зазвичай точніший, бо момент відскоку легше передбачити."], "ul": ["Стежте за м'ячем до моменту удару.", "Опорна нога ставиться так, щоб ударна була над м'ячем, — тоді удар не піде вгору.", "Удар серединою підйому з відтягнутим носком.", "Сила — не головне, головне — чистий контакт.", "Помилка: поспіх і удар нижньою частиною м'яча, через що він летить над ворітьми."]}, {"h": "Футбол. Різаний удар і удар п'ятою", "p": ["Різаний удар допомагає обійти стінку на штрафному чи закрутити м'яч у дальній кут. Удар п'ятою — несподіваний засіб передачі назад партнерові, коли розвернутися немає часу."], "ul": ["Різаний удар внутрішньою стороною стопи: удар у бік м'яча, нога проходить «навколо» нього.", "Що далі від центру удар, то сильніше обертання й менше сила.", "Удар п'ятою: крок за м'яч і короткий удар назад.", "Перед ударом п'ятою переконайтеся, що позаду партнер, а не суперник.", "Не зловживайте ефектними ударами там, де простий пас надійніший."]}, {"h": "Футбол. Зупинки м'яча, що летить, і ведення", "p": ["Якщо ситуація не дозволяє бити з льоту, м'яч спершу зупиняють. Високий м'яч гасять стегном, грудьми або підйомом, низький, що відскакує, — підошвою чи внутрішньою стороною стопи."], "ul": ["Зупинка підйомом: стопа піднімається назустріч м'ячу й опускається разом із ним.", "Зупинка підошвою м'яча, що відскакує: накривання м'яча в момент відскоку.", "Після зупинки — одразу ведення у вільну зону.", "Ведіть м'яч обома ногами.", "Помилка: дивитися лише вниз під час ведення."]}], "f": "Точка пенальті розташована на відстані 11 метрів від лінії воріт, а самі ворота мають ширину 7,32 м і висоту 2,44 м.", "pr": ["Намалюйте траєкторію різаного удару зі штрафного через «стінку» та позначте, у яку частину м'яча треба бити.", "Виконайте вправу на рівновагу та координацію: стоячи на одній нозі, повільно виконуйте махи другою вперед-назад (2 підходи по 10 на кожну ногу, біля стіни для страховки)."], "q": ["Чим удар з льоту відрізняється від удару з напівльоту?", "Чому під час удару по м'ячу, що летить, ударна нога має бути над м'ячем?", "Як виконується різаний удар?", "У якій ситуації доречний удар п'ятою?"]}, {"n": "66", "t": "Удари головою в обороні та нападі. Скидка головою", "g": "Учень зрозуміє, чим різняться завдання й техніка ударів головою в захисті та нападі, і як виконувати скидку головою партнерові.", "k": "Модулі: Футбол", "terms": [["Скидка головою", "м'яка передача головою партнерові, часто назад або вбік, після довгої передачі чи вибивання."], ["Удар головою вниз", "удар у нападі, коли м'яч спрямовують у землю перед воротарем, щоб ускладнити йому відбивання."], ["Відбій головою", "удар захисника головою, завдання якого — відправити м'яч якомога вище й далі від своїх воріт."], ["Підбір", "боротьба за м'яч, який відскочив після удару, відбиття чи верхової боротьби."]], "th": [{"h": "Футбол. Удари головою в обороні", "p": ["Захисник, вибиваючи м'яч головою, думає про безпеку: м'яч має полетіти високо, далеко і бажано на фланг, а не в центр, де його підбере суперник. Тому захисник б'є нижньою частиною лоба під м'яч."], "ul": ["Б'ючи, дивіться трохи вгору — так м'яч піде високо.", "Спрямовуйте м'яч у бік, подалі від центру штрафного.", "Якщо є можливість — відбивайте на партнера.", "Боріться за кожен верховий м'яч: пропущений удар перед воротами небезпечний.", "Помилка: м'який удар, після якого м'яч падає на голову суперникові."]}, {"h": "Футбол. Удари головою в нападі", "p": ["Нападник, на відміну від захисника, має направити м'яч у ворота, найчастіше вниз. М'яч, що відскакує від землі, воротарю важче впіймати. Тут важливі вибір позиції та ривок до м'яча."], "ul": ["Вибігайте на подачу з руху, а не чекайте на місці.", "Б'ючи вниз, зустрічайте м'яч верхньою частиною лоба, тулуб іде вперед і вниз.", "Цільтеся в кути воріт, подалі від воротаря.", "Не стрибайте на воротаря й не штовхайте захисників.", "Помилка: удар над ворітьми через відкинуту назад голову."]}, {"h": "Футбол. Скидка головою і боротьба за підбір", "p": ["Скидка — командний прийом: високий нападник скидає м'яч головою партнерові, який набігає. Після будь-якої верхової боротьби м'яч може відскочити, тож решта гравців мають бути готові до підбору."], "ul": ["Для скидки досить легкого дотику, м'яч не б'ють сильно.", "Партнер, що чекає скидки, займає позицію поруч, а не за спиною суперника.", "Підбір виграє той, хто першим реагує на відскок.", "Півзахисники тримають позиції навколо зони боротьби.", "Спілкуйтеся: кричіть, хто йде на м'яч, а хто страхує."]}], "f": "", "pr": ["Складіть таблицю «Удар головою в обороні / в нападі» з порівнянням мети, частини лоба, напрямку та типових помилок.", "Виконайте вправи для м'язів шиї без обтяжень: легкий тиск долонею на лоб, потилицю та скроні по 10 секунд, голова не рухається (2 підходи)."], "q": ["Куди має полетіти м'яч після удару головою захисника?", "Чому нападники часто б'ють головою вниз?", "Що таке скидка головою і коли її використовують?", "Як гравці мають діяти в боротьбі за підбір?"]}, {"n": "67", "t": "Воротар: вибір позиції, гра один на один, швидке введення м'яча в гру", "g": "Учень зрозуміє, як воротар обирає позицію, діє в ситуації один на один та вводить м'яч для швидкої атаки відповідно до правил.", "k": "Модулі: Футбол", "terms": [["Скорочення кута", "вихід воротаря назустріч нападникові, через який зменшується видима нападнику частина воріт."], ["Правило шести секунд", "норма, за якою воротар може контролювати м'яч руками не довше шести секунд, інакше призначається вільний удар."], ["Пас назад воротареві", "навмисна передача ногою від партнера, після якої воротар не має права брати м'яч у руки."], ["Введення м'яча в гру", "дії воротаря після захоплення м'яча, якими він передає його партнерам руками чи ногою."]], "th": [{"h": "Футбол. Вибір позиції у воротах", "p": ["Правильна позиція — половина успіху воротаря. Він стоїть на уявній лінії, що з'єднує м'яч із центром воріт, і зміщується разом із м'ячем. Що ближче м'яч до воріт, то активніше воротар має виходити вперед."], "ul": ["Основна стійка: ноги на ширині плечей, коліна зігнуті, вага на передній частині стоп, руки перед собою.", "Пересування — приставними кроками, без схрещування ніг.", "Під час удару з флангу — ближче до ближньої штанги.", "Не стійте завжди на лінії воріт: виходьте, коли м'яч на підході до штрафного.", "Перед ударом суперника — зупиніться й будьте врівноважені."]}, {"h": "Футбол. Гра один на один", "p": ["Коли нападник виходить сам на сам, воротар скорочує кут і намагається якомога довше не падати першим. Нападник часто чекає, коли воротар ляже, щоб перекинути м'яч або обійти його."], "ul": ["Виходьте швидко, поки нападник веде м'яч і дивиться вниз.", "Поблизу нападника сповільніться і прийміть низьку стійку.", "Руки трохи розведені, щоб закрити більше простору.", "Кидайтеся під м'яч лише тоді, коли нападник далеко його відпустив.", "Не збивайте нападника — це пенальті і, можливо, червона картка."]}, {"h": "Футбол. Швидке введення м'яча в гру за правилами", "p": ["Впіймавши м'яч, воротар може за кілька секунд почати контратаку. Проте правила обмежують його: не більше шести секунд із м'ячем у руках і заборона брати в руки навмисний пас назад ногою від партнера."], "ul": ["Озирніться одразу після захоплення м'яча — де вільний партнер?", "Для швидкої атаки — кидок рукою на фланг чи у центр поля.", "Пас назад від партнера ногою — грайте ногами, а не руками.", "Не тримайте м'яч у руках довго, щоб не отримати вільний удар.", "Помилка: вибивання навмання, коли поруч є вільний партнер."]}], "f": "", "pr": ["Намалюйте схему воріт і три позиції м'яча (центр, правий фланг, лівий фланг) та позначте, де в кожному випадку має стояти воротар.", "Виконайте 3 підходи по 30 секунд утримання основної стійки воротаря (напівприсід, руки перед собою), відпочинок 30 секунд між підходами."], "q": ["Як воротар визначає свою позицію у воротах?", "Що означає «скоротити кут»?", "Які помилки воротаря в грі один на один призводять до голу або пенальті?", "Які правила обмежують воротаря під час введення м'яча в гру?"]}, {"n": "68", "t": "Тактика нападу й оборони: схеми гри, компактність, переходи між фазами", "g": "Учень дізнається, як розстановка команди впливає на швидкий і поступовий напад, і як оборона зберігає компактність та реагує на втрату м'яча.", "k": "Модулі: Футбол", "terms": [["Схема гри", "розташування гравців на полі за лініями, яке позначають цифрами від оборони до нападу, наприклад 4-4-2 або 4-3-3."], ["Компактність", "невеликі відстані між гравцями й лініями команди в обороні, що залишає суперникові мало вільного простору."], ["Контрпресинг", "миттєвий тиск кількох гравців на суперника одразу після втрати м'яча, щоб негайно його повернути."], ["Розтягування оборони", "дії нападників, які змушують захисників розходитися по ширині й глибині поля, щоб утворилися проміжки."]], "th": [{"h": "Футбол. Схеми гри та їх вплив на напад", "p": ["Схема показує стартове розташування гравців, але в грі вони постійно змінюють позиції. Наприклад, у схемі 4-3-3 команда має трьох нападників і легше атакує широко, а в 4-4-2 два нападники можуть грати в парі. Схема — це основа, а гра залежить від взаємодії гравців."], "ul": ["Перша цифра — захисники, остання — нападники; воротар не враховується.", "Більше гравців у нападі — більше варіантів атаки, але більший ризик у обороні.", "Для швидкого нападу важливі швидкі крайні гравці.", "Для поступового нападу — півзахисники, які добре утримують м'яч.", "Схему змінюють залежно від суперника й рахунку."]}, {"h": "Футбол. Переходи з оборони в напад і навпаки", "p": ["Найнебезпечніші моменти в матчі — переходи, коли м'яч змінює власника. Команда, яка швидше перебудувалася, отримує перевагу. Тому в сучасному футболі тренують не лише атаку й захист, а й ці перехідні моменти."], "ul": ["Після відбору — швидкий погляд уперед: чи можна атакувати одразу.", "Якщо швидкої атаки не виходить — утримуйте м'яч і переходьте до поступового нападу.", "Після втрати — контрпресинг протягом кількох секунд найближчими гравцями.", "Якщо відібрати не вдалося — швидкий відхід і перебудова оборони.", "Помилка: гравці зупиняються й «переживають» втрату."]}, {"h": "Футбол. Компактна оборона проти різних видів нападу", "p": ["Компактна команда схожа на гармошку, що зміщується за м'ячем: лінії тримаються близько, гравці страхують одне одного. Проти швидкого нападу важливо швидко повернутися, проти поступового — не розриватися і не залишати простору між лініями."], "ul": ["Відстань між лініями оборони й півзахисту — невелика.", "Уся команда зміщується в бік м'яча.", "Дальній від м'яча фланг частково залишається вільним — це допустимо.", "Захисники тримають лінію, щоб використовувати правило офсайду.", "Не вибігайте поодинці відбирати м'яч — це розриває оборону."]}], "f": "", "pr": ["Намалюйте на схемі поля розташування команди за схемою 4-4-2 та 4-3-3 і напишіть, яка з них, на вашу думку, краще підходить для швидкого нападу і чому.", "Опишіть письмово, що має робити кожна лінія команди (оборона, півзахист, напад) протягом перших секунд після втрати м'яча."], "q": ["Що позначають цифри в схемі гри?", "Чому перехідні моменти найнебезпечніші?", "Що таке контрпресинг?", "Як компактність допомагає обороні проти поступового нападу?"]}, {"n": "69", "t": "Фінти з обертанням і зміною темпу. Небезпечні підкати та дисциплінарні санкції", "g": "Учень дізнається техніку фінтів з обертанням навколо м'яча й зміною темпу, а також які підкати суддя карає червоною карткою.", "k": "Модулі: Футбол", "terms": [["Рулет", "фінт, під час якого гравець підошвами по черзі прокочує м'яч і обертається навколо нього, закриваючи м'яч від суперника корпусом."], ["Зміна темпу", "прийом обведення, коли гравець різко чергує повільне й швидке ведення, щоб збити суперника з ритму."], ["Підкат двома ногами", "небезпечний відбір, коли гравець летить на суперника з обома виставленими ногами; зазвичай карається вилученням."], ["Червона картка", "вилучення гравця з поля до кінця матчу без права заміни."]], "th": [{"h": "Футбол. Фінт «рулет» та обертання з м'ячем", "p": ["Рулет допомагає вийти з-під тиску суперника, який атакує спереду чи збоку. Гравець зупиняє м'яч підошвою, обертається навколо нього і другою ногою проводить м'яч далі, весь час закриваючи його корпусом."], "ul": ["Перша нога зупиняє і тягне м'яч назад підошвою.", "Під час повороту спина обертається до суперника.", "Друга нога підошвою продовжує рух м'яча.", "Після обертання — ривок у вільний простір.", "Відпрацьовуйте спочатку повільно, без суперника."]}, {"h": "Футбол. Обведення зміною темпу", "p": ["Зміна темпу — найпростіший і найефективніший спосіб обіграти захисника. Якщо гравець рухається повільно, захисник теж сповільнюється й розслаблюється. Різке прискорення в цей момент дає перевагу у кілька метрів."], "ul": ["Вводьте суперника в оману сповільненням або «підробленою» зупинкою.", "Прискорюйтеся з першого кроку, м'яч відпускайте трохи далі.", "Поєднуйте зміну темпу зі зміною напрямку.", "Спостерігайте за опорною ногою суперника — коли він переносить на неї вагу, прискорюйтеся в інший бік.", "Помилка: увесь час вести м'яч на одній швидкості."]}, {"h": "Футбол. Небезпечні підкати та суддівство", "p": ["Правила футболу захищають здоров'я гравців. Суддя карає не лише за контакт, а й за спосіб відбору. Підкат, який загрожує безпеці суперника, вважається серйозним порушенням навіть тоді, коли гравець зачепив м'яч."], "ul": ["Підкат двома ногами, ззаду або з виставленими шипами — серйозне порушення.", "Серйозне порушення правил карається червоною карткою.", "Якщо порушення зірвало явну гольову нагоду, гравця також можуть вилучити.", "Вилучений гравець не може бути замінений — команда грає в меншості.", "Чесна гра: після жорсткого зіткнення перепросіть і допоможіть суперникові підвестися."]}], "f": "", "pr": ["Виконайте повільну імітацію рулету без м'яча (рухи ніг і поворот корпусу) — 2 підходи по 8 разів у кожен бік на рівній підлозі без килима.", "Напишіть міркування (5–6 речень): чому правила суворо карають небезпечні підкати навіть тоді, коли гравець зачепив м'яч."], "q": ["Як виконується фінт «рулет»?", "Чому зміна темпу ефективна проти захисника?", "Які підкати вважаються серйозним порушенням?", "Що означає червона картка для гравця та команди?"]}, {"n": "70", "t": "Передачі на різну відстань і на хід. Захист м'яча корпусом під час ведення", "g": "Учень зрозуміє, як обирати спосіб удару для коротких, середніх і довгих передач, як віддавати передачу на хід і як закривати м'яч корпусом під час ведення.", "k": "Модулі: Футбол", "terms": [["Передача на хід", "передача у вільну зону перед партнером, щоб він отримав м'яч, не сповільнюючись."], ["Довга передача", "передача на 30 м і більше, що виконується переважно серединою або внутрішньою частиною підйому."], ["Закривання м'яча корпусом", "положення гравця між суперником і м'ячем, яке не дає суперникові дістати м'яч."], ["Слабка нога", "менш розвинена нога гравця, тренування якої робить його дії непередбачуванішими для суперника."]], "th": [{"h": "Футбол. Передачі на різну відстань", "p": ["Від дальності передачі залежить вибір способу удару. Короткі передачі виконують внутрішньою стороною стопи — це найточніше. Для середніх і довгих потрібна сила, тому б'ють підйомом. Що довша передача, то важче її прийняти, тому вона має бути особливо точною."], "ul": ["Коротка (до 10–15 м): внутрішня сторона стопи, м'яч котиться по землі.", "Середня: внутрішня частина підйому, м'яч може йти трохи над землею.", "Довга: середина або внутрішня частина підйому, удар під центр м'яча.", "Відпрацьовуйте передачі обома ногами, зокрема слабкою.", "Помилка: сильна передача на коротку відстань, яку важко прийняти."]}, {"h": "Футбол. Передача на хід", "p": ["Передача на хід потребує розрахунку: треба врахувати швидкість партнера, швидкість м'яча й позицію суперників. Добра передача на хід виводить партнера в простір без зупинки."], "ul": ["Дивіться не на партнера, а на місце, куди він біжить.", "Передача має бути такої сили, щоб партнер не сповільнювався.", "Обирайте момент, коли партнер уже стартував.", "Зважайте на положення поза грою.", "Помилка: передача в ноги партнеру, що біжить, — він втрачає швидкість."]}, {"h": "Футбол. Ведення із захистом м'яча корпусом", "p": ["Коли суперник поруч, гравець веде м'яч дальньою від нього ногою і ставить тулуб між м'ячем і суперником. Це дозволяє зберегти м'яч і дочекатися підтримки партнерів."], "ul": ["Корпус злегка нахилений, коліна зігнуті, центр ваги низько.", "Руку можна тримати для рівноваги, але не відштовхувати нею суперника.", "М'яч близько до ноги, часті короткі дотики.", "Озирайтеся, щоб бачити суперника і партнерів.", "Порушення: штовхання руками, утримування суперника."]}], "f": "", "pr": ["Виконайте 3 підходи по 20 секунд тримання стійки «захист м'яча» (напівприсід, нахил корпусу) та 3 підходи планки по 30 секунд.", "Опишіть письмово, як ви оберете спосіб передачі в трьох ситуаціях: партнер поруч, партнер за 20 м, партнер робить ривок на фланг за 35 м."], "q": ["Якими способами виконують короткі, середні й довгі передачі?", "Що таке передача на хід і що треба врахувати перед нею?", "Як правильно закривати м'яч корпусом?", "Навіщо тренувати слабку ногу?"]}, {"n": "71", "t": "Удари головою: самоконтроль, зміцнення шиї, аналіз типових помилок", "g": "Учень навчиться контролювати своє самопочуття під час відпрацювання ударів головою, знатиме вправи для зміцнення шиї та вмітиме аналізувати власні помилки.", "k": "Модулі: Футбол", "terms": [["Ізометрична вправа", "вправа, у якій м'язи напружуються без руху в суглобі, наприклад тиск долонею на лоб, коли голова залишається нерухомою."], ["Струс мозку", "травма голови, яка може проявлятися головним болем, запамороченням, нудотою, порушенням координації та потребує негайного припинення гри й огляду лікаря."], ["Удар головою в падінні", "складний удар у стрибку-падінні вперед чи вбік по низькому м'ячу, який виконують лише підготовлені гравці."], ["Аналіз помилок", "розбір власного виконання техніки, щоб знайти причину невдачі й виправити її."]], "th": [{"h": "Футбол. Самоконтроль і безпека під час ударів головою", "p": ["Старшокласник має вміти слухати своє тіло. Удари головою безпечні лише за правильної техніки і в помірній кількості. Будь-які симптоми після удару чи зіткнення — привід зупинитися: продовжувати гру з травмою голови дуже небезпечно."], "ul": ["Тривожні ознаки: головний біль, запаморочення, нудота, «туман» перед очима, сплутаність думок.", "За наявності симптомів — негайно припиніть заняття, повідомте вчителя, зверніться до лікаря.", "Не повертайтеся до тренувань без дозволу лікаря.", "Обмежуйте кількість ударів головою за одне заняття.", "Удари в падінні не відпрацьовуйте самостійно — лише під наглядом тренера на м'якому покритті."]}, {"h": "Футбол. Зміцнення м'язів шиї та тулуба", "p": ["Сильні м'язи шиї тримають голову стабільно в момент удару, а сильні м'язи тулуба передають силу від ніг. Тому до підготовки футболіста входять безпечні ізометричні вправи для шиї та вправи для спини й преса."], "ul": ["Тиск долонею на лоб, потилицю й скроні по 10 секунд — голова не рухається.", "Планка на передпліччях 30–45 секунд.", "«Човник» лежачи на животі: підйом рук і ніг, затримка 5 секунд.", "Скручування для м'язів преса.", "Без різких обертань і нахилів голови з обтяженням."]}, {"h": "Футбол. Аналіз типових помилок в ударах головою", "p": ["Більшість невдалих ударів головою пов'язані з кількома типовими помилками. Якщо знати їх причину, виправити техніку значно легше."], "ul": ["Удар маківкою — запізнілий стрибок або неправильний розрахунок траєкторії.", "Слабкий удар — працює лише шия, без руху тулуба.", "М'яч летить угору — удар нижньою частиною лоба або відкинута голова.", "Неточний удар — заплющені очі в момент контакту.", "Падіння після стрибка — приземлення на прямі ноги, без напівприсіду."]}], "f": "", "pr": ["Виконайте комплекс зміцнення шиї та тулуба: ізометричний тиск на лоб, потилицю й скроні (по 2 рази по 10 с), планка 3×30 с, «човник» 2×10 разів.", "Складіть таблицю «Помилка — причина — як виправити» щодо ударів головою (не менше 4 рядків)."], "q": ["Які ознаки можуть свідчити про травму голови і що робити в такому разі?", "Чому сильні м'язи шиї важливі для ударів головою?", "Що таке ізометрична вправа?", "Які причини того, що після удару головою м'яч летить угору?"]}, {"n": "72", "t": "Ролі гравців у швидкому й поступовому нападі та в обороні. Відкривання", "g": "Учень зрозуміє функції гравців різних позицій під час організації нападу й оборони та значення відкривання для гри без м'яча.", "k": "Модулі: Футбол", "terms": [["Опорний півзахисник", "гравець центру поля перед лінією оборони, який руйнує атаки суперника й першим починає атаку своєї команди."], ["Вінгер", "крайній нападник або півзахисник, який атакує флангом, обігрує суперника і подає в штрафний майданчик."], ["Перевантаження флангу", "зосередження кількох гравців атаки на одному фланзі, щоб створити там чисельну перевагу."], ["Відкривання", "рух гравця без м'яча у вільну зону, щоб партнер мав можливість віддати йому передачу."]], "th": [{"h": "Футбол. Ролі гравців у нападі", "p": ["У сучасному футболі атакують і захищаються всі. Проте кожна позиція має свої головні завдання. Розуміння ролей допомагає гравцеві правильно діяти як у швидкому, так і в поступовому нападі."], "ul": ["Захисники починають атаку короткою передачею або точним пасом уперед.", "Опорний півзахисник — перша опція для передачі, розподіляє м'яч.", "Атакувальні півзахисники шукають проміжки між лініями суперника.", "Вінгери розтягують оборону і подають у штрафний.", "Нападник завершує атаку та відкривається за спини захисників."]}, {"h": "Футбол. Відкривання та гра без м'яча", "p": ["Гравець перебуває з м'ячем лише невелику частину матчу. Решту часу він працює без м'яча: відкривається, тягне суперників за собою, звільняє простір для партнерів. Від якості цього руху залежить, чи зможе команда атакувати."], "ul": ["Відкривайтеся туди, куди партнер може віддати передачу без ризику.", "Рух «від — до»: спершу від м'яча, потім різко назустріч.", "Ривок за спину захисника відкриває простір для партнерів.", "Перевантаження флангу змушує оборону зміщуватися, і звільняється інший фланг.", "Голосом і жестом показуйте, куди хочете отримати м'яч."]}, {"h": "Футбол. Ролі гравців в обороні", "p": ["Оборона починається з нападників: вони перші тиснуть на суперника. Чим злагодженіше діють усі лінії, тим важче суперникові атакувати — і швидко, і поступово."], "ul": ["Нападники заважають суперникові спокійно почати атаку.", "Півзахисники закривають центр і повертаються допомагати обороні.", "Опорний півзахисник страхує простір перед захисниками.", "Захисники тримають лінію й контролюють нападників суперника.", "Воротар керує обороною голосом, бо бачить усе поле."]}], "f": "За оцінками фахівців, польові гравці на професійному рівні пробігають за матч близько 10 кілометрів і більше.", "pr": ["Оберіть одну позицію (захисник, півзахисник, нападник, воротар) і опишіть письмово її завдання в нападі та в обороні (по 3–4 пункти).", "Намалюйте схему перевантаження флангу: позначте гравців атаки, обороняючих і вільну зону, що утворюється на протилежному фланзі."], "q": ["Які завдання виконує опорний півзахисник?", "Що таке відкривання і чому воно важливе?", "Навіщо перевантажувати один фланг?", "З яких гравців починається оборона команди?"]}, {"n": "73", "t": "Удари головою після навісів і кутових. Оборона на стандартних положеннях", "g": "Учень дізнається, як виконувати удари головою після навісів і кутових ударів та як команда організовує оборону на стандартах.", "k": "Модулі: Футбол", "terms": [["Навіс", "високо спрямована передача з флангу в штрафний майданчик для удару головою чи ногою."], ["Кутовий удар", "поновлення гри з кутового сектора, коли м'яч після дотику гравця команди, що захищається, перетнув лінію воріт поза ворітьми."], ["Ближня штанга", "стійка воріт, ближча до місця подачі, біля якої часто розігрують кутові удари."], ["Утримування суперника", "заборонений спосіб боротьби руками за футболку чи тіло суперника, який у своєму штрафному майданчику карається пенальті."]], "th": [{"h": "Футбол. Удари головою після навісу", "p": ["Більшість голів головою забивають після навісів з флангу. Нападник має вчасно увірватися в зону, куди летить м'яч, обіграти опікуна рухом і виконати точний удар. Важливі не лише стрибок, а й вибір моменту старту."], "ul": ["Рух: спершу на одну зону, потім ривок в іншу, щоб відірватися від опікуна.", "Зустрічайте м'яч у русі, з розбігу.", "Удар — серединою лоба, вниз і в протилежний від воротаря кут.", "Слідкуйте за положенням поза грою під час навісу з гри.", "Не відштовхуйте суперника руками — гол не зарахують."]}, {"h": "Футбол. Кутові удари в атаці", "p": ["Кутовий — шанс забити зі стандартного положення. Команда заздалегідь домовляється, хто куди біжить: на ближню штангу, на дальню, у центр, хто чекає відскоку на межі штрафного."], "ul": ["Подача може бути закручена до воріт або від воріт.", "Гравець на ближній штанзі може скинути м'яч головою далі.", "Хтось завжди лишається на межі штрафного для підбору.", "Позаду має бути страхування на випадок контратаки.", "Погоджуйте умовні сигнали для різних варіантів розіграшу."]}, {"h": "Футбол. Оборона на стандартних положеннях", "p": ["Оборона на кутових і штрафних буває зонною, персональною або змішаною. Головне — кожен гравець знає своє завдання, а воротар керує обороною."], "ul": ["Зонна оборона: кожен захищає свою ділянку штрафного.", "Персональна оборона: кожен опікає конкретного суперника.", "Будьте між суперником і воротами, стежте і за м'ячем, і за гравцем.", "Утримування суперника руками в штрафному карається пенальті.", "Після відбиття — уся команда виходить уперед."]}], "f": "Кутовий удар з'явився в правилах футболу в 1872 році.", "pr": ["Намалюйте схему розіграшу кутового удару своєї команди: позначте подавальника, гравців на ближній і дальній штангах, у центрі, на межі штрафного та страхування.", "Опишіть письмово різницю між зонною і персональною обороною на стандартах та назвіть переваги кожної."], "q": ["Як нападник може відірватися від опікуна перед навісом?", "Куди варто бити головою після навісу і чому?", "Як розподіляються ролі гравців під час кутового в атаці?", "Чим зонна оборона на стандартах відрізняється від персональної?"]}, {"n": "74", "t": "Орієнтований прийом і прийом із розворотом. Ведення в тісноті", "g": "Учень зрозуміє, як приймати м'яч з урахуванням наступної дії, розвертатися з м'ячем під тиском і вести м'яч у тісному просторі.", "k": "Модулі: Футбол", "terms": [["Орієнтований прийом", "зупинка м'яча, якою гравець одразу спрямовує його в потрібному напрямку для наступної дії."], ["Відкрита постава", "положення тіла під час прийому, коли гравець стоїть боком і бачить і м'яч, і поле перед собою."], ["Прийом із розворотом", "зупинка м'яча з одночасним поворотом обличчям до воріт суперника."], ["Ведення в тісноті", "ведення м'яча частими короткими дотиками серед кількох суперників у малому просторі."]], "th": [{"h": "Футбол. Спеціальні вправи для швидкості та спритності", "p": ["Для роботи з м'ячем під тиском потрібні швидкі ноги, координація та рівновага. Спеціальні бігові вправи з короткими кроками, зміною напрямку та стрибками допомагають цьому."], "ul": ["Біг дрібними частими кроками, біг через координаційну драбину.", "Прискорення на 5–10 м з різних вихідних положень.", "Стрибки на одній нозі з утриманням рівноваги після приземлення.", "Розвороти на 180° за сигналом.", "Між серіями — відпочинок до відновлення дихання."]}, {"h": "Футбол. Орієнтований прийом і прийом із розворотом", "p": ["Сильні гравці не просто зупиняють м'яч, а одразу «відпускають» його туди, де вільно. Для цього перед прийомом вони озираються й стають у відкриту поставу: боком, щоб бачити поле."], "ul": ["Перед отриманням м'яча — погляд через плече.", "Приймайте м'яч дальньою від суперника ногою.", "Прийом із розворотом: внутрішньою стороною дальньої ноги, м'яч іде вбік-уперед.", "Якщо суперник щільно позаду — не розвертайтеся, віддайте м'яч назад або вбік.", "Помилка: прийом «у ноги» лицем до своїх воріт без огляду."]}, {"h": "Футбол. Ведення м'яча в тісноті", "p": ["У малому просторі м'яч треба тримати впритул до ноги й торкатися його часто. Тут працюють усі частини стопи: внутрішня, зовнішня сторона, підошва."], "ul": ["Короткі дотики на кожен крок.", "Центр ваги низько, коліна зігнуті.", "Підошвою зручно зупиняти м'яч і змінювати напрямок.", "Шукайте вихід із тісноти — пас або ривок у вільний простір.", "Помилка: занадто довго утримувати м'яч серед суперників."]}], "f": "", "pr": ["Виконайте вправу на координацію на місці: «тепінг» — швидкі почергові торкання носками ніг уявної лінії протягом 20 секунд, 4 підходи з відпочинком 40 секунд.", "Опишіть письмово 3 ситуації, коли гравцеві краще не розвертатися з м'ячем, а віддати передачу."], "q": ["Що таке орієнтований прийом?", "Навіщо гравцю відкрита постава під час прийому?", "Як виконується прийом із розворотом і коли він ризикований?", "Як правильно вести м'яч у тісноті?"]}, {"n": "75", "t": "Воротар: ловля м'яча, кидки руками й вибивання ногами, керування обороною на виходах", "g": "Учень узагальнить знання про техніку воротаря: способи ловлі, введення м'яча в гру та керування обороною під час виходів.", "k": "Модулі: Футбол", "terms": [["Хват «W»", "положення кистей під час ловлі високого м'яча, коли великі й вказівні пальці утворюють літеру W позаду м'яча."], ["Ловля «кошиком»", "ловля низького чи середнього м'яча, коли воротар притискає його передпліччями до тулуба."], ["Розподіл м'яча", "вибір воротарем адресата і способу введення м'яча в гру з урахуванням ситуації на полі."], ["Керування обороною", "підказки воротаря голосом захисникам щодо позиції, опіки та виходу з воріт."]], "th": [{"h": "Футбол. Ловля м'яча воротарем", "p": ["Надійна ловля — основа гри воротаря. Від висоти польоту м'яча залежить спосіб: високий м'яч ловлять над головою хватом «W», м'яч на рівні живота й грудей — «кошиком», низький котиться — у нахилі, ставлячи ноги близько, щоб м'яч не пройшов між ними."], "ul": ["Хват «W»: пальці розведені, руки трохи зігнуті, м'яч ловимо перед собою.", "«Кошик»: передпліччя знизу, м'яч притискаємо до грудей.", "Низький м'яч: коліно чи ноги як друга лінія захисту.", "Після ловлі — одразу притисніть м'яч до тулуба.", "Розминка пальців і рукавиці обов'язкові."]}, {"h": "Футбол. Кидки руками й вибивання ногами: розподіл м'яча", "p": ["Сучасний воротар — перший гравець атаки. Розподіл м'яча — це завжди вибір між ризиком і швидкістю: короткий кидок захисникові безпечний, а довгий кидок чи вибивання дозволяють почати швидкий напад."], "ul": ["Кидок знизу — найближчому захисникові.", "Кидок збоку чи зверху — на фланг для швидкої атаки.", "Вибивання з рук чи з півльоту — на нападника, коли суперник пресингує.", "Обирайте той спосіб, який партнеру найлегше прийняти.", "Пам'ятайте про правило шести секунд."]}, {"h": "Футбол. Гра на виходах і керування обороною", "p": ["Воротар бачить усе поле і тому має бути «голосом» оборони. Чіткі короткі команди допомагають уникнути зіткнень і помилок під час виходів та стандартних положень."], "ul": ["Команди мають бути короткими: «Воротар!», «Вибивай!», «Тримай!», «Вийшли!».", "Перед стандартом розставте партнерів.", "На виході рішуче йдіть до м'яча, захищаючи себе піднятим коліном.", "Якщо не встигаєте — залишайтеся у воротах і попередьте захисників.", "Після помилки не опускайте рук — гра продовжується."]}], "f": "", "pr": ["Виконайте імітацію ловлі хватом «W» і «кошиком» без м'яча або з легким м'якиком (подушкою) на місці: 2 підходи по 10 повторень кожного способу.", "Складіть перелік із 6–8 команд воротаря захисникам і поясніть, у якій ситуації звучить кожна."], "q": ["Як ловлять високий м'яч хватом «W»?", "Чим ловля «кошиком» відрізняється від ловлі низького м'яча?", "Від чого залежить вибір способу введення м'яча в гру?", "Для чого воротар керує обороною голосом?"]}, {"n": "76", "t": "Удари головою: повторення техніки, жонглювання, удар на точність", "g": "Учень узагальнить знання про техніку ударів головою з місця, у стрибку, з поворотом і навчиться оцінювати якість власного виконання.", "k": "Модулі: Футбол", "terms": [["Жонглювання головою", "послідовні легкі підбивання м'яча лобом без падіння н
