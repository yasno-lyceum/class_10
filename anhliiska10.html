D({n:93,top:11,par:"Unit 11 · Writing",pg:"WB 69",e:"⚖️",t:"Письмо: есе «за і проти» (A for-and-against essay)",

  if(x.hook)h+=`<div class="card hook"><h3>🎯 Мета уроку</h3>${fmt(x.hook)}</div>`;
  if(x.b)if(x.b&&x.b.length)h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  h+=`<div class="card recap"><h2 class="sec"><span class="num">📌</span><span>Повторюємо головне з кожного уроку</span></h2>${ls.map(y=>`<h4>Урок ${y.n}. ${fmt(y.t)}</h4><ul class="l">${(y.sum||[]).map(s=>`<li>${fmt(s)}</li>`).join("")}</ul>`).join("")}</div>`;
  const pool=[];ls.forEach(y=>y.noPool||(y.q||[]).forEach(q=>pool.push(q)));
  qs=(x.q||[]).concat(shuffle(pool).slice(0,x.cnt||(x.sumOf=="all"?24:16)));
  x._terms=[];const ws=[],seen={};ls.forEach(y=>(y.w||[]).forEach(t=>{if(!seen[t[0]]){seen[t[0]]=1;ws.push(t)}}));x._w=x.sumOf=="all"?[]:ws;
  const fp=[];ls.forEach(y=>y.noPool||(y.f||[]).forEach(f=>fp.push(f)));x._f=(x.f||[]).concat(shuffle(fp).slice(0,x.fcnt||12));
 }else{
  if(x.hook)h+=`<div class="card hook"><h3>🤔 Для початку — подумай</h3>${fmt(x.hook)}</div>`;
  if(x.sum)h+=`<div class="card sum"><h3>⚡ Урок за 30 секунд</h3><ol>${x.sum.map(s=>`<li>${fmt(s)}</li>`).join("")}</ol></div>`;
  if(x.b&&x.b.length)h+=`<div class="card">${x.b.map(block).join("")}</div>`;
  x._terms=x.terms||[];x._w=x.w||[];x._f=x.f||[];
  if(x.diag){const pool=[];L.filter(y=>!y.sumOf&&y.n!=x.n&&x.diag.includes(y.top)).forEach(y=>(y.q||[]).forEach(q=>pool.push(q)));qs=qs.concat(shuffle(pool).slice(0,x.dcnt||12));}
 }
 const W=x._w||[];
 if(W.length)h+=`<div class="card"><h2 class="sec"><span class="num">🆕</span><span>${x.sumOf?"Слова розділу — повторюємо":"Нові слова — натисни 🔊, щоб почути"}</span></h2>${block(["ph",W])}</div>`;
 if(W.length)h+=`<div class="card"><h2 class="sec"><span class="num">🔁</span><span>Згадай слово англійською — натисни на картку</span></h2><div class="terms">${shuffle(W).slice(0,x.sumOf?16:W.length).map(t=>`<div class="term" onclick="this.classList.toggle('f')"><div class="in"><div class="fa">${fmt(t[1])}</div><div class="ba"><b style="font-size:19px">${fmt(t[0])}</b>&nbsp;<button class="spk" onclick="event.stopPropagation();say(this.dataset.t)" data-t="${t[0].replace(/"/g,"&quot;")}">🔊</button></div></div></div>`).join("")}</div></div>`;
 const F=x._f||[];
 if(F.length)h+=`<div class="card"><h2 class="sec"><span class="num">✍️</span><span>Вправа: впиши правильну форму / слово</span></h2>${fills(F)}</div>`;
 if(x._terms.length)h+=`<div class="card"><h2 class="sec"><span class="num">🔑</span><span>Ключові поняття — натисни на картку</span></h2><div class="terms">${x._terms.map(t=>`<div class="term" onclick="this.classList.toggle('f')"><div class="in"><div class="fa">${fmt(t[0])}</div><div class="ba">${fmt(t[1])}</div></div></div>`).join("")}</div></div>`;
 if(x.link)h+=`<div class="card"><p>📝 Онлайн-тест від учителя: <a class="btnp" href="${x.link}" target="_blank" rel="noopener">Відкрити тест на «Всеосвіті»</a></p></div>`;
 if(qs.length)h+=`<div class="card"><h2 class="sec"><span class="num">✅</span><span>Test yourself: тест (${qs.length} запитань)</span></h2>${quiz(qs)}</div>`;
 const pv=L.find(y=>y.n==n-1),nx=L.find(y=>y.n==n+1);
 h+=`<div class="nav">${pv?`<a href="#${pv.n}"><small>← Попередній</small>${pv.n}. ${fmt(pv.t)}</a>`:"<span></span>"}${nx?`<a class="n" href="#${nx.n}"><small>Наступний →</small>${nx.n}. ${fmt(nx.t)}</a>`:"<span></span>"}</div>`;
 $("#app").innerHTML=h;bindQuiz(n,qs.length);scrollTo(0,0);document.title=`Урок ${n}. ${x.t.replace(/==|\*\*/g,"")}`;
}
function home(){
 document.documentElement.style.setProperty("--ac","#0ea5a4");
 const done=L.filter(x=>store.get("s"+x.n,0)>0).length;
 let h=`<div class="home"><div class="hero" data-e="🇬🇧" style="background:linear-gradient(135deg,#0f766e,#2563eb,#7c3aed)"><div class="k">Ліцей «Ясно» · English B1+</div><h1>English: New Close-up B1+</h1><span class="pg">📘 New Close-up B1+ (Student’s Book + Workbook) · ${L.length} уроків</span></div>
 <div class="card"><b>Твій прогрес:</b> пройдено тестів — ${done} з ${L.length}<div class="bar"><i style="width:${done/L.length*100}%"></i></div><small style="color:var(--mute)">Кожен урок: нові слова з озвученням 🔊 → граматика з прикладами → вправи «впиши слово» → тест із поясненнями.</small></div>`;
 TOPICS.forEach((T,i)=>{const ls=L.filter(x=>x.top==i);if(!ls.length)return;
  h+=`<div class="topic" style="background:linear-gradient(90deg,${T.c1},${T.c2})">${T.e} ${T.name}</div><div class="grid">${ls.map(x=>{const s=store.get("s"+x.n,0);return `<a class="ls" href="#${x.n}"><span class="nb" style="background:linear-gradient(135deg,${T.c1},${T.c2})">${x.n}</span><span><div class="tt">${fmt(x.t)}</div><div class="st">${s?`✅ найкраще: ${Math.round(s*100)}%`:(x.sumOf?"🏁 узагальнення":(x.par||""))}</div></span></a>`}).join("")}</div>`});
 $("#app").innerHTML=h+"</div>";document.title="English · New Close-up B1+";scrollTo(0,0);
}
function route(){const n=parseInt(location.hash.slice(1));n?lessonView(n):home()}
addEventListener("hashchange",route);route();
</script>
</body>
