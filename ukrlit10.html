<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Українська література · 10 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.note{margin:0 0 12px;padding:10px 14px;border-left:3px solid var(--line,#ccc);background:rgba(127,127,127,.08);font-style:italic;font-size:14px;opacity:.9;border-radius:6px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>
<body>
<div class="page" id="app"></div>
<script>
const BOOK_NAME = "Авраменко О. М., Пахаренко В. І. Українська література, 10 клас (Грамота, 2018)";
const META = [{"section": "Тема № 1. Вступ. Реалістична українська проза (творчість І. Нечуя-Левицького і П. Мирного)", "title": "Українська література другої половини ХІХ ст. у контексті розвитку тодішнього суспільства, культури, мистецтва. Розвиток реалізму, натуралізму, пізній романтизм. Тодішні поезія, драматургія", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Тема № 1. Вступ. Реалістична українська проза (творчість І. Нечуя-Левицького і П. Мирного)", "title": "Іван Нечуй-Левицький. Життя і творчість письменника як новий імпульс української літератури. «Кайдашева сім’я» – соціально-побутова повість-хроніка. ТЛ: соціально-побутова повість, реалізм", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Тема № 1. Вступ. Реалістична українська проза (творчість І. Нечуя-Левицького і П. Мирного)", "title": "І. Нечуй-Левицький. «Кайдашева сім’я». Реалізм твору, вічна актуальність проблеми батьків і дітей", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Тема № 1. Вступ. Реалістична українська проза (творчість І. Нечуя-Левицького і П. Мирного)", "title": "І. Нечуй-Левицький. «Кайдашева сім’я». Колоритні людські характери в повісті. Образи-персонажі, засоби їх зображення. ТЛ: засоби змалювання комічного", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Тема № 1. Вступ. Реалістична українська проза (творчість І. Нечуя-Левицького і П. Мирного)", "title": "І .Нечуй-Левицький. «Кайдашева сім’я». Українська ментальність, гуманістичні традиції народного побуту й моралі. Ствердження цінностей національної етики засобами комічного", "codes": "", "ktp": "", "hw": "", "pages": ""}, {"section": "Тема № 1. Вступ. Реалістична українська проза (творчість І. Нечуя-Левицького і П. Мирного)", "title": "Панас Мирний. «Хіба ревуть воли, як ясла повні?» (1, 4 частини). Загальна характеристика творчості. Перший український соціально-психологічний роман. Співавторство з І. Біликом. ТЛ: соціально-психологічний роман", "codes": "", "ktp": "", "h {info:`<h4>Історичні обставини</h4>
<p>Українське письменство другої половини ХІХ ст. поставало в умовах колоніального поневолення українських земель Російською та Австро-Угорською імперіями. Найважливішою метою письменники вважали пробудження й збереження національної свідомості, людяності, співчуття до знедолених. Поширеною була <b>денаціоналізація</b> – втрата національних особливостей. Основним об’єктом зображення й адресатом стає селянство; таке письменство назвали <b>народницьким, або просвітянським</b> (І. Нечуй-Левицький, Панас Мирний, Б. Грінченко, М. Старицький, І. Карпенко-Карий).</p>
<h4>Національне та загальнолюдське</h4>
<p>Загальнолюдські цінності – людинолюбство, добротворення, свобода, досконалість, краса, справедливість, щастя; загальнолюдське може існувати лише у формі національного (А. Міцкевич). Різні системи символіки: рушник в Україні – поетичний символ життя («Пісня про рушник» А. Малишка); символ кохання в Україні – калина, у Німеччині – бузина. Націю творять: 1) спільний національний менталітет; 2) єдина мова.</p>
<h4>«Громади», часописи, товариства</h4>
<ul><li><b>«Громада»</b> – напівлегальний гурток української інтелігенції (засновники В. Антонович, М. Костомаров, П. Куліш, М. Лисенко, М. Старицький, П. Чубинський). Перша – 1859 р. в Петербурзі; часопис <b>«Основа»</b>.</li>
<li>1865 р. у Відні <b>І. Пулюй</b> заснував «Громаду» («Січ», до 1947 р.).</li>
<li><b>«Стара громада»</b> (Київ, 70–90-ті рр.): В. Антонович, М. Драгоманов, І. Нечуй-Левицький, М. Лисенко та ін.</li>
<li><b>Емський указ 1876 р.</b> заборонив друкування українською мовою в Російській імперії.</li>
<li>Часопис «Киевская старина»; журнал <b>«Громада»</b> у Швейцарії (М. Драгоманов: демократизм, європеїзм, культурництво, еволюційність).</li>
<li>Львів: «Просвіта» (1868), Наукове товариство імені Шевченка (1873); журнали «Правда», «Зоря», газета «Діло».</li></ul>
<h4>Поезія, драматургія, проза</h4>
<p>Проза: І. Нечуй-Левицький, Панас Мирний, М. Старицький, Б. Грінченко, О. Кониський, Олена Пчілка, І. Франко. Поезія: І. Франко, П. Грабовський, Я. Щоголів, І. Манжура, В. Самійленко; 1887 р. – збірка І. Франка «З вершин і низин». 1882 р. М. Кропивницький створив у Єлисаветграді професійну трупу – <b>«Театр корифеїв»</b>.</p>
<h4>Реалізм, натуралізм, пізній романтизм</h4>
<p>Пізні романтики: Я. Щоголів, Л. Глібов, С. Руданський, О. Стороженко. Реалізм в Україні з’явився на межі 50–60-х років ХІХ ст. І. Нечуй-Левицький: реальна література «повинна бути дзеркалом, у котрому б одсвічувалася правдива жизнь».</p>
<p><b>Ознаки реалізму</b>: аналітичне сприйняття світу; пояснення характеру через соціальне походження й умови життя; обмежене заглиблення в психологію; об’єктивність, правдивість деталей, перевага епічних жанрів; <b>типізація</b> (тип – образ, у якому поєднано найхарактерніші вияви певної групи явищ).</p>
<p>Течії: <b>побутово-просвітницький реалізм</b> (Марко Вовчок, Панас Мирний, І. Нечуй-Левицький, І. Карпенко-Карий та ін.; ознака – <b>етнографізм</b>) і <b>революційний реалізм</b> (П. Грабовський, М. Павлик). <b>Натуралізм</b> (від лат. natura – природа) – спроба перетворити твір на точну копію факту; ознаки помітні в романі «Повія» Панаса Мирного, бориславському циклі І. Франка.</p>`,

// 2 Нечуй-Левицький: життя, творчість, «Кайдашева сім’я» – жанр
{info:`<h4>Іван Нечуй-Левицький (1838–1918)</h4>
<ul><li>Народився <b>25 листопада 1838 р.</b> в м. Стеблеві (Черкащина) у родині священика.</li>
<li>Навчався в Богуславському духовному училищі (1847–1852), Київській духовній семінарії (1853–1859), Київській духовній академії (1861–1865). В училищі за українське слово вішали на шию дощечку.</li>
<li>Учителював: Полтавська семінарія, гімназії Каліша й Сєдлеця, Кишинівська гімназія (1873–1885). Перші твори – у львівському журналі «Правда» («Дві московки», «Рибалка Панас Круть», «Причепа»).</li>
<li>Найкращі твори 70–80-х рр.: роман «Хмари», повісті «Микола Джеря», «Кайдашева сім’я», «Бурлачка», «Старосвітські батюшки та матушки».</li>
<li>1885 р. – пенсія, Київ. Разом з І. Пулюєм завершив переклад Святого Письма українською.</li>
<li>Помер 1918 р. в будинку для літніх людей; похований на Байковому цвинтарі. І. Франко назвав його «колосальним усеобіймаючим оком України».</li></ul>
<h4>Теорія літератури. Соціально-побутова повість. Реалізм</h4>
<p>За жанром «Кайдашева сім’я» (1879) – <b>соціально-побутова сатирично-гумористична повість-хроніка</b>. Конфлікт – побутовий і соціальний; події виписані день за днем і рік за роком, що є ознакою <b>хроніки</b>. Повість – зразок <b>побутово-просвітницького реалізму</b>: родинні стосунки, морально-етична проблематика, колоритні соціальні типи, докладне змалювання національного колориту (реалізація принципів реальності, національності й народності).</p>
<h4>Тема і проблематика</h4>
<p><b>Тема</b> – змалювання побуту й психології українських селян у перші десятиріччя після скасування кріпацтва, «темні плями народного життя». Злободенні проблеми: злиденне життя хліборобів, руйнування патріархального устрою села, темнота селян. Одвічні проблеми: добра і зла, кохання, сімейних стосунків, батьків і дітей, людської гідності та свободи, віри в Бога й моралі.</p>
<p>Прототипи Кайдашів – сім’я Мазурів із села Семигори, свати – Довбуші.</p>`,

// 3 Кайдашева сім’я: реалізм, батьки і діти
{info:`<h4>Реалізм повісті</h4>
<p>Те, що сталося з родиною Кайдашів, можна назвати <b>моральною катастрофою</b>: на очах відбувається самознищення домашнього затишку, порозуміння між ближніми, почуття гідності, ладу як основи родини. Повість вийшла майже через два десятиліття після реформи 1861 р.</p>
<p>Твір починається панорамним пейзажем Правобережжя: «Увесь край ніби якесь здорове кладовище, де похований цілий народ, де під безлічними могилами похована українська воля». Отже, однією з головних причин того, що Україна «кайдашіє», є колоніальне ярмо, утрата волі, козацького духу.</p>
<h4>Проблема батьків і дітей</h4>
<ul><li>І. Франко: Нечуй-Левицький малює «гірку картину розпаду українського патріархалізму під впливом індивідуалістичних змагань кожного її члена».</li>
<li>Роль батька в Кайдашів зведено нанівець: Омелько пливе за течією; не розуміє бажання синів мати свою землю.</li>
<li>Родинні чвари переходять межу моральності: Карпо піднімає руку на рідного батька, називає його «іродовою душею»; «Не так шкода мені матері, як шкода чобіт!»</li>
<li>Характери старих Кайдашів статичні (сформовані), а в молодшого покоління – ще формуються.</li></ul>
<h4>Дві версії фіналу</h4>
<p>За першою – діло з грушею не закінчилося: вона розросталася й родила, дратуючи Кайдашів. За другою – «Груша всохла, і дві сім’ї помирилися». С. Єфремов «забракував» обидва варіанти: справа не в груші, а в соціальних причинах.</p>
<p>«Кайдашева сім’я» – сумна повість про долю українського села, гірка правда про згубність егоїзму й люті і водночас гімн українському світові.</p>`,
terms:[["Конфлікт","зіткнення інтересів, поглядів персонажів, що лежить в основі сюжету"],["Експозиція","частина сюжету, що знайомить з місцем дії та персонажами"],["Патріархальний устрій","традиційний устрій родини з владою батька"],["Розв’язка","завершальна частина сюжету"]],

// 4 Кайдашева сім’я: персонажі, засоби комічного
{info:`<h4>Образна система</h4>
<p>Нечуй-Левицький охоче вдається до <b>контрасту</b>: Карпо і Лаврін – протилежності (один – кремезний, насуплений, мовчазний, з батьківськими карими очима; другий – тендітний, веселий, балакучий, схожий на матір). Характери, як правило, статичні: письменник виокремлює одну-дві домінантні риси.</p>
<table class="tbl"><tr><th>Персонаж</th><th>Домінанта / характеристика</th></tr>
<tr><td>Омелько Кайдаш</td><td>богобоязливість і чарколюбство; образ трагікомічний; вірить у святу Параскеву-П’ятницю</td></tr>
<tr><td>Маруся Кайдашиха</td><td>чваньковитість; «терлася коло панів», «проше вас», прізвисько «пані економша»; жорстокість, егоїзм, лицемірство до невісток</td></tr>
<tr><td>Карпо</td><td>мовчазний, замкнутий, жорстокий; громада вибрала його десяцьким – «буде добрий сіпака»</td></tr>
<tr><td>Мотря</td><td>сварливість; «бриклива», «з перцем», «куслива, як муха в Спасівку»</td></tr>
<tr><td>Лаврін і Мелашка</td><td>залишилися «на рівні людяності й закоханості»; Мелашка йде на прощу до Києва, залишається в проскурниці</td></tr>
<tr><td>Баба Палажка</td><td>водить мирян на прощу; «лікує» Омелька від пиятики</td></tr></table>
<p>Мова Кайдашихи характеризує її: спочатку «моє золото», «серце», а згодом – «бендерська чума», «зміюки».</p>
<h4>Засоби комічного</h4>
<ul><li><b>Гумор ситуацій</b> – невідповідність, контраст форми й змісту, дій та обставин.</li>
<li><b>Іронія</b>: «Лавріне! Утри жінці піт з лоба, а то ще в діжу покапає».</li>
<li><b>Сарказм</b>: «Лавріне, утри лиш носа своїй жінці».</li>
<li><b>Знижена лексика</b> в порівняннях: «стала шута, як безрога корова».</li>
<li><b>Мовна нісенітниця</b> у ворожінні баби Палажки: «Сарандара, марандара…».</li>
<li><b>Змішування стилів</b> – високого епічного з побутовим: «Не чорна хмара із синього моря наступала, то виступала Мотря з Карпом…» (як у думі «Ой Морозе, Морозенку»).</li></ul>
<p>Герої майже ніколи не сміються – сміється читач; це <b>«сміх крізь сльози»</b>, одна з ознак української літератури.</p>`,

// 5 Кайдашева сім’я: ментальність, народна етика
{info:`<h4>Українська ментальність і народна мораль</h4>
<p>Повість – гірка правда про згубність егоїзму й люті, «сказана для того, щоб люди ставали досконалішими, гідними себе». Духовна роз’єднаність – те лихо, що отруює кожен день життя і батьків, і синів, і невісток. Гору в Кайдашевій сім’ї бере «диявольська сила руйнування», що озивається в цих нелихих, роботящих людях.</p>
<p>Водночас у творі прочитується <b>гімн українському світові</b>: неповторна природа, весела, життєрадісна, поетична душа людей, мелодійна мова, пісня. Ці риси й зумовили непроминальну популярність повісті (багато перевидань і перекладів).</p>
<h4>Гуманістичні традиції народного побуту</h4>
<ul><li>Етнографічні елементи: обряди (розглядини, весілля), звичаї, проща до Києва, народні вірування (свята Параскева-П’ятниця).</li>
<li>Народна етика утверджується від протилежного: читач бачить, до чого призводять сварки, і робить висновок, що «Згода будує, а незгода руйнує», «Мир і лад – великий клад».</li>
<li>Мелашка не уподібнюється до Кайдашихи й Мотрі, «не втрачає людської подоби» – утілення народної моральності, ліризму.</li>
<li>Лаврін – «Веселі, сині, як небо, очі… усе дихало молодою парубочою красою».</li></ul>
<h4>Актуальність</h4>
<p>Проблеми повісті – батьків і дітей, родинного ладу, гідності, егоїзму – актуальні й нині; твір легко ставити на сцені завдяки діалогам і драматичним сценам.</p>`,

// 6 Панас Мирний: життя, творчість, роман
{info:`<h4>Панас Мирний (1849–1920)</h4>
<ul><li>Справжнє ім’я – <b>Панас Рудченко</b>; народився <b>13 травня 1849 р.</b> в м. Миргороді (Полтавщина) у родині дрібного чиновника.</li>
<li>Нянька Оришка – прообраз Чіпчиної баби в романі.</li>
<li>Освіта – Гадяцьке повітове училище; з 14 років служив у канцеляріях; з 1871 р. – у Полтаві, де прожив до кінця днів. Працював чиновником <b>57 років</b>, дослужився до чину дійсного статського радника.</li>
<li>1872 р. – дебют у львівському журналі «Правда» віршем «Україна»; оповідання «Лихий попутав».</li>
<li>Старший брат <b>Іван Білик</b> (Іван Рудченко) – співавтор роману.</li>
<li>1892 р. на прем’єрі «Лимерівни» з М. Заньковецькою вперше розкрив свій псевдонім. Помер <b>28 січня 1920 р.</b> у Полтаві.</li></ul>
<h4>Творчий доробок</h4>
<p>Романи «Хіба ревуть воли, як ясла повні?» і «Повія»; повісті «П’яниця», «Лихі люди», «Лихо давнє й сьогочасне»; драма «Лимерівна» (1892); оповідання «Морозенко», «Лихий попутав». Панас Мирний – основоположник українського <b>соціально-психологічного роману</b>. Головна проблема всієї творчості – проблема <b>«пропащої сили»</b>. У «Повії» – ознаки натуралізму (Христя Притиківна).</p>
<h4>Історія написання роману</h4>
<p>Поштовх – нарис «Подоріжжя од Полтави до Гадячого» (1874) про розбійника Василя Гнидку. 1872 р. – повість «Чіпка», перша редакція. Назву – метафору з біблійної <b>Книги Йова</b> – підказав Іван Білик. Через Емський указ роман надрукував М. Драгоманов у <b>Женеві в 1880 р.</b>; легально – 1903 р. в «Киевской старине» під назвою <b>«Пропаща сила»</b>. О. Білецький назвав роман «будинком із багатьма прибудовами й надбудовами».</p>
<h4>Жанр</h4>
<p><b>Соціально-психологічний роман</b> – жанрова форма роману, надбання реалістичного мистецтва; соціальні процеси зображено через психологію героїв. Поява такого роману засвідчує зрілість літератури.</p>`,

// 7 Хіба ревуть воли: широта народного життя
{info:`<h4>Ідейно-тематичний зміст</h4>
<p>Роман – перша в нашому письменстві <b>монументальна селянська епопея</b>; за І. Франком, у ньому «змальовано майже столітню історію українського села». <b>Ідея</b>: народ жив би мирно, якби не нестерпне гноблення (воли б не ревли, якби ясла були повні), але за допомогою насильства світ не вдосконалиш. <b>Тема</b> – зображений на широкому суспільному тлі життєпис злочинця Чіпки від народження до ув’язнення на каторгу.</p>
<h4>Композиція та сюжет</h4>
<p>Чотири частини, тридцять розділів. Сюжетні лінії: рід і життя Чіпки; рід і життя Максима Ґудзя; Грицько та Христя; пани Польські; історія села Пісок.</p>
<ul><li>Початок ліричний, з інтригою – розділ <b>«Польова царівна»</b>.</li>
<li>Перші дві частини – експозиція й передісторія; зав’язка – у третій частині (розділ «Нема землі»); кульмінація – реакція Чіпки на вигнання із земства; розв’язка – знищення родини Хоменків та арешт.</li>
<li>Друга частина – історія закріпачення села Пісок: скасування Гетьманщини, гайдамаччина, зруйнування Січі генералом Текелієм, запровадження кріпацтва Катериною ІІ, повстання Т. Костюшка, декабристи. Козаки перетворюються на «покірних волів».</li></ul>
<h4>Широта народного життя</h4>
<p>Час дії – від катерининських часів до пореформених 1860-х років. Персонажі – селяни, козаки, пани, чиновники (генеральша, Кряжов, Шавкун, Чижик). Група панів і чиновників репрезентує проблеми зречення національності, зросійщення, виродження дворянства, формування буржуазії. Сцена селянського протесту розкриває суть реформи 1861 р.</p>`,

// 8 Шлях Чіпки
{info:`<h4>Чіпка Варениченко</h4>
<p>Чіпка (Ничипір) – найпомітніший, особливо детально виписаний образ бунтаря у вітчизняній літературі другої половини XIX ст. Автори простежили, як потенційно добру, чулу, чесну людину затята революційність, мстивість ведуть до страхітливого морального краху. «Коли б можна, увесь би світ виполонив, а виростив новий!»</p>
<p>Портрет: «Одно тільки в нього неабияке — дуже палкий погляд, бистрий, як блискавка. Ним світилася якась незвичайна сміливість і духовна міць, разом з якоюсь <b>хижою тугою</b>…»</p>
<table class="tbl"><tr><th>Негативні впливи</th><th>Позитивні впливи</th></tr>
<tr><td>дитинство байстрюка; отроцтво наймита; відсудження землі; концепція Пороха про панування неправди; лихе товариство; поразка в земській боротьбі</td><td>повчання баби Оришки та діда Уласа; кохання до Галі; материні протести; родинний затишок; обрання в земство; господарські успіхи</td></tr></table>
<p>Впливи зрівноважені – отже, не самі лише зовнішні причини штовхали його на «слизьку дорогу».</p>
<h4>Чотири віхи шляху</h4>
<ol><li><b>Ідилія</b> – закоханість у «польову царівну» Галю.</li>
<li><b>Душевний занепад</b> – незаконно відсуджують землю; «правди немає»; пиятика з «трійцею» гультіпак. Христя: Чіпка – «боляща душа».</li>
<li><b>Нова ідилія</b> – полотенщик Никифор Іванович, обрання до земської управи.</li>
<li><b>Катастрофа</b> – комедія з виборами; розбійницький шлях, з якого немає вороття.</li></ol>
<p>Розбійництво Чіпки коріниться в його індивідуально-психологічних особливостях. Фінал символічний: Галя з докором «Так оце та правда?!» накладає на себе руки, а мати Мотря сама віддає сина на кару. Роман заперечує романтизацію «благородного розбійництва»; Чіпка – альтернатива Робінам Гудам; автори попереджали про загрозу утопічних теорій, що ґрунтуються на мстивості й насильстві.</p>`,

// 9 РМ №1 Диспут
{info:`<p class="note">Урок розвитку мовлення. Тема диспуту: «Усвідомлення значення правильності життєвого вибору для становлення й ствердження людини» (за романом Панаса Мирного та Івана Білика). Нижче – опорний матеріал з підручника.</p>
<h4>Проблема вибору</h4>
<ul><li>Автори наголошують: незважаючи на все, Чіпка міг зробити й інший вибір; негативні й позитивні впливи в його житті зрівноважені.</li>
<li><b>Чіпка і Грицько</b> мали подібні стартові позиції (Грицько – сирота, підпасич), але один став розбійником, а другий – «сумирним, терплячим хазяїном» з філософією «своя сорочка ближче до тіла».</li>
<li><b>Максим Ґудзь</b> – «чистий тип» «пропащої сили»: грабує тільки заради наживи, не шукає правди.</li>
<li><b>Галя</b> поставила коханому умову – покинути розбійництво: «людина може бути сильнішою за долю, вона здатна вибирати шлях добра».</li>
<li><b>Мотря</b>: заповідь «Не вбий!» для неї вища за материнські почуття; її рішення символічне – українська душа не приймає кривавого шляху боротьби зі злом.</li></ul>
<h4>Питання для диспуту (з підручника)</h4>
<ul><li>Прирікаючи сина на каторгу, Мотря карає Чіпку чи намагається запобігти його злочинам?</li>
<li>Яка назва роману вдаліша: «Пропаща сила» чи «Хіба ревуть воли, як ясла повні?»</li>
<li>Грицько – ще одне уособлення «пропащої сили» чи позитивний вихід із випробувань?</li></ul>
<h4>Правила диспуту</h4>
<p>Чітко формулюйте тезу, наводьте аргументи й приклади з тексту, поважайте опонентів, робіть висновки.</p>`,

{info:`<h4>«Руська бесіда»</h4>
<p>1861 р. за ініціативою Ю. Лаврівського у Львові засноване товариство «Руська бесіда»; з 1864 по 1923 р. воно утримувало свій театр – перший мандрівний професійний український музично-драматичний театр у Галичині. Найбільшого розквіту театр досягнув на початку ХХ ст. під керівництвом Й. Стадника; виховав Л. Курбаса, М. Крушельницького, Й. Гірняка, А. Бучму.</p>
<h4>«Театр корифеїв»</h4>
<p><b>Корифей</b> (з грецьк. «зачинатель») – у давньогрецькому театрі керівник хору; переносно – основоположник якоїсь справи.</p>
<ul><li><b>27 жовтня 1882 р.</b> в Єлисаветграді (нині Кропивницький) М. Кропивницький поставив «Наталку Полтавку» І. Котляревського; головну роль виконала <b>М. Заньковецька</b>. Так розпочалась історія «Театру корифеїв».</li>
<li>Брати Тобілевичі під псевдонімами – <b>Іван Карпенко-Карий, Микола Садовський, Панас Саксаганський</b>, їхня сестра Марія Садовська-Барілотті; М. Кропивницький, М. Старицький (за власний кошт придбав гардероб і декорації), М. Заньковецька, Л. Ліницька, Г. Затиркевич-Карпинська.</li>

<li>Освіта – Бобринецьке повітове училище; з 14 років – писар; учасник аматорських гуртків.</li>
<li>Псевдонім – від імені батька Карпа та прізвища героя драми Т. Шевченка «Назар Стодоля» Гната Карого.</li>

// 14 Мартин Боруля: підміна цінностей
{info:`<h4>Система дійових осіб</h4>
<p>На відміну від Пузиря («Хазяїн») і Калитки («Сто тисяч»), Мартин Боруля не труситься за кожну копійку, але, як мольєрівський Журден, у прагненні стати дворянином утрачає здоровий глузд. Мотивація: захист людської гідності своєї й дітей, бажання вберегти їх від тяжкої селянської праці – щоб онуки «були дворяне, не хлопи».</p>
<h4>«Дворянські порядки» Борулі</h4>
<ul><li>наказує всім довго спати, хоча боки болять;</li>
<li>планує розвести собак та їздити на полювання;</li>
<li>хоче віддати Марисю за «благородного» Націєвського, який через непорозуміння тікає;</li>
<li>прилаштовує сина Степана на чиновницьку посаду – його звільняють;</li>
<li>документи виявляються записаними на прізвище <b>Беруля</b>, а не Боруля.</li></ul>
<p>Комізм – у невідповідності між селянським способом життя й омріяною шляхетністю (кава «до борщу, чи на ніч»; «не кажи так помужичи: мамо, тато»).</p>
<h4>Інші персонажі</h4>
<ul><li><b>Марися</b> – найбільш стійка, має міцну моральну основу: «тільки той має право їсти, хто їжу заробляє».</li>
<li><b>Степан</b> – прагне посади обманом, хитрістю; батько радить: «трися, трися між людьми — і з тебе будуть люде!» і не дружити з Миколою.</li>
<li><b>Тренделєв</b> – повірений, махінації з документами; уособлює бюрократичне суспільство: «чи виграв, чи програв, а грошики дай!»</li>

// 15 Психологічна переконливість образу. Значення творчості
{info:`<h4>Психологічна переконливість образу Мартина Борулі</h4>
<p>Характери в драмі розкриваються через діалоги й монологи. Мартин – не злий: він щиро любить дітей, прагне захистити їхню гідність. Його поразки закономірні, бо він женеться за зовнішнім, а не за духовним. Наприкінці розкриваються позитивні риси Мартина – він ніби народжується заново: <b>«Чую, як мені легше робиться, наче нова душа сюди ввійшла, а стара, дворянська, попелом стала»</b>.</p>
<p>Мартин та Омелько представляють два протилежні світи: дисгармонійний світ «сучасної цивілізації» (амбіції, пристосуванство, пихатість, хибні цінності, метушливість) і гармонійний світ традиційної української сільської цивілізації (природний устрій життя, сердечність, пошана до традицій і праці).</p>
<p><b>Ідея п’єси</b> – смішна та людина, яка соромиться бути собою, захоплюється фальшивими цінностями, намагається пристосуватися до швидкоплинної моди. Гервасій: «…нам дворянство личить, як корові сідло».</p>
<h4>Значення творчості І. Карпенка-Карого</h4>
<ul><li>Мистецьке кредо – у монолозі Барильченка («Суєта»): «сцена ж — мій кумир, театр — священний храм для мене!»; потрібна комедія, «що бичує сатирою страшною всіх, і сміхом крізь сльози сміється над пороками».</li>

<li>«Сава Чалий» (1899) – вершина історичної драматургії; Сава – «зрадник мимоволі».</li>
<li>М. Наєнко: до Карпенка-Карого драматургія була «принагідною й епізодичною; після нього здобулася на професійний статус».</li>
<li>«Мартин Боруля» понад сто років іде на сценах; фільм-вистава з Г. Юрою в головній ролі.</li></ul>`,

// 19 З вершин і низин
{info:`<h4>Збірка «З вершин і низин» (1887; друге видання 1893)</h4>
<p>Стала в духовному житті України явищем, співмірним із «Кобзарем» Т. Шевченка. Шість розділів: «De profundis» (з латин. «з глибини»), «Профілі і маски», «Сонети», «Галицькі образки», «Жидівські мелодії», «Легенди». Переважає громадянсько-політична, патріотична лірика («Товаришам із тюрми», «Гімн», «Каменярі», «Земле моя», «Тюремні сонети»). Два мотиви (за поетом): «розкривання ненормальностей життя» і «віднаходження поривів і змагань до поправи того життя». Ліричний герой – самозречений борець із національною й соціальною кривдою.</p>
<h4>«Гімн» («Вічний революціонер», 1880)</h4>
<ul><li>Заспів до збірки. Прославляється «вічний революціонер» – вічний дух прагнення до щастя й волі: «Дух, наука, думка, воля — не уступить пітьмі поля».</li>
<li>Персоніфікація через нагнітання дієслів: живе, рве, йде, міцніє, спішить. Риторичне запитання: «І де в світі тая сила, / Щоб в бігу її спинила?»</li>
<li>Чотиристопний хорей, анафори, алітерація [р] – маршева мелодія. 1905 р. М. Лисенко поклав на музику; разом із «Заповітом» – неофіційний гімн бездержавного народу.</li></ul>
<h4>«Сикстинська Мадонна» (1881)</h4>
<p>Сонет під враженням від картини Рафаеля (1515–1519). Віра в непереможну силу високого мистецтва; продовження Шевченкової традиції возвеличення жінки-матері. Риторичні запитання, звертання, оклики: «Хто смів сказать, що не богиня ти?»</p>

{info:`<h4>«Зів’яле листя» (1896) – «лірична драма»</h4>
<ul><li>Провідні мотиви – захоплення красою жінки, високе, трагічне почуття кохання.</li>
<li>Цілісний твір із наскрізним любовним сюжетом: три «жмутки» по 20 поезій (мов три дії драми).</li>
<li><b>Перший</b> – палке кохання без надії на взаємність («Безмежнеє поле…»); <b>другий</b> – найоптимістичніший, у стилі народних пісень («Червона калино, чому в лузі гнешся?..», «Ой ти, дівчино, з горіха зерня…», «Чого являєшся мені…»); <b>третій</b> – розв’язка: кохана стає дружиною іншого або вмирає («Вона умерла!»), мотив самогубства (доля Вертера Ґете).</li></ul>
<h4>Автобіографічна основа</h4>
<p>«Тричі мені являлася любов…»: <b>Ольга Рошкевич</b> («лілея біла»), <b>Юзефа Дзвонковська</b> («гордая княгиня», хворіла на сухоти), <b>Целіна Журовська</b> («женщина чи звір», «сфінкс»). Але не варто цілком ототожнювати автора й ліричного героя.</p>
<h4>Аналіз поезій</h4>
<ul><li>«Ой ти, дівчино, з горіха зерня…» – за фольклорною традицією принадна зовнішність протиставлена характерові; контраст «Ти мої радощі, ти моє горе!»; музика А. Кос-Анатольського.</li>

<p>Цар кидає горіх у вогонь: «Прояснів його ум, серце збулось химер, / А в опівніч саму Олександер умер».</p>

{info:`<h4>Поема «Мойсей» (1905)</h4>
<ul><li>Вершина поетичного генія Франка. Основоположна проблема – <b>формування нації</b> («витворити з величезної етнічної маси українського народу українську націю…» – «Одвертий лист до галицької української молоді»).</li>
<li>Поштовх – Революція 1905 р. Задум – 1904 р. в Римі: скульптура Мойсея Мікеланджело Буонарроті.</li>
<li>Тема (за Франком): «смерть Мойсея як пророка, не признаного своїм народом».</li></ul>
<h4>Проблеми</h4>
<ol><li>Народ стає нацією лише з вірою в Бога й своє високе покликання.</li>
<li>Треба бути готовими на випробування й жертви заради свободи.</li>
<li>Небезпечно спокушатися обіцянками лукавих псевдовождів.</li>
<li>Істинні провідники не повинні впадати у відчай.</li></ol>
<h4>Жанр і композиція</h4>
<p><b>Філософська поема-притча</b>: пролог і 20 пісень. Пісні – анапест, катрени; пролог – ямб, <b>терцини</b> (перегук з «Божественною комедією» Данте). Пролог написаний пізніше – щоб заповнити незаповнені сторінки.</p>
<p>Пролог – стислий художній літопис історії народу: «Народе мій, замучений, розбитий, / Мов паралітик той на роздорожжу…»; «Вірю в силу духа / І в день воскресний твойого повстання».</p>
<h4>Теорія літератури. Терцина</h4>
<p><b>Терцина</b> – строфа з трьох рядків п’ятистопового ямба, середній рядок римується з крайніми рядками наступної строфи. Уперше використав Данте.</p>`,

{info:`<h4>Чотири частини сюжету</h4>
<ol><li><b>Пісні І–ХІ</b>: 40 літ Мойсей веде гебреїв до «землі обітованої»; народ зневірився: «Наші кози голодні», «Нам і тут непогано». Фальшиві пророки <b>Авірон і Датан</b> потурають занепадницьким настроям. Притча про дерева й терен (програма життя автора). Народ проганяє Мойсея.</li>

<p>На межі ХІХ–ХХ ст. утверджується новий тип світосприймання й мистецький напрям – <b>модернізм</b>. Причини: <b>гносеологічна</b> (людину вже не задовольняли відповіді реалізму на головні питання буття; відкриття природничих наук) і <b>психологічна</b> (людина хотіла бути вільною, мати право вибору, творити свою долю). На перший план виходить унікальна особистість із її складним внутрішнім світом.</p>
<h4>Основні ознаки модернізму</h4>
<ul><li>інтуїтивний спосіб осягнення світу разом із логічним;</li>
<li>індивідуалізм – зосередження на «Я» автора, героя, читача;</li>
<li>посилена увага до психологізму, позасвідомих сфер душі;</li>
<li>використання символу;</li>
<li>потужний струмінь ліризму (навіть у прозі й драмі);</li>
<li>глибокий естетизм (важливо, <i>як</i> сказати);</li>
<li>умовність; волюнтаризм (культ сили волі); ідеологічність.</li></ul>
<p><b>Течії:</b> імпресіонізм, неоромантизм, неокласицизм, символізм, експресіонізм, неореалізм, футуризм, сюрреалізм. <b>Етапи:</b> декаданс (фр. «занепад») – власне модернізм – авангардизм.</p>
<h4>Особливості українського модернізму</h4>
<ol><li>«Запізнився» на 10–20 років – <b>синкретизм</b> різних течій.</li>
<li>Зберігав тісний зв’язок із національним, соціально-політичним життям.</li></ol>
<p>Нове національне відродження: «Просвіта», з 1907 р. – стаціонарний театр М. Садовського, 1916 р. – «Молодий театр» Л. Курбаса; Будинок з химерами В. Городецького; композитори М. Леонтович, К. Стеценко; художники О. Мурашко, І. Труш, Г. Нарбут. Модерністи: О. Кобилянська, Леся Українка, В. Стефаник, В. Винниченко, Олександр Олесь, М. Вороний та ін.</p>`,

{info:`<h4>Михайло Коцюбинський (1864–1913)</h4>
<ul><li>Народився <b>17 вересня 1864 р.</b> у Вінниці. Навчався в Барській народній школі, Шаргородському духовному училищі. Захопився творами Т. Шевченка й Марка Вовчка.</li>
<li>1891 р. склав іспит на народного вчителя. Перше оповідання «Андрій Соловійко…» (1884) – невдале; почав друкуватися 1890 р. (вірш «Наша хатка», журнал «Дзвінок»). Знайомство з І. Франком у Львові.</li>
<li>1892–1896 рр. – філоксерна комісія в Бессарабії й Криму («Пекоптьор», «На камені», «Під мінаретами»).</li>
<li>З 1898 р. – Чернігів, дружина Віра Дейша; «понеділки» й «суботи» для молодих письменників (П. Тичина та ін.). «Європейський українець».</li>
<li>«Цвіт яблуні» (1902) – перехід до модернізму, імпресіонізму; «Fata morgana», «Intermezzo», «Persona grata».</li>
<li>Капрі (знайомство з М. Горьким); Криворівня – «Тіні забутих предків». Останнє кохання – Олександра Аплаксіна. Помер у квітні 1913 р., похований на Болдиній горі. «Сонцепоклонник».</li></ul>
<h4>Новела «Intermezzo» (1908)</h4>
<p>Програмовий твір, у якому митець розкриває своє творче кредо. Літо 1908 р.: після поразки революції виснажений письменник гостює в маєтку <b>Є. Чикаленка</b> в с. Кононівка («Присвячую Кононівським полям»). Написана згодом у Чернігові – <b>автобіографічна основа</b>.</p>
<p><b>Intermezzo</b> (італ.) – перерва; невеликий музичний твір між актами опери. У Коцюбинського – духовне відродження людини на природі. Жанр – <b>лірична імпресіоністична новела</b> з ознаками поезії в прозі.</p>
<p>«Дійові особи»: Моя утома, Ниви в червні, Сонце, Три білі вівчарки, Зозуля, Жайворонки, Залізна рука города, Людське горе – символи суперечливих почуттів героя; сцена для них – душа ліричного героя.</p>`,

{info:`<h4>Композиція: три фази настроєвої мозаїки</h4>
<ol><li><b>Утома.</b> Місто, вічне велелюддя, чуже страждання виснажили героя; будинки дихають «тисячами чорних ротів»; колія – «залізна рука города».</li>
<li><b>Внутрішня гармонія.</b> Природа зцілює душу; гімн сонцю: «Я п’ю тебе, сонце, твій теплий зцілющий напій…». Перегук із повістю К. Гамсуна «Пан».</li>
<li><b>Готовність знову боротися зі злом.</b> Зустріч із селянином – уособленням людського горя: «Говори, говори…». Фінал: «Іду поміж люди. Душа готова, струни тугі, наладжені, вона вже грає».</li></ol>
<p>Композиційні акценти: вихідний момент – утома й виїзд за місто; розвиток – відпочинок на природі; <b>кульмінація – зустріч із селянином</b>; резюме – приплив нових сил.</p>
<h4>Ознаки імпресіонізму в новелі</h4>
<ul><li>настроєвість як основа сюжету;</li>
<li>домінування враження над зображенням (співучі арфи – це бджоли);</li>
<li>«кольорова музика» – поєднання звукових і колористичних образів;</li>
<li>внутрішній монолог, потік свідомості;</li>
<li>штрихова стилістика.</li></ul>
<p>Провідний мотив – заклик оновитися духовно, стати гармонійною часткою Космосу. С. Єфремов назвав «Intermezzo» «вінцем творчості» Коцюбинського.</p>`,

<ul><li>Лебедина пісня письменника. Задум виник у с. <b>Криворівні</b>: Коцюбинського захопили краса Карпат і «первісне» життя гуцулів. Перебрав понад 10 варіантів назви («У зелених горах», «Тіні минулого»…).</li>
<li><b>Неоромантична поетика</b> з імпресіоністичними малюнками.</li>

<h4>Трагічна доля героїв</h4>
<p>Іван – дев’ятнадцята дитина в родині Палійчуків. Кохання Івана й Марічки зароджується на тлі споконвічної ворожнечі родів Палійчуків і Гутенюків. Проблема зла: якщо на зло відповідати помстою, зло тільки помножується; Марічка відповідає на зло добром – ворожнеча перетворюється на любов.</p>
<p>Жорстока доля руйнує щастя – Марічка випадково тоне в Черемоші. Суперечність між мрією та дійсністю: без Марічки-мрії Іванові немає життя.</p>`,

{info:`<h4>Образи Івана й Марічки</h4>
<ul><li>Головні герої незвичайні, протиставлені обставинам. Щире кохання – сама сутність життя, найвище щастя, надихає на творчість (гра Івана на флоярі, Маріччині співанки). Їх називають «карпатськими Ромео та Джульєттою».</li>
<li>Неоромантичні контрасти: ніжна, природно-поетична <b>Марічка</b> і приземлено-груба <b>Палагна</b>.</li>
<li>Утративши Марічку, Іван пробує жити матеріальною гранню душі: заводить господарство, одружується з Палагною – але так жити не може. Палагна зраджує його з мольфаром Юрою.</li>
<li>Іван помирає, зустрівши в лісі мару Марічки.</li></ul>
<h4>Фінал</h4>
<p>Під час похорону гуцули влаштовують гру – «симфонія життя в час індивідуальної смерті». Одні дослідники читають це оптимістично (перемога життя над смертю), інші – песимістично (торжество приземленого над піднесеним).</p>
<p>Фраза «Хочу набутися» (з карпатських нотаток) – у вустах Палагни: сенс і краса життя – у самому житті.</p>`,

// 38 Кобилянська
{info:`<h4>Ольга Кобилянська (1863–1942)</h4>
<ul><li>Народилася <b>27 листопада 1863 р.</b> в м. Гура-Гуморулуї на півдні Буковини (нині Румунія). Батько Юліан – урядовець; мати Марія Вернер (з німецько-польського роду) вивчила українську мову.</li>
<li>Уся родина – музично обдарована. Ольга закінчила лише чотири класи, далі навчалася самостійно; спершу писала німецькою.</li>
<li>Під впливом С. Окуневської та Н. Кобринської почала писати українською. Повість «Людина» (1892) – початок шляху української письменниці.</li>
<li>З 1891 р. – Чернівці; феміністичний рух. Твори «Царівна», «Земля», «Природа», «Некультурна», «У неділю рано зілля копала».</li>
<li>Дружба з Лесею Українкою (з 1899 р., Зелений Гай). Драма особистого життя – О. Маковей. 1903 р. – частковий параліч.</li>
<li>Померла <b>21 березня 1942 р.</b> у Чернівцях; там меморіальний музей.</li></ul>
<h4>Тематика творчості</h4>
<p>Започаткувала новий, модерністський етап прози. Улюблений стиль – <b>неоромантизм</b>, у деяких творах – символізм.</p>
<ul><li>душа жінки-інтелігентки, її боротьба за рівноправність («Людина»);</li>
<li>духовні основи селянського життя («Земля», «У неділю рано зілля копала»);</li>
<li>антилюдська сутність війни («Юда», «Лист засудженого вояка до своєї жінки»).</li></ul>`,

// 39 Impromptu phantasie
{info:`<h4>Новела «Impromptu phantasie» (1894)</h4>
<p>Impromptu phantasie (фр.) – фантазія-експромт. Кобилянська відчувала душевну спорідненість із <b>Ф. Шопеном</b>; новели «Impromptu phantasie» і «Valse melancolique» вона «компонувала на мотиви творів Шопена, імітуючи музичну композицію» (І. Денисюк). Тому їх називають <b>музичними (симфонічними)</b>.</p>
<h4>Образ героїні</h4>
<ul><li>Смілива, не терпить упокорення й приниження, має тонку душевну організацію; «ніжна, вразлива, немов мімоза» і водночас пристрасна, «що пригадує молодих арабських коней».</li>
<li>Відчуває світ у тонах і барвах: «вона бачила образи в тонах…».</li>
<li>Закохалася в музику з десяти років, коли почула гру молодого аристократа, що налаштовував фортепіано.</li>
<li>Грати так і не навчилася, але не уявляє життя без музики: «Коли чую музику — готова вмирати. Стаю тоді божевільно-відважна…»</li></ul>
<p>Новела має <b>автобіографічний характер</b> (Кобилянська: її життя – «нескінченний монотонний ноктюрн»). Музика й природа зливаються в одну барву. Новела-роздум.</p>`,

<li>Меланхолійна ніжна тональність – образ Софії Дорошенко.</li>

<li>З 1892 р. – медичний факультет Ягеллонського університету (Краків). Збірки «Синя книжечка» (1899), «Камінний хрест» (1900), «Дорога» (1901).</li>
<li>1908 р. – депутат Віденського парламенту. 1901–1916 рр. – творча пауза. Новели «Діточа пригода», «Марія», «Сини». 1919 р. – делегація ЗУНР на Акт Злуки в Києві.</li>

// 45 Камінний хрест – єдність із землею, танець
{info:`<h4>Ідея нерозривної єдності з рідною землею</h4>
<p>Через конкретно-історичну проблему еміграції автор розкриває вічну проблему <b>екології буття</b>. Незважаючи на непосильну працю, Іван був щасливим: почувався часткою рідної землі, її господарем. Іван, кінь і віз «лишали за собою сліди коліс, копит і широчезних п’ят Іванових», а зілля «скидало росу на ті сліди» – єдність із землею й Космосом.</p>
<p>Виїзд на чужину розриває цей зв’язок. Дідух та його родина передчувають муку безуспішної боротьби всіх емігрантів за збереження духовної ідентичності.</p>
<h4>Останній танець Івана</h4>
<p>Танець Івана з дружиною перед від’їздом – кульмінація, символ трагізму прощання з рідною землею, межового відчаю (символом розпачу від прощання з рідним краєм є саме <b>танець</b>).</p>
<p>У трагедії героя «по краплі зібрано горе тисяч емігрантів»: Стефаник проводжав земляків на Краківському вокзалі. Фільм Л. Осики «Камінний хрест» (1968) – шедевр українського кіно. Стефаник: «Я писав тому, щоб струни душі селянина так кріпко настроїти й натягнути, щоби з цього вийшла велика музика Бетховена».</p>`,

{info:`<h4>Поетичні збірки</h4>
<p>«<b>На крилах пісень</b>» (1893), «Думи і мрії» (1899), «Відгуки» (1902). Кожна збірка – продуманий настроєвий малюнок; тяжіння до циклів. Цикл «<b>Сім струн</b>»: «Do» (гімн), «Re» (пісня), «Mi» (колискова), «Fa» (сонет), «Sol» (рондо), «La» (ноктюрн), «Si» (септима). Відчуте І. Франком «м’яке жіноче серце» поетеси виявилося в інтимній і пейзажній ліриці.</p>

// 52 Мріє, не зрадь; Стояла я і слухала весну
{info:`<h4>«Мріє, не зрадь!..» (1905)</h4>
<p>Цикл «Пісні про волю» – думка про несумісність тиранії та свободи. Лірична героїня звертається до символічного образу мрії: «О, не згасни ти, світло безсонних очей!» Заради свободи вона відмовилася від решти бажань і навіть зреклася самого життя – самопожертва: «Вдарив час, я душею повстала сама проти себе, / і тепер вже немає мені вороття». <b>Головна ідея</b>: настав час, коли за свободу мусиш усе віддати. «Хто моря переплив і спалив кораблі за собою, / той не вмре, не здобувши нового добра».</p>
<h4>Пейзажна й інтимна лірика</h4>
<ul><li>Природа – жива, одухотворена сила, розрадниця, вияв душі України. Цикл «Подорож до моря» (1888); «Хвиля» (1908) – звукопис.</li>

{info:`<h4>«Лісова пісня» (1911): історія написання</h4>
<p>Найвищий мистецький здобуток Лесі Українки. Написана за три тижні в м. <b>Кутаїсі</b>. Ідея навіяна спогадами дитинства (Жабориця, Колодяжне): «я просто згадала наші ліси та затужила за ними». Твір створений на честь «волинських лісів».</p>

<li><b>Самознищення зла</b>: егоїзм матері й Килини накликає Куця й Злиднів.</li></ul>

<li><b>Передкульмінація</b>: Лукаш сватає Килину; Мавка йде до Того, що в скалі сидить.</li>

// 60 Олесь – життя, З журбою радість обнялась
{info:`<h4>Олександр Олесь (1878–1944)</h4>
<ul><li>Справжнє прізвище – <b>Кандиба</b>. Народився <b>5 грудня 1878 р.</b> на хуторі біля Білопілля (Сумщина). Дід Василь виховував у українському дусі.</li>
<li>Дергачівська хліборобська школа; 1903 р. – Харківський ветеринарний інститут; відкриття пам’ятника І. Котляревському в Полтаві.</li>
<li>Наречена Віра Свадковська називала його Олесем. 1907 р. – перша збірка «<b>З журбою радість обнялась</b>».</li>
<li>Грав на арфі, лірі, кобзі; понад 80 композиторів писали музику на його вірші (М. Лисенко – «Айстри»).</li>
<li>1919 р. – еміграція (Відень, з 1923 р. Прага). Цикл «Голод», драма «Земля обітована». Помер <b>22 липня 1944 р.</b> у Празі; 2017 р. перепохований у Києві на Лук’янівському кладовищі.</li></ul>
<h4>Стиль</h4>
<p>Переважно неоромантична манера: загострена чутливість, щирий ліризм, переосмислення фольклору, антитези й контрасти, гама звуків і кольорів, мелодійність. У деяких творах – символізм («По дорозі в Казку», «Над Дніпром»).</p>
<h4>«З журбою радість обнялась…»</h4>
<p>Провідний мотив – повнота життя в єдності протилежностей. Журба і радість, щастя і мука – антитези. Засоби – <b>антитеза й оксиморон</b>: «В обіймах з радістю журба. / Одна летить, друга спиня… / І йде між ними боротьба, / І дужчий хто, не знаю я».</p>`,

{info:`<h4>«Чари ночі»</h4>

<li>Контраст: «Гори! — життя єдина мить, / Для смерті ж — вічність ціла».</li></ul>

// 62 О слово рідне
{info:`<h4>Громадянсько-патріотична лірика</h4>
<p>Друга збірка – «<b>Будь мечем моїм!</b>» (1909; цензура заборонила назву – вийшла як «Поезії. Книга ІІ»). Вірші «Капітану Шмідту», «Три менти», «Яка краса: відродження країни!», «Айстри» (символ: айстри, убиті холодом, – занепадницькі настрої після 1905 р.).</p>
<h4>«О слово рідне! Орле скутий!..»</h4>
<ul><li>Продовжуючи традицію Т. Шевченка й Лесі Українки, поет порушує проблему рідного слова; захоплюється ним і картає колонізаторів та безбатченків.</li>
<li><b>Провідний мотив</b> – значення рідної мови в житті народу.</li>
<li>Риторичні вигуки та звертання; метафоричні епітети: «співочий грім», «шовковий спів», «левій рев Дніпра».</li>
<li>Ідея – у міфологічно-біблійних символах: «О слово! Будь мечем моїм! / Ні, сонцем стань! Вгорі спинися, / Осяй мій край і розлетися / Дощами судними над ним».</li>
<li><b>Меч</b> – войовнича грань слова й національної душі; <b>сонце</b> – миролюбна, творча; «скутий орел» – поневолене слово.</li></ul>`,

// 63 По дорозі в Казку
{info:`<h4>Драматичний етюд «По дорозі в Казку» (1908)</h4>
<p>Збірка «Драматичні етюди» (1914) – символістська поетика; традиція Г. Ібсена, Г. Гауптмана, М. Метерлінка. Тема – трагічне протистояння непересічної особистості й сірої маси; народ і провідник на шляху до мети.</p>
<ul><li>Народ заблудив у лісі. <b>Він</b> – юнак, що береться вивести людей у прекрасну країну <b>Казку</b>. Він починає сумніватись у своїх силах – зневірюється й народ; юрба вбиває провідника.</li>
<li>Символізує суспільні настрої після поразки Революції 1905 р.</li>
<li><b>Хлопчик із Казки</b> («років десяти») – моральна чистота ідей, молоде покоління.</li>
<li><b>Дівчина</b> – віра в себе, духовна міцність, символ світлих днів майбутнього.</li>
<li>Дорога – символ блукань, страждань, що очищують; дорога в Казку – символ духовних поривань до кращого життя.</li></ul>
<p>Перегукується з «Мойсеєм» І. Франка (Казка – Ханаан), але Олесів герой самостійний і сам відповідає за свою слабкість. Етюд показує боротьбу, а не перемогу.</p>
<h4>Теорія літератури</h4>
<p><b>Драматичний етюд</b> (грецьк. drama – дія; фр. etude – вивчення, нарис) – невеликий одноактний віршований чи прозовий драматичний твір із філософсько-ліричними настроєвими «картинками» життя.</p>`,

    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("ul10_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Українська література 10`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("ul10_theme",d.dataset.theme); }
const th=store.get("ul10_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
</body>
