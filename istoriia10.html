// 63 §51 Форсована індустріалізація в УСРР (УРСР)
{info:`<h4>Курс на індустріалізацію</h4>
<ul><li>Індустріалізація мала забезпечити економічну незалежність від капіталістичного оточення, потужну армію; за змістом — <b>імпортозамінна</b>, пріоритет — <b>важка промисловість</b>.</li>
<li>Грудень <b>1925 р.</b> — <b>XIV з’їзд ВКП(б)</b> проголосив курс на індустріалізацію; 1927 р. — пріоритет плану над ринком (згортання непу).</li>
<li><b>Перша п’ятирічка (1928/1929—1932/1933 рр.)</b> почалася 1 жовтня 1928 р.; гасло «П’ятирічку за чотири роки!». Й. Сталін: «Ми відстали від передових країн на 50—100 років. Ми маємо пробігти цю відстань за десять років».</li>
<li>В Україні зводили 400 із 1,5 тис. підприємств: «Запоріжсталь», «Криворіжсталь», «Азовсталь», <b>ДніпроГЕС</b>, Харківський тракторний завод. Залучали іноземних інженерів (Х’ю Купер — ДніпроГЕС).</li></ul>
<h4>Джерела індустріалізації</h4>
<p>Переважно <b>внутрішні</b>: «ножиці цін», експорт зерна (навіть у роки Голодомору), згортання непу, інфляція, примусові позики, розкуркулення і колективізація, праця в’язнів (<b>ГУЛАГ</b>, 1930 р.; Біломорканал), «п’яні гроші», «Торгсин», соціалістичне змагання.</p>
<h4>Репресії та стимули</h4>
<ul><li>1928 р. — <b>Шахтинська справа</b>; теза Сталіна про загострення класової боротьби; «Промпартія».</li>
<li>1932 р. — трудові книжки, прописка; робітфаки.</li>
<li>Друга п’ятирічка (1933—1937 рр.): «Кадри вирішують усе!».</li>
<li>У ніч на <b>31 серпня 1935 р.</b> <b>Олексій Стаханов</b> видобув 102 т вугілля (норма — 7 т) — <b>стахановський рух</b>.</li></ul>
<h4>Наслідки</h4>
<p>УРСР стала <b>індустріально-аграрною</b>: друге місце в Європі за виплавкою чавуну, третє — за сталлю, четверте у світі — за вугіллям. Урбанізація (кожен третій — у містах), формування українського робітництва. Водночас — домінування групи «А», дефіцит товарів, <b>командно-адміністративна система</b>.</p>`,

// 64 §52 Насильницька колективізація та опір населення. Голодомор 1932–1933 рр.
{info:`<h4>Колективізація</h4>
<ul><li>Мета: забезпечити місто й армію продовольством, промисловість — сировиною й робочою силою; зламати незалежного селянина-власника.</li>
<li>Листопад <b>1929 р.</b> — рішення про <b>суцільну прискорену колективізацію</b>; в Україні — найвищі темпи. «Двадцятип’ятитисячники».</li>
<li>Опір: 1930 р. — 4,1 тис. виступів (1,2 млн селян), найбільше — Павлоградське повстання; забій худоби (поголів’я скоротилося наполовину).</li>
<li>Стаття Й. Сталіна <b>«Запаморочення від успіхів»</b>; масовий вихід із колгоспів; восени 1930 р. — нова хвиля.</li>
<li><b>Розкуркулення</b>: грудень 1929 р. — «ліквідація куркульства як класу»; експропрійовано близько 300 тис. господарств, 860 тис. осіб виселено на Північ і до Сибіру.</li>
<li>Перша <b>МТС</b> — 1928 р. (радгосп ім. Т. Шевченка, Одещина).</li></ul>
<h4>Голодомор 1932—1933 рр.</h4>
<ul><li><b>7 серпня 1932 р.</b> — постанова про охорону соціалістичної власності — <b>«закон про п’ять колосків»</b>.</li>
<li>Осінь 1932 р. — хлібозаготівельна комісія <b>В. Молотова</b>; вилучення насіннєвого фонду; <b>«натуральні штрафи»</b>, <b>«чорні дошки»</b> (82 райони); подвірні обшуки, конфіскація будь-якої їжі.</li>
<li>Грудень 1932 р. — внутрішні <b>паспорти</b> (не для селян); оточення України загороджувальними загонами; замовчування голоду.</li>
<li>П. Постишев — погром КП(б)У; переселення росіян і білорусів у спорожнілі села (117 тис. осіб).</li>
<li>Жертвами Голодомору в Україні (фізично постраждалі та померлі) були <b>25,5 млн</b> селян.</li></ul>
<p><b>28 листопада 2006 р.</b> Верховна Рада ухвалила Закон «Про Голодомор 1932—1933 років в Україні» — визнано <b>геноцидом</b> українського народу. 2010 р. Апеляційний суд Києва визнав винними Й. Сталіна, В. Молотова, П. Постишева, Л. Кагановича, В. Чубаря, С. Косіора, М. Хатаєвича. День пам’яті — <b>четверта субота листопада</b>.</p>`,

// 65 §53 Сталінський терор в Україні. Конституція СРСР 1936 р.
{info:`<h4>Тоталітарний режим</h4>
<ul><li>1929 р. — «рік великого перелому»: остаточно склався <b>тоталітарний режим</b>. Владу здійснювала ВКП(б), в УСРР — КП(б)У.</li>
<li>Масові організації: творчі спілки, профспілки, <b>ВЛКСМ</b>, піонери; єдина ідеологія — марксизм-ленінізм.</li>
<li>21 грудня 1929 р. — 50-річчя Й. Сталіна — початок <b>культу особи</b>. Страх — важливий елемент контролю.</li></ul>
<h4>Репресії в Україні</h4>
<ul><li>1924 р. — процес «Центру дій»; <b>1930 р.</b> — процес <b>«Спілки визволення України»</b> у Харкові (С. Єфремов, В. Чехівський) — «театр у театрі»; заарештовано понад 30 тис. осіб.</li>
<li>1933 р. — самогубство М. Хвильового і М. Скрипника; погром письменників (близько 500 за «сталінський період»).</li>
<li>1 грудня 1934 р. — убивство <b>С. Кірова</b>; «спрощений порядок» розгляду справ; процес «Об’єднання українських націоналістів».</li>
<li><b>1937—1938 рр.</b> — <b>«великий терор»</b>: катування на допитах; знищено керівництво КП(б)У (з 62 членів ЦК — 56, зокрема С. Косіор); новий перший секретар — <b>М. Хрущов</b>; стратили Й. Якіра. Ліміт на 1938 р. для України — 30 тис. осіб.</li>
<li>З 1929 р. до 21 червня 1941 р. жертвами репресій стали <b>739 920</b> громадян України. Місця пам’яті — <b>Биківня</b>, Сандармох.</li></ul>
<h4>Конституція СРСР 1936 р.</h4>
<p>Грудень <b>1936 р.</b>: задекларовано побудову соціалізму; прямі, рівні вибори з таємним голосуванням; свободи слова, друку, недоторканність особи. Закріплено панівну роль Комуністичної партії. Січень 1937 р. — Конституція <b>УРСР</b>. В умовах терору права були фікцією; на виборах 1937 р. — один кандидат.</p>`,

// 66 §54 Національна революція в Китаї
{info:`<h4>«Рух 4 травня»</h4>
<p>Китай залишався напівколонією, владу мали мілітаристи. Рішення Паризької конференції передати Японії Шаньдун спричинило <b>4 травня 1919 р.</b> протест студентів Пекіна — <b>«Рух 4 травня»</b>; китайська делегація не підписала Версальський мир. Відновлено <b>Гоміндан</b> (Сунь Ятсен). 1921 р. — <b>Комуністична партія Китаю (КПК)</b>; 1921 р. — Монгольська Народна Республіка.</p>
<h4>Національна революція 1925—1927 рр.</h4>
<ul><li>Угода Сунь Ятсена з СРСР; союз Гоміндану й КПК; 1923 р. — уряд у Гуанчжоу.</li>
<li>1925 р. Сунь Ятсен помер; наступник — <b>Чан Кайші</b>.</li>
<li><b>30 травня 1925 р.</b> — повстання в Шанхаї («Рух 30 травня») — початок революції.</li>
<li>Липень 1926 р. — <b>Північний похід</b> (план В. Блюхера); столиця — <b>Нанкін</b>. Квітень 1927 р. — погром комуністів; 1928 р. Чан Кайші взяв Пекін і завершив об’єднання Китаю.</li></ul>
<h4>Громадянська війна та японська агресія</h4>
<ul><li>КПК — партизанська боротьба; 1934—1935 рр. — <b>«Великий похід»</b> комуністів; новий лідер — <b>Мао Цзедун</b> (революція буде селянською).</li>
<li>Реформи Чан Кайші: митна автономія, державне планування, аграрний закон 1930 р.</li>
<li><b>1932 р.</b> — Японія створила в Маньчжурії маріонеткову державу <b>Маньчжоу-Го</b> (Пу І).</li>
<li><b>1937 р.</b> — японо-китайська війна; відновлення союзу Гоміндану та КПК. До 1939 р. Японія окупувала весь Східний Китай.</li></ul>`,

// 67 §55 Національно-визвольна боротьба в Індії
{info:`<h4>Після Першої світової війни</h4>
<ul><li>1919 р. — закон про управління Індією (виборців — з 1 до 3 %) і <b>закон Роулетта</b> (посилення покарань).</li>
<li>Рух громадянської непокори очолив <b>Індійський національний конгрес (ІНК)</b> на чолі з <b>Могандасом Ганді</b> («Магатма» — «велика душа»).</li>
<li><b>Гандизм</b>: суспільство соціальної справедливості (сарвадайя), ненасильницькі методи — бойкот, мирні демонстрації, відмова від співпраці (<b>сатьяграха</b>). Символ — традиційна прядка.</li>
<li><b>13 квітня 1919 р.</b> — розстріл мирної демонстрації в <b>Амрітсарі</b> (понад 1 тис. загиблих).</li>
<li>1920—1922 рр. — друга акція непокори; припинена Ганді після насильства.</li></ul>
<h4>1930-ті рр.</h4>
<ul><li><b>Дж. Неру</b> висунув гасло <b>«пурна сварадж»</b> — повна незалежність.</li>
<li>Бойкот комісії Дж. Саймона; <b>26 січня 1930 р.</b> — день незалежності Індії.</li>
<li><b>12 березня — 5 квітня 1930 р.</b> — <b>«Соляний похід»</b> М. Ганді до Аравійського моря; близько 60 тис. ув’язнених. 1931 р. — угода, конференція «круглого столу» в Лондоні.</li>
<li><b>1935 р.</b> — <b>Акт про управління Індією</b>: федеральний домініон, виборче право 12 %. 1937 р. — ІНК переміг у 8 з 11 провінцій.</li>
<li><b>Мусульманська ліга</b> — за окрему країну <b>Пакистан</b> («Країну чистих»).</li></ul>`,

// 68 §56 Національні революції в Туреччині та Ірані
{info:`<h4>Туреччина</h4>
<ul><li>Після поразки — окупація: Франція — Кілікія, Англія — Стамбул, Італія та Греція — Мала Азія.</li>
<li>Рух за цілісність країни очолив генерал <b>Мустафа Кемаль</b>; у <b>Анкарі</b> скликано меджліс — великі національні збори.</li>
<li>Уряд султана підписав <b>Севрський договір (10 серпня 1920 р.)</b>; Кемаль його не визнав — <b>греко-турецька війна (1919—1922 рр.)</b>.</li>
<li>Березень 1921 р. — договір із радянською Росією про дружбу (Карська область — Туреччині), січень 1922 р. — з УСРР (делегація М. Фрунзе).</li>
<li><b>26 серпня 1922 р.</b> — перемога біля Карахісара; падіння Смірни (Ізміра).</li>
<li><b>1923 р.</b> — <b>Лозаннський договір</b>; Туреччина — <b>республіка</b>.</li>
<li>Реформи: відділення церкви від держави, скасування халіфату (1924 р.), латинський алфавіт, прізвища (Кемаль — <b>Ататюрк</b>, «батько турків»), заборона багатоженства, державний сектор.</li></ul>
<h4>Іран</h4>
<ul><li>1918 р. — англійська окупація; англо-іранська угода (уряд Восуга ед-Доуле).</li>
<li>1920 р. — повстання в Тебризі (шейх М. Хіябані); <b>Гілянська республіка</b> (Кучек-хан).</li>
<li>Лютий 1921 р. — похід козаків <b>Реза-хана</b> на Тегеран; угода з радянською Росією 1921 р.; британські війська виведено.</li>
<li><b>12 грудня 1925 р.</b> — Реза-хан проголошений шахом — <b>Реза-шах Пехлеві</b>.</li>
<li>Реформи: індустріалізація, світські школи, Тегеранський університет, 1935 р. — декрет про зняття чадри, сонячне літочислення.</li>
<li>1930-ті рр. — зближення з Німеччиною; 1937 р. — Саадабадський пакт.</li></ul>`,

// 69 §57 Країни Латинської Америки
{info:`<h4>Наслідки Першої світової війни</h4>
<p>Зростання цін на сировину й продовольство, розвиток промисловості, національного капіталу й робітництва; посилення впливу США після відкриття <b>Панамського каналу (15 серпня 1914 р.)</b>.</p>
<h4>Ліберальний реформізм 1920-х рр.</h4>
<ul><li><b>Аргентина</b>: президент <b>Іпполіто Іригоєн</b> — 8-годинний день, профспілки, земельна реформа (7,6 млн га); 1930 р. — переворот генерала Ф. Урибуру.</li>
<li><b>Чилі</b>: А. Алессандрі; диктатура К. Ібаньєса (1927—1931 рр.).</li>
<li><b>Уругвай</b>: Х. Батльє-і-Ордоньєс — державний сектор, соціальні гарантії, відокремлення церкви, скасування смертної кари.</li>
<li><b>Мексика</b>: «революційний каудилізм» — А. Обрегон, П. Е. Кальєс; 1924 р. Мексика першою в Західній півкулі визнала СРСР.</li>
<li><b>Бразилія</b>: рух молодих офіцерів — <b>тенентистів</b> (1922, 1924 рр.), «непереможна колона» Л. К. Престеса (25 тис. км).</li>
<li><b>Нікарагуа</b>: боротьба <b>А. Сандіно</b> проти американської окупації; 1933 р. — виведення військ США; диктатура А. Самоси (до 1979 р.).</li></ul>
<h4>1930-ті рр.</h4>
<ul><li>Криза — курс на <b>імпортозамінну індустріалізацію</b>, державний сектор, націоналізація нафти (Аргентина, Мексика, Болівія).</li>
<li>Бразилія — <b>Ж. Варгас</b>; Мексика — <b>Л. Карденас</b> (1934—1940 рр.): націоналізація залізниць і нафти.</li>
<li><b>Революція на Кубі 1933—1934 рр.</b> — повалення диктатури Х. Мачадо; згодом переворот Ф. Батісти; конституція 1940 р.</li>
<li>Війна Чако (Болівія — Парагвай).</li>
<li>З 1933 р. США — політика <b>«доброго сусіда»</b> замість «великого дрючка».</li></ul>`,

// 76 §59 Утворення осередків Другої світової війни. «Вісь Берлін—Рим—Токіо»
{info:`<h4>Невдачі колективних дій</h4>
<p>1930 р. — Лондонська конференція з морських озброєнь; 1932 р. — Женевська конференція з роззброєння закінчилася нічим. 1931 р. — мораторій на виплату боргів і репарацій; 1932 р. — ліквідація репарацій Німеччини. Митні й валютні «війни».</p>
<h4>Осередки війни</h4>
<ul><li><b>Далекий Схід</b>: восени <b>1931 р.</b> Японія окупувала <b>Маньчжурію</b> (провокаційний вибух біля Мукдена); 1932 р. — <b>Маньчжоу-Го</b> (Пу І). 1933 р. Японія вийшла з Ліги Націй. Уперше агресія залишилася безкарною. 1937 р. — відкрита війна проти Китаю.</li>
<li><b>Африка</b>: <b>3 жовтня 1935 р.</b> Італія напала на <b>Ефіопію</b>; Ліга Націй оголосила Італію агресором і ввела економічні санкції; травень 1936 р. — завоювання Ефіопії. Імператор <b>Хайле Селассіє</b> звертався до Ліги Націй.</li>
<li><b>Європа (Німеччина)</b>: жовтень 1933 р. — вихід із Ліги Націй; 1935 р. — <b>Саар</b>, загальна військова повинність, англо-німецька морська угода; <b>березень 1936 р.</b> — введення військ у <b>Рейнську демілітаризовану зону</b>. Мета Гітлера — «життєвий простір» на сході.</li></ul>
<h4>«Вісь Берлін—Рим—Токіо»</h4>
<ul><li>Жовтень 1936 р. — договір Німеччини та Італії.</li>
<li><b>25 листопада 1936 р.</b> — <b>Антикомінтернівський пакт</b> Німеччини та Японії.</li>
<li><b>6 листопада 1937 р.</b> — приєдналася Італія — утворилася <b>«вісь Берлін—Рим—Токіо»</b>.</li>
<li>VII конгрес Комінтерну (1935 р.) оголосив Німеччину, Італію, Японію підпалювачами війни.</li></ul>`,

// 77 §60 Пакт Молотова—Ріббентропа. Початок Другої світової війни
{info:`<h4>«Українська карта»</h4>
<p>«Українське питання» намагалися використати нацисти (порушення стабільності ЧСР, Польщі, СРСР). Після Карпатської України Гітлер пішов на пряму згоду зі Сталіним.</p>
<h4>Пакт Молотова—Ріббентропа</h4>
<ul><li><b>23 серпня 1939 р.</b> у Москві <b>Й. фон Ріббентроп</b> і <b>В. Молотов</b> підписали <b>Пакт про ненапад</b> і <b>таємний протокол</b>: сфера інтересів СРСР — Фінляндія, Естонія, Латвія, Бессарабія; Німеччини — Литва; поділ Польщі по лінії Нарев, Вісла, Сян.</li></ul>
<h4>Початок війни</h4>
<ul><li><b>1 вересня 1939 р.</b> — напад Німеччини на Польщу (броненосець «Шлезвіг-Гольштейн» обстріляв Вестерплатте) — <b>початок Другої світової війни</b>.</li>
<li>3 вересня Англія і Франція оголосили війну Німеччині, але реальної допомоги не надали.</li>
<li>Абвер створив український легіон Р. Сушка.</li>
<li><b>17 вересня 1939 р.</b> — Червона армія перейшла польський кордон («визвольний похід»); Український фронт (С. Тимошенко). 22 вересня радянські війська зайняли <b>Львів</b>; спільні паради в Бресті та інших містах.</li>
<li><b>28 вересня 1939 р.</b> — <b>Договір про дружбу і кордон</b>: кордон приблизно по «лінії Керзона»; до СРСР — 51,4 % території Польщі.</li>
<li>Катинь (1940 р.) — розстріляно понад 22 тис. польських офіцерів.</li></ul>
<p>Українські й білоруські землі об’єдналися в одних республіках, але близько 500 тис. українців (Холмщина, Підляшшя, Лемківщина) потрапили до сфери Німеччини — Сталін керувався власними стратегічними інтересами.</p>`,

// 79 §62 Бойові дії в Європі в 1939–1941 рр.
{info:`<h4>«Дивна війна» (3 вересня 1939 — 10 травня 1940 р.)</h4>
<p>Англія і Франція оголосили війну, але не воювали: французи — за «лінією Мажіно», німці — за «лінією Зігфріда».</p>
<h4>Захоплення Західної Європи</h4>
<ul><li><b>9 квітня 1940 р.</b> — напад на <b>Данію</b> і <b>Норвегію</b> (операція «Везерські навчання»); Данія одразу капітулювала; в Норвегії — В. Квіслінг.</li>
<li>Прем’єр-міністром Великої Британії став <b>В. Черчилль</b>.</li>
<li><b>10 травня 1940 р.</b> — вторгнення в Бельгію, Нідерланди, Люксембург; удар через <b>Арденни</b> (план «удар серпом»); танки Г. Гудеріана вийшли до Ла-Маншу. Евакуація з <b>Дюнкерка</b> (операція «Динамо»).</li>
<li>14 червня — німці в Парижі; <b>22 червня 1940 р.</b> — <b>капітуляція Франції</b> в Комп’єнському лісі. «Режим Віші» маршала А.-Ф. Петена. Генерал <b>Ш. де Голль</b> у Лондоні — Французький національний комітет.</li>
<li>3 липня 1940 р. — операція «Катапульта» (знищення французького флоту англійцями).</li></ul>
<h4>Середземномор’я та Балкани</h4>
<ul><li>Італія вступила у війну; невдачі в Африці; <b>28 жовтня 1940 р.</b> — напад Італії на <b>Грецію</b> — поразка; англійці розбили італійський флот у Таранто.</li>

// 80 §63 «Битва за Британію». Битва за Атлантику
{info:`<h4>«Битва за Британію»</h4>
<ul><li>Після капітуляції Франції Англія залишилася наодинці з Німеччиною; надія — флот.</li>
<li><b>16 липня 1940 р.</b> — план операції <b>«Морський лев»</b> (завоювання Англії); через нестачу засобів висадки вирішили підкорити Англію масовими бомбардуваннями.</li>
<li><b>8 серпня 1940 р.</b> — початок «битви за Британію» (Саутгемптон). Люфтваффе — 2,8 тис. літаків проти 600—700 англійських винищувачів.</li>
<li>Секрет оборони — <b>радари</b> (чутка про моркву для зору льотчиків). Винищувачі «Спітфаєр»; льотчики з багатьох країн (147 поляків, 89 чехів і словаків).</li>
<li>17 вересня 1940 р. Гітлер відклав «Морського лева»; знищено місто <b>Ковентрі</b>; втрати Англії — понад 30 тис. осіб, Німеччини — понад 2 тис. літаків.</li>
<li>В. Черчилль: «Ніколи на полях людських конфліктів не залежало так багато від стількох небагатьох».</li>

{info:`<h4>Центри українського руху</h4>
<ul><li><b>Уряд УНР в екзилі</b> (А. Лівицький): частина — за демократії, згодом — спроби співпраці з Німеччиною; ідея загонів «Січі» на Волині, з яких постала <b>«Поліська Січ»</b> <b>Тараса Боровця (Бульби)</b>.</li>
<li>Прихильники <b>П. Скоропадського</b> — нацисти оцінювали їхній вплив як вкрай низький.</li>
<li><b>ОУН</b> — найдієвіша сила; після загибелі Є. Коновальця (23 травня 1938 р., Роттердам, агент П. Судоплатов) — розкол.</li></ul>
<h4>Розкол ОУН (1940 р.)</h4>
<ul><li><b>ОУН(М)</b> — А. Мельник: боротьба проти СРСР у союзі з Німеччиною (Другий Великий збір у Римі, 27 серпня 1939 р.).</li>
<li><b>ОУН(Б)</b> — С. Бандера: державу можна вибороти <b>лише власними силами</b> й революційними методами (Другий Великий збір, Краків, квітень 1941 р.).</li>
<li>Обидві вважали головним ворогом радянську імперію та сталінський режим.</li></ul>
<h4>Українські формування</h4>
<p>Навесні 1941 р. у складі абверу — батальйони <b>«Роланд»</b> (Є. Побігущий) і <b>«Нахтігаль»</b> (сотник <b>Р. Шухевич</b>). Після арешту С. Бандери бійці відмовилися воювати; на їхній основі — 201 поліцейський батальйон; у грудні 1942 р. відмовилися присягати Гітлеру, більшість перейшла в УПА.</p>
<h4>Український Центральний Комітет</h4>

// 86 §66 Україна на початку німецько-радянської війни
{info:`<h4>Початок війни</h4>
<ul><li><b>22 червня 1941 р.</b> о 3:30 — напад Німеччини та союзників на СРСР за планом <b>«Барбаросса»</b> (190 дивізій, 5,5 млн осіб). В Україні — група армій «Південь» (Г. Рундштедт) проти Південно-Західного (М. Кирпонос) і Південного (І. Тюленєв) фронтів.</li>
<li><b>23—29 червня 1941 р.</b> — танкова битва в районі <b>Луцьк—Рівне—Дубно—Броди</b>; із 4,2 тис. танків залишилося 737.</li></ul>
<h4>Оборона і поразки 1941 р.</h4>
<ul><li><b>Оборона Києва (11 липня — 19 вересня 1941 р.)</b>, 71 день; вона змусила Гітлера відійти від плану «Барбаросса». Оточення під Лохвицею: у полон — 663 тис., загинув М. Кирпонос.</li>
<li>Оточення під <b>Уманню</b> (понад 100 тис. полонених).</li>
<li><b>Оборона Одеси (10 серпня — 16 жовтня 1941 р.)</b>.</li>
<li><b>Оборона Севастополя</b> — 250 днів (30 жовтня 1941 — 4 липня 1942 р.).</li>
<li>Грудень 1941 — січень 1942 р. — контрудар під Москвою.</li></ul>
<h4>1942 р.</h4>
<p>Невдалі спроби звільнити Харків: оточення під Барвінковим (227 тис. полонених); поразка на Керченському півострові. <b>4 липня 1942 р.</b> — захоплення Криму; <b>22 липня 1942 р.</b> — завершення окупації України. Під окупацію потрапило <b>92 %</b> довоєнного населення УРСР.</p>
<h4>Мобілізація та евакуація</h4>
<ul><li>30 червня 1941 р. — <b>Державний комітет оборони</b> (Й. Сталін); 3 липня — звернення Сталіна. Мобілізовано 2,5 млн осіб; народне ополчення — 1,3 млн.</li>
<li>Евакуйовано понад 550 великих підприємств, 3,5 млн осіб.</li>
<li>Тактика «спаленої землі»: підрив ДніпроГЕСу, Хрещатика, Успенського собору; НКВС знищив щонайменше 22 тис. політв’язнів.</li></ul>`,

// 87 §67 Нацистський «новий порядок» в Україні
{info:`<h4>«Новий порядок»</h4>
<p>Українські землі мали стати «життєвим простором» для «арійської раси»; народи підлягали знищенню або виселенню. Каральні органи — гестапо, СД, СС; допоміжна поліція. Наміри — у плані <b>«Ост»</b>.</p>
<h4>Окупаційні зони</h4>
<ul><li><b>Рейхскомісаріат Україна</b>; <b>дистрикт Галичина</b> (режим менш жорстокий); <b>Трансністрія</b> (румунська, більш ліберальна); зона військової адміністрації (схід, Крим).</li></ul>
<h4>Терор</h4>
<ul><li>На окупованих територіях загинуло <b>3,9 млн</b> мирних жителів; 180 концтаборів, понад 350 гетто; знищено 670 сіл (найбільше — <b>Корюківка</b>, 7 тис. жителів).</li>
<li><b>Бабин Яр</b> (Київ, 100—150 тис.), Дробицький Яр (Харків), Доманівка, Богданівка.</li>
<li>Знищено майже 2 млн військовополонених (Янівський, Славутинський табори, Уманська Яма). Наказ Сталіна № 270 (8 серпня 1941 р.): полон — «злісне дезертирство».</li>
<li>План <b>«Бакке»</b> — штучний голод у містах.</li></ul>
<h4>Пограбування й експлуатація</h4>
<ul><li>До березня 1944 р. вивезено 9,2 млн т зерна; колгоспи збережено як «громадські двори»; поборів безліч; пограбування музеїв.</li>
<li><b>Остарбайтери</b>: з вересня 1942 р. масовий вивіз; з України вивезено <b>2,2—2,7 млн осіб</b> (80 % вивезених з СРСР).</li>
<li>Допоміжні українські <b>управи</b> допомагали людям вижити (освіта, лікарні, кооперація).</li></ul>`,

// 88 §68 Колабораціонізм. Українці на боці Третього рейху
{info:`<h4>Колабораціонізм</h4>
<p>Допоміжна адміністрація (бургомістри, старости, допоміжна поліція); на співпрацю з окупантами пішло близько <b>1 %</b> населення України. Для України термін «зрадник» застосовувати складно: кого «зраджували» українці і якою для них була радянська влада?</p>
<h4>Причини співпраці</h4>
<ul><li>Помста радянській владі (репресії, розкуркулення) — 20—30 %.</li>
<li>Ідеологічне несприйняття комунізму; страх за життя; кар’єризм (комуністів і комсомольців серед колаборантів — 30—50 %).</li>
<li>Наказ № 270 і вороже ставлення до тих, хто опинився в окупації; нацистська пропаганда.</li>
<li>Прагнення за допомогою Німеччини боротися за Українську державу.</li></ul>
<h4>Українські формування</h4>
<ul><li>1939 р. — легіон Р. Сушка; 1941 р. — «Роланд», «Нахтігаль»; Буковинський курінь.</li>
<li><b>28 квітня 1943 р.</b> — набір до дивізії <b>ваффен-СС «Галичина»</b> (охочих — 62—84 тис.); ОУН(Б) виступила проти. Розгром під <b>Бродами</b> (1944 р.); згодом — Перша українська дивізія УНА.</li>
<li>50 поліцейських батальйонів «Шума», «гіві», Українське визвольне військо; протитанкова бригада «Україна» П. Д’яченка.</li>
<li>У німецькій армії 1944 р. — 220 тис. українців; в угорській — 40—50 тис., у румунській — 40—80 тис.</li></ul>
<p>У 1943—1957 рр. за зв’язки з окупантами в УРСР засуджено 93,7 тис. осіб.</p>`,

// 89 §69 Голокост
{info:`<h4>Що таке Голокост</h4>
<p><b>Голокост</b> (Шоа) — планомірне й організоване знищення єврейського населення в роки Другої світової війни. Жертвами стали <b>6 млн</b> євреїв (в Україні — до <b>1,4 млн</b>).</p>
<h4>Етапи знищення</h4>
<ul><li>Після загарбання Польщі — <b>гетто</b>; після нападу на СРСР — повне винищення.</li>
<li><b>Айнзатцгрупи</b> (в Україні — «С» і «D») знищили близько 750 тис. євреїв.</li>
<li><b>Бабин Яр</b>: лише <b>29—30 вересня 1941 р.</b> — 33 711 осіб; страти тривали до 1943 р. (євреї, роми, підпільники, О. Теліга та ін.).</li>
<li>Кам’янець-Подільський (26—29 серпня 1941 р., 23 тис.); Богданівка (понад 40 тис.); Дробицький Яр; у Галичині загинуло 610 тис.</li>
<li>Січень 1942 р. — <b>табори смерті</b> з газовими камерами (Треблінка, Собібор, Майданек, <b>Аушвіц-Біркенау</b>, Белжец) — 2,5 млн загиблих.</li></ul>
<h4>Опір і порятунок</h4>
<ul><li>Повстання в гетто; найбільше — <b>Варшавське (квітень — червень 1943 р.)</b>.</li>
<li>Митрополит <b>Андрей Шептицький</b> закликав переховувати єврейських дітей у монастирях; звання «Праведник світу» отримали <b>2573</b> громадянина України.</li>
<li><b>27 січня 1945 р.</b> воїни Першого Українського фронту звільнили Аушвіц — з 2005 р. <b>Міжнародний день пам’яті жертв Голокосту</b>.</li></ul>`,

// 90 §70–71 Спроба відновлення Української держави. Початок збройної боротьби УПА
{info:`<h4>Акт 30 червня 1941 р.</h4>
<ul><li>ОУН(Б) сформувала <b>похідні групи</b> (5 тис. осіб) для створення органів влади.</li>
<li><b>30 червня 1941 р.</b> у <b>Львові</b> Національні збори; <b>Ярослав Стецько</b> оголосив <b>Акт відновлення Української держави</b>; Українське державне правління.</li>
<li>Нацисти почали репресії: 9 липня заарештовано Я. Стецька, С. Бандеру — до концтабору; з листопада 1941 р. — наказ таємно страчувати членів ОУН(Б).</li></ul>
<h4>ОУН(М) і УНРада</h4>

// 91 §71 Рух Опору та його течії в Україні
{info:`<h4>Рух Опору у світі</h4>
<p>Рух Опору виник в усіх окупованих країнах; наймогутніший — в Україні, Білорусії, Польщі, Югославії, Франції, Греції; в Азії — у Китаї, Бірмі, на Філіппінах.</p>
<h4>Радянський рух Опору</h4>
<ul><li>Почався одразу після початку війни, але погано підготовлений: із 3,5 тис. загонів улітку 1942 р. діяли лише 22.</li>
<li>Травень <b>1942 р.</b> — <b>Український штаб партизанського руху</b> (<b>Т. Строкач</b>).</li>
<li>Командири: <b>С. Ковпак</b>, О. Федоров, М. Наумов, О. Сабуров.</li>
<li>26 жовтня 1942 р. — рейд Ковпака і Сабурова на захід; «Степовий» рейд М. Наумова; <b>Карпатський рейд</b> С. Ковпака (червень — вересень 1943 р.).</li>
<li>Операції «Рейкова війна» і «Концерт» (1943 р.).</li></ul>
<h4>Націоналістичний рух Опору (ОУН і УПА)</h4>
<ul><li>УПА (з 14 жовтня 1942 р.) воювала проти нацистів (липень — листопад 1943 р. — 120 боїв), а також проти польських загонів і радянських військ.</li>
<li>На початок 1944 р. УПА — 80 тис. українців і 20 тис. представників інших народів.</li>
<li>Лідери ОУН відмовилися від співпраці з Німеччиною навіть після звільнення з концтаборів (вересень 1944 р.).</li>
<li>З 1944 р. — бої з радянською армією; смертельне поранення генерала <b>М. Ватутіна</b>. Лютий 1944 — січень 1946 р. — 39,7 тис. операцій проти УПА; депортації понад 200 тис. осіб; спецгрупи НКВС під виглядом УПА.</li>
<li><b>Р. Шухевич</b> загинув 5 березня 1950 р. в Білогорщі під Львовом.</li></ul>
<p>Течії руху Опору в Україні — радянська і націоналістична — ворогували між собою.</p>`,

// 92 §72 Польський рух Опору на західноукраїнських землях. Україно-польське протистояння
{info:`<h4>Польське підпілля</h4>
<ul><li>З 1939 р. — підпілля, кероване емігрантським урядом із Лондона.</li>
<li>Листопад 1941 — лютий 1942 р. — створення <b>Армії крайової (АК)</b> у Галичині й на Волині; план загальнонаціонального повстання <b>«Буря»</b>.</li>
<li>Також діяли Армія людова, Батальйони хлопські (10—20 тис. осіб у Галичині й на Волині).</li></ul>
<h4>Причини конфлікту</h4>
<ul><li>Давній україно-польський конфлікт; помилки політики Другої Речі Посполитої («пацифікація», «ревіндикація»); терористична діяльність УВО та ОУН.</li>
<li>Реалії війни: у конфлікті були зацікавлені нацистський і радянський режими (Е. Кох: «Нам треба домогтися, щоб поляк, зустрівши українця, хотів убити його…»).</li></ul>
<h4>Перебіг</h4>
<ul><li>Розпочалося на <b>Холмщині в 1942 р.</b>; взимку 1943 р. — Волинь. <b>11 липня 1943 р.</b> — одночасний напад підрозділів УПА на десятки сіл з польським населенням; подібна акція АК — 1944 р.</li>
<li>27 жовтня 1943 р. — наказ ОУН № 1/43 про заборону антипольських дій; 1 вересня 1944 р. ОУН відмовилася від антипольських акцій.</li>
<li>1945 р. — перемир’я на Закерзонні, спільна атака на Грубешів (травень 1946 р.).</li>
<li>Квітень <b>1947 р.</b> — операція <b>«Вісла»</b>: близько 150 тис. українців депортовано на північний захід Польщі.</li></ul>
<p>Жертви — десятки тисяч українців і поляків. Протистоянням скористався комуністичний режим. Волинська трагедія досі вивчається істориками обох країн.</p>`,

// 93 §73 Вступ у війну США. Бойові дії в АТР 1941–1942 рр. Антигітлерівська коаліція
{info:`<h4>Війна на Тихому океані</h4>
<ul><li>Японія захопила частину Китаю, отримала бази в Індокитаї; США, Британія, Нідерланди запровадили <b>ембарго</b> на нафту — рішення «просуватися на південь».</li>
<li><b>7 грудня 1941 р.</b> — напад японського флоту (адмірал <b>І. Ямамото</b>) на <b>Перл-Гарбор</b>: США втратили 19 кораблів, 272 літаки, понад 3 тис. військових.</li>
<li>8 грудня США та Велика Британія оголосили війну Японії; Німеччина й Італія — США. Наприкінці 1941 р. всі великі держави були втягнуті у війну.</li>
<li>Японія захопила Гонконг, Гуам, Філіппіни (травень 1942 р.), <b>Сингапур</b> (лютий 1942 р.), Індонезію, підійшла до Австралії — 150 млн населення.</li></ul>
<h4>Антигітлерівська коаліція</h4>
<ul><li>22 червня 1941 р. В. Черчилль: «Кожний, хто воює проти Гітлера, — друг Англії».</li>
<li>12 липня 1941 р. — англо-радянська угода; серпень — вересень 1941 р. — окупація Ірану.</li>
<li><b>14 серпня 1941 р.</b> — <b>Атлантична хартія</b> (Ф. Рузвельт і В. Черчилль); СРСР приєднався.</li>
<li><b>Ленд-ліз</b> (закон 11 березня 1941 р.): на СРСР припала третина поставок США (10,8 млрд із 30,3 млрд доларів).</li>
<li><b>1 січня 1942 р.</b> — <b>Декларація Об’єднаних Націй</b> 26 держав.</li>
<li>26 травня 1942 р. — союзний договір СРСР і Британії; 11 червня 1942 р. — угода СРСР і США. 1943 р. — розпуск Комінтерну.</li>
<li>Проблема <b>Другого фронту</b>: невдалий десант у Дьєппі (серпень 1942 р.); до 1944 р. головним залишався радянсько-німецький фронт.</li></ul>`,

// 94 §74 Корінний перелом у Другій світовій війні
{info:`<h4>Тихий океан</h4>
<ul><li>7—8 травня 1942 р. — битва в <b>Кораловому морі</b> (авіаносці); Японія відмовилася від вторгнення в Австралію.</li>
<li><b>4—6 червня 1942 р.</b> — битва біля атола <b>Мідуей</b>: флот І. Ямамото розбито американцями (Ч. Німіц); Японія перейшла до оборони.</li>
<li>Серпень 1942 — лютий 1943 р. — Гуадалканал.</li></ul>
<h4>Сталінградська битва (17 липня 1942 — 2 лютого 1943 р.)</h4>
<ul><li>Наступ на Сталінград і Кавказ; вуличні бої.</li>
<li><b>19 листопада 1942 р.</b> — контрнаступ за планом <b>«Уран»</b>; 23 листопада оточено 330 тис.</li>
<li>30 січня 1943 р. капітулював фельдмаршал <b>Ф. Паулюс</b>; 2 лютого — кінець битви. Втрати Німеччини — 1,5 млн осіб.</li>
<li>Значення: <b>початок корінного перелому</b>.</li>
<li>18 грудня 1942 р. — звільнено перше українське село Півнівка (Луганщина); 16 лютого 1943 р. — Харків (згодом знову втрачений).</li></ul>
<h4>Курська битва (липень — серпень 1943 р.)</h4>
<p>План «Цитадель»; <b>5 липня 1943 р.</b> — наступ; <b>12 липня</b> — танковий бій біля <b>Прохорівки</b>; 5 серпня — Орел і Бєлгород (перший салют у Москві); <b>23 серпня 1943 р.</b> — <b>Харків</b>.</p>
<h4>Битва за Дніпро (вересень — листопад 1943 р.)</h4>
<p>«Східний вал»; 23 плацдарми; невдачі на Букринському, удар із <b>Лютізького плацдарму</b>; <b>6 листопада 1943 р.</b> — звільнено <b>Київ</b>. 2438 Героїв Радянського Союзу; величезні втрати («чорносвитники»). Фронти перейменовано на Українські.</p>
<h4>Африка та Італія</h4>

// 96 §76 Депортація кримських татар та інших народів
{info:`<h4>Причини депортації</h4>
<p>Формальна причина — звинувачення в <b>зраді та співпраці з нацистами</b> (постанова ДКО № 5859-сс від <b>11 травня 1944 р.</b>). Справжня причина нез’ясована; історики називають: побоювання повстання в тилу в разі агресії проти Туреччини; перетворення Криму на військову базу.</p>
<h4>Перебіг</h4>
<ul><li>Депортація розпочалася на світанку <b>18 травня 1944 р.</b> і закінчилася 20 травня; на збори давали від кількох хвилин до півгодини.</li>
<li>За офіційними даними, виселено <b>183 155 осіб</b> (до Узбецької РСР) — як спецпоселенців.</li>
<li>Депортовано і ветеранів війни (до 1946 р. — близько 9 тис.); Амет-Хану Султану заборонили жити в Криму.</li>
<li><b>27 червня 1944 р.</b> — виселено вірмен, греків, болгар.</li></ul>
<h4>Наслідки</h4>
<ul><li>1945 р. — Крим понижено з автономної республіки до <b>області</b>; перейменовано понад 80 % населених пунктів з татарськими назвами.</li>
<li>Від голоду й хвороб першої зими померло від 15 до 46 % депортованих; до 1956 р. — статус спецпоселенців.</li>
<li>Право на повернення — формально 1974 р., фактично <b>1989 р.</b></li>
<li>Постанова Верховної Ради України від 12 листопада 2015 р.: депортацію визнано <b>геноцидом</b>; <b>18 травня</b> — День пам’яті жертв геноциду кримськотатарського народу.</li></ul>
<h4>Інші депортації</h4>
<p>1941 р. — німці Поволжя; 1943—1944 рр. — чеченці, інгуші, калмики, карачаєвці, балкарці; турки-месхетинці. На початок 1950-х рр. — 2,8 млн спецпоселенців.</p>`,

{info:`<h4>Східний фронт 1944 р.</h4>

{info:`<h4>Тегеранська конференція (28 листопада — 1 грудня 1943 р.)</h4>
<p>Перша зустріч «великої трійки» (<b>Й. Сталін, Ф. Рузвельт, В. Черчилль</b>). Обіцянка відкрити Другий фронт у травні 1944 р.; кордони Польщі по Одеру та «лінії Керзона»; згода СРСР вступити у війну з Японією.</p>
<h4>Ялтинська конференція (4—11 лютого 1945 р.)</h4>
<ul><li>Принципи <b>беззастережної капітуляції</b> Німеччини; «Декларація про визволену Європу».</li>
<li>Рішення заснувати <b>ООН</b>; вступ СРСР у війну з Японією (Південний Сахалін, Курили).</li>
<li>Розбіжності щодо репарацій, польського питання. Рішення конференцій лягли в основу <b>Ялтинської системи</b>, яка змінила Версальсько-Вашингтонську.</li></ul>
<h4>Потсдамська конференція (17 липня — 2 серпня 1945 р.)</h4>
<p>Г. Трумен, Й. Сталін, В. Черчилль (з 28 липня — К. Еттлі). Демілітаризація й денацифікація Німеччини, репарації, кордони; США повідомили про випробування атомної бомби.</p>

<ul><li>Конференція в <b>Сан-Франциско</b> (25 квітня — 26 червня 1945 р.); право стати членами ООН отримали <b>Українська РСР і Білоруська РСР</b>.</li>
<li><b>24 жовтня 1945 р.</b> — офіційна дата створення ООН. Органи: Генеральна Асамблея, Рада Безпеки (право «вето» — СРСР, США, Англія, Франція, Китай). Перший генсекретар — Трюгве Лі.</li></ul>

const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));


const SEC_STYLE = [
  {c:"#B4532A", i:"🧑‍🤝‍🧑"}, {c:"#3B5BA9", i:"⏳"}, {c:"#7A5A2E", i:"📜"},
  {c:"#A3243B", i:"🇺🇦"}, {c:"#1F7A72", i:"🏡"}, {c:"#6D3F8F", i:"🗺️"}, {c:"#8A6A1F", i:"🏛️"}, {c:"#2F5D50", i:"🕊️"}
];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("ui10_done") || {};
const SECTIONS = [];
LESSONS.forEach((l, i) => {
  let s = SECTIONS[SECTIONS.length - 1]; if (s && s.name !== l.section) s = null;
  if (!s) { s = {name:l.section, items:[], st:SEC_STYLE[SECTIONS.length % SEC_STYLE.length]};
    const m = /^Розділ\s+([IVXІ\d]+)\.\s*(.*)$/.exec(l.section);
    s.lab = m ? m[1] : ""; s.short = m ? m[2] : l.section.replace(/^Вступ\.\s*/, ""); SECTIONS.push(s); }
  s.items.push(i); l.sec = s; l.tnum = s.items.length;
});
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
let q = "";
function renderHome(){
  const total = LESSONS.length, dn = LESSONS.filter((_, i) => done[i + 1]).length;
  $("#app").innerHTML = `
  <section class="hero">
    <div>
      <div class="kick">Ліцей «ЯСНО» · 10 клас · Машина часу</div>
      <h1>Історія: <em>Україна</em> і світ</h1>
      <p>Подорож у минуле за календарно-тематичним плануванням: головне з параграфа, ключові поняття-картки і тест до кожної теми.</p>
      <div class="prog"><div class="row"><span>Твій шлях</span><span>${dn} з ${total} тем</span></div><div class="tr"><i style="width:${100 * dn / total}%"></i></div></div>
    </div>
    <div class="eras">${SECTIONS.map((s, si) => `<a class="era" href="#sec${si}" style="--c:${s.st.c}"><span class="ic">${s.st.i}</span><span><small>${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}</small><b>${esc(s.short)}</b></span></a>`).join("")}</div>
  </section>
  <input class="search" id="search" type="search" placeholder="Знайти тему або поняття…" value="${esc(q)}" aria-label="Пошук">
  <div class="tl" id="tl"></div>
  <p class="foot">Підручник: ${esc(typeof BOOK_NAME !== "undefined" ? BOOK_NAME : "")}<br>Результати тестів зберігаються лише у твоєму браузері.</p>`;
  const S = $("#search"); S.oninput = () => { q = S.value; drawTL(); };
  drawTL();
  document.title = "Історія: Україна і світ · 10 клас";
}
function drawTL(){
  const t = q.trim().toLowerCase(); let any = false;
  $("#tl").innerHTML = SECTIONS.map((s, si) => {
    const items = s.items.filter(i => { const l = LESSONS[i]; return !t || (l.title + " " + (l.terms || []).map(x => x[0]).join(" ")).toLowerCase().includes(t); });
    if (!items.length) return ""; any = true;
    const d = s.items.filter(i => done[i + 1]).length;
    return `<section class="ep" id="sec${si}" style="--c:${s.st.c}">
      <div class="ep-n">${s.lab || "★"}</div>
      <div class="ep-h"><div><small>${s.st.i} ${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}</small><h2>${esc(s.short)}</h2></div><span class="cnt">${d} / ${s.items.length} пройдено</span></div>
      <div class="cards">${items.map(i => { const l = LESSONS[i]; return `<a class="card" href="#${i + 1}">${done[i + 1] ? '<span class="chk">✓</span>' : ""}
        <span class="tn">Тема ${l.tnum}${l.diag ? " · тренувальна" : ""}</span><span class="tt">${esc(l.title)}</span>
        <span class="tags">${(l.terms || []).slice(0, 3).map(x => `<span>${esc(x[0])}</span>`).join("")}</span></a>`; }).join("")}</div>
    </section>`;
  }).join("") || "";
  if (!any) $("#tl").innerHTML = '<p class="empty">Нічого не знайдено. Спробуй інше слово.</p>';
}
function shuffle(a, seed){ const r = a.slice(); let s = seed; for (let i = r.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor(s / 233280 * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; }
function renderLesson(i){
  const l = LESSONS[i], n = i + 1, s = l.sec, si = SECTIONS.indexOf(s);
  const qs = (l.q || []).map((qq, qi) => { const order = shuffle(qq[1].map((_, k) => k), n * 31 + qi * 7 + 3);
    return `<div class="qst" data-c="${qq[2]}"><div class="qt">${qi + 1}. ${esc(qq[0])}</div><div class="opts">` + order.map(k => `<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(qq[1][k])}</span></label>`).join("") + `</div></div>`; }).join("");
  const pl = i > 0 ? LESSONS[i - 1] : null, nl = i < LESSONS.length - 1 ? LESSONS[i + 1] : null;
  const navA = (x, k, cls) => x ? `<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls === "next" ? "Далі →" : "← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>` : "";
  const terms = l.terms || [];
  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div class="crumb"><a href="#">← Усі теми</a><span>·</span><a href="#sec${si}">${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}: ${esc(s.short)}</a></div>
    <div class="lhead"><span class="big">${l.tnum}</span>
      <div class="tn">${s.st.i} ${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1>
      <div class="chips">${l.codes ? l.codes.split(/,\s*/).map(c => `<span class="chip">${esc(c)}</span>`).join("") : ""}${l.pages ? `<span class="chip">📖 ${esc(l.pages)}</span>` : ""}<span class="chip">${terms.length} понять</span><span class="chip">${(l.q || []).length} ${qWord((l.q || []).length)}</span>${done[n] ? '<span class="chip">✓ Пройдено</span>' : ""}</div>
    </div>
    ${l.diag ? `<div class="panel" style="margin-top:18px;border-left:5px solid var(--gold)"><b>📝 Тренувальна діагностувальна робота.</b> Виконай завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div>` : ""}
    <div class="lgrid">
      <div>
        <div class="panel"><h2 class="ph"><span class="bi">📜</span>Головне з теми</h2>
          ${l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : ""}<div class="prose">${l.info || ""}</div></div>
        ${qs ? `<div class="panel quiz" id="test"><h2 class="ph"><span class="bi">✓</span>${l.diag ? "Тренувальні завдання" : "Перевір себе"}</h2>${qs}
          <div class="actions"><button class="btn" id="check" type="button">Перевірити</button><button class="btn ghost" id="reset" type="button">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>` : ""}
        <div class="nav">${navA(pl, n - 1, "prev")}${navA(nl, n + 1, "next")}</div>
      </div>
      <aside class="side">
        ${terms.length ? `<div class="panel"><h3>Ключові поняття</h3><button class="small" id="flipAll" type="button">Сховати значення</button>
          <div class="flash">${terms.map(t => `<button class="fc" type="button"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></button>`).join("")}</div></div>` : ""}
        <div class="panel toc"><h3>${s.lab ? "Розділ " + esc(s.lab) : "Вступ"}</h3>${s.items.map(k => `<a href="#${k + 1}" ${k === i ? 'aria-current="true"' : ""}><span class="n">${LESSONS[k].tnum}</span><span>${esc(LESSONS[k].title)}</span></a>`).join("")}</div>
      </aside>
    </div></div>`;
  const F = [...document.querySelectorAll(".fc")];
  F.forEach(f => f.onclick = () => f.classList.toggle("closed"));
  const fa = $("#flipAll"); if (fa) fa.onclick = () => { const c = !F[0].classList.contains("closed"); F.forEach(f => f.classList.toggle("closed", c)); fa.textContent = c ? "Показати значення" : "Сховати значення"; };
  if (qs) {
    $("#check").onclick = () => { let ok = 0; const all = document.querySelectorAll(".qst");
      all.forEach(x => { const c = x.dataset.c, sel = x.querySelector("input:checked");
        x.querySelectorAll(".opt").forEach(o => { o.classList.remove("right", "wrong"); if (o.dataset.k === c) o.classList.add("right"); });
        if (sel) { if (sel.value === c) ok++; else sel.closest(".opt").classList.add("wrong"); } });
      const r = $("#res"), p = ok / all.length; r.className = "result show " + (p >= .75 ? "good" : "mid");
      r.textContent = `Правильних відповідей: ${ok} з ${all.length}. ` + (p === 1 ? "Чудово! 🏆" : p >= .75 ? "Добре! Переглянь позначені питання." : "Перечитай «Головне з теми» і спробуй ще раз.");
      if (p >= .75) { done[n] = true; store.set("ui10_done", done); } };
    $("#reset").onclick = () => { document.querySelectorAll(".qst input").forEach(x => x.checked = false); document.querySelectorAll(".opt").forEach(o => o.classList.remove("right", "wrong")); $("#res").className = "result"; };
  }
  document.title = `${l.title} · Історія: Україна і світ 10`;
}
function route(){
  const h = location.hash.slice(1);
  if (/^sec\d+$/.test(h)) { if (!$("#tl")) renderHome(); const el = document.getElementById(h); if (el) el.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  const n = parseInt(h); if (n >= 1 && n <= LESSONS.length) renderLesson(n - 1); else renderHome(); window.scrollTo(0, 0);
}
function toggleTheme(){ const d = document.documentElement; const dark = d.dataset.theme ? d.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme = dark ? "light" : "dark"; store.set("ui10_theme", d.dataset.theme); }
const th = store.get("ui10_theme"); if (th) document.documentElement.dataset.theme = th;
window.addEventListener("hashchange", route);
route();
</script>
