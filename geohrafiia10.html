ки та української діаспори.", "nums": [{"v": "7,7 млн км²", "l": "площа Австралії (за даними підручника)"}, {"v": "≈ 23 млн осіб", "l": "населення країни (за даними підручника)"}, {"v": "менше 3 осіб/км²", "l": "середня густота населення"}, {"v": "≈ 90 %", "l": "частка міського населення (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення", "p": ["Австралія — єдина держава у світі, що повністю займає цілий материк, тож має лише морські кордони. Найближчі сусіди — Нова Зеландія, Папуа — Нова Гвінея та Індонезія. Територія компактна, крім материка, до неї належать острів Тасманія та безліч дрібних островів.", "Віддаленість від інших материків і головних морських шляхів довго гальмувала розвиток, але водночас убезпечила країну від війн і територіальних суперечок. Нині сучасний транспорт і зв’язок «наближають» Австралію до світу."], "ul": ["Омивається Тихим та Індійським океанами.", "Затока Карпентарія врізається в материк з півночі.", "Довжина берегової лінії — 25,7 тис. км (за даними підручника).", "Розташована переважно в тропічних широтах Південної півкулі.", "Ізольованість — головна риса ЕГП."]}, {"h": "Природні умови та ресурси", "p": ["Природно-ресурсний потенціал Австралії дуже великий. Особливо різноманітні рудні корисні копалини, які стали основою добувної промисловості й експорту.", "Значна частина материка зайнята пустелями й напівпустелями з посушливим кліматом, тому обмеженими є лише водні ресурси. Великі площі пасовищ і родючі землі сходу та південного сходу сприяють сільському господарству."], "ul": ["Багаті поклади залізних руд, бокситів, руд кольорових і рідкісних металів.", "Значні запаси вугілля, урану, золота, алмазів.", "Великі земельні ресурси — пасовища для вівчарства.", "Дефіцит прісної води у внутрішніх районах.", "Унікальна природа — основа міжнародного туризму."]}, {"h": "Склад і відтворення населення", "p": ["Для величезної країни населення невелике — приблизно як у місті Шанхаї. Більшість жителів — нащадки переселенців із Британських островів, що утворили англо-австралійську націю; решта — вихідці з інших країн Європи, Азії та корінні жителі — аборигени.", "Демографічна ситуація сприятливіша, ніж у Європі: природний приріст позитивний (близько 5 ‰ — за даними підручника), а тривалість життя дуже висока."], "ul": ["Аборигени — близько 300 тис. осіб (за даними підручника).", "Діти — 17,8 %, люди від 65 років — 16,1 % (за даними підручника).", "Середній вік — 38,6 року, очікувана тривалість життя — 82,2 року.", "Зростає кількість переселенців з Азії: Китаю, Індії, В’єтнаму, Філіппін.", "Переважають християни (протестанти, католики); вихідці з Азії сповідують буддизм, індуїзм, іслам."]}, {"h": "Розміщення населення та урбанізація", "p": ["Австралія — одна з найменш заселених частин світу. Понад 70 % населення живе на східному та південно-східному узбережжі, а центральні райони майже безлюдні.", "Рівень урбанізації дуже високий. Найбільші міста — на сході й південному сході, а також на південному заході."], "ul": ["Сідней — найбільше місто.", "Мельбурн і Брисбен — схід і південний схід.", "Перт і Аделаїда — південний захід і південь.", "Столиця — Канберра.", "Причини нерівномірності: посушливий клімат і пустелі в центрі."]}, {"h": "Трудові ресурси та міграційна політика", "p": ["Невисокий природний приріст не забезпечує потреб економіки, тому Австралія свідомо залучає кваліфікованих мігрантів: щороку Департамент імміграції оголошує перелік потрібних спеціальностей. Кожен четвертий житель народився за межами країни.", "Структура зайнятості типова для розвинених країн: найбільше людей працюють у сфері послуг."], "ul": ["Сфера послуг — 75,3 % зайнятих (за даними підручника).", "Промисловість — 21,1 %.", "Сільське господарство — 3,6 %.", "Майже половина економічно активного населення — іноземці (за даними підручника).", "Позитивне сальдо міграції — постійний приплив людей."]}, {"h": "Українська діаспора в Австралії", "p": ["Масова еміграція українців до Австралії почалася наприкінці 1940-х рр., коли після Другої світової війни люди з таборів переміщених осіб у Німеччині роз’їжджалися світом. Українські громади утворилися в столицях усіх шести штатів.", "Важливу роль у збереженні мови, історії, культури, звичаїв і віри відіграють українські суботні школи, а також театральні гуртки, хори, літературні клуби."], "ul": ["Близько 30 тис. осіб українського походження (перепис, за даними підручника).", "Громади — у столицях усіх штатів.", "Суботні (етнічні) школи — основа збереження мови.", "Хорові й музичні колективи, театральні гуртки.", "Після 2022 р. діаспора активно підтримує Україну, що протистоїть російській агресії."]}], "terms": [["Австралійський Союз", "офіційна назва держави Австралія — федерації, що займає цілий материк."], ["Аборигени", "корінні жителі Австралії, що належать до австралоїдної раси."], ["Переселенська країна", "країна, населення якої сформувалося переважно з іммігрантів та їхніх нащадків."], ["Сальдо міграції", "різниця між кількістю тих, хто прибув у країну, і тих, хто з неї виїхав."], ["Діаспора", "частина народу, що живе поза межами батьківщини, зберігаючи свою культуру."], ["Мультикультуралізм", "політика, спрямована на збереження та рівноправний розвиток культур різних етнічних груп у країні."]], "f": "Австралія — єдина у світі держава, яка повністю займає цілий материк, тому вона не має жодного суходільного кордону.", "pr": ["Порівняйте ЕГП Австралії та Японії: складіть таблицю спільних і відмінних рис (материк/острови, сусіди, океани, віддаленість від світових центрів).", "Позначте на онлайн-карті п’ять найбільших міст Австралії та столицю Канберру; поясніть у 3–4 реченнях, чому центр материка майже безлюдний."], "qz": [{"q": "Яка унікальна особливість Австралії як держави?", "o": ["Найбільша за площею у світі", "Повністю займає цілий материк", "Розташована в Північній півкулі", "Не має виходу до моря"], "a": 1, "why": "Австралія — єдина країна, що займає весь материк."}, {"q": "Яка головна риса ЕГП Австралії?", "o": ["Ізольованість від інших материків", "Велика кількість сусідів на суходолі", "Положення в центрі Європи", "Вихід лише до Атлантичного океану"], "a": 0, "why": "Віддаленість від інших частин світу — ключова риса її положення."}, {"q": "Яких природних ресурсів в Австралії недостатньо?", "o": ["Рудних", "Земельних", "Водних", "Енергетичних"], "a": 2, "why": "Через посушливий клімат обмеженими є лише водні ресурси."}, {"q": "Нащадки переселенців звідки становлять більшість населення Австралії?", "o": ["З Китаю", "З Британських островів", "З Індії", "З Африки"], "a": 1, "why": "Вони утворили англо-австралійську націю."}, {"q": "Де зосереджено понад 70 % населення Австралії?", "o": ["У центрі материка", "На північному узбережжі", "На острові Тасманія", "На східному й південно-східному узбережжі"], "a": 3, "why": "Тут найсприятливіший клімат і найбільші міста."}, {"q": "Яке місто є найбільшим в Австралії?", "o": ["Сідней", "Мельбурн", "Канберра", "Перт"], "a": 0, "why": "Сідней — найбільше місто країни."}, {"q": "Як Австралія забезпечує економіку робочою силою?", "o": ["Забороняє імміграцію", "Залучає кваліфікованих мігрантів за переліком потрібних спеціальностей", "Підвищує пенсійний вік до 80 років", "Використовує лише працю аборигенів"], "a": 1, "why": "Міграційна політика спрямована на приплив кваліфікованих працівників."}, {"q": "У якому секторі зайнята найбільша частка працівників Австралії?", "o": ["Сільське господарство", "Добувна промисловість", "Сфера послуг", "Обробна промисловість"], "a": 2, "why": "У сфері послуг працює 75,3 % зайнятих (за даними підручника)."}, {"q": "Коли почалася масова еміграція українців до Австралії?", "o": ["Наприкінці XIX ст.", "Перед Першою світовою війною", "Після 1991 р.", "Наприкінці 1940-х рр."], "a": 3, "why": "Переселенці з таборів переміщених осіб прибували після Другої світової війни."}, {"q": "Що відіграло важливу роль у збереженні української мови в австралійській діаспорі?", "o": ["Суботні українські школи", "Державні радіостанції Австралії", "Військові частини", "Торговельні компанії"], "a": 0, "why": "Етнічні суботні школи зберігали мову, історію й культуру."}], "section": "Розділ III. ОКЕАНІЯ", "topic": "Тема 1. Австралія", "sregion": "oceania", "sk": "oceania", "cid": "036", "cn": "Австралія"}, {"n": "28", "p": "28", "t": "Австралія: господарство", "pages": "с. 152–156", "g": "З’ясувати, чому Австралія з «сировинною» спеціалізацією є високорозвиненою країною, та охарактеризувати її промисловість, сільське господарство, послуги й зовнішні зв’язки.", "nums": [{"v": "68,2 %", "l": "частка сфери послуг у ВВП (2016 р., за даними підручника)"}, {"v": "понад 500 тис.", "l": "іноземних учнів і студентів зі 120 країн (за даними підручника)"}, {"v": "89 млн голів", "l": "поголів’я овець — 2-ге місце у світі після Китаю (за даними підручника)"}, {"v": "58,5 %", "l": "частка мінеральної сировини та агропродукції в експорті (за даними підручника)"}], "blocks": [{"h": "Особливості економіки", "p": ["Австралія — високорозвинена, інноваційна держава, один із ключових гравців у регіоні та світі. Її відносять до розвинених переселенських країн, для яких характерна особлива роль добувної промисловості.", "Приклад Австралії доводить, що сировинна спеціалізація не обов’язково означає відсталість: країна має також високорозвинену обробну промисловість і сферу послуг, що дає найбільший внесок у ВВП."], "ul": ["Чинник 1: значні мінеральні й земельні ресурси.", "Чинник 2: політика залучення іноземного капіталу та кваліфікованих мігрантів.", "Чинник 3: розташування поза межами військових конфліктів.", "Добувна промисловість визначає роль у міжнародному поділі праці.", "Структура ВВП: послуги — понад 2/3, промисловість — близько 28 %, сільське господарство — 3,6 % (за даними підручника)."]}, {"h": "Третинний сектор", "p": ["Розгалужена фінансова система, ядро якої — Резервний банк Австралії; найбільше банків і фінансових установ у Сіднеї та Мельбурні. Освітні послуги — одне з найважливіших джерел доходів: дипломи австралійських університетів визнають у всьому світі.", "Важливими напрямами стали ІТ-послуги (близько 10 % ВВП) і туризм. Розвинена транспортна система поєднує міста автодорогами, залізницями й авіалініями, а зовнішня торгівля здійснюється морем."], "ul": ["Провідні університети: Сіднейський, Мельбурнський, Квінслендський, Нового Південного Уельсу.", "Розвинене дистанційне навчання — 10 зі 100 студентів навчаються вдома.", "ІТ: електронна безпека, «електронний уряд», комп’ютерні ігри.", "Туризм: Сідней з Оперним театром, Великий Бар’єрний риф.", "Морські порти: Мельбурн, Сідней, Брисбен, Перт, Аделаїда.", "Мала авіація обслуговує віддалені райони."]}, {"h": "Добувна промисловість та енергетика", "p": ["Добувна промисловість має світове значення: Австралія входить до лідерів з видобутку вугілля, залізної руди, бокситів, урану, золота, алмазів, а також рідкісних металів (рутилу, цирконію). Більша частина сировини йде на експорт.", "Країна посідає одне з перших місць за виробництвом електроенергії на одну особу. Основу енергетики становлять ТЕС на вугіллі та газі; розвиваються сонячна, вітрова та гідроенергетика, атомних станцій немає."], "ul": ["Вугілля, залізна руда, боксити — головні експортні копалини.", "Уран, золото, алмази — світове значення.", "Рутил і цирконій — рідкісні метали.", "ТЕС дають 78,5 % електроенергії (за даними підручника).", "АЕС в Австралії відсутні."]}, {"h": "Обробна промисловість", "p": ["Продукція обробної промисловості переважно задовольняє внутрішні потреби. Підприємства зосереджені на сході та південному сході країни.", "Провідна галузь — машинобудування; на відміну від інших розвинених країн, велике значення має загальне машинобудування, пов’язане з обслуговуванням гірничодобувної та харчової промисловості."], "ul": ["Чорна металургія: Ньюкасл, Порт-Кембла.", "Кольорова металургія: алюміній, мідь.", "Машинобудування: обладнання для шахт і харчових підприємств, роботи, верстати, побутова техніка.", "Хімія: фосфатні й азотні добрива, пластмаси, синтетичний каучук.", "Легка й харчова: Мельбурн, Сідней, Брисбен, Перт, Гобарт."]}, {"h": "Сільське господарство", "p": ["Сільське господарство разом із добувною промисловістю визначає міжнародну спеціалізацію Австралії. Країна — потужний виробник зерна та продукції тваринництва: м’яса, молока, масла, сирів і вовни.", "Вівчарство — «візитна картка» Австралії: у степах і напівпустелях вівці цілий рік пасуться на природних кормах. Розвиваються також виноробство, рибальство та аквакультура, зокрема вирощування перлів."], "ul": ["Пшениця займає понад половину ріллі (схід і південний схід).", "Рис — у Квінсленді; цукрова тростина — у Новому Південному Уельсі.", "Тропічні фрукти: цитрусові, ананаси, манго, банани.", "На зрошуваних землях — бавовник, кукурудза.", "Виноградники на південному заході; чверть вина експортується.", "Морські ферми з вирощування перлів на півночі."]}, {"h": "Зовнішні зв’язки. Австралія і Україна", "p": ["Понад половину експорту становлять мінеральна сировина та сільськогосподарська продукція; серед послуг — освіта й туризм. Імпортує Австралія нафту, транспортні засоби, комп’ютери. Головні партнери — країни Азії: Китай, Японія, Південна Корея, Індія, Сингапур; частка Великої Британії скорочується.", "Австралія — провідний торговельний партнер України в Океанії. Перспективні напрями співпраці — ІТ та аерокосмічна галузь. Після 2022 р. Австралія надає Україні допомогу у протидії російській агресії."], "ul": ["Експорт: залізна руда, кольорові метали, вугілля, боксити.", "Агроекспорт: вовна, баранина, пшениця, яловичина, молочні продукти, цукор, мед.", "Імпорт: нафта й нафтопродукти, автомобілі, комп’ютери.", "Україна постачає до Австралії мінеральні добрива, техніку.", "Спільні ІТ-проєкти, зокрема з «Львівською політехнікою»."]}], "terms": [["Розвинена переселенська країна", "високорозвинена країна, сформована переселенцями, з особливою роллю добувної промисловості та сільського господарства (Австралія, Канада)."], ["Міжнародний поділ праці (МПП)", "спеціалізація країн на виробництві певних товарів і послуг для обміну на світовому ринку."], ["Добувна промисловість", "галузі, що видобувають корисні копалини: вугілля, руди, нафту, газ тощо."], ["Загальне машинобудування", "виробництво обладнання для різних галузей: верстатів, роботів, гірничого й харчового устаткування."], ["Вівчарство", "галузь тваринництва, що розводить овець для отримання вовни, м’яса та молока."], ["Резервний банк Австралії", "центральний банк країни, ядро її фінансової системи."]], "f": "Великий Бар’єрний риф простягається майже на 3000 км уздовж узбережжя Квінсленду і з 1981 р. входить до Списку Світової спадщини ЮНЕСКО (за даними підручника).", "pr": ["Позначте на контурній або онлайн-карті найбільші економічні центри Австралії (Сідней, Мельбурн, Брисбен, Перт, Аделаїда, Ньюкасл) і підпишіть їхню промислову спеціалізацію.", "Напишіть коротке есе (8–10 речень) «Чому Австралія з сировинним експортом — високорозвинена країна?», використовуючи аргументи з параграфа."], "qz": [{"q": "До якого типу країн відносять Австралію?", "o": ["Нових індустріальних", "Найменш розвинених", "Розвинених переселенських", "Країн з перехідною економікою"], "a": 2, "why": "Австралія сформована переселенцями й має високий рівень розвитку."}, {"q": "Який сектор дає найбільший внесок у ВВП Австралії?", "o": ["Сфера послуг", "Сільське господарство", "Добувна промисловість", "Рибальство"], "a": 0, "why": "На послуги припадає понад 2/3 ВВП (за даними підручника)."}, {"q": "Яких електростанцій немає в Австралії?", "o": ["ТЕС", "ГЕС", "Сонячних", "АЕС"], "a": 3, "why": "Атомних електростанцій у країні немає."}, {"q": "Що є «візитною карткою» сільського господарства Австралії?", "o": ["Рисівництво", "Вівчарство", "Чаївництво", "Свинарство"], "a": 1, "why": "Австралія — друга у світі за поголів’ям овець."}, {"q": "Яка культура займає понад половину ріллі Австралії?", "o": ["Пшениця", "Рис", "Кукурудза", "Бавовник"], "a": 0, "why": "Більше половини ріллі зайнято під пшеницею."}, {"q": "Де розміщені основні заводи чорної металургії Австралії?", "o": ["Канберра і Гобарт", "Дарвін і Аліс-Спрінгс", "Ньюкасл і Порт-Кембла", "Перт і Аделаїда"], "a": 2, "why": "Головні металургійні заводи — у Ньюкаслі та Порт-Кембла."}, {"q": "Яка особливість машинобудування Австралії?", "o": ["Воно повністю відсутнє", "Велике значення загального машинобудування для гірничої та харчової галузей", "Спеціалізація лише на літаках", "Виготовлення тільки годинників"], "a": 1, "why": "Значну роль відіграє виробництво обладнання для добувної та харчової промисловості."}, {"q": "Яка послуга є одним із найважливіших джерел доходів Австралії?", "o": ["Космічні запуски", "Банківська таємниця", "Ремонт суден", "Освітні послуги для іноземців"], "a": 3, "why": "В Австралії навчаються понад 500 тис. іноземців (за даними підручника)."}, {"q": "Які країни є головними зовнішньоекономічними партнерами Австралії?", "o": ["Країни Азії: Китай, Японія, Південна Корея", "Країни Африки", "Країни Південної Америки", "Тільки Велика Британія"], "a": 0, "why": "Найбільше торгує з азійськими країнами, частка Британії скорочується."}, {"q": "Яким видом транспорту здійснюються зовнішньоторговельні перевезення Австралії?", "o": ["Залізничним", "Трубопровідним", "Морським", "Автомобільним"], "a": 2, "why": "Острівне положення материка зумовлює роль морського транспорту."}], "section": "Розділ III. ОКЕАНІЯ", "topic": "Тема 1. Австралія", "sregion": "oceania", "sk": "oceania", "cid": "036", "cn": "Австралія"}, {"n": "29", "p": "29", "t": "Острівні країни Океанії", "pages": "с. 157–162", "g": "Охарактеризувати склад, ЕГП, населення та господарство острівних країн Океанії й пояснити, чому серед них лише Нова Зеландія є розвиненою.", "nums": [{"v": "понад 10 тис.", "l": "островів на площі понад 10 млн км²"}, {"v": "13 держав і 11 залежних територій", "l": "на островах Тихого океану (за даними підручника)"}, {"v": "≈ 18 млн осіб", "l": "населення острівних країн Океанії (за даними підручника)"}, {"v": "15–20 ‰", "l": "природний приріст у більшості острівних держав (за даними підручника)"}], "blocks": [{"h": "Склад регіону: три субрегіони", "p": ["Крім Австралії, до Океанії належать численні острови в центральній і південно-західній частинах Тихого океану. Їх поділяють на три субрегіони, назви яких походять із грецької мови.", "Більшість острівних країн мають вигідне економіко- та військово-стратегічне положення на перехресті морських шляхів з Америки до Австралії та Азії. Тому в XIX ст. майже всі острови стали колоніями європейських держав і США."], "ul": ["Мікронезія («малі острови») — між Північним тропіком та екватором: Маріанські, Каролінські, Маршаллові острови, острови Гілберта.", "Меланезія («чорні острови») — відносно великі острови Південної півкулі: Нова Гвінея, Нова Каледонія, Соломонові Острови, Вануату, Фіджі.", "Полінезія («багато островів») — центр Тихого океану: Гавайські, Самоа, Тонга, Туамоту, острови Нової Зеландії.", "Полінезія — найвіддаленіша від материків частина Океанії.", "Багато островів вулканічного та коралового походження."]}, {"h": "Політична карта", "p": ["Нині в Океанії 13 незалежних держав і 11 залежних територій, що належать США, Франції, Новій Зеландії, Австралії та Великій Британії. Майже всі держави унітарні, переважають республіки.", "Колишні британські колонії, що залишилися у Співдружності, формально є монархіями. Деякі острови використовують як військові бази."], "ul": ["Найбільші держави: Папуа — Нова Гвінея, Нова Зеландія.", "Найменші держави: Науру, Тувалу, Маршаллові Острови.", "Федеративні Штати Мікронезії — єдина федерація регіону.", "Залежні території: Гуам, Американське Самоа (США), Нова Каледонія, Французька Полінезія (Франція), Острови Кука (Нова Зеландія).", "Військові бази США: Гуам, Перл-Гарбор на Гаваях."]}, {"h": "Населення", "p": ["Понад 11 млн із приблизно 18 млн жителів острівних країн живе в Папуа — Новій Гвінеї та Новій Зеландії; населення інших країн — від кількох тисяч до кількох десятків тисяч осіб. Характерні висока народжуваність, велика частка дітей, порівняно невисока тривалість життя та від’ємне сальдо міграції.", "Расовий склад складний: у Меланезії живуть переважно папуаси, у Полінезії та Мікронезії — полінезійці. Переселенці з Європи та Азії становлять близько половини населення. Демографічна ситуація Нової Зеландії подібна до австралійської."], "ul": ["Середня тривалість життя — 65–70 років (за даними підручника).", "Панівна релігія — християнство (католицизм, протестантизм).", "На деяких островах збереглися традиційні вірування.", "Великих міст немає, переважає сільське населення.", "Нова Зеландія високоурбанізована; корінний народ — маорі."]}, {"h": "Господарство острівних країн", "p": ["Усі острівні країни, крім Нової Зеландії, належать до країн, що розвиваються; багато з них — найменш розвинені. Основа економіки — сільське господарство і рибальство, на великих островах — плантації тропічних культур.", "Промисловість переробляє рибу та рослинну сировину, виробляє будматеріали; поширене кустарне виготовлення сувенірів. У деяких країнах розвинені гірничодобувна, лісова та деревообробна галузі."], "ul": ["Плантації кокосової пальми; також кава, какао, цукрова тростина, батат.", "Фрукти: цитрусові, папая, манго, банани; спеції.", "Тваринництво другорядне: вівці, кози, буйволи.", "Переробка копри, виробництво кокосової олії.", "Видобуток: мідь і золото (Папуа — Нова Гвінея), фосфорити (Науру).", "Лісова галузь: Папуа — Нова Гвінея, Соломонові Острови, Фіджі."]}, {"h": "Туризм і фінанси", "p": ["Туризм і фінансова діяльність — найперспективніші напрями. Деякі острівні країни отримують від туризму до 20–30 % національного доходу (за даними підручника).", "Розвитку туризму заважають віддаленість регіону й слабка транспортна інфраструктура. На островах із розвиненим авіасполученням поширилася реєстрація офшорних компаній."], "ul": ["Туристичні країни: Фіджі, Тонга, Нова Каледонія, Вануату, Самоа, Острови Кука.", "Пляжний та екологічний туризм.", "Рибальство, дайвінг, знайомство з життям корінних народів.", "Офшорні компанії — джерело доходу.", "Стримувальний чинник — великі відстані."]}, {"h": "Нова Зеландія та зовнішні зв’язки регіону", "p": ["Нова Зеландія — друга після Австралії за економічним потенціалом країна регіону, розвинена переселенська держава. Її економіка ґрунтується на високотоварному сільському господарстві й харчовій промисловості; країна — серед світових лідерів з експорту масла, сиру, м’яса і вовни.", "Більшість острівних країн експортують агропродукцію (копру, фрукти, каву, какао, спеції), а Науру, Папуа — Нова Гвінея й Нова Каледонія — мінеральну сировину. Імпортують машини, паливо, хімікати, споживчі товари, ліки. Економіки сильно залежать від допомоги колишніх і теперішніх метрополій."], "ul": ["Нова Зеландія видобуває вугілля, газ, титан, руди металів, золото.", "Спільна проблема — обмеженість трудових, земельних і мінеральних ресурсів.", "Складність сполучення між островами.", "Іноземні інвестиції — у туризм і гірничодобувну галузь.", "Малим острівним державам загрожує підвищення рівня океану."]}], "terms": [["Океанія", "макрорегіон, що охоплює Австралію та численні острови центральної й південно-західної частин Тихого океану."], ["Мікронезія", "субрегіон дрібних островів (у перекладі з грецької «малі острови») між Північним тропіком та екватором."], ["Меланезія", "субрегіон відносно великих островів Південної півкулі (з грецької «чорні острови»), населений переважно папуасами."], ["Полінезія", "субрегіон у центрі Тихого океану (з грецької «багато островів») — найвіддаленіша від материків частина Океанії."], ["Залежна територія", "територія, що не має державного суверенітету й підпорядкована іншій державі."], ["Копра", "висушена м’якоть кокосового горіха, з якої виготовляють кокосову олію."], ["Офшорна компанія", "фірма, зареєстрована в країні з пільговим оподаткуванням, яка веде діяльність за її межами."], ["Метрополія", "держава, що володіє колоніями або залежними територіями."]], "f": "Назви субрегіонів Океанії походять з грецької: Мікронезія — «малі острови», Меланезія — «чорні острови», Полінезія — «багато островів».", "pr": ["Позначте на контурній або онлайн-карті межі Мікронезії, Меланезії та Полінезії й острівні держави, що входять до кожного субрегіону.", "Складіть таблицю «Проблеми розвитку малих острівних держав» (причина — наслідок — можливе розв’язання) не менше ніж на 4 рядки, використовуючи текст параграфа й додаткові джерела."], "qz": [{"q": "Що означає назва «Мікронезія»?", "o": ["Багато островів", "Чорні острови", "Малі острови", "Далекі острови"], "a": 2, "why": "З грецької «мікрос» — малий, «несос» — острів."}, {"q": "До якого субрегіону належать Гавайські острови та Нова Зеландія?", "o": ["Полінезії", "Меланезії", "Мікронезії", "Австралазії"], "a": 0, "why": "Обидві групи островів розташовані в Полінезії."}, {"q": "Хто переважно населяє Меланезію?", "o": ["Полінезійці", "Папуаси", "Маорі", "Європейці"], "a": 1, "why": "Меланезію населяють переважно папуаси, звідси й назва «чорні острови»."}, {"q": "Яка єдина розвинена країна серед острівних держав Океанії?", "o": ["Фіджі", "Папуа — Нова Гвінея", "Науру", "Нова Зеландія"], "a": 3, "why": "Решта острівних країн належать до тих, що розвиваються."}, {"q": "Чому в XIX ст. острови Океанії стали колоніями?", "o": ["Через великі запаси нафти", "Через вигідне положення на перехресті морських шляхів", "Через густе населення", "Через холодний клімат"], "a": 1, "why": "Острови мали важливе економічне та військово-стратегічне значення."}, {"q": "Що таке копра?", "o": ["Висушена м’якоть кокосового горіха", "Вид коралів", "Морська риба", "Сорт кави"], "a": 0, "why": "Копра — основна експортна сировина багатьох острівних країн."}, {"q": "Яка корисна копалина традиційно видобувалася на Науру?", "o": ["Нафта", "Мідь", "Фосфорити", "Алмази"], "a": 2, "why": "Науру спеціалізується на видобутку фосфоритів."}, {"q": "Що стримує розвиток туризму в Океанії?", "o": ["Холодний клімат", "Відсутність пляжів", "Віддаленість регіону та слабка транспортна інфраструктура", "Відсутність природних пам’яток"], "a": 2, "why": "Великі відстані та недостатній розвиток транспорту обмежують приплив туристів."}, {"q": "Яка демографічна риса характерна для більшості острівних держав?", "o": ["Низька народжуваність", "Висока народжуваність і велика частка дітей", "Переважання людей похилого віку", "Позитивне сальдо міграції"], "a": 1, "why": "Природний приріст становить 15–20 ‰ (за даними підручника)."}, {"q": "Продукцією якої галузі Нова Зеландія вирізняється на світовому ринку?", "o": ["Автомобілебудування", "Електроніки", "Нафтопереробки", "Тваринництва й харчової промисловості"], "a": 3, "why": "Країна — серед лідерів експорту масла, сиру, м’яса і вовни."}], "section": "Розділ III. ОКЕАНІЯ", "topic": "Тема 2. Мікронезія, Меланезія, Полінезія", "sregion": "oceania", "sk": "oceania"}, {"n": "30", "p": "30", "t": "Загальний огляд Америки", "pages": "с. 163–165", "g": "Охарактеризувати ЕГП, склад, політичну карту Америки, типи її країн за рівнем розвитку та головні інтеграційні об’єднання.", "nums": [{"v": "42,5 млн км²", "l": "площа Америки — майже третина суходолу (за даними підручника)"}, {"v": "понад 16,5 тис. км", "l": "протяжність регіону з півночі на південь"}, {"v": "35 держав і 23 залежні території", "l": "на політичній карті Америки (за даними підручника)"}, {"v": "≈ 1 млрд осіб", "l": "населення — 13,7 % людства (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення", "p": ["Америка простягається дугою через усю Західну півкулю — від холодних островів Канади до архіпелагу Вогняна Земля. Її омивають три океани: Атлантичний, Тихий та Північний Льодовитий.", "ЕГП загалом вигідне: довгі морські кордони сприяють торгівлі, а «заокеанське положення» віддалило регіон від війн, що вирували в Європі та Азії у XX ст. Важливу стратегічну роль відіграє Панамський канал."], "ul": ["Займає майже третину суходолу Землі.", "Протяжні морські кордони — умова міжматерикових зв’язків.", "Відокремленість від інших регіонів світу.", "Панамський канал скоротив шлях між Атлантичним і Тихим океанами.", "Наявність потужного лідера — США — впливає на весь регіон."]}, {"h": "Субрегіони Америки", "p": ["За класифікацією ООН Америку поділяють на Північну, Центральну, Південну Америку та Карибський басейн. Центральну й Південну Америку часто об’єднують під назвою Латинська Америка — через вплив іспанців і португальців на формування тамтешніх держав."], "ul": ["Північна (Англо-) Америка: США, Канада, Гренландія (Данія), Бермудські острови.", "Центральна Америка: Мексика, Гватемала, Беліз, Гондурас, Сальвадор, Нікарагуа, Коста-Рика, Панама.", "Південна Америка: Бразилія, Аргентина, Чилі, Перу, Колумбія, Венесуела та ін.", "Карибський басейн: Куба, Ямайка, Гаїті, Домініканська Республіка, Багамські Острови, Барбадос.", "Латинська Америка = Центральна + Південна Америка (+ Кариби)."]}, {"h": "Політична карта", "p": ["Усі сучасні держави Америки — колишні колонії, що здобули суверенітет. Залежні території належать Великій Британії, Нідерландам, Данії, Франції та США. Більшість держав — унітарні республіки.", "Канада та деякі острівні країни входять до Співдружності й визнають головою держави британського монарха (з 2022 р. — короля Карла III)."], "ul": ["Федерації: США, Канада, Мексика, Бразилія, Аргентина, Венесуела, Сент-Кіттс і Невіс.", "Монархії Співдружності: Канада, Ямайка, Багамські Острови та ін.", "Залежні території: Гренландія, Пуерто-Рико, Бермудські острови тощо.", "Переважна форма правління — республіка.", "Переважна форма устрою — унітарна держава."]}, {"h": "Типи країн за рівнем економічного розвитку", "p": ["Контрасти в рівні розвитку великі. США і Канада — високорозвинені країни, члени «Великої сімки», разом із Західною Європою утворюють найважливіший центр світового господарства. Решта держав Америки — такі, що розвиваються.", "США — головний торговельний партнер і джерело інвестицій для більшості країн регіону, але дедалі більше держав прагне зменшити залежність від них і отримувати більше прибутків від власних ресурсів."], "ul": ["Нові індустріальні країни («велика трійка»): Бразилія, Мексика, Аргентина; до них наближаються Венесуела, Колумбія, Чилі.", "«Багаті острови» Карибів: курорти й банківський бізнес (Багамські Острови, Барбадос).", "Країни середніх можливостей: Парагвай, Болівія, країни Центральної Америки.", "Найменш розвинена — Гаїті, найбідніша країна Західної півкулі.", "На Гаїті 85 % населення за межею бідності (за даними підручника)."]}, {"h": "Інтеграційні процеси та міжнародні організації", "p": ["Міжнародні угруповання Америки прагнуть створити вільний економічний простір. Найпотужнішим була НАФТА (з 1994 р.) — угода США, Канади та Мексики, що поєднувала економічну силу США, ресурси Канади та дешеву робочу силу Мексики. У 2020 р. НАФТА замінила нова угода між США, Мексикою та Канадою (USMCA).", "У Латинській Америці найбільше об’єднання — Південний спільний ринок МЕРКОСУР (1991 р.). Політичне об’єднання майже всіх країн регіону — Організація американських держав (ОАД)."], "ul": ["НАФТА: ліквідація митних бар’єрів, штаб-квартира у Вашингтоні.", "МЕРКОСУР: Аргентина, Бразилія, Парагвай, Уругвай (членство Венесуели призупинено з 2016 р.); штаб-квартира — Монтевідео.", "ОАД — створена 1948 р. з ініціативи США, мета — мир у регіоні.", "США і Канада — члени НАТО.", "США і Канада — члени «Великої сімки»."]}], "terms": [["Латинська Америка", "частина Америки на південь від США (Центральна, Південна Америка й Кариби), де переважають романські мови — іспанська та португальська."], ["Англо-Америка", "Північна Америка з переважно англомовними США і Канадою."], ["Нова індустріальна країна (НІК)", "країна, що розвивається, яка досягла швидкої індустріалізації та помітного економічного зростання."], ["НАФТА", "Північноамериканська угода про вільну торгівлю між США, Канадою та Мексикою (1994–2020)."], ["МЕРКОСУР", "Південний спільний ринок — інтеграційне об’єднання країн Південної Америки, створене 1991 р."], ["Організація американських держав (ОАД)", "найбільше політичне об’єднання країн Америки, створене 1948 р."], ["Панамський канал", "штучний водний шлях через Панамський перешийок, що з’єднує Атлантичний і Тихий океани."]], "f": "Панамський канал, відкритий на початку XX ст., суттєво скоротив морський шлях з Європи до Азії та Австралії й з’єднав західне та східне узбережжя США.", "pr": ["Практична робота 5: складіть картосхему типології країн Америки за рівнем економічного розвитку — позначте різними кольорами високорозвинені країни, НІК, «багаті острови», країни середніх можливостей і найменш розвинену країну.", "Складіть порівняльну таблицю «НАФТА (USMCA) і МЕРКОСУР»: рік створення, члени, мета, штаб-квартира; зробіть висновок про відмінності."], "qz": [{"q": "Яку частку суходолу Землі займає Америка?", "o": ["Близько 1/10", "Майже 1/3", "Близько 1/2", "Близько 1/5"], "a": 1, "why": "Площа Америки — 42,5 млн км², майже третина суходолу."}, {"q": "Які океани омивають Америку?", "o": ["Атлантичний, Тихий, Північний Льодовитий", "Тихий та Індійський", "Лише Атлантичний", "Атлантичний та Індійський"], "a": 0, "why": "Америку омивають води трьох океанів."}, {"q": "Чому Центральну та Південну Америку називають Латинською?", "o": ["Через латинську мову в школах", "Через вплив Риму", "Через вплив іспанців і португальців, що говорять романськими мовами", "Через римо-католицькі храми"], "a": 2, "why": "Іспанська й португальська — романські мови, що походять від латини."}, {"q": "Які країни Америки є членами «Великої сімки»?", "o": ["Бразилія і Мексика", "США і Мексика", "Аргентина і Канада", "США і Канада"], "a": 3, "why": "Високорозвинені США й Канада входять до G7."}, {"q": "Яка країна є найменш розвиненою в Західній півкулі?", "o": ["Гаїті", "Болівія", "Парагвай", "Гондурас"], "a": 0, "why": "Гаїті — найбідніша держава регіону."}, {"q": "Які країни утворюють «велику трійку» НІК Латинської Америки?", "o": ["Чилі, Перу, Колумбія", "Бразилія, Мексика, Аргентина", "Куба, Ямайка, Гаїті", "Венесуела, Еквадор, Болівія"], "a": 1, "why": "Ці три країни — найбільші нові індустріальні країни регіону."}, {"q": "Які країни входили до НАФТА?", "o": ["США, Канада, Бразилія", "США, Мексика, Куба", "США, Канада, Мексика", "Канада, Аргентина, Чилі"], "a": 2, "why": "НАФТА об’єднувала три країни Північної Америки."}, {"q": "Де розташована штаб-квартира МЕРКОСУР?", "o": ["У Буенос-Айресі", "У Бразиліа", "У Сантьяго", "У Монтевідео"], "a": 3, "why": "Штаб-квартира МЕРКОСУР — у столиці Уругваю."}, {"q": "До якої групи належать Багамські Острови та Барбадос?", "o": ["«Багаті острови»", "Найменш розвинені країни", "Нові індустріальні країни", "Високорозвинені країни G7"], "a": 0, "why": "Вони відомі курортами та банківським бізнесом."}, {"q": "Яка організація є найбільшим політичним об’єднанням країн Америки?", "o": ["НАТО", "ОАД", "МЕРКОСУР", "ОПЕК"], "a": 1, "why": "Організацію американських держав створено 1948 р., до неї входять майже всі країни регіону."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 1. Загальна характеристика Америки", "sregion": "america", "sk": "america"}, {"n": "31", "p": "31", "t": "Америка: природні умови та ресурси. Населення", "pages": "с. 166–171", "g": "Оцінити природні умови й ресурси Америки та з’ясувати головні риси її населення: склад, мови, релігії, відтворення, розміщення й урбанізацію.", "nums": [{"v": "понад 18 тис. км", "l": "довжина Кордильєр і Анд — найдовшої гірської системи світу"}, {"v": "≈ 2/3", "l": "поверхні Америки займають рівнини"}, {"v": "понад 170", "l": "об’єктів Світової спадщини ЮНЕСКО (за даними підручника)"}, {"v": "понад 80 %", "l": "рівень урбанізації у США і Канаді (за даними підручника)"}], "blocks": [{"h": "Рельєф і клімат", "p": ["Рельєф Америки поєднує гори й рівнини. Уздовж тихоокеанського узбережжя тягнуться Кордильєри — Анди, один із найактивніших районів вулканізму. На сході Північної Америки лежать старі низькі Аппалачі. Рівнини займають близько 2/3 поверхні й сприятливі для сільського господарства.", "В Америці є майже всі типи клімату: від холодного арктичного на півночі Канади до екваторіального в басейні Амазонки. Природні умови загалом сприятливі, за винятком холодних полярних і високогірних районів."], "ul": ["Кордильєри — Анди: понад 80 діючих вулканів.", "Рівнини: Великі й Центральні (Північна Америка), Амазонська та Ла-Платська низовини.", "Плоскогір’я: Бразильське, Гвіанське.", "США: помірний клімат із достатнім зволоженням на сході.", "Мексика: клімат залежить від висоти й широти.", "Центральна Америка й Кариби: тропічний клімат, вологий сезон з червня по листопад."]}, {"h": "Мінеральні ресурси", "p": ["Америка дуже багата на корисні копалини, особливо рудні. Бразилія посідає перше місце у світі за запасами й видобутком залізної руди. У надрах Кордильєр і Анд ланцюжком тягнеться «рудний пояс» кольорових і рідкісних металів.", "Америка — один із найбільших нафтогазоносних районів планети; Північна Америка виділяється запасами вугілля. Світове значення мають і нерудні копалини."], "ul": ["Залізна руда — Бразилія.", "«Рудний пояс»: олово, срібло, золото, мідь, уран, молібден, свинець, цинк.", "Боксити — Ямайка, північ Південної Америки (майже чверть світових запасів).", "Нафта — США, Мексика (Мексиканська затока), Венесуела (затока Маракайбо).", "Вугілля — Аппалацький басейн (США), Західний басейн (Канада).", "Фосфорити (Флорида), алмази (Бразилія), смарагди (Колумбія), селітра (Чилі)."]}, {"h": "Водні, лісові, агрокліматичні та рекреаційні ресурси", "p": ["Америка має водні ресурси світового значення: у Південній Америці течуть найбільші річки Землі, а Великі озера з каналами утворюють водний шлях для океанських суден. Лісові ресурси — найбагатші у світі.", "Найродючіші чорноземоподібні ґрунти — у преріях США та пампі Аргентини. Тропіки дозволяють вирощувати каву, какао, цукрову тростину. Рекреаційні ресурси надзвичайно багаті: пам’ятки доколумбової епохи, національні парки, теплі моря Карибів."], "ul": ["Річки: Амазонка, Парана, Оріноко, Міссісіпі — Міссурі, Святого Лаврентія.", "Великі озера: Верхнє, Мічиган, Гурон, Ері, Онтаріо.", "Ліси: тайга Канади, екваторіальні ліси Амазонії.", "Прерії (США) та пампа (Аргентина) — житниці регіону.", "Найбільше об’єктів ЮНЕСКО: Мексика, США, Канада, Бразилія.", "Нацпарки: Єллоустонський, Гранд-Каньйон (США), Ігуасу (Бразилія)."]}, {"h": "Склад населення: раси, мови, релігії", "p": ["Населення Америки наближається до 1 млрд осіб; найбільші країни — США, Бразилія, Мексика. Воно сформувалося з корінних жителів (індіанців і ескімосів), нащадків європейських переселенців, вихідців з Азії та афроамериканців.", "У Північній Америці переважають європеоїди, на Карибах — нащадки африканців, у більшості країн Латинської Америки — мішані раси. В Америці живе понад половину католиків світу."], "ul": ["Метиси, мулати, самбо — мішані расові групи Латинської Америки.", "Індіанці становлять понад половину населення лише в Болівії та Гватемалі.", "Англійська — у США, Канаді (там також французька), на Ямайці.", "Португальська — у Бразилії, іспанська — у більшості інших країн.", "Бразилія — найбільша католицька країна світу.", "У США і Канаді велика частка протестантів."]}, {"h": "Відтворення населення", "p": ["У США і Канаді демографічна ситуація типова для розвинених країн: низький природний приріст, старіння населення, зростання тривалості життя. Населення цих країн збільшується насамперед завдяки імміграції.", "У Мексиці та інших країнах Латинської Америки населення зростає швидше, хоча демографічний вибух згасає. Найвищі темпи приросту — в найменш розвинених країнах Центральної Америки."], "ul": ["США, Канада: приріст 2–4 ‰ (за даними підручника).", "Латинська Америка: у середньому близько 13 ‰ (за даними підручника).", "Високий приріст: Гватемала, Беліз, Гондурас.", "США і Канада — головні центри імміграції.", "Тривала імміграція сформувала потужний трудовий потенціал."]}, {"h": "Розміщення населення та урбанізація", "p": ["Населення розміщене вкрай нерівномірно, переважно по берегах океанів і річок. Найвища густота — у Центральній Америці й на Карибах, найменша — у Канаді.", "Більшість американців живуть у містах. Швидке зростання міст Латинської Америки породжує «хибну урбанізацію» з нетрями на околицях. У США сформувалися три мегалополіси."], "ul": ["Густота понад 300 осіб/км²: Барбадос, Пуерто-Рико, Сальвадор, Гаїті.", "Канада — лише 3,4 особи/км² (за даними підручника).", "Найвищий рівень урбанізації — Аргентина, Уругвай (понад 90 %).", "Найбільші агломерації: Нью-Йорк, Сан-Паулу, Мехіко, Лос-Анджелес, Буенос-Айрес, Ріо-де-Жанейро.", "Мегалополіси США: Босваш, Чипітс, Сан-Сан."]}], "terms": [["Кордильєри — Анди", "найдовша гірська система Землі вздовж тихоокеанського узбережжя Америки."], ["«Рудний пояс»", "ланцюг родовищ руд кольорових і рідкісних металів у Кордильєрах та Андах."], ["Прерії", "степові рівнини Північної Америки з родючими чорноземоподібними ґрунтами."], ["Пампа", "степові рівнини Аргентини з родючими ґрунтами."], ["Метиси", "нащадки шлюбів європейців та індіанців."], ["Мулати", "нащадки шлюбів європейців та африканців."], ["Хибна урбанізація", "швидке зростання міст за рахунок сільських мігрантів без відповідного зростання робочих місць, що веде до появи нетрів."], ["Мегалополіс", "величезна зона суцільної міської забудови, що утворилася внаслідок злиття кількох агломерацій."]], "f": "В Америці живе понад половина всіх католиків світу, а Бразилія — найбільша за площею й населенням католицька країна (за даними підручника).", "pr": ["Проаналізуйте статево-вікові піраміди Канади, Мексики, Болівії та Куби (у підручнику або на онлайн-ресурсах) і запишіть у таблицю, чим відрізняються демографічні процеси в різних субрегіонах Америки.", "Скористайтеся Google Earth або онлайн-картою: прокладіть маршрут віртуальної подорожі до 5 об’єктів Світової спадщини ЮНЕСКО в Америці й коротко опишіть кожен (1–2 речення)."], "qz": [{"q": "Яка гірська система є найдовшою на Землі?", "o": ["Аппалачі", "Гімалаї", "Кордильєри — Анди", "Скандинавські гори"], "a": 2, "why": "Кордильєри — Анди простягаються понад 18 тис. км."}, {"q": "Яка країна посідає перше місце у світі за запасами та видобутком залізної руди (за даними підручника)?", "o": ["Бразилія", "Канада", "США", "Чилі"], "a": 0, "why": "Найбагатші поклади залізної руди — у Бразилії."}, {"q": "Де розташовані найбільші запаси бокситів Карибського басейну?", "o": ["На Кубі", "На Ямайці", "На Гаїті", "На Багамських Островах"], "a": 1, "why": "Ямайка має значні родовища бокситів."}, {"q": "Як називаються степові рівнини Аргентини з родючими ґрунтами?", "o": ["Прерії", "Льянос", "Сельва", "Пампа"], "a": 3, "why": "Пампа — житниця Аргентини."}, {"q": "Хто такі мулати?", "o": ["Нащадки європейців та африканців", "Нащадки європейців та індіанців", "Нащадки індіанців та африканців", "Корінні жителі Арктики"], "a": 0, "why": "Мулати — мішана група від шлюбів європейців та африканців."}, {"q": "Яка мова є державною в Бразилії?", "o": ["Іспанська", "Англійська", "Португальська", "Французька"], "a": 2, "why": "Бразилія — колишня колонія Португалії."}, {"q": "За рахунок чого переважно зростає населення США і Канади?", "o": ["Високої народжуваності", "Імміграції", "Зниження смертності дітей", "Повернення емігрантів"], "a": 1, "why": "Природний приріст низький, тож головне джерело зростання — імміграція."}, {"q": "Яка країна Америки має найменшу густоту населення?", "o": ["Бразилія", "США", "Аргентина", "Канада"], "a": 3, "why": "У Канаді лише 3,4 особи/км² (за даними підручника)."}, {"q": "Що таке мегалополіс Босваш?", "o": ["Зона розселення від Бостона до Вашингтона", "Нафтовий басейн", "Національний парк", "Канал між озерами"], "a": 0, "why": "Приатлантичний мегалополіс простягається від Бостона до Вашингтона."}, {"q": "Яке явище спричиняє появу нетрів на околицях міст Латинської Америки?", "o": ["Субурбанізація", "Хибна урбанізація", "Дезурбанізація", "Рурбанізація"], "a": 1, "why": "Швидке зростання міст без достатньої кількості робочих місць породжує нетрі."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 1. Загальна характеристика Америки", "sregion": "america", "sk": "america"}, {"n": "32", "p": "32", "t": "Особливості економіки країн Америки. Первинний сектор економіки", "pages": "с. 172–176", "g": "З’ясувати відмінності в економічному розвитку країн Америки, роль американських ТНК та географію добувної промисловості, сільського, лісового господарства й рибальства.", "nums": [{"v": "19 360 млрд дол.", "l": "ВВП США (за ПКС, 2017 р.) — найбільший у регіоні (за даними підручника)"}, {"v": "2/3", "l": "частка Аргентини та Уругваю в експорті яловичини регіону (за даними підручника)"}, {"v": "1940-ві рр.", "l": "початок аграрних реформ і «зеленої революції» в Америці"}], "blocks": [{"h": "Відмінності економічного розвитку", "p": ["Величезні природні й трудові ресурси та вигідне положення створюють сприятливі умови для розвитку. Економічний лідер регіону — США, від яких більшою чи меншою мірою залежать інші країни. У багатьох країнах значною лишається роль первинного сектору.", "США і Канада — лідери з виробництва продукції обробної, добувної промисловості та сільського господарства; у їхній економіці переважає сфера послуг. Бразилія, Мексика й Аргентина після реформ 1980-х рр. стали промисловими гігантами, а за їхнім прикладом розвиваються Чилі, Колумбія, Перу, Еквадор."], "ul": ["Високорозвинені: США, Канада — провідна роль третинного сектору.", "НІК: Бразилія, Мексика, Аргентина — реформи, іноземні інвестиції, імпортозаміщення.", "Адміністративно-командна економіка: Куба, частково Венесуела й Болівія.", "Центральна Америка й Кариби: туризм і сільське господарство.", "Переробна промисловість малих країн — переважно легка й харчова."]}, {"h": "Роль трансамериканських ТНК", "p": ["На відміну від Європи та Азії, в Америці є чіткий економічний і політичний лідер — США. Американські ТНК створили в багатьох країнах регіону стільки підприємств, що їх називають «другою економікою» США.", "ТНК купують акції місцевих фірм, засновують філії, переносять виробництва, використовують дешеву робочу силу й сировину. Країни-сусіди виконують функції обслуговування: переробляють привізну нафту, виробляють алюміній, надають податкові пільги штаб-квартирам корпорацій."], "ul": ["«Друга економіка» США — підприємства американських ТНК за кордоном.", "Мотиви ТНК: дешева праця, багата сировина, нижчі податки.", "Штаб-квартири корпорацій переносять до Панами, на Багами, до Барбадосу.", "Залежність від іноземного капіталу США, Японії та Західної Європи.", "Вузька експортна спеціалізація багатьох країн."]}, {"h": "Добувна промисловість", "p": ["В Америці видобувають майже всі основні види корисних копалин. Головні нафтогазові райони — у Північній та Центральній Америці і на півночі Південної Америки; США мають сучасні технології видобутку сланцевого газу.", "Залізні й марганцеві руди видобувають на щитах давніх платформ, а руди кольорових металів — у «рудному поясі» Анд і Кордильєр. Значна частина видобутої руди експортується до США."], "ul": ["Нафта й газ: Техас, Аляска, Каліфорнія, Мексиканська затока, Західна Канада, Маракайбо, Оріноко.", "Вугілля: Аппалацький (США) та Західний (Канада) басейни.", "Залізна руда: Лаврентійська височина, Бразильське плоскогір’я.", "Мідь — Чилі, Перу, Мексика; срібло, свинець, цинк — Мексика, Перу.", "Уран — Канада, Бразилія; олово — Болівія; нікель — Куба.", "Боксити — Ямайка, Суринам, Гаяна, Домініканська Республіка."]}, {"h": "Сільське господарство", "p": ["У США і Канаді сільське господарство багатогалузеве, високомеханізоване й прибуткове, з переважанням тваринництва; основний тип підприємств — великі ферми. В інших країнах (крім Аргентини та Уругваю) провідне рослинництво.", "Спеціалізація експортних культур вузька: вона склалася ще в колоніальні часи, коли плантації вирощували культури для метрополій. Аграрні реформи й «зелена революція» в Америці розпочалися раніше, ніж в Азії."], "ul": ["Цукрова тростина — Куба, Бразилія, Мексика.", "Кава — Бразилія, Колумбія; какао — Домініканська Республіка, Бразилія, Еквадор.", "Пшениця — Аргентина; бавовник — Мексика, Бразилія, Парагвай.", "Банани — Еквадор, Нікарагуа, Панама.", "Овочі й фрукти (Мексика, Гватемала), квіти (Колумбія) — для ринку США.", "Для власних потреб — кукурудза, маніок, банани, картопля, квасоля."]}, {"h": "Тваринництво, лісове господарство, рибальство", "p": ["Аргентина та Уругвай — лідери з експорту продукції тваринництва; за поголів’ям овець і настригом вовни Аргентина поступається лише Австралії та Новій Зеландії. У горах Перу, Еквадору й Болівії заради вовни розводять лам і альпак.", "Лісове господарство помітне в Канаді, Бразилії, Чилі, Аргентині. Рибальство має експортний характер і орієнтоване на ринки США та Японії; швидко розвивається аквакультура."], "ul": ["Ліс: деревина для паперу й будівництва, червоне дерево, кедр, бальса.", "Лісові промисли: хінна кора, кленовий сік, чай мате, чикле.", "Рибальство: Канада, Бразилія, Чилі, Перу.", "Улов: тунець, сардина, оселедець, анчоуси, креветки, устриці.", "Ферми морських черепах і крокодилів у Нікарагуа."]}], "terms": [["Первинний сектор економіки", "видобування й заготівля природних ресурсів: добувна промисловість, сільське, лісове господарство, рибальство."], ["Трансамериканські ТНК", "великі корпорації (переважно США), що мають підприємства в багатьох країнах Америки."], ["«Друга економіка» США", "сукупність підприємств американських ТНК, розміщених за межами США."], ["Плантаційне господарство", "велике товарне господарство з вирощування однієї тропічної культури на експорт, що сформувалося в колоніальну добу."], ["«Зелена революція»", "комплекс заходів з інтенсифікації сільського господарства: нові сорти, добрива, механізація, зрошення."], ["Адміністративно-командна економіка", "система, де провідну роль відіграє держава, а приватний сектор обмежений."], ["Сланцевий газ", "природний газ, що видобувається зі сланцевих порід за допомогою спеціальних технологій."]], "f": "Чикле — сік тропічного дерева, який збирають у лісах Америки, — традиційна сировина для виготовлення жувальної гумки.", "pr": ["Позначте на контурній або онлайн-карті головні райони видобування нафти й газу, вугілля, залізної руди та руд кольорових металів Америки; підпишіть країни-лідери.", "Складіть таблицю «Експортна спеціалізація сільського господарства країн Америки» (культура / продукція — країни — природні та історичні причини) не менше ніж на 6 рядків."], "qz": [{"q": "Яка країна є економічним лідером Америки?", "o": ["Бразилія", "Канада", "США", "Мексика"], "a": 2, "why": "США мають найбільший ВВП і впливають на економіку всього регіону."}, {"q": "Що називають «другою економікою» США?", "o": ["Сільське господарство США", "Підприємства американських ТНК за кордоном", "Економіку Аляски", "Тіньову економіку"], "a": 1, "why": "ТНК США створили в країнах Америки велику кількість підприємств."}, {"q": "У якій країні Америки переважає адміністративно-командна економіка?", "o": ["Куба", "Чилі", "Канада", "Мексика"], "a": 0, "why": "На Кубі провідна роль у господарстві належить державі."}, {"q": "Яка країна — лідер видобутку міді в Америці?", "o": ["Канада", "Ямайка", "Аргентина", "Чилі"], "a": 3, "why": "Мідь видобувають у «рудному поясі» Анд, передусім у Чилі."}, {"q": "Де видобувають олово в Америці?", "o": ["У Болівії", "У Канаді", "В Уругваї", "На Кубі"], "a": 0, "why": "Болівія — головний виробник олова регіону."}, {"q": "Яка галузь переважає в сільському господарстві США і Канади?", "o": ["Рослинництво", "Тваринництво", "Плантаційне господарство", "Рибальство"], "a": 1, "why": "Високомеханізовані ферми спеціалізуються переважно на тваринництві."}, {"q": "Яка пара країн спеціалізується на вирощуванні кави?", "o": ["Аргентина й Уругвай", "Куба й Мексика", "Бразилія й Колумбія", "Канада й США"], "a": 2, "why": "Бразилія та Колумбія — найбільші виробники кави регіону."}, {"q": "Які країни є лідерами з експорту продукції тваринництва в Америці?", "o": ["Перу й Болівія", "Аргентина й Уругвай", "Куба й Ямайка", "Колумбія й Еквадор"], "a": 1, "why": "На них припадає 2/3 експорту яловичини регіону."}, {"q": "Заради чого в горах Перу, Еквадору й Болівії розводять лам та альпак?", "o": ["Заради вовни", "Заради молока", "Заради яєць", "Для перевезення нафти"], "a": 0, "why": "Лами й альпаки дають цінну вовну."}, {"q": "Чому багато ТНК США переносять штаб-квартири до Панами, на Багами, до Барбадосу?", "o": ["Через холодний клімат США", "Через заборону бізнесу в США", "Через більші ринки збуту", "Щоб уникнути великого оподаткування"], "a": 3, "why": "Ці країни надають пільгові податкові умови."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 1. Загальна характеристика Америки", "sregion": "america", "sk": "america"}, {"n": "33", "p": "33", "t": "Основні промислові райони Америки. Вторинний та третинний сектори економіки", "pages": "с. 177–182", "g": "Визначити головні промислові райони Америки, провідні галузі вторинного сектору, особливості сфери послуг, місце країн регіону в МПП та їхні зв’язки з Україною.", "nums": [{"v": "≈ 30 %", "l": "частка Америки у світовому виробництві електроенергії (за даними підручника)"}, {"v": "137 і 19", "l": "вишів США і Канади серед 500 найкращих у світі (за даними підручника)"}, {"v": "≈ 8600", "l": "суден під прапором Панами (за даними підручника)"}, {"v": "понад 15 млн", "l": "туристів щороку на островах Карибського басейну (за даними підручника)"}], "blocks": [{"h": "Промислові райони", "p": ["Обробна промисловість Америки зосереджена в США і Канаді, у нових індустріальних країнах (Бразилія, Мексика, Аргентина), а також у Чилі, Венесуелі, Колумбії та Перу. Найпотужніші промислові райони розташовані в США.", "У НІК промислові райони історично формувалися в столицях і великих економічних центрах із вигідним положенням і кваліфікованою робочою силою. Від харчової, текстильної й металообробної галузей вони перейшли до автомобілебудування, нафтохімії та наукоємних виробництв."], "ul": ["Приатлантичний (США): наукоємне машинобудування, нафтохімія, фармацевтика, поліграфія — на привізній сировині.", "Приозерний (США) — «індустріальне серце»: чорна металургія, важке машинобудування, хімія.", "Примексиканський (США): нафтопереробка та нафтохімія.", "Сан-Паулу, Ріо-де-Жанейро (Бразилія).", "Мехіко (Мексика), Буенос-Айрес (Аргентина)."]}, {"h": "Енергетика та металургія", "p": ["Близько 30 % світової електроенергії виробляє Америка, з них більшу частину — США, Канада й Бразилія. Майже скрізь переважають ТЕС, але в Канаді та Бразилії головну роль відіграють ГЕС.", "Чорна металургія найбільш розвинена в США, Канаді, Бразилії, Мексиці, Аргентині та Венесуелі. Кольорова металургія працює на місцевій сировині «рудного поясу», а її продукція експортується до США та інших розвинених країн."], "ul": ["Найпотужніші ГЕС: «Ітайпу», «Белу-Монті» (Бразилія), «Гурі» (Венесуела), «Гранд-Кулі» (США).", "АЕС: США, Канада, Мексика, Бразилія, Аргентина.", "Мідь — Чилі, Перу, Мексика, США, Канада.", "Олово — Болівія; срібло — Мексика, Канада.", "Алюміній — США, Канада, Бразилія; глинозем — Ямайка, Гаяна."]}, {"h": "Машинобудування, хімічна, лісова, легка та харчова промисловість", "p": ["Машинобудування США і Канади вирізняється високою наукоємністю: авіакосмічна й військова техніка, автомобілі, електроніка, комп’ютери. У НІК розвинені автомобіле-, верстато-, літако- та суднобудування, але більшість підприємств — філії іноземних компаній.", "Лідер хімічної промисловості — США. Лісова промисловість спирається на ресурси північного та південного лісових поясів. Легка й харчова промисловість є в усіх країнах, а для найбідніших — провідна."], "ul": ["Хімія в інших країнах: нафтохімія, мінеральні добрива, парфумерія, фармацевтика.", "Канада — целюлозно-паперове виробництво.", "Південна Америка — первинна обробка деревини.", "Текстильна (бавовняна) промисловість — Мексика, Південна Америка.", "Перенесення трудомістких виробництв у країни з дешевою робочою силою."]}, {"h": "Третинний сектор", "p": ["Найвищого рівня сфера послуг досягла в США, які лідирують у світовому виробництві багатьох послуг: фінансах, торгівлі, освіті, медицині, ІТ. Головний фінансовий центр Америки — Нью-Йорк із найбільшою фондовою біржею світу.", "Освітні центри США і Канади вважаються найкращими у світі. Розвинена транспортна система: морський транспорт переважає в зовнішніх вантажних перевезеннях, авіація — у пасажирських на великі відстані."], "ul": ["Світові центри: Нью-Йорк, Чикаго, Лос-Анджелес, Сан-Франциско, Бостон, Торонто, Монреаль, Сан-Паулу, Мехіко.", "Університети: Гарвардський, Стенфордський, Прінстонський, Єльський, Торонтський.", "Порти: Лос-Анджелес, Ванкувер, Нью-Йорк, Сантус, Колон.", "Аеропорти: Атланта — найбільший за пасажирообігом, Чикаго (О’Хара), Лос-Анджелес, Даллас.", "Панамериканське шосе з’єднує три Америки; Трансамазонське шосе перетинає Амазонію."]}, {"h": "Спеціалізація малих країн", "p": ["Положення малих країн Центральної Америки й Карибів на перехресті транспортних шляхів визначило їхню особливу спеціалізацію у сфері послуг: реєстрація суден, офшорні зони, туризм.", "Америка — третій за масштабами регіон міжнародного туризму. Головні туристичні країни — США, Канада й Мексика, а острови Карибів спеціалізуються на готельному бізнесі."], "ul": ["Країни «зручного прапора»: Панама, Багамські Острови, Антигуа і Барбуда.", "Офшорні зони: Бермуди, Барбадос, Антигуа і Барбуда.", "«Країни-готелі»: острови Карибського басейну.", "Пільгові податки та мінімум бюрократії приваблюють капітал.", "Туризм — провідна галузь багатьох острівних країн."]}, {"h": "Країни Америки в МПП. Зв’язки з Україною", "p": ["США — головний інвестор регіону, постачальник передових технологій, наукоємної продукції та новітніх послуг. Канада й НІК вирізняються продукцією добувної та обробної промисловості, регіон загалом — постачанням агропродукції та продовольства, а малі країни — фінансовими, транспортними й туристичними послугами.", "Найважливіші партнери України в Америці — США, Канада, Бразилія, Мексика, Еквадор, Аргентина. Від початку повномасштабного вторгнення Росії 2022 р. США та Канада надають Україні значну військову, фінансову й гуманітарну допомогу. Зв’язки зміцнює численна українська діаспора."], "ul": ["США — технології, капітал, наукоємна продукція.", "Канада — сировина й продукція обробної промисловості.", "Латинська Америка — агропродукція, руди, метали.", "Співпраця з США: енергетика, реформи, обороноздатність.", "Українська діаспора: США, Канада, Бразилія, Аргентина."]}], "terms": [["Вторинний сектор економіки", "обробна промисловість, енергетика й будівництво — галузі, що переробляють сировину на готову продукцію."], ["Третинний сектор економіки", "сфера послуг: торгівля, фінанси, транспорт, освіта, медицина, туризм, ІТ."], ["Наукоємне виробництво", "виробництво, що потребує великих витрат на наукові дослідження й розробки (авіакосмічна техніка, електроніка, фармацевтика)."], ["Країна «зручного прапора»", "держава, що за пільгові умови реєструє під своїм прапором іноземні судна."], ["Офшорна зона", "територія з пільговим оподаткуванням і спрощеним законодавством для залучення іноземного капіталу."], ["Панамериканське шосе", "трансконтинентальна автомагістраль, що з’єднує країни Північної, Центральної та Південної Америки."]], "f": "Під прапором Панами зареєстровано близько 8600 кораблів — до її портів приписано більше американських торговельних суден, ніж до всіх портів США (за даними підручника).", "pr": ["Позначте на контурній або онлайн-карті три промислові райони США (Приатлантичний, Приозерний, Примексиканський) і промислові центри НІК (Сан-Паулу, Мехіко, Буенос-Айрес); підпишіть їхню спеціалізацію.", "Складіть таблицю-приклад: «країни „зручного прапора“ — країни-офшори — „країни-готелі“» (по 2–3 країни в кожній колонці) і поясніть у 3–4 реченнях, чому малі країни мають саме таку спеціалізацію."], "qz": [{"q": "Який промисловий район називають «індустріальним серцем» США?", "o": ["Приатлантичний", "Приозерний", "Примексиканський", "Каліфорнійський"], "a": 1, "why": "Приозерний район між Великими озерами та річками Міссісіпі й Огайо — центр традиційних галузей."}, {"q": "На чому спеціалізується Примексиканський промисловий район?", "o": ["На нафтопереробці та нафтохімії", "На текстильній промисловості", "На целюлозно-паперовому виробництві", "На суднобудуванні"], "a": 0, "why": "Тут зосереджені підприємства нафтопереробки та нафтохімії."}, {"q": "У яких країнах Америки найбільшу частку електроенергії дають ГЕС?", "o": ["США і Мексика", "Куба і Ямайка", "Аргентина і Чилі", "Канада і Бразилія"], "a": 3, "why": "Канада й Бразилія мають величезні гідроенергоресурси."}, {"q": "Де розташована ГЕС «Ітайпу»?", "o": ["У Канаді", "У США", "У Бразилії", "У Венесуелі"], "a": 2, "why": "«Ітайпу» — одна з найпотужніших ГЕС світу, у Бразилії."}, {"q": "На чому спеціалізується лісова промисловість Канади?", "o": ["На целюлозно-паперовому виробництві", "На збиранні чикле", "На добуванні бальси", "На виготовленні меблів з червоного дерева"], "a": 0, "why": "Канада — лідер целюлозно-паперового виробництва."}, {"q": "Яке місто є головним фінансовим центром Америки?", "o": ["Чикаго", "Торонто", "Сан-Паулу", "Нью-Йорк"], "a": 3, "why": "У Нью-Йорку розташована найбільша фондова біржа світу."}, {"q": "Що таке країна «зручного прапора»?", "o": ["Країна з найбільшим флотом військових кораблів", "Країна, що реєструє під своїм прапором іноземні судна", "Країна з найкрасивішим прапором", "Країна без виходу до моря"], "a": 1, "why": "Наприклад, Панама реєструє тисячі іноземних суден."}, {"q": "Яка автомагістраль з’єднує Північну, Центральну й Південну Америку?", "o": ["Трансамазонське шосе", "Шосе 66", "Панамериканське шосе", "Трансканадська магістраль"], "a": 2, "why": "Панамериканське шосе — трансконтинентальна магістраль трьох Америк."}, {"q": "Який вид транспорту переважає в зовнішніх вантажних перевезеннях Америки?", "o": ["Морський", "Повітряний", "Залізничний", "Трубопровідний"], "a": 0, "why": "Зовнішні вантажі між материками перевозять переважно морем."}, {"q": "Що є головною спеціалізацією острівних країн Карибського басейну у сфері послуг?", "o": ["Космічні запуски", "Туризм і готельний бізнес", "Виробництво автомобілів", "Видобуток вугілля"], "a": 1, "why": "Природа й теплі моря Карибів приваблюють понад 15 млн туристів щороку."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 1. Загальна характеристика Америки", "sregion": "america", "sk": "america"}, {"n": "34", "p": "34", "t": "США: економіко-географічне положення, природні умови та ресурси, населення", "pages": "с. 183–185", "g": "Оцінити економіко-географічне положення та природно-ресурсний потенціал США, з’ясувати особливості населення країни та української діаспори.", "nums": [{"v": "> 7,8 млн км²", "l": "площа основної (континентальної) частини США (за даними підручника)"}, {"v": "≈ 20 тис. км", "l": "довжина берегової лінії (за даними підручника)"}, {"v": "≈ 82 %", "l": "частка міського населення (за даними підручника)"}, {"v": "≈ 2 млн", "l": "українців у США (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення", "p": ["Територія США складається з трьох частин: континентальних штатів між Канадою та Мексикою, Аляски на північному заході материка та Гавайських островів у центрі Тихого океану. Країна також контролює низку островів у Карибському морі та Океанії.", "Вихід до трьох океанів, довга порізана берегова лінія з природними бухтами, віддаленість від осередків воєн і конфліктів роблять ЕГП США дуже вигідним."], "ul": ["на сході — Атлантичний океан, на заході — Тихий, на південному сході — Мексиканська затока", "Аляска має вихід до Північного Льодовитого океану й через Берингову протоку межує з Росією", "сухопутні сусіди — Канада (на півночі) і Мексика (на півдні)", "острови під контролем США: Пуерто-Рико, Віргінські острови, Американське Самоа, Гуам", "світові війни не зруйнували економіку США — навпаки, країна збагатилася як кредитор європейських держав"]}, {"h": "Природні умови та ресурси", "p": ["США розташовані переважно у сприятливих для життя природних поясах і є однією з найбагатших країн світу за кількістю та різноманітністю природних ресурсів.", "Мінеральні, земельні, водні, лісові й рекреаційні ресурси мають світове значення та ефективно використовуються. Водночас через величезні потреби господарства США залишаються великим імпортером мінеральної сировини."], "ul": ["різноманітні мінеральні ресурси (паливні, рудні, нерудні)", "великі площі родючих земель для землеробства й тваринництва", "значні водні ресурси (Великі озера, Міссісіпі, Колорадо та ін.)", "лісові ресурси Аляски, Кордильєр та Аппалачів", "унікальні рекреаційні ресурси: узбережжя, гори, національні парки"]}, {"h": "Етнічний і релігійний склад населення", "p": ["Ядро американської нації склали вихідці з Великої Британії, пізніше до них долучилися німці, ірландці, італійці, поляки, українці та багато інших народів. Попри строкатість складу, у США сформувалася консолідована нація.", "Переважна більшість віруючих — християни (протестанти та католики), також є прихильники індуїзму, ісламу та інших релігій."], "ul": ["нащадки європейців — майже 80 % населення (за даними підручника)", "афроамериканці — близько 13 %, переважно нащадки рабів, вивезених з Африки", "вихідці з Азії — 4,4 %, корінні жителі (індіанці, ескімоси, алеути, гавайці) — 1,2 %", "протестанти — 46,5 %, католики — 20,8 % (за даними підручника)", "багато вихідців з Латинської Америки"]}, {"h": "Відтворення, розміщення та зайнятість населення", "p": ["Тривалий час населення США швидко зростало завдяки високому природному приросту та імміграції. Нині природний приріст знизився, а імміграцію суворо обмежують — щороку в’їжджає близько 800 тис. осіб, серед них багато висококваліфікованих фахівців.", "Населення розміщене дуже нерівномірно: найгустіше заселене східне узбережжя, а в гірських штатах і на Алясці густота мінімальна."], "ul": ["середня густота — трохи більше 35 осіб/км², на сході подекуди до 400 осіб/км²", "на Алясці — менше 1 особи/км²", "поступове старіння населення, але менш гостре, ніж у Європі", "найбільші міста-агломерації: Нью-Йорк, Лос-Анджелес, Чикаго, Маямі, Даллас", "субурбанізація сприяла утворенню великих агломерацій", "майже 80 % працівників зайняті у сфері послуг, лише 0,7 % — у сільському, лісовому та рибному господарстві"]}, {"h": "Українська діаспора в США", "p": ["У США живе одна з найчисленніших українських громад світу. Українці зосереджені переважно у великих містах північного сходу та Приозер’я.", "Діаспора високоорганізована: діють церкви, громадські, політичні й культурно-освітні організації, українознавство викладають у десятках університетів."], "ul": ["основні осередки: Нью-Йорк, Філадельфія, Чикаго, Піттсбург, Детройт, Клівленд", "перша хвиля еміграції — з 1877 р. (селяни-русини з Закарпаття на шахтах Пенсильванії)", "друга хвиля — друга половина 1920-х рр.", "третя хвиля — друга половина 1940-х рр. (переміщені особи та біженці з таборів у Німеччині, Австрії, Італії)", "українські студії викладають у 28 університетах і коледжах (за даними підручника)"]}], "terms": [["Економіко-географічне положення (ЕГП)", "розташування країни щодо інших держав, ринків, транспортних шляхів і ресурсів, яке впливає на її економічний розвиток."], ["Природно-ресурсний потенціал", "сукупність природних ресурсів країни, які використовуються або можуть бути використані в господарстві."], ["Діаспора", "частина народу, що проживає за межами своєї історичної батьківщини."], ["Субурбанізація", "переселення жителів міст до приміських зон, що спричиняє розростання агломерацій."], ["Урбанізація", "процес зростання ролі міст і частки міського населення в країні."], ["Афроамериканці", "темношкірі жителі США, переважно нащадки рабів, вивезених з Африки."]], "f": "Перша хвиля української еміграції до США почалася 1877 р., коли група селян-русинів із Закарпаття приїхала працювати на шахти Східної Пенсильванії.", "pr": ["За картами атласу або онлайн-картою позначте на контурній карті три частини території США, океани, що їх омивають, сусідні країни та п’ять найбільших міст.", "Складіть таблицю «Природні ресурси США»: вид ресурсу, де зосереджений, як використовується в господарстві. Письмово поясніть, чому США, маючи багаті ресурси, імпортують мінеральну сировину."], "qz": [{"q": "З яких частин складається територія США?", "o": ["Континентальні штати, Аляска, Гавайські острови", "Континентальні штати, Аляска, Ньюфаундленд", "Континентальні штати, Гренландія, Гаваї", "Аляска, Флорида, Пуерто-Рико"], "a": 0, "why": "Територія США включає континентальні штати, Аляску та Гавайські острови."}, {"q": "З якою країною Аляска межує через Берингову протоку?", "o": ["Канадою", "Японією", "Росією", "Китаєм"], "a": 2, "why": "Берингова протока відділяє Аляску від Росії."}, {"q": "Чому ЕГП США вважають вигідним?", "o": ["Країна не має виходу до моря", "Вихід до трьох океанів і віддаленість від осередків конфліктів", "Країна межує з багатьма бідними державами", "Більша частина території в арктичному поясі"], "a": 1, "why": "Вихід до океанів і віддаленість від зон воєн сприяють розвитку господарства."}, {"q": "Яку частку населення США становлять нащадки європейців (за даними підручника)?", "o": ["близько 13 %", "близько 40 %", "близько 60 %", "майже 80 %"], "a": 3, "why": "Нащадки європейців — майже 80 % населення."}, {"q": "Яка частина США заселена найгустіше?", "o": ["Аляска", "Гірські штати Кордильєр", "Східне узбережжя", "Внутрішні аграрні райони"], "a": 2, "why": "На східному узбережжі густота подекуди сягає 400 осіб/км²."}, {"q": "Яка релігійна група найчисленніша в США?", "o": ["Протестанти", "Католики", "Мусульмани", "Індуїсти"], "a": 0, "why": "Протестанти становлять 46,5 % населення."}, {"q": "У якій сфері зайнята більшість працівників США?", "o": ["Сільському господарстві", "Добувній промисловості", "Обробній промисловості", "Сфері послуг"], "a": 3, "why": "Майже 80 % американських працівників зайняті у сфері послуг."}, {"q": "Яке явище спричинило утворення великих міських агломерацій у США?", "o": ["Рурбанізація", "Субурбанізація", "Депопуляція", "Еміграція"], "a": 1, "why": "Переселення в передмістя (субурбанізація) розширило агломерації."}, {"q": "Коли почалася перша хвиля української еміграції до США?", "o": ["1877 р.", "1920-ті рр.", "1940-ві рр.", "1991 р."], "a": 0, "why": "У 1877 р. селяни-русини із Закарпаття прибули на шахти Пенсильванії."}, {"q": "Яке з міст є одним із центрів української діаспори в США?", "o": ["Сан-Дієго", "Філадельфія", "Гонолулу", "Х’юстон"], "a": 1, "why": "Українці зосереджені в Нью-Йорку, Філадельфії, Чикаго, Піттсбургу та ін."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 2. Країни Америки", "sregion": "america", "sk": "america", "cid": "840", "cn": "США"}, {"n": "35", "p": "35", "t": "США: господарство", "pages": "с. 186–191", "g": "Розкрити особливості постіндустріальної економіки США, провідні галузі сфери послуг, промисловості й сільського господарства, зовнішні економічні зв’язки та відносини з Україною.", "nums": [{"v": "> 15,5 %", "l": "частка США у світовому ВВП, 2-ге місце (за даними підручника)"}, {"v": "≈ 80 %", "l": "частка сфери послуг у ВВП (за даними підручника)"}, {"v": "> 17 млн", "l": "автомобілів, що виробляються щороку (за даними підручника)"}, {"v": "< 1 %", "l": "працюючих у сільському господарстві (за даними підручника)"}], "blocks": [{"h": "Постіндустріальний розвиток і «економіка знань»", "p": ["Після Другої світової війни США стали найпотужнішою економікою світу. Згодом Німеччина, Японія, а на початку XXI ст. Китай наздогнали чи випередили їх за окремими показниками, але за науково-технічним, фінансовим, інформаційним і військовим потенціалом США досі не мають рівних.", "Американська модель поєднує традиційні риси (підтримка підприємництва, обмежене, але ефективне втручання держави, висока трудова мораль) і новітні: гнучке дрібносерійне виробництво, мікроелектроніку, автоматизацію, біоінженерію, високу наукоємність."], "ul": ["США однією з перших перейшли до постіндустріальної стадії", "частка США — 44 % усіх витрат розвинених країн на науково-дослідні роботи (за даними підручника)", "сфера послуг дає майже 80 % ВВП", "ТНК США — найпотужніші у світі", "Китай випередив США за загальним ВВП і обсягом промислового виробництва"]}, {"h": "Третинний сектор", "p": ["Традиційні послуги — фінанси, торгівля, туризм, освіта, медицина; з 1990-х рр. швидко зростають ІТ-, консалтингові, маркетингові та управлінські послуги. Фінансову систему очолює Федеральна резервна система (ФРС).", "Новітні послуги зосереджені в технополісах і технопарках. Перший технополіс з’явився 1951 р. у Каліфорнії — це «Кремнієва долина» на базі Стенфордського університету."], "ul": ["ФРС об’єднує 12 федеральних резервних банків; серед найбільших банків — JPMorgan Chase, Bank of America", "американським ІТ-компаніям належить близько третини світового виробництва програмного забезпечення", "головні райони технопарків — мегалополіси Сан-Сан, Чипітс і Босваш", "туризм: пляжний (Флорида, Гаваї, Каліфорнія), гральний (Лас-Вегас), пізнавальний (Вашингтон, Нью-Йорк)", "найпотужніша у світі транспортна мережа — автошляхи, залізниці, авіамаршрути"]}, {"h": "Промисловість: галузі міжнародної спеціалізації", "p": ["У США представлені всі види виробництв, але спеціалізацію визначає передусім багатопрофільне машинобудування — автомобільне, авіакосмічне, електротехнічне та електронне.", "Важливі також металургія, хімічна й фармацевтична промисловість та електроенергетика."], "ul": ["автомобілебудування: «автомобільний цех» — Приозер’я (Детройт, Флінт, Толідо); компанії «Форд», «Дженерал Моторс», «Крайслер»", "авіакосмічна техніка: «Боїнг», «Локхід Мартін»; «авіаційні столиці» — Сіетл і Сан-Дієго", "електроніка та комп’ютери: «Х’юлетт-Пакард», «Делл», «Еппл»", "чорна металургія: Приозерна, Північноаппалацька, Приатлантична та Південна бази; виробництво поступово скорочується", "кольорова металургія: алюміній, мідь, цинк, свинець — трійка світових лідерів", "хімія — 2-ге місце у світі після Китаю, фармацевтика — 1-ше місце", "електроенергетика: переважають ТЕС, близько 80 АЕС, зростає частка ВЕС і СЕС"]}, {"h": "Сільське господарство", "p": ["У галузі зайнято менше 1 % працюючих, але вона повністю забезпечує країну продовольством і є найбільшим експортером багатьох видів продукції. Основа — високопродуктивна, технічно оснащена ферма; у вартості продукції переважає тваринництво.", "Різноманіття природних умов зумовило вузьку спеціалізацію цілих районів — сільськогосподарських поясів."], "ul": ["провідні позиції з кукурудзи, сої, пшениці, цитрусових, арахісу, цукрових буряків, винограду", "лідер за вирощуванням генетично модифікованих культур (передусім сої)", "«пшеничний» пояс — уздовж кордону з Канадою", "«кукурудзяно-соєвий» пояс — на південь від Великих озер до Кордильєр", "«бавовняний» пояс — Флорида та узбережжя Мексиканської затоки", "передгір’я Кордильєр — пасовища"]}, {"h": "Зовнішні економічні зв’язки та відносини з Україною", "p": ["США — другий у світі експортер (після Китаю) і найбільший імпортер товарів, а також провідний експортер патентів, ліцензій та ІТ-послуг і потужний інвестор. Головні партнери — Канада, Мексика, Китай, Японія, Німеччина.", "США інвестують в економіку України, на її території працюють сотні компаній з американським капіталом, а українські ІТ-фірми надають послуги аутсорсингу. Після початку повномасштабного вторгнення Росії 24 лютого 2022 р. США стали одним із найбільших постачальників військової, фінансової та гуманітарної допомоги Україні."], "ul": ["експорт: машини й обладнання, літаки, аерокосмічна техніка, зброя, вугілля, пшениця, кукурудза, соя, бавовна", "імпорт: нафта, автомобілі, побутова техніка, тропічна продукція, споживчі товари", "імпорт трудомістких виробів пояснюється дорогою робочою силою", "в Україні працюють «Кока-Кола», «ПепсіКо», «Проктер енд Гембл», «Макдональдс» та ін.", "Україна експортує до США чорні метали, мінеральні добрива, продукти харчування", "з США імпортують нафтопродукти, машини та механізми, полімери"]}], "terms": [["Постіндустріальна економіка", "економіка, у якій провідну роль відіграють сфера послуг, наука та інформаційні технології."], ["Біоінженерія", "напрям науки й техніки, що застосовує інженерні принципи в біології та медицині, зокрема для цілеспрямованої зміни організмів."], ["Технополіс", "науково-виробничий центр, що поєднує університети, дослідні установи та високотехнологічні підприємства."], ["Наукоємність", "частка витрат на науку та дослідження у вартості продукції чи ВВП."], ["Сільськогосподарський пояс", "великий район із вузькою спеціалізацією сільського господарства, зумовленою природними умовами."], ["ТНК (транснаціональна корпорація)", "велика компанія, що має виробничі та збутові підрозділи в багатьох країнах."], ["Федеральна резервна система (ФРС)", "центральна банківська система США, що об’єднує 12 федеральних резервних банків."]], "f": "Історія технополісів почалася саме в США: 1951 р. у Каліфорнії на базі Стенфордського університету виникла «Кремнієва долина», яка й досі є найбільшою.", "pr": ["Практична робота з підручника: складіть схему зовнішньоекономічних зв’язків США (експорт, імпорт, головні партнери, інвестиції, послуги).", "На контурній карті США позначте сільськогосподарські пояси, «автомобільний цех» Приозер’я, «авіаційні столиці» та мегалополіси Босваш, Чипітс і Сан-Сан. Підпишіть, що виробляє кожен район."], "qz": [{"q": "Яка частка сфери послуг у ВВП США (за даними підручника)?", "o": ["близько 30 %", "близько 50 %", "майже 80 %", "понад 95 %"], "a": 2, "why": "Сфера послуг дає майже 80 % ВВП США."}, {"q": "Де виник перший технополіс?", "o": ["У Сіетлі", "У Каліфорнії («Кремнієва долина»)", "У Детройті", "У Бостоні"], "a": 1, "why": "«Кремнієва долина» з’явилася 1951 р. у Каліфорнії на базі Стенфордського університету."}, {"q": "Який район США називають «автомобільним цехом»?", "o": ["Флориду", "Каліфорнію", "Техас", "Приозер’я"], "a": 3, "why": "Основні автозаводи зосереджені в Приозер’ї: Детройт, Флінт, Толідо."}, {"q": "Які міста називають «авіаційними столицями» США?", "o": ["Сіетл і Сан-Дієго", "Чикаго і Детройт", "Маямі й Атланта", "Піттсбург і Балтімор"], "a": 0, "why": "Авіабудування зосереджене в штатах Вашингтон і Каліфорнія."}, {"q": "У якій галузі хімічної промисловості США утримують світову першість?", "o": ["Виробництві мінеральних добрив", "Фармацевтиці", "Нафтохімії", "Виробництві пластмас"], "a": 1, "why": "За обсягом хімічної продукції США другі після Китаю, а у фармацевтиці — перші."}, {"q": "Який сільськогосподарський пояс простягається вздовж кордону з Канадою?", "o": ["Бавовняний", "Кукурудзяно-соєвий", "Пшеничний", "Цитрусовий"], "a": 2, "why": "Пшеничний пояс тягнеться від озера Верхнє до Кордильєр уздовж кордону з Канадою."}, {"q": "Яка продукція переважає у вартості сільського господарства США?", "o": ["Тваринництва", "Зернових", "Овочівництва", "Бавовни"], "a": 0, "why": "Частка тваринництва становить 68 % вартості продукції."}, {"q": "Який тип електростанцій дає найбільшу частку електроенергії США?", "o": ["ГЕС", "АЕС", "ВЕС", "ТЕС"], "a": 3, "why": "На ТЕС припадає близько 73 % виробництва."}, {"q": "Що США переважно імпортують?", "o": ["Пшеницю і кукурудзу", "Літаки та зброю", "Нафту, автомобілі, споживчі товари", "Патенти та ліцензії"], "a": 2, "why": "США імпортують паливо та трудомісткі споживчі товари через дорогу робочу силу."}, {"q": "Яка установа відіграє визначальну роль у фінансовій системі США?", "o": ["Федеральна резервна система", "Світовий банк", "МВФ", "Нью-Йоркська фондова біржа"], "a": 0, "why": "ФРС об’єднує 12 федеральних резервних банків і керує банківською системою."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 2. Країни Америки", "sregion": "america", "sk": "america", "cid": "840", "cn": "США"}, {"n": "36", "p": "36", "t": "Канада", "pages": "с. 192–197", "g": "Схарактеризувати ЕГП, природні ресурси, населення та господарство Канади, роль українс
