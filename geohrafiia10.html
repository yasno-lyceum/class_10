ції (за даними підручника)"}, {"v": "понад 11 тис. км", "l": "автобанів (за даними підручника)"}], "blocks": [{"h": "Особливості промисловості", "p": ["Німеччина — економічно найпотужніша держава Європи. У промисловості працює чверть зайнятих, а її продукція — основа експорту. Головні підприємства зосереджені на заході країни та в Баварії."], "ul": ["висока технічна оснащеність усіх виробництв", "провідні галузі: машинобудування, хімія, електроенергетика, чорна металургія", "у світі спеціалізується також на м’ясній, цукровій та пивоварній промисловості", "умови для машинобудування: капітал, кваліфіковані кадри, наука, власна металургія, транспорт"]}, {"h": "Машинобудування", "p": ["Машинобудування дає майже половину вартості промислової продукції та близько 60 % експорту. Найбільші заводи розміщені в Рейнсько-Рурській, Мюнхенській, Штутгартській, Кельнській, Гамбурзькій агломераціях."], "ul": ["автомобілебудування: «Мерседес» (Штутгарт), «Фольксваген» (Вольфсбург), «Ауді» (Інгольштадт), «БМВ» (Мюнхен), «Опель» (Рюссельхайм)", "суднобудування: Гамбург, Бремен, Кіль, Росток", "авіакосмічне й військове машинобудування — Баварія (Мюнхен); складання «Аеробусів» — Гамбург", "верстати з числовим програмним управлінням, промислові роботи — Рур", "електротехніка: генератори, трансформатори, побутові прилади, засоби зв’язку"]}, {"h": "Хімічна промисловість, енергетика, металургія", "p": ["Хімічна промисловість зосереджена в прирейнських районах: земля Північний Рейн — Вестфалія дає понад 2/5 продукції. Швидко зростає фармацевтика.", "Енергетика традиційно спирається на вугільні ТЕС, але зростає частка газу та відновлюваних джерел; у країні вирішили відмовитися від АЕС. Примітка: у 2023 р. Німеччина зупинила останні атомні електростанції."], "ul": ["центри хімії: Леверкузен («Байєр»), Людвігсгафен («БАСФ»), Франкфурт-на-Майні", "чорна металургія — у Рурі, на власному вугіллі та імпортній руді", "кольорова металургія — на імпортній сировині й металобрухті (порти, Рур, Кельн)", "за виробництвом паперу Німеччина перша в Європі (за даними підручника)"]}, {"h": "Сфера послуг і транспорт", "p": ["У світі Німеччина спеціалізується на фінансових і транспортних послугах та туризмі. Банки відіграють велику роль в економіці, надаючи довгострокові кредити. Країна має одну з найгустіших транспортних мереж."], "ul": ["Франкфурт-на-Майні — фінансовий центр і найбільший аеропорт країни", "Німеччина — серед п’яти лідерів Європи за туристичними відвідуваннями; розвинений оздоровчий і діловий туризм", "ІТ- і телекомунікаційна галузь — друга за кількістю працівників після машинобудування", "понад 40 тис. км залізниць і система швидкісних пасажирських ліній", "понад 7 тис. км внутрішніх водних шляхів, канали з’єднують річки з Північним і Чорним морями (через Дунай)", "Гамбург — найбільший морський порт"]}, {"h": "Територіальна організація і зовнішні зв’язки", "p": ["Райони Німеччини мають різну спеціалізацію. Країна продає за кордон понад третину своєї продукції, посідає перше місце в Європі за обігом зовнішньої торгівлі та має постійне додатне сальдо."], "ul": ["північний захід: порти, мінеральні ресурси, енергетика, машини, хімія", "південь: електроніка, електротехніка, авіаційна й військова техніка", "схід: поєднання старих (ТЕС на бурому вугіллі, основна хімія) і нових виробництв (транспорт, електроніка)", "головні партнери: Франція, Нідерланди, Італія, Велика Британія, США, Японія"]}, {"h": "Зв’язки України й Німеччини", "p": ["Німеччина — один із найважливіших економічних партнерів України та один із найбільших інвесторів. Примітка: після 24 лютого 2022 р. Німеччина стала одним із найбільших помічників України, а торгівля зазнала змін через війну, руйнування й порушення логістики."], "ul": ["експорт України: насіння олійних культур, м’ясні, молочні й кондитерські вироби, мед", "імпорт з Німеччини: обладнання, транспортні засоби, хімічна продукція", "найбільше німецьких інвестицій отримала чорна металургія (за даними підручника)", "в Україні зареєстровано близько 4 тис. підприємств з німецьким капіталом (за даними підручника)"]}], "terms": [["Міжнародна спеціалізація", "виробництво країною певних товарів чи послуг у значно більших обсягах, ніж потрібно для власних потреб, з метою експорту."], ["Постіндустріальний розвиток", "етап розвитку економіки, коли провідною стає сфера послуг, наука та інформаційні технології."], ["Автобан", "високошвидкісна автомагістраль з розділеними смугами руху та розв’язками на різних рівнях."], ["Додатне сальдо зовнішньої торгівлі", "перевищення вартості експорту над вартістю імпорту."], ["Фармацевтична промисловість", "галузь хімічної промисловості, що виробляє ліки й медичні препарати."], ["Кооперування", "виробничі зв’язки між підприємствами, що спільно випускають певну продукцію."]], "f": "У Німеччині виробляють більше верстатів із числовим програмним управлінням, ніж навіть у Японії (за даними підручника).", "pr": ["Позначте на контурній карті найбільші машинобудівні центри Німеччини (Штутгарт, Вольфсбург, Мюнхен, Інгольштадт, Кельн, Гамбург, Бремен) і підпишіть, що в них виробляють; зробіть висновок про їхнє розміщення.", "Складіть схему «Чинники успіху німецького машинобудування»: капітал, кадри, наука, металургійна база, транспорт, кооперування — до кожного чинника наведіть приклад."], "qz": [{"q": "Яка галузь дає майже половину вартості промислової продукції Німеччини?", "o": ["Хімічна", "Харчова", "Машинобудування", "Легка"], "a": 2, "why": "Машинобудування — провідна галузь і основа експорту Німеччини."}, {"q": "У якому місті розташована штаб-квартира «Фольксвагена»?", "o": ["Вольфсбург", "Штутгарт", "Мюнхен", "Інгольштадт"], "a": 0, "why": "Концерн «Фольксваген» базується у Вольфсбурзі."}, {"q": "Яка автомобільна марка пов’язана зі Штутгартом?", "o": ["«БМВ»", "«Опель»", "«Ауді»", "«Мерседес»"], "a": 3, "why": "«Даймлер-Бенц» (марка «Мерседес») розташований у Штутгарті."}, {"q": "Яка земля виробляє понад 2/5 хімічної продукції Німеччини?", "o": ["Баварія", "Північний Рейн — Вестфалія", "Саксонія", "Шлезвіг-Гольштейн"], "a": 1, "why": "Прирейнські райони — головний центр німецької хімії."}, {"q": "У якому місті розташований концерн «Байєр»?", "o": ["Леверкузен", "Людвігсгафен", "Росток", "Бремен"], "a": 0, "why": "Леверкузен — штаб-квартира «Байєр», а «БАСФ» — у Людвігсгафені."}, {"q": "Який регіон є опорою авіакосмічного й військового машинобудування Німеччини?", "o": ["Рур", "Саксонія", "Баварія", "Мекленбург"], "a": 2, "why": "Південь країни, насамперед Баварія, спеціалізується на складних технологіях."}, {"q": "Де розташований найбільший аеропорт Німеччини за пасажиро- й вантажообігом?", "o": ["Берлін", "Гамбург", "Мюнхен", "Франкфурт-на-Майні"], "a": 3, "why": "Аеропорт Франкфурта-на-Майні — лідер країни."}, {"q": "Яке місце посідає Німеччина в Європі за обігом зовнішньої торгівлі?", "o": ["Перше", "Друге", "Третє", "Четверте"], "a": 0, "why": "Німеччина продає понад третину продукції і лідирує в Європі за товарообігом."}, {"q": "Що означає додатне сальдо зовнішньої торгівлі?", "o": ["Імпорт перевищує експорт", "Експорт перевищує імпорт", "Торгівля лише з ЄС", "Відсутність мит"], "a": 1, "why": "Німеччина продає за кордон більше, ніж купує."}, {"q": "Де розміщені основні суднобудівні підприємства Німеччини?", "o": ["Мюнхен, Штутгарт", "Кельн, Дюссельдорф", "Гамбург, Бремен, Кіль, Росток", "Дрезден, Лейпциг"], "a": 2, "why": "Суднобудування зосереджене в портових містах на півночі."}], "section": "Розділ І. ЄВРОПА", "topic": "Тема 2. Країни Європи", "sregion": "europe", "sk": "europe", "cid": "276", "cn": "Німеччина"}, {"n": "11", "p": "11", "t": "Франція (Французька Республіка)", "pages": "с. 57–63", "g": "Охарактеризувати географічне положення, населення, господарство Франції та її зв’язки з Україною.", "nums": [{"v": "понад 10 млн", "l": "жителів Парижа з передмістями — понад 15 % населення країни (за даними підручника)"}, {"v": "≈ 4/5", "l": "електроенергії виробляють АЕС (за даними підручника)"}, {"v": "78,8 %", "l": "частка сфери послуг у ВВП (за даними підручника)"}, {"v": "60 %", "l": "території займають сільськогосподарські землі (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення", "p": ["Франція має компактну територію, що нагадує п’ятикутник, і за площею в Європі поступається лише Україні (без урахування Росії). Вона розташована в Західній Європі, а її північна частина входить до «центральної осі розвитку»."], "ul": ["широкий вихід до незамерзаючих Атлантики та Середземного моря", "зручні затоки й гирла судноплавних річок для портів", "межує з вісьмома розвиненими країнами, зокрема з Німеччиною та Італією (члени «Великої сімки»)", "шляхи сполучення зв’язують Середземномор’я, Центральну Європу та Атлантику", "Євротунель під Ла-Маншем посилив транзитні можливості країни"]}, {"h": "Населення і Франкофонія", "p": ["Природний приріст населення Франції додатний (понад 3 ‰), що вирізняє її серед країн Європи. У містах живе 3/4 населення, і на відміну від Німеччини, серед міст явно домінує Париж.", "Франція розвиває зв’язки з франкомовними країнами в межах міжнародної організації Франкофонія; головний критерій участі — культурні зв’язки з Францією, а не лише володіння мовою."], "ul": ["переважають французи; також бретонці, корсиканці, каталонці, баски", "понад 4,5 млн іноземних працівників — з Алжиру, Марокко, Тунісу, Португалії, Іспанії (за даними підручника)", "за релігією переважають католики, зростає кількість мусульман", "великі агломерації: Париж, Марсель, Ліон, Лілль, Тулуза", "найбільша густота — Паризький район, північ і Середземноморське узбережжя", "Україна — спостерігач у Франкофонії"]}, {"h": "Сфера послуг", "p": ["Частка послуг у ВВП Франції більша, ніж у Німеччині. Особливе значення мають банківські послуги й туризм: Франція — одна з найбільш відвідуваних країн світу. Держава активно підтримує ІТ-сектор."], "ul": ["туризм дає близько 7 % ВВП і роботу ≈ 1 млн французів (за даними підручника)", "Ніцца — «столиця» Французької Рив’єри", "Софія-Антиполіс — перший у Європі технопарк (електроніка, програмування, біотехнології)", "транспортна мережа «павутиною» розходиться від Парижа", "Франція — головний вузол європейської мережі високошвидкісних залізниць", "великі порти: Марсель, Гавр, Дюнкерк; два міжнародні аеропорти в Парижі"]}, {"h": "Промисловість", "p": ["Структура промисловості типова для розвинених країн: провідні машинобудування та хімія. Для Франції характерна висока частка державного сектору («Рено», «Ер Франс»). Країна — серед лідерів Європи в авіакосмічній, військовій та електронній галузях."], "ul": ["авіакосмічна промисловість: Париж і Тулуза; ракети-носії «Аріан»; французькі й британські інженери створили надзвуковий лайнер «Конкорд»", "автомобілі: «Рено» і «Пежо-Сітроєн»; швидкісні поїзди — компанія «Алстом»", "хімія і парфумерія: «Мішлен», «Шанель», «Крістіан Діор»; центри — Руан, Гавр, Париж", "енергетика: АЕС дають майже 4/5 електроенергії; Франція — найбільший експортер електроенергії", "алюмінієва промисловість і металургія в портах (Дюнкерк, Фос біля Марселя)", "харчова: виноробство, сири, масло, цукор з буряків; легка — висока мода (Париж)"]}, {"h": "Сільське господарство", "p": ["Франція — найбільший у Західній Європі виробник і найбільший у Європі експортер сільськогосподарської продукції. На відміну від Німеччини, велике значення має рослинництво."], "ul": ["головна культура — пшениця; також кукурудза, ячмінь, жито", "великі зернові господарства — Паризький район", "виноградники й сади, овочі, цитрусові на півдні", "тваринництво м’ясо-молочного напряму — Бретань, Нормандія, Центральний масив", "третина угідь — під кормовими травами", "держава активно дотує фермерів"]}, {"h": "Просторова організація і зовнішні зв’язки", "p": ["Господарство Франції має яскравий центр — Паризький район (Іль-де-Франс), що дає понад 40 % промислової продукції. Економіка країни дуже відкрита, особливо в межах ЄС. Україна експортує до Франції олії, насіння олійних, одяг, а купує пальне, хімію, автомобілі, ліки, обладнання для АЕС."], "ul": ["Північ і Лотарингія пережили деіндустріалізацію; уряд залучає нові виробництва", "Схід (Лотарингія, Ельзас): залізні руди, сталь, промислове обладнання", "Середземномор’я: туризм, хімія, нафтопереробка, харчова промисловість", "партнери: Німеччина, Іспанія, Нідерланди, Італія, Велика Британія, США", "примітка: після 2022 р. Франція — один із партнерів, що підтримують Україну, а торгівля між країнами змінилася через війну та порушення логістики"]}], "terms": [["Франкофонія", "міжнародна організація співробітництва франкомовних країн і країн, що мають культурні зв’язки з Францією."], ["Технопарк (технополіс)", "територія, де зосереджені наукові установи та високотехнологічні компанії, наприклад Софія-Антиполіс."], ["Державний сектор економіки", "частина господарства, що належить державі або в якій держава має частку капіталу."], ["Високошвидкісна залізниця", "залізнична лінія для пасажирських поїздів, що рухаються зі швидкістю понад 250 км/год."], ["Деіндустріалізація", "скорочення промислового виробництва в традиційних промислових районах."], ["Агломерація", "скупчення міст і селищ навколо великого міста, пов’язаних тісними виробничими, транспортними й побутовими зв’язками."]], "f": "У дослідному центрі Кадараш на півдні Франції за участю багатьох країн будують перший міжнародний термоядерний реактор.", "pr": ["Знайдіть на карті атласу або онлайн-карті міста, з якими Париж з’єднаний високошвидкісними залізницями, і схематично нанесіть цю мережу на контурну карту; поясніть, чому вона нагадує павутину.", "Складіть порівняльну таблицю «Франція і Німеччина»: положення, роль столиці в системі розселення, частка послуг у ВВП, енергетика, провідна галузь сільського господарства; зробіть висновок про відмінності."], "qz": [{"q": "Яку образну назву отримала Франція за форму своєї території?", "o": ["«Чобіт»", "«Пентагон»", "«Шестикутник»", "«Острів»"], "a": 1, "why": "Територія Франції нагадує п’ятикутник."}, {"q": "Чим система розселення Франції відрізняється від німецької?", "o": ["Явним домінуванням столиці", "Відсутністю великих міст", "Низьким рівнем урбанізації", "Розташуванням міст лише на узбережжі"], "a": 0, "why": "У Парижі з передмістями живе понад 15 % населення країни."}, {"q": "Яку частку електроенергії Франції виробляють АЕС?", "o": ["Близько 1/10", "Близько 1/3", "Близько 4/5", "Близько 1/2"], "a": 2, "why": "Атомні станції дають майже 4/5 електроенергії країни."}, {"q": "Де розташований перший у Європі технопарк Софія-Антиполіс?", "o": ["Біля Парижа", "Біля Ліона", "Біля Лілля", "Біля Ніцци"], "a": 3, "why": "Софія-Антиполіс розташований на північний захід від Ніцци."}, {"q": "Яке місто — центр авіакосмічної промисловості на півдні Франції?", "o": ["Тулуза", "Марсель", "Бордо", "Страсбург"], "a": 0, "why": "У Тулузі зосереджені великі авіабудівні підприємства."}, {"q": "Що визначає участь країни у Франкофонії?", "o": ["Членство в ЄС", "Кордон із Францією", "Культурні зв’язки з Францією", "Рівень ВВП"], "a": 2, "why": "Головний критерій — культурні зв’язки, а не лише поширення мови."}, {"q": "Чим сільське господарство Франції відрізняється від німецького?", "o": ["Немає тваринництва", "Велике значення має рослинництво", "Повністю залежить від імпорту", "Спеціалізується лише на винограді"], "a": 1, "why": "У Франції велика площа орних земель і провідна роль рослинництва."}, {"q": "Яка компанія створила перші в Європі швидкісні пасажирські поїзди?", "o": ["«Рено»", "«Мішлен»", "«Ер Франс»", "«Алстом»"], "a": 3, "why": "Французька «Алстом» — лідер виробництва швидкісного рухомого складу."}, {"q": "Який район домінує в просторовій організації господарства Франції?", "o": ["Паризький район (Іль-де-Франс)", "Бретань", "Ельзас", "Корсика"], "a": 0, "why": "Іль-де-Франс дає понад 40 % промислової продукції країни."}, {"q": "Яку продукцію Україна імпортує з Франції?", "o": ["Зерно і соняшникову олію", "Обладнання для АЕС, хімію, автомобілі", "Залізну руду", "Мед і насіння олійних"], "a": 1, "why": "Україна купує у Франції паливо, хімію, автомобілі, ліки й обладнання для АЕС."}], "section": "Розділ І. ЄВРОПА", "topic": "Тема 2. Країни Європи", "sregion": "europe", "sk": "europe", "cid": "250", "cn": "Франція"}, {"n": "12", "p": "12", "t": "Велика Британія (Сполучене Королівство Великої Британії та Північної Ірландії)", "pages": "с. 64–71", "g": "Розібратися, як острівне положення, багаті паливні ресурси та фінансові послуги зробили Велику Британію однією з провідних постіндустріальних країн світу.", "nums": [{"v": "≈ 270 осіб/км²", "l": "середня густота населення (за даними підручника)"}, {"v": "понад 90 %", "l": "частка міського населення (за даними підручника)"}, {"v": "78,4 %", "l": "частка третинного сектору у ВВП (за даними підручника)"}, {"v": "2-ге місце", "l": "у світі за експортом послуг після США (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення, природні умови й ресурси", "p": ["Велика Британія — острівна держава на Британських островах. Вона складається з чотирьох історико-географічних частин: Англії, Шотландії та Уельсу на острові Великобританія і Північної Ірландії на північному сході острова Ірландія, де країна межує з Республікою Ірландія.", "Узбережжя має багато зручних бухт для портів, тому країна століттями активно торгує з Америкою, Азією й Африкою. Важливе багатство — нафта й природний газ шельфу Північного моря та власне вугілля."], "ul": ["острівне положення, вихід до Атлантичного океану та Північного моря", "численні бухти, зручні для будівництва портів", "тунель під Ла-Маншем сполучає острів із материком", "нафта й газ шельфу Північного моря", "вугільні басейни (видобуток поступово скорочується)", "значні ресурси вітрової енергії", "країна майже повністю забезпечує себе всіма видами палива — єдина така в Європі"]}, {"h": "Населення та розселення", "p": ["Демографічні процеси типові для розвинених країн: низький природний приріст і старіння населення. Переважають англійці (82 %), шотландці становлять близько десятої частини, ірландці й валлійці — по 2 % (за даними підручника).", "Населення розміщене нерівномірно: найщільніше заселена Англія, найменше — Шотландія та Центральний Уельс. Понад 90 % британців живуть у містах, сформувалися великі агломерації та мегалополіс Лонлів (Лондон — Ліверпуль)."], "ul": ["за віросповіданням більшість — християни (переважно протестанти)", "завдяки мігрантам зростає кількість мусульман та індуїстів", "найбільша густота — в Англії (≈ 370 осіб/км², за даними підручника)", "агломерації: Великий Лондон, Західно-Мідлендська (Бірмінгем), Великий Манчестер, Клайдсайд (Глазго)", "Англійський мегалополіс, або Лонлів", "Співдружність націй — добровільне об’єднання суверенних держав, колишніх частин Британської імперії"]}, {"h": "Третинний сектор: фінанси, наука, освіта, туризм, транспорт", "p": ["Третинний сектор створює понад три чверті ВВП. Провідні — фінансові та бізнес-послуги: Лондон посідає перше місце в рейтингу світових фінансових центрів, тут працюють Лондонська фондова біржа, Лондонська біржа металів, Міжнародна нафтова біржа, страховий ринок Ллойд.", "Велика Британія — світовий лідер у нанотехнологіях і біотехнологіях, має понад 40 університетів (найстаріші — Оксфорд і Кембридж). Важливі також туризм і транспорт: найбільші порти — Лондон, Ліверпуль, Саутгемптон, Гуль, найбільший аеропорт Європи — Хітроу."], "ul": ["понад третина світового обігу валютних операцій (за даними підручника)", "провідний страховий ринок Європи, третій у світі", "третє місце у світі за банківськими активами (за даними підручника)", "британська освіта вважається своєрідним еталоном; поширені закриті приватні школи", "туристи — переважно з сусідніх країн ЄС, США, Канади, Австралії, Китаю", "у внутрішніх перевезеннях лідирує автомобільний транспорт; найбільший вокзал — Ватерлоо"]}, {"h": "Промисловість: виробництва міжнародної спеціалізації", "p": ["Провідні галузі — машинобудування (40 % вартості продукції обробної промисловості) та хімічна промисловість. Новітні виробництва — авіакосмічне, електронне, електротехнічне, військово-промислове — зосереджені на південному сході (біля Кембриджа й Оксфорда) та в Мідленді.", "Енергетика спирається на власне паливо: ТЕС дають майже 70 % електроенергії, АЕС — близько 1/6, зростає частка вітрової та біоенергії. Нафтопереробні заводи розміщені на східному узбережжі, куди нафта надходить трубопроводами з Північного моря."], "ul": ["авіабудування: друге-третє місце у світі разом із Францією, лідерство у виробництві авіадвигунів", "автомобілебудування — у Мідленді (Бірмінгем, Ковентрі) та на південному сході", "хімія: нафтопродукти, пластмаси, фарби, композитні матеріали, фармацевтика", "понад третина нових європейських ліків розроблена у Великій Британії", "чорна металургія скоротилася, виробляє якісні марки сталі", "кольорова металургія: свинець, цинк, алюміній (Шотландія — дешева електроенергія)", "легка промисловість — дорогі вовняні (Йоркшир) та лляні (Північна Ірландія) тканини"]}, {"h": "Сільське господарство та економічні райони", "p": ["Сільське господарство високомеханізоване й продуктивне, але виробляє менше, ніж французьке. Основа — тваринництво: молочне й м’ясо-молочне скотарство, свинарство, вівчарство, птахівництво, переважно у вологішій західній частині.", "Найпотужніший економічний район — Південна Англія з Великим Лондоном, де переважають послуги. Інші райони — Центральна Англія (Мідленд), Північна Англія (Ланкашир, Йоркшир), Уельс, Шотландія, Північна Ірландія."], "ul": ["половина оброблюваних земель — під багаторічними травами", "вирощують зернові, цукровий буряк, овочі, ягоди, фрукти", "традиційна культура — картопля", "харчова промисловість: м’ясна, рибна, пивоваріння, охолоджені продукти", "Південна Англія — найбільш потужний і багатопрофільний район"]}, {"h": "Зовнішні економічні зв’язки та співпраця з Україною", "p": ["Особливість країни — великий вивіз капіталу: британські інвестиції вкладаються в економіку США, країн Співдружності та постачальників сировини. Експортує близько чверті своєї продукції, а торговельне сальдо зазвичай від’ємне.", "За даними підручника, Велика Британія — 11-та за обсягом зовнішньої торгівлі України і шоста за інвестиціями. Примітка: у 2020 р. Велика Британія вийшла з ЄС; після 2022 р. вона стала одним із найактивніших партнерів, що підтримують Україну у протидії російській агресії."], "ul": ["експорт: машини, електрообладнання, енергоносії, хімічна продукція", "імпорт: кольорові та рідкісні метали, обладнання, продовольство", "головні партнери (за даними підручника): країни ЄС, США, Китай", "другий у світі експортер послуг: банківські, страхові, консультаційні, ІТ", "з України: продукція металургії та агропромислового комплексу", "в Україну: хімічна продукція, енергоресурси, транспортні засоби"]}], "terms": [["Співдружність націй", "добровільне об’єднання суверенних держав, більшість із яких колись входили до Британської імперії; кожна з них проводить власну політику."], ["Мегалополіс", "смуга злитих між собою великих міських агломерацій; у Великій Британії це Лонлів (Лондон — Ліверпуль)."], ["Фінансовий центр", "місто, де зосереджені банки, біржі, страхові та інвестиційні компанії, що обслуговують міжнародні фінансові операції."], ["Біржа", "організований ринок, на якому регулярно укладають угоди з купівлі-продажу цінних паперів, валюти чи товарів (металів, нафти)."], ["Нанотехнології", "технології отримання матеріалів і пристроїв із заданими властивостями шляхом керування окремими атомами й молекулами."], ["Вивезення капіталу", "вкладання коштів (інвестицій) у підприємства та сферу послуг інших країн з метою отримання прибутку."]], "f": "Лондонський Ллойд — один із найбільших страхових ринків світу: тут страхують навіть унікальні об’єкти й ризики в різних країнах.", "pr": ["Позначте на контурній карті найбільші центри машинобудування Великої Британії (Лондон, Бірмінгем, Ковентрі, Манчестер, Глазго) та порти; підпишіть, які виробництва переважають у кожному районі.", "Складіть порівняльну таблицю «Лондон, Берлін, Париж, Київ»: населення, функції міста (фінансові, промислові, культурні), транспортні вузли; зробіть висновок про спільне й відмінне."], "qz": [{"q": "Яка частина Сполученого Королівства розташована на острові Ірландія?", "o": ["Уельс", "Шотландія", "Північна Ірландія", "Англія"], "a": 2, "why": "Північна Ірландія лежить на північному сході острова Ірландія, решта — на острові Великобританія."}, {"q": "Яка особливість паливно-енергетичних ресурсів вирізняє Велику Британію серед країн Європи?", "o": ["майже повністю забезпечує себе всіма видами палива", "повністю залежить від імпорту нафти", "не має власного вугілля", "вся електроенергія виробляється на ГЕС"], "a": 0, "why": "Країна має вугілля, нафту й газ Північного моря і майже повністю покриває потреби в паливі."}, {"q": "Як називають мегалополіс Великої Британії?", "o": ["Рандстад", "Лонлів", "Рейн-Рурський", "Паданський"], "a": 1, "why": "Англійський мегалополіс тягнеться від Лондона до Ліверпуля — звідси назва Лонлів."}, {"q": "Який сектор економіки створює найбільшу частку ВВП Великої Британії?", "o": ["первинний", "вторинний", "аграрний", "третинний"], "a": 3, "why": "Третинний сектор дає 78,4 % ВВП (за даними підручника)."}, {"q": "Яке місто посідає перше місце в рейтингу світових фінансових центрів (за даними підручника)?", "o": ["Лондон", "Манчестер", "Едінбург", "Ліверпуль"], "a": 0, "why": "У Лондоні розташовані найбільші банки, фондова біржа, біржа металів та страховий ринок Ллойд."}, {"q": "Де переважно розміщені нафтопереробні заводи Великої Британії?", "o": ["у Північній Ірландії", "на західному узбережжі", "на східному узбережжі", "у центрі Уельсу"], "a": 2, "why": "Нафту з шельфу Північного моря подають трубопроводами на східні береги країни."}, {"q": "Яка галузь є основою сільського господарства Великої Британії?", "o": ["виноградарство", "тваринництво", "бавовництво", "рисівництво"], "a": 1, "why": "Основу складають молочне й м’ясо-молочне скотарство, свинарство, вівчарство, птахівництво."}, {"q": "Який найбільший аеропорт Великої Британії та Європи?", "o": ["Шарль де Голль", "Франкфурт", "Леонардо да Вінчі", "Хітроу"], "a": 3, "why": "Хітроу в Лондоні обслуговує майже 70 млн пасажирів на рік (за даними підручника)."}, {"q": "Чим відомий Йоркшир у легкій промисловості?", "o": ["вовняними тканинами", "лляними тканинами", "взуттям", "шовком"], "a": 0, "why": "Йоркшир зберіг виробництво дорогих вовняних тканин, а Північна Ірландія — лляних."}, {"q": "Яку подію 2020 р. слід враховувати, вивчаючи зовнішні зв’язки Великої Британії?", "o": ["вступ до єврозони", "вихід з НАТО", "вихід з ЄС", "приєднання до Шенгенської зони"], "a": 2, "why": "У 2020 р. Велика Британія офіційно вийшла з Європейського Союзу."}], "section": "Розділ І. ЄВРОПА", "topic": "Тема 2. Країни Європи", "sregion": "europe", "sk": "europe", "cid": "826", "cn": "Велика Британія"}, {"n": "13", "p": "13", "t": "Італія (Італійська Республіка)", "pages": "с. 72–77", "g": "Дізнатися, як некомпактна територія, середземноморське положення та нестача сировини вплинули на господарство Італії і чому її північ і південь такі різні.", "nums": [{"v": "205 осіб/км²", "l": "середня густота населення (за даними підручника)"}, {"v": "67 %", "l": "частка міського населення (за даними підручника)"}, {"v": "73,8 %", "l": "частка третинного сектору у ВВП (за даними підручника)"}, {"v": "55", "l": "пам’яток Світової спадщини ЮНЕСКО — найбільше у світі (за даними підручника)"}], "blocks": [{"h": "Склад території та економіко-географічне положення", "p": ["Італія складається з материкової (близько 1/3 площі), півострівної (половина) та острівної (1/6) частин, тож її територія некомпактна, а положення окремих частин суттєво різниться.", "На півночі країна межує з Францією, Швейцарією, Австрією та Словенією, а всередині її території лежать держави-анклави Сан-Марино і Ватикан. Широкий вихід до Середземного моря — одного з найважливіших районів світового судноплавства — є великою перевагою."], "ul": ["розташована на південь від Альп, на Апеннінському півострові та островах", "Ватикан — найменша держава світу (44 га) у межах Рима", "більша частина території лежить не далі 50 км від моря", "сусідство з високорозвиненими країнами ЄС", "багаті рекреаційні ресурси: теплий клімат, море, гори, пам’ятки", "бідність на більшість видів корисних копалин"]}, {"h": "Населення та розселення", "p": ["Італія має складну демографічну ситуацію: частка людей старшого віку становить 25 %, а дітей — лише 13,6 % (за даними підручника), і населення зростає переважно за рахунок мігрантів. Переважають італійці (94 %), більшість жителів — католики, а церква відчутно впливає на життя суспільства.", "Найгустіше заселені рівнинна, економічно розвинена північ (Ломбардія) та окремі області центру й півдня (Кампанія). Близько половини жителів живуть на низовинах, які займають лише п’яту частину території."], "ul": ["старіння населення, одна з найменших у світі часток дітей", "національні меншини: німці, словенці, албанці, греки, французи", "міське населення — 67 %, дещо менше, ніж у Західній Європі", "найбільші міста: Рим, Мілан, Неаполь, Турин", "гірські райони заселені значно рідше"]}, {"h": "Третинний сектор: фінанси, туризм, транспорт", "p": ["Третинний сектор створює майже три чверті ВВП. У фінансовій сфері відбувається об’єднання банків і страхових компаній, великі банки володіють підприємствами й нерухомістю, зростає ІТ-індустрія.", "Італія — один із найбільших центрів міжнародного туризму: понад 65 млн туристів на рік (за даними підручника). Їх приваблюють Рив’єра, пам’ятки ЮНЕСКО, гірськолижні курорти Альп."], "ul": ["туристи — переважно з Німеччини, Великої Британії, Австрії, Швейцарії, США, Китаю", "«Автострада Сонця» — головна транспортна вісь: Турин — Мілан — Флоренція — Рим — Неаполь — Калабрія — Сицилія", "швидкісні поїзди сполучають Рим із Міланом, Генуєю, Венецією, Неаполем", "авіація важлива для зв’язку з островами; найбільші аеропорти — Рим, Мілан, Неаполь", "у зовнішніх перевезеннях переважає морський транспорт, у флоті найбільше танкерів"]}, {"h": "Промисловість: виробництва міжнародної спеціалізації", "p": ["Особливості промисловості: велика роль легкої та харчової галузей, залежність від імпортної сировини, недостатня частка наукоємних виробництв і значний державний сектор. Більшість потужностей зосереджена на півночі, у «промисловому трикутнику» Мілан — Турин — Генуя.", "Найважливіша галузь — машинобудування (30 % промислового виробництва), що випускає переважно товари середнього рівня складності. Світове значення мають автомобілі концерну «ФІАТ», побутова техніка, а також хімія, фармацевтика, легка промисловість."], "ul": ["енергетика: переважають ТЕС, помітна частка ГЕС (16 %) і геотермальних станцій; АЕС закрито після протестів", "чорна металургія на імпортній сировині — на узбережжі (Генуя, Неаполь, Таранто)", "«ФІАТ» (Турин): легкові авто, вантажівки та автобуси «Івеко», залізничний і міський транспорт", "кожен 12-й холодильник і кожна 8-ма пральна машина у світі — італійські (за даними підручника)", "хімія: нафтохімія, синтетичні волокна, пластмаси, шини, ліки; потужна нафтопереробка", "легка промисловість: тканини, одяг, модельне шкіряне взуття (Ломбардія, П’ємонт)", "харчова: сири, кондитерські й м’ясні вироби, консерви, вина, маслинова олія"]}, {"h": "Сільське господарство", "p": ["На відміну від більшості розвинених країн, в Італії лідирує рослинництво. Урожайність і продуктивність худоби нижчі, ніж у сусідів, бо багато дрібних сімейних господарств із відсталою агротехнікою.", "Найродючіші землі — на Паданській рівнині в басейні річки По: тут інтенсивне рослинництво і молочно-м’ясне скотарство."], "ul": ["зернові: пшениця, кукурудза, рис; у горах — жито й овес", "технічні: цукровий буряк, соя, бавовник, льон", "понад 12 млн т овочів на рік, більше половини — томати (за даними підручника)", "виноград і маслини — типові середземноморські культури", "Паданська рівнина — головний аграрний район"]}, {"h": "Просторова організація та зовнішні зв’язки", "p": ["Країна поділяється на розвинену промислову північ, яка нагадує Центральну Європу, і відносно відсталий аграрний південь, схожий на Грецію чи Португалію. На півдні розвивають невеликі підприємства трудомістких виробництв.", "Італія експортує обладнання, автомобілі, побутову техніку, тканини, одяг, взуття, хімічні товари, продукти й вино, а імпортує енергоносії та сировину; основні партнери — країни ЄС і США. За даними підручника, Україна мала з Італією додатне сальдо торгівлі, продаючи метали, зерно й олію. Примітка: комбінат «Азовсталь» у Маріуполі, який реконструювали за участі італійського капіталу, зруйновано під час російської облоги міста 2022 р."], "ul": ["північ — промислова, південь — аграрний і менш розвинений", "експорт: машини, побутова техніка, одяг, взуття, вино", "імпорт: нафта, природний газ, мінеральна сировина", "Італія — сьомий торговельний партнер України (за даними підручника)", "з України: чорні метали, зерно, олія", "в Україну: обладнання, хімічна продукція"]}], "terms": [["Держава-анклав", "держава, територія якої з усіх боків оточена територією іншої держави (Ватикан, Сан-Марино в Італії)."], ["Некомпактна територія", "територія витягнутої або розчленованої форми, частини якої значно віддалені одна від одної."], ["Промисловий трикутник", "головний промисловий район Італії між містами Мілан, Турин і Генуя."], ["Старіння населення", "зростання частки людей старшого віку в структурі населення через низьку народжуваність і довге життя."], ["Рекреаційні ресурси", "природні та культурно-історичні об’єкти, придатні для відпочинку, оздоровлення і туризму."], ["Кластер", "група пов’язаних між собою підприємств і організацій однієї території, що співпрацюють у виробництві певних товарів чи послуг."]], "f": "Ватикан, найменша держава світу, займає лише 44 га — менше, ніж багато міських парків, і повністю розташований у межах Рима.", "pr": ["Практична робота 2: складіть картосхему просторової організації економіки однієї з європейських країн «Великої сімки» (наприклад, Італії): позначте промислові центри, аграрні райони, порти, транспортні магістралі.", "Складіть туристичний проспект «Подорож Італією» (5–7 пунктів маршруту): для кожного пункту вкажіть місто чи район і вид рекреаційних ресурсів (море, гори, пам’ятки ЮНЕСКО)."], "qz": [{"q": "Яка частина території Італії найбільша?", "o": ["материкова", "острівна", "півострівна", "гірська альпійська"], "a": 2, "why": "Півострівна частина займає близько половини площі країни."}, {"q": "Яка держава-анклав розташована в межах міста Рима?", "o": ["Монако", "Ватикан", "Сан-Марино", "Андорра"], "a": 1, "why": "Ватикан площею 44 га — найменша держава світу всередині Рима."}, {"q": "Яка демографічна особливість характерна для Італії?", "o": ["висока частка людей старшого віку", "високий природний приріст", "переважання дітей у віковій структурі", "швидке зростання без мігрантів"], "a": 0, "why": "Частка людей старшого віку — 25 %, а дітей лише 13,6 % (за даними підручника)."}, {"q": "Які міста утворюють «промисловий трикутник» Італії?", "o": ["Рим — Неаполь — Палермо", "Венеція — Флоренція — Болонья", "Таранто — Барі — Неаполь", "Мілан — Турин — Генуя"], "a": 3, "why": "Більшість виробничих потужностей зосереджено саме на півночі в цьому трикутнику."}, {"q": "Чому АЕС в Італії були виведені з експлуатації?", "o": ["через відсутність урану", "через масові протести населення", "через землетрус", "через рішення ЄС"], "a": 1, "why": "Підручник пояснює закриття АЕС масовими протестами населення."}, {"q": "Який концерн займає панівне становище в транспортному машинобудуванні Італії?", "o": ["«ФІАТ»", "«Рено»", "«Фольксваген»", "«Роллс-Ройс»"], "a": 0, "why": "«ФІАТ» (з 2014 р. «ФІАТ-Крайслер») випускає легкові авто, вантажівки «Івеко», рухомий склад."}, {"q": "Чим Італія відрізняється від більшості розвинених країн у сільському господарстві?", "o": ["лідирує вівчарство", "не вирощує зернових", "лідирує рослинництво", "повністю відсутні дрібні господарства"], "a": 2, "why": "В Італії провідна галузь — рослинництво, тоді як у більшості розвинених країн — тваринництво."}, {"q": "Де розташовані найпродуктивніші сільськогосподарські землі Італії?", "o": ["на Сицилії", "в Апеннінах", "у Калабрії", "на Паданській рівнині"], "a": 3, "why": "Паданська рівнина в басейні річки По — головний аграрний район країни."}, {"q": "Чому металургійні заводи Італії розміщені на узбережжі (Генуя, Неаполь, Таранто)?", "o": ["вони працюють на імпортній сировині й паливі", "там найбільші родовища руди", "там найдешевша робоча сила", "через туристичну привабливість"], "a": 0, "why": "Сировину й паливо завозять морем, тому підприємства тяжіють до портів."}, {"q": "Яку рису має південь Італії порівняно з північчю?", "o": ["вищий рівень розвитку промисловості", "більша частка сільського господарства", "розташування «промислового трикутника»", "найвища концентрація банків"], "a": 1, "why": "Південь відносно відсталий, частка сільського господарства там значно вища."}], "section": "Розділ І. ЄВРОПА", "topic": "Тема 2. Країни Європи", "sregion": "europe", "sk": "europe", "cid": "380", "cn": "Італія"}, {"n": "14", "p": "14", "t": "Польща (Республіка Польща)", "pages": "с. 78–83", "g": "З’ясувати, які чинники допомогли Польщі після 1990 р. перетворитися на динамічну економіку ЄС і якими є її зв’язки з Україною.", "nums": [{"v": "123 особи/км²", "l": "середня густота населення (за даними підручника)"}, {"v": "≈ 98 %", "l": "частка поляків у населенні (за даними підручника)"}, {"v": "63 %", "l": "частка третинного сектору у ВВП (за даними підручника)"}, {"v": "≈ 80 %", "l": "частка країн ЄС у зовнішній торгівлі (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення, природні умови й ресурси", "p": ["Польща має компактну територію в центрі Європи і межує з Німеччиною, Чехією, Словаччиною, Литвою, Білоруссю, Україною та Росією (Калінінградська область). Більшість сусідів — члени ЄС і НАТО, тобто економічні партнери й союзники; особливо важливий кордон із Німеччиною.", "На півночі країну омиває Балтійське море з портами Гданськ, Гдиня, Щецин. Польща лежить на перетині шляхів зі Сходу на Захід і з Півночі на Балкани, що сприяє розвитку транзиту. Головне мінеральне багатство — кам’яне вугілля Верхньосилезького басейну, є також мідні руди."], "ul": ["компактна територія в центрі Європи", "членство в ЄС (з 2004 р.) і НАТО", "вихід до Балтійського моря, порти Гданськ, Гдиня, Щецин", "транзитне положення між Сходом і Заходом Європи", "кам’яне та буре вугілля, мідь, цинк і свинець", "переважно рівнинний рельєф, великі річки Вісла й Одра"]}, {"h": "Населення та розселення", "p": ["Після Другої світової війни Польща через міграції та зміну кордонів стала майже однонаціональною: поляки становлять близько 98 %, німці — 1,3 %, українці — 0,6 % (за даними підручника). Більшість віруючих — католики, церква має великий вплив на суспільство.", "Майже 2/3 населення живе в містах. Найгустіше заселені південь (Малопольське і Силезьке воєводства) і центр, найменше — захід і північний захід. Демографічна ситуація несприятлива: частка молоді поступово зменшується."], "ul": ["найбільші міста: Варшава, Лодзь, Краків, Вроцлав, Познань, Гданськ", "найбільша агломерація — Верхньосилезька (Катовіце)", "Польща приймає багато трудових мігрантів з України", "понад мільйон поляків працюють у країнах ЄС і надсилають гроші додому", "примітка: після повномасштабного вторгнення Росії 2022 р. Польща прийняла дуже велику кількість українських біженців"]}, {"h": "Третинний сектор і транспорт", "p": ["Після реформ 1990 р. частка промисловості у ВВП знизилася, а третинний сектор зріс до 63 % і продовжує зростати. Банківська система модернізувалася завдяки іноземному (італійському, німецькому, нідерландському, американському) капіталу.", "Польща — один із лідерів Східної Європи в ІТ, важливий центр туризму (Варшава, Краків, Гданськ, Сопот). Транспортна система має два головні вузли — Варшавський і Верхньосилезький; у вантажообігу лідирують автомобільний (половина) і залізничний транспорт."], "ul": ["розвиваються торгівля, великі торговельні мережі, готельний бізнес, громадське харчування", "ІТ-галузь: близько 500 тис. фахівців (за даними підручника)", "туристи: майже 18 млн на рік (за даними підручника)", "будуються швидкісні автостради", "портові комплекси Гданськ — Гдиня і Щецин — Свіноуйсьце", "найбільший аеропорт — Варшавський"]}, {"h": "Промисловість", "p": ["Сучасні виробництва обробної промисловості швидко розвиваються: Польща — перша в Європі за випуском телевізорів, помітна у виробництві міді, сталі, цементу, паперу (за даними підручника). Країна долучилася до виробничих ланцюгів світових автомобільних і побутово-технічних компаній.", "Основа енергетики — вугілля: ТЕС на кам’яному й бурому вугіллі виробляють більшість електроенергії. Машинобудування дає майже третину промислової продукції, хоча технічно ще відстає від найпередовіших країн."], "ul": ["металургія: Краків («Нова Гута»), Катовіце, Ченстохова; мідь — Глогув, Легніця", "автомобілі: «Опель» (Глівіце), «Фольксваген» (Познань)", "рухомий склад (Вроцлав, Познань), судна (Гдиня, Гданськ, Щецин); компанія «ПЕСА» — трамваї, електропоїзди", "хімія: добрива, сода, кислоти, пластмаси; нафтопереробка — Плоцьк, Гданськ", "легка промисловість: текстиль Лодзі, туристичне спорядження", "харчова промисловість дає п’яту частину промислової продукції"]}, {"h": "Сільське господарство та економічні райони", "p": ["Сільське господарство залишається важливим: у країні багато фермерських господарств, частина з них технічно відстала. Понад половину продукції дає рослинництво — зернові (пшениця, жито, ячмінь, овес), картопля, цукровий буряк, овочі, ягоди, яблука.", "Господарство зосереджене у двох агломераціях — столичній і Лодзинській. Найбагатший на ресурси та індустріально розвинений — Південний район із Силезьким воєводством, Північний (Приморський) район має порти і курорти."], "ul": ["третє місце в Європі за збором жита (за даними підручника)", "один із провідних виробників картоплі та цукрового буряку в Європі", "відомі польські полуниця, малина, смородина, яблука", "тваринництво: свинарство і скотарство, м’ясо та молоко", "Варшава — фінансовий, науковий, культурний і промисловий центр", "Північний район: Гданськ — Гдиня, Щецин"]}, {"h": "Зовнішні зв’язки та співпраця з Україною", "p": ["Близько половини виробленої продукції Польща експортує; майже 80 % торгівлі припадає на країни ЄС, третина — на Німеччину. Країна має додатне сальдо у торгівлі машинами, продуктами легкої та харчової промисловості, сільгосппродукцією і послугами.", "За даними підручника, Польща — четвертий торговельний партнер України: Україна продає чорні метали, електричні машини, залізну руду, а купує паливо, нафтопродукти, пластмаси. В Україні працюють підприємства з польськими інвестиціями (наприклад, «Церсаніт», «Барлінек», «Новий Стиль»). Примітка: від 2022 р. Польща стала головним логістичним коридором для постачання допомоги Україні."], "ul": ["експорт: машини й обладнання, меблі, продукти харчування", "імпорт: хімічна продукція, нафта, залізна руда, бавовна", "інші партнери: Китай, США; роль Росії зменшилася", "з України: чорні метали, електричні машини, залізна руда", "в Україну: паливо, нафтопродукти, пластмаси"]}], "terms": [["Однонаціональна держава", "держава, у якій переважна більшість населення (понад 90 %) належить до одного народу."], ["Країна з перехідною економікою", "країна, що перейшла від планової (адміністративної) до ринкової економіки, як Польща після 1990 р."], ["Транзитне положення", "розташування країни на шляхах сполучення між іншими країнами й регіонами, що дає змогу надавати транспортні послуги."], ["Трудова міграція", "переміщення людей до іншої країни чи регіону з метою працевлаштування."], ["Агломерація", "скупчення міст і селищ навколо великого міста, тісно пов’язаних господарськими, транспортними й побутовими зв’язками."], ["Сальдо торговельного балансу", "різниця між вартістю експорту та імпорту країни; додатне, якщо експорт більший."]], "f": "Польська компанія «ПЕСА» виробляє трамваї, електропоїзди й локомотиви, які постачає в різні країни, зокрема в Україну.", "pr": ["За картами атласу порівняйте природні умови й ресурси Польщі та України (рельєф, клімат, ґрунти, корисні копалини) у вигляді таблиці; зробіть висновок про переваги кожної країни.", "Напишіть коротке есе (8–10 речень) «Як членство в ЄС з 2004 р. вплинуло на господарство Польщі», використовуючи матеріал параграфа та додаткові джерела."], "qz": [{"q": "З якою з цих країн Польща НЕ межує?", "o": ["Чехія", "Литва", "Угорщина", "Словаччина"], "a": 2, "why": "Польща межує з Німеччиною, Чехією, Словаччиною, Литвою, Білоруссю, Україною та Росією, але не з Угорщиною."}, {"q": "Які порти є головними портами Польщі?", "o": ["Клайпеда, Рига", "Гданськ, Гдиня, Щецин", "Роттердам, Гамбург", "Таллінн, Санкт-Петербург"], "a": 1, "why": "Головні порти розташовані на березі Балтійського моря — Гданськ, Гдиня, Щецин."}, {"q": "Яку частку населення Польщі становлять поляки (за даними підручника)?", "o": ["близько 98 %", "близько 81 %", "близько 67 %", "близько 50 %"], "a": 0, "why": "Після Другої світової війни країна стала етнічно однорідною — поляків близько 98 %."}, {"q": "Яке паливо є основою паливно-енергетичного комплексу Польщі?", "o": ["нафта", "природний газ", "уран", "вугілля"], "a": 3, "why": "Польща — один із лідерів Європи з видобутку кам’яного вугілля, ТЕС працюють на кам’яному й бурому вугіллі."}, {"q": "Де розташована найбільша міська агломерація Польщі?", "o": ["на півночі біля Гданська", "на півдні — Верхньосилезька", "на заході біля Познані", "на сході біля Любліна"], "a": 1, "why": "Верхньосилезька агломерація сформувалася на півдні, у вугільному басейні."}, {"q": "У якому місті зосереджено більшість підприємств текстильної промисловості Польщі?", "o": ["Краків", "Гданськ", "Лодзь", "Вроцлав"], "a": 2, "why": "Текстильне виробництво відзначається високою концентрацією в Лодзі та її околицях."}, {"q": "За виробництвом якого товару Польща посідає перше місце в Європі (за даними підручника)?", "o": ["телевізорів", "літаків", "вина", "алюмінію"], "a": 0, "why": "Польща — головний виробник телевізорів у ЄС."}, {"q": "Де розташовані великі нафтопереробні підприємства Польщі?", "o": ["Лодзь і Краків", "Глогув і Легніця", "Катовіце і Ченстохова", "Плоцьк і Гданськ"], "a": 3, "why": "Нафтопереробні заводи працюють у Плоцьку та Гданську."}, {"q": "Яка галузь дає понад половину продукції сільського господарства Польщі?", "o": ["рослинництво", "вівчарство", "рибальство", "птахівництво"], "a": 0, "why": "Більше половини продукції дає рослинництво, передусім зернові."}, {"q": "На які країни припадає майже 80 % зовнішньої торгівлі Польщі?", "o": ["країни СНД", "США і Канада", "країни ЄС", "країни Азії"], "a": 2, "why": "Основні партнери — країни ЄС, майже третина торгівлі — з Німеччиною."}], "section": "Розділ І. ЄВРОПА", "topic": "Тема 2. Країни Європи", "sregion": "europe", "sk": "europe", "cid": "616", "cn": "Польща"}, {"n": "15", "p": "15", "t": "Білорусь (Республіка Білорусь)", "pages": "с. 84–88", "g": "З’ясувати, як країна без значних корисних копалин розвинула обробну промисловість і чому її економіка сильно залежить від Росії.", "nums": [{"v": "81 %", "l": "частка білорусів у населенні (за даними підручника)"}, {"v": "46 осіб/км²", "l": "середня густота населення (за даними підручника)"}, {"v": "74 %", "l": "частка міського населення (за даними підручника)"}, {"v": "≈ 30 %", "l": "частка Білорусі у світовому виробництві кар’єрних самоскидів (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення, природні умови й ресурси", "p": ["Білорусь має компактну територію у формі п’ятикутника, майже в центрі якої лежить Мінськ. Країна межує з Україною, Польщею, Литвою, Латвією та Росією; кордони не мають чітких природних меж і зручні для транзиту.", "Негативні риси положення — відсутність виходу до моря та кордонів із високорозвиненими країнами. Корисних копалин небагато; найважливіші — калійні солі (Солігорськ), а нафти й газу власних практично немає."], "ul": ["компактна рівнинна територія у Східній Європі", "внутрішньоконтинентальне положення, немає виходу до моря", "транзитне положення між Росією та країнами ЄС", "калійні солі — основне мінеральне багатство", "значні лісові ресурси, Полісся", "примітка: у лютому 2022 р. Білорусь надала свою територію російським військам для нападу на Україну"]}, {"h": "Населення та розселення", "p": ["У країні живуть представники понад 100 національностей, переважають білоруси (81 %), є росіяни, поляки, українці (за даними підручника). Українців найбільше в містах і поліських районах.", "Демографічна ситуація кризова: народжуваність знижується, кількість населення зменшується. Серед віруючих переважають православні, є католики та греко-католики."], "ul": ["найвища густота — у центральній частині, у Мінській області", "найменша густота — у Вітебській області", "74 % населення — городяни", "Мінськ — столиця з 1919 р., у ньому живе кожен четвертий городянин", "Мінськ дає чверть промислової продукції країни"]}, {"h": "Промисловість: виробництва міжнародної спеціалізації", "p": ["Основа господарства — промисловість, що дає близько половини ВВП. Особливість Білорусі — переважання обробних виробництв за відсутності власної сировини, тому економіка залежить від зовнішніх, насамперед російських, поставок.", "Машинобудування випускає переважно продукцію середньої складності: вантажівки й автобуси «МАЗ», кар’єрні самоскиди «БелАЗ» (Жодіне), трактори МТЗ, комбайни «Гомсільмаш», побутову техніку «Атлант». Розвинені хімічна, нафтопереробна, легка та харчова галузі."], "ul": ["кар’єрні самоскиди «БелАЗ» — помітна частка світового ринку", "Мінський тракторний завод — надійні універсальні трактори", "радіоелектроніка й електротехніка — головно в Мінську", "калійні добрива (Солігорськ) — до 14 % світових продажів (за даними підручника)", "синтетичні волокна: Могильов, Новополоцьк, Світлогорськ, Гродно", "нафтопереробка на привізній нафті — Новополоцьк, Мозир", "енергетика: майже вся електроенергія — з паливних електростанцій; збудовано Білоруську АЕС"]}, {"h": "Сільське господарство", "p": ["Сільське господарство відіграє помітну роль і має досить високу продуктивність. Його основа — інтенсивне тваринництво: м’ясо-молочне та молочне скотарство, свинарство м’ясного й беконного напрямків, птахівництво.", "Близько половини оброблюваних земель — під зерновими, третина — під кормовими культурами. Країна — один зі світових лідерів за виробництвом картоплі на одну особу."], "ul": ["на півночі — м’ясо-молочне скотарство, на півдні — м’ясне", "навколо великих міст — молочні господарства", "зернові: ячмінь, озиме жито, пшениця, овес, гречка, тритикале", "картопля — традиційна важлива культура", "льон — сировина для льоноволокна", "Білорусь — серед провідних постачальників молочних продуктів"]}, {"h": "Третинний сектор і транспорт", "p": ["У сфері послуг традиційно переважають соціально-побутові послуги (житлово-комунальне господарство, транспорт, зв’язок, торгівля), значна частина яких залежить від державного бюджету. Банківський сектор невеликий, у ньому лідирують державні банки.", "Швидко розвивалася ІТ-індустрія, більшість програмного забезпечення йшла на експорт. Головні види транспорту — залізничний та автомобільний; територією країни проходять транс’європейські коридори та трубопроводи з Росії до Європи."], "ul": ["соціально-побутові послуги — найбільша частка третинного сектору", "домінування державних банків", "ІТ: близько 80 % програм — на експорт (за даними підручника)", "густа мережа автошляхів, система платних магістралей", "два транс’європейські транспортні коридори", "магістральні нафто- і газопроводи з Росії до Європи"]}, {"h": "Просторова організація та зовнішні зв’язки", "p": ["Найбільше промислової продукції дає Мінська область разом зі столицею (понад третину), далі — Гомельська та Вітебська області. Економіка відкрита: понад половину товарів і послуг експортує, а головний партнер — Росія, звідки надходять нафта, газ, метали.", "За даними підручника, Україна була другим торговельним партнером Білорусі: отримувала нафтопродукти, трактори, вантажівки, добрива, ліс, а продавала метали, сою, олію, цемент. Примітка: через участь білоруського режиму в агресії Росії проти України після 2022 р. торговельні зв’язки між країнами фактично згорнуто, а проти Білорусі запроваджено міжнародні санкції."], "ul": ["Мінська область — головний промисловий район", "найнижчі економічні показники — Могильовська та Гродненська області", "до Росії йде більша частина експорту машин і транспортних засобів", "з ЄС Білорусь імпортувала обладнання, пластмаси, ліки, текстиль", "експорт послуг: транспортні, телекомунікаційні, ІТ"]}], "terms": [["Обробна промисловість", "сукупність галузей, що переробляють сировину й напівфабрикати на готову продукцію (машинобудування, хімічна, легка, харчова промисловість)."], ["Внутрішньоконтинентальне положення", "розташування країни без виходу до моря, що ускладнює її зовнішні економічні зв’язки."], ["Демографічна криза", "стан, за якого народжуваність тривалий час нижча за смертність і кількість населення скорочується."], ["Калійні добрива", "мінеральні добрива, які виготовляють із калійних солей; Білорусь видобуває їх у районі Солігорська."], ["Тритикале", "порівняно нова зернова культура — гібрид пшениці й жита."], ["Транзит", "перевезення вантажів і пасажирів територією країни між іншими державами."]], "f": "Білоруський «БелАЗ» випускає одні з найбільших у світі кар’єрних самоскидів, що можуть перевозити сотні тонн породи за один рейс.", "pr": ["Позначте на контурній карті Білорусі найбільші промислові центри (Мінськ, Жодіне, Гомель, Могильов, Солігорськ, Новополоцьк, Мозир) і підпишіть, що в них виробляють.", "Складіть таблицю «Залежність економіки Білорусі від Росії»: що імпортує (паливо, сировина), що експортує, які транзитні шляхи проходять країною; зробіть висновок у 3–4 реченнях."], "qz": [{"q": "Яка негативна риса економіко-географічного положення Білорусі?", "o": ["надто довга морська берегова лінія", "відсутність виходу до моря", "розташування в Західній Європі", "гірський рельєф уздовж кордонів"], "a": 1, "why": "Білорусь не має виходу до моря та кордонів із високорозвиненими країнами."}, {"q": "Яке мінеральне багатство Білорусі найважливіше?", "o": ["кам’яне вугілля", "нафта", "калійні солі", "залізна руда"], "a": 2, "why": "На базі калійних солей у Солігорську працюють комбінати калійних добрив."}, {"q": "Яка частка міського населення в Білорусі (за даними підручника)?", "o": ["74 %", "50 %", "90 %", "35 %"], "a": 0, "why": "У містах живе 74 % населення, кожен четвертий городянин — у Мінську."}, {"q": "Яке підприємство в Жодіне випускає кар’єрні самоскиди?", "o": ["«МАЗ»", "МТЗ", "«Атлант»", "«БелАЗ»"], "a": 3, "why": "«БелАЗ» дає близько 30 % світового виробництва кар’єрних самоскидів (за даними підручника)."}, {"q": "Чому економіка Білорусі залежить від Росії?", "o": ["Білорусь імпортує з Росії продовольство", "країна не має власних значних запасів палива й сировини", "Росія — єдиний покупець білоруського ІТ", "Білорусь не має промисловості"], "a": 1, "why": "Обробна промисловість працює на привізній нафті, газі, металах, переважно з Росії."}, {"q": "Де розташовані нафтопереробні заводи Білорусі?", "o": ["Новополоцьк і Мозир", "Мінськ і Брест", "Гродно і Ліда", "Вітебськ і Орша"], "a": 0, "why": "Нафтопереробка працює на привізній нафті в Новополоцьку та Мозирі."}, {"q": "Яка галузь є основою сільського господарства Білорусі?", "o": ["бавовництво", "виноградарство", "інтенсивне тваринництво", "рисівництво"], "a": 2, "why": "Основу становлять скотарство, свинарство і птахівництво."}, {"q": "Що таке тритикале?", "o": ["сорт картоплі", "порода великої рогатої худоби", "вид льону", "гібрид пшениці й жита"], "a": 3, "why": "Тритикале — порівняно нова зернова культура, пшенично-житній гібрид."}, {"q": "Які послуги традиційно переважають у третинному секторі Білорусі?", "o": ["фінансові та страхові", "соціально-побутові", "туристичні", "консалтингові"], "a": 1, "why": "Найбільше значення мають житлово-комунальні, транспортні, побутові послуги, торгівля."}, {"q": "Яку роль відіграла Білорусь у 2022 р. щодо України?", "o": ["надала свою територію для нападу російських військ", "була посередником у торгівлі зерном", "вступила до НАТО", "стала членом ЄС"], "a": 0, "why": "У лютому 2022 р. з території Білорусі російські війська вторглися в Україну."}], "section": "Розділ І. ЄВРОПА", "topic": "Тема 2. Країни Європи", "sregion": "europe", "sk": "europe", "cid": "112", "cn": "Білорусь"}, {"n": "16", "p": "16", "t": "Росія (Російська Федерація)", "pages": "с. 89–96", "g": "Оцінити природно-ресурсний потенціал, населення та сировинну спеціалізацію господарства Росії і зрозуміти, як її агресія проти України змінила економічні зв’язки.", "nums": [{"v": "≈ 11 тис. км", "l": "протяжність території із заходу на схід (за даними підручника)"}, {"v": "8,4 особи/км²", "l": "середня густота населення (за даними підручника)"}, {"v": "3/4", "l": "частка міського населення (за даними підручника)"}, {"v": "2-ге місце", "l": "у світі за видобутком нафти й природного газу (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення, природні умови й ресурси", "p": ["Росія — найбільша за площею країна світу: 1/4 території лежить у Європі, 3/4 — в Азії, тому її вважають євразійською. Положення частин країни дуже різне: найвигідніше воно в середній і південній смугах європейської частини та на півдні Далекого Сходу.", "Країна має другу після Канади берегову лінію, але більшість морів біля її берегів узимку замерзає, а північне й тихоокеанське узбережжя слабко освоєні. Надра дуже багаті: нафта, газ, вугілля, руди чорних і кольорових металів, калійні солі, великі лісові ресурси."], "ul": ["найбільша площа у світі, розташування у двох частинах світу", "за даними підручника — 14 держав-сусідів, серед них Китай", "немає суходільного кордону з країнами «Великої сімки»", "значна частина кордонів проходить у малозаселених або гірських районах", "багато портів замерзає, потрібна льодова проводка", "примітка: Росія з 2014 р. веде агресію проти України, тимчасово окупувала Крим і частину Донбасу, а з 24 лютого 2022 р. розпочала повномасштабне вторгнення"]}, {"h": "Населення: склад, розселення, українська діаспора", "p": ["Середня густота населення низька, більшість жителів зосереджена в Головній смузі розселення — трикутнику Санкт-Петербург — Іркутськ — Астрахань. Сибір і Далекий Схід заселені рідко, переважно вздовж Транссибу, БАМу та судноплавних річок. Демографічна ситуація складна: народжуваність близька до смертності або нижча, населення старіє.", "Росія — багатонаціональна держава: росіяни становлять понад 80 %, є татари, українці, башкири, чуваші та інші народи (за даними підручника). Українці — третя за чисельністю етнічна група; історично сформувалися діаспори на Кубані («Малиновий Клин») і на Далекому Сході («Зелений Клин»)."], "ul": ["Головна смуга розселення: Санкт-Петербург — Іркутськ — Астрахань", "у Чечні, Туві, Татарстані росіяни становлять меншість", "основна релігія — православ’я; народи Поволжя й Північного Кавказу — переважно мусульмани, калмики й буряти — буддисти", "3/4 населення — городяни; 12 міст-мільйонників (за даними підручника)", "Москва — найбільший політичний, фінансовий і управлінський центр", "«Зелений Клин» — українські поселення на Далекому Сході кінця XIX — початку XX ст."]}, {"h": "Промисловість: сировинна спеціалізація", "p": ["У господарстві переважають добувна промисловість, електроенергетика, металургія, машинобудування, хімічна та лісова промисловість. Головний район видобутку нафти й газу — Західний Сибір; вугілля добувають у Кузнецькому, Кансько-Ачинському та Печорському басейнах.", "Понад 2/3 електроенергії дають ТЕС, близько 16 % — АЕС, основу гідроенергетики становлять Ангаро-Єнісейський та Волго-Камський каскади. Кольорова металургія (алюміній, мідь, нікель) тяжіє до сировини або дешевої енергії ГЕС Сибіру."], "ul": ["чорна металургія: Магнітогорськ, Череповець, Липецьк", "«Норильський нікель» — найбільший виробник нікелю і паладію", "алюмінієві заводи біля ГЕС: Абакан, Шеліхов, Красноярськ", "автомобілебудування в Поволжі: Тольятті, Набережні Челни", "значна частка військово-промислового комплексу та експорту озброєння", "хімія: азотні, фосфорні, калійні добрива («Уралкалій»)", "лісова й целюлозно-паперова промисловість — європейська північ, Урал, Сибір"]}, {"h": "Сільське господарство", "p": ["Через різноманітність природних умов сільське господарство має різну спеціалізацію. Переважає рослинництво, головне — зернове господарство; пшениця — найважливіша культура і важлива стаття експорту.", "Основні аграрні райони — басейни Дону й Кубані, Поволжя, Південний Урал, Алтайський край. На більшій частині Сибіру й Далекого Сходу сільське господарство екстенсивне й розвинене слабко."], "ul": ["зернові: пшениця, жито, кукурудза, ячмінь, овес", "технічні: цукровий буряк, соняшник, соя (соя — Далекий Схід)", "картопля та овочі; баштанні — Астраханська область, Північний Кавказ", "скотарство — центр, Поволжя, Північний Кавказ, південь Сибіру", "свинарство — у зоні мішаних лісів, вівчарство — на півдні", "на півночі — оленярство"]}, {"h": "Третинний сектор і транспорт", "p": ["Частка третинного сектору поступово зростала, але в банківському секторі переважає державний капітал («Сбербанк», «ВТБ», «Газпромбанк»). Після запровадження західних санкцій у 2014 р. туризм, особливо виїзний, скоротився; примітка: після 2022 р. санкції суттєво розширено.", "Головний вид транспорту — залізничний: Росія посідає друге місце у світі за довжиною залізниць, найдовша магістраль — Транссибірська, для її розвантаження збудовано БАМ. Друге місце у вантажоперевезеннях посідає трубопровідний транспорт."], "ul": ["залізниці перевозять до половини вантажів і пасажирів", "магістральні трубопроводи із Західного Сибіру до Європи", "автодороги — переважно на короткі відстані, низька якість", "річкові шляхи: Волга з Камою, Об з Іртишем, Єнісей, Лена, Амур", "морські порти: Санкт-Петербург, Новоросійськ, Владивосток, Мурманськ, Архангельськ", "Москва і Санкт-Петербург — головні центри послуг, науки, культури"]}, {"h": "Просторова організація та зовнішні зв’язки", "p": ["Обробна промисловість зосереджена в центрі й на півдні європейської частини, а азіатська частина спеціалізується на видобутку нафти, газу, деревини, металургії та виробництвах із дешевою електроенергією. На світовому ринку Росія виступає передусім постачальником сировини (газ, нафта, вугілля, метали, ліс, зерно) та озброєння.", "Імпортує Росія машини, обладнання, електроніку, хімічну продукцію, продовольство; основні партнери за даними підручника — Китай, Німеччина, Нідерланди, США, Італія, Японія. Через агресію проти України торгівля між країнами різко скоротилася ще після 2014 р., а після повномасштабного вторгнення 2022 р. Україна розірвала дипломатичні відносини з Росією, і економічні зв’язки фактично припинилися."], "ul": ["європейська частина — обробна промисловість і основне сільське господарство", "азіатська частина — видобуток ресурсів, металургія, лісова промисловість", "експорт: енергоносії, метали, деревина, зерно, зброя", "імпорт: машини, обладнання, електроніка, ліки, продовольство", "сировинна спеціалізація робить економіку залежною від світових цін на нафту й газ"]}], "terms": [["Євразійська країна", "держава, територія якої розташована одночасно в Європі та Азії."], ["Головна смуга розселення", "найбільш заселена й освоєна частина Росії у формі трикутника Санкт-Петербург — Іркутськ — Астрахань."], ["Діаспора", "частина народу, що проживає поза межами своєї історичної батьківщини."], ["Каскад ГЕС", "група гідроелектростанцій, побудованих послідовно на одній річці або в одному річковому басейні."], ["Сировинна спеціалізація", "орієнтація економіки країни переважно на видобуток і експорт сировини та палива."], ["Санкції", "обмежувальні економічні й політичні заходи, які держави або міжнародні організації запроваджують проти країни-порушника міжнародного права."]], "f": "Транссибірська магістраль — найдовша залізниця у світі: вона перетинає майже весь Євразійський материк від Москви до Тихого океану.", "pr": ["Позначте на контурній карті головні райони видобутку нафти, газу й вугілля Росії (Західний Сибір, Поволжя, Комі, Сахалін, Кузбас, Печорський басейн) та основні експортні трубопроводи; зробіть висновок про сировинну спеціалізацію країни.", "Складіть таблицю «Ресурси Росії та їх використання»: вид ресурсу — район — галузь, що на ньому базується; поясніть, чому залежність від експорту сировини робить економіку вразливою до санкцій."], "qz": [{"q": "Яка частина території Росії розташована в Азії?", "o": ["1/4", "1/2", "3/4", "вся територія"], "a": 2, "why": "3/4 території лежить в Азії, 1/4 — в Європі."}, {"q": "Між якими містами розташована Головна смуга розселення Росії?", "o": ["Москва — Новосибірськ — Владивосток", "Санкт-Петербург — Іркутськ — Астрахань", "Мурманськ — Омськ — Сочі", "Казань — Якутськ — Хабаровськ"], "a": 1, "why": "Саме цей трикутник охоплює більшість населення країни."}, {"q": "Який район є головним районом видобутку нафти й газу Росії?", "o": ["Західний Сибір", "Кольський півострів", "Калінінградська область", "Північний Кавказ"], "a": 0, "why": "Найбільші родовища нафти й газу зосереджені в Західному Сибіру."}, {"q": "Чому алюмінієві заводи Росії розміщені біля великих ГЕС Сибіру?", "o": ["там є бокситові копалини", "там живе найбільше людей", "там найкращі порти", "виробництво алюмінію потребує багато дешевої електроенергії"], "a": 3, "why": "Виплавка алюмінію енергоємна, тому тяжіє до дешевої енергії (Абакан, Шеліхов, Красноярськ)."}, {"q": "Який вид транспорту є основним у Росії?", "o": ["морський", "залізничний", "авіаційний", "річковий"], "a": 1, "why": "Залізниці перевозять до половини вантажів і пасажирів країни."}, {"q": "Як називають історичні українські поселення на Далекому Сході?", "o": ["«Зелений Клин»", "«Малиновий Клин»", "«Сірий Клин»", "«Жовтий Клин»"], "a": 0, "why": "«Зелений Клин» сформувався наприкінці XIX — на початку XX ст. переселенцями з українських губерній."}, {"q": "Яка культура є головною в рослинництві Росії?", "o": ["рис", "бавовник", "пшениця", "чай"], "a": 2, "why": "Пшениця становить понад третину збору зерна і є важливою статтею експорту."}, {"q": "Яке підприємство є найбільшим виробником нікелю і паладію?", "o": ["«Уралкалій»", "«Автоваз»", "«Сєвєрсталь»", "«Норильський нікель»"], "a": 3, "why": "Комбінат у Красноярському краї лідирує з виробництва нікелю і паладію."}, {"q": "Як Росія виступає на світовому ринку?", "o": ["переважно як постачальник сировини та озброєння", "як головний експортер електроніки", "як лідер експорту фінансових послуг", "як найбільший імпортер нафти"], "a": 0, "why": "Основу експорту становлять газ, нафта, вугілля, метали, ліс, зерно та зброя."}, {"q": "Що сталося з економічними зв’язками України та Росії після 24 лютого 2022 р.?", "o": ["вони суттєво зросли", "Україна розірвала дипломатичні відносини, зв’язки фактично припинилися", "країни створили митний союз", "нічого не змінилося"], "a": 1, "why": "Через повномасштабне вторгнення Україна розірвала дипломатичні відносини з Росією."}], "section": "Розділ І. ЄВРОПА", "topic": "Тема 2. Країни Європи", "sregion": "europe", "sk": "europe", "cid": "643", "cn": "Росія"}, {"n": "17", "p": "17", "t": "Загальний огляд Азії", "pages": "с. 97–100", "g": "Ознайомитися зі складом, економіко-географічним положенням, політичною картою, типами країн та інтеграційними об’єднаннями Азії.", "nums": [{"v": "≈ 28 млн км²", "l": "площа Азіатського макрорегіону ООН, близько 20 % суходолу (за даними підручника)"}, {"v": "48", "l": "держав і територій Азії без Росії (за даними підручника)"}, {"v": "13", "l": "монархій — найбільше серед регіонів світу (за даними підручника)"}, {"v": "10", "l": "країн — членів АСЕАН (за даними підручника)"}], "blocks": [{"h": "Склад регіону та субрегіони", "p": ["Азія — найбільша частина світу (44 млн км² проти 10 млн км² у Європи). В регіональному поділі ООН Азіатський макрорегіон менший — близько 28 млн км², бо північ Азії займає Росія, яку віднесено до Східної Європи.", "Тут розташовані країни-гіганти Китай та Індія, великі держави (Казахстан, Саудівська Аравія, Індонезія, Іран) і мікродержави (Сингапур, Бахрейн, Мальдіви). ООН виділяє п’ять субрегіонів."], "ul": ["Західна (Південно-Західна) Азія: Близький Схід і Закавказзя", "Південна Азія: Індія, Пакистан, Бангладеш, Іран, Афганістан, Непал та ін.", "Південно-Східна Азія: Індонезія, В’єтнам, Таїланд, Філіппіни, Сингапур та ін.", "Східна Азія: Китай, Японія, Південна і Північна Корея, Монголія", "Центральна Азія: Казахстан, Узбекистан, Туркменистан, Киргизстан, Таджикистан", "Північного субрегіону немає — північ Азії займає Росія"]}, {"h": "Економіко-географічне положення", "p": ["Положення країн Азії має три основні риси. Більшість держав приморські й мають вихід до морів Тихого, Індійського та Атлантичного океанів, є острівні країни й країни-архіпелаги.", "Сусідство багатьох країн дає змогу обирати близьких партнерів, а частина держав не має виходу до моря, що ускладнює їхні зовнішні зв’язки."], "ul": ["приморське положення більшості країн", "важливі морські шляхи: Малаккська та Ормузька протоки, Перська, Бенгальська, Оманська затоки, Аравійське море", "країни-архіпелаги: Індонезія, Філіппіни, Японія", "сусідське положення — вибір близьких партнерів", "внутрішньоконтинентальні країни: Афганістан, Киргизстан, Непал, Бутан, Монголія, Лаос"]}, {"h": "Політична карта Азії", "p": ["Як і в Європі, в Азії переважають республіки, проте саме тут найбільше монархій — 13 (за даними підручника). Серед конституційних монархій є імперія (Японія), королівства (Бутан, Таїланд, Камбоджа, Йорданія), емірати (Кувейт, Бахрейн), а абсолютними монархіями є Саудівська Аравія, ОАЕ, Катар, Оман, Бруней.", "Більшість держав унітарні, федеративних небагато — Індія, Пакистан, М’янма, Малайзія, ОАЕ, Непал. Тайвань вважають частково визнаною державою."], "ul": ["переважають республіки", "Японія — єдина у світі імперія", "абсолютні теократичні монархії — Саудівська Аравія, Бруней", "федерації: Індія, Пакистан, Малайзія, ОАЕ та ін.", "Тайвань (Китайська Республіка) — частково визнана держава"]}, {"h": "Райони збройних конфліктів і тероризму", "p": ["За кількістю національно-релігійних конфліктів Азія не має рівних у світі, передусім у Західній Азії. Понад півстоліття триває конфлікт між Ізраїлем і арабами Палестини, Кіпр розділений через греко-турецькі суперечки, у Сирії тривала громадянська війна, загрозу становило терористичне угруповання «Ісламська держава».", "Напружені відносини й в інших субрегіонах: між Індією та Пакистаном, Північною та Південною Кореєю. Примітка: частина конфліктів після 2019 р. загострилася або змінилася, тому актуальну ситуацію варто перевіряти за сучасними джерелами."], "ul": ["ізраїльсько-палестинський конфлікт", "розділений Кіпр", "громадянська війна в Сирії", "діяльність «Ісламської держави» в Іраку та Сирії", "індійсько-пакистанські суперечки (Кашмір)", "протистояння Північної та Південної Кореї"]}, {"h": "Типи країн за рівнем економічного розвитку", "p": ["Контрасти в рівні розвитку в Азії набагато більші, ніж у Європі. Високорозвинених країн лише три: Японія, Ізраїль і Кіпр; дев’ять країн мають перехідну економіку — колишні республіки СРСР і Монголія. Решта — країни, що розвиваються, але дуже різні.", "Особливе місце посідає Китай: його економіка поєднує планове господарство і вільне підприємництво під керівництвом Комуністичної партії; ООН вважає його країною, що розвивається, хоча за успіхами його відносять до нових індустріальних країн останньої хвилі."], "ul": ["високорозвинені: Японія, Ізраїль, Кіпр", "з перехідною економікою: Казахстан, Узбекистан, Грузія, Вірменія, Азербайджан, Монголія та ін.", "нові індустріальні країни: Південна Корея, Сингапур, Тайвань («азіатські тигри»), Малайзія, Таїланд, Індонезія, Туреччина", "нафтодобувні країни з високими прибутками: Саудівська Аравія, ОАЕ, Кувейт, Бруней", "країни з порівняно зрілою структурою господарства: Індія, Пакистан, Іран", "найменш розвинені: Афганістан, Бангладеш, Непал, Ємен, М’янма, Камбоджа, Лаос та ін."]}, {"h": "Інтеграційні процеси та міжнародні організації", "p": ["Одне з найпотужніших об’єднань — Асоціація держав Південно-Східної Азії (АСЕАН), створена 1967 р. для економічного, соціального й культурного розвитку регіону; штаб-квартира — у Джакарті. Арабські країни Західної Азії та Північної Африки об’єдналися в Лігу арабських держав (ЛАД, 1945 р.) зі штаб-квартирою в Каїрі.", "До інтеграції азіатських країн долучаються неазіатські держави Тихоокеанського басейну — США, Канада, Австралія, Нова Зеландія. Так формується Азіатсько-Тихоокеанський регіон (АТР) — гігантський за площею та економічною потужністю простір."], "ul": ["АСЕАН: Бруней, В’єтнам, М’янма, Індонезія, Камбоджа, Лаос, Малайзія, Філіппіни, Сингапур, Таїланд", "ЛАД: 22 держави (за даними підручника), мета — співпраця в економіці, фінансах, політиці", "ЛАД планує перетворитися на арабський союз за зразком ЄС", "АТР — об’єднує країни Азії та Тихоокеанського басейну", "на відміну від ЄС, азіатська інтеграція менш глибока"]}], "terms": [["Субрегіон", "частина великого регіону, що виділяється за спільними географічними, історико-культурними й економічними особливостями."], ["Країна-архіпелаг", "держава, територія якої повністю розташована на групі островів (Індонезія, Філіппіни)."], ["Абсолютна монархія", "форма правління, за якої вся повнота влади належить монархові без обмежень з боку парламенту чи конституції."], ["Нові індустріальні країни (НІК)", "країни, що розвиваються, які за короткий час досягли значних успіхів в індустріалізації та розвитку експорту."], ["АСЕАН", "Асоціація держав Південно-Східної Азії, створена 1967 р. для економічного, соціального й культурного співробітництва країн регіону."], ["Ліга арабських держав (ЛАД)", "міжнародна організація арабських країн Західної Азії та Північної Африки, створена 1945 р."]], "f": "Японія — єдина у світі держава, монарха якої традиційно називають імператором.", "pr": ["Позначте на контурній карті субрегіони Азії, підпишіть країни-члени АСЕАН та внутрішньоконтинентальні країни; поясніть, як положення впливає на їхній розвиток.", "Дослідіть один із міждержавних конфліктів в Азії (на вибір): складіть коротку довідку (причини, учасники, наслідки) та запропонуйте можливі шляхи розв’язання."], "qz": [{"q": "Чому в поділі ООН в Азії немає Північного субрегіону?", "o": ["там немає держав", "північ Азії займає Росія, віднесена до Східної Європи", "цей район належить Канаді", "це територія Китаю"], "a": 1, "why": "Росію в суспільно-географічному поділі відносять до Східної Європи."}, {"q": "Яка головна особливість економіко-географічного положення Азії?", "o": ["приморське положення більшості країн", "відсутність виходу до океанів", "розташування всіх країн у Південній півкулі", "однакові розміри всіх держав"], "a": 0, "why": "Більшість країн має вихід до морів трьох океанів."}, {"q": "Яка з цих країн не має виходу до моря?", "o": ["В’єтнам", "Таїланд", "Монголія", "Філіппіни"], "a": 2, "why": "Монголія — внутрішньоконтинентальна країна між Росією та Китаєм."}, {"q": "Яка азіатська країна є імперією?", "o": ["Таїланд", "Японія", "Бутан", "Малайзія"], "a": 1, "why": "Серед конституційних монархій Японія — єдина імперія."}, {"q": "Яка з цих країн є абсолютною монархією?", "o": ["Йорданія", "Камбоджа", "Кувейт", "Саудівська Аравія"], "a": 3, "why": "Саудівська Аравія — абсолютна теократична монархія."}, {"q": "Які азіатські країни належать до високорозвинених?", "o": ["Японія, Ізраїль, Кіпр", "Китай, Індія, Іран", "Таїланд, Малайзія, В’єтнам", "Казахстан, Узбекистан, Грузія"], "a": 0, "why": "Підручник відносить до високорозвинених лише Японію, Ізраїль і Кіпр."}, {"q": "Які країни називають «азіатськими тиграми»?", "o": ["Індію, Пакистан, Бангладеш", "Південну Корею, Сингапур, Тайвань", "Іран, Ірак, Сирію", "Непал, Бутан, Лаос"], "a": 1, "why": "«Азіатські тигри» — нові індустріальні країни першої хвилі."}, {"q": "Де розташована штаб-квартира АСЕАН?", "o": ["у Бангкоку", "у Сингапурі", "у Манілі", "у Джакарті"], "a": 3, "why": "Штаб-квартира АСЕАН — у Джакарті (Індонезія)."}, {"q": "Коли була створена Ліга арабських держав?", "o": ["1967 р.", "1991 р.", "1945 р.", "2015 р."], "a": 2, "why": "ЛАД створена 1945 р., її керівні органи — у Каїрі."}, {"q": "Що таке Азіатсько-Тихоокеанський регіон (АТР)?", "o": ["військовий блок країн Західної Азії", "простір інтеграції країн Азії та Тихоокеанського басейну", "субрегіон ООН у Центральній Азії", "об’єднання нафтодобувних країн"], "a": 1, "why": "До АТР долучилися також США, Канада, Австралія, Нова Зеландія."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 1. Загальна характеристика Азії", "sregion": "asia", "sk": "asia"}, {"n": "18", "p": "18", "t": "Природні умови та ресурси. Населення Азії", "pages": "с. 101–106", "g": "Оцінити природні умови й ресурси Азії та з’ясувати головні риси її населення: чисельність, відтворення, склад, розміщення й урбанізацію.", "nums": [{"v": "3/4", "l": "площі Азії займають гори, нагір’я та плоскогір’я (за даними підручника)"}, {"v": "≈ 60 %", "l": "частка Азії у населенні світу (за даними підручника)"}, {"v": "≈ 100 осіб/км²", "l": "середня густота населення Азії (за даними підручника)"}, {"v": "8 із 10", "l": "найбільших агломерацій світу розташовані в Азії (за даними підручника)"}], "blocks": [{"h": "Природні умови", "p": ["Азія має найконтрастніший рельєф серед регіонів: три чверті площі займають гори, нагір’я та плоскогір’я. На півдні й сході тягнуться молоді сейсмічно активні гори Альпійсько-Гімалайського та Тихоокеанського поясів, між ними лежать великі рівнини.", "Клімат дуже різноманітний: від тайги й багаторічної мерзлоти на півночі Китаю та Монголії до вологих екваторіальних лісів Індонезії й Малайзії. У глибині материка клімат стає континентальним, є великі пустелі, а в передгір’ях Гімалаїв — найвологіше місце планети."], "ul": ["рівнини: Велика Китайська, Індо-Гангська, Туранська низовини, плоскогір’я Декан та Аравійське", "високий ризик землетрусів і виверження вулканів у гірських поясах", "пустелі Руб-ель-Халі (Саудівська Аравія) і Гобі (Монголія, Китай)", "у передгір’ях Гімалаїв випадає понад 11 000 мм опадів на рік", "мусонний клімат на півдні та сході", "природні контрасти зумовлюють різноманіття господарської діяльності"]}, {"h": "Природні ресурси", "p": ["Ресурси розміщені вкрай нерівномірно. Найважливіші — паливні: у районі Перської затоки розташована найбільша нафтогазоносна провінція світу, значні запаси є в Центральноазійському та Зондському басейнах, великі родовища вугілля — у Китаї та Індії.", "Прісних вод багато в Південній і Південно-Східній Азії, тоді як Західна Азія посушлива. Для багатьох густонаселених країн проблема — нестача оброблюваних земель, тож освоюють навіть гірські схили (рисові тераси)."], "ul": ["нафта й газ — Перська затока, Центральна Азія, Зондський басейн", "вугілля — Китай, Індія", "залізні й марганцеві руди — Індія; хроміти — Туреччина, Філіппіни", "олово й вольфрам — Малайзія, Таїланд, М’янма", "лісові ресурси — Південно-Східна Азія: цінні породи (червоне, чорне, сандалове дерево)", "рекреаційні ресурси: близько 300 об’єктів Світової спадщини ЮНЕСКО (за даними підручника)"]}, {"h": "Чисельність і відтворення населення", "p": ["Азія — лідер за кількістю населення: майже 60 % жителів планети (за даними підручника). Тут розташовані сім із 13 найбільших за населенням країн світу, а в Китаї та Індії населення перевищує 1 млрд. Примітка: за оцінками ООН, у 2023 р. Індія випередила Китай і стала найбільшою за населенням країною світу.", "Багато країн ще перебувають на стадії демографічного вибуху, хоча з 1990-х рр. він слабшає. Висока частка дітей (до 30 %) дає великий трудовий потенціал, але й соціальні проблеми, тому країн
