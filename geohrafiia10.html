ької діаспори і зв’язки Канади з Україною.", "nums": [{"v": "2-ге місце", "l": "Канада у світі за площею"}, {"v": "202 тис. км", "l": "довжина берегової лінії — найбільша у світі (за даними підручника)"}, {"v": "≈ 1,2 млн", "l": "осіб українського походження (за даними підручника)"}, {"v": "> 90 %", "l": "населення живе в південній смузі вздовж кордону зі США (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення та природні умови", "p": ["Канада — друга за площею держава світу, що займає північ Північної Америки та прилеглі острови (Канадський Арктичний архіпелаг, Ньюфаундленд). Її омивають три океани — Північний Льодовитий, Тихий і Атлантичний.", "Головна особливість ЕГП — сусідство зі США, з якими Канада має довгий сухопутний кордон. Стримує розвиток суворий клімат: дві третини території лежать у субарктичному та арктичному поясах."], "ul": ["найдовша у світі берегова лінія", "сухопутний кордон зі США — майже 6 тис. км (за даними підручника)", "межує з Аляскою на північному заході та з північними штатами США на півдні", "великі площі малопридатні для проживання й господарства", "багаті мінеральні, лісові та водні ресурси"]}, {"h": "Населення та українська діаспора", "p": ["Населення Канади сформувалося внаслідок масової імміграції, ядро склали переселенці з Великої Британії та Франції. Нині тут понад 200 етнічних груп, а зростання населення забезпечує передусім імміграція; держава залучає фахівців пріоритетних спеціальностей.", "Українці — одна з найбільших меншин. Більшість переселилися наприкінці XIX — на початку XX ст. із західноукраїнських земель Австро-Угорщини, оселялися в преріях компактно й зберегли мову та традиції."], "ul": ["найбільші групи: «канадці», англійці, французи, німці, італійці, китайці", "українці — дев’ята за чисельністю етнічна група; найбільше — у Манітобі та Саскачевані", "центр української імміграції — Вінніпег", "понад 90 % жителів — у південній прикордонній смузі, особливо біля Великих озер і річки Святого Лаврентія", "майже 82 % населення — міське; найбільші міста — Торонто, Монреаль, Ванкувер", "у сфері послуг зайнято 79 % працюючих (за даними підручника)"]}, {"h": "Первинний сектор і сільське господарство", "p": ["Канада — високорозвинена країна «переселенського капіталізму». На відміну від США, у неї вища частка промисловості, особливо добувної, паливної та лісової.", "Сільське господарство високотоварне й механізоване, з провідною роллю тваринництва; угіддя займають лише близько 7 % території, але країна експортує значну частину продукції."], "ul": ["видобуток нафти, газу, вугілля, уранових, мідних, цинкових, нікелевих руд, золота, калійних солей", "трійка лідерів із заготівлі деревини, виробництва паперу, картону, пиломатеріалів", "Альберта — головне сховище паливних ресурсів", "Британська Колумбія — лісозаготівля та лісопереробка", "«житниця» — степові провінції Манітоба, Саскачеван, Альберта; провідна культура — пшениця"]}, {"h": "Обробна промисловість, енергетика та послуги", "p": ["Індустріальне ядро — провінції Онтаріо та Квебек. Власних автомобільних марок Канада не має, але на її території працюють великі заводи американських і японських концернів.", "Сфера послуг дає понад 70 % ВВП; найбільші складові — фінанси, страхування, нерухомість і торгівля. Транспортна система сучасна, з особливо розвиненим трубопровідним і водним транспортом."], "ul": ["понад 60 % електроенергії виробляють ГЕС (за даними підручника)", "розвиваються відновлювані джерела, зокрема вітроенергетика", "машинобудування: автомобільне, залізничне, суднобудування, електроніка; головний центр — Монреаль", "чорна металургія — Гамільтон, Сідні; потужна кольорова металургія (мідь, нікель, алюміній)", "фінансові центри — Торонто та Монреаль", "система Великих озер і річки Святого Лаврентія — найважливіший водний шлях"]}, {"h": "Зовнішні зв’язки. Канада та Україна", "p": ["В експорті Канади, на відміну від інших розвинених країн, велика частка сировини, напівфабрикатів і продовольства. Найбільший партнер — США, з якими склався тісний поділ праці; далі йдуть Китай, Мексика, Велика Британія, Японія.", "Канада — давній партнер України: підтримувала реформи після 1991 р. і після Революції Гідності, обстоює територіальну цілісність України. Після 24 лютого 2022 р. вона надає Україні військову, фінансову та гуманітарну допомогу."], "ul": ["експорт: сировина й продовольство, автомобілі, машини, промислові вироби", "імпорт: технології, обладнання, електроніка, товари легкої промисловості", "з Канади в Україну постачають машини, рибу, аерокосмічну та фармацевтичну продукцію", "Україна постачає до Канади локомотиви та комплектуючі, металеві вироби, машини", "діють програми обміну студентами, учнями та викладачами"]}], "terms": [["Переселенський капіталізм", "тип розвитку країн (Канада, Австралія), економіка яких сформувалася завдяки масовій імміграції та багатим природним ресурсам."], ["Імміграція", "в’їзд людей до країни на постійне проживання."], ["Сальдо міграції", "різниця між кількістю тих, хто прибув до країни, і тих, хто з неї вибув."], ["Первинний сектор економіки", "видобування природних ресурсів, сільське, лісове та рибне господарство."], ["Індустріальне ядро", "район, де зосереджена основна частина промислового виробництва країни (у Канаді — Онтаріо та Квебек)."]], "f": "У Торонто українську мову, за словами авторів підручника, можна почути чи не частіше, ніж у Києві, а в Університеті Торонто діє кафедра українознавства.", "pr": ["Порівняйте Канаду та США у вигляді таблиці: ЕГП, клімат, населення, частка первинного сектору, енергетика, експорт. Зробіть висновок, чи справедливий вислів «Канада — продовження США на північ».", "На контурній карті позначте провінції Онтаріо, Квебек, Альберта, Британська Колумбія та «житницю» країни, міста Торонто, Монреаль, Ванкувер, Вінніпег і систему Великих озер — річки Святого Лаврентія."], "qz": [{"q": "Яке місце у світі посідає Канада за площею?", "o": ["Перше", "Друге", "Третє", "Четверте"], "a": 1, "why": "Канада — друга за площею держава світу."}, {"q": "Що найбільше стримує господарське освоєння Канади?", "o": ["Відсутність виходу до моря", "Бідність на ресурси", "Суворий клімат більшої частини території", "Велика кількість сусідів"], "a": 2, "why": "Дві третини території — у субарктичному та арктичному поясах."}, {"q": "Яка головна особливість ЕГП Канади?", "o": ["Сусідство зі США", "Межа з Мексикою", "Вихід до Індійського океану", "Розташування в екваторіальному поясі"], "a": 0, "why": "Сусідство зі США визначає економічний розвиток Канади."}, {"q": "Де зосереджено понад 90 % населення Канади?", "o": ["На Арктичних островах", "На узбережжі Гудзонової затоки", "У провінції Юкон", "У південній смузі вздовж кордону зі США"], "a": 3, "why": "Саме тут найсприятливіші природні умови."}, {"q": "Яке місто стало центром української імміграції до Канади?", "o": ["Ванкувер", "Квебек", "Вінніпег", "Оттава"], "a": 2, "why": "Українці селилися в преріях, а центром став Вінніпег."}, {"q": "Які електростанції виробляють найбільше електроенергії в Канаді?", "o": ["ГЕС", "ТЕС", "АЕС", "СЕС"], "a": 0, "why": "На ГЕС припадає понад 60 % електроенергії."}, {"q": "Які провінції є «житницею» Канади?", "o": ["Онтаріо та Квебек", "Манітоба, Саскачеван, Альберта", "Британська Колумбія та Юкон", "Нова Шотландія та Ньюфаундленд"], "a": 1, "why": "Степові провінції — головний район вирощування пшениці."}, {"q": "Чим відрізняється експорт Канади від експорту інших розвинених країн?", "o": ["Переважають послуги", "Майже немає продовольства", "Висока частка сировини, напівфабрикатів і продовольства", "Переважає зброя"], "a": 2, "why": "Сировина, напівфабрикати й продовольство дають близько 30 % експорту."}, {"q": "Яка провінція — головне сховище паливно-енергетичних ресурсів Канади?", "o": ["Квебек", "Онтаріо", "Манітоба", "Альберта"], "a": 3, "why": "Південна степова провінція Альберта багата на нафту й газ."}, {"q": "Який вид транспорту особливо розвинений у Канаді завдяки видобутку нафти й газу?", "o": ["Трубопровідний", "Річковий у тропіках", "Канатний", "Морський пасажирський"], "a": 0, "why": "Трубопроводи Канади — одні з найдовших у світі."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 2. Країни Америки", "sregion": "america", "sk": "america", "cid": "124", "cn": "Канада"}, {"n": "37", "p": "37", "t": "Бразилія (Федеративна Республіка Бразилія)", "pages": "с. 198–202", "g": "З’ясувати особливості ЕГП, природних ресурсів, населення та господарства Бразилії як нової індустріальної країни і її зв’язки з Україною.", "nums": [{"v": "≈ ½", "l": "частка Південної Америки, яку займає Бразилія"}, {"v": "≈ 86 %", "l": "частка міського населення (за даними підручника)"}, {"v": "8-ме місце", "l": "Бразилія у світі за обсягом ВВП (за даними підручника)"}, {"v": "69 %", "l": "частка ГЕС у виробництві електроенергії (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення та природні ресурси", "p": ["Бразилія — одна з найбільших країн світу за площею й населенням; вона займає майже половину Південної Америки в басейнах Амазонки та Парани. Територія лежить в екваторіальному, субекваторіальному, тропічному та субтропічному поясах.", "Багато сусідів, вихід до Атлантичного океану та розташування в одному макрорегіоні зі США (головним інвестором) роблять ЕГП вигідним. Країна має потужний природно-ресурсний потенціал."], "ul": ["межує майже з усіма країнами Південної Америки, крім Чилі та Еквадору", "берегова лінія Атлантичного океану — 7,5 тис. км (за даними підручника)", "великі запаси залізних руд, бокситів, золота, графіту", "величезні лісові ресурси Амазонії (сельва) та водні ресурси", "родючі землі для тропічного землеробства"]}, {"h": "Населення", "p": ["Бразильці — єдиний народ із великою расовою строкатістю: нащадки європейців, представники мішаних рас (метиси, мулати, самбо), нащадки африканців та індіанці. Португальська мова й культура ввібрали африканські та індіанські елементи.", "Тривалий високий приріст зробив населення «молодим», хоча нині темпи природного приросту помітно знизилися. Розміщення населення — одне з найнерівномірніших у світі."], "ul": ["європейці — 48 %, мішані раси — 43 %, негроїдна раса — 7,6 %, індіанці — 0,4 % (за даними підручника)", "у Бразилії живе найбільша у світі японська громада", "середня густота — понад 24 особи/км², майже половина населення — на вузькій приатлантичній смузі", "рівень урбанізації близький до розвинених країн", "найбільші міста: Сан-Паулу, Ріо-де-Жанейро, Белу-Орізонті, Бразиліа, Сальвадор", "приплив сільських жителів до міст загострює безробіття"]}, {"h": "Промисловість — галузі спеціалізації", "p": ["Бразилія — індустріально-аграрна країна, яку ООН відносить до нових індустріальних країн. Економічному стрибку сприяли багата сировинна база, дешева й відносно кваліфікована робоча сила, політика «відкритих дверей» для іноземних компаній і пільги для підприємництва.", "Більшість підприємств обробної промисловості зосереджена в «трикутнику» Сан-Паулу — Ріо-де-Жанейро — Белу-Орізонті на південному сході."], "ul": ["машинобудування — найбільша частка промисловості: автомобілі, літаки, судна, трактори, комп’ютерна техніка", "значна частина акцій машинобудівних підприємств належить компаніям США, Японії, Франції, Німеччини", "чорна й кольорова металургія: спеціальні сталі, алюміній", "хімічна промисловість на основі нафтопереробки", "ГЕС «Ітайпу» на кордоні з Парагваєм — одна з найпотужніших у світі", "розвинена легка промисловість — текстильна, шкіряно-взуттєва"]}, {"h": "Сільське господарство, послуги та транспорт", "p": ["Бразилія повністю забезпечує себе продовольством і є великим експортером агропродукції. Інтенсифікація сільського господарства й промисловості вивільняє робочу силу, яка переходить у сферу послуг.", "У сфері послуг провідні торгівля, фінанси й туризм. Основу перевезень становить автотранспорт; залізниці потребують модернізації."], "ul": ["провідні позиції у світі з кави, цукрової тростини, тропічних фруктів, сої, кукурудзи", "2-ге місце у світі за поголів’ям великої рогатої худоби (після Індії), переважає м’ясне скотарство", "головна автомагістраль — Трансамазонське шосе", "понад 50 морських і річкових портів: Сантус, Ріо-де-Жанейро, Белен, Манаус та ін.", "Бразилія сама інвестує в країни Південної та Центральної Америки"]}, {"h": "Зовнішні зв’язки. Бразилія та Україна", "p": ["Бразилія експортує автомобілі, транспортне обладнання, залізну руду, сою, взуття, каву, фрукти, а імпортує електричне обладнання, електроніку, хімічну продукцію й нафту. Головні партнери — Китай, США, Аргентина, Німеччина, Нідерланди.", "Бразилія — найбільший торговельний партнер України в Латинській Америці. Співпраця охоплює торгівлю, медицину та технології."], "ul": ["Україна імпортує з Бразилії м’ясо, каву, тютюн, цукор", "у Бразилії випробовують українські медичні прилади та технології виробництва сплавів", "найбільший спільний проект — випуск інсуліну в Бразилії за технологіями київського підприємства «Індар»", "проблема: масштабне вирубування лісів Амазонії"]}], "terms": [["Нові індустріальні країни", "країни, що розвиваються, які за короткий час здійснили стрибок в індустріалізації та мають сучасну обробну промисловість."], ["Метиси", "нащадки шлюбів європейців та індіанців."], ["Мулати", "нащадки шлюбів європейців та африканців."], ["Самбо", "нащадки шлюбів індіанців та африканців."], ["Політика «відкритих дверей»", "державна політика, що заохочує іноземні інвестиції та діяльність іноземних компаній."], ["Сельва", "вологі екваторіальні ліси Амазонії."]], "f": "У Бразилії живе найбільша японська громада за межами Японії — понад 2 млн осіб.", "pr": ["Практична робота 6 з підручника: заповніть таблицю «Машинобудування США, Канади та Бразилії» (провідні виробництва, чинники розміщення, найбільші центри) і зробіть висновок про спільні та відмінні риси.", "Напишіть коротке есе (8–10 речень): які заходи могли б зупинити знеліснення Амазонії і чому це важливо для всього людства."], "qz": [{"q": "Яку частку Південної Америки займає Бразилія?", "o": ["Майже чверть", "Майже половину", "Майже дві третини", "Майже десяту частину"], "a": 1, "why": "Бразилія займає майже половину материка."}, {"q": "Басейни яких річок охоплює територія Бразилії?", "o": ["Амазонки та Парани", "Ориноко та Міссісіпі", "Конго та Нілу", "Маккензі та Юкону"], "a": 0, "why": "Країна лежить у басейнах Амазонки та Парани."}, {"q": "До якої групи країн ООН відносить Бразилію?", "o": ["Найменш розвинених", "Країн переселенського капіталізму", "Нових індустріальних країн", "Країн із перехідною економікою"], "a": 2, "why": "Бразилія — індустріально-аграрна нова індустріальна країна."}, {"q": "Де зосереджена більшість підприємств обробної промисловості Бразилії?", "o": ["У басейні Амазонки", "На кордоні з Болівією", "На північному сході біля Белена", "У трикутнику Сан-Паулу — Ріо-де-Жанейро — Белу-Орізонті"], "a": 3, "why": "Південний схід — головний промисловий район країни."}, {"q": "Яка галузь має найбільшу частку в промисловості Бразилії?", "o": ["Машинобудування", "Текстильна", "Харчова", "Нафтопереробна"], "a": 0, "why": "На машинобудування припадає 31 % промислового виробництва."}, {"q": "Яка ГЕС споруджена на кордоні Бразилії та Парагваю?", "o": ["Асуанська", "«Ітайпу»", "«Три ущелини»", "Інга"], "a": 1, "why": "«Ітайпу» — одна з найпотужніших ГЕС світу."}, {"q": "Де проживає майже половина населення Бразилії?", "o": ["У басейні Амазонки", "На Бразильському плоскогір’ї", "На вузькій приатлантичній смузі", "У прикордонні з Аргентиною"], "a": 2, "why": "Розміщення населення дуже нерівномірне, найгустіше — узбережжя."}, {"q": "Яке місце посідає Бразилія у світі за поголів’ям великої рогатої худоби?", "o": ["Перше", "Третє", "П’яте", "Друге"], "a": 3, "why": "Бразилія друга після Індії."}, {"q": "Яка культура НЕ належить до провідних у сільському господарстві Бразилії?", "o": ["Кава", "Цукрова тростина", "Чай", "Соя"], "a": 2, "why": "Бразилія лідирує з кави, цукрової тростини, сої, кукурудзи, тропічних фруктів."}, {"q": "Який україно-бразильський проект підручник називає найбільшим?", "o": ["Випуск інсуліну за технологіями підприємства «Індар»", "Будівництво ГЕС", "Виробництво автомобілів", "Видобуток залізної руди"], "a": 0, "why": "«Індар» і компанія «Фіокруз» налагоджували випуск інсуліну в Бразилії."}], "section": "Розділ IV. АМЕРИКА", "topic": "Тема 2. Країни Америки", "sregion": "america", "sk": "america", "cid": "076", "cn": "Бразилія"}, {"n": "38", "p": "38", "t": "Географічне положення та політична карта Африки", "pages": "с. 203–205", "g": "Схарактеризувати географічне положення та склад Африки, особливості її політичної карти, типи країн і причини збройних конфліктів.", "nums": [{"v": "> 60", "l": "держав і залежних країн в Африці (за даними підручника)"}, {"v": "14 км", "l": "найменша ширина Гібралтарської протоки"}, {"v": "4", "l": "півкулі, у яких розташована Африка"}, {"v": "5", "l": "субрегіонів Африки"}], "blocks": [{"h": "Географічне положення Африки", "p": ["Африка — єдиний регіон, що лежить в усіх чотирьох півкулях. Її омивають Атлантичний та Індійський океани, Середземне й Червоне моря.", "Берегова лінія порізана слабко, зручних заток і бухт мало. Від Європи материк відділяє Гібралтарська протока, з Азією його з’єднує Суецький перешийок, на якому в XIX ст. прокопано судноплавний канал."], "ul": ["на заході — Атлантичний океан, на сході — Індійський", "на півночі — Середземне море, на північному сході — Червоне море", "найбільша затока — Гвінейська, найбільший півострів — Сомалі", "біля східних берегів — Мадагаскар, четвертий за площею острів світу", "Суецький канал — важливий шлях між Європою та Азією"]}, {"h": "Склад регіону та політична карта", "p": ["Африку поділяють на п’ять субрегіонів: Північну, Західну, Центральну, Східну та Південну. У політичному плані це наймолодший регіон світу — більшість держав здобули незалежність у другій половині XX ст.", "Більшість країн мають вихід до моря, є острівні держави, а також внутрішньоконтинентальні, що не мають виходу до моря."], "ul": ["приморські країни: Алжир, Єгипет, Марокко, Лівія, Туніс, ПАР", "острівні: Мадагаскар, Сейшельські Острови", "внутрішньоконтинентальні: Замбія, Зімбабве та ін.", "залежні території: Реюньйон і Майотта (Франція), міста Сеута й Мелілья (Іспанія)", "наймолодша держава — Південний Судан, що відокремився від Судану"]}, {"h": "Форми правління та устрою", "p": ["Більшість африканських держав — унітарні республіки з президентською формою правління, що підкреслює роль одноосібної влади президента. Нерідко під такою назвою приховуються диктатури.", "Монархій в Африці небагато, а частина країн входить до Співдружності на чолі з Великою Британією."], "ul": ["федеративні республіки: Нігерія, Ефіопія, Сомалі", "конституційні монархії: Марокко, Лесото, Есватіні (до 2018 р. — Свазіленд)", "члени Співдружності: Гамбія, Гана, Замбія, Нігерія, ПАР", "поширені авторитарні режими"]}, {"h": "Типи країн за рівнем економічного розвитку", "p": ["Майже всі держави Африки належать до країн, що розвиваються. Порівняно зрілу структуру господарства мають Єгипет, Марокко, Туніс: там будують підприємства, розвивають шляхи сполучення, туризм, готують національні кадри.", "Більшість країн — найменш розвинені: до 80 % населення працює в сільському господарстві, промисловість обмежується видобутком сировини та її первинною переробкою."], "ul": ["відносно розвинені: Єгипет, Марокко, Туніс", "найбідніші: Сомалі, Ефіопія, Південний Судан, ДР Конго, Нігер, Руанда, Танзанія", "ПАР — переселенська країна, але з нижчими показниками, ніж Канада чи Австралія", "в економіці найменш розвинених країн переважають кустарні виробництва та експорт сировини"]}, {"h": "Райони конфліктів і тероризму", "p": ["Кордони африканських держав «успадковані» від колонізаторів: понад третина з них проведена по меридіанах і паралелях без урахування етнічних меж. Це породжує прикордонні суперечки, сепаратизм і тероризм.", "Боротьба за владу особливо загострюється через багаті родовища корисних копалин. Для врегулювання конфліктів світова спільнота залучає миротворчі сили ООН."], "ul": ["прикордонні суперечки: Сенегал — Мавританія, Лівія — Чад, Сомалі — Ефіопія", "відокремленню Південного Судану передувала тривала війна, загострена через нафту", "внутрішні конфлікти: Руанда (тутсі та хуту), Лівія, Ангола, Сомалі, Судан, ДР Конго, Сьєрра-Леоне", "у Сомалі збройний конфлікт триває понад два десятиліття, у 1991–1992 рр. там був масовий голод"]}], "terms": [["Субрегіон", "частина великого регіону, що виділяється за спільними природними, історичними та економічними рисами."], ["Внутрішньоконтинентальна країна", "держава, що не має виходу до моря чи океану."], ["Унітарна держава", "держава з єдиною системою органів влади, територія якої поділена на адміністративні одиниці без самоврядних прав суб’єктів федерації."], ["Президентська республіка", "форма правління, за якої президент очолює і державу, і уряд та має широкі повноваження."], ["Сепаратизм", "прагнення частини території чи народу відокремитися від держави."], ["Миротворчі сили ООН", "військові та цивільні контингенти країн — членів ООН, що допомагають припиняти збройні конфлікти й підтримувати мир."]], "f": "Африка — єдиний регіон світу, який перетинають і екватор, і нульовий меридіан, тож він лежить в усіх чотирьох півкулях.", "pr": ["Практичне завдання з підручника: позначте на контурній карті п’ять субрегіонів Африки й найбільші країни кожного з них.", "Складіть таблицю «Африка на політичній карті»: приморські, острівні та внутрішньоконтинентальні країни; монархії та федеративні республіки (по 2–3 приклади)."], "qz": [{"q": "Чим унікальне розташування Африки?", "o": ["Лежить лише в Північній півкулі", "Розташована в усіх чотирьох півкулях", "Повністю лежить у тропіках", "Не має виходу до океанів"], "a": 1, "why": "Африку перетинають екватор і нульовий меридіан."}, {"q": "Яка протока відділяє Африку від Європи?", "o": ["Баб-ель-Мандебська", "Мозамбіцька", "Гібралтарська", "Босфор"], "a": 2, "why": "Найменша ширина Гібралтарської протоки — 14 км."}, {"q": "Що з’єднує Африку з Азією?", "o": ["Суецький перешийок", "Панамський перешийок", "Острів Мадагаскар", "Півострів Сомалі"], "a": 0, "why": "На Суецькому перешийку прокладено Суецький канал."}, {"q": "Яка затока — найбільша біля берегів Африки?", "o": ["Аденська", "Перська", "Мексиканська", "Гвінейська"], "a": 3, "why": "Гвінейська затока лежить біля західних берегів материка."}, {"q": "Яка форма правління переважає в країнах Африки?", "o": ["Абсолютна монархія", "Президентська республіка", "Парламентська монархія", "Теократія"], "a": 1, "why": "Більшість держав — унітарні республіки з президентською формою правління."}, {"q": "Яка країна Африки є федерацією?", "o": ["Єгипет", "Марокко", "Нігерія", "Туніс"], "a": 2, "why": "Федеративні республіки — Нігерія, Ефіопія, Сомалі."}, {"q": "Яка з країн — конституційна монархія?", "o": ["Марокко", "Алжир", "Кенія", "Ангола"], "a": 0, "why": "Монархіями є Марокко, Лесото та Есватіні (Свазіленд)."}, {"q": "Яка група країн Африки має порівняно зрілу структуру господарства?", "o": ["Сомалі, Нігер, Руанда", "Чад, Малі, Ефіопія", "ДР Конго, Танзанія, Південний Судан", "Єгипет, Марокко, Туніс"], "a": 3, "why": "У них будують підприємства, розвивають транспорт і туризм."}, {"q": "Що є головною причиною прикордонних суперечок в Африці?", "o": ["Нестача прісної води", "Кордони, проведені колонізаторами без урахування етнічних меж", "Відсутність виходу до моря", "Висока густота населення"], "a": 1, "why": "Понад третина кордонів проходить по меридіанах і паралелях."}, {"q": "Яка територія в Африці належить Франції?", "o": ["Мадейра", "Сеута", "Реюньйон", "Занзібар"], "a": 2, "why": "Реюньйон і Майотта — французькі володіння; Сеута й Мелілья — іспанські."}], "section": "Розділ V. АФРИКА", "topic": "Тема 1. Загальна характеристика Африки", "sregion": "africa", "sk": "africa"}, {"n": "39", "p": "39", "t": "Африка: природні умови і ресурси. Населення", "pages": "с. 206–209", "g": "Оцінити природні умови й ресурси Африки та з’ясувати особливості відтворення, розміщення, етнічного й релігійного складу її населення.", "nums": [{"v": "> 1,2 млрд", "l": "жителів Африки (за даними підручника)"}, {"v": "40 осіб/км²", "l": "середня густота населення (за даними підручника)"}, {"v": "≈ 45 %", "l": "частка міського населення (за даними підручника)"}, {"v": "< 22 роки", "l": "середній вік населення більшості країн (за даними підручника)"}], "blocks": [{"h": "Природні умови", "p": ["Африка — один із найрівнинніших материків, тому її територія зручна для освоєння. Розрізняють Низьку Африку (північ і північний захід, висоти до 1000 м) та Високу Африку (південь і південний схід) з Ефіопським нагір’ям і Східноафриканським плоскогір’ям.", "Це найжаркіший материк: він лежить між субтропічними поясами обох півкуль. Головна перешкода для землеробства — нерівномірні та нерегулярні опади."], "ul": ["найвища вершина — згаслий вулкан Кіліманджаро", "на більшій частині території температура не опускається нижче 0 °C", "найнебезпечніші стихійні лиха — посухи", "у 1968–1973 рр. сильна посуха вразила Сахель — смугу саван на південь від Сахари", "поширені опустелювання, засолення ґрунтів та ерозія"]}, {"h": "Мінеральні ресурси", "p": ["Мінеральні ресурси Африки багаті, але ще недостатньо розвідані й освоєні. Нафту й газ відкрито в другій половині XX ст. переважно в Сахарському басейні та районі Гвінейської затоки.", "Африка вирізняється рудами чорних і кольорових металів, а також найбільшими у світі запасами бокситів, золота, фосфоритів та алмазів."], "ul": ["нафта: Лівія, Нігерія, Алжир, Ангола; газ: Нігерія, Алжир", "вугілля мало, понад 80 % запасів — у ПАР", "Коппербелт («мідний пояс») у Замбії та ДР Конго: мідь, кобальт, свинець, цинк, уран", "марганець — родовище Моанда в Габоні", "боксити — Західна Африка (передусім Гвінея); золото — Південна Африка", "фосфорити — Північна Африка (Марокко); алмази — ПАР, Ботсвана, Намібія, Ангола, ДР Конго"]}, {"h": "Земельні, лісові, водні та рекреаційні ресурси", "p": ["Земельні ресурси значні, але через зростання населення забезпеченість ними зменшується. Лісистість нижча за середньосвітову, ліси зосереджені в екваторіальних широтах і використовуються неефективно.", "Водні ресурси розподілені нерівномірно, тож багато країн відчуває нестачу прісної води. Рекреаційні ресурси великі, але мало освоєні."], "ul": ["загроза засолення ґрунтів у зрошуваних районах та ерозії", "ліси — переважно в басейні Конго та на узбережжі Гвінейської затоки", "нестача прісної води потребує співпраці країн у басейнах великих річок", "найбільше рекреаційні ресурси використовує Єгипет: історичні пам’ятки й пляжі Червоного моря"]}, {"h": "Відтворення населення", "p": ["Африка має найвищий у світі природний приріст: очікується, що до 2050 р. населення подвоїться. Населення дуже молоде.", "За тривалістю життя Африка посідає останнє місце у світі, але відмінності між субрегіонами значні. Міграції пов’язані зі збройними конфліктами та прагненням переїхати до Європи."], "ul": ["найвищі показники народжуваності у світі", "у Північній Африці тривалість життя близька до середньосвітової, у Тунісі та Лівії — найвища", "найнижча тривалість життя — у Східній і Центральній Африці", "молодий віковий склад створює великий трудовий потенціал і водночас проблеми зайнятості"]}, {"h": "Розміщення населення та міста", "p": ["Густота населення в різних районах відрізняється в десятки разів. Найвища — у пониззі й долині Нілу, де виникла цивілізація Стародавнього Єгипту; найнижча — у Сахарі та вологих екваторіальних лісах.", "За часткою міського населення Африка поступається іншим регіонам; найвищий рівень урбанізації — у Північній і Південній Африці."], "ul": ["густо заселені: долина Нілу, узбережжя Гвінейської затоки (Нігерія), Середземноморське узбережжя", "а також район Великих африканських озер (Вікторія, Танганьїка, Ньяса)", "найбільше місто — Лагос (колишня столиця Нігерії), друге — Каїр", "інші світові міста: Йоганнесбург, Кейптаун, Дакар, Найробі", "швидке зростання міст створює проблеми нетрів, безробіття, транспорту"]}, {"h": "Етнічний і релігійний склад", "p": ["В Африці понад 200 народів; найбільші — араби, банту, йоруба, хауса, фульбе, ібо, сомалі, нілоти. Однонаціональні країни переважають лише на півночі, у більшості інших — етнічна строкатість.", "У внутрішній політиці багатьох країн поширений трайбалізм. Релігійний склад також різноманітний, часто в межах однієї країни."], "ul": ["араби становлять переважну більшість населення Тунісу, Лівії, Єгипту", "іслам — в арабських країнах, Сомалі, Джібуті, частково в Центральній Африці", "у Центральній і Східній Африці поширені місцеві релігії", "у Південній Африці переважає християнство"]}], "terms": [["Низька Африка", "північна та північно-західна частина материка із середніми висотами до 1000 м."], ["Висока Африка", "південна та південно-східна частина материка з нагір’ями та плоскогір’ями."], ["Сахель", "вузька смуга саван на південь від Сахари, яку часто вражають посухи."], ["Коппербелт", "«мідний пояс» — смуга багатих родовищ мідних руд у Замбії та ДР Конго."], ["Опустелювання", "перетворення земель на пустелю внаслідок посух і нераціонального господарювання."], ["Трайбалізм", "опора в управлінні державою на представників свого етносу (племені)."], ["Природний приріст", "різниця між кількістю народжених і померлих за певний період."]], "f": "Найвища вершина Африки Кіліманджаро — це згаслий вулкан, на вершині якого лежить сніг, хоча гора розташована неподалік від екватора.", "pr": ["Практичне завдання з підручника: підпишіть на контурній карті найбільші міста Африки (Лагос, Каїр, Йоганнесбург, Кейптаун, Дакар, Найробі) та коротко поясніть, чому вони виникли саме там.", "Складіть таблицю «Мінеральні ресурси Африки»: корисна копалина — основні країни/родовища — значення для економіки. Позначте на контурній карті Коппербелт, Моанду та райони видобутку нафти."], "qz": [{"q": "Яка вершина є найвищою в Африці?", "o": ["Кенія", "Камерун", "Кіліманджаро", "Тубкаль"], "a": 2, "why": "Кіліманджаро — згаслий вулкан на Східноафриканському плоскогір’ї."}, {"q": "Що є головною перешкодою для землеробства в Африці?", "o": ["Нерівномірні та нерегулярні опади", "Низькі температури", "Гористий рельєф", "Багаторічна мерзлота"], "a": 0, "why": "Африка спекотна, а опади випадають нерівномірно."}, {"q": "Як називають смугу саван на південь від Сахари, яку часто вражають посухи?", "o": ["Магриб", "Калахарі", "Буш", "Сахель"], "a": 3, "why": "У 1968–1973 рр. найсильніша посуха вразила Сахель."}, {"q": "Де розташований Коппербелт?", "o": ["У Марокко та Алжирі", "У Замбії та ДР Конго", "У ПАР та Намібії", "У Гвінеї та Гані"], "a": 1, "why": "«Мідний пояс» проходить територією Замбії та ДР Конго."}, {"q": "На запаси яких корисних копалин Африка найбагатша у світі?", "o": ["Вугілля та калійних солей", "Нафти та сланцевого газу", "Фосфоритів та алмазів", "Олова та вольфраму"], "a": 2, "why": "Африка має найбільші у світі запаси фосфоритів, алмазів, бокситів і золота."}, {"q": "Яка країна має понад 80 % запасів вугілля Африки?", "o": ["ПАР", "Нігерія", "Єгипет", "Лівія"], "a": 0, "why": "Вугілля в Африці мало, і більшість запасів — у ПАР."}, {"q": "Де густота населення Африки найвища?", "o": ["У Сахарі", "У басейні Конго", "У пустелі Наміб", "У долині та пониззі Нілу"], "a": 3, "why": "Тут сформувалася одна з перших цивілізацій — Стародавній Єгипет."}, {"q": "Яке місто є найбільшим в Африці?", "o": ["Каїр", "Лагос", "Кіншаса", "Йоганнесбург"], "a": 1, "why": "Лагос — колишня столиця й головний промисловий центр Нігерії."}, {"q": "Що таке трайбалізм?", "o": ["Кочове скотарство", "Переселення в міста", "Опора в управлінні державою на представників свого етносу", "Вирощування однієї культури"], "a": 2, "why": "Трайбалізм поширений у країнах з етнічною строкатістю."}, {"q": "Яка релігія переважає в арабських країнах Північної Африки?", "o": ["Іслам", "Християнство", "Буддизм", "Місцеві культи"], "a": 0, "why": "Іслам переважає в Алжирі, Марокко, Єгипті, а також у Сомалі та Джібуті."}], "section": "Розділ V. АФРИКА", "topic": "Тема 1. Загальна характеристика Африки", "sregion": "africa", "sk": "africa"}, {"n": "40", "p": "40", "t": "Господарство країн Африки", "pages": "с. 210–215", "g": "Розкрити особливості первинного, вторинного й третинного секторів економіки Африки, нерівномірність розвитку субрегіонів та зв’язки України з країнами Африки.", "nums": [{"v": "58 %", "l": "частка сфери послуг у ВВП регіону (за даними підручника)"}, {"v": "> ⅓", "l": "частка Нігерії та ПАР у вартості мінеральної сировини регіону (за даними підручника)"}, {"v": "до 10 %", "l": "частка Гвінеї у світовому видобутку бокситів (за даними підручника)"}, {"v": "> 35 %", "l": "прибуттів туристів припадає на Південну та Східну Африку (за даними підручника)"}], "blocks": [{"h": "Сільське господарство", "p": ["У сільському господарстві Африки явно переважає рослинництво, яке для багатьох країн є чи не єдиною експортною галуззю. Культури поділяють на споживчі (для власних потреб) та експортні.", "Багатьом країнам притаманна монокультура — спеціалізація на експорті однієї-двох культур. Тваринництво переважно екстенсивне, малопродуктивне й залежить від природних пасовищ."], "ul": ["споживчі культури: просо, сорго, ямс, маніок, таро, батат, кукурудза, рис", "експортні культури: какао, кава, чай, бавовник, цитрусові, цукрова тростина", "арахіс — Нігерія та Сенегал; цитрусові — Північна Африка та ПАР", "єгипетський бавовник — один із найякісніших у світі", "утримують кіз, велику рогату худобу (зокрема зебу), овець, верблюдів", "неврожаї спричиняють посухи, опустелювання, війни та низька агротехніка"]}, {"h": "Лісова та гірничодобувна промисловість", "p": ["Африка — значний постачальник деревини на світовий ринок, заготівлею здебільшого займаються іноземні або мішані компанії. Провідне місце в господарстві належить гірничодобувній промисловості.", "Видобуток розподілений вкрай нерівномірно. Африканські родовища кольорових металів цінні високим вмістом металу та поєднанням кількох металів в одному родовищі."], "ul": ["деревина: Кот-д’Івуар, Камерун, Габон, ДР Конго", "нафта: Нігерія, Алжир, Єгипет, Лівія, Екваторіальна Гвінея; газ: Алжир, Нігерія, Єгипет", "Алжир експортує природний газ до Європи", "уран — ПАР і Намібія; залізні руди — ПАР, Ліберія, Мавританія, Зімбабве; марганець — ПАР", "мідь — «мідний пояс» Замбії та ДР Конго; боксити — Гвінея, Гана, Сьєрра-Леоне", "фосфорити — Марокко, Туніс, Сенегал; для окремих країн дуже важливі алмази й золото"]}, {"h": "Вторинний сектор", "p": ["Більшість обробних виробництв орієнтована на внутрішній ринок, понад третина зайнятих працює в текстильній, швейній і харчовій промисловості. Металургія представлена переважно передільними підприємствами, а кольорова базується на найбагатших ресурсах.", "Машинобудування по-справжньому розвинене лише в ПАР; нескладну техніку випускають у Північній Африці та Нігерії."], "ul": ["харчова промисловість: рослинні олії, цукор (Маврикій, Єгипет), переробка какао (Гана, Кот-д’Івуар)", "електроенергію виробляють ГЕС і ТЕС; великі ГЕС — на Замбезі, Конго, Вольті", "єдина АЕС Африки — у ПАР", "заводи повного циклу чорної металургії — ПАР, Нігерія, Єгипет, Алжир, Зімбабве", "мідь виплавляють Замбія, ДР Конго, ПАР", "нафтопереробка та хімія — ПАР, Нігерія, Єгипет, Марокко"]}, {"h": "Третинний сектор і транспорт", "p": ["Ринок послуг в Африці почав формуватися в останні десятиліття XX ст., проте його розвиток гальмують нерозвинена інфраструктура, політична нестабільність і корупція. Найвища частка послуг — у Південній і Північній Африці, лідер — ПАР з розвиненим банківським і страховим обслуговуванням.", "Транспортна система відстала: залізниці колоніальної доби вели від родовищ до портів і часто не сполучені між собою."], "ul": ["туризм: Єгипет, Марокко, Туніс, ПАР, Кенія, Танзанія, острівні держави (Сейшели, Маврикій)", "трансконтинентальна залізниця Дар-ес-Салам — Лобіту (Танзанія — Ангола)", "більшість автошляхів не має твердого покриття", "підводний газопровід сполучає Північну Африку з Південною Європою", "найбільші порти: Касабланка, Дакар, Кейптаун, Дурбан, Порт-Саїд, Александрія", "більшість вантажів перевозять іноземні судна"]}, {"h": "Нерівномірність розвитку субрегіонів. Зв’язки з Україною", "p": ["Найкраще розвинені Північна та Південна Африка, а єдина країна з високим рівнем розвитку господарства — ПАР. Обробні виробництва зосереджені в приморських районах і столицях; найменш розвинені країни здебільшого не мають виходу до моря й лежать у Центральній та Східній Африці.", "Для України Африка — перспективний партнер: звідти можна імпортувати нафту, газ, тропічну продукцію, а країни Африки купують українське продовольство, передусім пшеницю. Після 2022 р. російська блокада українських чорноморських портів ускладнила постачання зерна до Африки."], "ul": ["плантаційний експорт: Кот-д’Івуар і Гана (какао), Кенія (чай, кава), Ефіопія (кава)", "постачальники мінеральної сировини — країни Північної, Західної та Південної Африки", "Україна імпортує банани, каву, какао-боби, арахіс", "Україна експортує пшеницю та інші продукти харчування"]}], "terms": [["Монокультура", "вузька спеціалізація сільського господарства країни на вирощуванні й експорті однієї-двох культур."], ["Споживчі культури", "культури, які вирощують для власного харчування населення."], ["Екстенсивне тваринництво", "тваринництво на природних пасовищах з низькою продуктивністю та без значних вкладень."], ["Плантація", "велике спеціалізоване господарство з вирощування експортних тропічних культур."], ["Передільне підприємство", "металургійне підприємство, що виготовляє сталь і прокат з привізного чавуну чи металобрухту, без повного циклу."], ["Первинний сектор економіки", "видобування природних ресурсів, сільське, лісове та рибне господарство."]], "f": "Залізниці Африки досі зберігають колоніальну «спадщину»: вони були збудовані, щоб вивозити сировину з глибини материка до портів, тому багато ліній не сполучені між собою.", "pr": ["Практична робота 7 з підручника: позначте на контурній карті Африки основні райони видобутку нафти, залізних, мідних і алюмінієвих руд, центри їх переробки, основні транспортні магістралі та порти експорту.", "Набуваємо практичних навичок: компанія хоче відкрити велосипедний завод у Єгипті, Сьєрра-Леоне або Ботсвані. Порівняйте ці країни (ЕГП, населення, транспорт, рівень розвитку) у таблиці та обґрунтуйте свій вибір."], "qz": [{"q": "Яка галузь переважає в сільському господарстві Африки?", "o": ["Тваринництво", "Рослинництво", "Рибальство", "Птахівництво"], "a": 1, "why": "Рослинництво є провідним і часто єдиним експортним напрямом."}, {"q": "Що таке монокультура?", "o": ["Вирощування культур лише для себе", "Кочове скотарство", "Спеціалізація на експорті однієї-двох культур", "Поєднання землеробства і тваринництва"], "a": 2, "why": "Багато африканських країн залежить від експорту однієї-двох культур."}, {"q": "Яка культура належить до споживчих?", "o": ["Маніок", "Какао", "Кава", "Чай"], "a": 0, "why": "Маніок, ямс, просо, сорго вирощують для власного харчування."}, {"q": "Яка галузь займає провідне місце в господарстві Африки?", "o": ["Машинобудування", "Хімічна промисловість", "Електроенергетика", "Гірничодобувна промисловість"], "a": 3, "why": "Африка — великий постачальник мінеральної сировини."}, {"q": "Яка країна дає до 10 % світового видобутку бокситів?", "o": ["Нігерія", "Єгипет", "Гвінея", "Замбія"], "a": 2, "why": "У Гвінеї розробляють великі родовища бокситів."}, {"q": "Які галузі переважають в обробній промисловості Африки?", "o": ["Текстильна, швейна, харчова", "Авіабудування та електроніка", "Суднобудування", "Фармацевтика"], "a": 0, "why": "Понад третина зайнятих у обробній промисловості працює в цих галузях."}, {"q": "У якій країні Африки працює АЕС?", "o": ["Єгипет", "Нігерія", "Кенія", "ПАР"], "a": 3, "why": "У ПАР діє АЕС потужністю 1880 МВт."}, {"q": "Яка залізниця має трансконтинентальне значення?", "o": ["Каїр — Александрія", "Дар-ес-Салам — Лобіту", "Дакар — Бамако", "Лагос — Кано"], "a": 1, "why": "Вона з’єднує Танзанію (Індійський океан) з Анголою (Атлантика)."}, {"q": "Які субрегіони Африки розвинені найкраще?", "o": ["Центральна та Східна", "Західна та Центральна", "Північна та Південна", "Східна та Західна"], "a": 2, "why": "Тут вища частка послуг, промисловості та туризму."}, {"q": "Яку продукцію країни Африки найчастіше купують в України?", "o": ["Пшеницю та інші продукти харчування", "Нафту", "Какао-боби", "Алмази"], "a": 0, "why": "Африка — важливий покупець українського зерна."}], "section": "Розділ V. АФРИКА", "topic": "Тема 1. Загальна характеристика Африки", "sregion": "africa", "sk": "africa"}, {"n": "41", "p": "41", "t": "Єгипет (Арабська Республіка Єгипет)", "pages": "с. 216–219", "g": "Схарактеризувати ЕГП, населення та господарство Єгипту, роль Нілу й Суецького каналу та зв’язки країни з Україною.", "nums": [{"v": "96 млн", "l": "населення — 2-ге місце в Африці та 1-ше серед арабських країн (за даними підручника)"}, {"v": "> 90 % на 5 %", "l": "частка населення, що живе на 5 % території — у долині й дельті Нілу (за даними підручника)"}, {"v": "95 %", "l": "сільськогосподарських угідь — у долині й дельті Нілу (за даними підручника)"}, {"v": "11 %", "l": "внесок туризму у ВВП (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення та природні умови", "p": ["Єгипет розташований у двох частинах світу — Африці та Азії (Синайський півострів), тож контролює сухопутні шляхи між ними. Країну омивають Середземне й Червоне моря, які з’єднує Суецький канал на її території.", "Більша частина території — пустеля, несприятлива для життя й господарства; життя зосереджене вздовж Нілу. Країна має значні паливні та рекреаційні ресурси."], "ul": ["межує з Лівією, Суданом та Ізраїлем", "вихід до Середземного моря — близькість до Європи", "Суецький канал має величезне економічне та військово-стратегічне значення", "Ніл — головне джерело води для зрошення", "ресурси: нафта, газ, залізні руди, фосфорити", "рекреаційні ресурси: давні пам’ятки та пляжі Червоного моря"]}, {"h": "Населення та розселення", "p": ["Єгипет має високий природний приріст і молоде населення: третина жителів — діти й підлітки. Майже все населення становлять араби-єгиптяни, більшість сповідує іслам сунітського напрямку, близько 10 % — християни, зокрема копти.", "Країна має від’ємне сальдо міграції: єгиптяни виїжджають на заробітки до багатих нафтових країн Аравії. Розміщення населення вкрай нерівномірне."], "ul": ["араби-єгиптяни — 98 %, також бедуїни, бербери, нубійці (за даними підручника)", "у долині й дельті Нілу густота понад 1500 осіб/км², у пустелях — менше 1 особи/км²", "у містах живе трохи менше половини населення", "міста-мільйонери: Каїр, Александрія, Ель-Гіза, Шубра-ель-Хейма", "трудові мігранти їдуть до Саудівської Аравії, ОАЕ, Кувейту"]}, {"h": "Сільське господарство", "p": ["Сільське господарство тисячоліттями було основою економіки Єгипту; нині в ньому зайнято майже 30 % працюючих, але воно дає лише близько 12 % ВВП. Переважає зрошуване рослинництво в долині й дельті Нілу.", "Хоча збирають два-три врожаї на рік, продовольства не вистачає. Для освоєння нових земель з 1997 р. реалізують проект Нової долини в пустелі з каналом від озера Насера."], "ul": ["зернові: пшениця, кукурудза, рис", "овочі: томати, цибуля, картопля", "технічні культури: бавовник, цукровий буряк, цукрова тростина", "Єгипет — великий виробник та експортер цитрусових", "вирощують фініки та кормову конюшину", "буйволи — тяглова сила, розвивається птахівництво"]}, {"h": "Промисловість і туризм", "p": ["Важливе місце займає добувна промисловість, передусім нафтова; нафтопереробка Єгипту — найпотужніша в Африці. Розвинені також металургія, машинобудування та текстильна промисловість повного циклу — від бавовни до одягу.", "Туризм — один із «трьох китів» економіки разом із нафтою та Суецьким каналом: він дає значну частку валютних надходжень."], "ul": ["фосфорити видобувають біля Луксора та портів Червоного моря", "чорна металургія: комбінат повного циклу в Хелуані на рудах Асуана та оазису Бахарія", "алюмінієвий завод у Наг-Хамаді працює на енергії Асуанської ГЕС та імпортній сировині", "машинобудування (вагони, автомобілі, трактори) — у Каїрі, Александрії, зоні Суецького каналу", "електроенергію виробляють переважно ТЕС на газі та мазуті", "великий потенціал сонячної та вітрової енергетики"]}, {"h": "Транспорт, територіальна організація та зовнішні зв’язки", "p": ["Єгипет — важливий транспортний вузол на перехресті шляхів між Африкою, Азією та Європою. Основні внутрішні перевезення здійснює автотранспорт, для міждержавних зв’язків важлива авіація, традиційно розвинене судноплавство Нілом.", "Господарство, як і населення, зосереджене в долині й дельті Нілу, а туристичні центри — на узбережжі Червоного моря. Єгипет — важливий торговельний партнер України."], "ul": ["експорт: коштовне каміння та метали (золото), нафта й нафтопродукти, мінеральні добрива, цитрусові", "імпорт: природний газ, автомобілі, пшениця, ліки, м’ясо та молочна продукція", "основні партнери: країни ЄС, арабські та азіатські країни", "у торгівлі послугами провідні транзит Суецьким каналом і туризм", "Україна постачає чорні метали, пшеницю, рослинну олію, а імпортує переважно цитрусові"]}], "terms": [["Суецький канал", "судноплавний канал через Суецький перешийок, що з’єднує Середземне та Червоне моря."], ["Від’ємне сальдо міграції", "перевищення кількості емігрантів над кількістю іммігрантів."], ["Копти", "єгиптяни-християни, нащадки давнього населення країни."], ["Зрошувальне землеробство", "землеробство зі штучним поливом полів, у Єгипті — водами Нілу."], ["Асуанська ГЕС", "гідроелектростанція на Нілі, гребля якої утворила водосховище — озеро Насера."], ["Трудова міграція", "тимчасовий виїзд людей за кордон на заробітки."]], "f": "Понад 90 % жителів Єгипту живуть лише на 5 % території країни — вузькій зеленій смузі долини й дельти Нілу посеред пустелі.", "pr": ["Зберіть дані про значення річки Ніл для економіки Єгипту (зрошення, енергетика, транспорт, розселення, туризм) і оформіть їх у вигляді схеми.", "Підготуйте коротке повідомлення-есе на тему «“Три кити” економіки Єгипту: Суецький канал, нафта, туризм». Позначте на контурній карті канал, Каїр, Александрію, Асуан і туристичні центри Червоного моря."], "qz": [{"q": "У яких частинах світу розташований Єгипет?", "o": ["Лише в Африці", "В Африці та Азії", "В Африці та Європі", "В Азії та Європі"], "a": 1, "why": "Синайський півострів належить до Азії."}, {"q": "Які моря з’єднує Суецький канал?", "o": ["Середземне та Червоне", "Червоне та Аравійське", "Середземне та Чорне", "Середземне та Егейське"], "a": 0, "why": "Канал прокладено через Суецький перешийок між Середземним і Червоним морями."}, {"q": "Де зосереджено понад 90 % населення Єгипту?", "o": ["На Синайському півострові", "На узбережжі Червоного моря", "В оазисах Лівійської пустелі", "У долині й дельті Нілу"], "a": 3, "why": "Решта території — пустеля."}, {"q": "Яка релігія переважає в Єгипті?", "o": ["Християнство", "Юдаїзм", "Іслам сунітського напрямку", "Іслам шиїтського напрямку"], "a": 2, "why": "Більшість єгиптян — мусульмани-суніти, близько 10 % — християни."}, {"q": "Куди переважно виїжджають трудові мігранти з Єгипту?", "o": ["До нафтодобувних арабських країн", "До Південної Африки", "До Китаю", "До Південної Америки"], "a": 0, "why": "Єгиптяни їдуть до Саудівської Аравії, ОАЕ, Кувейту."}, {"q": "Яка технічна культура має велике значення для Єгипту?", "o": ["Какао", "Бавовник", "Кава", "Чай"], "a": 1, "why": "Бавовник — основа текстильної промисловості повного циклу."}, {"q": "Де розташований металургійний комбінат повного циклу Єгипту?", "o": ["В Александрії", "У Луксорі", "У Хелуані", "У Порт-Саїді"], "a": 2, "why": "Комбінат у Хелуані використовує руди Асуана та Бахарії."}, {"q": "На якій енергії працює алюмінієвий завод у Наг-Хамаді?", "o": ["Енергії АЕС", "Сонячній енергії", "Енергії ТЕС на вугіллі", "Енергії Асуанської ГЕС"], "a": 3, "why": "Алюміній виплавляють з імпортної сировини завдяки дешевій гідроенергії."}, {"q": "Які електростанції переважають в енергетиці Єгипту?", "o": ["ТЕС", "ГЕС", "АЕС", "ВЕС"], "a": 0, "why": "ТЕС на газі та мазуті становлять 94 % потужностей."}, {"q": "Що Україна найбільше імпортує з Єгипту?", "o": ["Нафту", "Цитрусові", "Автомобілі", "Бавовну"], "a": 1, "why": "Імпорт з Єгипту на третину складається з цитрусових."}], "section": "Розділ V. АФРИКА", "topic": "Тема 2. Країни Африки", "sregion": "africa", "sk": "africa", "cid": "818", "cn": "Єгипет"}, {"n": "42", "p": "42", "t": "Південно-Африканська Республіка (ПАР)", "pages": "с. 220–225", "g": "З’ясувати, чому ПАР — найрозвиненіша країна Африки: її положення, ресурси, населення, галузі спеціалізації та зовнішні зв’язки.", "nums": [{"v": "56,1 млн", "l": "населення (за даними підручника)"}, {"v": "> 65 %", "l": "частка міського населення (за даними підручника)"}, {"v": "68 %", "l": "частка сфери послуг у ВВП (за даними підручника)"}, {"v": "≈ 24 тис. км", "l": "довжина залізниць (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення та ресурси", "p": ["ПАР — найрозвиненіша країна Африки; вона лежить на півдні материка в тропічних і субтропічних широтах Південної півкулі та має вихід до Атлантичного й Індійського океанів.", "Надра країни надзвичайно багаті: алмази, платина, золото, кам’яне вугілля, уран, залізні, марганцеві та хромові руди, руди кольорових металів."], "ul": ["сусіди: Намібія, Ботсвана, Зімбабве, Мозамбік, Есватіні (до 2018 р. — Свазіленд)", "Королівство Лесото повністю оточене територією ПАР", "Намібія була окупована ПАР і здобула незалежність лише 1990 р.", "вугілля залягає неглибоко, тому його видобуток один із найдешевших у світі", "алмази — у кімберлітових трубках (Кімберлі, Постмасбург, район Преторії)"]}, {"h": "Населення та розселення", "p": ["Природний приріст поступово знижується. Скасування апартеїду в 1994 р. спричинило виїзд частини білого населення та приплив африканців з інших країн.", "Етнічний склад складний: більшість — африканці різних етносів, також мулати, метиси та нащадки вихідців із Нідерландів і Великої Британії. Найгустіше заселені внутрішні райони північного сходу та південне й південно-східне узбережжя."], "ul": ["африканці — понад 80 %, мулати й метиси — 9 % (за даними підручника)", "частка європейців зменшилася з 15 до 8,5 % (за даними підручника)", "понад третина віруючих — протестанти", "Йоганнесбург — найбільший економічний центр", "Преторія — столиця, Кейптаун — місце парламенту, Дурбан — найбільший порт", "західна частина країни заселена слабко"]}, {"h": "Добувна промисловість і сільське господарство", "p": ["ПАР посідає провідні позиції у видобутку вугілля, залізних, хромових і марганцевих руд, урану, золота, титану та платини; вона багато років — світовий лідер з металів платинової групи. Уран часто отримують разом із золотом або з відвалів золотих шахт.", "У сільському господарстві провідне тваринництво, передусім вівчарство на низькоякісних пасовищах. Рослинництво спеціалізується на кукурудзі та пшениці."], "ul": ["вугілля — основне паливо для електростанцій і сировина для синтетичного пального", "ПАР — один із найбільших виробників ювелірних алмазів", "1-ше місце в Африці за поголів’ям овець; експорт вовни та мохеру ангорських кіз", "на північному сході — м’ясо-молочне тваринництво, розводять страусів", "кукурудза та сорго — основна їжа африканського населення", "овочівництво, садівництво й виноградарство біля Кейптауна та в Квазулу-Наталі"]}, {"h": "Обробна промисловість", "p": ["Одна з провідних галузей — машинобудування: гірничне, сільськогосподарське, транспортне обладнання, локомотиви й вагони, автомобілі. Металургія виробляє чорні та кольорові метали, світове значення мають феросплави.", "Унікальна риса хімічної промисловості — переробка вугілля: через брак нафти ПАР виробляє з вугілля синтетичне рідке паливо."], "ul": ["металургійні комбінати: Фандербейлпарк, Преторія, Ньюкасл", "світове значення мають ферохром, феромарганець і силікомарганець", "алюміній виплавляють з імпортної сировини", "Сасолбург — центр синтетичного палива та нафтохімії (смоли, пластмаси, каучук)", "нафтопереробні заводи — у Кейптауні та Дурбані", "консервування фруктів і овочів — Західний Кейп, Квазулу-Наталь, Вітватерсранд"]}, {"h": "Сфера послуг, транспорт і зовнішні зв’язки", "p": ["Сфера послуг — найбільший сектор економіки; ПАР є фінансовим центром Африки, тут розвинений туризм. Це єдина країна Африки з розгалуженою транспортною мережею.", "На світовому ринку ПАР постачає мінеральну сировину, агропродукцію й продовольство. Зв’язки з Україною обмежені великою відстанню та схожістю товарів, але політичні відносини дружні."], "ul": ["найважливіші порти — Дурбан і Кейптаун; спеціалізовані: Річардс-Бей (вугілля), Салданья (залізна руда)", "найбільший аеропорт Африки — імені О. Р. Тамбо біля Йоганнесбурга", "експорт: золото, вугілля, платина, руди та напівфабрикати", "імпорт: нафта, устаткування, транспортні засоби, електроніка", "партнери: Китай, США, Німеччина, Велика Британія, Японія, Індія", "економічні центри — північний схід і південне та південно-східне узбережжя"]}], "terms": [["Апартеїд", "політика расової сегрегації в ПАР, що обмежувала права чорношкірого населення та вихідців з Азії; скасована 1994 р."], ["Кімберлітова трубка", "вертикальне геологічне тіло вулканічного походження, у якому трапляються алмази."], ["Метали платинової групи", "платина та споріднені з нею дорогоцінні метали (паладій, родій та ін.)."], ["Феросплави", "сплави заліза з іншими металами (хромом, марганцем, кремнієм), що використовуються у виробництві сталі."], ["Синтетичне паливо", "рідке паливо, отримане не з нафти, а з іншої сировини, у ПАР — з вугілля."], ["Анклав", "держава або її частина, з усіх боків оточена територією іншої держави (як Лесото в ПАР)."]], "f": "У місті Кімберлі залишився кар’єр «Велика діра», де колись відкрито видобували алмази: його діаметр близько 1,5 км, а глибина майже 200 м.", "pr": ["Практичне завдання з підручника: складіть порівняльну комплексну економіко-географічну характеристику Єгипту та ПАР у вигляді таблиці (ЕГП, ресурси, населення, галузі спеціалізації, транспорт, експорт).", "Дослідіть тему «ПАР: одна держава — три столиці»: з’ясуйте, які функції виконують Преторія, Кейптаун і Блумфонтейн, і позначте їх на контурній карті разом із портами Дурбан, Річардс-Бей та Салданья."], "qz": [{"q": "Яка країна повністю оточена територією ПАР?", "o": ["Ботсвана", "Лесото", "Намібія", "Есватіні"], "a": 1, "why": "Королівство Лесото — анклав усередині ПАР."}, {"q": "До яких океанів має вихід ПАР?", "o": ["Атлантичного та Індійського", "Лише Індійського", "Тихого та Індійського", "Лише Атлантичного"], "a": 0, "why": "Береги ПАР омивають два океани."}, {"q": "Що таке апартеїд?", "o": ["Видобуток алмазів", "Система виборів", "Політика расової сегрегації", "Різновид вівчарства"], "a": 2, "why": "Апартеїд обмежував права чорношкірого населення; його скасовано 1994 р."}, {"q": "Яке місто є найбільшим економічним центром ПАР?", "o": ["Кейптаун", "Дурбан", "Преторія", "Йоганнесбург"], "a": 3, "why": "Йоганнесбург разом із містами-супутниками має майже 8 млн жителів."}, {"q": "Видобутком яких металів ПАР багато років очолює світ?", "o": ["Міді", "Алюмінію", "Металів платинової групи", "Олова"], "a": 2, "why": "ПАР — світовий лідер з видобутку металів платинової групи."}, {"q": "Що унікального в хімічній промисловості ПАР?", "o": ["Виробництво синтетичного палива з вугілля", "Видобуток солі", "Виробництво ліків з рослин", "Переробка бокситів"], "a": 0, "why": "Через брак нафти ПАР виробляє рідке пальне з вугілля."}, {"q": "Яка галузь сільського господарства ПАР провідна?", "o": ["Рисівництво", "Вирощування какао", "Плантації кави", "Тваринництво, передусім вівчарство"], "a": 3, "why": "ПАР — перша в Африці за поголів’ям овець."}, {"q": "Де видобувають алмази в ПАР?", "o": ["У солоних озерах", "У кімберлітових трубках", "На морському дні", "У піщаних дюнах Наміб"], "a": 1, "why": "Алмази трапляються в кімберлітових трубках Кімберлі, Постмасбурга та біля Преторії."}, {"q": "Який порт ПАР спеціалізується на експорті вугілля?", "o": ["Річардс-Бей", "Салданья", "Кейптаун", "Порт-Елізабет"], "a": 0, "why": "Річардс-Бей вивозить вугілля, Салданья — залізну руду."}, {"q": "Який сектор дає найбільший внесок у ВВП ПАР?", "o": ["Добувна промисловість", "Сільське господарство", "Сфера послуг", "Обробна промисловість"], "a": 2, "why": "Сфера послуг забезпечує 68 % ВВП."}], "section": "Розділ V. АФРИКА", "topic": "Тема 2. Країни Африки", "sregion": "africa", "sk": "africa", "cid": "710", "cn": "ПАР"}, {"n": "43", "p": "43", "t": "Геополітична структура сучасного світу", "pages": "с. 226–228", "g": "З’ясувати, як змінилася геополітична структура світу, яке місце в ній посідає Україна та які основні напрями її зовнішньої політики.", "nums": [], "blocks": [{"h": "Геополітика та центри сили", "p": ["Геополітика — наука про вплив географічного простору держав на їхні політичні цілі та інтереси. Одним із її засновників був німецький географ Фрідріх Ратцель.", "Лідерами світового геополітичного простору є центри сили — найпотужніші за економічним, військовим, науково-технічним, фінансовим і людським потенціалом країни та їхні об’єднання. У різні епохи центри сили змінювалися, а боротьба за лідерство нерідко призводила до війн."], "ul": ["економічна потужність", "військова потужність", "географічне положення", "політичний вплив", "ресурсний потенціал (природний, людський, науково-технічний)", "внутрішньополітична стабільність"]}, {"h": "Від двополюсного до багатополюсного світу", "p": ["У другій половині XX ст. світ був двополюсним: домінували США та СРСР на чолі блоків НАТО та Організації Варшавського договору. Цю епоху протистояння назвали «холодною війною».", "Після розпаду СРСР і світової соціалістичної системи формується багатополюсний світ, а боротьба блоків і союзів за сфери впливу триває."], "ul": ["основні центри сили XXI ст.: США, Європейський Союз, Китай, Японія, Індія", "регіональні лідери: Німеччина, Бразилія, ПАР, Туреччина, Саудівська Аравія", "2020 р. Велика Британія вийшла з ЄС (Brexit)", "НАТО розширилося: 2023 р. до альянсу вступила Фінляндія, 2024 р. — Швеція"]}, {"h": "Місце України на геополітичній карті", "p": ["Після здобуття незалежності Україна мала визначити свою геополітичну ідентичність і національні інтереси. Вона налагодила відносини з ЄС, НАТО, США, сусідніми державами та стала учасницею важливих міжнародних договорів.", "Водночас було змарновано багато часу на пошук компромісів у зовнішній політиці, недостатньо уваги приділяли обороноздатності, а корупція набула великих масштабів."], "ul": ["вступ до ОБСЄ та приєднання до Договору про нерозповсюдження ядерної зброї як без’ядерна держава", "особливе, а згодом інтенсивне партнерство з НАТО", "курс на європейську інтеграцію", "2005 р. ЄС визнав Україну країною з ринковою економікою", "з 2008 р. Україна — член Світової організації торгівлі (СОТ)"]}, {"h": "Революція Гідності та російська агресія", "p": ["Відмова тодішньої влади від євроінтеграції у 2013 р. викликала масові протести; після Революції Гідності в березні 2014 р. Україна підписала Угоду про асоціацію з ЄС. Того ж року Росія тимчасово окупувала Крим і розв’язала війну на Донбасі.", "24 лютого 2022 р. Росія почала повномасштабне вторгнення в Україну; Білорусь надала свою територію для нападу. У червні 2022 р. Україна отримала статус кандидата в члени ЄС."], "ul": ["Революція Гідності забрала життя сотні громадян — Небесної сотні", "2014 р. — тимчасова окупація Криму та частини Луганської й Донецької областей", "головна загроза суверенітету України — агресія Російської Федерації", "Україна має потужну підтримку світової спільноти"]}, {"h": "Основні напрями зовнішньої політики України", "p": ["Пріоритетами залишаються партнерство з ЄС (законодавчо закріплений курс на євроінтеграцію) та США (зміцнення обороноздатності, мобілізація світової підтримки). Важливим для національної безпеки є партнерство з НАТО.", "Для вступу до ЄС зовнішня політика має спиратися на внутрішні реформи та відповідність критеріям членства."], "ul": ["стратегічні партнери: ЄС, США, Канада, Китай, Індія, Японія, країни Близького Сходу", "регіональні партнери: Польща, Литва, Латвія, Естонія, Грузія, Туреччина", "підручник 2018 р. називав серед регіональних партнерів і Білорусь, але після 2022 р. відносини з нею фактично розірвано через участь у агресії", "напрями співпраці: торгівля, спільні технологічні та інфраструктурні проекти, захист культурного та екологічного середовища"]}], "terms": [["Геополітика", "наука про вплив географічного простору держав на їхні політичні цілі та інтереси."], ["Центр сили", "держава або об’єднання держав із найбільшим економічним, військовим, науково-технічним і людським потенціалом, що впливає на світові процеси."], ["Двополюсний світ", "устрій міжнародних відносин, за якого домінують дві наддержави та їхні блоки (США і СРСР у другій половині XX ст.)."], ["Багатополюсний світ", "устрій міжнародних відносин із кількома центрами сили."], ["«Холодна війна»", "глобальне політичне, економічне й військове протистояння США і СРСР та їхніх союзників без прямої війни між ними."], ["Угода про асоціацію", "договір між Україною та ЄС про політичну асоціацію та економічну інтеграцію, підписаний 2014 р."], ["Євроінтеграція", "процес наближення країни до ЄС і набуття членства в ньому."]], "f": "Фрідріх Ратцель, один із засновників геополітики, порівнював державу з живим організмом, що поєднує властивості народу й землі та бореться за своє існування.", "pr": ["Складіть схему «Центри сили сучасного світу»: глобальні та регіональні центри, чинники їхньої потужності; позначте їх на контурній карті світу.", "Напишіть коротке есе (8–10 речень) «Головні напрями зовнішньої політики України сьогодні»: поясніть, чому пріоритетами є ЄС, США та НАТО і як на зовнішню політику вплинула повномасштабна війна."], "qz": [{"q": "Що вивчає геополітика?", "o": ["Розміщення природних ресурсів", "Вплив географічного простору держав на їхні політичні цілі та інтереси", "Склад населення країн", "Кліматичні умови держав"], "a": 1, "why": "Таке визначення дає підручник."}, {"q": "Які держави домінували у двополюсному світі другої половини XX ст.?", "o": ["США та СРСР", "США та Китай", "Велика Британія та Франція", "Японія та Німеччина"], "a": 0, "why": "Вони очолювали блоки НАТО та ОВД."}, {"q": "Як назвали епоху протистояння двох блоків?", "o": ["Перебудова", "Глобалізація", "«Холодна війна»", "Деколонізація"], "a": 2, "why": "Протистояння без прямої війни назвали «холодною війною»."}, {"q": "Який з перелічених центрів сили називають основним у багатополюсному світі?", "o": ["Бразилія", "Туреччина", "Саудівська Аравія", "Європейський Союз"], "a": 3, "why": "Основні центри сили — США, ЄС, Китай, Японія, Індія; інші — регіональні лідери."}, {"q": "Коли Україна стала членом Світової організації торгівлі?", "o": ["1991 р.", "2005 р.", "2008 р.", "2014 р."], "a": 2, "why": "Україна вступила до СОТ у 2008 р."}, {"q": "Яку угоду Україна підписала з ЄС після Революції Гідності?", "o": ["Угоду про асоціацію", "Договір про вступ до НАТО", "Маастрихтський договір", "Шенгенську угоду"], "a": 0, "why": "Угоду про асоціацію підписано в березні 2014 р."}, {"q": "Коли Росія розпочала повномасштабне вторгнення в Україну?", "o": ["2 березня 2014 р.", "24 серпня 2021 р.", "1 грудня 2022 р.", "24 лютого 2022 р."], "a": 3, "why": "Агресія триває з 2014 р., повномасштабне вторгнення — з 24 лютого 2022 р."}, {"q": "Коли Україна отримала статус кандидата в члени ЄС?", "o": ["2014 р.", "2022 р.", "2008 р.", "2019 р."], "a": 1, "why": "Статус кандидата надано у 2022 р."}, {"q": "Яка країна вийшла з Європейського Союзу у 2020 р.?", "o": ["Франція", "Велика Британія", "Польща", "Швеція"], "a": 1, "why": "Brexit — вихід Великої Британії з ЄС у 2020 р."}, {"q": "Які країни вступили до НАТО у 2023–2024 рр.?", "o": ["Норвегія та Данія", "А function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  const s = l.s, si = SECS.indexOf(s), i = DATA.indexOf(l), pv = DATA[i - 1], nx = DATA[i + 1];
  document.getElementById("app").innerHTML = `<div style="--k:var(--${s.k})">
    <div class="crumb"><a href="#">← Усі теми</a><span>·</span><a href="#sec-${si}">${esc(s.short || s.name)}</a>${l.topic ? `<span>·</span><span>${esc(l.topic)}</span>` : ""}</div>
    <div class="lhead">
      <div class="l"><div class="tn">§${esc(l.p)} · ${esc(s.lab)}</div><h1>${esc(l.t)}</h1>
        <div class="chips">${l.pages ? `<span class="chip">📖 ${esc(l.pages)}</span>` : ""}<span class="chip">${(l.terms || []).length} понять</span><span class="chip">Тест · 5 питань</span>${(RES[l.n] || 0) >= 4 ? '<span class="chip">✓ Пройдено</span>' : ""}</div>
        ${l.g ? `<div class="goal">🎯 ${esc(l.g)}</div>` : ""}</div>
      <div class="r">${mapSVG({region:l.region || s.region, country:l.cid, ua:true, k:s.k, color:(l.region || s.region) === "world" && !l.cid, ar:1.55, label:l.cn || s.name})}${l.cn ? `<span class="pin">📍 ${esc(l.cn)}</span>` : ""}</div>
    </div>
    ${(l.nums || []).length ? `<div class="nums">${l.nums.map(x => `<div class="num"><b>${esc(x.v)}</b><span>${esc(x.l)}</span></div>`).join("")}</div>` : ""}
    <div class="lgrid">
      <div>
        ${(l.blocks || []).map((b, k) => `<div class="blk"><h2><span class="no">${k + 1}</span>${esc(b.h)}</h2>${(b.p || []).map(p => `<p>${esc(p)}</p>`).join("")}${(b.ul || []).length ? `<ul>${b.ul.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`).join("")}
        ${l.f ? `<div class="fact"><span class="em">🌍</span><div><b>Цікаво знати.</b> ${esc(l.f)}</div></div>` : ""}
        <section class="quiz" id="quiz"></section>
        <div class="pager">${pv ? `<a href="#L${pv.n}"><small>← Попередня тема</small>§${esc(pv.p)}. ${esc(pv.t)}</a>` : ""}${nx ? `<a class="next" href="#L${nx.n}"><small>Наступна тема →</small>§${esc(nx.p)}. ${esc(nx.t)}</a>` : ""}</div>
      </div>
      <aside class="side">
        ${(l.terms || []).length ? `<div class="panel"><h3>Легенда: ключові поняття <button class="small" id="hideT" type="button">Сховати</button></h3><div class="leg">${l.terms.map(t => `<button class="term" type="button"><i></i><span style="filter:none"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></span></button>`).join("")}</div></div>` : ""}
        ${(l.pr || []).length ? `<div class="panel"><h3>Завдання вдома</h3><ul class="tasks">${l.pr.map(x => `<li><span>${esc(x)}</span></li>`).join("")}</ul></div>` : ""}
        <div class="panel toc"><h3>${esc(s.short || s.name)}</h3>${s.items.map(x => `<a href="#L${x.n}" ${x === l ? 'aria-current="true"' : ""}><span class="n">§${esc(x.p)}</span><span>${esc(x.t)}</span></a>`).join("")}</div>
      </aside>
    </div></div>`;
  const T = [...document.querySelectorAll(".term")];
  T.forEach(t => t.onclick = () => t.classList.toggle("closed"));
  const h = document.getElementById("hideT"); if (h) h.onclick = () => { const c = !T[0].classList.contains("closed"); T.forEach(t => t.classList.toggle("closed", c)); h.textContent = c ? "Показати" : "Сховати"; };
  quiz(l); window.scrollTo(0, 0);
  document.title = `§${l.p}. ${l.t} · Географія ${CLS}`;
}
function quiz(l){
  const Q = document.getElementById("quiz");
  const items = shuffle(l.qz || []).slice(0, 5).map(x => ({q:x.q, why:x.why || "", opts:shuffle(x.o.map((o, j) => ({o, ok:j === x.a})))}));
  if (!items.length) { Q.remove(); return; }
  const prev = RES[l.n];
  Q.innerHTML = `<h2>✓ Перевір себе</h2><p class="sub">${prev != null ? "Найкращий результат: " + prev + " з 5. " : ""}Оберіть одну відповідь у кожному завданні. Питання щоразу інші.</p>
    ${items.map((it, k) => `<div class="qi"><div class="qq">${k + 1}. ${esc(it.q)}</div><div class="opts">${it.opts.map((o, j) => `<button class="opt" type="button" data-k="${k}" data-j="${j}"><span class="let">${"АБВГ"[j]}</span><span>${esc(o.o)}</span></button>`).join("")}</div><div class="why" hidden></div></div>`).join("")}
    <div class="qb"><button class="btn" id="chk" type="button" disabled>Перевірити</button><button class="btn ghost" id="again" type="button" hidden>Інші питання</button><span class="score" id="score"></span></div>`;
  const sel = {}, B = document.getElementById("chk");
  Q.querySelectorAll(".opt").forEach(b => b.onclick = () => { if (B.dataset.done) return; const k = b.dataset.k; sel[k] = +b.dataset.j; Q.querySelectorAll(`.opt[data-k="${k}"]`).forEach(x => x.classList.toggle("sel", x === b)); B.disabled = Object.keys(sel).length < items.length; });
  B.onclick = () => { B.dataset.done = 1; B.disabled = true; let ok = 0;
    items.forEach((it, k) => { const qi = Q.querySelectorAll(".qi")[k];
      qi.querySelectorAll(".opt").forEach((x, j) => { if (it.opts[j].ok) x.classList.add("right"); else if (sel[k] === j) x.classList.add("wrong"); });
      if (it.opts[sel[k]].ok) ok++; const w = qi.querySelector(".why"); if (it.why) { w.textContent = "💬 " + it.why; w.hidden = false; } });
    RES[l.n] = Math.max(RES[l.n] || 0, ok); save();
    document.getElementById("score").textContent = `${ok} з ${items.length}` + (ok === 5 ? " · Чудово! 🏆" : ok >= 4 ? " · Добре засвоєно 👍" : " · Перечитайте конспект і спробуйте ще раз");
    document.getElementById("again").hidden = false; };
  document.getElementById("again").onclick = () => quiz(l);
}
function route(){
  const h = location.hash.slice(1);
  if (/^sec-\d+$/.test(h)) { if (!document.getElementById("secs")) home(); const el = document.getElementById(h); if (el) el.scrollIntoView({behavior:"smooth"}); return; }
  const m = h.match(/^L(\d+)$/); const l = m && byN(m[1]);
  if (l) lesson(l); else { home(); window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);
const root = document.documentElement;
try { const t = localStorage.getItem("geo-theme"); if (t) root.dataset.theme = t; } catch(e) {}
document.getElementById("themeBtn").onclick = () => { const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; root.dataset.theme = dark ? "light" : "dark"; try { localStorage.setItem("geo-theme", root.dataset.theme); } catch(e) {} };
route();
</script>
</body>
