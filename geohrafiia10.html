и проводять демографічну політику; Японія ж має найстаріше суспільство і природне скорочення населення."], "ul": ["найвищий природний приріст — Ірак, Афганістан, Ємен, Оман (Західна Азія)", "Китай тривалий час проводив жорстку політику однодітної сім’ї", "у Сингапурі й Таїланді підвищували вік вступу до першого шлюбу", "у статевому складі переважають чоловіки: 1034 на 1000 жінок (за даними підручника)", "країни Перської затоки та НІК приваблюють трудових мігрантів", "Азія — основний експортер робочої сили («чайна-таун» у містах Європи та Америки)"]}, {"h": "Етнічний і релігійний склад", "p": ["В Азії живе понад 1000 народів і представлені майже всі мовні сім’ї, тому більшість країн багатонаціональні. Регіон — батьківщина всіх трьох світових релігій: християнство та іслам виникли на Близькому Сході, буддизм — у Північній Індії.", "Етнічна та релігійна строкатість часто стає причиною внутрішніх і міждержавних конфліктів."], "ul": ["іслам переважає в Західній Азії", "буддизм поширений в інших субрегіонах; державна релігія — у Монголії", "католицизм — на Філіппінах, у Південній Кореї, Лівані", "етнічні релігії: даосизм і конфуціанство (Китай), індуїзм і сикхізм (Індія), іудаїзм (Ізраїль), синтоїзм (Японія)"]}, {"h": "Розміщення населення та урбанізація", "p": ["Населення розміщене дуже нерівномірно: більшість живе на узбережжях і в долинах великих річок, а пустелі, високогір’я й ліси майже безлюдні. Рекордна густота — у Сингапурі, Бахрейні, Бангладеш.", "Наприкінці XX ст. урбанізація в Азії набула форми «міського вибуху». Хоча більшість населення ще сільське, за темпами урбанізації Азія випереджає інші регіони, а люди зосереджуються в дуже великих містах і агломераціях."], "ul": ["найвищий рівень урбанізації (понад 80 %) — Японія, Ізраїль, Південна Корея, країни Перської затоки", "найнижчий — Непал (за даними підручника)", "мегалополіс Токайдо (Токіо — Йокогама — Осака — Кобе — Кіото) — найбільший у світі", "Дельта Янцзи («золотий трикутник» із Шанхаєм) і Дельта Перлинної річки (Гуанчжоу, Шеньчжень, Сянган)", "найбільші агломерації: Токіо — Йокогама, Джакарта, Делі, Маніла, Сеул, Шанхай, Мумбаї", "у багатьох країнах понад третина працюючих зайняті в сільському господарстві"]}], "terms": [["Демографічний вибух", "різке зростання чисельності населення через високу народжуваність при швидкому зниженні смертності."], ["Демографічна політика", "система заходів держави, спрямованих на регулювання народжуваності та відтворення населення."], ["Урбанізація", "процес зростання ролі міст, збільшення частки міського населення та поширення міського способу життя."], ["Мегалополіс", "найбільша форма розселення, що утворюється внаслідок злиття кількох великих агломерацій."], ["Нафтогазоносна провінція", "велика територія, у межах якої зосереджено багато родовищ нафти й природного газу."], ["Етнічні релігії", "релігії, поширені переважно серед одного народу (синтоїзм у Японії, індуїзм в Індії, іудаїзм в Ізраїлі)."]], "f": "У передгір’ях Гімалаїв за рік випадає понад 11 000 мм опадів — це найвологіше місце на Землі.", "pr": ["Порівняйте політичну й фізичну карти Азії та складіть таблицю забезпеченості субрегіонів ресурсами (паливні, рудні, нерудні, водні, лісові, агрокліматичні); визначте, які субрегіони мають найкращі передумови для розвитку.", "Складіть тематичний туристичний маршрут об’єктами Світової спадщини ЮНЕСКО однієї з країн Азії (5–6 об’єктів із коротким описом)."], "qz": [{"q": "Яку частину площі Азії займають гори, нагір’я та плоскогір’я?", "o": ["1/4", "1/2", "3/4", "1/10"], "a": 2, "why": "Азія вирізняється найконтрастнішим і переважно гірським рельєфом."}, {"q": "Де розташована найбільша нафтогазоносна провінція Азії?", "o": ["у районі Перської затоки", "на півострові Індостан", "у Монголії", "на Філіппінах"], "a": 0, "why": "Найбільші запаси нафти й газу зосереджені в районі Перської затоки."}, {"q": "Які корисні копалини мають світове значення в Малайзії, Таїланді, М’янмі?", "o": ["калійні солі", "олово й вольфрам", "алмази", "боксити"], "a": 1, "why": "У цих країнах залягають багаті руди олова й вольфраму."}, {"q": "Яка частка Азії у світовому населенні (за даними підручника)?", "o": ["≈ 25 %", "≈ 40 %", "≈ 80 %", "≈ 60 %"], "a": 3, "why": "В Азії живе понад 4,4 млрд осіб — майже 60 % населення світу."}, {"q": "Яка країна Азії має найбільш «старе» суспільство?", "o": ["Афганістан", "Ємен", "Японія", "Ірак"], "a": 2, "why": "Через низьку народжуваність і довге життя в Японії вже відбувається природне скорочення населення."}, {"q": "Яка релігія виникла в Північній Індії?", "o": ["буддизм", "іслам", "християнство", "синтоїзм"], "a": 0, "why": "Буддизм сформувався в Північній Індії, християнство та іслам — на Близькому Сході."}, {"q": "У якій країні буддизм має статус державної релігії?", "o": ["Японія", "Індія", "Китай", "Монголія"], "a": 3, "why": "Підручник називає Монголію єдиною країною з буддизмом як державною релігією."}, {"q": "Який мегалополіс є найбільшим у світі за населенням?", "o": ["Дельта Янцзи", "Токайдо", "Дельта Перлинної річки", "Делі — Мумбаї"], "a": 1, "why": "Токайдо на сході Японії об’єднує Токіо, Йокогаму, Осаку, Кобе, Кіото."}, {"q": "Яка особливість статевого складу населення Азії?", "o": ["переважають чоловіки", "переважають жінки", "чоловіків і жінок порівну", "дані відсутні"], "a": 0, "why": "На 1000 жінок в Азії припадає 1034 чоловіки (за даними підручника)."}, {"q": "Які країни є основними центрами тяжіння трудових мігрантів в Азії?", "o": ["Непал і Бутан", "Афганістан і Ємен", "країни Перської затоки та нові індустріальні країни", "Монголія і Лаос"], "a": 2, "why": "Робоча сила прямує до Саудівської Аравії, ОАЕ, Катару, Сингапуру, Малайзії, Таїланду."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 1. Загальна характеристика Азії", "sregion": "asia", "sk": "asia"}, {"n": "19", "p": "19", "t": "Особливості економіки країн Азії. Первинний сектор економіки", "pages": "с. 107–111", "g": "З’ясувати, які групи країн визначають економіку Азії та чим вирізняються її добувна промисловість, сільське, рибне й лісове господарство.", "nums": [{"v": "≈ 1/3", "l": "світового видобутку нафти припадає на район Перської затоки (за даними підручника)"}, {"v": "≈ 1/3", "l": "орних земель світу розташовано в Азії (за даними підручника)"}, {"v": "≈ 70 %", "l": "світового вилову риби у внутрішніх водах (за даними підручника)"}], "blocks": [{"h": "Особливості економічного розвитку країн Азії", "p": ["Колись аграрна периферія світу, сьогодні Азія — лідер за обсягом ВВП і темпами економічного зростання. Проте відмінності між країнами тут значно більші, ніж у Європі.", "Японія — єдина країна «Великої сімки» в Азії; Китай та Індія вийшли на перші місця за загальним ВВП, хоча на одну особу показники в них поки невисокі. Важливу роль відіграють нові індустріальні країни та країни — експортери нафти."], "ul": ["Японія — провідна розвинена країна, лідер регіону у XX ст.", "Китай та Індія — швидке зростання, але низький ВВП на одну особу", "«азіатські тигри» (Південна Корея, Тайвань, Сингапур): ринкові реформи, відкрита економіка, освіта, наукоємні виробництва", "НІК нової хвилі: Таїланд, Малайзія, Філіппіни, Індонезія, Туреччина", "залучення іноземного капіталу й ТНК; з’явилися потужні китайські ТНК", "країни з низьким рівнем розвитку: Непал, Бангладеш, Бутан, Афганістан, Камбоджа, М’янма"]}, {"h": "Країни — експортери нафти", "p": ["Величезні прибутки від продажу нафти перетворили зону Перської затоки на потужний промисловий район. Останніми десятиліттями ці країни ускладнюють структуру господарства, щоб не залежати лише від нафти.", "Вони розвивають енергомісткі галузі, транспортну й фінансову інфраструктуру, посередницьку торгівлю й туризм."], "ul": ["Саудівська Аравія, ОАЕ, Кувейт, Катар, Бахрейн", "нафтохімія, чорна та кольорова металургія, цементна промисловість", "фінансові та транспортні центри (наприклад, Дубай)", "майже половина членів ОПЕК — азіатські країни (за даними підручника)", "ОПЕК суттєво впливає на світові ціни на нафту"]}, {"h": "Добувна промисловість", "p": ["Країни Азії лідирують у видобутку руд чорних і кольорових металів та вугілля, але головне, що визначає роль регіону в міжнародному поділі праці, — видобуток і експорт нафти й газу. Їх видобувають майже в половині країн регіону.", "Нафта Перської затоки — найдешевша у світі: вона високоякісна, залягає неглибоко й поблизу великих портів."], "ul": ["залізні руди — Китай, Індія, Казахстан", "марганцеві — Індія, Китай, Казахстан; мідні — Казахстан, Монголія, Іран", "олово — Китай, Малайзія; вольфрам — Китай", "вугілля — Китай (Північно-Східний басейн), Казахстан (Карагандинський), Індія", "нафта й газ — Перська затока, Центральна Азія (Туркменистан, Азербайджан, Казахстан), Зондський басейн"]}, {"h": "Сільське господарство", "p": ["Азія — найбільший виробник сільськогосподарської продукції у світі, тут уперше почали вирощувати пшеницю твердих сортів, рис, цукрову тростину, чай і одомашнили багатьох тварин. Довго зростання населення випереджало виробництво продовольства, але з 1970-х рр. «зелена революція» допомогла багатьом країнам забезпечити себе їжею.", "Переважає рослинництво, у якому поєднуються високотоварний (експортний, часто плантаційний) і дрібнотоварний (для внутрішнього ринку) сектори."], "ul": ["найбільша частка орних земель — Бангладеш та Індія", "«зелена революція»: високоврожайні сорти, зрошення, сучасна техніка", "експортні культури: чай, бавовник, джут, цукрова тростина, гевея, спеції, кокосова пальма, тропічні фрукти", "продовольчі культури для внутрішнього ринку: рис, пшениця, просо, соя, батат", "спеціалізацію визначають клімат, релігійні традиції харчування, рівень агротехнологій", "найбідніші країни досі мають проблеми з продовольством"]}, {"h": "Рибальство, аквакультура та лісове господарство", "p": ["Азія — провідний регіон рибальства: на неї припадає більша частина вилову у внутрішніх водах і половина — в океанах; лідери — Китай, Індонезія, Індія. Регіон також перший у світі за аквакультурою.", "Лісове господарство важливе для Південно-Східної Азії та Китаю: заготівля деревини, збирання соку гевеї й кори хінного дерева, створення лісових плантацій, боротьба з браконьєрством."], "ul": ["аквакультура: риба, молюски, ракоподібні, водорості", "лідери аквакультури: Китай, Японія, Південна Корея, Філіппіни, Таїланд, В’єтнам", "аквакультура, ймовірно, зародилася в басейні Меконгу", "площа лісів Азії останнім часом зросла (за даними підручника)", "сік гевеї — сировина для натурального каучуку"]}], "terms": [["Нові індустріальні країни (НІК)", "країни, що за короткий час здійснили індустріалізацію та стали експортерами промислової, зокрема наукоємної, продукції."], ["ТНК", "транснаціональна корпорація — велика компанія, що має виробничі підрозділи та філії в багатьох країнах."], ["ОПЕК", "Організація країн — експортерів нафти, що координує нафтову політику своїх членів і впливає на світові ціни."], ["«Зелена революція»", "комплекс змін у сільському господарстві: упровадження високоврожайних сортів, зрошення та сучасної техніки."], ["Плантація", "велике товарне господарство, що спеціалізується на вирощуванні однієї експортної культури (чаю, гевеї, цукрової тростини)."], ["Аквакультура", "штучне розведення риби, молюсків, ракоподібних і водоростей у природних чи штучних водоймах."]], "f": "Саме з Азії походять рис, цукрова тростина, чай і цибуля, а також тут уперше одомашнили вівцю, корову та свиню.", "pr": ["Проаналізуйте за мал. 1 параграфа структуру ВВП Японії, Південної Кореї, Малайзії, ОАЕ, Непалу та Монголії; складіть таблицю й зробіть висновок про рівень розвитку цих країн.", "Позначте на контурній карті Азії основні райони видобутку нафти й газу, вугілля та руд, а також райони плантаційного вирощування чаю, гевеї й цукрової тростини."], "qz": [{"q": "Яка азіатська країна входить до «Великої сімки»?", "o": ["Китай", "Індія", "Південна Корея", "Японія"], "a": 3, "why": "Японія — єдина країна «Великої сімки» в Азії."}, {"q": "Яка особливість економіки Китаю та Індії?", "o": ["великий загальний ВВП, але невисокий ВВП на одну особу", "найвищий у світі ВВП на одну особу", "відсутність промисловості", "переважання видобутку нафти"], "a": 0, "why": "За загальним ВВП вони серед лідерів, але на одну особу показники ще незначні."}, {"q": "Які країни належать до «азіатських тигрів»?", "o": ["Індія, Пакистан, Бангладеш", "Іран, Ірак, Кувейт", "Південна Корея, Тайвань, Сингапур", "Непал, Бутан, Лаос"], "a": 2, "why": "Їх ще називають «далекосхідними драконами» — це НІК першої хвилі."}, {"q": "Чому нафта Перської затоки має найнижчу собівартість у світі?", "o": ["її видобувають тільки вручну", "вона залягає неглибоко біля великих портів і має високу якість", "її не потрібно переробляти", "її видобувають на шельфі Північного моря"], "a": 1, "why": "Неглибоке залягання, близькість портів і висока якість здешевлюють видобуток."}, {"q": "Як країни Перської затоки ускладнюють структуру господарства?", "o": ["розвивають нафтохімію, металургію, фінанси, туризм", "відмовляються від видобутку нафти", "розвивають тільки рисівництво", "закривають порти"], "a": 0, "why": "Вони створюють енергомісткі галузі, фінансову інфраструктуру й туризм."}, {"q": "Що передбачає «зелена революція»?", "o": ["перехід до кочового скотарства", "вирубку лісів під пасовища", "високоврожайні сорти, зрошення, сучасну техніку", "заборону мінеральних добрив"], "a": 2, "why": "Ці заходи підвищили продуктивність і допомогли забезпечити країни продовольством."}, {"q": "Яка культура належить до експортних культур високотоварного сектору Азії?", "o": ["просо", "батат", "рис для власного споживання", "чай"], "a": 3, "why": "Чай, джут, гевею, спеції вирощують переважно на плантаціях на експорт."}, {"q": "Які країни є трійкою світових лідерів з вилову риби?", "o": ["Японія, Корея, Таїланд", "Китай, Індонезія, Індія", "В’єтнам, Філіппіни, Малайзія", "Іран, Ірак, Туреччина"], "a": 1, "why": "Підручник називає лідерами Китай, Індонезію та Індію."}, {"q": "Що таке аквакультура?", "o": ["штучне розведення риби, молюсків, водоростей", "видобуток нафти на шельфі", "зрошувальне землеробство", "вирощування рису на терасах"], "a": 0, "why": "Азія лідирує за всіма видами аквакультури, особливо за водоростями."}, {"q": "Яка країна має найбільшу частку орних земель (за даними підручника)?", "o": ["Китай", "Іран", "Йорданія", "Бангладеш"], "a": 3, "why": "У Бангладеш орні землі займають близько 70 % території."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 1. Загальна характеристика Азії", "sregion": "asia", "sk": "asia"}, {"n": "20", "p": "20", "t": "Основні промислові райони Азії. Вторинний та третинний сектори економіки", "pages": "с. 112–117", "g": "Визначити головні промислові райони Азії, провідні галузі вторинного сектору, особливості сфери послуг і місце регіону в міжнародному поділі праці.", "nums": [{"v": "понад 50 %", "l": "світового промислового виробництва припадає на Азію (за даними підручника)"}, {"v": "понад 40 %", "l": "частка Азії у світовому виробництві електроенергії (за даними підручника)"}, {"v": "понад 70 %", "l": "світового виробництва сталі та чавуну (за даними підручника)"}, {"v": "понад 50 %", "l": "частка Китаю у світовому виробництві сталі (за даними підручника)"}], "blocks": [{"h": "Основні промислові райони", "p": ["На країни Азії припадає понад половина світового промислового виробництва, тут розвинені всі галузі обробної промисловості, але рівень і розміщення дуже різняться. Підручник виділяє п’ять найпотужніших промислових районів.", "Кожен із них має власну спеціалізацію — від наукоємного машинобудування Японії до нафтохімії Перської затоки."], "ul": ["Тихоокеанський (східне узбережжя Японії): автомобілі, судна, електроніка, роботи", "Північно-Східний (Китай: Шанхай, Пекін, Тяньцзінь): металургія, машинобудування, хімія, текстиль", "«Індійський Рур» («Індійський Донбас», центр — Колката): вугілля і металургія; у його створенні брали участь українські фахівці", "зона Перської затоки: нафтопереробка, нафтохімія, металургія", "центри НІК (Сингапур, Сеул, Тайбей): транспортне й точне машинобудування, нафтохімія"]}, {"h": "Енергетика та металургія", "p": ["Основу енергетики Азії становить вугілля (Східна, Південна, Центральна Азія), а в Західній Азії — нафта й газ. Великі ГЕС збудовано на Хуанхе, Янцзи, Євфраті, Інді; найпотужніша у світі — «Три ущелини» на Янцзи. АЕС працюють у Японії, Китаї, Індії, Південній Кореї та інших країнах.", "Чорна металургія — одна з найрозвиненіших галузей: Азія дає понад 70 % світової сталі, абсолютний лідер — Китай, далі Японія, Індія, Туреччина."], "ul": ["ТЕС розміщені біля джерел палива та у великих містах", "ГЕС «Три ущелини» (Китай) — найпотужніша у світі", "лідери з виробництва електроенергії на одну особу: Південна Корея, Японія, Саудівська Аравія, ОАЕ, Катар", "кольорова металургія: олово (Китай, Малайзія, Таїланд), мідь (Японія, Індонезія, Філіппіни), алюміній (Індія, Японія)", "металургійні комбінати також в Ірані, В’єтнамі, Індонезії, Казахстані, Малайзії"]}, {"h": "Машинобудування, хімічна, легка й харчова промисловість", "p": ["У машинобудуванні переважають автомобілі, судна, побутова техніка й радіоелектроніка; в Азії виробляють понад половину легкових і 3/4 вантажних автомобілів світу. Японія та Південна Корея спеціалізуються на високоякісній електроніці, робототехніці, суднах, а Китай і НІК — на трудомісткій продукції.", "Центр світової текстильної промисловості перемістився до Східної та Південно-Східної Азії завдяки дешевій робочій силі. Поширені також ремісничі виробництва."], "ul": ["Ізраїль — військова та медична техніка", "хімія: азотні добрива, побутова хімія, фармацевтика, полімери (Японія, Китай, Індія, нафтодобувні країни)", "текстиль, одяг і взуття перенесено з США та Японії до країн Азії", "килими (Іран, Афганістан), ювелірні вироби (Індія, Іран), прикраси (Шри-Ланка)", "Азія — батьківщина халви, родзинок, рахат-лукуму, кураги, чаю"]}, {"h": "Третинний сектор", "p": ["Економічні успіхи прискорили розвиток послуг: фінансів, торгівлі, освіти, ІТ, транспорту, туризму. Найвища частка сфери послуг у ВВП — у Кіпру, Японії, Ізраїлю, а також у Сингапурі та на Мальдівах.", "До десятки найбільших фінансових центрів світу входять Токіо, Сянган і Сингапур; штаб-квартири великих компаній є також у Пекіні, Шанхаї, Сеулі, Дубаї, Стамбулі. Світовий рівень мають університети Японії, Китаю, Сингапуру, Ізраїлю."], "ul": ["Сянган — торговельний і фінансовий центр світового значення", "офшорні зони: Кіпр, Сингапур, Бахрейн, ОАЕ, Малайзія", "провідні університети: Токійський, Кіотський, Цінхуа, Пекінський, Національний університет Сингапуру", "Азія — друга за масштабами міжнародного туризму і перша за темпами його зростання", "туристичні центри: Таїланд, Туреччина, Мальдіви, Китай", "пам’ятки: Тадж-Махал, Велика Китайська стіна, собор Святої Софії"]}, {"h": "Транспорт", "p": ["Транспортна система Азії дуже неоднорідна: найгустіша мережа — в Японії, на сході Китаю, в Індії, Пакистані та НІК, а в деяких країнах (Афганістан, Кіпр, Лаос, Оман, ОАЕ) залізниць немає. У внутрішніх перевезеннях лідирує залізничний транспорт, швидко зростає автомобільний.", "Морські порти Азії очолюють світові рейтинги, важливе й річкове судноплавство (Янцзи, Меконг). Зростає роль авіації, а в найбідніших країнах ще використовують гужовий, в’ючний і велосипедний транспорт."], "ul": ["найбільші порти: Шанхай (1-ше місце у світі), Сингапур, Шеньчжень, Нінбо, Сянган, Пусан, Дубай", "великі аеропорти: Пекін, Токіо, Сянган, Дубай, Сингапур («Чангі»), Стамбул", "«Чангі» багато років визнавали найкращим аеропортом світу", "швидке будівництво автострад"]}, {"h": "Азія в міжнародному поділі праці та зв’язки з Україною", "p": ["Японія, Китай та НІК дають понад половину світового експорту автомобілів і високотехнологічної продукції, а інші країни постачають сировину (нафту, газ, руди) і сільгосппродукцію (чай, каучук, джут, спеції, фрукти). Азіатський експорт іде до Північної Америки, Європи, зокрема в Україну.", "Напрями співпраці України з Азією: освоєння паливних ресурсів, високі технології, ракетно-космічна, авіаційна, хімічна галузі, машинобудування, суднобудування, постачання сільгосппродукції. Примітка: війна Росії проти України з 2022 р. суттєво ускладнила експорт через чорноморські порти, зокрема до країн Азії."], "ul": ["експорт Азії: автомобілі, електроніка, телекомунікаційне обладнання, судна", "сировинний експорт: нафта, газ, марганець, олово, хроміти", "транспортний коридор ТРАСЕКА — «відроджений шовковий шлях» Європа — Кавказ — Центральна Азія — Китай", "для України цінний досвід інноваційної стратегії країн Південно-Східної Азії", "вигідне положення Азії на морських шляхах між Європою і Тихим океаном"]}], "terms": [["Промисловий район", "територія з високою концентрацією промислових підприємств, пов’язаних спільною спеціалізацією та інфраструктурою."], ["Трудомістке виробництво", "виробництво, у собівартості продукції якого велика частка витрат на оплату праці (текстиль, складання електроніки)."], ["Офшорна зона", "територія з пільговим податковим режимом для зареєстрованих там іноземних компаній."], ["Каботажні перевезення", "морські перевезення між портами однієї країни."], ["Міжнародний поділ праці (МПП)", "спеціалізація країн на виробництві певних товарів і послуг для обміну на світовому ринку."], ["ТРАСЕКА", "міжнародний транспортний коридор Європа — Кавказ — Азія, так званий «відроджений шовковий шлях»."]], "f": "Під час будівництва ГЕС «Три ущелини» на Янцзи було затоплено 13 міст і переселено близько 1,3 млн осіб.", "pr": ["Практична робота 3: порівняйте продовольчий кошик жителів країн Західної та Східної Азії (основні продукти, їхнє походження, вплив клімату й релігії) і оформіть результат у таблиці.", "За картами атласу заповніть таблицю «Розміщення провідних галузей обробної промисловості Азії» (електроенергетика, машинобудування, чорна й кольорова металургія, хімія — країни та центри)."], "qz": [{"q": "Яка частка Азії у світовому промисловому виробництві (за даними підручника)?", "o": ["понад 50 %", "близько 10 %", "близько 25 %", "понад 90 %"], "a": 0, "why": "На країни Азії припадає понад половина світової промислової продукції."}, {"q": "Як ще називають вугільно-металургійний район на північному сході Індії?", "o": ["«Індійська Рив’єра»", "«Індійський Рур»", "«Індійський трикутник»", "«Індійська Кремнієва долина»"], "a": 1, "why": "Його називають «Індійським Руром», або «Індійським Донбасом», центр — Колката."}, {"q": "На якій річці розташована найпотужніша у світі ГЕС «Три ущелини»?", "o": ["Хуанхе", "Інд", "Янцзи", "Меконг"], "a": 2, "why": "ГЕС «Три ущелини» збудовано на Янцзи в Китаї."}, {"q": "Яка країна — безперечний лідер світового виробництва сталі?", "o": ["Японія", "Індія", "Туреччина", "Китай"], "a": 3, "why": "Китай дає понад 50 % світової сталі (за даними підручника)."}, {"q": "Чому текстильна й швейна промисловість переміщується до країн Азії?", "o": ["через дешеву робочу силу", "через великі запаси нафти", "через холодний клімат", "через відсутність транспорту"], "a": 0, "why": "Трудомісткі виробництва переносять туди, де праця дешевша."}, {"q": "На чому спеціалізуються Японія та Південна Корея в машинобудуванні?", "o": ["на гужовому транспорті", "на високоякісній електроніці, робототехніці, суднах", "лише на велосипедах", "на сільськогосподарській техніці для експорту в Африку"], "a": 1, "why": "Ці країни виробляють наукоємну продукцію вищого класу."}, {"q": "Який порт посідає перше місце у світі за обсягами перевезень (за даними підручника)?", "o": ["Сингапур", "Пусан", "Дубай", "Шанхай"], "a": 3, "why": "Шанхай очолює світовий рейтинг морських портів."}, {"q": "Які азійські міста, крім Токіо, входять до десятки найбільших фінансових центрів світу?", "o": ["Сянган і Сингапур", "Делі і Карачі", "Тегеран і Багдад", "Ханой і Улан-Батор"], "a": 0, "why": "Підручник називає Сянган і Сингапур світовими фінансовими центрами."}, {"q": "Що таке ТРАСЕКА?", "o": ["нафтовий картель", "університет у Сингапурі", "транспортний коридор Європа — Кавказ — Азія", "офшорна зона"], "a": 2, "why": "ТРАСЕКА — «відроджений шовковий шлях» від Європи через Чорне море, Кавказ і Центральну Азію до Китаю."}, {"q": "Що постачають на світовий ринок менш розвинені країни Азії?", "o": ["переважно літаки й роботів", "сировину та сільськогосподарську продукцію", "фінансові послуги", "космічні апарати"], "a": 1, "why": "Це нафта, газ, руди, чай, каучук, джут, спеції, тропічні фрукти."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 1. Загальна характеристика Азії", "sregion": "asia", "sk": "asia"}, {"n": "21", "p": "21", "t": "Японія: економіко-географічне положення, природні умови та ресурси, населення", "pages": "с. 118–121", "g": "З’ясувати, чому острівне положення в центрі Азіатсько-Тихоокеанського регіону вигідне для Японії, як країна живе в умовах дефіциту ресурсів і якими є особливості її населення.", "nums": [{"v": "понад 4000", "l": "островів у складі Японії (за даними підручника)"}, {"v": "126,5 млн", "l": "населення — десяте місце у світі (за даними підручника)"}, {"v": "понад 330 осіб/км²", "l": "середня густота населення (за даними підручника)"}, {"v": "≈ 93,5 %", "l": "частка міського населення (за даними підручника)"}], "blocks": [{"h": "Склад території та економіко-географічне положення", "p": ["Японія — острівна держава біля східного узбережжя Азії. До її складу входять понад 4000 островів, із них чотири великі: Хонсю, Хоккайдо, Кюсю і Сікоку. Японське море відділяє її від Росії та Корейського півострова, Східнокитайське — від Китаю, а зі сходу острови омиває Тихий океан.", "Положення дуже вигідне: Японія лежить між динамічними Китаєм і Південною Кореєю та потужними США, океан слугує їй безмежною транспортною магістраллю, а глибокі бухти зручні для портів. Віддаленість від головних конкурентів (США, Європи) допомогла японським ТНК закріпитися в регіоні."], "ul": ["«Країна вранішнього сонця» — новий день тут настає раніше, ніж у більшості країн", "найменша відстань до материка — близько 200 км (до Південної Кореї)", "дуже порізана берегова лінія — 29,7 тис. км, майже як в Африки (за даними підручника)", "розташування в центрі Азіатсько-Тихоокеанського регіону", "вигідні умови для участі в міжнародному поділі праці"]}, {"h": "Природні умови й ресурси", "p": ["Більшу частину території займають гори, серед яких багато вулканів; найвища точка — вулкан Фудзі (Фудзіяма). Японія лежить у сейсмічно активному Тихоокеанському поясі, тому тут часті землетруси й цунамі. Клімат мусонний, від помірного на Хоккайдо до субтропічного на півдні.", "Мінеральних ресурсів дуже мало, тож країна імпортує майже все паливо й сировину. Натомість багаті лісові, водні та біологічні ресурси прибережних морів, а також рекреаційні ресурси."], "ul": ["переважно гірський рельєф, рівнини — вузькою смугою вздовж узбережжя", "висока сейсмічність, вулкани, цунамі", "дефіцит майже всіх мінеральних ресурсів", "значні лісові та гідроенергетичні ресурси", "багаті рибні ресурси морів", "20 об’єктів Світової спадщини ЮНЕСКО (за даними підручника): замок Хімедзі, Кіото, Нара, Фудзіяма, меморіал Миру в Хіросімі"]}, {"h": "Демографічна ситуація", "p": ["За кількістю населення Японія замикає першу десятку країн світу, але з 2007 р. кількість жителів поступово зменшується. Причини — низька народжуваність і дуже висока тривалість життя (84,7 року, за даними підручника).", "Через це швидко зростає частка людей похилого віку: вона більш ніж удвічі перевищує частку дітей і підлітків. Старіння населення — серйозний виклик для економіки й пенсійної системи."], "ul": ["природне скорочення населення", "частка людей похилого віку — 27,9 %, дітей — 12,8 % (за даними підручника)", "одна з найвищих у світі тривалостей життя", "Японія має найбільш «старе» суспільство Азії", "скорочення кількості працездатного населення в майбутньому"]}, {"h": "Національний і релігійний склад", "p": ["Японія — практично однонаціональна держава: японці становлять понад 99 % населення. Є невеликі громади корейців і китайців, а також корінний народ острова Хоккайдо — айни, які значною мірою асимілювалися.", "Основні релігії — синтоїзм (давня національна релігія) і буддизм, що прийшов у X ст. Вони не ворогували, а утворили своєрідний союз: більшість японців вважають себе прихильниками обох."], "ul": ["однорідний національний склад", "айни — корінне населення Хоккайдо", "синтоїзм — національна релігія Японії", "буддизм поширений поряд із синтоїзмом", "Японія не знала релігійних війн"]}, {"h": "Розміщення населення та трудові ресурси", "p": ["Середня густота населення дуже висока, а фактично ще вища, бо більшість людей живе на рівнинах тихоокеанського узбережжя. Найбільші агломерації — Токійська, Осакська й Нагойська — разом утворюють мегалополіс Токайдо.", "Країна добре забезпечена кваліфікованими трудовими ресурсами. Важливу роль в економічних успіхах відіграє «людський чинник»: працьовитість, сумлінність, освіченість, відданість колективу, система «довічного найму»."], "ul": ["понад 93 % населення — городяни", "мегалополіс Токайдо на тихоокеанському узбережжі", "структура зайнятості (за даними підручника): послуги ≈ 71 %, промисловість ≈ 26 %, сільське господарство ≈ 3 %", "«довічний найм» — гарантія роботи у фірмі до пенсії", "колективізм, ієрархія, прив’язаність до сім’ї, школи, роботи", "дбайливе ставлення до традицій"]}], "terms": [["Острівна держава", "держава, територія якої повністю розташована на островах."], ["Сейсмічний пояс", "зона земної кори з частими землетрусами та вулканізмом; Японія лежить у Тихоокеанському поясі."], ["Цунамі", "гігантські морські хвилі, що виникають унаслідок підводних землетрусів або вивержень вулканів."], ["Природне скорочення населення", "ситуація, коли смертність перевищує народжуваність і кількість жителів зменшується."], ["Синтоїзм", "давня національна релігія Японії, заснована на шануванні сил природи та предків."], ["«Довічний найм»", "японська система зайнятості, що гарантує працівникові постійну роботу в компанії до виходу на пенсію."]], "f": "Берегова лінія Японських островів (близько 29,7 тис. км) майже дорівнює довжині берегової лінії всієї Африки.", "pr": ["Складіть порівняльну таблицю економіко-географічного положення Японії та Великої Британії (острівність, сусіди, морські шляхи, ресурси); визначте спільні та відмінні риси.", "За картою атласу позначте на контурній карті чотири найбільші острови Японії, моря, що їх омивають, вулкан Фудзі та агломерації Токіо, Осака, Нагоя; поясніть, чому населення зосереджене на узбережжі."], "qz": [{"q": "Який із цих островів НЕ належить до чотирьох найбільших островів Японії?", "o": ["Хонсю", "Тайвань", "Кюсю", "Хоккайдо"], "a": 1, "why": "Найбільші острови Японії — Хонсю, Хоккайдо, Кюсю і Сікоку."}, {"q": "Чому Японію називають «Країною вранішнього сонця»?", "o": ["через спекотний клімат", "бо там найдовший день", "бо новий день там настає раніше, ніж у більшості країн", "через прапор із місяцем"], "a": 2, "why": "Японія розташована на сході, звідки разом із сонцем приходить новий день."}, {"q": "Яке море відділяє Японію від Корейського півострова і Росії?", "o": ["Японське", "Жовте", "Південнокитайське", "Охотське"], "a": 0, "why": "Японське море лежить між Японськими островами та материком."}, {"q": "Яка головна проблема природно-ресурсного потенціалу Японії?", "o": ["нестача прісної води", "відсутність лісів", "надлишок нафти", "дефіцит майже всіх мінеральних ресурсів"], "a": 3, "why": "Країна змушена імпортувати більшість палива та сировини."}, {"q": "Яке природне явище особливо характерне для Японії?", "o": ["посухи й пилові бурі", "землетруси й цунамі", "вічна мерзлота", "тропічні пустелі"], "a": 1, "why": "Японія лежить у сейсмічно активному Тихоокеанському поясі."}, {"q": "Яка демографічна особливість Японії?", "o": ["швидке зростання населення", "переважання дітей", "природне скорочення населення", "висока частка іммігрантів"], "a": 2, "why": "З 2007 р. населення зменшується через низьку народжуваність."}, {"q": "Які дві релігії є основними в Японії?", "o": ["синтоїзм і буддизм", "іслам і християнство", "індуїзм і сикхізм", "іудаїзм і конфуціанство"], "a": 0, "why": "Більшість японців вважають себе прихильниками і синтоїзму, і буддизму."}, {"q": "Хто такі айни?", "o": ["іммігранти з Китаю", "корінне населення острова Хоккайдо", "японські монахи", "мешканці Окінави"], "a": 1, "why": "Айни — корінний народ Хоккайдо, значною мірою асимільований."}, {"q": "Які агломерації утворюють мегалополіс Токайдо?", "o": ["Сеульська, Пусанська, Інчхонська", "Шанхайська, Пекінська, Гуанчжоуська", "Токійська, Осакська, Нагойська", "Делійська, Мумбайська, Колкатська"], "a": 2, "why": "Разом із містами між ними вони утворюють мегалополіс Токайдо."}, {"q": "Що таке система «довічного найму»?", "o": ["заборона змінювати місце проживання", "обов’язкова військова служба", "гарантія роботи в одній компанії до пенсії", "пенсія з 40 років"], "a": 2, "why": "Працівник отримує гарантії постійної роботи у фірмі до виходу на пенсію."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 2. Країни Азії", "sregion": "asia", "sk": "asia", "cid": "392", "cn": "Японія"}, {"n": "22", "p": "22", "t": "Японія: господарство", "pages": "с. 122–128", "g": "З’ясувати, як Японія без власної сировини стала однією з найрозвиненіших постіндустріальних країн і на чому ґрунтується її міжнародна спеціалізація.", "nums": [{"v": "≈ 11 %", "l": "щорічні темпи зростання економіки у другій половині XX ст. (за даними підручника)"}, {"v": "3-тє місце", "l": "у світі за обсягом промислового виробництва (за даними підручника)"}, {"v": "13 %", "l": "частка орних земель у площі країни (за даними підручника)"}, {"v": "18 %", "l": "частка Японії в усіх промислових роботах світу (за даними підручника)"}], "blocks": [{"h": "Японське «економічне диво» та модель розвитку", "p": ["Після Другої світової війни Японія мала зруйновану промисловість і майже не мала власних ресурсів, але вже наприкінці 1960-х рр. посіла друге місце у світі за промисловим виробництвом. Високі темпи зростання дістали назву японського «економічного дива».", "Сьогодні Японія — високорозвинена постіндустріальна держава. Її економічна модель — «ієрархічний корпоративізм»: тісна співпраця держави, банків і корпорацій, а фірми об’єднуються в промислово-фінансові групи кейрецу."], "ul": ["чинники успіху: продумана національна стратегія, запозичення технологій, низькі витрати на оборону, інтенсивна праця", "кейрецу — групи фірм із довготривалими зв’язками", "японські ТНК («Тойота», «Хонда», «Хітачі», «Соні») спеціалізуються на промисловій продукції", "скорочення енерго- й матеріаломістких виробництв, орієнтація на наукоємні", "Токіо — головний промисловий, фінансовий і культурний центр", "Японію вважають моделлю екологічного розвитку з повторним використанням відходів"]}, {"h": "Третинний сектор", "p": ["Сфера послуг створює понад дві третини ВВП, у ній розвинені всі види діяльності, типові для постіндустріальних країн. Банківська система, побудована після війни за американським зразком, — одна з найпотужніших у світі.", "За часткою витрат на науку Японія входить до першої п’ятірки країн світу. Державна програма «Технополіс» створила наукові міста й технопарки, а система охорони здоров’я охоплює медичним страхуванням усе населення."], "ul": ["пріоритети науки: біотехнології, інформаційні системи, нові види енергії й матеріалів, дослідження Землі, Космосу, Океану", "Цукуба — перше наукове місто поблизу Токіо", "острів Кюсю — «Кремнієвий острів»", "космодром на острові Танегасіма", "витрати на охорону здоров’я — понад 10 % ВВП (за даними підручника)"]}, {"h": "Промисловість: машинобудування", "p": ["Машинобудування — лідер японської індустрії: воно дає понад половину промислової продукції, значна частина якої йде на експорт. Японія посідає провідні позиції з виробництва автомобілів, верстатів, суден, електроніки та роботів.", "Підприємства зосереджені в Тихоокеанському промисловому поясі: у Токійському районі — автомобілі, складні верстати, роботи; в Осакському — металомістке обладнання; у Нагойському — верстати та устаткування."], "ul": ["автомобілебудування: «Тойота», «Ніссан», «Хонда»; понад 9 млн одиниць на рік (за даними підручника)", "суднобудування: супертанкери, суховантажі, круїзні лайнери, наукові судна", "світовий лідер робототехніки, зокрема роботів для медицини й догляду за людьми", "електродвигуни, побутова електроніка, комп’ютери та комплектуючі", "частину складальних виробництв ТНК переносять до НІК Азії"]}, {"h": "Енергетика, металургія, хімія", "p": ["Понад 80 % електроенергії виробляють ТЕС на привізному паливі. До 2011 р. АЕС давали близько 30 % електроенергії, але після аварії на АЕС «Фукусіма» внаслідок землетрусу й цунамі їх зупинили для перевірки, і відновлення атомної енергетики йде повільно. Активно розвивається сонячна енергетика.", "Японська металургія — найсучасніша у світі за технічним оснащенням; за виробництвом і експортом сталі країна друга після Китаю (за даними підручника). Підприємства працюють на привізній сировині біля великих портів."], "ul": ["ГЕС дають близько 9 % електроенергії", "альтернативна енергетика — переважно сонячні станції", "металургійні центри: Токіо, Йокогама, Кавасакі, Кобе, Осака", "кольорова металургія: мідь, алюміній, цинк для машинобудування", "хімія: пластмаси, синтетичні смоли, хімічні волокна, синтетичний каучук", "світове значення має целюлозно-паперова й поліграфічна промисловість"]}, {"h": "Сільське й рибне господарство", "p": ["Орні землі займають лише 13 % території, але завдяки сучасним методам землеробства та селекції Японія досягла високих урожаїв. Головна культура й основний японський «хліб» — рис, що займає майже половину оброблюваних земель.", "Країна забезпечує себе продовольством лише частково (64 %, за даними підручника). Риба й морепродукти — основа харчування: за їх споживанням на одну особу Японія поступається лише Ісландії."], "ul": ["рис — головна зернова культура, уряд підтримує власних виробників", "овочі, фрукти, цукровий буряк", "свинарство, скотарство, птахівництво", "вилов морепродуктів і значний їх імпорт", "розвинена аквакультура в прибережних водах"]}, {"h": "Транспорт, зовнішні зв’язки та співпраця з Україною", "p": ["Основні види внутрішнього транспорту — автомобільний і залізничний; тунелі й мости поєднують чотири головні острови, діє система швидкісних залізниць «сінкансен». Міжнародні перевезення забезпечують морський та авіаційний транспорт.", "Економіка майже повністю залежить від імпорту сировини й палива, а експортує Японія машини, сталь, хімічну продукцію, технології та капітал; головні партнери — США, Китай, Південна Корея, Таїланд, Австралія. Україна купує японські автомобілі й електроніку і постачає руди та продовольство; у 2016 р. на Львівщині відкрито завод «Фудзікура». Примітка: після 2022 р. Японія приєдналася до санкцій проти Росії та надає Україні значну допомогу."], "ul": ["«сінкансен» — поїзди зі швидкістю до 300 км/год", "великі порти: Нагоя, Тіба, Йокогама, Кобе, Токіо, Осака", "головний аеропорт — «Ханеда» (Токіо)", "імпорт: нафта, газ, вугілля, залізна руда, боксити, бавовна", "переорієнтація з експорту товарів на експорт капіталу та інвестицій", "2017 рік був оголошений Роком Японії в Україні"]}], "terms": [["«Економічне диво»", "період дуже швидкого економічного зростання країни; у Японії — друга половина XX ст."], ["Кейрецу", "японські промислово-фінансові групи фірм, пов’язаних довготривалими стійкими зв’язками."], ["Постіндустріальна країна", "країна, у якій основну частину ВВП створює сфера послуг, а промисловість спирається на наукоємні технології."], ["Технополіс", "місто або зона, де зосереджені наукові установи та високотехнологічні виробництва."], ["Тихоокеанський промисловий пояс", "смуга найбільших промислових районів уздовж тихоокеанського узбережжя Японії."], ["Сінкансен", "мережа японських швидкісних залізниць."]], "f": "Японія — світовий лідер робототехніки: тут створюють навіть роботів-тюленят «Паро», які допомагають заспокоювати пацієнтів у клініках.", "pr": ["Позначте на контурній карті найбільші промислові та транспортні центри Японії (Токіо, Йокогама, Кавасакі, Нагоя, Осака, Кобе, Тіба) і підпишіть їхню спеціалізацію.", "Напишіть коротке есе (8–10 речень): «Чому Японія, маючи дуже мало ресурсів, стала однією з найрозвиненіших країн світу?» — використайте чинники «економічного дива» з параграфа."], "qz": [{"q": "Що називають японським «економічним дивом»?", "o": ["відкриття великих родовищ нафти", "дуже швидке зростання економіки в другій половині XX ст.", "перемогу у Другій світовій війні", "перехід до аграрної економіки"], "a": 1, "why": "Темпи зростання сягали близько 11 % на рік — найвищі у світі."}, {"q": "Що таке кейрецу?", "o": ["японські промислово-фінансові групи фірм", "система швидкісних залізниць", "тип рисових полів", "державна наукова програма"], "a": 0, "why": "До кейрецу входять 70 зі 100 найбільших промислових фірм Японії (за даними підручника)."}, {"q": "Яка галузь є лідером японської промисловості?", "o": ["текстильна", "харчова", "машинобудування", "видобування вугілля"], "a": 2, "why": "Машинобудування дає понад половину промислової продукції країни."}, {"q": "Яка подія 2011 р. вплинула на атомну енергетику Японії?", "o": ["закриття всіх ТЕС", "аварія на АЕС «Фукусіма»", "запуск першої АЕС", "відмова від імпорту нафти"], "a": 1, "why": "Після аварії внаслідок землетрусу й цунамі всі АЕС зупинили для перевірки."}, {"q": "Чому металургійні заводи Японії розміщені біля великих портів?", "o": ["там найбільші родовища руди", "там найдешевша земля", "там найменше землетрусів", "вони працюють на привізній сировині"], "a": 3, "why": "Руду й паливо завозять морем, тому заводи будують на узбережжі."}, {"q": "Яка головна сільськогосподарська культура Японії?", "o": ["рис", "пшениця", "кукурудза", "бавовник"], "a": 0, "why": "Рис — основний японський «хліб», займає майже половину оброблюваних земель."}, {"q": "Як називають острів Кюсю через велику кількість технопарків?", "o": ["«Острів вранішнього сонця»", "«Рисовий острів»", "«Кремнієвий острів»", "«Острів роботів»"], "a": 2, "why": "На Кюсю найбільше технополісів і технопарків країни."}, {"q": "Що таке «сінкансен»?", "o": ["японський робот", "мережа швидкісних залізниць", "тип судна", "банківська група"], "a": 1, "why": "Поїзди «сінкансен» розвивають швидкість до 300 км/год."}, {"q": "Від чого найбільше залежить економіка Японії у зовнішній торгівлі?", "o": ["від експорту нафти", "від імпорту автомобілів", "від експорту рису", "від імпорту сировини й палива"], "a": 3, "why": "Японія ввозить нафту, газ, вугілля, руди, бавовну та інші ресурси."}, {"q": "Яке японське підприємство відкрито у 2016 р. у Львівській області?", "o": ["«Фудзікура»", "«Тойота»", "«Соні»", "«Хонда»"], "a": 0, "why": "Завод «Фудзікура» виробляє електричне обладнання для автомобілів."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 2. Країни Азії", "sregion": "asia", "sk": "asia", "cid": "392", "cn": "Японія"}, {"n": "23", "p": "23", "t": "Китай: економіко-географічне положення, природні умови та ресурси, населення", "pages": "с. 129–131", "g": "Оцінити економіко-географічне положення, природно-ресурсний потенціал і особливості населення Китаю як найбільшої за кількістю жителів країни світу (за даними підручника).", "nums": [{"v": "≈ 1/5", "l": "частка площі Азії, яку займає Китай"}, {"v": "22,5 тис. км", "l": "довжина суходільного кордону — найбільша у світі"}, {"v": "≈ 1,4 млрд осіб", "l": "населення Китаю (за даними підручника)"}, {"v": "понад 60", "l": "міст-мільйонерів (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення", "p": ["Китай розташований на сході Азії й має найдовший у світі суходільний кордон — із 13 країнами. Проте більшість сусідів не мають високого рівня розвитку, а прикордонні райони віддалені від економічних центрів і незручні для прокладання доріг.", "Для оцінки ЕГП країну умовно поділяють на Східний (приморський) і Західний (континентальний) Китай. Схід має широкий вихід до незамерзаючих морів Тихого океану, а Захід значною мірою ізольований від активного господарського життя."], "ul": ["Сусіди: Росія, Монголія, Казахстан, Киргизстан, Таджикистан, Пакистан, Індія, Непал, Бутан, М’янма, Лаос, В’єтнам, Північна Корея.", "Моря: Жовте, Східнокитайське, Південнокитайське.", "Близькість Японії та вихід до океану сприяють торгівлі й кооперуванню зі США та Японією.", "Суходільні зв’язки з сусідами обмежені через гори, пустелі та віддаленість.", "Східні приморські райони — найвигідніші для розвитку господарства."]}, {"h": "Природні умови та ресурси", "p": ["Природа Китаю дуже різноманітна: на заході — високі нагір’я, гори й пустелі з посушливим кліматом, на сході — рівнини й долини великих річок із мусонним кліматом, сприятливі для землеробства.", "Китай — одна з найбільш забезпечених мінеральними ресурсами країн світу. Водночас відчувається дефіцит земельних ресурсів, адже придатних для обробітку земель мало, а населення величезне."], "ul": ["Захід: Тибетське нагір’я, гірські системи, пустелі — суворі умови, мало населення.", "Схід: Велика Китайська рівнина, долини річок Янцзи та Хуанхе — головні землеробські райони.", "Значні запаси вугілля, руд чорних і кольорових металів.", "Великі гідроенергетичні ресурси річок.", "Головна проблема — нестача орних земель у розрахунку на одного жителя."]}, {"h": "Демографічна політика і віковий склад", "p": ["Від 1949 р. населення Китаю зросло більш як утричі. Велика кількість людей дає трудові ресурси, але ускладнює підвищення якості життя, загострює житлову й продовольчу проблеми. Тому з 1979 р. уряд запровадив жорстку політику «одна родина — одна дитина».", "Природний приріст швидко знизився (до 5,3 ‰ — за даними підручника), чого не вдавалося досягти жодній країні. Наслідки — старіння населення та переважання чоловіків. З 2016 р. родинам дозволили мати двох дітей, а з 2021 р. — трьох."], "ul": ["Принцип політики: заохочення за одну дитину, покарання за другу й наступних.", "Природний приріст Китаю удвічі нижчий, ніж в Індії (за даними підручника).", "Зменшується частка дітей, зростає частка людей похилого віку.", "Середня тривалість життя — близько 75 років (за даними підручника).", "Чоловіки переважають над жінками в більшості вікових груп."]}, {"h": "Національний і релігійний склад", "p": ["Близько 92 % населення становлять ханьці — етнічні китайці. Крім них, у країні живе понад 50 етнічних груп: чжуані, уйгури, монголи, тибетці, хуей, мяо та інші.", "Традиційні вірування поєднувалися з філософськими вченнями, тож найпоширенішими стали конфуціанство, даосизм і буддизм. Понад половина населення не має сталих релігійних переконань."], "ul": ["Ханьці — понад 9/10 населення.", "Нацменшини — близько 110 млн осіб (за даними підручника).", "Поширені конфуціанство, даосизм, буддизм.", "Є мусульмани (переважно на заході), протестанти й католики.", "Значна частина населення нерелігійна."]}, {"h": "Розміщення населення та урбанізація", "p": ["Середня густота населення відносно висока, але розміщення вкрай нерівномірне: понад 80 % китайців живуть у Східному Китаї. На Великій Китайській рівнині густота сягає 1000 осіб/км², а в Тибеті — менше 5 осіб/км².", "Швидка індустріалізація спричинила «міський вибух»: за 25 років рівень урбанізації подвоївся і наблизився до 58 % (за даними підручника). Китай має найбільше у світі міських жителів і міст-мільйонерів."], "ul": ["Середня густота — 143 особи/км² (за даними підручника).", "Понад 4/5 населення — на сході країни.", "Найбільші агломерації: Шанхай, Пекін, Гуанчжоу, Тяньцзінь.", "Усі великі міста є ядрами агломерацій.", "Причина «міського вибуху» — стрімкий розвиток промисловості."]}, {"h": "Трудові ресурси", "p": ["Китай має найчисленніші у світі трудові ресурси — понад 800 млн осіб (за даними підручника). Частка зайнятих у сільському господарстві зменшується, а в промисловості й сфері послуг — зростає.", "Попри економічні успіхи, частина населення ще живе за межею бідності, а деякі люди залишаються неписьменними."], "ul": ["Сільське господарство — 28 % зайнятих (за даними підручника).", "Промисловість — 29 %.", "Сфера послуг — 43 %.", "Близько 6 % населення — за межею бідності (за даними підручника).", "Дешева й працелюбна робоча сила — важлива перевага країни."]}], "terms": [["Економіко-географічне положення (ЕГП)", "розміщення країни щодо важливих для її господарства об’єктів: сусідніх держав, морів, транспортних шляхів, ринків, ресурсів."], ["Демографічна політика", "система заходів держави, спрямованих на регулювання народжуваності та зміну кількості населення."], ["Політика «одна родина — одна дитина»", "демографічна політика Китаю (з 1979 р.), що заохочувала родини з однією дитиною і карала за народження наступних дітей."], ["Ханьці", "етнічні китайці — основний народ Китаю, близько 92 % його населення."], ["Урбанізація", "процес зростання ролі міст, збільшення частки міського населення та поширення міського способу життя."], ["«Міський вибух»", "дуже швидке зростання кількості й частки міських жителів за короткий час."], ["Міська агломерація", "скупчення міст і селищ навколо великого міста-ядра, тісно пов’язаних виробничими, транспортними й культурними зв’язками."]], "f": "Китай має найдовший у світі суходільний кордон — 22,5 тис. км, і межує з 13 країнами (за даними підручника).", "pr": ["Порівняйте ЕГП Китаю та Японії: складіть таблицю «Переваги / Недоліки» для кожної країни і зробіть висновок, яка країна розташована вигідніше.", "Позначте на контурній карті або онлайн-карті найбільші міста й агломерації Китаю (Пекін, Шанхай, Тяньцзінь, Гуанчжоу) та лінію, що умовно поділяє Східний і Західний Китай; поясніть, чому населення зосереджене на сході."], "qz": [{"q": "Скільки країн межують із Китаєм на суходолі (за даними підручника)?", "o": ["9", "11", "13", "15"], "a": 2, "why": "Китай має суходільні кордони з 13 державами."}, {"q": "До якого океану має вихід Китай?", "o": ["Тихого", "Індійського", "Атлантичного", "Північного Льодовитого"], "a": 0, "why": "Східний Китай омивають моря Тихого океану: Жовте, Східнокитайське і Південнокитайське."}, {"q": "Яка частина Китаю має найвигідніше ЕГП?", "o": ["Тибет", "Західний континентальний Китай", "Східний приморський Китай", "Північно-західні пустелі"], "a": 2, "why": "Схід має вихід до незамерзаючих морів і близький до Японії та торговельних шляхів."}, {"q": "Якою була суть демографічної політики Китаю з 1979 р.?", "o": ["Заохочення багатодітності", "«Одна родина — одна дитина»", "Заборона внутрішньої міграції", "Масове переселення на захід"], "a": 1, "why": "Уряд заохочував родини з однією дитиною й карав за народження наступних."}, {"q": "Який наслідок мала політика обмеження народжуваності в Китаї?", "o": ["Омолодження населення", "Різке зростання частки дітей", "Переважання жінок у всіх вікових групах", "Старіння населення"], "a": 3, "why": "Частка дітей зменшується, а частка людей похилого віку зростає."}, {"q": "Який народ становить близько 92 % населення Китаю?", "o": ["Ханьці", "Уйгури", "Тибетці", "Чжуані"], "a": 0, "why": "Ханьці — етнічні китайці, основний народ країни."}, {"q": "Де живе понад 80 % населення Китаю?", "o": ["У Тибеті", "У Західному Китаї", "У Східному Китаї", "У пустелях північного заходу"], "a": 2, "why": "Схід має рівнини, сприятливий клімат і вигідне положення."}, {"q": "Чим спричинений «міський вибух» у Китаї?", "o": ["Стрімким промисловим розвитком", "Зростанням частки сільського господарства", "Політикою переселення в Тибет", "Стихійними лихами в містах"], "a": 0, "why": "Індустріалізація притягнула мільйони людей до міст."}, {"q": "Якого ресурсу Китаю відчутно бракує?", "o": ["Вугілля", "Земельних ресурсів", "Трудових ресурсів", "Гідроенергетичних ресурсів"], "a": 1, "why": "Обробітних земель на одного жителя в Китаї мало."}, {"q": "У якій галузі в Китаї зайнята найбільша частка працівників (за даними підручника)?", "o": ["Сільське господарство", "Промисловість", "Сфера послуг", "Видобування корисних копалин"], "a": 2, "why": "У сфері послуг зайнято 43 % працівників."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 2. Країни Азії", "sregion": "asia", "sk": "asia", "cid": "156", "cn": "Китай"}, {"n": "24", "p": "24", "t": "Китай: господарство", "pages": "с. 132–138", "g": "З’ясувати причини економічного стрибка Китаю, його міжнародну спеціалізацію в промисловості, сільському господарстві й сфері послуг та зв’язки з Україною.", "nums": [{"v": "8–10 %", "l": "середньорічні темпи зростання економіки протягом останніх десятиліть (за даними підручника)"}, {"v": "≈ 1/4", "l": "частка Китаю у світовому виробництві електроенергії (за даними підручника)"}, {"v": "понад 800 млн т", "l": "виробництво сталі — більше половини світового (за даними підручника)"}, {"v": "понад 22 тис. км", "l": "високошвидкісних залізниць — перше місце у світі (за даними підручника)"}], "blocks": [{"h": "Шлях від аграрної країни до світового лідера", "p": ["У середині XX ст. Китай був аграрною країною, а експерименти кінця 1950-х рр. призвели до голоду й загибелі мільйонів людей. У 1978 р. проголосили курс «Реформи і відкритість»: керівна роль Комуністичної партії поєднувалася з ринковим господарюванням.", "Результатом стало стрімке зростання економіки. Китай подвоїв дохід на одну особу лише за 9 років (США та Англії на це знадобилося 50 років), у 2010 р. випередив США за виробництвом обробної промисловості, а в 2013 р. — за обсягом ВВП (за ПКС)."], "ul": ["Пріоритет на старті реформ — легка й харчова промисловість.", "Активне залучення іноземних інвестицій.", "Передача землі в користування індивідуальним господарствам.", "Широкі повноваження місцевої влади в господарюванні.", "Політична, соціальна й фінансова стабільність.", "Працелюбність і старанність населення."]}, {"h": "Спеціальні економічні зони та відкритість", "p": ["Важливу роль відіграли спеціальні економічні зони (СЕЗ) на узбережжі: пільгові податковий, валютний і митний режими привабили іноземні інвестиції та сучасні технології. Політика «відкритих дверей» сприяла появі сотень тисяч підприємств з іноземним капіталом.", "Держава й надалі контролює основні галузі та банки. Китай прагне перейти від моделі «зроблено в Китаї» до моделі «винайдено в Китаї», зменшуючи залежність від закордонних технологій."], "ul": ["4 СЕЗ і 14 відкритих приморських районів (за даними підручника).", "Найбільші відкриті міста — Шанхай, Тяньцзінь, Гуанчжоу.", "Близько 500 тис. підприємств з іноземним капіталом (за даними підручника).", "Понад 1700 іноземних науково-дослідних центрів.", "Китайські ТНК — друге місце в рейтингу Global 500 після США (2016 р., за даними підручника)."]}, {"h": "Промисловість", "p": ["Китай лідирує у світі за виробництвом понад 100 видів промислової продукції, а частка промисловості у ВВП значно вища, ніж у розвинених країнах. Поряд працюють сучасні гіганти й дрібні кустарні підприємства; більшість промислових центрів — на сході.", "Країна — перша у світі за виробництвом електроенергії (переважно на вугільних ТЕС) і водночас лідер у розвитку вітрової та сонячної енергетики. Китай виробляє понад половину світової сталі, багато кольорових металів, автомобілів, електроніки."], "ul": ["Енергетика: ТЕС на вугіллі, ГЕС «Санься» на Янцзи — найпотужніша у світі, атомні електростанції.", "Чорна металургія: Аньшан, Далян, Фушунь, Тяньцзінь, Таншань, Шанхай.", "Автомобілебудування: світова першість із 2009 р.", "Електроніка: майже половина світових телевізорів і 71 % мобільних телефонів (за даними підручника).", "Космічна галузь: 4 космодроми, навігаційна система «Бейдоу».", "Центри машинобудування: Шанхай, Пекін, Сянган, Ціндао, Ухань, Шеньян, Нанкін.", "Легка (тканини, одяг, взуття) і харчова промисловість."]}, {"h": "Сільське господарство", "p": ["Головне досягнення аграрного сектору — продовольча незалежність: Китай повністю забезпечує себе продовольством і експортує багато його видів. Провідна галузь — рослинництво, основа якого — зернові, передусім рис.", "У мусонних східних і приморських провінціях збирають два-три врожаї рису на рік. Китай перший у світі за поголів’ям більшості видів худоби й птиці та за виловом риби й морепродуктів."], "ul": ["Рис — головна культура; також пшениця, кукурудза, просо, ячмінь, картопля.", "Технічні культури: бавовник, тютюн, арахіс, соя, чай.", "Тваринництво: найбільше — свині, дрібна й велика рогата худоба.", "Птахівництво в приміських районах.", "Шовківництво на півдні й південному сході.", "Аквакультура: вирощування риби, креветок, молюсків і водоростей."]}, {"h": "Сфера послуг", "p": ["Частка третинного сектору в Китаї менша, ніж у Японії, але він зростає найшвидше: у 2016 р. уперше перевищив половину ВВП. Швидко розвиваються фінанси, наука, телекомунікації, ІТ та туризм.", "Китай має кілька потужних фінансових центрів і найрозвиненішу у світі мережу високошвидкісних залізниць. Шість із десяти найбільших морських портів світу — китайські (за даними підручника)."], "ul": ["Пекін — штаб-квартири найбільших банків і компаній.", "Шанхай — головний економічний центр, найбільша фондова біржа країни.", "Гонконг (Сянган) — один із найбільших світових фінансових центрів.", "Порти: Шанхай, Гуанчжоу, Ціндао, Тяньцзінь, Нінгбо, Далян.", "Наукові парки й технополіси; пріоритети — нові матеріали, енергетика, космос.", "Туризм: друге місце у світі за доходами (за даними підручника)."]}, {"h": "Зовнішні зв’язки. Китай і Україна", "p": ["Зросла частка високотехнологічних товарів в експорті (до 40 %). Китай став активним експортером капіталу: купує іноземні компанії, цінні папери, землі; близько 1 млн китайців працюють за кордоном. Головні торговельні партнери — країни Східної Азії та США.", "Для України Китай — один із найважливіших торговельних партнерів (друге місце за товарообігом, за даними підручника). Після повномасштабного вторгнення Росії в Україну 2022 р. логістика українського експорту суттєво ускладнилася, що вплинуло й на торгівлю з Китаєм."], "ul": ["Експорт Китаю: електроніка, обладнання, побутова техніка, мікросхеми, одяг, меблі, текстиль.", "Імпорт: електроніка, нафта, обладнання, руди металів.", "Український експорт до Китаю: руди металів, зерно, олія.", "Імпорт з Китаю: одяг, взуття, текстиль, електроніка, побутова техніка.", "Співпраця в науці, телекомунікаціях, авіації."]}], "terms": [["«Реформи і відкритість»", "економічний курс Китаю з 1978 р., що поєднав керівну роль держави й Комуністичної партії з ринковим господарюванням і відкриттям для іноземного капіталу."], ["Спеціальна економічна зона (СЕЗ)", "територія з пільговими податковим, валютним і митним режимами для залучення інвестицій і технологій."], ["Політика «відкритих дверей»", "курс на широку співпрацю з іншими країнами, залучення іноземного капіталу й технологій."], ["Транснаціональна корпорація (ТНК)", "велика компанія, що має виробничі та збутові підрозділи в багатьох країнах."], ["Продовольча незалежність", "здатність країни повністю забезпечувати населення продовольством власного виробництва."], ["Експорт капіталу", "вкладення коштів країни за кордоном: купівля компаній, цінних паперів, землі, будівництво підприємств."], ["Аквакультура", "штучне вирощування риби, молюсків, креветок і водоростей у водоймах і прибережних зонах."]], "f": "Поблизу міста Датун у Китаї збудовано сонячну електростанцію у формі панди, при якій працює навчальний центр для школярів (за даними підручника).", "pr": ["Складіть таблицю «Промисловий сектор — найбільші центри — чинники розміщення» для енергетики, чорної металургії, машинобудування, легкої та харчової промисловості Китаю.", "Визначте 5–7 речей у вашому домі, виготовлених у Китаї, та напишіть коротке есе (8–10 речень): чи можна замінити їх товарами українського виробництва і чому."], "qz": [{"q": "У якому році в Китаї проголосили курс «Реформи і відкритість»?", "o": ["1949", "1966", "1978", "1991"], "a": 2, "why": "Новий економічний курс оголосили в 1978 р."}, {"q": "Що таке СЕЗ?", "o": ["Заповідна зона", "Територія з пільговими податковим, валютним і митним режимами", "Військовий округ", "Зона вирощування рису"], "a": 1, "why": "СЕЗ створювали для залучення інвестицій і технологій."}, {"q": "Де розташована найпотужніша у світі ГЕС «Санься»?", "o": ["На Хуанхе", "На Меконгу", "На Амурі", "На Янцзи"], "a": 3, "why": "ГЕС «Санься» збудована на річці Янцзи."}, {"q": "Яка частка світового виробництва сталі припадає на Китай (за даними підручника)?", "o": ["Близько 10 %", "Близько чверті", "Більше половини", "Майже вся"], "a": 2, "why": "Китай виробляє понад 800 млн т сталі — більше половини світового обсягу."}, {"q": "Який тип електростанцій виробляє основну частину електроенергії Китаю?", "o": ["ТЕС на вугіллі", "АЕС", "ГЕС", "Сонячні"], "a": 0, "why": "Близько 2/3 електроенергії дають теплові станції на вугіллі."}, {"q": "Яка культура є головною в землеробстві Китаю?", "o": ["Пшениця", "Рис", "Кукурудза", "Соя"], "a": 1, "why": "Основа рослинництва — рис, у мусонних районах збирають 2–3 врожаї."}, {"q": "Яке місто є головним економічним центром Китаю з найбільшою фондовою біржею?", "o": ["Пекін", "Ухань", "Шанхай", "Нанкін"], "a": 2, "why": "Шанхай — головний економічний, торговельний і фінансовий центр."}, {"q": "Як називається власна навігаційна система Китаю?", "o": ["GPS", "Galileo", "ГЛОНАСС", "«Бейдоу»"], "a": 3, "why": "Китай створив систему супутникової навігації «Бейдоу»."}, {"q": "Що переважає в українському експорті до Китаю (за даними підручника)?", "o": ["Руди металів, зерно, олія", "Автомобілі та літаки", "Електроніка", "Одяг і взуття"], "a": 0, "why": "Україна постачає до Китаю переважно сировину й агропродукцію."}, {"q": "Яку модель розвитку прагне запровадити Китай замість «зроблено в Китаї»?", "o": ["«Куплено в Китаї»", "«Винайдено в Китаї»", "«Вирощено в Китаї»", "«Зібрано в Китаї»"], "a": 1, "why": "Країна хоче розвивати власні новітні технології."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 2. Країни Азії", "sregion": "asia", "sk": "asia", "cid": "156", "cn": "Китай"}, {"n": "25", "p": "25", "t": "Індія: економіко-географічне положення, природні умови та ресурси, населення", "pages": "с. 139–142", "g": "Оцінити ЕГП, природні ресурси та особливості населення Індії і порівняти її демографічну ситуацію з китайською.", "nums": [{"v": "13,9 тис. км", "l": "довжина суходільних кордонів (морських — 7 тис. км; за даними підручника)"}, {"v": "понад 300", "l": "народів і народностей"}, {"v": "33,5 %", "l": "рівень урбанізації (за даними підручника)"}, {"v": "514 млн осіб", "l": "економічно активне населення (за даними підручника)"}], "blocks": [{"h": "Економіко-географічне положення", "p": ["Індія розташована в Південній Азії на півострові Індостан, відгородженому від решти Азії Гімалаями. До її складу входять також Лаккадівські, Андаманські та Нікобарські острови.", "Сухопутні кордони вдвічі довші за морські, але проходять важкодоступними горами й мало важать для економіки. Натомість Індія лежить на перехресті морських і повітряних шляхів між Азією, Європою, Африкою та Австралією."], "ul": ["Сусіди: Афганістан, Китай, Непал, Бутан (північ), Бангладеш, М’янма (схід), Пакистан (захід).", "Омивається водами Індійського океану: Аравійське море, Бенгальська затока.", "Берегова лінія слабо порізана — мало зручних бухт для портів.", "Гірські кордони обмежують суходільні зв’язки.", "Положення на морських шляхах сприяє зовнішній торгівлі."]}, {"h": "Природні умови та ресурси", "p": ["Індія — одна з найбагатших на природні ресурси країн світу; не випадково в колоніальну добу її називали «перлиною Британської корони». Вирішальне значення мають мінеральні та агрокліматичні ресурси.", "Тепле мусонне підсоння, родючі ґрунти Індо-Гангської низовини та великі річки дозволяють вирощувати різноманітні тропічні й субтропічні культури."], "ul": ["Гімалаї на півночі — природний бар’єр і джерело річок.", "Індо-Гангська низовина — головний землеробський район.", "Плоскогір’я Декан на півострові.", "Мусонний клімат із сезоном дощів.", "Значні мінеральні ресурси — основа важкої промисловості."]}, {"h": "Відтворення та віковий склад населення", "p": ["За кількістю населення Індія поступалася лише Китаю, але мала вищі темпи зростання. За оцінками ООН, у 2023 р. Індія стала найнаселенішою країною світу. Програма планування сім’ї (із середини XX ст.) знизила природний приріст майже вдвічі, однак за абсолютним приростом Індія — світовий лідер.", "Населення молоде: понад чверть жителів — діти до 15 років, і лише 6 % старші за 65 років. Чоловіки чисельно переважають жінок."], "ul": ["Природний приріст — 12 ‰ (2017 р., за даними підручника).", "Щороку населення зростає більш як на 15 млн осіб (за даними підручника).", "Середній вік — 28 років.", "Середня тривалість життя — 68,5 року (за даними підручника).", "Проблеми: брак робочих місць і продовольства."]}, {"h": "Етнічний, мовний і релігійний склад", "p": ["Індія — найбагатонаціональніша країна світу: тут живе понад 300 народів, найбільші — хіндустанці, біхарці, бенгальці, маратхі, телугу, таміли. Державна мова — хінді, офіційний статус мають ще кілька мов, а англійська слугує мовою міжнаціонального спілкування.", "Головна релігія — індуїзм (майже 80 % населення), з ним пов’язані пережитки кастового устрою. Строкатий етнічний і релігійний склад іноді спричиняє конфлікти та сепаратистські настрої."], "ul": ["Понад 20 мов і близько 700 діалектів.", "Державна мова — хінді; англійська широко вживається.", "Індуїзм — близько 80 %, іслам — 14 % (за даними підручника).", "Також християнство, сикхізм, джайнізм, буддизм.", "Конституція 1950 р. проголосила рівність каст, але пережитки збереглися, особливо в селах."]}, {"h": "Розміщення населення та урбанізація", "p": ["Густота населення дуже висока — понад 400 осіб/км², але розподіл нерівномірний: найгустіше заселені схід Індо-Гангської низовини, дельта Гангу та узбережжя, найменш — пустелі й гори.", "На відміну від Японії та Китаю, в Індії переважає сільське населення. Проте через величезну загальну кількість жителів міське населення дуже велике, і сформувалися гігантські агломерації."], "ul": ["Близько 50 міст-мільйонерів і агломерацій (за даними підручника).", "Делі — найбільша агломерація країни.", "Мумбаї, Колката, Бангалор, Ченнаї — інші гіганти.", "У великих містах — величезні квартали нетрів (наприклад, Дхараві в Мумбаї).", "За кількістю містян Індія поступалася лише Китаю."]}, {"h": "Трудові ресурси та соціальні проблеми", "p": ["Індія має колосальний трудовий потенціал. Зростає частка зайнятих у промисловості й послугах. Країна готує мільйони англомовних технічних фахівців, а невисока оплата праці робить її ідеальним місцем для інтелектуального аутсорсингу.", "Водночас лишаються гострі проблеми: неписьменність значної частини дорослих (особливо жінок), сильне соціальне розшарування, бідність."], "ul": ["Зайнятість: послуги — 50 %, промисловість — 28 %, сільське господарство — 22 % (за даними підручника).", "380 університетів, понад 2,5 млн випускників-технарів щороку.", "Індійська діаспора приносить інвестиції, ідеї та технології.", "Аутсорсинг: ІТ-послуги, фінансовий і бухгалтерський облік.", "Понад 29 % дорослих неписьменні (за даними підручника)."]}], "terms": [["Півострів Індостан", "великий півострів у Південній Азії, на якому розташована основна частина Індії."], ["Програма планування сім’ї", "державна політика Індії, спрямована на добровільне зниження народжуваності."], ["Абсолютний приріст населення", "кількість осіб, на яку зросло населення за певний період."], ["Каста", "замкнена спадкова група людей у традиційному індійському суспільстві, що визначала заняття й соціальний статус."], ["Індуїзм", "головна релігія Індії, яку сповідує майже 80 % населення."], ["Аутсорсинг", "передача компанією частини робіт (ІТ, бухгалтерії тощо) іншій фірмі, часто в іншій країні."], ["Нетрі", "бідні, перенаселені квартали великих міст із поганими житловими умовами."], ["Діаспора", "частина народу, що живе за межами своєї батьківщини."]], "f": "Дхараві в Мумбаї — найбільші нетрі Індії, де живе близько 1 млн осіб; тут знімали фільм «Мільйонер із нетрів» (за даними підручника).", "pr": ["Практична робота 4: порівняйте статево-вікові піраміди Японії, Китаю та Індії (атлас або онлайн-ресурси) і складіть таблицю: частка дітей, частка людей похилого віку, середній вік, висновок про трудовий потенціал.", "Позначте на онлайн-карті найбільші агломерації Індії (Делі, Мумбаї, Колката, Бангалор, Ченнаї) і поясніть, чому вони розташовані саме там (рельєф, узбережжя, річки)."], "qz": [{"q": "На якому півострові розташована Індія?", "o": ["Аравійському", "Індокитаї", "Індостані", "Малакці"], "a": 2, "why": "Основна частина Індії — на півострові Індостан."}, {"q": "Чому суходільні кордони мало важать для економіки Індії?", "o": ["Вони дуже короткі", "Проходять важкодоступними горами", "Закриті через війни", "Пролягають морем"], "a": 1, "why": "Кордони переважно проходять гірськими районами."}, {"q": "Як називали Індію в колоніальну добу?", "o": ["«Перлиною Британської корони»", "«Країною висхідного сонця»", "«Піднебесною»", "«Сонячним континентом»"], "a": 0, "why": "Через природні багатства її називали «перлиною Британської корони»."}, {"q": "Яка релігія є головною в Індії?", "o": ["Буддизм", "Іслам", "Християнство", "Індуїзм"], "a": 3, "why": "Індуїзм сповідує майже 80 % населення."}, {"q": "Яка мова є державною в Індії?", "o": ["Бенгальська", "Хінді", "Тамільська", "Урду"], "a": 1, "why": "Державна мова — хінді, англійська використовується для міжнаціонального спілкування."}, {"q": "Яка особливість відрізняє населення Індії від населення Китаю?", "o": ["Населення Індії молодше", "В Індії вищий рівень урбанізації", "В Індії нижча густота населення", "В Індії менше народів"], "a": 0, "why": "Середній вік індійців 28 років, а частка дітей велика."}, {"q": "Яке населення переважає в Індії?", "o": ["Міське", "Сільське", "Кочове", "Іммігрантське"], "a": 1, "why": "Рівень урбанізації лише 33,5 % (за даними підручника)."}, {"q": "Яка агломерація Індії найбільша (за даними підручника)?", "o": ["Мумбаї", "Колката", "Ченнаї", "Делі"], "a": 3, "why": "Делі — 26,5 млн осіб (за даними підручника)."}, {"q": "Що робить Індію привабливою для інтелектуального аутсорсингу?", "o": ["Висока оплата праці", "Холодний клімат", "Освіченість і знання англійської при невисокій оплаті праці", "Відсутність університетів"], "a": 2, "why": "Англомовні фахівці з помірною зарплатою приваблюють іноземні компанії."}, {"q": "Що спричиняють строкатий етнічний і релігійний склад населення Індії?", "o": ["Повну відсутність конфліктів", "Міжнаціональні суперечності й сепаратистські настрої", "Падіння народжуваності до нуля", "Зникнення мов"], "a": 1, "why": "Розмаїття іноді спричиняє конфлікти й сепаратизм."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 2. Країни Азії", "sregion": "asia", "sk": "asia", "cid": "356", "cn": "Індія"}, {"n": "26", "p": "26", "t": "Індія: господарство", "pages": "с. 143–148", "g": "З’ясувати чинники економічних успіхів Індії, її міжнародну спеціалізацію в промисловості, сільському господарстві й сфері послуг та зв’язки з Україною.", "nums": [{"v": "3-тє місце", "l": "у світі за ВВП (за ПКС) у 2017 р. після Китаю та США (за даними підручника)"}, {"v": "≈ 70 %", "l": "електроенергії виробляють ТЕС (за даними підручника)"}, {"v": "18,5 %", "l": "частка Індії у світовому виробництві програмного забезпечення (за даними підручника)"}, {"v": "понад 80 %", "l": "частка рослинництва у вартості сільгосппродукції"}], "blocks": [{"h": "Особливості економічного розвитку", "p": ["Індія — регіональний лідер Південної Азії й одна з найбільших економік світу; через швидке зростання її іноді відносять до нових індустріальних країн. Країна самостійно запускає супутники, має ядерну зброю і входить до лідерів з виробництва програмного забезпечення.", "Водночас через величезну кількість населення ВВП на одну особу невисокий, а значна частина жителів має низький рівень життя. У структурі ВВП зростає частка сфери послуг, а частка сільського господарства зменшується."], "ul": ["Чинник 1: багатий і різноманітний природно-ресурсний потенціал.", "Чинник 2: велика кількість молодих працівників і зростання їхньої кваліфікації.", "Чинник 3: реформи, спрямовані на індустріалізацію та продовольчу самостійність.", "Чинник 4: розвиток науково-технічної інфраструктури.", "Зростає роль індійських ТНК."]}, {"h": "Територіальна структура господарства", "p": ["Господарство Індії спирається на чотири найбільші економічні центри, які з’єднані головними транспортними магістралями — «осями» економічного розвитку країни."], "ul": ["Мумбаї — на заході.", "Колката — на сході.", "Бангалор і Ченнаї — на півдні.", "Столичний регіон Делі — на північному заході.", "Магістралі між центрами — головні осі розвитку."]}, {"h": "Промисловість", "p": ["Основа енергетики — вугілля; більшість електроенергії дають ТЕС, частка ГЕС не відповідає гідропотенціалу, працюють кілька АЕС і швидко зростає відновлювана енергетика. Проте понад 200 млн людей досі не мають доступу до електрики (за даними підручника).", "Індія — одна з лідерок за виробництвом сталі; металургія зосереджена на північному сході («Індійський Рур» із центром у Колкаті). Динамічно розвиваються машинобудування, хімія та біотехнології, зберігають значення традиційні галузі."], "ul": ["Чорна металургія: штати Біхар і Західна Бенгалія — «Індійський Рур».", "Кольорова металургія: боксити й алюміній, мідь, цинк, свинець.", "Хімія: добрива, штучні волокна, фармацевтика, біотехнології (Гуджарат, Махараштра).", "Машинобудування: верстати, локомотиви, автомобілі («Тата Моторс», «Маруті Сузукі»), літаки.", "Ювелірна промисловість: перше місце у світі з обробки алмазів.", "Легка промисловість: текстиль (бавовняні, вовняні, шовкові тканини).", "Харчова: рисоочисна, борошномельна, чайна, цукрова; першість у виробництві спецій."]}, {"h": "Сільське господарство", "p": ["Головна галузь — рослинництво. Більшість оброблюваних земель зайнята зерновими, передусім рисом (північний схід, узбережжя, дельти річок) і пшеницею (північний захід). Індія — світовий лідер з виробництва чаю.", "Індія перша у світі за поголів’ям великої рогатої худоби, але тваринництво відіграє невелику роль: корів і буйволів використовують як робочу силу, а більшість індійців — вегетаріанці, адже в індуїзмі корова священна."], "ul": ["Зернові: рис, пшениця, просо, кукурудза, ячмінь, сорго.", "Технічні культури: чай, цукрова тростина, бавовник, джут.", "Чай вирощують на північному сході та півдні.", "Також боби, картопля, овочі, фрукти, спеції.", "Худоба — переважно робоча (оранка, перевезення, зрошення)."]}, {"h": "Сфера послуг", "p": ["Індія — найбільший у світі постачальник ІТ-послуг. Бангалор називають «Кремнієвою долиною» Індії: тут розташовані технопарки й представництва численних ІТ-компаній. Реформи 1990-х рр. зробили банківський сектор конкурентнішим.", "Індійська кіноіндустрія — найбільша у світі (Болівуд у Мумбаї). Перспективний напрям — туризм, якому сприяє розвинена транспортна система, передусім залізниці."], "ul": ["ІТ-послуги — головна нова спеціалізація у світовій економіці.", "Болівуд: кіно — і розвага, і джерело інформації.", "Туризм: екскурсійний, пляжний, паломницький, екологічний.", "Залізниці — основа внутрішніх перевезень (п’ятірка світових лідерів за довжиною).", "Великі аеропорти: Делі, Колката, Мумбаї.", "Морські порти: Мумбаї, Колката, Кочин, Ченнаї."]}, {"h": "Зовнішні зв’язки. Індія і Україна", "p": ["В експорті Індії зростає частка готових виробів і зменшується частка сировини. Країна постачає програмне забезпечення майже в 100 країн світу, найбільше — до США.", "Індія — партнер України в торгівлі, науці та оборонній сфері. В Україні навчаються тисячі індійських студентів, переважно медиків. Після повномасштабного вторгнення Росії 2022 р. більшість іноземних студентів були змушені виїхати, а торговельні зв’язки ускладнилися."], "ul": ["Експорт Індії: коштовне каміння, фармацевтика, одяг, хімікати, машини, електроніка, програмне забезпечення.", "Імпорт Індії: нафта, необроблене коштовне каміння, машини, хімікати, метали.", "Партнери: США, Китай, ОАЕ, Саудівська Аравія, Швейцарія, Німеччина.", "Україна імпортує з Індії ліки, агро- та харчову продукцію.", "Україна експортує до Індії чорні метали, машини, хімічну продукцію.", "Перспективи: космос, ІТ, оборонна сфера."]}], "terms": [["Нова індустріальна країна", "країна, що розвивається, яка за короткий час досягла значних успіхів в індустріалізації та економічному зростанні."], ["«Індійський Рур»", "металургійний район на північному сході Індії (штати Біхар і Західна Бенгалія) із центром у Колкаті."], ["Біотехнології", "використання живих організмів і біологічних процесів у виробництві, зокрема у фармацевтиці та сільському господарстві."], ["«Кремнієва долина» Індії", "назва міста Бангалор — одного з найбільших світових центрів ІТ-індустрії."], ["Болівуд", "центр індійської кіноіндустрії в Мумбаї — найбільшої у світі за кількістю фільмів."], ["Джут", "технічна культура, з волокна якої виготовляють мішковину, канати, пакувальні матеріали."]], "f": "Індійський автомобіль «Тата Нано» створено для вузьких міських вуличок; в Індії він коштував близько 100 тис. рупій (за даними підручника).", "pr": ["Складіть порівняльну таблицю «Господарство Китаю та Індії» за рядками: структура ВВП, провідні галузі промисловості, головні сільгоспкультури, найважливіші послуги, експорт. Зробіть висновок про відмінності.", "Позначте на онлайн-карті чотири головні економічні центри Індії (Мумбаї, Колката, Бангалор–Ченнаї, Делі) і підпишіть їхню спеціалізацію (металургія, ІТ, кіно, хімія, порти)."], "qz": [{"q": "Яке паливо має головне значення в енергетиці Індії?", "o": ["Природний газ", "Уран", "Вугілля", "Нафта"], "a": 2, "why": "Більшість ТЕС Індії працює на кам’яному вугіллі."}, {"q": "Як називають металургійний район на північному сході Індії?", "o": ["«Індійський Рур»", "«Індійська Кремнієва долина»", "«Перлина корони»", "«Індійський Детройт»"], "a": 0, "why": "Район у Біхарі та Західній Бенгалії з центром у Колкаті має назву «Індійський Рур»."}, {"q": "Яке місто називають «Кремнієвою долиною» Індії?", "o": ["Мумбаї", "Делі", "Колкату", "Бангалор"], "a": 3, "why": "Бангалор — один із найбільших світових центрів ІТ-індустрії."}, {"q": "За виробництвом якої культури Індія — світовий лідер?", "o": ["Кави", "Чаю", "Какао", "Соняшнику"], "a": 1, "why": "Індія — світовий лідер з виробництва чаю."}, {"q": "Чому тваринництво в Індії відіграє невелику роль, попри найбільше поголів’я ВРХ?", "o": ["Через холодний клімат", "Через брак пасовищ", "Худоба переважно робоча, а більшість індійців — вегетаріанці", "Худобу експортують"], "a": 2, "why": "Корова священна в індуїзмі, м’яса споживають мало."}, {"q": "Де розташований центр індійської кіноіндустрії Болівуд?", "o": ["У Мумбаї", "У Делі", "У Ченнаї", "У Колкаті"], "a": 0, "why": "Болівуд — кіностудії мегаполіса Мумбаї."}, {"q": "У якій галузі Індія посідає перше місце у світі (за даними підручника)?", "o": ["Видобування нафти", "Суднобудування", "Обробка алмазів", "Виробництво літаків"], "a": 2, "why": "Індія — лідер за обсягами оброблених алмазів."}, {"q": "Який вид транспорту відіграє головну роль у внутрішніх перевезеннях Індії?", "o": ["Річковий", "Залізничний", "Трубопровідний", "Повітряний"], "a": 1, "why": "Індія входить до п’ятірки світових лідерів за довжиною залізниць."}, {"q": "Що Україна переважно експортує до Індії (за даними підручника)?", "o": ["Чай і спеції", "Програмне забезпечення", "Фармацевтичні препарати", "Чорні метали та вироби з них"], "a": 3, "why": "Близько половини українського експорту до Індії становлять чорні метали."}, {"q": "Які культури переважають на орних землях Індії?", "o": ["Рис і пшениця", "Кукурудза і соя", "Бавовник і джут", "Картопля і овочі"], "a": 0, "why": "Найбільші площі ріллі зайняті рисом і пшеницею."}], "section": "Розділ IІ. АЗІЯ", "topic": "Тема 2. Країни Азії", "sregion": "asia", "sk": "asia", "cid": "356", "cn": "Індія"}, {"n": "27", "p": "27", "t": "Австралія: економіко-географічне положення, природні умови та ресурси, населення", "pages": "с. 149–151", "g": "Оцінити ЕГП і природно-ресурсний потенціал Австралії, з’ясувати особливості її населення, міграційної політи
