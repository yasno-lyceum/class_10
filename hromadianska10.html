// 40 Медіа і демократія (§32)
{info:`<p><b>Свобода слова</b> — право людини вільно висловлювати свої думки усно й письмово; одна з найважливіших громадянських свобод і принцип демократії. <b>Свобода преси</b> — право вільно викладати погляди через медіа. Свобода слова входить до <b>свободи інформації</b>: право вільно збирати, зберігати, використовувати й поширювати інформацію.</p>
<p><b>Документи:</b> ст. 19 Загальної декларації прав людини (свобода переконань і поширення інформації незалежно від кордонів); <b>ст. 34 Конституції України</b> (право на свободу думки і слова).</p>
<p><b>Умови свободи преси (В. Гаґеманн):</b> безпристрасна всебічна інформація; незалежне коментування; відповідальність; незалежність журналістів; вивільнення від урядових інтересів; повага видавців до свободи журналістів.</p>
<p>Свобода слова передбачає <b>відповідальність</b>: донести інформацію й не нашкодити. У демократичній державі неприпустима монополізація інформаційного простору олігархічним чи політичним капіталом; мають існувати суспільні медіа.</p>
<p><b>«Репортери без кордонів»</b> (з 1985 р.) — міжнародна організація, що бореться з цензурою, захищає ув'язнених журналістів і щороку публікує <b>Індекс свободи преси</b> (рейтинг 180 країн).</p>
<h4>Межі свободи слова</h4>
<p>Свобода слова може обмежуватися <b>законом</b> в інтересах національної безпеки, територіальної цілісності, громадського порядку, захисту репутації й прав інших людей, здоров'я, авторитету правосуддя.</p>
<h4>Цензура</h4>
<p><b>Цензура</b> — контроль влади за змістом і поширенням друкованої продукції, кіно, радіо, телебачення (іноді й листування), щоб не допустити небажаних ідей. Характерна для тоталітарних режимів (приклад — СРСР). В Україні цензуру заборонено <b>ст. 15 Конституції</b>.</p>
<p><b>Самоцензура</b> — коли журналісти самі замовчують інформацію через страх чи інші мотиви. Журналіст має бути нейтральним, інформувати, а не маніпулювати.</p>`,

// 41 Замовні медіа «джинса» (§33)
{info:`<p><b>«Джинса»</b> — підкуп журналістів, проплачені матеріали або прихована реклама. Буває <b>політична</b> і <b>комерційна</b>. Це вид корупції — «хабар» медіа, щоб похвалити когось або знеславити.</p>
<p>«Джинса» грубо порушує <b>стандарти журналістики</b>: баланс думок; відокремлення фактів від оцінок; достовірність (перевіреність); повнота інформації.</p>
<p><b>Ознаки «джинси»</b> (Інститут масової інформації):</p>
<ul><li>однаковий або майже однаковий матеріал в інших медіа;</li><li>немає думки опонентів і посилань на якісні джерела;</li><li>чітка «полярність»: щось «гарне», щось «погане»;</li><li>адреси, телефони, елементи реклами товарів чи послуг;</li><li>некомпетентні «експерти», сумнівна соціологія, псевдоаналітика;</li><li>підпис псевдонімом.</li></ul>
<p><b>Прихована реклама</b> — продукція в руках героїв серіалів, банери на тлі концертів чи матчів.</p>
<h4>Суспільні медіа</h4>
<p><b>Суспільне мовлення</b> має редакційну незалежність, фінансово не залежить від власників, підтримує баланс думок і протидіє маніпуляціям влади. В Україні — Закон «Про Суспільне телебачення і радіомовлення України» (2014); утворено <b>Національну суспільну телерадіокомпанію (НСТУ, «Суспільне»)</b>. Місія — задовольняти інформаційні потреби всього суспільства з урахуванням етнічного, культурного, конфесійного розмаїття.</p>
<h4>Шкільні медіа</h4>
<p>Шкільні газети, радіо, сайти, блоги, сторінки в соцмережах формують <b>медіакультуру</b> й демократичний світогляд, дають змогу висловлюватися й брати участь в ухваленні рішень. <b>Запуск шкільної газети:</b> концепція, мета, завдання → редакція (головний редактор) → контент-модель → макет → наповнення → друк і поширення. Жанри: новини, інтерв'ю, репортажі, коментарі.</p>`,

// 42 Маніпулятивний вплив медіа (§34)
{info:`<p><b>Маніпуляція в медіа</b> — техніка цілеспрямованого викривлення інформації для формування певного погляду чи ставлення. Мета — керувати поведінкою через вплив на свідомість, інстинкти, ідеологію; нав'язати кліше й штампи.</p>
<p><b>Маршал Маклюен</b> — автор концепції «<b>глобального села</b>»: <i>«Завдяки телебаченню світ став великим селом»</i>.</p>
<h4>Прийоми маніпуляцій</h4>
<ul><li>неповна інформація, приховування аспектів, зміщення акцентів;</li><li>маніпуляція символами, лозунги, «мова плакату»;</li><li>висмикування з контексту;</li><li>маніпулювання емоціями, цінностями, узагальненнями;</li><li>маніпуляція з цифрами (соціологією).</li></ul>
<h4>Новина</h4>
<p><b>Новина</b> — оперативне повідомлення про суспільно важливу й актуальну подію. Характеристики: оперативність, актуальність, суспільна значущість, об'єктивність, достовірність. Новина відповідає на питання: <b>хто? що? коли? де? як?</b> Медіа формують «порядок денний», обираючи, про що розповідати. Журналісти часто використовують «правило кількох с»: сенсації, сміх, сльози, сум, скандал, страх, смерть. Якісні медіа <b>відділяють факти від суджень</b>.</p>
<p><b>Запитання для самозахисту:</b> Це факт, оцінка чи точка зору? Чи представлено різні варіанти? Чи не надто емоційна інформація? Наскільки достовірне джерело, чи можна перевірити? Що насправді доводить фото чи відео? На кого розрахована інформація?</p>
<h4>Фейк</h4>
<p><b>Фейк</b> — навмисно зманіпульована новина або повна вигадка. Сьогодні треба перевіряти не лише об'єктивність факту, а й чи був він узагалі. Фейками бувають фото (фотошоп, постановка), відео, вигадані чи перекручені новини. Фейки створюють «інформаційний шум» і дезорієнтують. Російські медіа масово поширюють фейки для дискредитації України та ЗСУ.</p>
<p><b>Як перевіряти:</b> шукати першоджерело й автора; звертатися до офіційних джерел; перевіряти фото пошуком за зображенням; використовувати ресурси <b>StopFake</b>, <b>«Детектор медіа»</b>; володіння іноземними мовами допомагає звіряти з оригіналом.</p>`,

// 43 Пропаганда. «Мова ворожнечі» (§35)
{info:`<p><b>Пропаганда</b> — форма комунікації, спрямована на поширення фактів, аргументів, чуток для впливу на суспільну думку на користь певної справи. Її мета — змінити цінності й поведінку; сила — у простих готових відповідях на складні питання. Пропаганда може поєднувати <b>«відібрані істини, напівістини і явну брехню»</b> (О. Мейєргоф).</p>
<table class="tbl"><tr><th>Ознака</th><th>Інформація</th><th>Пропаганда</th></tr>
<tr><td>Мета</td><td>передати</td><td>нав'язати</td></tr>
<tr><td>На що спрямована</td><td>обізнаність</td><td>емоції, почуття</td></tr>
<tr><td>Методи</td><td>опис, порівняння</td><td>образа, перебільшення, «словесна позолота», повторення</td></tr>
<tr><td>Ставлення</td><td>нейтральне</td><td>позитивне / негативне</td></tr>
<tr><td>Тип інформації</td><td>точна, повна, відкрита</td><td>неточна, часткова, прихована</td></tr>
<tr><td>Результат</td><td>обізнаність</td><td>дія, зміна поглядів</td></tr></table>
<p>Прийоми: ефект звикання до насильства в новинах, «ефект присутності» в репортажах.</p>
<h4>Інформаційна війна</h4>
<p><b>Інформаційна війна</b> — вплив на населення іншої країни через поширення певної інформації та захист власних громадян від такого впливу. Об'єкти — інформаційний простір, ресурси, системи управління. Методи — агітація, дезінформація, пропаганда. Це ширше поняття, ніж пропаганда. Збройну агресію Росії супроводжує інформаційна війна.</p>
<p><b>ІПСО (інформаційно-психологічна операція)</b> — передача відібраної інформації для впливу на емоції, мотиви й поведінку людей, урядів, груп. Елементи: дезінформація, пропаганда, перебільшення чи применшення, диверсії, кібератаки. Російська пропаганда поширює стереотипи («українці — не окремий народ», «немає української мови» тощо).</p>
<h4>«Мова ворожнечі»</h4>
<p><b>«Мова ворожнечі»</b> — вислови, контекст чи зображення, що створюють або поглиблюють ворожнечу між групами суспільства (за національністю, релігією, поглядами тощо).</p>
<ul><li><b>Жорстка</b> — заклики до насильства й дискримінації.</li>
<li><b>Середня</b> — виправдання насильства, звинувачення групи, твердження про її «кримінальність» чи «неповноцінність».</li>
<li><b>Слабка</b> — створення негативного іміджу групи, протиставлення груп, принизливий контекст.</li></ul>
<p><b>Наслідки:</b> конфлікти, кризи, роз'єднання суспільства, порушення прав людини, дискримінація. Користувачі соцмереж несуть моральну відповідальність за поширення «мови ворожнечі».</p>`,

{info:`<p><b>Достовірність інформації</b> — безсумнівна правдивість відомостей. Достовірна інформація містить <b>посилання на джерело</b> й думки компетентних експертів. Тривожні маркери: «на думку експертів», «кажуть», «усім відомо», «ви, можливо, чули».</p>
<p>Ст. 302 Цивільного кодексу: особа, що поширює інформацію, зобов'язана переконатися в її достовірності; інформацію з офіційних джерел можна не перевіряти, але треба посилатися на джерело.</p>
<h4>Джерела інформації</h4>
<table class="tbl"><tr><th>Тип</th><th>Приклади</th></tr>
<tr><td><b>Первинні</b></td><td>оригінали без інтерпретацій: фото, щоденники, листи, звіти досліджень</td></tr>
<tr><td><b>Вторинні</b></td><td>містять інтерпретацію й аналіз: наукові статті, книжки</td></tr>
<tr><td><b>Третинні</b></td><td>компіляції: енциклопедії, довідники, таблиці, реферати</td></tr></table>
<p>Найбільше довіри — нейтральним джерелам із відомим авторитетним автором і доброю репутацією; варто звертатися до першоджерел і порівнювати кілька джерел.</p>
<h4>Факт і судження</h4>
<p><b>Факт</b> — те, що реально відбулося; його можна виміряти, перевірити (цифри, дати, імена, події). <b>Оціночне судження</b> — висловлювання без фактичних даних (критика, оцінка); його неможливо перевірити. Судження розпізнають за <b>словами-маркерами</b> — емоційними висловами («хунта», «рашисти», «сепари» тощо). Факт об'єктивний, думка — суб'єктивна.</p>
<p><b>Авторство:</b> будь-який текст — результат рішень автора. Анонімність — привід запитати: чому автор приховався, яка його мета й вигода?</p>
<h4>Стандарти подання інформації (ІМІ)</h4>
<ol><li>Баланс думок.</li><li>Оперативність.</li><li>Достовірність (посилання на джерела).</li><li>Відокремлення фактів від коментарів.</li><li>Точність.</li><li>Повнота.</li></ol>
<p><b>Критичне мислення</b> — комплекс усвідомлених дій для оцінки інформації: ознайомлення, порівняння джерел, аналіз поглядів, власна аргументована позиція. <b>Ключові питання аналізу медіатексту:</b> хто створив? чому? хто заплатив? кому вигідно і кому шкодить? про що не сказано? які техніки використано? це факт чи думка?</p>`,

{info:`<p><b>Інтернет</b> — глобальна система взаємопов'язаних комп'ютерних мереж («мережа мереж»), що створює <b>кіберпростір</b>. <b>Віртуальна реальність</b> — ілюзія дійсності, створена комп'ютерними системами.</p>
<p><b>Переваги:</b> найбільша бібліотека світу, обмін досвідом, наука, соціалізація, спілкування, спільні проєкти, бізнес, онлайн-покупки й платежі. <b>Загрози:</b> віруси, інтернет-залежність, ігроманія, втрата реального спілкування.</p>
<h4>Цифрова ідентичність</h4>
<p><b>Цифрова ідентичність</b> — інтернет-ідентичність людини чи організації; набір записів <b>цифрового сліду</b> (листи, пости, фото, логіни, транзакції). Аватари й нікнейми дають змогу створити «віртуальну особу». <b>З. Бауман</b>: межа між приватним і публічним руйнується; онлайн-друзі й офлайн-друзі — різні.</p>
<p><b>Соціальна мережа</b> — вебсервіс, віртуальна спільнота людей зі спільними інтересами (Facebook, Instagram, X/Twitter, LinkedIn, Telegram).</p>
<h4>Приватність і безпека</h4>
<p>Ст. 8 Європейської конвенції з прав людини захищає <b>приватне життя</b>. Онлайн-спілкування майже ніколи не буває повністю приватним; користувачі самі відповідають за захист своїх даних.</p>
<p><b>Правила безпеки:</b> не повідомляти особисту інформацію й паролі; не зустрічатися з онлайн-знайомими; не надсилати фото незнайомцям; не відповідати на грубі листи; не порушувати закон і права інших.</p>
<h4>Кіберзлочинність</h4>
<ul><li><b>піратство</b> — незаконне поширення інтелектуальної власності;</li>
<li><b>фішинг</b> — сайти-підробки для крадіжки даних карток і паролів;</li>
<li><b>кардинг</b>, <b>скимінг</b>, <b>вішинг</b> (телефонне шахрайство);</li>
<li>шкідливе ПЗ, соціальна інженерія, протиправний контент;</li>
<li><b>кібербулінг</b> — повторюване залякування й знущання через електронну комунікацію.</li></ul>
<p>Кібербезпеку в Україні регулює Закон «Про основні засади забезпечення кібербезпеки України» (2017); міжнародна основа — Конвенція про кіберзлочинність. Про злочини повідомляють <b>кіберполіції</b>.</p>
<p><b>Права людини онлайн</b> діють так само, як офлайн (ООН, Рада Європи). Механізми захисту: Уповноважений ВР з прав людини, кіберполіція, міжнародні суди й організації.</p>`,

{info:`<p><b>Економіка</b> — господарська діяльність суспільства, що охоплює <b>виробництво, обмін, розподіл і споживання</b> благ. Галузі: промисловість, сільське господарство, енергетика, будівництво тощо. Створюються <b>споживчі товари</b> та <b>засоби виробництва</b> (обладнання, сировина).</p>
<p><b>Ресурси</b> (матеріальні, грошові, людські, часові) <b>завжди обмежені</b>, тому виробники й споживачі постійно роблять вибір. Основна функція економіки — задоволення потреб людини за умов обмеженості ресурсів.</p>
<h4>Блага</h4>
<p><b>Благо</b> — те, що приносить користь чи задоволення, задовольняє потреби.</p>
<ul><li><b>Вільні (безкоштовні)</b> — дає природа: повітря, вода в річці.</li>
<li><b>Економічні</b> — результат виробництва: <b>матеріальні</b> (їжа, ліки, транспорт) і <b>нематеріальні</b> (освіта, мистецтво, послуги).</li>
<li><b>Приватні</b> — споживаються окремою особою на виключній основі (квиток на концерт).</li>
<li><b>Суспільні</b> — надаються всім, зазвичай державою (освітлення вулиць, національна оборона).</li>
<li><b>Квазісуспільні</b> — безоплатні для певних категорій (музеї, медпослуги, проїзд).</li></ul>
<h4>Стадії економічної діяльності</h4>
<table class="tbl"><tr><th>Стадія</th><th>Суть</th></tr>

<tr><td><b>Споживання</b></td><td>використання благ для задоволення потреб</td></tr></table>
<p><b>Суб'єкти економіки:</b> домогосподарства, підприємства (фірми), держава, закордонний сектор. <b>Держава</b> встановлює «правила гри», збирає податки, розподіляє бюджет, надає <b>трансферти</b> (безповоротну допомогу), виробляє суспільні блага.</p>
<p>Економіка має бути <b>соціально спрямованою</b> — працювати на добробут усіх верств населення.</p>`,

// 49 Сталий розвиток (§39)
{info:`<p>Населення Землі перевищило <b>8 млрд</b> людей і продовжує зростати, а ресурси планети не є невичерпними. Індустріальна модель розвитку минулого століття призвела до хижацького винищення природи, вирубки лісів, руйнування озонового шару, глобального потепління.</p>
<h4>Обмеженість ресурсів</h4>
<ul><li>Через <b>ілюзію невичерпності</b> ресурсів і зростання обсягів, а не ефективності виробництва, запаси швидко вичерпуються.</li>
<li>Найшвидше населення зростає в країнах із найскладнішою економічною ситуацією: голод, виснаження ґрунтів, опустелювання.</li>
<li>Високий рівень життя розвинених країн часто забезпечується коштом ресурсів країн, що розвиваються.</li>
<li>У середньому людина щодня використовує 16 кг ресурсів, видобутих із землі; телефон містить понад 40 різних мінералів.</li></ul>
<h4>Техносфера і катастрофи</h4>
<p><b>Техносфера</b> — створене людиною середовище (від сокири до космічних кораблів); вона розширюється й витісняє <b>біосферу</b>. Природа, господарство й суспільство тісно взаємопов'язані.</p>
<p><b>Катастрофи</b> — події з тяжкими наслідками: <b>природні</b> (падіння метеоритів, урагани, повені, цунамі, виверження вулканів) і <b>техногенні</b>. Локальні природні явища (землетруси, тайфуни) називають <b>стихійними лихами</b>.</p>
<p><b>Війна та довкілля:</b> бойові дії велися на 3 млн га українських лісів; нерозірвані боєприпаси роками отруюють ґрунти й воду.</p>
<p><b>Глобальна екологічна криза</b>: кислотні опади, зникнення видів, зміна клімату, забруднення відходами. Знищуючи природу, людство знищує себе — тому потрібні нові моделі розвитку, що не руйнують майбутнє: <b>раціональне й ефективне використання ресурсів</b>.</p>`,

// 50 Сталий розвиток як спосіб збереження довкілля (§40)
{info:`<p><b>Сталий розвиток</b> — економічний розвиток, за якого добробут теперішніх поколінь досягається <b>не коштом добробуту майбутніх</b>. Концепцію прийнято на <b>Конференції ООН з навколишнього середовища і розвитку в Ріо-де-Жанейро (1992)</b>.</p>
<p><b>Декларація Ріо (1992)</b>: людина — у центрі зусиль; право на здорове життя в гармонії з природою; держави відповідають за те, щоб їхня діяльність не шкодила довкіллю інших; захист довкілля — невід'ємна частина розвитку.</p>
<h4>Міжнародна співпраця</h4>
<ul><li><b>1992</b> — Ріо-де-Жанейро: Декларація Ріо, програма «Порядок денний на XXI століття».</li>
<li><b>1999</b> — Україна приєдналася до <b>Кіотського протоколу</b> (обмеження викидів парникових газів).</li>
<li><b>2002</b> — Всесвітній саміт зі сталого розвитку в Йоганнесбурзі: зобов'язання сповільнити зникнення видів, забезпечити доступ до питної води й каналізації.</li>
<li><b>25 вересня 2015</b> — ГА ООН ухвалила «Порядок денний у галузі сталого розвитку до 2030 року» — <b>17 Цілей сталого розвитку (ЦСР)</b>.</li>
<li><b>2019</b> — Указ Президента «Про Цілі сталого розвитку України на період до 2030 року».</li></ul>
<p>Україна адаптувала ЦСР за 4 напрямами: справедливий соціальний розвиток; стале економічне зростання й зайнятість; ефективне управління; екологічна рівновага. До 2022 р. найбільший успіх — скорочення бідності (з 58,3 % у 2015 р. до 43,2 % у 2018 р.). ЦСР мають стати орієнтиром повоєнної відбудови.</p>
<p><b>Угода мерів</b> — ініціатива ЄС: громади зобов'язуються скоротити викиди CO₂ щонайменше на 35 % до 2030 р.; приєдналися понад 300 громад України.</p>
<h4>Що можу зробити я</h4>

// 51 Ринкова економіка (§41)
{info:`<p><b>Ринок</b> — механізм взаємодії споживачів і виробників, де товари й послуги обмінюються на гроші. <b>Ринкова економіка</b> — система, де рішення про виробництво й розподіл ухвалюються на основі <b>попиту й пропозиції</b>, які визначають ціни.</p>
<h4>Принципи ринкової економіки</h4>
<ul><li><b>Економічна свобода</b> — учасники самі ухвалюють рішення й відповідають за них (Ф. фон Гаєк: свобода вибору пов'язана з ризиком і відповідальністю).</li>
<li><b>Приватна власність</b> на ресурси й засоби виробництва.</li>
<li><b>Конкуренція</b> — економічне змагання виробників за дохід; забезпечує ефективність, інновації, якість. Протилежність — <b>монополія</b> (єдиний виробник, що може завищувати ціни).</li>
<li><b>Вільне ціноутворення</b>; ринок як саморегульована система — <b>«невидима рука ринку»</b>.</li>
<li><b>Гроші</b> — міра вартості й засіб обігу.</li></ul>
<h4>Попит і пропозиція</h4>
<p><b>Попит</b> — платоспроможна потреба: забезпечене грошима бажання купити товар за даною ціною. <b>Закон попиту:</b> що нижча ціна, то більший обсяг попиту. Винятки: товари Гіффена, ефект сноба (Веблена), ажіотажний попит.</p>
<p><b>Еластичність попиту</b> — залежність попиту від ціни: еластичний (предмети розкоші, легко замінні товари) і нееластичний (ліки, сіль, пальне).</p>
<p><b>Пропозиція</b> — бажання виробника продавати товар за даною ціною. <b>Закон пропозиції:</b> що вища ціна, то більший обсяг пропозиції.</p>
<p><b>Ринкова рівновага</b> — точка перетину кривих попиту й пропозиції; ціна в ній — <b>ціна рівноваги</b>. Пряме втручання держави в ціни може спричинити дефіцит або надлишок.</p>
<h4>Роль держави</h4>
<p>Недоліки ринку: змова щодо цін, нездатність створювати суспільні блага, розшарування на багатих і бідних. Тому держава: долає бідність, забезпечує оборону, фінансує освіту й науку. <b>Функції держави:</b> законодавча (антимонопольне законодавство), стабілізуюча (зайнятість, боротьба з інфляцією), розподільча (справедливіший розподіл доходів).</p>
<p><b>Податки</b> — обов'язкові платежі фізичних і юридичних осіб для фінансування держави й місцевого самоврядування: податок на прибуток, ПДФО, ПДВ, акциз, екологічний податок, рентна плата, мито; місцеві — податок на майно, єдиний податок; військовий збір.</p>
<p><b>Бюджет</b> (від фр. <i>bougette</i> — гаманець) — план доходів і видатків. Бюджет буває <b>збалансований</b>, <b>профіцитний</b> (доходи більші) і <b>дефіцитний</b> (видатки більші). Прозорість: портали spending.gov.ua (e-data), «Ціна держави».</p>`,

// 52 Економіка домогосподарства (§42)
{info:`<p><b>Домогосподарство</b> — сукупність осіб, які спільно проживають, забезпечують себе всім необхідним, ведуть спільне господарство й повністю чи частково об'єднують кошти (Закон «Про Всеукраїнський перепис населення»). Може складатися з однієї особи; не обов'язково з родичів. Поняття ширше, ніж сім'я.</p>
<p><b>Домашня праця</b> — обслуговування членів домогосподарства, догляд за дітьми й літніми людьми; може мати виробничу складову (город) — для власного вжитку або для продажу.</p>
<h4>Функції домогосподарств у ринковій економіці</h4>
<ol><li><b>Споживання</b> — задоволення потреб домогосподарств є метою виробництва.</li>
<li><b>Постачання ресурсів (факторів виробництва)</b>: <b>земля, капітал, праця</b> + <b>підприємливість</b> та <b>інформація</b>.</li>
<li><b>Заощадження</b> — частина доходу, що залишається після податків і витрат на споживання. Заощаджують заради фінансової захищеності, пенсії, освіти дітей, на непередбачені потреби; заощадження можна інвестувати (цінні папери, нерухомість), що розвиває національну економіку.</li></ol>
<h4>Бюджет домогосподарства</h4>
<p><b>Бюджет домогосподарства</b> — план його доходів і витрат на певний період. Доходи формуються з оплати ресурсів (зарплата, прибуток, рента, відсотки) і соціальних виплат; витрачаються на <b>приватне споживання</b>, податки, заощадження.</p>
<p><b>Прожитковий мінімум</b> — вартість набору продуктів, товарів і мінімальних послуг, необхідних для збереження здоров'я та задоволення основних потреб. Дохід домогосподарства не має бути нижчим за нього.</p>
<p>Доходи залежать від економічної ситуації: у періоди піднесення зростають зарплати й соціальні програми, у періоди спаду — скорочуються доходи й споживання. Задоволення потреб визначають два чинники: <b>рівень доходу</b> і <b>ціни</b>. За будь-яких умов варто ощадливо ставитися до ресурсів.</p>`,

// 53 Раціональне споживання (§43)
{info:`<p><b>Раціональне споживання</b> — вибір, що приносить найбільшу користь за найменших затрат в умовах обмеженого бюджету. Купуючи одне, ми відмовляємося від іншого — це <b>вартість утрачених можливостей</b> (альтернативна вартість).</p>
<p><b>Річард Тейлер</b> (Нобелівська премія 2017, поведінкова економіка): люди не завжди діють «розумно»; варто розпізнавати «поштовхи» реклами й питати себе: «Хто намагається на мене вплинути і з якою метою?»</p>
<h4>Суспільство споживання і стале споживання</h4>
<p><b>Суспільство споживання</b> — рівень споживання значно перевищує біологічні потреби; реклама переконує, що речі підвищують статус. <b>Збалансоване (стале) споживання</b> задовольняє потреби нинішнього й майбутніх поколінь: менше споживання й відходів, екологічна продукція, місцеві й довговічні товари, повторне використання речей, «міра» у споживанні.</p>
<h4>Права споживачів</h4>
<p><b>Керівні принципи ООН для захисту інтересів споживачів (1985)</b>: захист здоров'я й безпеки, економічних інтересів, доступ до інформації, просвіта, процедури розгляду скарг, право створювати організації споживачів. Міжнародна організація — <b>Consumers International</b>.</p>
<p>В Україні: <b>ст. 42 Конституції</b> (держава захищає права споживачів, контролює якість і безпечність продукції), <b>ст. 50</b> (доступ до інформації про якість продуктів), Закон <b>«Про захист прав споживачів»</b> (1991).</p>

<p><b>Форми захисту:</b> самозахист, державні органи, органи місцевого самоврядування, суд, неурядові організації. Зі статусом кандидата в члени ЄС (червень 2022 р.) Україна гармонізує законодавство про захист споживачів із директивами ЄС.</p>

// 54 Підприємництво (§44)
{info:`<p><b>Підприємництво</b> (за Господарським кодексом України) — самостійна, ініціативна, систематична, на власний ризик господарська діяльність з метою досягнення економічних і соціальних результатів та одержання прибутку.</p>
<p>Підприємця від звичайного бізнесмена відрізняють <b>творчість та інноваційність</b>. <i>«Інновація — дитина підприємництва»</i> (Й. Шумпетер).</p>
<p><b>Риси підприємця:</b> новаторство, нестандартні рішення, орієнтація на якість, відповідальність, чесність, цілеспрямованість, готовність до ризику, ініціативність, постійне самовдосконалення.</p>
<h4>Принципи підприємницької діяльності (ГК України)</h4>
<ul><li>вільний вибір видів діяльності;</li><li>самостійне формування програми, вибір постачальників і споживачів, встановлення цін;</li><li>вільний найм працівників;</li><li>комерційний розрахунок і власний ризик;</li><li>вільне розпорядження прибутком після сплати податків;</li><li>самостійна зовнішньоекономічна діяльність.</li></ul>
<p>Займатися підприємництвом можуть фізичні (ФОП) та юридичні особи. Органам влади підприємництво заборонене, посадовцям — обмежене. Сфери: виробнича, комерційна, посередницька, консультаційна, фінансова, страхова.</p>
<h4>Соціальна відповідальність</h4>
<p><b>Соціальна відповідальність бізнесу</b> — участь підприємців у розв'язанні суспільних проблем понад отримання прибутку; підвищує довіру й репутацію. <b>Соціальне підприємство</b> має соціальний ефект: працевлаштовує вразливі групи, надає соціальні послуги (приклади: TOMS Shoes, «Україна без сміття»).</p>
<p><b>Державно-приватне партнерство</b> — співпраця держави, громад і бізнесу (від 5 до 50 років) для створення інфраструктури та розв'язання соціальних питань; важливий інструмент відбудови України.</p>
<h4>Підтримка й правовий захист бізнесу</h4>
<p>Держава регулює підприємництво й заохочує його розвиток (ст. 48 ГК: земельні ділянки, майно, інформаційна підтримка, стимулювання інновацій, підтримка малого бізнесу). Захищаються <b>право власності</b> та <b>інтелектуальна власність</b> (патенти, авторські права, товарні знаки). Закон забороняє <b>недобросовісну конкуренцію</b>: використання чужих товарних знаків, копіювання товарів, розголошення комерційної таємниці.</p>`,

// 55 Ринок праці (§45)
{info:`<p><b>Праця</b> — свідома цілеспрямована діяльність людини для здобуття бажаного результату й задоволення потреб; один із факторів виробництва.</p>
<p>На <b>ринку праці</b> домогосподарства продають, а підприємці купують <b>робочу силу</b> — здатність людини до праці, сукупність її фізичних і духовних здібностей.</p>
<p><b>Учасники:</b> <b>роботодавці</b> (підприємства, організації, державні установи, окремі особи) та <b>наймані працівники</b>. <b>Держава</b> — і роботодавець, і регулятор: встановлює мінімальну зарплату, тривалість робочого дня, соціальні гарантії, контролює дотримання законодавства, підтримує профспілки.</p>
<p><b>Етапи прийому на роботу:</b> резюме, анкети → співбесіда → тестування / кваліфікаційний іспит → поглиблена співбесіда → пропозиція роботи.</p>
<h4>Професія, спеціальність, кваліфікація</h4>
<ul><li><b>Професія</b> — вид трудової діяльності, що потребує спеціальних знань і навичок.</li>
<li><b>Спеціальність (фах)</b> — поділ у межах професії (учитель історії, учитель математики).</li>
<li><b>Кваліфікація</b> — рівень професійних знань, умінь і навичок; підвищується через досвід, курси, тренінги.</li></ul>
<h4>Заробітна плата</h4>
<p><b>Заробітна плата</b> — винагорода, зазвичай у грошах, яку роботодавець за трудовим договором виплачує працівникові за виконану роботу (Закон «Про оплату праці»). Залежить від складності й умов роботи, кваліфікації, результатів, попиту й пропозиції робочої сили. Системи оплати: <b>погодинна</b> і <b>відрядна</b>. Держава гарантує <b>мінімальну зарплату</b>.</p>
<p><b>Гендерна сегрегація</b> — нерівність можливостей жінок і чоловіків на ринку праці; «<b>скляна стеля</b>» (невидимий бар'єр кар'єрного росту) і «<b>липка підлога</b>». Ст. 24 Конституції гарантує рівні права, проте розрив в оплаті зберігається.</p>
<h4>Зайнятість і безробіття</h4>
<p>За МОП населення поділяють на <b>зайнятих</b>, <b>безробітних</b> (не мають роботи, але активно шукають) і <b>незайнятих</b> (не мають і не шукають). <b>Безробіття</b> — перевищення пропозиції робочої сили над попитом; певний рівень вважається природним. Наслідки: недовироблена продукція, менші податки, навантаження на бюджет, бідність, стрес, розпад сімей. Допомагає <b>Державна служба зайнятості</b>.</p>`,

// 56 Лобіювання і корупція (§46)
{info:`<p><b>Лобізм</b> (від англ. <i>lobby</i> — кулуари) — неофіційний вплив на законодавців і владу з метою захисту інтересів певних груп; <b>лобісти</b> — особи, які здійснюють такий вплив. «Лобі» — також неформальні групи, що відстоюють інтереси галузей чи регіонів (аграрне лобі).</p>
<p><b>Методи:</b> переконання, рекомендації, інформування, участь у розробці законопроєктів. Коли лобісти вдаються до підкупу — лобізм перетворюється на <b>корупцію</b>.</p>
<p><b>Види:</b> парламентський, президентський, урядовий; <b>зовнішній</b> (тиск ззовні) і <b>внутрішній</b> (самими депутатами, урядовцями). У США, Канаді, Великій Британії, Польщі, Литві лобізм урегульований законом. В Україні Закон «Про лобіювання» ухвалено у 2024 р.</p>
<p><b>Адвокасі</b> (адвокація, «заступництво») — захист інтересів <b>вразливих груп</b>, які мають право на певні блага, але не можуть його реалізувати; здійснюють переважно неурядові організації.</p>
<h4>Корупція</h4>
<p><b>Корупція</b> (лат. <i>corrumpere</i> — «псувати») — зловживання наданими повноваженнями заради наживи (грошей, пільг, переваг). Перший відомий борець з корупцією — шумерський цар <b>Урукагіна</b> (XXIV ст. до н. е.).</p>
<p><b>Конвенція ООН проти корупції</b> — ухвалена 31 жовтня 2003 р.; Україна ратифікувала 18 жовтня 2006 р.</p>
<p><b>Корупційні прояви:</b> підкуп державних посадовців (національних та іноземних); розкрадання майна посадовцем; зловживання впливом і службовим становищем; незаконне збагачення; відмивання злочинних доходів.</p>
<p><b>Форми корупції:</b> <b>хабарництво</b>, <b>кумівство</b>, <b>зловживання владою</b> або посадовим становищем.</p>
<p><b>Індекс сприйняття корупції</b> (Transparency International) — від 0 (високо корумповані) до 100 (дуже чисті). У 2022 р. Україна мала 33 бали (116 місце зі 180), середньосвітовий показник — 43.</p>`,

// 61 Міграція. Європейська політика сусідства (§49)
{info:`<p>Загальна декларація прав людини гарантує право на вільне пересування й вибір місця проживання. <b>Міграція</b> — переселення людей через кордони територій зі зміною місця проживання назавжди чи на тривалий час (за ООН — понад 6 місяців).</p>
<h4>Види міграції</h4>

<li><b>внутрішня</b> і <b>міжнародна</b>; <b>еміграція</b> — виїзд із країни, <b>імміграція</b> — в'їзд до країни;</li>
<li><b>добровільна</b> і <b>вимушена</b> (примусова);</li>
<li><b>репатріація (рееміграція)</b> — повернення на батьківщину.</li></ul>
<p><b>Внутрішньо переміщена особа (ВПО)</b> — особа, яка покинула місце проживання через збройний конфлікт, тимчасову окупацію, насильство, порушення прав людини. <b>Біженці</b> — люди, що вимушено мігрували за межі своєї держави; розрізняють шукачів притулку, осіб з тимчасовим захистом і власне біженців.</p>
<p>Повномасштабне вторгнення Росії спричинило найбільшу міграційну кризу в Європі з часів Другої світової війни: мільйони українців стали ВПО або біженцями. ЄС надав українцям <b>тимчасовий захист</b>.</p>
<p><b>Наслідки міграції для України:</b> «+» перекази мігрантів, зменшення безробіття, поширення європейських цінностей; «−» <b>«відплив мізків»</b>, втрата молоді, зниження народжуваності, старіння населення.</p>
<h4>Європейська політика сусідства</h4>
<p><b>Європейська політика сусідства (ЄПС)</b> — започаткована ЄС у <b>2004 р.</b> для зближення із сусідніми державами на сході й півдні: підтримка демократії, верховенства права, економічної інтеграції, мобільності. Україна у 2002 р. отримала статус «спеціального сусіда», у 2005 р. — План дій Україна — ЄС.</p>
<p><b>Східне партнерство</b> (з <b>2009 р.</b>, Прага) — східний вимір ЄПС для шести держав: <b>Україна, Молдова, Грузія, Вірменія, Азербайджан, Білорусь</b> (Білорусь призупинила участь у 2021 р.). Саме на саміті Східного партнерства у Вільнюсі (листопад 2013 р.) мала бути підписана Угода про асоціацію з ЄС, відмова від чого спричинила Революцію Гідності.</p>`,

// 62 Глобальні проблеми людства
{info:`<p><b>Глобальні проблеми людства</b> — проблеми, що стосуються всього людства, загрожують його існуванню чи розвитку й можуть бути розв'язані лише <b>спільними зусиллями</b> всіх держав. Їх досліджує глобалістика; першою про «межі зростання» людства заговорила доповідь Римського клубу (1972), заснованого <b>Ауреліо Печчеї</b>.</p>
<h4>Групи глобальних проблем</h4>
<table class="tbl"><tr><th>Група</th><th>Проблеми</th></tr>

<tr><td><b>«Людина — природа»</b></td><td>екологічна криза й зміна клімату, енергетична, сировинна, продовольча, проблема питної води, освоєння Світового океану й космосу</td></tr>
<tr><td><b>«Людина — суспільство»</b></td><td>демографічна (швидке зростання населення в одних країнах і старіння в інших), охорона здоров'я та пандемії, освіта й неграмотність, злочинність, наркоманія, кіберзагрози</td></tr></table>
<h4>Шляхи розв'язання</h4>

<li>концепція <b>сталого розвитку</b> та <b>17 Цілей сталого розвитку ООН</b> до 2030 р. (подолання бідності й голоду, якісна освіта, чиста вода, доступна енергія, боротьба зі зміною клімату, мир і справедливість тощо);</li>

<p><b>Війна Росії проти України</b> загострила глобальні проблеми: загроза ядерної безпеки (окупація Запорізької АЕС), продовольча криза через блокаду портів, міграційна криза, руйнування довкілля.</p>
<p><i>«Думай глобально — дій локально»</i>: кожен може долучитися — заощаджувати ресурси, сортувати відходи, бути волонтером, критично ставитися до інформації.</p>`,

// 63 Міжнародні відносини та міжнародне право (§50)
{info:`<p><b>Міжнародні відносини</b> — політичні, економічні, дипломатичні, культурні та інші відносини між державами, їх групами, міжнародними організаціями. Через них держави реалізують національні інтереси: суверенітет, безпеку, стабільність, гідний рівень життя. Головні суб'єкти — <b>національні держави</b>.</p>
<p><b>Сфери:</b> політичні, дипломатичні, правові, культурно-гуманітарні. <b>Форми взаємодії:</b> <b>співпраця, суперництво, конфлікти</b>.</p>
<p>В основі міжнародних відносин — два принципи: <b>принцип сили</b> (здатність нав'язати свою волю завдяки військовій, економічній могутності) і <b>принцип права</b> (пріоритет міжнародного правопорядку).</p>
<p>Засади зовнішньої політики України закріплено в Конституції (ст. 18), законах «Про засади внутрішньої і зовнішньої політики», «Про національну безпеку України». Україна — миролюбна <b>без'ядерна</b> держава з євроатлантичними орієнтирами.</p>
<h4>Міжнародне право</h4>
<p><b>Міжнародне право</b> — система юридичних норм, що регулюють відносини між державами та іншими суб'єктами; створюється шляхом узгодження позицій і за потреби забезпечується примусом. Основоположник — <b>Гуго Гроцій</b> («Про право війни і миру»). Ст. 9 Конституції України: чинні міжнародні договори, ратифіковані Верховною Радою, є частиною національного законодавства.</p>
<p><b>Основні принципи</b> (Статут ООН 1945, Декларація 1970, Заключний акт НБСЄ 1975): незастосування сили; суверенна рівність; рівноправність і самовизначення народів; мирне розв'язання спорів; невтручання у внутрішні справи; співробітництво; сумлінне виконання зобов'язань; <b>непорушність кордонів</b>; <b>територіальна цілісність</b>; повага до прав людини.</p>
<h4>Міжнародне гуманітарне право</h4>
<p>МГП регулює поведінку сторін під час збройних конфліктів (Женевські конвенції 1949 р.): захист жертв війни, заборона певної зброї, гуманне поводження з полоненими й цивільними, заборона залучати до бойових дій осіб до 15 років. <b>Комбатанти</b> — ті, хто воює; <b>некомбатанти</b> — медичний персонал, духовенство у складі збройних сил.</p>
<p><b>Окупація</b> — тимчасове захоплення території держави збройними силами іншої без набуття суверенних прав. Окупантові заборонено: насильство й залякування цивільних, катування, колективні покарання, захоплення заручників, <b>депортацію населення</b>, примус до присяги чи участі у війні проти своєї країни.</p>`,

// 64 Система безпеки. Міжнародні організації (§51)
{info:`<p><b>Система міжнародної безпеки</b> — політика й сукупність інститутів, що гарантують мир, захищають від зовнішніх загроз і забезпечують суверенітет та рівноправність держав. Суб'єкти — держави й міжнародні організації; об'єкти — народи, громадяни, держави, людство.</p>
<p><b>Принципи:</b> універсальність і однаковий рівень безпеки для всіх; співпраця; об'єднання зусиль проти агресії; різноманітні засоби підтримання миру; довіра й прозорість.</p>
<h4>Міжнародні урядові організації</h4>
<ul><li><b>ООН</b> (1945) — найвпливовіша організація; мета — підтримувати мир і безпеку, розвивати дружні відносини між народами. Миротворці — «блакитні шоломи». Установи в Україні: ПРООН, ЮНІСЕФ, ВООЗ, МОП, УВКБ ООН, МОМ, МАГАТЕ та ін. <b>ЮНЕСКО</b> — освіта, наука, культура; <b>МОП</b> — права у сфері праці.</li>
<li><b>Рада Європи</b> (травень 1949 р., Лондон; органи — у Страсбурзі) — права людини, демократія, верховенство права; при ній діє ЄСПЛ. Україна — 37-й член з листопада 1995 р.</li>
<li><b>НАТО</b> (квітень 1949 р.) — Північноатлантичний альянс колективної оборони; засновники — 12 держав. Після вторгнення Росії в Україну відмовилися від нейтралітету й вступили до НАТО <b>Фінляндія (2023)</b> та <b>Швеція (2024)</b>; нині альянс об'єднує 32 держави.</li>
<li><b>ОБСЄ</b>, <b>СОТ</b>, МВФ, Світовий банк та ін.</li></ul>
<h4>Міжнародні неурядові організації</h4>
<p>Утворюються не державами, а фізичними чи юридичними особами. Їх понад 6 тисяч — це перші елементи <b>глобального громадянського суспільства</b>.</p>
<ul><li><b>Міжнародний комітет Червоного Хреста</b> (Женева, 1863) — допомога жертвам збройних конфліктів, поширення знань про МГП; тричі лауреат Нобелівської премії миру.</li>
<li><b>Римський клуб</b> (1968; А. Печчеї, О. Кінг) — дослідження глобальних проблем.</li>
<li>Amnesty International, Transparency International, «Лікарі без кордонів» тощо.</li></ul>
<p><b>Міжнародна солідарність</b> — взаємодопомога країнам, що постраждали від війн, катастроф, стихійних лих, незалежно від географічних, расових, релігійних відмінностей. Солідарність — один із принципів Хартії основних прав ЄС.</p>`,

// 65 Україна — член світового співтовариства (§52)
{info:`<p>Поява незалежної України (1991) спричинила глобальні зміни в Європі. Ще <b>Декларація про державний суверенітет (16 липня 1990 р.)</b> проголосила прагнення брати участь у міжнародному житті та загальноєвропейському процесі й пріоритет норм міжнародного права.</p>
<ul><li><b>1992</b> — Україна підписала Гельсінський Заключний акт, вступила до НБСЄ (ОБСЄ).</li>
<li>До січня 1993 р. Україну визнали 132 держави.</li>
<li><b>1994</b> — <b>Будапештський меморандум</b>: Україна відмовилася від третього за величиною ядерного арсеналу світу; США, Велика Британія й Росія зобов'язалися поважати її незалежність, суверенітет, кордони, не застосовувати силу й економічний тиск. У 2014 і 2022 рр. Росія грубо порушила меморандум.</li></ul>
<h4>Україна в ООН</h4>
<p>Україна — одна з держав-засновниць ООН (1945). Була непостійним членом Ради Безпеки ООН, зокрема у <b>2016–2017 рр.</b>; ініціювала резолюцію РБ ООН 2341 про захист критичної інфраструктури від терористів (2017). Пріоритети: протидія російській агресії, миротворчість, запобігання конфліктам, боротьба з тероризмом, довкілля, захист жінок і дітей у конфліктах. Україна співпрацює з ООН у подоланні наслідків Чорнобильської катастрофи, отримує гуманітарну допомогу установ ООН.</p>
<h4>Україна в СОТ</h4>
<p><b>Світова організація торгівлі (СОТ)</b> створена 1995 р.; мета — правила міжнародної торгівлі, її лібералізація, прозорість. Україна — член СОТ з <b>2008 р.</b>: бере участь у формуванні правил світової торгівлі, має доступ до механізмів урегулювання спорів і до державних закупівель інших країн.</p>
<p>Україна є членом кількох десятків міжнародних організацій і будує відносини на засадах суверенної рівності, невтручання, територіальної цілісності й непорушності кордонів.</p>`,

<ul><li>Людина — найвища цінність; її гідність — основа всіх прав.</li><li>Права людини гарантує держава, а захищає й сам громадянин, громадянське суспільство та міжнародні механізми.</li><li>Різноманітність збагачує суспільство, якщо її супроводжують повага й толерантність.</li><li>Демократія неможлива без активних, відповідальних громадян.</li></ul>`,
terms:[["Особистість","людина, вихована суспільством"],["Права людини","вроджені, невід'ємні можливості людини"],["Толерантність","повага до відмінностей"],["Демократія","народовладдя"],["Громадянське суспільство","вільні громадяни та їхні об'єднання"]],
q:[["Процес засвоєння знань і норм суспільства — …",["соціалізація","глобалізація","стратифікація","інтеграція"],0],
["Перша ланка соціалізації — …",["сім'я","армія","трудовий колектив","держава"],0],
["Коли ухвалено Загальну декларацію прав людини?",["1948 р.","1989 р.","1996 р.","1950 р."],0],
["Права першого покоління — …",["громадянські й політичні","соціальні","екологічні","біомедичні"],0],
["Спрощене усталене уявлення про групу людей — …",["стереотип","факт","закон","статус"],0],
["Розв'язання конфлікту через взаємні поступки — …",["компроміс","ухиляння","ультиматум","суперництво"],0],
["Право бути обраним — виборче право…",["пасивне","активне","загальне","пряме"],0],
["Хто може звернутися до ЄСПЛ?",["Громадянин після вичерпання національних засобів захисту","Лише держава","Лише депутат","Лише юридична особа"],0],
["Громадські організації називають…",["«третім сектором»","«першою владою»","«тіньовою економікою»","«четвертою гілкою»"],0],
["Вертикальне розшарування суспільства — …",["стратифікація","демократія","інклюзія","мобільність"],0]]},

// 70 Підсумкове узагальнення (розділи V–VII)
{info:`<p><b>Урок підсумкового узагальнення знань (2).</b> Повторюємо розділи V–VII курсу.</p>
<table class="tbl"><tr><th>Розділ</th><th>Ключові ідеї</th></tr>
<tr><td><b>V. Світ інформації та мас-медіа</b></td><td>Медіа й медіатекст; реклама; громадська думка; свобода слова (ст. 34) і заборона цензури (ст. 15); «джинса»; суспільні медіа; маніпуляції, фейки, пропаганда, інформаційна війна, «мова ворожнечі»; критичне мислення, факт і судження; цифрова ідентичність, кібербезпека.</td></tr>
<tr><td><b>VI. Громадяни, держава і добробут</b></td><td>Економіка й блага; обмеженість ресурсів, сталий розвиток (17 ЦСР); ринок, конкуренція, попит і пропозиція; податки й бюджет; домогосподарство; права споживачів; підприємництво; ринок праці; лобізм, корупція й протидія їй (НАБУ, НАЗК, Prozorro, «Дія»).</td></tr>
<tr><td><b>VII. Україна, Європа, світ</b></td><td>Глобалізація та інтеграція; ЄС; міграція; глобальні проблеми; міжнародне право й МГП; ООН, Рада Європи, НАТО, ОБСЄ; Будапештський меморандум; Угода про асоціацію, статус кандидата в ЄС; партнерство з НАТО.</td></tr></table>
<h4>Головні висновки курсу</h4>
<ul><li>Медіаграмотність і критичне мислення — захист від маніпуляцій і пропаганди.</li><li>Добробут суспільства залежить від чесної взаємодії громадян і держави, сталого використання ресурсів і нетерпимості до корупції.</li><li>Європейський вибір України — це вибір цінностей: свободи, гідності, демократії, верховенства права.</li><li>Активний громадянин — той, хто знає свої права, виконує обов'язки й бере участь у житті громади та країни.</li></ul>`,
terms:[["Медіаграмотність","уміння критично аналізувати медіа"],["Сталий розвиток","розвиток без шкоди майбутнім поколінням"],["Корупція","зловживання владою заради вигоди"],["Глобалізація","всесвітня інтеграція"],["Євроінтеграція","рух України до членства в ЄС"]],
q:[["Навмисно зманіпульована новина — …",["фейк","репортаж","інтерв'ю","анонс"],0],
["Яка стаття Конституції України забороняє цензуру?",["Ст. 15","Ст. 34","Ст. 42","Ст. 9"],0],
["Що відрізняє факт від оціночного судження?",["Факт можна перевірити","Судження завжди правдиве","Факт емоційний","Нічого"],0],
["Ціна, за якої обсяг попиту дорівнює обсягу пропозиції, — …",["ціна рівноваги","монопольна ціна","мінімальна ціна","акцизна ціна"],0],
["Скільки Цілей сталого розвитку визначила ООН?",["17","10","8","27"],0],
["Система публічних закупівель Prozorro — інструмент…",["протидії корупції","пропаганди","цензури","лобізму"],0],
["Якого року Україна отримала статус кандидата на членство в ЄС?",["2022","2014","2017","1991"],0],
["Будапештський меморандум (1994) стосувався…",["відмови України від ядерної зброї","вступу до ЄС","створення СОТ","кліматичних змін"],0],
["Кібербулінг — це…",["цькування в інтернеті","захист даних","онлайн-навчання","вид реклами"],0],
["Що є основою всіх прав людини?",["Людська гідність","Багатство","Громадянство","Освіта"],0]]}
);


const LESSONS = META.map((m,i)=>Object.assign({}, m, L[i]||{}));

const SEC_STYLE = [
  {c:"#ef8a00", i:"🧭", d:"📘🇺🇦🤝💬✨"},
  {c:"#3a6fd8", i:"🧑", d:"🪞👪🧩🎯🌱"},
  {c:"#c0392b", i:"⚖️", d:"🕊️📜🧒🛡️🌍"},
  {c:"#1c9aa8", i:"🌈", d:"🗣️🤝🎭🧠🕊️"},
  {c:"#7b4fd6", i:"🗳️", d:"🏛️📣🏘️🙋🏫"},
  {c:"#d6336c", i:"📰", d:"📺📱🔎📡💻"},
  {c:"#2e8b57", i:"💰", d:"🏭🛒🌿💼🧾"},
  {c:"#8a5a2b", i:"🌍", d:"🇪🇺✈️🤝🛰️🕊️"}
];

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done = store.get("go10_done")||{};

const SECTIONS = [];
LESSONS.forEach((l,i)=>{ let s=SECTIONS[SECTIONS.length-1]; if(s&&s.name!==l.section) s=null; if(!s){s={name:l.section,items:[],st:SEC_STYLE[SECTIONS.length%SEC_STYLE.length]};const m=/^Розділ\s+([IVXІ]+)\.\s*(.*)$/.exec(l.section); s.lab=m?m[1].replace(/І/g,'I'):''; s.short=m?m[2]:(l.section==='Вступ'?'Вступ до курсу':l.section); SECTIONS.push(s)} s.items.push(i); l.sec=s; l.tnum=s.items.length; });

function firstPage(p){const m=/(\d+)/.exec(p||"");return m?+m[1]:0;}
function qWord(n){const a=n%10,b=n%100; if(a===1&&b!==11) return "запитання"; if(a>=2&&a<=4&&(b<10||b>=20)) return "запитання"; return "запитань";}
function meta(l){ const q=(l.q||[]).length; return q+" "+qWord(q); }
function themeBtn(){ return `<button class="btn icon-btn" onclick="toggleTheme()" title="Світла / темна тема">🌓</button>`; }

function renderHome(){
  const total=LESSONS.length, dn=Object.keys(done).length;
  $("#app").innerHTML = `
  <div class="hero">
    <div>
      <div class="kick">Ліцей «Ясно» · 10 клас</div>
      <h1>Громадянська освіта</h1>
      <p>Уроки за календарно-тематичним плануванням: основний теоретичний матеріал з параграфа підручника, ключові поняття й тест для самоперевірки.</p>
      <div class="stats"><span><b>${SECTIONS.length}</b> розділів</span><span><b>${total}</b> тем</span><span><b>${dn}</b> пройдено</span></div>
    </div>
    <div class="hero-actions"><a class="btn" href="index.html">← Усі предмети</a>${themeBtn()}</div>
  </div>
  ${SECTIONS.map((s,si)=>`
  <section class="sec" style="--c:${s.st.c}">
    <div class="sec-h"><div class="num">${s.lab||"★"}</div><h2>${esc(s.short)}</h2></div>
    <div class="sec-body">
      <div class="cover"><div class="ci">${s.st.i}</div><div><div class="rz">${s.lab?"РОЗДІЛ "+s.lab:"ВСТУП"}</div><div class="rn">${esc(s.short)}</div></div><div class="doodles">${[...s.st.d].join("")}</div></div>
      <div class="cards">${s.items.map(i=>{const l=LESSONS[i];return `
        <a class="tcard" href="#${i+1}">${done[i+1]?'<span class="chk">✓</span>':""}
          <div class="tn">Тема ${l.tnum}${l.diag?'<span class="badge">тренувальна</span>':""}</div>
          <div class="tt">${esc(l.title)}</div>
          <div class="tm">${meta(l)}</div>
        </a>`}).join("")}</div>
    </div>
  </section>`).join("")}`;
  document.title="Громадянська освіта · 10 клас";
}

function shuffle(a,seed){ const r=a.slice(); let s=seed; for(let i=r.length-1;i>0;i--){ s=(s*9301+49297)%233280; const j=Math.floor(s/233280*(i+1)); [r[i],r[j]]=[r[j],r[i]] } return r; }

function renderLesson(i){
  const l=LESSONS[i], n=i+1, s=l.sec, si=SECTIONS.indexOf(s);
  const chips = `<span class="chip c">${s.lab?"Розділ "+s.lab:"Вступ"}</span>`+(l.codes?l.codes.split(/,\s*/).map(c=>`<span class="chip">${esc(c)}</span>`).join(""):"")+(l.diag?'<span class="chip c">Тренувальна діагностувальна робота</span>':"")+`<span class="chip">${(l.q||[]).length} ${qWord((l.q||[]).length)}</span>`;
  const ktp = l.ktp ? `<div class="ktp"><b>За КТП:</b> ${esc(l.ktp)}</div>` : "";
  const terms = (l.terms&&l.terms.length) ? `<div class="box"><h3><span class="bi">✎</span>Ключові поняття</h3>${l.terms.map(t=>`<div class="term"><b>${esc(t[0])}</b> — ${esc(t[1])}</div>`).join("")}</div>` : "";
  const w = W[WORK_OF[n]];
  const work = w ? `<div class="box work"><h3><span class="bi">📖</span>Про твір: ${esc(w.name)}</h3>
      <div class="wmeta"><span>✍ ${esc(w.author)}</span><span>◆ ${esc(w.genre)}</span></div>
      <h4>Про що твір</h4><p>${esc(w.about)}</p>
      <h4>${esc(w.plotTitle||"Короткий сюжет")}</h4><ol class="plot">${w.plot.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      <h4>${w.poem?"Ліричний герой":"Головні герої"}</h4><div class="heroes">${w.heroes.map(h=>`<div class="hero-c"><b>${esc(h[0])}</b><span>${esc(h[1])}</span></div>`).join("")}</div>
    </div>` : "";
  const workSide = w ? `<div class="box"><h3><span class="bi">✍</span>Твір уроку</h3><div style="font:700 18px Montserrat,sans-serif;line-height:1.3">${esc(w.name)}</div><div class="small" style="margin-top:4px">${esc(w.author)}</div><div class="small">${esc(w.genre)}</div><a class="btn" style="margin-top:14px" href="#work" onclick="document.querySelector('.work').scrollIntoView({behavior:'smooth'});return false">Сюжет і герої ↓</a></div>` : "";
  const qs=(l.q||[]).map((q,qi)=>{const order=shuffle(q[1].map((_,k)=>k),n*31+qi*7+3);
    return `<div class="qst" data-c="${q[2]}"><div class="qt">${qi+1}. ${esc(q[0])}</div>`+order.map(k=>`<label class="opt" data-k="${k}"><input type="radio" name="q${qi}" value="${k}"><span>${esc(q[1][k])}</span></label>`).join("")+`</div>`}).join("");
  const hw = "";
  const pl=i>0?LESSONS[i-1]:null, nl=i<LESSONS.length-1?LESSONS[i+1]:null;
  const navA=(x,k,cls)=>x?`<a class="${cls}" href="#${k}" style="--c:${x.sec.st.c}"><div class="tn">${cls==="next"?"Далі →":"← Назад"} · Тема ${x.tnum}</div><div class="t">${esc(x.title)}</div></a>`:"";

  $("#app").innerHTML = `<div style="--c:${s.st.c}">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><a class="back" href="#">← Усі розділи</a>${themeBtn()}</div>
    <div class="lhead"><div class="num">${s.lab||"★"}</div><div>
      <div class="tn">${esc(s.name)} · Тема ${l.tnum}</div>
      <h1>${esc(l.title)}</h1><div class="chips">${chips}</div></div></div>
    ${l.diag?`<div class="train"><div class="ti">📝</div><div><b>Це тренувальна діагностувальна робота.</b><br>Виконайте завдання, щоб підготуватися до діагностувальної роботи. Ці завдання не на оцінку.</div></div>`:""}
    <div class="lgrid"${w?"":' style="grid-template-columns:1fr"'}>
      <div>
        <div class="box"><h3><span class="bi">✦</span>Основна інформація</h3>${ktp}${l.info||""}</div>
        ${work}
        ${terms}
        <div class="box" id="test"><h3><span class="bi">✓</span>${l.diag?"Тренувальні тестові завдання":"Тест для самоперевірки"}</h3>${qs}
          <div class="actions"><button class="btn fill" id="check">Перевірити</button><button class="btn" id="reset">Спробувати ще раз</button></div>
          <div class="result" id="res"></div></div>
        ${hw}
      </div>
      <div class="side">
        ${workSide}
      </div>
    </div>
    <div class="nav">${navA(pl,n-1,"prev")}${navA(nl,n+1,"next")}</div></div>`;

  $("#check").onclick=()=>{let ok=0;const all=document.querySelectorAll(".qst");
    all.forEach(q=>{const c=q.dataset.c,sel=q.querySelector("input:checked");
      q.querySelectorAll(".opt").forEach(o=>{o.classList.remove("right","wrong");if(o.dataset.k===c)o.classList.add("right")});
      if(sel){if(sel.value===c)ok++;else sel.closest(".opt").classList.add("wrong");}});
    const r=$("#res"),p=ok/all.length;r.className="result show "+(p>=.75?"good":"mid");
    r.textContent=`Правильних відповідей: ${ok} з ${all.length}. `+(p===1?"Чудово!":p>=.75?"Добре! Перегляньте позначені питання.":"Перечитайте основну інформацію й спробуйте ще раз.");
    if(p>=.75){done[n]=true;store.set("go10_done",done);}};
  $("#reset").onclick=()=>{document.querySelectorAll(".qst input").forEach(x=>x.checked=false);document.querySelectorAll(".opt").forEach(o=>o.classList.remove("right","wrong"));$("#res").className="result";};
  document.title=`${l.title} · Громадянська освіта 10`;
}

function route(){ const n=parseInt(location.hash.slice(1)); if(n>=1&&n<=LESSONS.length) renderLesson(n-1); else renderHome(); window.scrollTo(0,0); }
function toggleTheme(){ const d=document.documentElement; const dark=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches; d.dataset.theme=dark?"light":"dark"; store.set("go10_theme",d.dataset.theme); }
const th=store.get("go10_theme"); if(th) document.documentElement.dataset.theme=th;
window.addEventListener("hashchange",route);
route();
</script>
