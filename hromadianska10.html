<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Громадянська освіта · 10 клас</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ed; --card:#ffffff; --ink:#1f1d1a; --muted:#6b6560; --line:#e7e1d8;
  --ok:#2f8a4f; --ok-soft:#e3f3e8; --bad:#c2382d; --bad-soft:#fae3e0;
  --shadow:0 1px 2px rgba(40,30,20,.04);
  --shadow-h:0 10px 28px rgba(40,30,20,.10);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#1b1a18; --card:#262421; --ink:#eeeae4; --muted:#a59e95; --line:#38342f;
  --ok:#7fcf98; --ok-soft:#1f3527; --bad:#f08b80; --bad-soft:#3e2523; --shadow:none; --shadow-h:0 10px 28px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
.page{max-width:1380px;margin:0 auto;padding:36px 36px 72px}
h1,h2,h3,.ttl{font-family:Montserrat,"Segoe UI",sans-serif}

/* hero */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px}
.hero .kick{font:700 13px Montserrat,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#ef8a00}
.hero h1{font-size:40px;line-height:1.15;margin:6px 0 10px;font-weight:800}
.hero p{margin:0;color:var(--muted);font-size:18px;max-width:720px}
.hero-actions{display:flex;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter,sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{box-shadow:var(--shadow-h)}
.btn.fill{background:var(--c,#ef8a00);border-color:var(--c,#ef8a00);color:#fff}
.icon-btn{width:42px;height:42px;justify-content:center;padding:0;font-size:18px}
.stats{display:flex;gap:22px;margin-top:16px;color:var(--muted);font-size:14px}
.stats b{color:var(--ink);font-size:18px;font-family:Montserrat,sans-serif}

/* sections */
.sec{margin-bottom:44px}
.sec-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.num{width:46px;height:46px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font:700 19px Montserrat,sans-serif;flex:0 0 auto}
.sec-h h2{margin:0;font-size:28px;font-weight:700;line-height:1.2}
.sec-body{display:grid;grid-template-columns:226px 1fr;gap:28px;align-items:start}
.cover{background:var(--card);border-radius:16px;border-top:6px solid var(--c);box-shadow:0 6px 18px rgba(40,30,20,.08);padding:30px 18px 0;text-align:center;overflow:hidden;min-height:318px;position:relative;display:flex;flex-direction:column;align-items:center}
.cover .ci{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;filter:saturate(1.1)}
.cover .rz{font:800 20px Montserrat,sans-serif;color:var(--c);letter-spacing:.04em;margin:30px 0 8px}
.cover .rn{font:700 11.5px Inter,sans-serif;line-height:1.35}
.cover .doodles{margin-top:auto;width:100%;padding:18px 0 14px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:30px;opacity:.85;filter:saturate(.75)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;text-decoration:none;min-height:142px;transition:box-shadow .15s,transform .15s;position:relative}
.tcard:hover{box-shadow:var(--shadow-h);transform:translateY(-2px)}
.tcard .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.tcard .tt{font-size:19px;line-height:1.35;margin:8px 0 14px;font-weight:500}
.tcard .tm{margin-top:auto;color:var(--muted);font-size:15px}
.tcard .chk{position:absolute;top:18px;right:18px;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.tcard .badge{display:inline-block;margin-left:6px;font:600 11px Inter,sans-serif;color:var(--c);border:1px solid var(--c);border-radius:999px;padding:0 7px;vertical-align:2px}

/* lesson */
.back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--muted);font-weight:600;margin-bottom:22px}
.back:hover{color:var(--c)}
.lhead{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px}
.lhead .tn{font:700 14px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.lhead h1{font-size:32px;line-height:1.25;margin:4px 0 10px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.chip.c{border-color:var(--c);color:var(--c)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px;margin-bottom:20px}
.box h3{margin:0 0 14px;font-size:20px;display:flex;align-items:center;gap:12px}
.box h3 .bi{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.box p{margin:0 0 10px}
.box ul,.box ol{margin:0 0 10px;padding-left:22px}
.box li{margin-bottom:4px}
.box h4{font:700 14px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.tbl{display:table}
@media(max-width:640px){.tbl{display:block;overflow-x:auto}}
ol.cols{columns:2;column-gap:28px}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:14.5px}
.tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.tbl th{background:var(--bg)}
.ktp{font-size:14.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.term{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.term:first-of-type{border-top:0;padding-top:0}
.term b{color:var(--c)}
.side{position:sticky;top:20px}
.bookpg{font:700 22px Montserrat,sans-serif;color:var(--c)}
.nobook{font-size:14.5px;line-height:1.5;background:var(--bg);border-left:4px solid var(--c);border-radius:8px;padding:10px 12px}
.small{font-size:13px;color:var(--muted)}
.vid{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000;display:block}
.vlink{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.qst{padding:16px 0;border-top:1px solid var(--line)}
.qst:first-of-type{border-top:0;padding-top:0}
.qst .qt{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:7px;cursor:pointer;font-size:15px;background:var(--card)}
.opt:hover{border-color:var(--c)}
.opt input{margin-top:5px;accent-color:var(--c)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.result{margin-top:14px;padding:12px 16px;border-radius:12px;font-weight:600;display:none}
.result.show{display:block}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.mid{background:var(--bad-soft);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.hw{border-left:6px solid var(--c)}
.train{display:flex;gap:16px;align-items:center;background:var(--card);border:2px solid var(--c);border-radius:16px;padding:18px 22px;margin-bottom:22px;font-size:16.5px;line-height:1.5}
.train b{color:var(--c);font-size:18px}
.train .ti{width:48px;height:48px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.work h4{font:700 15px Montserrat,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--c);margin:20px 0 10px}
.wmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
ol.plot{list-style:none;padding:0;margin:0;counter-reset:p}
ol.plot li{counter-increment:p;position:relative;padding:0 0 14px 44px;margin:0}
ol.plot li::before{content:counter(p);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;font:700 14px Montserrat,sans-serif}
ol.plot li:not(:last-child)::after{content:"";position:absolute;left:15px;top:32px;bottom:2px;width:2px;background:var(--line)}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.hero-c{background:var(--bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:14.5px;line-height:1.4}
.hero-c b{color:var(--c);font-size:15px}
.nav{display:flex;justify-content:space-between;gap:16px;margin-top:8px}
.nav a{flex:1;max-width:49%;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.nav a:hover{box-shadow:var(--shadow-h)}
.nav a.next{text-align:right;margin-left:auto}
.nav .tn{font:700 12px Montserrat,sans-serif;letter-spacing:.06em;color:var(--c);text-transform:uppercase}
.nav .t{font-size:15px;line-height:1.35}

@media (max-width:1100px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid{grid-template-columns:1fr}.side{position:static}}
@media (max-width:760px){
  .page{padding:22px 16px 56px}
  .hero h1{font-size:28px}.hero p{font-size:16px}
  .sec-h h2{font-size:22px}.num{width:38px;height:38px;font-size:16px}
  .sec-body{grid-template-columns:1fr}
  .cover{min-height:0;flex-direction:row;text-align:left;padding:16px;gap:14px;border-top-width:0;border-left:6px solid var(--c)}
  .cover .rz{margin:0 0 2px;font-size:16px}.cover .doodles{display:none}
  .cards{grid-template-columns:1fr}
  .tcard{min-height:0}
  .lhead h1{font-size:24px}
  .box{padding:18px 16px}
  ol.cols{columns:1}
  .nav{flex-direction:column}.nav a{max-width:none}
}
</style>
</head>

{info:`<p><b>Громадянська освіта</b> — інтегрований курс, що узагальнює суспільствознавчі предмети, які ви вивчали з початкової школи. Він допомагає глибше зрозуміти такі поняття, як <b>демократія</b>, <b>права людини</b>, <b>верховенство права</b>, <b>економіка</b>, і набути навичок, життєво необхідних кожному громадянину.</p>
<h4>Мета курсу</h4>
<ul><li>усвідомити себе громадянином / громадянкою України, знати свої права й обов'язки;</li>
<li>зрозуміти, що <b>свобода, рівність, відповідальність, соціальна згуртованість, різноманітність, повага, діалог</b> — це демократичні цінності;</li>
<li>дізнатися про вплив стереотипів і конфліктів на людину, способи протидії дискримінації, роль толерантності;</li>
<li>навчитися брати активну участь у житті школи, громади, суспільства.</li></ul>
<h4>Компетентності, які формує курс</h4>
<ul><li><b>знання та їх критичне розуміння;</b></li><li><b>практичні навички й уміння;</b></li><li><b>цінності;</b></li><li><b>ставлення та поведінкові установки.</b></li></ul>
<h4>Структура курсу — 7 розділів</h4>
<table class="tbl"><tr><th>№</th><th>Розділ</th></tr>
<tr><td>I</td><td>Особистість та її ідентичність</td></tr>
<tr><td>II</td><td>Права і свободи людини</td></tr>
<tr><td>III</td><td>Людина в соціокультурному просторі</td></tr>
<tr><td>IV</td><td>Демократичне суспільство та його цінності</td></tr>
<tr><td>V</td><td>Світ інформації та мас-медіа</td></tr>
<tr><td>VI</td><td>Взаємодія громадян і держави в досягненні суспільного добробуту</td></tr>
<tr><td>VII</td><td>Україна, Європа, світ</td></tr></table>
<p>Кожна тема починається з мотивації. Рубрики підручника: «Питання для обміркування», «Ідеї для дослідження», «Мовою документів», «Яскрава особистість», «Бюро корисної інформації», «Прокоментуйте філософську думку», «Рефлексія», «Знаємо. Розуміємо. Діємо». Вони розвивають критичне й логічне мислення, уміння працювати в парах і групах, вести дискусію.</p>`,

{info:`<p>Досі немає вичерпного наукового тлумачення людської сутності: людина — складна, багатоаспектна система. Її розкривають поняття <b>індивід, індивідуальність, особа (персона), особистість, громадянин</b>.</p>
<table class="tbl"><tr><th>Поняття</th><th>Зміст</th></tr>
<tr><td><b>Індивід</b></td><td>біологічна істота, що народилася; кожен окремий живий організм. Описується ознаками: зріст, вага, вік, колір очей. Має біологічні потреби (їжа, праця, відпочинок).</td></tr>
<tr><td><b>Індивідуальність</b></td><td>унікальне поєднання загального й особливого в людині; наслідок біології та впливу соціального середовища. У всесвіті немає двох однакових людей.</td></tr>
<tr><td><b>Особа (персона)</b></td><td>людина як учасник суспільних відносин і свідомої діяльності. Лат. <i>persona</i> — «маска» актора; персона — особистість у тому вигляді, у якому вона представлена іншим.</td></tr>
<tr><td><b>Особистість</b></td><td>людина, вихована суспільством. Її якості залежать від родини, оточення, школи, освіти, професії. Формується через <b>спадковість і середовище</b>.</td></tr>
<tr><td><b>Громадянин</b></td><td>людина, яка ототожнює себе з певною країною, має там юридичний статус, права та обов'язки.</td></tr></table>
<p>Розуміння людини як <b>повноправного партнера суспільства</b>, а не «ґвинтика», виникло з розвитком інституту громадянства в демократичних суспільствах.</p>
<p><b>Громадянськість</b> — свідоме й активне виконання громадянських обов'язків і розумне використання прав; сукупність якостей громадянина: зрілість політичної та правової свідомості, патріотизм, причетність до долі своєї країни.</p>
<p><b>Громадянська позиція</b> — гордість за свою країну, повага до її традицій, конституції, прав і обов'язків. Її проявляють активні дії: озеленення двору, прибирання території, допомога тим, хто потребує, боротьба з агресором і відстоювання цілісності держави.</p>
<p><i>«Людина — це обов'язок, а не титул… Людина — твориться, самонароджується».</i> — Василь Стус, лист до сина.</p>`,

// 3 Ідентичність (§2)
{info:`<p><b>Ідентичність</b> — ядро особистості, пов'язане з усвідомленням власного «Я», своєї унікальності й неповторності. Вона ґрунтується на <b>самосвідомості</b>.</p>
<h4>Види ідентичності</h4>
<ul><li><b>Особистісна</b> — зовнішня індивідуальність, темперамент, задатки, мотиви, переконання, цінності, інтереси, бачення майбутнього.</li>
<li><b>Соціальна</b> — ототожнення себе з іншими членами суспільства й групами, прийняття соціальних ролей (українець, учениця, син, футбольний фанат). Формується під впливом мовної, культурної, етнічної, релігійної належності.</li></ul>
<p>Соціолог <b>Чед Гордон</b> виокремив п'ять видів ідентичності: <b>статеву (гендерну)</b>, <b>етнічну</b>, <b>ідентичність членства</b> (у групах та організаціях), <b>політичну</b>, <b>за родом занять</b>.</p>
<p>Ідентичності бувають <b>явними</b> (ті риси, які бачать інші) і <b>прихованими</b> (розкриваються в спілкуванні та зближенні). Пізнання прихованих ідентичностей сприяє довірі й взаєморозумінню. За <b>Еріком Еріксоном</b>, ідентичність формується з того, як ти судиш про інших і як інші судять про тебе.</p>
<h4>Самоідентичність</h4>
<p>Формування самоідентичності починається з відповідей на запитання: «Хто я насправді?», «Що правильно, а що ні?», «Якими засадами керуватися?». Для цього треба розвивати <b>здатність робити вибір</b>. Принципи самоідентичності — <b>свобода особистості, взаємотолерантність і відповідальність</b>. Ідентичність не стала: вона змінюється впродовж життя.</p>
<h4>Гідність і совість</h4>
<p><b>Совість</b> — усвідомлення особистістю своїх обов'язків і відповідальності перед людьми; самооцінка й самоконтроль поведінки, <b>внутрішній регулятор вчинків</b>. Вона формується поступово і може прогресувати чи деградувати.</p>
<p><b>Гідність</b> належить людині від народження, не відчужується й не передається. Особиста гідність — моральне ставлення до себе, самоповага. <b>Честь</b> — зовнішнє визнання, оцінка людини іншими.</p>
<p><i>«Совість — це закон, який живе в нас самих».</i> — І. Кант</p>`,
terms:[["Ідентичність","усвідомлення власного «Я», своєї унікальності й належності до груп"],["Особистісна ідентичність","сукупність індивідуальних рис, цінностей, інтересів людини"],["Соціальна ідентичність","ототожнення себе з групами суспільства, прийняття соціальних ролей"],["Совість","внутрішній регулятор вчинків, самооцінка й самоконтроль поведінки"],["Гідність","моральне ставлення до себе, самоповага; належить людині від народження"],["Честь","зовнішнє визнання, оцінка дій людини іншими"]],

// 4 Соціалізація (§3)
{info:`<p>Людина до 30 років знайома з понад 700 особами, і в кожної вона чогось навчається — так відбувається входження в культуру, тобто <b>соціалізація</b>.</p>
<p><b>Соціалізація</b> — процес засвоєння людиною системи знань, норм і цінностей, що дозволяють їй бути повноправним членом суспільства. Саме соціалізація <b>перетворює біологічного індивіда на соціальну істоту</b>: людина вчиться виконувати соціальні ролі та взаємодіяти з іншими.</p>
<p>Люди пов'язані не лише природними й родинними, а й <b>соціальними відносинами</b>: виробничими, економічними, політичними, правовими, моральними, релігійними. <b>Соціальність</b> — сукупність якостей, що перетворюють біологічну істоту на культурну людину (розум, мислення, самопізнання, самосвідомість).</p>
<h4>Погляди філософів</h4>
<ul><li><b>Жан-Поль Сартр:</b> людина сама творить себе, конструює свою «сутність». Вона вільна в самовизначенні, але не може уникнути вибору.</li>
<li><b>Хосе Ортега-і-Гассет:</b> життя — це наш діалог з обставинами; основні елементи життя — обставини й рішення, які ми ухвалюємо.</li></ul>
<p><b>Самовизначення</b> — процес і результат вибору особистістю своєї позиції, цілей і способів самоздійснення.</p>
<h4>Етапи соціалізації (за Е. Еріксоном)</h4>
<p>немовля → раннє дитинство → вік гри → шкільний вік → юність → молодість → дорослість → зрілий вік (старість).</p>
<p>Кожному вікові відповідають свої <b>інститути соціалізації</b>: сім'я, дитячий садок, школа, інші освітні заклади, трудовий колектив. Люди погано виконують ті соціальні ролі, зміст яких не приймають. Життєвого успіху досягає той, хто використовує свій потенціал і постійно вдосконалюється.</p>`,

// 5 Сім'я (§4)
{info:`<p><b>Сім'я</b> — перша ланка соціалізації особистості й основний соціальний інститут. Саме в сім'ї відбувається <b>первинна соціалізація</b>: дитина сприймає світ через призму батьківського світогляду й переймає як позитивні, так і негативні риси поведінки дорослих. 15 травня — Міжнародний день сім'ї (ООН).</p>
<h4>Функції сім'ї</h4>
<ul><li><b>репродуктивна</b> — народження дітей, продовження роду;</li>
<li><b>соціалізації</b> — формування особистості дитини, виховання;</li>
<li><b>економічна</b> — забезпечення рівня життя, організація побуту;</li>
<li><b>психологічної підтримки</b> членів сім'ї одне одного.</li></ul>
<p>З віком центр соціалізації зміщується із сім'ї до групи однолітків. Найкраща для соціалізації — сім'я з <b>партнерськими відносинами</b> («горизонтальна», демократична): немає вертикалі влади, усі рівні, думка дітей важлива, а сталість родини тримається на цінностях.</p>
<h4>Види сучасних сімей</h4>
<table class="tbl"><tr><th>Ознака</th><th>Види</th></tr>
<tr><td>Кількість поколінь</td><td>однопоколінна (без дітей); двопоколінна, <b>нуклеарна</b> (батьки й діти); розширена (три й більше поколінь)</td></tr>
<tr><td>Наявність батьків</td><td>повна; неповна (діти з одним із батьків)</td></tr>
<tr><td>Склад</td><td><b>змішана</b> — сім'я повторного шлюбу або з дитиною, узятою на виховання</td></tr>
<tr><td>Кількість дітей</td><td>бездітні, однодітні, малодітні, багатодітні</td></tr>
<tr><td>Розподіл ролей</td><td>авторитарна, демократична, автономна</td></tr>
<tr><td>Юридичне оформлення</td><td>офіційно зареєстрована, громадянська</td></tr></table>
<p>Нові типи: <b>крос-культурні</b> сім'ї, сім'ї різних конфесій, батьки-одинаки. Сучасні тенденції: відкладання шлюбу, зниження народжуваності, зростання кількості неповних сімей, старіння населення — тому розбудова інституту сім'ї є важливим завданням.</p>`,

<p><b>Субкультура</b> — культура окремої соціальної групи, що відрізняється від загальної культури. Деякі субкультури зникають, інші входять до загальнолюдської культури.</p>
<p><b>Причини виникнення молодіжних субкультур:</b> прагнення самореалізації, бажання привернути увагу, належати до групи й водночас протиставити себе суспільству. Молодіжна субкультура виокремилася в першій половині ХХ ст. разом з індустрією молодіжної моди, розваг, шоу-бізнесу. Її ознаки — сленг, нові форми комунікації, зовнішня атрибутика.</p>
<h4>Приклади субкультур</h4>
<ul><li><b>Хіп-хоп</b> — започаткований близько 1969 р. ді-джеєм Кул Херком у Південному Бронксі (Нью-Йорк); дав світу стиль <b>реп</b>.</li>
<li><b>Панки</b> — середина 1960-х, США й Велика Британія; швидкий рок, протест проти істеблішменту, епатажний вигляд (ірокези, ланцюги), ідея ненасильства.</li>
<li><b>Готи</b> — початок 1980-х, на хвилі постпанку; естетика готичного роману, готик-рок.</li>
<li><b>Геймери</b> — захоплення комп'ютерними іграми; з 2000 р. проводиться чемпіонат World Cyber Games.</li>
<li><b>Блогери</b> — ведуть публічні щоденники в інтернеті, коментують одне одного.</li></ul>
<p>Вплив субкультур буває <b>позитивним</b> (навички взаємодії, самореалізація) і <b>негативним</b> (агресія, підміна реального життя віртуальним). Головний орієнтир у колі однолітків — <b>загальнолюдські цінності</b>.</p>`,

// 7 Самореалізація (§6)
{info:`<p>Розвиток особистості, або <b>самореалізація</b>, залежить від потреб, мотивів, мрій, переконань, можливостей і дій. Самореалізація — потреба бути почутим і прийнятим суспільством, знайти своє місце в житті, досягти успіху.</p>
<h4>Потреби особистості</h4>
<ul><li><b>біологічні</b> — їжа, праця, відпочинок;</li><li><b>соціальні</b> — спілкування, суспільна діяльність;</li><li><b>матеріальні</b> — одяг, житло, побутові речі;</li><li><b>духовні</b> — моральний обов'язок, пізнання, дружба, кохання.</li></ul>
<p><b>Піраміда потреб А. Маслоу:</b> фізіологічні → безпеки → соціальні → поваги → самовираження (вершина).</p>
<p><b>Мотивація</b> — процес спонукання себе до діяльності для досягнення цілей. Наявність мети розвиває наполегливість, упевненість, ініціативність.</p>
<p><b>Задатки</b> — вроджені фізичні й психічні властивості (музичний слух, точна пам'ять). На їх основі в діяльності розвиваються <b>здібності</b>.</p>
<p><b>Автономія особистості</b> — здатність ухвалювати свідомі рішення щодо себе незалежно від тиску оточення, брати відповідальність за свої дії; передбачає самопізнання й самооцінку.</p>
<h4>Життєві цінності та пріоритети</h4>
<ul><li><b>Матеріальні цінності (блага)</b> — їжа, житло, техніка, засоби праці.</li>
<li><b>Духовні цінності</b> — добро, любов, справедливість, честь, гідність, обов'язок, краса.</li></ul>
<p>Цінності й пріоритети взаємопов'язані та змінні. Щоб визначити пріоритети, варто запитати себе: «Чого я хочу від життя?», «Ким хочу стати?». Пріоритетів не має бути забагато — треба зосередитися на головному.</p>
<p><b>Здоров'я</b> — за статутом ВООЗ, «стан повного фізичного, духовного і соціального благополуччя, а не тільки відсутність хвороб і фізичних вад». Це пріоритетна цінність для більшості людей. <i>«Добути і зберегти своє здоров'я може тільки сама людина»</i> — Микола Амосов, видатний український кардіохірург.</p>`,
terms:[["Самореалізація","потреба знайти своє місце в житті, бути прийнятим суспільством і досягти успіху"],["Мотивація","процес спонукання себе до діяльності для досягнення цілей"],["Задатки","вроджені фізичні й психічні властивості людини"],["Здібності","якості, що розвиваються із задатків у процесі діяльності"],["Автономія особистості","здатність ухвалювати свідомі рішення незалежно від зовнішнього впливу"],["Здоров'я","стан повного фізичного, духовного й соціального благополуччя (ВООЗ)"]],

// 8 Мобільність, адаптивність, креативність (§7)
{info:`<p><b>Особистісний розвиток</b> — особистісне зростання й самовдосконалення через саморефлексію, саморозуміння й самокритичність. Його ефективність залежить від <b>самопрогнозування</b> — уміння передбачати результати своєї діяльності й поведінки.</p>
<h4>Мобільність</h4>
<p><b>Мобільність</b> (рухливість, мінливість) — здатність до швидкої дії та зміни станів, уміння аналізувати свої дії й змінювати життєдіяльність. Типи: <b>соціальна, професійна, академічна, інтелектуальна, культурна</b>.</p>
<p><b>Соціальна мобільність</b> — переміщення людини між елементами соціальної структури (класами, верствами, групами), з одного рівня добробуту, престижу й влади на інший. Залежить від професіоналізму, освіченості, амбітності. Буває <b>вимушеною</b> (через обставини) і <b>добровільною</b>. Успішна мобільність зміцнює віру в справедливість суспільства, невдала — веде до соціальної апатії.</p>
<h4>Адаптивність</h4>
<p><b>Адаптивність</b> — здатність особистості до внутрішніх і зовнішніх перетворень, щоб зберігати рівновагу з довкіллям і ефективно діяти в умовах невизначеності. Адаптивні люди впевнені в собі, не бояться змін, винахідливі, оптимістичні, відкриті до нового.</p>
<h4>Креативність</h4>
<p><b>Креативність</b> — творча новаторська діяльність, здатність продукувати нові ідеї, нестандартні рішення; нешаблонне критичне мислення, уява, задоволення від творчості.</p>
<p><b>Богдан Гаврилишин</b> — економіст, член Римського клубу — назвав риси успішної людини: креативність (зберегти трохи дитинства й мрій), постійне навчання, сильна воля й самодисципліна, віра у свої сили, сміливі мрії.</p>`,

// 9 Практичне заняття №1
{info:`<p><b>Практичне заняття №1</b> за розділом «Особистість та її ідентичність». Мета — застосувати знання про людину, ідентичність, соціалізацію й самореалізацію.</p>
<h4>Коротко повторимо</h4>
<ul><li>Людина = <b>індивід</b> (біологія) + <b>особистість</b> (соціальне) + <b>громадянин</b> (правовий зв'язок із державою).</li>
<li><b>Ідентичність</b>: особистісна та соціальна; явна й прихована; змінюється протягом життя.</li>
<li><b>Соціалізація</b> відбувається через сім'ю, однолітків, школу, трудовий колектив.</li>
<li><b>Самореалізація</b> залежить від потреб, мотивації, задатків, цінностей; її підтримують мобільність, адаптивність, креативність.</li></ul>
<h4>Практичні завдання</h4>
<ol><li><b>Дерево ідентичностей.</b> Намалюйте своє дерево: у корінні — спадковість, задатки, цінності; на гілках — ролі (учень, син/донька, друг, член клубу). Позначте явні та приховані ідентичності.</li>
<li><b>Життєвий план.</b> Сформулюйте 3 короткострокові та 2 довгострокові цілі. Що робити, якщо план не реалізується?</li>
<li><b>Таблиця самореалізації.</b> Заповніть: складники самореалізації — чинники, що сприяють розвитку, — чинники, що заважають, і як їх усунути.</li>
<li><b>Соціалізація серед однолітків.</b> Назвіть позитивні й негативні наслідки спілкування в групі однолітків.</li>
<li><b>Здоровий спосіб життя.</b> Визначте 5 критеріїв ЗСЖ і придумайте, як їх прорекламувати.</li>
<li>Поміркуйте над рядками В. Симоненка: <i>«Ти знаєш, що ти — людина? Ти знаєш про це чи ні?»</i> Як ви розумієте поняття «індивідуальність»?</li></ol>`,

// 11 Людська гідність (§8)
{info:`<p><b>Гідність</b> (за Академічним тлумачним словником) — 1) сукупність рис, що характеризують позитивні моральні якості; 2) усвідомлення людиною своєї громадської ваги, громадського обов'язку. Гідність пов'язана зі справедливістю, повагою до свого й чужого життя, доброзичливістю, порядністю.</p>
<p><b>Людська гідність</b> — найвища фундаментальна цінність і невід'ємне <b>особисте немайнове право</b> кожної людини. Вона не тотожна <b>особистій гідності</b> — стану усвідомлення особою власної цінності в суспільстві. З поширенням поняття гідності розширювався й перелік прав: політичні, економічні, соціальні, культурні, а нині — колективні (право на мир, на розвиток) та біомедичні.</p>
<h4>Гідність у міжнародних документах</h4>
<ul><li><b>Загальна декларація прав людини (ООН, 10 грудня 1948 р.)</b>: «визнання гідності, властивої всім членам людської сім'ї, і рівних та невід'ємних їхніх прав є основою свободи, справедливості та загального миру». Ст. 1: «Всі люди народжуються вільними і рівними у своїй гідності та правах». Гарантія поваги до гідності — <b>заборона тортур</b>, жорстокого чи нелюдського поводження.</li>
<li><b>Конвенція Ради Європи про захист прав людини й основоположних свобод (4 листопада 1950 р.)</b> — забороняє катування та поводження, що принижує гідність.</li>
<li><b>Заключний акт НБСЄ (1 серпня 1975 р.)</b> — уперше назвав людську гідність основою прав людини: усі права «витікають з гідності, притаманної людській особистості».</li></ul>
<h4>Захист гідності в Україні</h4>
<p>Законодавство забороняє фізичне покарання; кримінальне право не містить покарань, що передбачають мордування чи приниження честі й гідності. Встановлено відповідальність за <b>наклеп</b> (поширення неправдивих вигадок, що ганьблять людину) та образу гідності. З 2001 р. наклеп в Україні не є злочином — честь, гідність і ділову репутацію захищають у цивільному суді (ст. 277 ЦК).</p>
<h4>Гуманізм</h4>
<p><b>Гуманізм</b> — система ідей і поглядів на людину як на найбільшу соціальну цінність, створення умов для її повноцінного фізичного й духовного розвитку. У сучасному значенні термін уперше вжив данський філософ <b>Габріель Сібберн</b> («Про гуманізм», 1858). Гуманізм лежить в основі захисту гідності, державної політики в освіті й соціальному захисті, благодійності, медичної допомоги, захисту тварин і довкілля. Ключові ідеї: гідність — головна соціальна цінність, свобода вибору (слова, совісті), відповідальність перед іншими, толерантність, діалог.</p>`,

// 12 Еволюція прав людини (§9)
{info:`<p><b>Права людини</b> визначають як: можливості, необхідні для існування й розвитку людини; вимоги людини до держави й суспільства; правила для державних органів у стосунках з людиною; базові стандарти, без яких неможливе повноцінне життя.</p>
<h4>Історія ідеї прав людини</h4>
<ul><li><b>Античність:</b> концепція <b>природного права</b> — свобода й рівність є природним станом (Аристотель, Алкідамант: «ніхто не є рабом від природи», Антіфонт).</li>
<li><b>Київська держава:</b> «Руська правда»; договір Русі з Візантією <b>912 р.</b> закріпив право обвинуваченого на розгляд справи судом.</li>
<li><b>Поч. ХХ ст.:</b> Ліга Націй і Міжнародна організація праці — права людини стають предметом міжнародного права.</li>
<li><b>10 грудня 1948 р.</b> — <b>Загальна декларація прав людини</b>; цей день — Міжнародний день прав людини.</li></ul>
<p><b>Декларація</b> — міжнародний документ, що закріплює принципи; не є обов'язковою, але має величезну морально-політичну силу й стає основою договорів.</p>
<h4>Права і свободи</h4>
<p><b>Свобода</b> — стан, що передбачає можливість обирати варіанти дій на свій розсуд. Принципи: усі люди вільні від народження; свобода — робити все, що не шкодить іншим; межі свободи визначає лише закон («дозволено все, що не заборонено законом»). <b>Громадянські свободи</b> входять до прав людини, тому права — ширша категорія.</p>
<p><b>Основоположні права</b> належать від народження, не даровані державою, їх не купують і не успадковують. Стрижневе — <b>право на життя</b>; в Україні смертну кару скасовано. Ознаки прав людини: <b>вроджені, універсальні, невід'ємні, вразливі</b> (можуть бути порушені, але не припинені), життєво необхідні.</p>

{info:`<p>Права людини класифікують умовно, адже вони <b>взаємозалежні й взаємопов'язані</b>. Окрім поділу на покоління, права поділяють <b>за сферами життєдіяльності</b>.</p>

<tr><td><b>Політичні</b></td><td>свобода слова, зборів, мітингів; участь в управлінні державою; право на інформацію; об'єднання в партії</td></tr>
<tr><td><b>Економічні</b></td><td>право на працю, вільний вибір професії, приватну власність — забезпечують економічну свободу; характеризують державу як соціальну</td></tr>
<tr><td><b>Соціальні</b></td><td>соціальне забезпечення, достатній життєвий рівень, охорона здоров'я, медична допомога</td></tr>
<tr><td><b>Екологічні</b></td><td>безпечне для життя й здоров'я довкілля, відшкодування збитків від природних і техногенних катастроф</td></tr>
<tr><td><b>Культурні</b></td><td>доступ до духовних здобутків, свобода творчості, участь у культурному житті; особливе місце — <b>право на освіту</b></td></tr></table>
<p>Економічні, соціальні та культурні права закріплено в <b>Міжнародному пакті про економічні, соціальні та культурні права (16 грудня 1966 р.)</b>; УРСР ратифікувала його 1973 р. Під час війни в Україні соціальні й трудові права зазнали значних обмежень.</p>
<h4>Борці за права людини</h4>
<p>Махатма Ганді, Мартін Лютер Кінг, Альберт Швейцер, Андрій Сахаров, Мати Тереза, Іоанн Павло ІІ, Вацлав Гавел, <b>Нельсон Мандела</b>. Українці: <b>Оксана Мешко</b> (співзасновниця Української Гельсінської групи 1976 р.), <b>Петро Григоренко</b> (генерал-дисидент, захисник пригноблених народів), <b>Мустафа Джемілєв</b> (лідер кримськотатарського національного руху, 15 років ув'язнення).</p>
<h4>Майбутнє прав людини — четверте покоління</h4>
<p>Розвиток науки (клонування, трансплантація, генна інженерія, віртуальна реальність) породжує <b>нові права</b>, які умовно відносять до <b>четвертого покоління</b>. Серед них — <b>біомедичні права</b>: право на інформацію про свій діагноз, участь у виборі лікування, відмову від лікування. Документи: <b>Конвенція Ради Європи про права людини та біомедицину (1997)</b> — будь-яке медичне втручання лише за добровільною свідомою згодою; <b>Загальна декларація ЮНЕСКО про геном людини і права людини (1997)</b>. Термін <b>«евтаназія»</b> («легка смерть») увів Френсіс Бекон.</p>
<p>Права людини — динамічна практика. Їхнє майбутнє залежить від кожного з нас; права людини — фундамент миру.</p>`,

// 14 Людина і держава (§11)
{info:`<p>Сучасна демократична держава має на меті не підкорення людей, а <b>допомогу людині</b>. Держава й людина — <b>рівноправні партнери</b>. Найповніше демократична сутність реалізується, коли держава є одночасно <b>соціальною і правовою</b>.</p>
<p><b>Правова держава</b> — держава, де панує право, діє верховенство закону, усі рівні перед законом і незалежним судом, гарантуються права людини, а влада поділена на <b>законодавчу, виконавчу й судову</b>.</p>
<h4>Верховенство права</h4>
<p><b>Принцип верховенства права</b> означає, що всі люди в державі рівні перед законом і ніхто не може бути вищим за закон. В Україні його закріплює <b>ст. 8 Конституції</b>. Венеціанська комісія (2011) визнала найкращим визначення <b>Тома Бінгема</b>: усі особи та владні інститути мають підкорятися публічно створеним законам.</p>
<p><b>Елементи верховенства права:</b></p>
<ol><li>законність (прозорий, підзвітний, демократичний процес ухвалення законів);</li><li>юридична визначеність;</li><li>заборона свавілля;</li><li>доступ до правосуддя в незалежних і безсторонніх судах;</li><li>дотримання прав людини;</li><li>заборона дискримінації та рівність перед законом.</li></ol>
<p>Стан верховенства права у світі досліджує <b>World Justice Project</b> (Rule of Law Index) за 8 показниками: обмеження влади, відсутність корупції, порядок і безпека, основні права, прозорість, дотримання законів, цивільне й кримінальне правосуддя.</p>
<h4>Зобов'язання держави та гарантії</h4>
<ul><li><b>Негативні зобов'язання</b> — утриматися від дій (не катувати, не обмежувати свободу слова).</li>
<li><b>Позитивні зобов'язання</b> — вжити активних заходів (наприклад, забезпечити право на житло).</li></ul>
<p><b>Гарантії</b> — система норм, принципів і вимог, що забезпечують дотримання прав людини (економічні, політичні, юридичні). Найвища гарантія — неухильне дотримання Конституції та законів. <b>Гарант</b> Конституції, прав і свобод — <b>Президент України</b>; Кабінет Міністрів, місцеві адміністрації, органи самоврядування також забезпечують права.</p>
<p><b>Принципи судового захисту:</b> рівність перед законом, гласність суду, кваліфікована юридична допомога, змагальність, <b>презумпція невинуватості</b>, незалежність і неупередженість суду, право на відшкодування збитків від несправедливого звинувачення. Зобов'язання держави щодо прав людини не зникають і під час збройного конфлікту.</p>`,

{info:`<p>Ставлення до дітей змінювалося: в античності небажану дитину могли вбити, в добу індустріалізації дитячу працю жорстоко експлуатували. Із середини XIX ст. сформувалося розуміння, що діти — не «маленькі дорослі» й потребують особливого захисту.</p>
<h4>Етапи становлення прав дитини</h4>
<table class="tbl"><tr><th>Рік</th><th>Подія</th></tr>
<tr><td>1841, 1881</td><td>Франція: закон про захист дитини на робочому місці; право дитини на освіту</td></tr>
<tr><td>1924</td><td><b>Женевська декларація прав дитини</b> (Ліга Націй) — 5 принципів обов'язку дорослих щодо дітей</td></tr>
<tr><td>1946</td><td>створено <b>Дитячий фонд ООН (ЮНІСЕФ)</b></td></tr>
<tr><td>1948</td><td>ст. 25 Загальної декларації: материнство й дитинство мають право на особливе піклування</td></tr>
<tr><td>1959</td><td><b>Декларація прав дитини</b> ООН — 10 принципів</td></tr>
<tr><td>1979</td><td>Міжнародний рік дитини; Польща запропонувала розробити Конвенцію</td></tr>
<tr><td><b>20.11.1989</b></td><td>ГА ООН прийняла <b>Конвенцію про права дитини</b>; чинна з 2.09.1990; Україна ратифікувала <b>27.02.1991</b>. Ратифікували 196 країн (не ратифікували лише США)</td></tr></table>
<p><b>Дитина</b> — кожна людина до 18 років. В Україні до 14 років — <b>малолітня</b>, з 14 до 18 — <b>неповнолітня</b>. Права дитини випливають з її гідності; дитину не можна позбавити прав за невиконання обов'язків — можна позбавити лише привілеїв.</p>
<p><b>Конвенція</b> — «дитяча конституція світу»: преамбула, 3 частини, 54 статті. Права: на життя, ім'я, громадянство, знати батьків і піклування, збереження індивідуальності, вільно висловлювати думку, свобода думки, совісті, асоціацій; на освіту, відпочинок, дозвілля, охорону здоров'я; захист від економічної й сексуальної експлуатації, наркотиків, торгівлі дітьми, жорстокого поводження. До неповнолітніх заборонено застосовувати смертну кару й довічне ув'язнення без права звільнення.</p>
<p><b>Загальні принципи Конвенції:</b> свобода від дискримінації (ст. 2); найкраще забезпечення інтересів дитини (ст. 3); право на життя, виживання й розвиток (ст. 6); повага до поглядів дитини (ст. 12).</p>
<h4>Захист прав дитини в Україні</h4>
<p>Права дитини захищають Президент, народні депутати, Кабмін, суди, прокуратура, адвокатура, органи самоврядування, <b>Уповноважений Президента України з прав дитини</b>. <b>Шляхи захисту:</b> самозахист; захист батьками; звернення до органів опіки та піклування, суду, органів влади, громадських і міжнародних організацій. Війна порушує всі права дітей: на життя, здоров'я, освіту, право бути з батьками.</p>`,

// 16 Механізми захисту прав (§13)
{info:`<p>Права людини мають <b>вертикальний характер</b>: вони стосуються відносин між <b>державою (владою)</b> і громадянином. Порушити права людини може лише держава або її представник — посадовець, суддя, поліцейський, учитель чи директор державної школи. Злочин одного громадянина проти іншого — це порушення прав, але не «порушення прав людини».</p>
<p><b>Юридичний механізм захисту прав людини</b> — можливості громадян здійснювати певні дії для захисту своїх прав (захист життя і здоров'я, збори, мітинги, письмові звернення, захист у суді й міжнародних органах) та система органів, які ці права забезпечують.</p>
<h4>Національні механізми</h4>
<p>Верховна Рада, Президент, Конституційний Суд, Кабінет Міністрів, органи виконавчої влади, органи місцевого самоврядування, СБУ, прокуратура, суд, політичні партії, громадські організації, профспілки. Парламентський контроль здійснює <b>Уповноважений Верховної Ради України з прав людини</b> (омбудсман), який щороку звітує перед парламентом.</p>
<p><b>Правозахисні громадські організації:</b> Українська Гельсінська спілка з прав людини, Український центр прав людини, «Ла Страда-Україна», Харківська правозахисна група, Amnesty International — виявляють порушення, ведуть діалог із державою, моніторинг, дослідження.</p>
<h4>Міжнародні механізми</h4>
<p>Держави беруть на себе зобов'язання дотримуватися <b>міжнародних стандартів</b> прав людини: конвенції про геноцид (1948), статус біженців (1951), расову дискримінацію (1965), проти тортур (1984), про дискримінацію жінок (1979), про права дитини (1989) та ін.</p>
<p><b>Європейська конвенція з прав людини</b> чинна для України з <b>1997 р.</b> — відтоді громадяни можуть звертатися до <b>Європейського суду з прав людини (ЄСПЛ, Страсбург)</b>. Його рішення обов'язкові для держави.</p>
<p><b>Умови звернення до ЄСПЛ:</b></p>
<ul><li>порушення вчинила держава (органи влади), а не приватна особа, після ратифікації Конвенції;</li>
<li>вичерпано <b>всі національні засоби</b> захисту (усі судові інстанції);</li>
<li>порушено право, гарантоване Конвенцією;</li>
<li>заяву подано протягом встановленого строку від рішення останньої інстанції (у підручнику — 6 місяців; з 2022 р. — 4 місяці);</li>
<li>лист можна писати рідною мовою, додавши копії документів.</li></ul>
<p>Інші міжнародні органи: Комітет ООН з прав людини, Комітет з прав дитини, Верховний комісар ООН з прав людини тощо.</p>`,

// 17 Практичне заняття №2 (§14)
{info:`<p><b>Практичне заняття №2.</b> Тема: права людини та права дитини в умовах збройного конфлікту. Міжнародне гуманітарне право.</p>
<p>Унаслідок російської агресії з 2014 р. на території України триває збройний конфлікт, а з 2022 р. — повномасштабна війна. <b>Збройний конфлікт</b> — збройне зіткнення між державами (міжнародний, включно з окупацією) або між сторонами в межах однієї держави (внутрішній).</p>
<p>Під час війни права людини <b>не припиняють дії</b>; деякі з них держава може обмежити. Але <b>завжди</b> мають бути забезпечені: право на життя, особиста недоторканність, заборона катувань і рабства, свобода думки й віросповідання, заборона дискримінації, право на справедливий суд.</p>
<h4>Міжнародне гуманітарне право (МГП)</h4>
<p><b>МГП</b> — система принципів і норм міжнародного права, що регулюють захист жертв війни, обмежують засоби й методи ведення війни та встановлюють відповідальність за порушення. Діє <b>лише під час збройного конфлікту</b>. Основа — <b>чотири Женевські конвенції 12 серпня 1949 р.</b> і додаткові протоколи (1977, 2005).</p>
<p><b>Жертви війни:</b> цивільні особи; ті, хто не воює або припинив воювати (полонені, поранені, хворі); <b>комбатанти</b> — законні учасники війни (особовий склад збройних сил).</p>
<p><b>Прості правила МГП:</b> не нападати на цивільних і цивільні об'єкти; не застосовувати заборонену зброю; гуманно поводитися з полоненими, пораненими, хворими; захищати жертв конфлікту.</p>
<table class="tbl"><tr><th>Принцип МГП</th><th>Суть</th></tr>
<tr><td><b>Розрізнення</b></td><td>завжди відрізняти цивільних і цивільні об'єкти від комбатантів і військових об'єктів</td></tr>
<tr><td><b>Пропорційність</b></td><td>напад заборонено, якщо шкода цивільним надмірна порівняно з військовою перевагою</td></tr>
<tr><td><b>Обережність</b></td><td>турбота про збереження цивільного населення й об'єктів під час операцій</td></tr></table>
<p>Заборонено зброю, що завдає надмірних страждань (хімічна, ядерна, деякі види звичайної). За порушення МГП відповідають винні особи — у національних судах і <b>міжнародних кримінальних судах чи трибуналах</b>. У мирний час діє право прав людини, у воєнний — обидві галузі.</p>
<h4>Практичні завдання</h4>
<ol><li>Визначте, які права дитини порушуються під час війни (за даними childrenofwar.gov.ua).</li><li>Складіть перелік повноважень Уповноваженого Президента з прав дитини.</li><li>Випишіть зі статей Конституції України гарантії прав людини й дитини.</li><li>Знайдіть справу ЄСПЛ щодо України та дослідіть, як рішення було виконано.</li></ol>`,

// 19 Соціокультурна багатоманітність (§15)
{info:`<p><b>Суспільство (соціум)</b> — сукупність людей, об'єднаних певними відносинами, зумовленими способом виробництва матеріальних і духовних благ, що змінюються впродовж історії. Так називають і конкретне суспільство, наприклад українське.</p>
<p><b>Ознаки суспільства:</b> спільна територія проживання; цілісність; сталість (існує довше за життя одного покоління); здатність відтворювати й підтримувати внутрішні зв'язки; певний рівень культури й власна система цінностей; самодостатність, саморозвиток і саморегулювання.</p>
<h4>Соціальні інститути</h4>
<p><b>Соціальний інститут</b> — відносно стійка модель поведінки людей і організацій у певній сфері життя суспільства. Бувають <b>формальні</b> (освіта, уряд — регулюються законами) і <b>неформальні</b> (клуби, фонди за інтересами).</p>
<ul><li><b>економічні</b> — гроші, ринок, корпорації (виробництво й розподіл благ);</li>
<li><b>політичні</b> — уряд, парламент, поліція, армія (влада);</li>
<li><b>культурні й виховні</b> — сім'я, школа, наукові, мистецькі, релігійні організації.</li></ul>
<h4>Соціальна структура і стратифікація</h4>
<p><b>Соціальна структура</b> — ієрархічно впорядкована сукупність індивідів, груп, спільнот, організацій, інститутів, пов'язаних стійкими зв'язками. <b>Соціальний статус</b> — положення людини в суспільстві, авторитет і повага.</p>
<p><b>Соціальна стратифікація</b> — вертикальне розшарування суспільства за чотирма критеріями нерівності: <b>прибуток, освіта, доступ до влади, престиж професії</b>. Е. Гідденс виділяв історичні типи: рабство, касти, стани, класи.</p>
<ul><li><b>Еліта</b> — вищі класи: політичні лідери, успішні бізнесмени, видатні вчені й митці.</li>
<li><b>Середній клас</b> — люди зі стійкими доходами, високою освітою й кваліфікацією: дрібні й середні підприємці, учителі, лікарі, юристи, кваліфіковані робітники. У розвинених країнах ≈ 80 % населення; структура має форму <b>ромба</b>. Середній клас — основа стабільності й добробуту.</li>
<li><b>Нижчі прошарки</b> — некваліфіковані робітники, безробітні, <b>маргінали</b> (люди, що втратили попереднє становище й не адаптувалися).</li></ul>
<h4>Соціальні цінності</h4>
<p><b>Соціальна згуртованість</b> — участь членів суспільства в політичному, економічному, культурному житті; почуття солідарності й належності, засноване на використанні громадянських прав. Мета — добробут більшості, подолання соціальної ізоляції.</p>
<p><b>Відповідальність</b> — усвідомлення власних обов'язків та їх виконання. Згуртованість, <b>солідарність</b> і відповідальність — базові соціальні цінності. <i>«Бути вільними — це бути відповідальними»</i> (Любомир Гузар).</p>`,
terms:[["Суспільство","сукупність людей, об'єднаних історично сформованими відносинами"],["Соціальний інститут","стійка модель поведінки людей і організацій у певній сфері суспільства"],["Соціальна стратифікація","вертикальне розшарування суспільства за доходом, освітою, владою, престижем"],["Середній клас","група людей зі стійкими доходами, освітою й економічною незалежністю"],["Маргінали","люди, що втратили соціальне становище й не адаптувалися до нових умов"],["Соціальна згуртованість","почуття солідарності й участь людей у житті суспільства"]],

// 20 Етнічна, конфесійна, гендерна різноманітність (§16)
{info:`<p>Сучасне українське суспільство <b>полікультурне</b>. <b>Полікультурність</b> (культурна різноманітність) — співіснування в межах однієї країни багатьох культур, жодна з яких не є панівною. В Україні проживають представники <b>понад 130 національностей</b>. Полікультурне суспільство — «повноводна ріка, що живиться зі струмків національних культур».</p>
<h4>Конфесійна різноманітність</h4>
<p><b>Конфесія</b> — 1) віросповідання; 2) самостійний релігійний напрям. В Україні діють понад 120 деномінацій і релігійних рухів; близько 97 % релігійних організацій — християнські (православні, протестантські, католицькі). Є етноконфесійні громади (мусульмани, юдеї, Вірменська апостольська церква, Закарпатська реформатська церква та ін.). Міжконфесійний діалог підтримує <b>Всеукраїнська рада церков і релігійних організацій</b> (з 1996 р.).</p>
<p><b>Міжкультурний діалог</b> — відкритий і шанобливий обмін думками на основі взаєморозуміння й поваги між людьми та групами різної етнічної, культурної, релігійної, мовної належності. Концепцію закріплює <b>«Біла книга з міжкультурного діалогу»</b> Ради Європи (2008): культурні традиції не можуть виправдовувати дискримінацію чи порушення прав людини.</p>
<h4>Гендерна різноманітність</h4>
<p><b>Біологічна стать</b> — сукупність біологічних відмінностей (репродуктивні функції, анатомія, фізіологія); її не обирають. <b>Гендер</b> (термін увійшов у науковий обіг наприкінці 1970-х) — змодельована суспільством система цінностей, норм і характеристик «чоловічої» та «жіночої» поведінки, ролей і стосунків. Гендер — підсумок соціалізації.</p>
<p>Біологічні відмінності сталі, а гендерні — змінюються історично:</p>
<ul><li><b>патріархальне суспільство</b> — жінка повністю залежна від чоловіків;</li>
<li><b>індустріальне</b> — публічна сфера чоловіча, приватна (дім, діти) — жіноча;</li>
<li><b>постіндустріальне</b> — вирівнювання прав і можливостей, рух до <b>гендерного балансу</b>.</li></ul>
<p><b>Симона де Бовуар</b> («Друга стать»): <i>«Жінкою не народжуються, нею стають»</i>.</p>
<p><b>Рівність</b> — основа свободи, справедливості та миру: кожен, незалежно від віку, статі, релігійної чи етнічної належності, має рівні права.</p>`,

// 21 Ефективна комунікація (§17)
{info:`<p><b>Спілкування</b> — процес взаємодії між людьми, під час якого відбувається обмін діяльністю, інформацією, досвідом, цінностями, навичками. Буває <b>прямим</b> (безпосередній контакт) і <b>опосередкованим</b> (через книжки, мистецтво — з просторово-часовою дистанцією).</p>
<ul><li><b>Формальне</b> — регламентоване нормами, ролі визначені (учитель — учень, керівник — підлеглий).</li>
<li><b>Ділове</b> — залежить від довіри, ділових якостей, інтересів партнерів.</li></ul>
<p>Основний засіб спілкування — <b>мова</b> (функції: відтворювальна, пізнавальна, комунікативна, культурно-творча). Види спілкування: зовнішнє, внутрішнє, невербальне, письмове, усне, діалогічне, монологічне.</p>
<h4>Культура спілкування</h4>
<p><b>Культура спілкування</b> — сукупність загальноприйнятих норм поведінки (етикет, хороші манери). Складники: <b>культура говоріння</b> (логічність, лаконічність, логічні наголоси й паузи) і <b>культура слухання</b>.</p>
<p><b>Активне слухання</b> — техніка підтримки співрозмовника. <b>Варто:</b> сидіти обличчям, контакт очей, кивати, ставити уточнювальні запитання («Ви маєте на увазі…?»). <b>Не варто:</b> давати поради, змінювати тему, оцінювати, перебивати, розповідати про власний досвід.</p>
<h4>Комунікація</h4>
<p><b>Комунікація</b> — процес обміну інформацією між двома чи більше людьми. Спілкування — міжособистісна взаємодія, комунікація — інформаційний обмін. <b>Комунікативність</b> — здатність сприймати й передавати інформацію, будувати мережу контактів.</p>
<p><b>Елементи комунікації:</b> комуніканти, ситуація, тексти, мотиви й мета, процес передавання.</p>

<tr><td>Вербальна</td><td><b>монолог</b> (говорить один), <b>діалог</b> (двоє, по черзі — висока форма спілкування), <b>полілог</b> (троє й більше)</td></tr></table>
<p>Невербальна комунікація — «дзеркало» емоцій. Навички успішного спілкування: розуміти інших, адекватно реагувати на критику, висловлювати думку, толерантність, компроміс, ведення переговорів, розв'язання конфліктів.</p>`,

// 22 Стереотипи та упередження (§18)
{info:`<p><b>Стереотип</b> — усталена, стандартна, часто спрощена думка про соціальні групи чи окремих людей як їхніх представників; має емоційне забарвлення й стійкість. Стереотип схожий на айсберг: видно лише 1/10. Термін у цьому значенні вперше вжив американський журналіст <b>Волтер Ліппман</b> («Громадська думка», 1922).</p>
<p>Стереотипи не формуються з власного досвіду — їх переймають від рідних, знайомих, мас-медіа, часто непомітно. Вони спрощують складні явища й впливають на поведінку, судження і навіть суспільні події.</p>
<h4>Види стереотипів</h4>
<ul><li><b>Професійні</b> — узагальнені образи представників професій (охоронець — «широкоплечий мовчазний красень»).</li>
<li><b>Фізіогномічні</b> — уявлення про зв'язок зовнішності з характером.</li>
<li><b>Етнічні</b> — уявлення про національний характер: <b>автостереотип</b> (уявлення етносу про себе) і <b>гетеростереотип</b> (образ іншого етносу). Негативні етнічні стереотипи використовують для пропаганди расизму й ксенофобії (антисемітська пропаганда в Німеччині 1920–30-х рр. призвела до Голокосту), в інформаційних війнах і чорному піарі.</li>
<li><b>Гендерні</b> — установки щодо місця чоловіка й жінки (стереотип «жінка — лише для дому й дітей»).</li>
<li>Також: групові, державні, регіональні, релігійні, расові, соціальні, політичні.</li></ul>
<p>Стереотипи часто використовують у <b>рекламі</b> та масовій комунікації, бо вони прискорюють сприйняття.</p>
<h4>Забобони та упередження</h4>
<p><b>Забобони</b> — помилкові переконання, віра в надприродні сили, що впливають на події; пережитки минулого, що передаються з покоління в покоління. Звільнитися від них допомагає пошук правильних пояснень явищ.</p>
<p><b>Упередження</b> — несправедлива, хибна думка про когось чи щось, сформована заздалегідь, без ознайомлення; антипатія, заснована на стереотипах. Людина зазвичай не усвідомлює своєї упередженості. Боротися з упередженнями допомагають ситуації <b>співпраці та взаємодії</b>.</p>
<p><b>Як долати стереотипи:</b> критично ставитися до нав'язаних думок, перевіряти інформацію з різних джерел, оцінювати кожну людину як окрему особистість за її моральними й професійними якостями.</p>`,

// 23 Дискримінація (§19)
{info:`<p><b>Дискримінація</b> — навмисне обмеження або позбавлення прав певних категорій громадян за расовою чи національною належністю, політичними або релігійними переконаннями, статтю, віком, мовою, майновим станом тощо. Вона порушує принцип рівності, принижує гідність, ізолює людей від суспільного життя.</p>
<table class="tbl"><tr><th>Форма дискримінації</th><th>Суть</th></tr>
<tr><td><b>Правова</b></td><td>закріплена в законах; долається зміною законів</td></tr>
<tr><td><b>Неофіційна (звичаєва)</b></td><td>вкорінена в звичаях і стереотипах; долається зміною свідомості спільноти</td></tr>
<tr><td><b>Пряма (відкрита)</b></td><td>без об'єктивних причин принижує особу й протиставляє її суспільству</td></tr>
<tr><td><b>Непряма (прихована)</b></td><td>за певних умов одна група опиняється в гірших умовах, ніж інша</td></tr></table>
<p>Приклад — дискримінація людей з інвалідністю (≈10 % населення планети). 3 грудня — Міжнародний день людей з інвалідністю (ООН, з 1992 р.).</p>
<p><b>Інклюзія</b> — політика й процес, що забезпечують участь і рівні можливості в соціальному житті й навчанні для всіх, незалежно від фізичних чи психологічних особливостей. Цінності інклюзії: рівність («не всі однакові, але всі рівноцінні»), об'єктивність, справедливість. Протилежні підходи: ексклюзія (виключення), сегрегація (відокремлення), інтеграція (зближення).</p>
<h4>Расизм і ксенофобія</h4>
<p><b>Расизм</b> — сукупність антинаукових концепцій про фізичну й психічну нерівноцінність рас на «вищі» та «нижчі». Теоретик — Ж.-А. Гобіно (сер. XIX ст.). Наука визнає лише одну расу — <b>людську</b>.</p>
<p><b>Ксенофобія</b> — нетерпимість чи неприязнь до чужого, незнайомого. Види: расова й етнічна (антисемітизм, сінофобія), релігійна (ісламофобія, юдофобія), за соціальними ознаками: <b>мігрантофобія</b>, <b>гандикапізм</b> (щодо людей з інвалідністю), <b>ейджизм</b> (за віком), <b>сексизм</b> (за статтю).</p>
<h4>Захист від дискримінації</h4>
<ul><li>юридичні дії; освітні програми; діяльність громадянського суспільства;</li>
<li>Загальна декларація прав людини (ст. 1, 2, 7); Міжнародна конвенція про ліквідацію всіх форм расової дискримінації (1965); конвенції про дискримінацію жінок, права людей з інвалідністю; директиви ЄС; <b>Європейська комісія проти расизму та нетерпимості</b> (Рада Європи, 1993).</li></ul>
<p><b>Толерантність</b> — моральна якість, що виявляється в повазі до інтересів, почуттів, поглядів інших людей. За <b>Декларацією принципів толерантності ЮНЕСКО (1995)</b>, толерантність — «гармонія в різноманітності». «Золоте правило» моралі («не роби іншим того, чого не бажаєш собі») є в усіх світових релігіях.</p>`,

// 24 Конфлікти (§20)
{info:`<p><b>Конфлікт</b> — зіткнення сторін, поглядів, сил. В основі — суперечність, яку сторони усвідомлюють як значущу. Об'єктивна основа — <b>конфліктна ситуація</b> (суперечність інтересів і потреб).</p>
<p><b>Причини:</b> соціально-політичні та економічні; соціально-демографічні (стать, вік, етнос); соціально-психологічні (лідерство, групова думка); індивідуально-психологічні (темперамент, характер). Конфлікт має й <b>позитивну функцію</b>: сигналізує про проблему й допомагає її розв'язати. За <b>Г. Зіммелем</b>, негострі конфлікти сприяють згуртованості суспільства.</p>
<p><b>Групи конфліктів:</b> конфлікт <b>цілей</b>, конфлікт <b>пізнання</b> (різні погляди на проблему), <b>емоційний</b> конфлікт.</p>
<p><b>Рівні:</b> внутрішньоособистісний; міжособистісний; між особою та групою; міжгруповий (міжетнічні, міжконфесійні).</p>
<h4>Фази розвитку конфлікту</h4>
<ol><li><b>Латентна (прихована)</b> — стриманість, уникання; часто досить однієї розмови.</li>
<li><b>Демонстративна</b> — відкрите протиставлення інтересів, взаємні звинувачення.</li>
<li><b>Агресивна</b> — бажання дошкулити, пошук сторонньої підтримки.</li>
<li><b>Батальна</b> — відкрита війна, мета — завдати максимальної шкоди.</li></ol>
<p><b>Політичний конфлікт</b> — протиборство соціально-політичних сил за владу та її перерозподіл. З лютого 2014 р. триває збройна агресія Росії проти України («гібридна війна»), з 24 лютого 2022 р. — повномасштабна війна.</p>
<h4>Моделі поведінки в конфлікті</h4>
<table class="tbl"><tr><th>Модель</th><th>Суть</th></tr>
<tr><td><b>Співпраця</b></td><td>виграш обох сторін через переговори</td></tr>
<tr><td><b>Боротьба (суперництво)</b></td><td>довести свою правоту будь-якою ціною</td></tr>
<tr><td><b>Консенсус</b></td><td>загальна згода без принципових заперечень</td></tr>
<tr><td><b>Компроміс</b></td><td>взаємні поступки</td></tr>
<tr><td><b>Пристосування</b></td><td>одна сторона приймає рішення іншої</td></tr>
<tr><td><b>Ухиляння</b></td><td>відмова розв'язувати конфлікт (проблема може поглибитися)</td></tr></table>
<p><b>Кроки подолання:</b> знайти причини → проаналізувати свої емоції → зрозуміти інтереси сторін → обрати модель поведінки → запропонувати рішення → втілити його.</p>
<p><b>Переговори</b> — пошук прийнятних для всіх рішень. <b>Медіація</b> — процес, під час якого сторони зустрічаються за участі нейтральної третьої сторони — <b>медіатора</b>. Типи посередників: третейський суддя, арбітр, посередник, помічник, спостерігач. Медіація дає змогу бути почутим, учить слухати й поважати інших, дає тривкі результати.</p>`,

// 27 Демократична держава (§21)
{info:`<p><b>Демократія</b> (грец.) — «народовладдя». А. Лінкольн: «правління народу, обране народом і для народу». Демократичний режим найповніше забезпечує права людини.</p>
<h4>Принципи демократії</h4>
<ol><li><b>Політична свобода</b> — право народу визначати й змінювати конституційний лад.</li>
<li><b>Рівноправність громадян</b> — рівність перед законом і судом.</li>
<li><b>Виборність органів влади</b> і постійний зв'язок із населенням; змінюваність посадовців.</li>
<li><b>Поділ влади</b> на законодавчу, виконавчу, судову — щоб запобігти узурпації (ст. 6 Конституції України); система стримувань і противаг.</li>
<li><b>Рішення більшістю з дотриманням прав меншості.</b></li>
<li><b>Плюралізм</b> — багатоманітність думок, партій, об'єднань.</li></ol>
<p><b>Демократичні інститути</b> — юридично оформлені елементи влади для здійснення народовладдя: вибори, референдум, народне обговорення, депутатський запит, слухання, парламентські комітети.</p>
<p><b>Цінності демократії:</b> людська гідність, свобода совісті, свобода слова, приватність, моральна автономія, соціальний порядок, конституціоналізм, громадянськість, компетентність і відповідальність громадянина.</p>
<h4>Форми демократії</h4>
<ul><li><b>Пряма</b> — громадяни самі ухвалюють рішення (народні збори, референдум); ефективна на місцевому рівні.</li>
<li><b>Представницька</b> — громадяни передають повноваження обраним представникам; зручна для великих держав.</li></ul>
<p><b>Конституція</b> — основний закон держави: визначає устрій, гарантує права людини, обмежує владу. <b>Конституціоналізм</b> — верховенство конституції над усіма іншими актами.</p>
<h4>Суверенітет</h4>
<ul><li><b>Суверенітет народу</b> — народ є джерелом і носієм влади (ст. 5 Конституції України).</li>
<li><b>Суверенітет держави</b> — верховенство на своїй території та незалежність у міжнародних відносинах (не означає вседозволеності: окупація інших держав заборонена).</li>
<li><b>Суверенітет нації</b> — право нації на вільний розвиток і політичне самовизначення.</li></ul>
<p>Держава може бути суверенною, але тоталітарною — тоді народ позбавлений суверенітету. Україна поєднує суверенітет держави, нації та народу.</p>`,

// 28 Вибори (§22)
{info:`<p>Демократія — це і <b>захист прав людини</b>, і <b>процедури</b> ухвалення рішень: публічне обговорення, змагальність, делегування повноважень, голосування, вибори.</p>
<p><b>Вибори</b> — висунення спільнотою шляхом голосування одного чи групи представників для виконання громадських функцій. Голосуючи, громадянин ніби тимчасово передає свою частку влади. Вибори формують правлячу більшість і опозицію, дають змогу контролювати владу.</p>
<h4>Виборче право</h4>
<ul><li><b>Активне</b> — право обирати (бути виборцем).</li>
<li><b>Пасивне</b> — право бути обраним.</li></ul>
<p><b>Виборчий ценз</b> — законодавчі умови, яким має відповідати особа, щоб обирати чи бути обраною: громадянство, вік, місце проживання тощо. Недієздатність установлює лише суд. Обмеження пасивного права: кількість строків, несумісність посад.</p>
<p><b>Принципи виборчого права в Україні</b> (ст. 71 Конституції): вибори є <b>вільними</b> й відбуваються на основі <b>загального, рівного і прямого</b> виборчого права шляхом <b>таємного</b> голосування. Право голосу мають громадяни, які досягли 18 років.</p>
<h4>Типи виборів</h4>
<ul><li>за предметом: президентські, парламентські, місцеві;</li>
<li>за причиною: чергові, позачергові, додаткові;</li>
<li>за способом: прямі (обирають громадяни) й опосередковані (обирає колегіальний орган).</li></ul>
<h4>Виборчі системи</h4>
<table class="tbl"><tr><th>Система</th><th>Суть</th></tr>
<tr><td><b>Мажоритарна</b></td><td>перемагає кандидат, що набрав установлену більшість голосів в окрузі; стабільні уряди, виборець знає свого представника</td></tr>
<tr><td><b>Пропорційна</b></td><td>мандати розподіляють пропорційно голосам за партії; списки бувають «жорсткі» (порядок визначає партія) або з преференціями (виборець впливає на порядок)</td></tr>
<tr><td><b>Змішана</b></td><td>частина мандатів — за мажоритарним, частина — за пропорційним принципом</td></tr></table>
<h4>Референдум</h4>
<p><b>Референдум</b> — спосіб ухвалення громадянами шляхом голосування законів та інших рішень з важливих питань загальнодержавного чи місцевого значення. Рішення всеукраїнського референдуму мають вищу юридичну силу й не потребують затвердження.</p>
<p><i>«Погану владу обирають хороші громадяни, які не голосують»</i> (Дж. Дж. Нейтан).</p>`,

{info:`<p><b>Політична партія</b> — зареєстроване згідно із законом добровільне об'єднання громадян — прихильників певної загальнонаціональної програми суспільного розвитку, що сприяє формуванню й вираженню політичної волі громадян і бере участь у виборах. Партії — інструмент залучення громадян до політики; належать до недержавних організацій громадянського суспільства.</p>
<p>Статус партій регулюють <b>ст. 36–37 Конституції</b> та Закон «Про політичні партії в Україні». В Україні партії мають <b>всеукраїнський статус</b>, діють на основі статуту, рівні перед законом. Багатопартійність можлива завдяки <b>політичному плюралізму</b>.</p>
<h4>Опозиція</h4>
<p><b>Опозиція</b> — організоване об'єднання громадян, що протидіє владі, критикує її, пропонує альтернативи. Опозиція — регулятор і контролер влади, запобігає зосередженню влади в одних руках. Її існування можливе завдяки принципу <b>урахування більшістю прав меншості</b>, який гарантують конституція, незалежний суд, представництво в парламенті.</p>
<h4>Громадські організації</h4>
<p><b>Громадська організація</b> — об'єднання громадян для задоволення й захисту законних соціальних, економічних, творчих, вікових, національно-культурних, спортивних та інших спільних інтересів. На відміну від партій, створюється з <b>неполітичною метою</b>. Статус регулює Закон України «Про громадські об'єднання».</p>
<p><b>Ознаки:</b> суспільний характер; добровільність; спільність інтересів; мета — реалізація прав і свобод; легальність; <b>некомерційний характер</b>; досягнення мети спільними законними діями учасників.</p>
<p><b>Принципи:</b> добровільність, самоврядність, вільний вибір території діяльності, рівність перед законом, відсутність майнового інтересу членів, прозорість, публічність.</p>
<p><b>Види:</b> економічні, соціальні, культурні, екологічні, освітні та ін. Приклади: «Справа Громад» (допомога армії та громадам), Рух ЧЕСНО (контроль за політиками). Громадські організації — основа громадянського суспільства, «<b>третій сектор</b>».</p>`,

// 30 Громадянське суспільство (§24)
{info:`<p><b>Громадянське суспільство</b> — тип взаємодії та соціальної організації вільних особистостей, що складається з громадських рухів, об'єднань, організацій і партій, які втілюють громадську думку. Основа — <b>солідарність</b> людей, що об'єднуються для розв'язання проблем і захисту своїх прав.</p>
<p><b>Інститути громадянського суспільства:</b> громадські організації й рухи, незалежні ЗМІ, громадська думка, вибори й референдум і, найголовніше, <b>вільні й незалежні громадяни</b>.</p>
<p><b>Функції:</b> врегулювання конфліктів і протестів, накопичення <b>соціального капіталу</b>, розвиток солідарності й кооперації, захист приватних і суспільних інтересів. Держава втручається в його справи лише в разі порушення закону.</p>
<h4>Умови існування</h4>
<ul><li>засоби й центри комунікації (мас-медіа, місця зібрань) → громадська думка;</li>
<li>вільні й рівні особистості, чиї права захищені законом;</li>
<li>незалежні від держави добровільні об'єднання та партії;</li>
<li>діяльність, зорієнтована на громадські інтереси, співпраця й довіра;</li>
<li><b>громадянська культура</b> — участь, довіра, толерантність, здатність до компромісу.</li></ul>
<h4>Громадянське суспільство в Україні</h4>
<p>До 1939 р. в Західній Україні діяли товариства «Просвіта», «Рідна школа», «Дністер», «Сільський господар», жіночий рух. За радянської доби — дисидентський рух і «самвидав». Відродження — з перебудови; важливими стали <b>Конституція 1996 р.</b>, закони про громадські об'єднання та пресу.</p>
<p><b>Ілько Кучерів</b> заснував фонд «Демократичні ініціативи» (1992), перший незалежний Національний екзитпол (1998): <i>«Функцію вартових демократії має виконувати громадянське суспільство»</i>. Справу продовжила соціологиня <b>Ірина Бекешкіна</b>.</p>
<p><b>Правова держава</b> — форма організації влади на принципах верховенства права; не втручається у сферу громадянського суспільства. Громадянське суспільство й правова держава <b>взаємопов'язані</b>: одне неможливе без іншого.</p>`,
terms:[["Громадянське суспільство","сукупність вільних громадян і незалежних від держави об'єднань, що відстоюють свої інтереси"],["Соціальний капітал","довіра, зв'язки й норми співпраці між людьми"],["Громадянська культура","культура участі, довіри, толерантності й компромісу"],["Правова держава","держава, що діє на засадах верховенства права"],["Громадська думка","сукупність поглядів суспільства на важливі питання"]],

// 31 Громада (§25)
{info:`<p><b>Громада</b> — об'єднання людей, які проживають в одній місцевості, мають спільні інтереси та завдання; скріплена взаємозв'язками, має власну структуру, цінності й норми. Люди ідентифікують себе зі своєю «малою батьківщиною».</p>
<p><b>Територіальна громада</b> охоплює всіх мешканців незалежно від віку, громадянства, національності. Членом стають за народженням або прибувши на проживання. Брати повну участь у вирішенні справ громади (обирати раду й голову, голосувати на місцевому референдумі) можуть громадяни України з 18 років.</p>
<h4>Місцеве самоврядування</h4>
<p><b>Місцеве самоврядування</b> — форма публічної влади, відмінна від державної, що втілює місцеві інтереси громад; один із головних елементів демократії. Міжнародний стандарт — <b>Європейська хартія місцевого самоврядування</b> (Рада Європи, 1985); Україна визнала її, вступивши до Ради Європи в листопаді 1995 р.</p>
<p><b>Риси:</b> діє в межах закону; має власні джерела фінансування; органи — виборні; ухвалені акти обов'язкові на території громади; населення бере участь у будь-яких законних формах.</p>
<p><b>Принципи:</b> народовладдя, законність, гласність, колегіальність, поєднання місцевих і державних інтересів, виборність, самостійність (правова, організаційна, фінансова), підзвітність громаді, державна підтримка, судовий захист.</p>
<h4>Роль громади</h4>
<p>У громаді людина входить у суспільство, виконує соціальні ролі, формує цінності, <b>громадську ідентичність</b> і відповідальність за спільну справу. Громада розв'язує транспортні, екологічні, освітні проблеми, проблеми дозвілля — забезпечує демократію на місцевому рівні.</p>
<p><b>Алексіс де Токвіль</b> («Демократія в Америці»): <i>«Саме у громаді полягає сила свободи народу»</i>; громадські інститути для свободи — те саме, що початкові школи для науки.</p>`,

// 32 Захист громадою своїх прав (§26)
{info:`<p>Територіальна громада <b>самостійно</b> вирішує питання місцевого значення через <b>громадські слухання, місцеві референдуми, загальні збори, місцеві ініціативи</b>. За ініціативою жителів створюються <b>органи самоорганізації населення</b> (будинкові, вуличні, квартальні комітети).</p>
<p><b>Питання громади:</b> дороги, водогони, мости, зелені зони, довкілля, школи, заклади охорони здоров'я, зони відпочинку, дитячі й спортивні майданчики, допомога людям похилого віку, дозвілля.</p>
<p><b>Органи:</b> сільські, селищні, міські ради з виконавчими комітетами; очолює голова. <b>Центри місцевої активності</b> вивчають потреби громади, інформують, підтримують активних людей.</p>
<p>Право на участь у місцевому самоврядуванні й звернення закріплює <b>ст. 40 Конституції України</b>: громадяни можуть подавати індивідуальні й колективні письмові звернення до органів самоврядування, які зобов'язані дати обґрунтовану відповідь у встановлений строк.</p>
<h4>Громадська участь і врядування</h4>
<p><b>Громадська участь</b> — безперервний двонапрямний процес взаємодії громадян з органами самоврядування: визначення пріоритетів, участь у підготовці рішень, контроль.</p>
<p><b>Врядування</b> — прозорий процес ухвалення рішень із залученням усіх членів громади. <b>Управління</b> — впровадження вже ухвалених рішень.</p>
<p><b>Елементи доброго врядування (ПРООН):</b> участь, стратегічне бачення, верховенство права, прозорість, відповідальність, орієнтація на консенсус, ефективність і результативність, підзвітність.</p>
<h4>Електронна демократія</h4>
<p><b>Електронне врядування</b> та <b>е-демократія</b> використовують інформаційні технології для комунікації «громадянин — держава»: електронні петиції, публічні закупівлі (тендери), відкриті дані, електронні сервіси, <b>бюджет участі</b> (громадський бюджет), онлайн-запити до влади.</p>`,

// 33 Громадянська участь (§27)
{info:`<p><b>Участь у житті суспільства</b> — соціальна діяльність, що забезпечує життєздатність суспільства. Перший досвід — у сім'ї, далі — у шкільному самоврядуванні, волонтерстві, дитячих організаціях.</p>
<h4>Традиційні форми громадської участі</h4>
<ul><li>регулярна участь у виборах;</li><li>діяльність у громадських організаціях;</li><li>розв'язання соціально значущих проблем;</li><li>контакти з місцевою владою щодо конкретних проблем;</li><li>меценатство й підтримка благодійних організацій.</li></ul>
<p><b>Активна громадянська позиція</b> — усвідомлено обрана життєва позиція, що ґрунтується на громадянських цінностях: готовність брати участь у суспільно-політичному житті, виконувати обов'язки, нести відповідальність, захищати Батьківщину.</p>
<p><b>Культура громадянськості</b> — сприйняття влади не як предмета боротьби, а як об'єкта впливу для захисту прав громадян; розуміння устрою держави та політичних процедур.</p>
<p>У кризові періоди поширюються <b>форми протесту</b>: мітинги, демонстрації, страйки, бойкоти, громадянська непокора. Яскраві приклади в Україні — <b>Помаранчева революція</b> (2004) та <b>Революція Гідності</b> (2013–2014).</p>
<h4>Меценатство і волонтерство</h4>
<p><b>Меценати</b> — заможні покровителі науки, освіти, мистецтва. <b>Ліга українських меценатів</b> (12 жовтня 1995 р., ініціатор — <b>Петро Яцик</b>); премії ім. В. Симиренка та Є. Чикаленка. Діє Фонд Богдана Гаврилишина.</p>
<p><b>Волонтер</b> — той, хто добровільно й безоплатно бере участь у суспільних справах. Принципи волонтерства: законність, гуманність, рівність, добровільність, безоплатність, безкорисливість, неприбутковість. Після 24 лютого 2022 р. волонтерський рух в Україні став масовим. <b>5 грудня</b> — Міжнародний день волонтера.</p>
<p><i>«Існування демократії без істинних демократів є неможливим»</i> (Вацлав Гавел).</p>`,
terms:[["Громадянська участь","діяльність громадян, що впливає на життя спільноти та суспільства"],["Активна громадянська позиція","свідома готовність брати участь у суспільному житті й нести відповідальність"],["Культура громадянськості","розуміння устрою держави й сприйняття влади як об'єкта впливу громадян"],["Меценат","заможний покровитель науки, освіти, мистецтва"],["Волонтер","людина, що добровільно й безоплатно допомагає суспільству"]],

// 34 Школа — простір демократії (§28)
{info:`<p><b>Шкільна громада</b> — об'єднання педагогів, учнів, батьків і представників місцевої громади, які взаємодіють заради спільної мети. Школа — модель відносин, що відбуваються в суспільстві: тут учаться спілкуватися, ухвалювати рішення, відстоювати позицію.</p>
<p>Умова успіху — <b>сприятлива атмосфера</b>: взаємоповага, колегіальне ухвалення рішень, спільна розробка правил на засадах поваги, рівності й недискримінації, прозора комунікація.</p>
<h4>Врядування і управління школою</h4>
<ul><li><b>Врядування (governance)</b> — відкритість, переговори, переконання, участь усіх у рішеннях.</li>
<li><b>Управління (management)</b> — інструкції й накази на основі законної влади.</li></ul>
<p>Для школи краща форма — <b>врядування</b>: учні свідомо дотримуються правил, які самі виробили; менше конфліктів; реальна демократична участь. Основні правила закріплює <b>Статут школи</b>.</p>
<h4>Шкільне самоврядування</h4>
<p>Передбачене Законом України «Про освіту»; є прототипом самоврядування суспільства. Види: <b>учнівське</b>, <b>учительське</b> (педагогічна, методична рада), <b>батьківське</b> (батьківський комітет, збори).</p>
<p><b>Принципи учнівського самоврядування:</b> добровільність, партнерство, рівність, демократичність, прозорість, виборність, колегіальність, відповідальність, співпраця, гласність.</p>
<p><b>Моделі:</b> загальні збори, конференція, рада; «шкільна республіка» з президентом чи прем'єр-міністром; парламент на чолі зі спікером. Умови ефективності: зацікавленість громади, реальні права, чітка структура, документи (статут, положення), ініціатива знизу. Сучасна форма — <b>електронне самоврядування онлайн</b>.</p>
<h4>Партнерство школи й громади</h4>
<p><b>Партнерство</b> — взаємовигідні відносини школи, учнів, учителів і громади для спільного розв'язання проблем. Засади: взаємовигідність, прозорість, волонтерство, двостороннє спілкування, чесність, повага, рівність. Учні можуть брати участь у <b>молодіжній раді громади</b>, а школа — стати освітнім і громадським центром.</p>`,
terms:[["Шкільна громада","об'єднання учнів, педагогів, батьків і представників громади"],["Шкільне самоврядування","участь учасників освітнього процесу в управлінні справами школи"],["Статут школи","документ, що визначає засади устрою та діяльності школи"],["Партнерство","взаємовигідна співпраця школи й громади"],["Молодіжна рада","дорадчий орган молоді при органах місцевого самоврядування"]],

// 35 Дитячі й молодіжні об'єднання (§29)
{info:`<p>Право дитини на <b>свободу асоціацій</b> гарантує Конвенція ООН про права дитини. Ст. 23 Закону України «Про охорону дитинства» надає дітям право об'єднуватися в дитячі й молодіжні громадські організації, якщо їхня діяльність не суперечить Конституції й законам, не порушує прав інших і не шкодить здоров'ю та моралі.</p>

<tr><td><b>Дитяча</b></td><td>6–18 років</td><td>реалізація й захист прав, розвиток здібностей, соціальне становлення</td></tr></table>

<p>За Законом «Про основні засади молодіжної політики» (ст. 12), молодіжні й дитячі об'єднання мають право отримувати <b>гранти</b> на молодіжні проєкти, брати участь у молодіжній політиці, створювати молодіжні центри, делегувати представників до <b>молодіжних рад</b> тощо.</p>

{info:`<p><b>Медіа</b> — канали й інструменти передачі та збереження інформації. <b>Мас-медіа</b> — засоби одночасної передачі інформації великій аудиторії: радіо, телебачення, преса, кіно, фото, відео, інтернет; технічні засоби створення, тиражування й поширення інформації.</p>
<p><b>ЗМІ і мас-медіа:</b> термін «ЗМІ» походить від радянського «засоби масової інформації та пропаганди», що фінансувалися з бюджету й насаджували ідеологію без зворотного зв'язку. <b>Медіа</b> (від «медіум» — посередник) — посередники між аудиторією та редакціями й рекламодавцями; реклама дає їм фінансову, а отже, й політичну незалежність.</p>
<h4>Інформація</h4>
<p><b>Інформація</b> — будь-які відомості, створені людиною для передачі в часі чи просторі. Прийом, обмін і використання інформації — <b>інформаційний процес</b>; засвоєна інформація стає <b>знаннями</b>. <b>Інформація з обмеженим доступом</b> — державна таємниця, розголошення якої шкодить державі, суспільству чи особі.</p>
<p>Сьогодні важливіше не володіти інформацією, а <b>уміти відбирати корисну</b>, розрізняти маніпуляції й критично мислити. Дезінформація та інформаційний хаос породжують невпевненість і безсилля.</p>
<p><b>Соціальна інформація</b> ніколи не буває нейтральною. Її характеристики: кількість, цінність, зміст, об'єктивність, достовірність, точність, оперативність, надійність. <b>Масова комунікація</b> — передача соціальної інформації через мас-медіа; її ознаки — майже одночасна доставка й масовість аудиторії, що робить медіа дуже впливовими.</p>
<h4>Аудиторія і медіатекст</h4>
<p><b>Модель масової комунікації (Д. Мак-Квейл):</b> джерело → канал → повідомлення → користувач → ефект. <b>Аудиторія</b> — стійка сукупність людей зі спільними інформаційними потребами; розмір аудиторії визначає вплив медіа.</p>
<p><b>Медіатекст</b> — будь-яка продукція мас-медіа: статті, фото, радіо- і телепередачі, реклама, вебсторінка, блог, SMS. Медіатексти бувають інформаційні, комерційні, соціальні, пізнавальні, розважальні, мистецькі. Кожен містить <b>меседж</b> — ключову ідею — і використовує медійну мову (символи, зображення, світло, колір, звук, музику). Кожен медіатекст конструює власну «ідеальну аудиторію».</p>`,

<p><b>Методи рекламного впливу:</b> ствердні висловлювання без доказів; вибірковий підбір фактів; слогани; концентрація на кількох рисах; посилання на авторитетів («стоматологи рекомендують»); антиреклама; інтригуюча реклама; несемантичне маніпулювання (темп, інтонація, міміка).</p>
<h4>Громадська думка</h4>
